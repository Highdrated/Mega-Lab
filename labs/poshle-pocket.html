<!DOCTYPE html>
<html lang="en" data-theme="orbital">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8eaee">
<title>Poshle Pocket</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a26'/%3E%3Cpath d='M9 11l5 5-5 5M16 22h8' fill='none' stroke='%23e2b85c' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root, :root[data-theme="orbital"] {
  --bg: #e8eaee; --panel: #f7f7f4; --panel2: #eef0f2; --line: #d4d7dd; --text: #19202c; --muted: #5f6775;
  --accent: #c99a3b; --accent-ink: #19202c; --good: #3d7a52; --bad: #b4473b; --warn: #a87414;
  --term-bg: #141a26; --term-text: #ece6d2; --term-muted: #8b93a3; --term-accent: #e2b85c;
  --k-kw: #e2b85c; --k-str: #9fcf9a; --k-num: #e9a17c; --k-fn: #8fc1e8; --k-op: #c9cfdb;
}
:root[data-theme="verdant"] {
  --bg: #0e1712; --panel: #142019; --panel2: #1a281f; --line: #273b2e; --text: #e3e8df; --muted: #8ea091;
  --accent: #e0a23a; --accent-ink: #1a1206; --good: #86c27f; --bad: #e57a5f; --warn: #e0a23a;
  --term-bg: #09100c; --term-text: #f0e6cc; --term-muted: #7f907f; --term-accent: #e0a23a;
  --k-kw: #e0a23a; --k-str: #a6d49d; --k-num: #f0a688; --k-fn: #9cc8d8; --k-op: #c8d0c4;
}
:root[data-theme="walnut"] {
  --bg: #1b1511; --panel: #241c17; --panel2: #2c231d; --line: #3c3028; --text: #eee4d6; --muted: #a8998a;
  --accent: #c8734a; --accent-ink: #1b1511; --good: #a3b465; --bad: #e47561; --warn: #d9a441;
  --term-bg: #120e0b; --term-text: #f2e7d5; --term-muted: #8f8072; --term-accent: #d9a441;
  --k-kw: #d9a441; --k-str: #b8c47a; --k-num: #e8946e; --k-fn: #9fb9c9; --k-op: #d6cbbb;
}
:root {
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; transition: background .25s, color .25s; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; gap: 8px; height: 38px; }
.logo { font-family: var(--serif); font-size: 21px; letter-spacing: .01em; white-space: nowrap; }
.logo i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .14em; text-transform: uppercase; margin-left: 6px; vertical-align: 3px; }
.top .spacer { flex: 1; }
.chipbtn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.rail { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin: 6px 0 14px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.rail b { color: var(--text); font-weight: 600; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.screen { display: none; flex: 1; flex-direction: column; min-width: 0; }
.screen.on { display: flex; }
.sect { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.welcome { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--muted); margin-bottom: 10px; }
.welcome b { color: var(--text); }
.junie { width: 64px; height: 64px; object-fit: contain; }
.nextup { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; text-align: left; width: 100%; background: var(--term-bg); color: var(--term-text); border: 0; border-radius: 14px; padding: 14px 16px; min-height: 78px; }
.nextup small { display: block; font-family: var(--mono); font-size: 11px; color: var(--term-muted); letter-spacing: .1em; text-transform: uppercase; }
.nextup strong { display: block; font-family: var(--serif); font-size: 20px; font-weight: 500; margin-top: 3px; }
.nextup .go { font-family: var(--mono); color: var(--term-accent); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.path { display: grid; gap: 6px; }
.step { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; min-height: 52px; }
.step .n { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.step strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 16px; }
.step small { display: block; color: var(--muted); font-size: 12px; font-family: var(--mono); }
.step .st { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.step.done .st { color: var(--good); }
.step.cur { border-color: var(--accent); }
.step.cur .st { color: var(--accent); }
.step.locked { opacity: .45; }
.step.locked .n { color: var(--muted); }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qbtn { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; min-height: 74px; display: flex; flex-direction: column; justify-content: space-between; }
.qbtn strong { font-family: var(--serif); font-size: 17px; font-weight: 500; }
.qbtn small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.qbtn:disabled { opacity: .45; }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.links a, .links button { text-align: center; text-decoration: none; padding: 10px 6px; font-size: 13px; color: var(--text); border-radius: 10px; border: 1px solid var(--line); background: none; }
.drillhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 28px; }
.drillhead .quit { justify-self: start; border: 0; background: none; color: var(--muted); padding: 4px 0; font-family: var(--mono); font-size: 12px; }
.drillhead .score { justify-self: end; }
.drillhead .score b { color: var(--text); }
.dots { display: flex; gap: 4px; margin: 6px 0 2px; }
.dots i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.dots i.good { background: var(--good); }
.dots i.bad { background: var(--bad); }
.dots i.on { background: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 8px; min-width: 0; }
.ticket { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); padding-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.ask { font-family: var(--serif); font-size: 18px; line-height: 1.35; margin-bottom: 8px; }
.code { background: var(--term-bg); color: var(--term-text); border-radius: 10px; padding: 11px 13px; font-family: var(--mono); font-size: 14px; line-height: 1.55; overflow-x: auto; white-space: pre; margin: 8px 0 0; -webkit-overflow-scrolling: touch; }
.code .kw, .built .kw { color: var(--k-kw); }
.code .st, .built .st { color: var(--k-str); }
.code .nu, .built .nu { color: var(--k-num); }
.code .fn, .built .fn { color: var(--k-fn); }
.out { margin-top: 6px; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; font-family: var(--mono); font-size: 14px; white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
.out::before { content: "output"; display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; font-family: var(--sans); font-weight: 600; }
.target { margin-top: 8px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.target pre { margin: 4px 0 0; font-size: 14px; color: var(--text); background: var(--panel2); border-radius: 8px; padding: 7px 10px; white-space: pre; overflow-x: auto; }
.blank { display: inline-block; min-width: 2.4em; border-bottom: 2px solid var(--term-accent); color: var(--term-accent); text-align: center; }
.choices { display: grid; gap: 8px; margin-top: 12px; }
.choice { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; font-family: var(--mono); font-size: 14px; white-space: pre; overflow-x: auto; min-height: 50px; }
.choice.err { font-style: italic; color: var(--bad); }
.choice.cmd { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.choice.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
.choice.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.choice:disabled { color: inherit; opacity: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; min-height: 46px; font-family: var(--mono); font-size: 15px; min-width: 52px; }
.chip.used { opacity: .25; }
.chip.good { border-color: var(--good); }
.chip.bad { border-color: var(--bad); }
.slot { min-height: 54px; border: 1px dashed var(--line); border-radius: 11px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; background: var(--panel2); }
.slot .ph { color: var(--muted); font-size: 13px; padding: 0 6px; }
.slot .chip { min-height: 40px; background: var(--term-bg); color: var(--term-text); border-color: var(--term-bg); font-size: 14px; }
.slot.good { border: 1px solid var(--good); }
.slot.bad { border: 1px solid var(--bad); }
.lines { display: grid; gap: 6px; margin-top: 10px; }
.lrow { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 8px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-family: var(--mono); font-size: 14px; white-space: pre; overflow-x: auto; min-height: 44px; }
.lrow .ln { font-size: 11px; color: var(--muted); text-align: right; }
.lrow.picked { opacity: .3; }
.lrow.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
.lrow.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.built { display: grid; gap: 4px; margin-top: 10px; min-height: 52px; border: 1px dashed var(--line); border-radius: 11px; padding: 6px; background: var(--panel2); }
.built .ph { color: var(--muted); font-size: 13px; padding: 10px 6px; }
.built .lrow { background: var(--term-bg); color: var(--term-text); border-color: var(--term-bg); min-height: 38px; padding: 6px 10px; }
.built .lrow .ln { color: var(--term-muted); }
.built.good { border: 1px solid var(--good); }
.built.bad { border: 1px solid var(--bad); }
.acts { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 12px; }
.btn { height: 50px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .4; }
.fb { margin-top: 12px; font-size: 14px; line-height: 1.55; display: none; border-top: 1px solid var(--line); padding-top: 10px; }
.fb.on { display: block; }
.fb .verdict { font-weight: 700; }
.fb .verdict.good { color: var(--good); }
.fb .verdict.bad { color: var(--bad); }
.fb code, .lesson code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: .93em; }
.fb .fix { margin-top: 6px; }
.fb .fix .code { margin-top: 4px; }
.fbrow { display: grid; grid-template-columns: 1fr 60px; gap: 8px; align-items: start; }
.fbrow img { width: 60px; height: 60px; object-fit: contain; }
.next { margin-top: auto; height: 54px; border-radius: 11px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; display: none; }
.next.on { display: block; }
.spacer16 { height: 14px; }
.lesson { font-size: 15px; line-height: 1.6; }
.lesson h3 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 2px 0 6px; }
.lesson .kicker { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
.lesson ul { padding-left: 18px; margin: 6px 0; }
.lesson li { margin: 4px 0; }
.lhead { display: grid; grid-template-columns: 1fr 56px; gap: 8px; align-items: start; }
.lhead img { width: 56px; height: 56px; object-fit: contain; }
.flow { display: flex; flex-direction: column; align-items: stretch; gap: 0; margin: 12px 0 4px; font-family: var(--mono); font-size: 12.5px; }
.fbox { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; text-align: center; }
.farrow { text-align: center; color: var(--accent); line-height: 1; padding: 3px 0; font-size: 14px; }
.fdec { align-self: center; border: 1.5px solid var(--accent); border-radius: 999px; padding: 6px 16px; text-align: center; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.fsplit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.fsplit > div { display: flex; flex-direction: column; gap: 3px; }
.fsplit span { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; text-align: center; }
.fsplit .y span { color: var(--good); }
.fsplit .n span { color: var(--bad); }
.floop { border: 1px dashed var(--accent); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.floop .lbl { display: flex; justify-content: space-between; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.trace { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; margin: 10px 0 2px; }
.trace td, .trace th { padding: 6px 5px; border-bottom: 1px solid var(--line); text-align: left; }
.trace th { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.chk { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.chk .q { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 600; }
.wnote { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.wnote.good { color: var(--good); }
.wnote.bad { color: var(--bad); }
.lessonnav { margin-top: auto; padding-top: 16px; display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.result { text-align: center; padding-top: 10px; }
.result img { width: 110px; height: 110px; object-fit: contain; }
.result .num { font-family: var(--serif); font-size: 60px; line-height: 1.1; }
.result .lbl { color: var(--muted); font-size: 13px; }
.result .line { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result .line div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; }
.result .line b { display: block; font-family: var(--mono); font-size: 19px; }
.result .line span { font-size: 11px; color: var(--muted); }
.result .msg { margin-top: 14px; font-weight: 600; min-height: 1.4em; }
.result .msg.good { color: var(--good); }
.result .msg.bad { color: var(--warn); }
.result .actions { margin-top: 18px; display: grid; gap: 8px; }
.misses { margin-top: 14px; text-align: left; font-size: 13px; }
.misses .m { padding: 8px 0; border-bottom: 1px solid var(--line); }
.misses .m .code { font-size: 12px; margin-top: 4px; }
.misses .m b { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.notes { display: grid; gap: 6px; }
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 30px 10px; line-height: 1.6; }
.trace td.cur { outline: 2px solid var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 12%, var(--panel)); text-align: center; color: var(--accent); font-weight: 700; }
.trace td.good { color: var(--good); }
.trace td.bad { color: var(--bad); }
#tt td:first-child, #tt th:first-child { width: 96px; color: var(--muted); }
#tt td:not(:first-child), #tt th:not(:first-child) { text-align: center; }
.tprompt { font-size: 14px; margin-top: 10px; min-height: 1.5em; line-height: 1.5; }
.tprompt code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
.tprompt.bad { color: var(--bad); }
.chip.flash { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--panel)); }
.chip.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--term-bg); color: var(--term-text); padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 9; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="logo">Poshle<i>pocket</i></span>
    <span class="spacer"></span>
    <button class="chipbtn" id="themeBtn">orbital</button>
  </div>
  <div class="rail"><span id="rank">Cadet</span><div class="bar"><i id="xpbar"></i></div><span><b id="xp">0</b> xp · <b id="streak">0</b>d</span></div>

  <section class="screen on" id="home">
    <div class="welcome" id="welcome"><img class="junie" src="img/junie/junie-wave.webp" alt=""><div>No typing needed. Just tap <b>Continue</b>. Each lesson is a few short cards, then 5 tap questions. Get <b>4 of 5</b> right and the next lesson opens.</div></div>
    <button class="nextup" id="nextUp"></button>
    <div class="sect"><span>Quick</span></div>
    <div class="quick">
      <button class="qbtn" id="dailyBtn"><strong>Daily 10</strong><small id="dailySub">mistakes first, only what you know</small></button>
      <button class="qbtn" id="notesBtn"><strong>Notes</strong><small id="notesSub">reread any lesson</small></button>
    </div>
    <div class="sect"><span>Your path</span><span id="pathCount"></span></div>
    <div class="path" id="pathList"></div>
    <div class="links">
      <a href="poshle.html">Poshle</a>
      <a href="mscodex.html">Codex MS</a>
      <button id="offBtn">Save offline</button>
      <button id="resetBtn">Reset</button>
    </div>
  </section>

  <section class="screen" id="lesson">
    <div class="drillhead"><button class="quit" id="lessonBack">‹ path</button><span id="lessonPos"></span><span></span></div>
    <div class="dots" id="lessonDots"></div>
    <div class="card lesson" id="lessonBody"></div>
    <div class="lessonnav">
      <button class="btn" id="lessonPrev">‹ Back</button>
      <button class="btn main" id="lessonNext">Next ›</button>
    </div>
  </section>

  <section class="screen" id="drill">
    <div class="drillhead">
      <button class="quit" id="quitBtn">✕ end</button>
      <span id="count"></span>
      <span class="score">✓ <b id="ok">0</b></span>
    </div>
    <div class="dots" id="drillDots"></div>
    <div class="card" id="qcard"></div>
    <div class="spacer16"></div>
    <button class="next" id="nextBtn">Next ›</button>
  </section>

  <section class="screen" id="result">
    <div class="result">
      <img id="resImg" src="img/junie/junie-cheer.webp" alt="">
      <div class="num" id="resNum">0</div>
      <div class="lbl" id="resSub">correct</div>
      <div class="line">
        <div><b id="resAcc">0%</b><span>accuracy</span></div>
        <div><b id="resXp">+0</b><span>xp</span></div>
        <div><b id="resStreak">0</b><span>day streak</span></div>
      </div>
      <div class="msg" id="resMsg"></div>
      <div class="actions">
        <button class="btn main" id="againBtn">Again</button>
        <button class="btn" id="homeBtn">Back to path</button>
      </div>
      <div class="misses" id="misses"></div>
    </div>
  </section>

  <section class="screen" id="notes">
    <div class="drillhead"><button class="quit" data-home>‹ path</button><span>notes</span><span></span></div>
    <div class="notes" id="notesList"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const DATA = [{"id":"cmdlets","title":"Cmdlets and help","sub":"Verb-Noun, Get-Command, Get-Help, Get-Member","cards":[{"h":"Verb-Noun names","body":["Every cmdlet is `Verb-Noun`: first what to do, then what to do it to.","Approved verbs: `Get` reads, `Set` changes, `New` creates, `Remove` deletes, `Add` puts into.","So `Get-Mailbox` reads mailboxes and `Remove-MgUser` deletes a user."],"code":"(Get-Command Get-Date).Noun","out":"Date","flow":["Verb: what to do","Noun: what thing","Get-Mailbox"],"check":{"t":"predict","code":"(Get-Command Remove-Item).Verb","choices":["Remove","Item","Remove-Item"],"a":0,"why":"`.Verb` is the part before the dash."}},{"h":"Find it: Get-Command","body":["Don't know the name? Search with `*` as a wildcard.","`-Noun *User*` finds every cmdlet with User in its noun.","`-Verb Get` keeps only the Get cmdlets."],"code":"Get-Command -Noun *Mailbox*","out":"(a list of every cmdlet with Mailbox in its noun)","check":{"t":"predict","code":"(Get-Command Get-ChildItem).Noun","choices":["Get-ChildItem","ChildItem","Get"],"a":1,"why":"`.Noun` is the part after the dash."}},{"h":"Read the manual: Get-Help","body":["`Get-Help Name -Examples` shows only ready-to-copy examples.","`-Full` shows everything, including every parameter.","Help looks thin? Run `Update-Help` once."],"code":"Get-Help Get-Date -Examples","out":"(examples of how to use Get-Date)","flow":["Need a cmdlet?","Get-Command -Noun *word*","Get-Help Name -Examples","Try it"]},{"h":"Look inside: Get-Member","body":["Pipe anything into `Get-Member` to see its type, properties and methods.","Properties are data: `.Length`. Methods are actions with `()`: `.ToUpper()`."],"code":"$m = 'hi' | Get-Member\n$m[0].TypeName","out":"System.String","check":{"t":"predict","code":"'hi'.GetType().Name","choices":["hi","Object","String"],"a":2,"why":"`.GetType().Name` gives the short type name."}},{"h":"Aliases: short names","body":["`cd` = `Set-Location`, `cls` = `Clear-Host`, `ls` = `Get-ChildItem` (Windows; on a Mac `ls` is the Mac tool).","Fine at the prompt; write full names in scripts.","`Get-Alias` shows what an alias really runs."],"code":"(Get-Alias cd).Definition","out":"Set-Location","check":{"t":"predict","code":"(Get-Alias gci).Definition","choices":["Get-Command","Get-ChildItem","Get-Content"],"a":1,"why":"`gci` is short for Get-ChildItem."}}],"qs":[{"t":"predict","code":"(Get-Command New-Item).Noun","choices":["Item","New","New-Item"],"a":0,"why":"The noun is the part after the dash."},{"t":"predict","code":"(Get-Command Set-Location).Verb","choices":["Location","Set-Location","Set"],"a":2,"why":"The verb is the part before the dash."},{"t":"predict","code":"Get-Proces","choices":["(nothing shown)","a list of processes","Error: term not recognized"],"a":2,"why":"One letter missing means PowerShell can't find the command."},{"t":"predict","code":"Delete-Item C:\\temp\\a.txt","choices":["(nothing shown)","Error: access denied","Error: term not recognized"],"a":2,"why":"Delete is not a PowerShell verb. The real cmdlet is Remove-Item."},{"t":"predict","code":"(Get-Alias gm).Definition","choices":["Get-Module","Get-Mailbox","Get-Member"],"a":2,"why":"`gm` is short for Get-Member."},{"t":"predict","code":"(Get-Date).GetType().Name","choices":["Date","Get-Date","DateTime"],"a":2,"why":"Get-Date returns a DateTime object, not text."},{"t":"predict","code":"(5).GetType().Name","choices":["Int32","Number","5"],"a":0,"why":"Whole numbers are Int32 objects."},{"t":"predict","code":"'hi'.ToUpper()","choices":["ToUpper","HI","hi"],"a":1,"why":"`ToUpper()` is a method: an action that returns new text."},{"t":"pick","ask":"Which lists every cmdlet with User in its noun?","choices":["Get-Member -Noun User","Get-Command -Noun *User*","Get-Help User","Get-Command User"],"a":1,"why":"Get-Command searches cmdlets; `*` matches any text around User."},{"t":"pick","ask":"Which shows only ready-made examples for Set-Mailbox?","choices":["Get-Help Set-Mailbox -Full","Get-Command Set-Mailbox -Examples","Set-Mailbox -Help","Get-Help Set-Mailbox -Examples"],"a":3,"why":"`-Examples` belongs to Get-Help and shows just the examples."},{"t":"pick","ask":"Which is a real cmdlet that deletes a Graph user?","choices":["Delete-MgUser","Erase-MgUser","Kill-MgUser","Remove-MgUser"],"a":3,"why":"Remove is the approved verb for deleting."},{"t":"pick","ask":"Which shows the properties and methods of what Get-Mailbox returns?","choices":["Get-Mailbox | Get-Help","Get-Mailbox | Get-Member","Get-Help Get-Mailbox","Get-Member Get-Mailbox"],"a":1,"why":"Pipe the real objects into Get-Member to look inside them."},{"t":"pick","ask":"Which cmdlet puts Ada into the Sales distribution group?","choices":["Get-DistributionGroupMember","Add-DistributionGroupMember","New-DistributionGroupMember"],"a":1,"why":"Add puts something into a container that already exists."},{"t":"fill","code":"Get-Command -___ Get","target":"Lists only cmdlets that start with Get","choices":["Verb","Noun","Help"],"ok":[0],"why":"Get is a verb, so search with `-Verb`."},{"t":"fill","code":"Get-Help Get-Date ___","target":"Shows only usage examples","choices":["-Examples","-Full","-Online"],"ok":[0],"why":"`-Full` shows everything, `-Online` opens a web page."},{"t":"fill","code":"'hi' | ___","target":"Shows the type, properties and methods of a string","choices":["Get-Member","gm","Get-Help","Get-Command"],"ok":[0,1],"why":"`gm` is the alias of Get-Member."},{"t":"fill","code":"(Get-Alias ___).Definition","target":"Shows Set-Location","choices":["cd","ls","sl","gm"],"ok":[0,2],"why":"Both `cd` and `sl` are aliases of Set-Location."},{"t":"fill","code":"___-Mailbox -Identity ada@contoso.com -HiddenFromAddressListsEnabled $true","target":"Changes a setting on Ada's mailbox","choices":["Get","Set","New","Add"],"ok":[1],"why":"Set changes something that already exists."},{"t":"build","ask":"Find every cmdlet whose noun contains Mailbox","setup":"","target":"A list of mailbox cmdlets","tiles":["Get-Command","-Noun","*Mailbox*","-Verb","Get-Help"],"sol":"0,1,2","ok":["0,1,2"],"why":"Get-Command searches, `-Noun` says where, `*` allows text around Mailbox."},{"t":"build","ask":"Show examples for New-MgUser","setup":"","target":"Examples of New-MgUser","tiles":["Get-Help","New-MgUser","-Examples","Get-Member","-Full"],"sol":"0,1,2","ok":["0,1,2","0,2,1"],"why":"Named parameters like `-Examples` can go before or after the name."},{"t":"build","ask":"Show which cmdlet the alias gci runs","setup":"","target":"Shows Get-ChildItem","tiles":["(Get-Alias","gci).Definition","Get-Command","cd).Definition"],"sol":"0,1","ok":["0,1"],"why":"Get-Alias gives the alias object; `.Definition` is the real cmdlet."},{"t":"build","ask":"Look at the properties of a date","setup":"","target":"Members of a DateTime","tiles":["Get-Date","|","Get-Member","Get-Help","-Examples"],"sol":"0,1,2","ok":["0,1,2"],"why":"Make the object first, then pipe it into Get-Member."},{"t":"order","lines":["Get-Help Get-Mailbox -Examples","Get-Command -Noun *Mailbox*","Get-Mailbox -Identity ada@contoso.com"],"target":"Find the cmdlet, read its examples, then run it","sol":"1,0,2","ok":["1,0,2"],"why":"Search, learn, then use."},{"t":"order","lines":["$d | Get-Member","$d.DayOfWeek","$d = Get-Date"],"target":"Store a date, look at its members, then read one","sol":"2,0,1","ok":["2,0,1"],"why":"You need `$d` before you can inspect or read it."},{"t":"order","lines":["Remove-MgUser -UserId ada@contoso.com","Get-MgUser -UserId ada@contoso.com","Connect-MgGraph -Scopes User.ReadWrite.All"],"target":"Connect, check Ada exists, then delete her account","sol":"2,1,0","ok":["2,1,0"],"why":"Always connect first, and look before you remove."},{"t":"order","lines":["Get-Help Get-ChildItem -Examples","Get-Alias gci","gci"],"target":"Run gci, see which cmdlet it is, then read that cmdlet's examples","sol":"2,1,0","ok":["2,1,0"],"why":"Alias first, real name second, help last."},{"t":"bug","lines":["Connect-MgGraph -Scopes User.Read.All","Get-MgUsers -All"],"bad":1,"fix":"Get-MgUser -All","expect":"Lists all users","got":"Error: term not recognized","why":"Cmdlet nouns are singular: MgUser, not MgUsers."},{"t":"bug","lines":["Connect-MgGraph -Scopes User.ReadWrite.All","Delete-MgUser -UserId ada@contoso.com"],"bad":1,"fix":"Remove-MgUser -UserId ada@contoso.com","expect":"Deletes Ada's account","got":"Error: term not recognized","why":"Delete is not an approved verb. Use Remove."},{"t":"bug","lines":["$d = Get-Date","$d.DayOfWeek()"],"bad":1,"fix":"$d.DayOfWeek","expect":"Today's weekday, e.g. Monday","got":"Error: no method named DayOfWeek","why":"DayOfWeek is a property, so no `()`."},{"t":"bug","lines":["$s = 'hi'","$s.ToUpper"],"bad":1,"fix":"$s.ToUpper()","expect":"HI","got":"the method's description, not HI","why":"Without `()` you look at the method instead of running it."}]},{"id":"vars","title":"Variables and text","sub":"$x, quotes, $( ), +, .Length","cards":[{"h":"Store it in a $variable","body":["`$name = 'Ada'` puts a value in a named box.","Type `$name` to see what's inside.","Names ignore case: `$NAME` is the same box."],"code":"$name = 'Ada'\n$NAME","out":"Ada","check":{"t":"predict","code":"$n = 5\n$n = 7\n$n","choices":["5","12","7"],"a":2,"why":"A new value replaces the old one."}},{"h":"Single vs double quotes","body":["'Single' quotes print exactly what you typed.","\"Double\" quotes swap `$var` for its value."],"code":"$n = 'Ada'\n'Hi $n'\n\"Hi $n\"","out":"Hi $n\nHi Ada","flow":[{"if":"Need a $variable inside?","yes":"\"double\"","no":"'single'"}],"check":{"t":"predict","code":"$d = 'Sales'\n\"Team: $d\"","choices":["Team: 'Sales'","Team: Sales","Team: $d"],"a":1,"why":"Double quotes put the value in."}},{"h":"$( ) for properties and maths","body":["Inside \"double\" quotes only `$var` is swapped, not `.Length` after it.","Wrap it: `\"$($u.Name)\"`. Works for any code: `\"$(2+3)\"`."],"code":"$n = 'Noor'\n\"$n.Length\"\n\"$($n.Length)\"","out":"Noor.Length\n4","check":{"t":"predict","code":"$x = 4\n\"Total: $($x * 2)\"","choices":["Total: 4 * 2","Total: $($x * 2)","Total: 8"],"a":2,"why":"`$( )` runs the code first, then puts the result in."}},{"h":"Join text with +","body":["`'Hi ' + $name` glues text together.","The left side decides: text + number gives text, number + text gives a number.","No need for `-f` formatting: `+` or \"$var\" is enough."],"code":"'ada' + '@' + 'contoso.com'","out":"ada@contoso.com","check":{"t":"predict","code":"'5' + 5","choices":["10","Error: cannot add","55"],"a":2,"why":"Left side is text, so 5 is glued on."}},{"h":"$null and string methods","body":["`$null` means nothing. It prints nothing.","Text has `.Length`, `.ToUpper()`, `.ToLower()`.","Methods always need `()`."],"code":"$e = 'ADA@CONTOSO.COM'\n$e.ToLower()","out":"ada@contoso.com","check":{"t":"predict","code":"$x = $null\n\"[$x]\"","choices":["(nothing shown)","[]","[$null]"],"a":1,"why":"$null becomes empty text inside a string."}}],"qs":[{"t":"predict","code":"$n = 'Bram'\n'Hello $n'","choices":["Hello Bram","Hello 'Bram'","Hello $n"],"a":2,"why":"Single quotes never swap variables."},{"t":"predict","code":"$n = 'Bram'\n\"$n.Length\"","choices":["Bram4","Bram.Length","4"],"a":1,"why":"Only `$n` is swapped; `.Length` stays as text."},{"t":"predict","code":"$n = 'Lien'\n\"Chars: $($n.Length)\"","choices":["Chars: 4","Chars: Lien.Length","Chars: $($n.Length)"],"a":0,"why":"`$( )` runs `$n.Length` first."},{"t":"predict","code":"5 + '5'","choices":["55","Error: cannot add","10"],"a":2,"why":"Left side is a number, so '5' becomes the number 5."},{"t":"predict","code":"$n = 'noor'\n$n.ToUpper()\n$n","choices":["NOOR\nnoor","NOOR\nNOOR","noor\nnoor"],"a":0,"why":"ToUpper() returns new text; `$n` itself is unchanged."},{"t":"predict","code":"$x = $null\n$x","choices":["$null","0","(nothing shown)"],"a":2,"why":"$null prints nothing at all."},{"t":"predict","code":"$a = 'Sales'\n$A","choices":["Sales","(nothing shown)","Error: variable not found"],"a":0,"why":"Variable names ignore case."},{"t":"predict","code":"$d = 'contoso.com'\n\"ada@$d\"","choices":["ada@contoso.com","ada@$d","ada@"],"a":0,"why":"Double quotes swap `$d` for its value."},{"t":"predict","code":"$t = 'Hi'\n$t.Length + 1","choices":["21","3","Hi1"],"a":1,"why":"`.Length` is the number 2, plus 1 is 3."},{"t":"pick","ask":"$n is 'Ada'. Which shows: Welcome, Ada!","choices":["\"Welcome, $n!\"","'Welcome, $n!'","\"Welcome, \" + n + \"!\""],"a":0,"why":"Double quotes swap `$n`; without `$` it's not a variable."},{"t":"pick","ask":"Which shows the length of $n inside text?","choices":["'Len: $($n.Length)'","\"Len: $($n.Length)\"","\"Len: $n.Length\""],"a":1,"why":"Properties inside a string need `$( )` and double quotes."},{"t":"pick","ask":"Which gives the text in $mail in lowercase?","choices":["$mail.Lower()","$mail.ToLower()","$mail.ToLower","ToLower($mail)"],"a":1,"why":"The method is ToLower and it needs `()`."},{"t":"pick","ask":"Which empties the variable $x?","choices":["$x = $null","$x = 'null'","$x = null"],"a":0,"why":"'null' is the word null; bare null is an unknown command."},{"t":"fill","code":"$n = 'Ada'\nWrite-Output ___","target":"Shows Hi Ada on one line","choices":["\"Hi $n\"","'Hi $n'","('Hi ' + $n)","Hi $n"],"ok":[0,2],"why":"Double quotes or + both work. Without quotes you get two separate lines."},{"t":"fill","code":"$n = 'Lien'\n\"Length: ___\"","target":"Shows Length: 4","choices":["$n.Length","$($n.Length)","$(n.Length)"],"ok":[1],"why":"Only `$( )` runs the property inside text."},{"t":"fill","code":"$m = 'BRAM@CONTOSO.COM'\n$m.___","target":"Shows bram@contoso.com","choices":["ToLower()","ToLower","Lower()","ToUpper()"],"ok":[0],"why":"Lowercase is ToLower, with `()` to run it."},{"t":"fill","code":"$u = 'ada'\n$u + ___","target":"Shows ada@contoso.com","choices":["'@contoso.com'","\"@contoso.com\"","@contoso.com"],"ok":[0,1],"why":"Text needs quotes; either kind works here."},{"t":"fill","code":"$x = ___\n\"[$x]\"","target":"Shows []","choices":["$null","''","' '","'null'"],"ok":[0,1],"why":"$null and empty text both show nothing between the brackets."},{"t":"build","ask":"Store Sales in $team","setup":"","target":"$team holds Sales","tiles":["$team","=","'Sales'","$Sales","=="],"sol":"0,1,2","ok":["0,1,2"],"why":"One `=` stores a value. `==` is not a PowerShell operator."},{"t":"build","ask":"Show Team: Sales using $team","setup":"$team = 'Sales'","target":"Shows Team: Sales","tiles":["\"Team:","$team\"","'Team:","$team'"],"sol":"0,1","ok":["0,1"],"why":"Double quotes swap `$team` for Sales."},{"t":"build","ask":"Glue the name and domain together","setup":"$f = 'noor'","target":"Shows noor@contoso.com","tiles":["$f","+","'@contoso.com'","-f","&"],"sol":"0,1,2","ok":["0,1,2"],"why":"`+` joins text."},{"t":"build","ask":"Show the length of $n inside text","setup":"$n = 'Bram'","target":"Shows Bram has 4 letters","tiles":["\"$n","has","$($n.Length)","letters\"","$n.Length"],"sol":"0,1,2,3","ok":["0,1,2,3"],"why":"Use `$( )` for the property inside the string."},{"t":"order","lines":["\"Mail: $mail\"","$mail = $user + '@contoso.com'","$user = 'lien'"],"target":"Shows Mail: lien@contoso.com","sol":"2,1,0","ok":["2,1,0"],"why":"Each line needs the variable from the line before it."},{"t":"order","lines":["$n = 'helpdesk'","$big","$big = $n.ToUpper()"],"target":"Shows HELPDESK","sol":"0,2,1","ok":["0,2,1"],"why":"Set `$n`, make `$big` from it, then show it."},{"t":"order","lines":["\"[$x]\"","$x = 'Ada'","$x = $null"],"target":"Shows [Ada]","sol":"2,1,0","ok":["2,1,0"],"why":"The last value stored wins, so 'Ada' must come after `$null`."},{"t":"order","lines":["\"$name has $len letters\"","$name = 'Noor'","$len = $name.Length"],"target":"Shows Noor has 4 letters","sol":"1,2,0","ok":["1,2,0"],"why":"Store the name, measure it, then print."},{"t":"bug","lines":["$n = 'Ada'","'Hi $n'"],"bad":1,"fix":"\"Hi $n\"","expect":"Hi Ada","got":"Hi $n","why":"Single quotes print the text exactly as typed."},{"t":"bug","lines":["$n = 'Bram'","\"Letters: $n.Length\""],"bad":1,"fix":"\"Letters: $($n.Length)\"","expect":"Letters: 4","got":"Letters: Bram.Length","why":"Wrap properties in `$( )` inside strings."},{"t":"bug","lines":["$m = 'ada@contoso.com'","$m.ToUpper"],"bad":1,"fix":"$m.ToUpper()","expect":"ADA@CONTOSO.COM","got":"the method's description, not the text","why":"Methods need `()` to run."},{"t":"bug","lines":["$count = '5'","$count + 1"],"bad":0,"fix":"$count = 5","expect":"6","got":"51","why":"'5' in quotes is text, so + glues instead of adding."},{"t":"bug","lines":["name = 'Lien'","\"Hi $name\""],"bad":0,"fix":"$name = 'Lien'","expect":"Hi Lien","got":"Error: term not recognized","why":"Variables always start with `$`."}]},{"id":"operators","title":"Comparing and maths","sub":"-eq, -like, -contains, -and, 7/2","cards":[{"h":"Compare with -eq, -gt ...","body":["Not `=` or `>`: use `-eq` equal, `-ne` not equal.","`-gt` `-lt` greater/less, `-ge` `-le` or equal.","The answer is True or False."],"code":"5 -gt 3\n5 -le 3","out":"True\nFalse","check":{"t":"predict","code":"10 -ge 10","choices":["True","False","Error: bad operator"],"a":0,"why":"-ge means greater or equal."}},{"h":"Case doesn't matter (by default)","body":["`'Ada' -eq 'ADA'` is True.","Add a `c` for case-sensitive: `-ceq`, `-clike`."],"code":"'Ada' -eq 'ada'\n'Ada' -ceq 'ada'","out":"True\nFalse","check":{"t":"predict","code":"'SALES' -ne 'sales'","choices":["True","SALES","False"],"a":2,"why":"Case is ignored, so they are equal: -ne is False."}},{"h":"Patterns: -like and -match","body":["`-like` uses wildcards: `*` means any text.","`-match` uses regex: `^` start, `$` end."],"code":"$m = 'ada@contoso.com'\n$m -like '*contoso.com'\n$m -match '^ada'","out":"True\nTrue","check":{"t":"predict","code":"'Helpdesk' -like 'help'","choices":["Help","False","True"],"a":1,"why":"Without `*`, -like needs the whole text to match."}},{"h":"Lists: -contains and -in","body":["`list -contains item` and `item -in list` check whole items, not part of text.","`-eq` on a list filters it: `1,2,3 -eq 2` gives `2`.","Test empty with `$null -eq $x`: `$null` on the left."],"code":"'Sales','IT' -contains 'it'\n'IT' -in 'Sales','IT'","out":"True\nTrue","flow":[{"if":"List on the left?","yes":"-contains","no":"-in"}],"check":{"t":"predict","code":"1,2,3 -eq 2","choices":["1","2","True"],"a":1,"why":"With a list on the left, -eq returns the matching items."}},{"h":"Combine and calculate","body":["`-and`, `-or`, `-not` combine True/False answers.","Maths: `+ - * /` and `%` (remainder).","`7/2` is `3.5`. `[math]::Floor()` rounds down."],"code":"7 / 2\n[math]::Floor(7 / 2)","out":"3.5\n3","check":{"t":"predict","code":"5 -gt 1 -and 2 -gt 3","choices":["2","False","True"],"a":1,"why":"-and needs both sides True."}}],"qs":[{"t":"predict","code":"'Noor' -eq 'NOOR'","choices":["Error: case mismatch","True","False"],"a":1,"why":"-eq ignores case."},{"t":"predict","code":"'Noor' -ceq 'NOOR'","choices":["False","True","NOOR"],"a":0,"why":"-ceq checks case too."},{"t":"predict","code":"'Sales Team' -contains 'Sales'","choices":["False","True","Sales"],"a":0,"why":"-contains is for lists, not for text inside text."},{"t":"predict","code":"'Sales' -in 'sales','it'","choices":["True","False","sales"],"a":0,"why":"-in ignores case too."},{"t":"predict","code":"1,5,9 -gt 4","choices":["9","5\n9","True"],"a":1,"why":"A list on the left returns the items that pass."},{"t":"predict","code":"7 / 2","choices":["4","3.5","3"],"a":1,"why":"PowerShell does not cut off decimals."},{"t":"predict","code":"10 % 4","choices":["2","2.5","4"],"a":0,"why":"% gives the remainder: 10 = 4 + 4 + 2."},{"t":"predict","code":"[math]::Floor(9 / 2)","choices":["5","4","4.5"],"a":1,"why":"9/2 is 4.5, Floor rounds down."},{"t":"predict","code":"-not (3 -eq 3)","choices":["3","False","True"],"a":1,"why":"-not flips True into False."},{"t":"predict","code":"$x = 1,2,3\n$null -eq $x","choices":["True","False","(nothing shown)"],"a":1,"why":"$null on the left gives a clean True/False."},{"t":"predict","code":"2 + 3 * 4","choices":["14","20","234"],"a":0,"why":"* goes before +."},{"t":"predict","code":"'Helpdesk' -match 'desk$'","choices":["False","desk","True"],"a":2,"why":"`$` in regex means: ends with."},{"t":"pick","ask":"Which tests if $dept is Sales, any case?","choices":["$dept -eq 'Sales'","$dept = 'Sales'","$dept == 'Sales'","$dept -ceq 'sales'"],"a":0,"why":"`=` stores, `==` doesn't exist, -ceq checks case."},{"t":"pick","ask":"Which is True for every address ending in @contoso.com?","choices":["$m -eq '*@contoso.com'","$m -like '*@contoso.com'","$m -like '@contoso.com'","$m -contains '@contoso.com'"],"a":1,"why":"-like needs `*` for the part before."},{"t":"pick","ask":"Which gives True or False for: is 'Ada' in the list $admins?","choices":["$admins -contains 'Ada'","$admins -in 'Ada'","'Ada' -contains $admins","$admins -like 'Ada'"],"a":0,"why":"List -contains item. -like on a list returns items, not True/False."},{"t":"pick","ask":"Which is the safe way to check that $u is empty?","choices":["$null -eq $u","$u -eq $null","$u = $null","$u -is null"],"a":0,"why":"If $u is a list, `$u -eq $null` filters it instead of answering."},{"t":"pick","ask":"Which gives 3 for 7 / 2, rounded down?","choices":["7 % 2","[int](7 / 2)","[math]::Floor(7 / 2)","7 / 2"],"a":2,"why":"Floor always rounds down. [int] rounds 3.5 to 4."},{"t":"fill","code":"5 ___ 5","target":"Shows True","choices":["-eq","-ge","-le","-gt"],"ok":[0,1,2],"why":"Equal, greater-or-equal and less-or-equal are all True."},{"t":"fill","code":"'ADA' ___ 'ada'","target":"Shows False","choices":["-eq","-ceq","-ieq","-ne"],"ok":[1,3],"why":"-ceq sees different case. -ne ignores case, so they're equal and -ne is False."},{"t":"fill","code":"'Bram' ___ 'B*'","target":"Shows True","choices":["-like","-match","-eq","-contains"],"ok":[0,1],"why":"-like reads `*` as any text. In regex `B*` matches anything too."},{"t":"fill","code":"$d = 'Sales','Helpdesk'\n'Helpdesk' ___ $d","target":"Shows True","choices":["-in","-contains","-like"],"ok":[0],"why":"Item on the left, list on the right: -in."},{"t":"fill","code":"$n = 12\n$n -gt 10 ___ $n -gt 15","target":"Shows False","choices":["-and","-or","-xor"],"ok":[0],"why":"First is True, second False: only -and gives False."},{"t":"build","ask":"Check if $mail ends with @contoso.com","setup":"$mail = 'lien@contoso.com'","target":"Shows True","tiles":["$mail","-like","'*@contoso.com'","-contains","'@contoso.com'"],"sol":"0,1,2","ok":["0,1,2"],"why":"-like with `*` before the domain."},{"t":"build","ask":"Is the count above 50?","setup":"$count = 73","target":"Shows True","tiles":["$count","-gt","50","-lt",">"],"sol":"0,1,2","ok":["0,1,2"],"why":"`>` would write to a file named 50!"},{"t":"build","ask":"Is Noor one of the admins?","setup":"$admins = 'Ada','Noor'","target":"Shows True","tiles":["'Noor'","-in","$admins","-contains","-eq"],"sol":"0,1,2","ok":["0,1,2"],"why":"Item -in list."},{"t":"build","ask":"Round 7 / 2 down","setup":"","target":"Shows 3","tiles":["[math]::Floor(","7","/","2",")","%"],"sol":"0,1,2,3,4","ok":["0,1,2,3,4"],"why":"Floor around the division."},{"t":"order","lines":["}","if ($dept -eq 'sales') {","$dept = 'Sales'","  'Match'"],"target":"Shows Match","sol":"2,1,3,0","ok":["2,1,3,0"],"why":"Set the value, open the if, the action, close it."},{"t":"order","lines":["$ok","$ok = $m -like '*@contoso.com'","$m = 'noor@contoso.com'"],"target":"Shows True","sol":"2,1,0","ok":["2,1,0"],"why":"Each line uses the one before it."},{"t":"order","lines":["$half = $n / 2","$n = 9","[math]::Floor($half)"],"target":"Shows 4","sol":"1,0,2","ok":["1,0,2"],"why":"9 / 2 = 4.5, rounded down is 4."},{"t":"order","lines":["'Bram' -in $list","$list += 'Bram'","$list = 'Ada','Lien'"],"target":"Shows True","sol":"2,1,0","ok":["2,1,0"],"why":"Make the list, add Bram, then check."},{"t":"bug","lines":["$n = 5","if ($n > 3) { 'big' }"],"bad":1,"fix":"if ($n -gt 3) { 'big' }","expect":"big","got":"(nothing shown), plus a new file named 3","why":"`>` sends output to a file. Use -gt."},{"t":"bug","lines":["$m = 'ada@contoso.com'","$m -contains 'contoso'"],"bad":1,"fix":"$m -like '*contoso*'","expect":"True","got":"False","why":"-contains is for lists. For text inside text use -like with `*`."},{"t":"bug","lines":["$pw = 'Secret'","$pw -eq 'secret'"],"bad":1,"fix":"$pw -ceq 'secret'","expect":"False (case should count)","got":"True","why":"-eq ignores case; -ceq doesn't."},{"t":"bug","lines":["$d = 'IT'","if ($d = 'Sales') { 'Sales!' }"],"bad":1,"fix":"if ($d -eq 'Sales') { 'Sales!' }","expect":"(nothing shown)","got":"Sales!","why":"`=` stores Sales in $d, which counts as True."},{"t":"bug","lines":["$pages = 7 / 2","\"Full pages: $pages\""],"bad":0,"fix":"$pages = [math]::Floor(7 / 2)","expect":"Full pages: 3","got":"Full pages: 3.5","why":"Division keeps decimals; Floor rounds down."}]},{"id":"collections","title":"Arrays and objects","sub":"@(), [0], +=, 1..5, @{}, [PSCustomObject]","cards":[{"h":"Arrays: many values in one box","body":["`@('Ada','Bram')` or just `'Ada','Bram'` makes a list.","`.Count` says how many items.","Printing shows one item per line."],"code":"$u = 'Ada','Bram','Lien'\n$u.Count","out":"3","check":{"t":"predict","code":"$u = @()\n$u.Count","choices":["(nothing shown)","0","1"],"a":1,"why":"@() is an empty list."}},{"h":"Index: [0] is first","body":["`[0]` first, `[1]` second, `[-1]` last.","Past the end gives nothing, not an error."],"code":"$u = 'Ada','Bram','Lien'\n$u[0]\n$u[-1]","out":"Ada\nLien","check":{"t":"predict","code":"$u = 'Ada','Bram'\n$u[2]","choices":["Error: index out of range","(nothing shown)","Bram"],"a":1,"why":"Only [0] and [1] exist. [2] is just empty."}},{"h":"Grow with += and ranges","body":["`$u += 'Noor'` makes a new, longer list.","`1..5` makes 1,2,3,4,5."],"code":"$n = 1..3\n$n += 10\n$n","out":"1\n2\n3\n10","check":{"t":"predict","code":"(1..5).Count","choices":["5","4","6"],"a":0,"why":"Both ends are included."}},{"h":"Hashtables: key = value","body":["`@{Ada='Sales'; Bram='IT'}` pairs keys with values.","Read: `$h.Ada` or `$h['Ada']`. Keys ignore case.","Add: `$h.Noor = 'Helpdesk'`."],"code":"$h = @{Ada='Sales'}\n$h.Bram = 'IT'\n$h['Bram']\n$h.Count","out":"IT\n2","check":{"t":"predict","code":"$h = @{Ada='Sales'}\n$h['ada']","choices":["Error: key not found","Sales","(nothing shown)"],"a":1,"why":"Hashtable keys ignore case."}},{"h":"[PSCustomObject]: one tidy object","body":["Put `[PSCustomObject]` before `@{ }` to make an object, like what Get-MgUser gives you.","Read with `.Property`. List every property when you create it."],"code":"$o = [PSCustomObject]@{\n  Name='Ada'; Dept='Sales'\n}\n$o.Dept","out":"Sales","flow":[{"if":"One thing with named facts?","yes":"[PSCustomObject]@{ }","no":"A list: @( )"}],"check":{"t":"predict","code":"$o = [PSCustomObject]@{N='Ada'}\n$o.Mail","choices":["(nothing shown)","Error: property not found","Ada"],"a":0,"why":"Reading a property that isn't there just gives nothing."}}],"qs":[{"t":"predict","code":"$u = 'Ada','Bram','Lien'\n$u[1]","choices":["Bram","Ada","Lien"],"a":0,"why":"Counting starts at 0."},{"t":"predict","code":"$u = 'Ada','Bram','Lien'\n$u[-1]","choices":["Ada","(nothing shown)","Lien"],"a":2,"why":"[-1] is the last item."},{"t":"predict","code":"$a = @()\n$a += 'Ada'\n$a += 'Noor'\n$a.Count","choices":["2","1","0"],"a":0,"why":"Each += adds one item."},{"t":"predict","code":"$s = 'Ada'\n$s += 'Bram'\n$s","choices":["Ada Bram","AdaBram","Ada\nBram"],"a":1,"why":"$s was text, so += glues text."},{"t":"predict","code":"$n = 3..1\n$n","choices":["3\n2\n1","1\n2\n3","3..1"],"a":0,"why":"Ranges can count down."},{"t":"predict","code":"$h = @{Ada='Sales';Bram='IT'}\n$h.Count","choices":["1","2","4"],"a":1,"why":"Count is the number of keys."},{"t":"predict","code":"$h = @{Ada='Sales'}\n$h.Lien","choices":["(nothing shown)","Error: key not found","Lien"],"a":0,"why":"A missing key just gives nothing."},{"t":"predict","code":"$o = [PSCustomObject]@{N='Ada'}\n$o.Dept = 'IT'","choices":["(nothing shown)","IT","Error: property 'Dept' not found"],"a":2,"why":"You can't add a property to a PSCustomObject with `=`. Include it when you create it."},{"t":"predict","code":"$u = 'Ada'\n$u.Count","choices":["3","Error: not an array","1"],"a":2,"why":"A single value counts as 1."},{"t":"predict","code":"$u = 'Ada','Bram'\n\"First: $u[0]\"","choices":["First: A","First: Ada Bram[0]","First: Ada"],"a":1,"why":"Only `$u` is swapped. Use \"$($u[0])\"."},{"t":"predict","code":"$n = 10,20,30\n$n[0] + $n[-1]","choices":["10\n30","1030","40"],"a":2,"why":"10 + 30 = 40."},{"t":"predict","code":"$o = [PSCustomObject]@{N='Ada'}\n\"Hi $($o.N)\"","choices":["Hi N","Hi Ada","Hi @{N=Ada}.N"],"a":1,"why":"`$( )` reads the property first."},{"t":"pick","ask":"Which makes an empty list to fill later?","choices":["$u = @()","$u = @{}","$u = ()","$u = $null[]"],"a":0,"why":"@() is a list; @{} is a hashtable."},{"t":"pick","ask":"Which reads the last item of $list?","choices":["$list.Last","$list[-1]","$list[0]","$list[$list.Count]"],"a":1,"why":"[-1] counts from the end. [$list.Count] is one past the end."},{"t":"pick","ask":"Which adds key Noor with value Helpdesk to $h?","choices":["$h[Noor] = Helpdesk","$h.Add(Noor)","$h.Noor = 'Helpdesk'","$h += 'Noor'"],"a":2,"why":"Set a new key like a property; text needs quotes."},{"t":"pick","ask":"Which makes one object you can read as $o.Name?","choices":["$o = 'Name=Ada;Dept=Sales'","$o = [PSCustomObject]@{Name='Ada';Dept='Sales'}","$o = @('Ada','Sales')"],"a":1,"why":"A list or a string has no Name property."},{"t":"pick","ask":"Which gives the numbers 1 to 10?","choices":["1..10","1-10","(1,10)","range(1,10)"],"a":0,"why":"`..` makes a range. 1-10 is just -9."},{"t":"fill","code":"$u = 'Ada','Bram','Lien'\n$u[___]","target":"Shows Lien","choices":["2","-1","3","1"],"ok":[0,1],"why":"Lien is at 2, and also last (-1)."},{"t":"fill","code":"$h = @{Ada='Sales'}\n___","target":"Shows Sales","choices":["$h.Ada","$h['Ada']","$h[0]","$h.Sales"],"ok":[0,1],"why":"Read by key name. [0] looks for a key called 0."},{"t":"fill","code":"$u = ___\n$u.Count","target":"Shows 3","choices":["'Ada','Bram','Noor'","@('Ada','Bram','Noor')","'Ada Bram Noor'","1..3"],"ok":[0,1,3],"why":"One string with spaces is still one item."},{"t":"fill","code":"$team = @()\n$team ___ 'Ada'\n$team.Count","target":"Shows 1","choices":["+=","=","-="],"ok":[0,1],"why":"+= adds Ada to the list. = replaces it with one value, which also counts as 1."},{"t":"fill","code":"$o = [PSCustomObject]@{\n  Name='Bram'; Dept='IT'\n}\n$o.___","target":"Shows IT","choices":["Dept","IT","Name","Department"],"ok":[0],"why":"Read a property by its exact name."},{"t":"build","ask":"Make a list of three users","setup":"","target":"$u.Count shows 3","tiles":["$u","=","'Ada',","'Bram',","'Noor'","@{"],"sol":"0,1,2,3,4","ok":["0,1,2,3,4","0,1,3,2,4"],"why":"Commas between items make a list."},{"t":"build","ask":"Add Lien to the team","setup":"$team = @('Ada')","target":"$team.Count shows 2","tiles":["$team","+=","'Lien'","=","-"],"sol":"0,1,2","ok":["0,1,2"],"why":"+= adds to the end."},{"t":"build","ask":"Make a user object with Name Ada","setup":"","target":"$o.Name shows Ada","tiles":["$o","=","[PSCustomObject]@{","Name='Ada'","}","@("],"sol":"0,1,2,3,4","ok":["0,1,2,3,4"],"why":"Type name, then a hashtable."},{"t":"build","ask":"Store the numbers 1 to 5","setup":"","target":"$n.Count shows 5","tiles":["$n","=","1..5","1-5","@{}"],"sol":"0,1,2","ok":["0,1,2"],"why":"1..5 is a range."},{"t":"order","lines":["$u[-1]","$u += 'Noor'","$u = 'Ada','Bram'"],"target":"Shows Noor","sol":"2,1,0","ok":["2,1,0"],"why":"Make, grow, then read the last."},{"t":"order","lines":["$h['Bram']","$h = @{}","$h.Bram = 'IT'"],"target":"Shows IT","sol":"1,2,0","ok":["1,2,0"],"why":"Empty hashtable, add a key, read it."},{"t":"order","lines":["}","$o.Name","$o = [PSCustomObject]@{","  Name = 'Lien'"],"target":"Shows Lien","sol":"2,3,0,1","ok":["2,3,0,1"],"why":"Open, fill, close, then read."},{"t":"order","lines":["$all.Count","$all = $a + $b","$b = 'Noor'","$a = 'Ada','Bram'"],"target":"Shows 3","sol":"3,2,1,0","ok":["3,2,1,0","2,3,1,0"],"why":"Both lists must exist before you add them."},{"t":"bug","lines":["$u = 'Ada','Bram','Lien'","$u[3]"],"bad":1,"fix":"$u[2]","expect":"Lien","got":"(nothing shown)","why":"Three items are [0], [1], [2]."},{"t":"bug","lines":["$h = @{Ada='Sales'}","$h.Sales"],"bad":1,"fix":"$h.Ada","expect":"Sales","got":"(nothing shown)","why":"You read by key (Ada), not by value."},{"t":"bug","lines":["$team = 'Ada'","$team += 'Bram'","$team.Count"],"bad":0,"fix":"$team = @('Ada')","expect":"2","got":"1","why":"Text += text glues: AdaBram is one item."},{"t":"bug","lines":["$o = [PSCustomObject]@{N='Ada'}","\"Hi $o.N\""],"bad":1,"fix":"\"Hi $($o.N)\"","expect":"Hi Ada","got":"Hi @{N=Ada}.N","why":"Wrap the property in `$( )`."},{"t":"bug","lines":["$u = 'Ada','Bram'","$u.Count()"],"bad":1,"fix":"$u.Count","expect":"2","got":"Error: no method named Count","why":"Count is a property, so no `()`."}]},{"id":"pipeline","title":"The pipeline","sub":"|, $_, ForEach-Object, -ExpandProperty","cards":[{"h":"Objects flow through |","body":["`|` passes each object from the left command to the right one.","Objects keep all their properties on the way, not just text."],"code":"'ada','bram' |\n  ForEach-Object { $_.Length }","out":"3\n4","flow":["Get-MgUser","| one object at a time","next command","| ...","result"],"check":{"t":"predict","code":"'hi','there' |\n  ForEach-Object { $_.Length }","choices":["2\n5","7","hi\nthere"],"a":0,"why":"Each word goes through on its own."}},{"h":"$_ is the current object","body":["Inside `{ }`, `$_` is the object passing by right now.","`$PSItem` is the long name for the same thing."],"code":"1..3 | ForEach-Object {\n  $_ * 10\n}","out":"10\n20\n30","check":{"t":"predict","code":"'a','b' | ForEach-Object {\n  $PSItem.ToUpper()\n}","choices":["A\nB","a\nb","AB"],"a":0,"why":"$PSItem is $_, one item per turn."}},{"h":"ForEach-Object: once per object","body":["The `{ }` block runs once for every object.","Great for building text like \"$_@contoso.com\".","`%` is its alias; write it in full in scripts."],"code":"'Ada','Noor' | ForEach-Object {\n  \"$_@contoso.com\"\n}","out":"Ada@contoso.com\nNoor@contoso.com","check":{"t":"predict","code":"1..4 | ForEach-Object { $_ + 1 }","choices":["5","2\n3\n4\n5","1\n2\n3\n4"],"a":1,"why":"Each number gets +1."}},{"h":"Property or plain value?","body":["`Select-Object N` keeps an object with an N property.","`-ExpandProperty N` gives just the plain value.","Use plain values in text and comparisons."],"code":"$o = [PSCustomObject]@{N='Ada'}\n$a = $o | Select-Object N\n\"[$a]\"\n$b = $o |\n  Select-Object -ExpandProperty N\n\"[$b]\"","out":"[@{N=Ada}]\n[Ada]","flow":[{"if":"Need just the value?","yes":"-ExpandProperty","no":"Select-Object Name"}],"check":{"t":"predict","code":"$o = [PSCustomObject]@{N='Bram'}\n$o |\n  Select-Object -ExpandProperty N","choices":["N","Bram","@{N=Bram}"],"a":1,"why":"-ExpandProperty unwraps the value."}},{"h":"Format-* goes last","body":["`Format-Table` and `Format-List` turn objects into screen layout.","After that, sorting, filtering or exporting no longer works right.","So: get, filter, shape, then format or export."],"flow":["Get","Filter","Shape","Format or Export (last)"]}],"qs":[{"t":"predict","code":"1..4 | ForEach-Object { $_ * 2 }","choices":["1\n2\n3\n4","2\n4\n6\n8","8"],"a":1,"why":"Each number is doubled."},{"t":"predict","code":"'Ada','Lien' | ForEach-Object {\n  $_.ToUpper()\n}","choices":["ADA\nLIEN","Ada\nLien","ADALIEN"],"a":0,"why":"One result per object, one per line."},{"t":"predict","code":"'Noor' | ForEach-Object {\n  \"Hi $_\"\n}","choices":["Hi $_","Hi","Hi Noor"],"a":2,"why":"Double quotes swap `$_` for Noor."},{"t":"predict"," er() }","{ $n.ToUpper() }"],"sol":"0,1,2,3","ok":["0,1,2,3"],"why":"Use `$_` for the current item, not the whole list."},{"t":"build","ask":"Export names and departments to a CSV","setup":"","target":"u.csv with two columns","tiles":["Get-MgUser -All -Property DisplayName,Department","|","Select-Object DisplayName,Department","|","Export-Csv u.csv","Format-Table"],"sol":"0,1,2,3,4","ok":["0,1,2,3,4","0,3,2,1,4"],"why":"Shape with Select-Object, then export. No Format-Table."},{"t":"order","lines":["ForEach-Object { $_.ToUpper() }","$names = 'ada','lien'","$names |"],"target":"Shows ADA and LIEN","sol":"1,2,0","ok":["1,2,0"],"why":"Make the list, pipe it, then the block."},{"t":"order","lines":["Export-Csv users.csv","Get-MgUser -All |","Select-Object DisplayName |"],"target":"Saves all display names to a CSV","sol":"1,2,0","ok":["1,2,0"],"why":"Get, shape, export."},{"t":"order","lines":["  \"Hello $_\"","1..2 | ForEach-Object {","}"],"target":"Shows Hello 1 and Hello 2","sol":"1,0,2","ok":["1,0,2"],"why":"Open the block, the action, close it."},{"t":"order","lines":["Format-Table Name, Id","Get-Process |","Select-Object Name, Id |"],"target":"Process names and IDs as a screen table","sol":"1,2,0","ok":["1,2,0"],"why":"Format always goes last."},{"t":"bug","lines":["Get-Process |","  Format-Table Name |","  Export-Csv procs.csv"],"bad":1,"fix":"  Select-Object Name |","expect":"CSV with process names","got":"CSV full of format junk","why":"Format-* output is layout, not data."},{"t":"bug","lines":["'ada','bram' | ForEach-Object {","  $names.ToUpper()","}"],"bad":1,"fix":"  $_.ToUpper()","expect":"ADA and BRAM","got":"Error: method on a null value","why":"$names doesn't exist. The current item is `$_`."},{"t":"bug","lines":["$o = [PSCustomObject]@{N='Lien'}","$n = $o | Select-Object N","\"User: $n\""],"bad":1,"fix":"$n = $o | Select-Object -ExpandProperty N","expect":"User: Lien","got":"User: @{N=Lien}","why":"Without -ExpandProperty you keep the wrapper object."},{"t":"bug","lines":["1..3 | ForEach-Object {","  _ * 2","}"],"bad":1,"fix":"  $_ * 2","expect":"2, 4, 6","got":"Error: term '_' not recognized","why":"The variable is `$_`, with the dollar."}]},{"id":"where","title":"Filtering with Where","sub":"Where-Object, short syntax, filter left","cards":[{"h":"Keep only what matches","body":["`Where-Object { test }` runs the test on each object.","True: it passes on. False: it's dropped."],"code":"1..6 | Where-Object { $_ -gt 4 }","out":"5\n6","flow":["Object in",{"if":"Test is True?","yes":"Pass it on","no":"Drop it"}],"check":{"t":"predict","code":"'Ada','Bram','Noor' |\n  Where-Object { $_ -like '*a*' }","choices":["Ada","Bram","Ada\nBram"],"a":2,"why":"-like ignores case, so Ada counts too."}},{"h":"Test a property","body":["Most objects have properties: test them with `$_.Property`.","e.g. `$_.Department -eq 'Sales'`."],"code":"'Ada','Lien','Bram' |\n  Where-Object { $_.Length -eq 4 }","out":"Lien\nBram","check":{"t":"predict","code":"'Ada','Noor' |\n  Where-Object { $_.Length -gt 5 }","choices":["Noor","False\nFalse","(nothing shown)"],"a":2,"why":"Nothing passes, so nothing is shown."}},{"h":"Short syntax","body":["For one simple test, skip `{ }` and `$_`: `Where-Object Enabled -eq $true`.","Need `-and` or `-or`? Go back to `{ }`."],"code":"'Ada','Bram' |\n  Where-Object Length -eq 3","out":"Ada","check":{"t":"predict","code":"'Ada','Lien' |\n  Where-Object Length -gt 3","choices":["Lien","Ada","Ada\nLien"],"a":0,"why":"Only Lien is longer than 3."}},{"h":"Several conditions","body":["Inside `{ }` combine tests with `-and` / `-or`."],"code":"1..10 | Where-Object {\n  $_ -gt 3 -and $_ -lt 6\n}","out":"4\n5","check":{"t":"predict","code":"1..5 | Where-Object {\n  $_ -lt 2 -or $_ -gt 4\n}","choices":["1\n2\n4\n5","1\n5","2\n3\n4"],"a":1,"why":"Either side True is enough."}},{"h":"Filter left","body":["Ask the source for less: `Get-MgUser -Filter ...`, `Get-ChildItem -Filter *.csv`.","The server sends only matches. `Where-Object` downloads everything first, then drops most."],"code":"Get-ChildItem -Filter *.csv","out":"(only the .csv files in this folder)","flow":[{"if":"Source has -Filter?","yes":"Use -Filter (fast)","no":"Use Where-Object"}]}],"qs":[{"t":"predict","code":"1..10 | Where-Object { $_ % 5 -eq 0 }","choices":["2","0\n0","5\n10"],"a":2,"why":"Only 5 and 10 divide by 5."},{"t":"predict","code":"'Sales','Helpdesk','IT' |\n  Where-Object { $_ -like 'h*' }","choices":["(nothing shown)","Sales\nHelpdesk","Helpdesk"],"a":2,"why":"-like ignores case; only Helpdesk starts with h."},{"t":"predict","code":"'Ada','Bram','Lien' |\n  Where-Object Length -ne 4","choices":["Bram\nLien","Ada\nBram\nLien","Ada"],"a":2,"why":"Only Ada isn't 4 letters."},{"t":"predict","code":"$n = 3,8,1 | Where-Object { $_ -gt 2 }\n$n.Count","choices":["1","2","3"],"a":1,"why":"3 and 8 pass."},{"t":"predict","code":"'ada','Ada','ADA' |\n  Where-Object { $_ -ceq 'Ada' }","choices":["ada\nAda\nADA","(nothing shown)","Ada"],"a":2,"why":"-ceq checks case, so only exact Ada."},{"t":"predict","code":"1..4 | Where-Object { $_ -gt 9 }","choices":["0","(nothing shown)","False"],"a":1,"why":"Nothing passes, nothing is shown."},{"t":"predict","code":"$u = @(\n [pscustomobject]@{N='Ada';On=$true}\n [pscustomobject]@{N='Bram';On=$false}\n)\n($u | Where-Object On -eq $false).N","choices":["Ada","(nothing shown)","Bram"],"a":2,"why":"Only Bram has On = False."},{"t":"predict","code":"$big = 1..20 |\n  Where-Object { $_ -gt 15 }\n$big.Count","choices":["5","15","20"],"a":0,"why":"16, 17, 18, 19, 20."},{"t":"pick","ask":"Which keeps only enabled users (short syntax)?","choices":["Where-Object $_.Enabled = $true","Where-Object -Enabled $true","Where-Object Enabled -eq $true","Where-Object { Enabled -eq $true }"],"a":2,"why":"Short syntax: property, operator, value. No braces."},{"t":"pick","ask":"Which is fastest for disabled accounts in a big tenant?","choices":["Get-MgUser -All | Where-Object AccountEnabled -eq $false","Ge ":"Shows 3 and 4","choices":["-and","-or","&&",","],"ok":[0],"why":"Both must be True: -and."},{"t":"build","ask":"Keep numbers above 50","setup":"$n = 20,60,90","target":"Shows 60 and 90","tiles":["$n","|","Where-Object","{ $_ -gt 50 }","{ $_ > 50 }"],"sol":"0,1,2,3","ok":["0,1,2,3"],"why":"-gt compares; `>` redirects."},{"t":"build","ask":"Keep users in Sales (short syntax)","setup":"$u = Get-MgUser -All -Property DisplayName,Department","target":"Only the Sales users","tiles":["$u","|","Where-Object","Department","-eq","'Sales'","{"],"sol":"0,1,2,3,4,5","ok":["0,1,2,3,4,5"],"why":"Property, operator, value."},{"t":"build","ask":"Filter at the source: disabled users","setup":"","target":"Only disabled accounts come back","tiles":["Get-MgUser","-Filter","'accountEnabled eq false'","-All","|","Where-Object"],"sol":"0,1,2,3","ok":["0,1,2,3","0,3,1,2"],"why":"Parameters can be in any order, but -Filter needs its value right after it."},{"t":"build","ask":"Keep names with exactly 4 letters","setup":"$n = 'Ada','Lien','Noor'","target":"Shows Lien and Noor","tiles":["$n","|","Where-Object","Length","-eq","4","-and"],"sol":"0,1,2,3,4,5","ok":["0,1,2,3,4,5"],"why":"One test: short syntax is fine."},{"t":"order","lines":["  Where-Object { $_.Department -eq 'Sales' } |","Get-MgUser -All -Property DisplayName,Department |","  Select-Object DisplayName"],"target":"Display names of Sales users","sol":"1,0,2","ok":["1,0,2"],"why":"Get, filter, shape."},{"t":"order","lines":["}","1..20 | Where-Object {","  $_ % 2 -eq 0 -and $_ -gt 15"],"target":"Shows 16, 18, 20","sol":"1,2,0","ok":["1,2,0"],"why":"Open, test, close."},{"t":"order","lines":["$old | ForEach-Object { $_.Name }","$old = Get-ChildItem C:\\Logs |","  Where-Object LastWriteTime -lt '2026-01-01'"],"target":"Shows names of logs from before 2026","sol":"1,2,0","ok":["1,2,0"],"why":"Get, filter, then use."},{"t":"order","lines":["$u = Get-Mailbox -Filter \"DisplayName -like 'Ada*'\"","Connect-ExchangeOnline","$u.PrimarySmtpAddress"],"target":"Connect, find Ada's mailbox, show her address","sol":"1,0,2","ok":["1,0,2"],"why":"Connect first, always."},{"t":"bug","lines":["$u = Get-MgUser -All","$u | Where-Object AccountEnabled -eq $true"],"bad":0,"fix":"$u = Get-MgUser -All -Property DisplayName,AccountEnabled","expect":"Only enabled users","got":"(nothing shown)","why":"Get-MgUser returns few properties by default; AccountEnabled is empty unless you ask for it."},{"t":"bug","lines":["$n = 'Ada','Lien','Noor'","$n | Where-Object Length -eq 4 -and $_ -like 'n*'"],"bad":1,"fix":"$n | Where-Object { $_.Length -eq 4 -and $_ -like 'n*' }","expect":"Noor","got":"Error: parameter 'and' not found","why":"Short syntax can't combine tests."},{"t":"bug","lines":["'Ada','Bram' |","  Where-Object { $_ = 'Ada' }"],"bad":1,"fix":"  Where-Object { $_ -eq 'Ada' }","expect":"Ada","got":"(nothing shown)","why":"`=` stores instead of comparing."},{"t":"bug","lines":["Set-Location C:\\Reports","Get-ChildItem -Filter csv"],"bad":1,"fix":"Get-ChildItem -Filter *.csv","expect":"Lists all .csv files","got":"(nothing shown)","why":"Without `*` it only finds a file named exactly csv."}]},{"id":"shape","title":"Select, sort, count","sub":"Select-Object, Sort-Object, Measure, Group","cards":[{"h":"Select-Object: pick what you need","body":["`-First 3` / `-Last 3` keep a few objects.","`-Property Name,Mail` keeps only those properties.","`-ExpandProperty Name` gives the plain values."],"code":"1..10 | Select-Object -First 3","out":"1\n2\n3","check":{"t":"predict","code":"1..10 | Select-Object -Last 2","choices":["10","9\n10","1\n2"],"a":1,"why":"-Last takes from the end."}},{"h":"Calculated properties","body":["Make a new property on the fly: `@{n='Name'; e={ ... }}`.","`n` is the new name, `e` the code, using `$_`."],"code":"$s = 'ada' | Select-Object @{\n  n='Up'; e={ $_.ToUpper() }\n}\n$s.Up","out":"ADA","flow":["@{","n = 'NewName'","e = { $_.Something }","}"],"check":{"t":"predict","code":"$s = 'Noor' | Select-Object @{\n  n='Len'; e={ $_.Length }\n}\n$s.Len","choices":["4","Noor","Len"],"a":0,"why":"The new Len property holds the length."}},{"h":"Sort-Object","body":["Sorts small to big, A to Z. `-Descending` flips it.","`-Unique` also removes duplicates.","Sort by a property: `Sort-Object DisplayName`."],"code":"3,1,2 | Sort-Object -Descending","out":"3\n2\n1","check":{"t":"predict","code":"2,1,2,3 | Sort-Object -Unique","choices":["2\n1\n3","1\n2\n3","1\n2\n2\n3"],"a":1,"why":"Sorted, each value once."}},{"h":"Measure-Object: count and add","body":["`.Count` is how many objects came in.","`-Sum` adds the numbers up; read it with `.Sum`."],"code":"$m = 5,10,15 | Measure-Object -Sum\n$m.Count\n$m.Sum","out":"3\n30","check":{"t":"predict","code":"(1..4 | Measure-Object -Sum).Sum","choices":["1..4","10","4"],"a":1,"why":"1+2+3+4 = 10."}},{"h":"Group-Object: count per kind","body":["Puts equal values together.","Each group has `.Name` (the value) and `.Count` (how many)."],"code":"$g = 'Sales','IT','Sales' |\n  Group-Object\n$g.Count","out":"2","flow":["Sales, IT, Sales","Group-Object","Sales: 2 | IT: 1"],"check":{"t":"predict","code":"$g = 'IT','IT','Sales' |\n  Group-Object\n$it = $g | Where-Object Name -eq 'IT'\n$it.Count","choices":["2","3","1"],"a":0,"why":"The IT group has 2 items."}}],"qs":[{"t":"predict","code":"1..10 | Select-Object -First 2","choices":["1\n2","9\n10","2"],"a":0,"why":"-First takes from the start."},{"t":"predict","code":"'Bram','Ada','Lien' | Sort-Object","choices":["Ada\nBram\nLien","Lien\nBram\nAda","Bram\nAda\nLien"],"a":0,"why":"A to Z by default."},{"t":"predict","code":"'10','9','100' | Sort-Object","choices":["9\n10\n100","100\n10\n9","10\n100\n9"],"a":2,"why":"These are text, so they sort letter by letter: 1 before 9."},{"t":"predict","code":"10,9,100 | Sort-Object","choices":["10\n100\n9","100\n10\n9","9\n10\n100"],"a":2,"why":"Real numbers sort by size."},{"t":"predict","code":"(5,5,7 | Sort-Object -Unique).Count","choices":["1","2","3"],"a":1,"why":"5 and 7 are left."},{"t":"predict","code":"(2,4,6 | Measure-Object -Sum).Sum","choices":["12","3","6"],"a":0,"why":"2+4+6."},{"t":"predict","code":"('a','b','c' | Measure-Object).Count","choices":["3","1","abc"],"a":0,"why":"Three objects came in."},{"t":"predict","code":"$g = 'IT','Sales','IT','IT' |\n  Group-Object |\n  Sort-Object Count -Descending\n$g[0].Name","choices":["3","IT","Sales"],"a":1,"why":"IT has the biggest Count, so it's first."},{"t":"predict","code":"$o = [PSCustomObject]@{N='ada'}\n$s = $o | Select-Object @{\n  n='Mail'; e={ \"$($_.N)@contoso.com\" }\n}\n$s.Mail","choices":["ada@contoso.com","$($_.N)@contoso.com","@contoso.com"],"a":0,"why":"The calculated property builds the address."},{"t":"predict","code":"1..5 | Sort-Object -Descending |\n  Select-Object -First 2","choices":["5\n4","1\n2","4\n5"],"a":0,"why":"Biggest first, then take two."},{"t":"pick","ask":"Which shows the 5 newest files?","choices":["Get-ChildItem | Select-Object -First 5 | Sort-Object LastWriteTime -Descending","Get-ChildItem | Sort-Object LastWriteTime | Select-Object -First 5","Get-ChildItem | Sort-Object LastWriteTime -Descending | Select-Object -First 5"],"a":2,"why":"Sort newest first, then take 5. Taking 5 first sorts the wrong 5."},{"t":"pick","ask":"Which counts users per department?","choices":["$u | Sort-Object Department -Unique","$u | Select-Object Department","$u | Group-Object Department","$u | Measure-Object Department"],"a":2,"why":"Group-Object gives a Count for each value."},{"t":"pick","ask":"Which gives the number of mailboxes?","choices":["(Get-Mailbox -ResultSize Unlimited | Measure-Object).Count","Get-Mailbox | Measure-Object -Sum","Get-Mailbox -Count"],"a":0,"why":"Measure-Object counts what comes in; -ResultSize Unlimited gets them all."},{"t":"pick","ask":"Which keeps only the DisplayName and Department columns?","choices":["Sort-Object DisplayName,Department","Select-Object DisplayName,Department","Select-Object -ExpandProperty DisplayName,Department"],"a":1,"why":"-ExpandProperty takes only one property."},{"t":"pick","ask":"Which adds a column Low with the mail in lowercase?","choices":["Select-Object @{n='Low'; e={ $_.Mail.ToLower() }}","Select-Object @{n='Low'; e= $_.Mail.ToLower() }","Select-Object Low = $_.Mail.ToLower()"],"a":0,"why":"`e` needs a `{ }` block so `$_` is filled in for each object."},{"t":"fill","code":"1..10 | Select-Object ___ 3","target":"Shows 8, 9, 10","choices":["-Last","-First","-Skip"],"ok":[0],"why":"-Last takes from the end."},{"t":"fill","code":"'b','c','a' | Sort-Object ___","target":"Shows c, b, a","choices":["-Descending","-Unique","-Reverse"],"ok":[0],"why":"There is no -Reverse; use -Descending."},{"t":"fill","code":"$total = (3,4,5 | Measure-Object ___).Sum","target":"$total is 12","choices":["-Sum","-Count","-Total"],"ok":[0],"why":"-Sum fills the .Sum result."},{"t":"fill","code":"$g = 'IT','Sales','IT' | Group-Object\n($g | Where-Object Name -eq 'IT').___","target":"Shows 2","choices":["Count","Name","Length"],"ok":[0],"why":"A group's Count is how many items are in it."},{"t":"fill","code":"Get-MgUser -All |\n  Select-Object @{n='Upn'; e={ ___ }}","target":"Adds a Upn column with each UPN","choices":["$_.UserPrincipalName","$PSItem.UserPrincipalName","UserPrincipalName","$u.UserPrincipalName"],"ok":[0,1],"why":"Inside `e={ }` the current user is `$_` or `$PSItem`."},{"t":"build","ask":"Show the top 3 numbers","setup":"$n = 4,9,1,7,3","target":"Shows 9, 7, 4","tiles":["$n","|","Sort-Object","-Descending","|","Select-Object","-First 3","-Last 3"],"sol":"0,1,2,3,4,5,6","ok":["0,1,2,3,4,5,6","0,4,2,3,1,5,6"],"why":"Sort biggest first, then take 3."},{"t":"build","ask":"Count the users","setup":"$u = Get-MgUser -All","target":"Shows how many users","tiles":["(","$u","|","Measure-Object",").Count",").Sum"],"sol":"0,1,2,3,4","ok":["0,1,2,3,4"],"why":"Wrap the pipeline in `( )` and read .Count."},{"t":"build","ask":"Count per department","setup":"$u = Get-MgUser -All -Property Department","target":"One group per department","tiles":["$u","|","Group-Object","Department","Measure-Object"],"sol":"0,1,2,3","ok":["0,1,2,3"],"why":"Group-Object by the property."},{"t":"build","ask":"List each department once, A to Z","setup":"$u = Get-MgUser -All -Property Department","target":"Each department once","tiles":["$u.Department","|","Sort-Object","-Unique","-Descending"],"sol":"0,1,2,3","ok":["0,1,2,3"],"why":"-Unique drops repeats; default sort is A to Z."},{"t":"order","lines":["  Select-Object -First 3","  Sort-Object -Descending |","5,1,9,3 |"],"target":"Shows 9, 5, 3","sol":"2,1,0","ok":["2,1,0"],"why":"Sort before you take."},{"t":"order","lines":["$d = 'IT','Sales','IT'","$g.Count","$g = $d | Group-Object"],"target":"Shows 2","sol":"0,2,1","ok":["0,2,1"],"why":"Two groups: IT and Sales."},{"t":"order","lines":["$sum = $n | Measure-Object -Sum","$n = 1..10","$sum.Sum"],"target":"Shows 55","sol":"1,0,2","ok":["1,0,2"],"why":"1 + 2 + ... + 10 = 55."},{"t":"order","lines":["  Sort-Object DisplayName |","Get-MgUser -All |","  Select-Object DisplayName -First 10"],"target":"First 10 users, A to Z","sol":"1,0,2","ok":["1,0,2"],"why":"Get, sort, then take 10."},{"t":"bug","lines":["1..10 |","  Sort-Object |","  Select-Object -First 3"],"bad":1,"fix":"  Sort-Object -Descending |","expect":"10, 9, 8","got":"1, 2, 3","why":"Default sort is small to big."},{"t":"bug","lines":["$d = 'IT','Sales','IT'","($d | Measure-Object -Sum).Sum"],"bad":1,"fix":"($d | Measure-Object).Count","expect":"3","got":"Error: input is not numeric","why":"-Sum only works on numbers."},{"t":"bug","lines":["$o = [PSCustomObject]@{N='ada'}","$o | Select-Object @{n='Up'; e=$_.N.ToUpper()}"],"bad":1,"fix":"$o | Select-Object @{n='Up'; e={$_.N.ToUpper()}}","expect":"An object with Up = ADA","got":"Error: method on a null value","why":"`e` needs `{ }`; without it `$_` is empty."},{"t":"bug","lines":["$n = '10','9','100'","$n | Sort-Object"],"bad":0,"fix":"$n = 10,9,100","expect":"9, 10, 100","got":"10, 100, 9","why":"Quoted numbers are text and sort letter by letter."}]},{"id":"output","title":"Output and CSV","sub":"Write-Output, Out-File, Export/Import-Csv","cards":[{"h":"Write-Output vs Write-Host","body":["`Write-Output` sends objects down the pipeline; you can store them.","`Write-Host` only paints text on screen. Nothing to store or pipe."],"code":"$a = Write-Output 'hi'\n$b = Write-Host 'yo'\n$a","out":"yo\nhi","flow":[{"if":"Will a variable, pipe or file use it?","yes":"Write-Output","no":"Write-Host"}],"check":{"t":"predict","code":"$r = Write-Host 'Hi'\n$null -eq $r","choices":["Hi\nTrue","True","Hi\nFalse"],"a":0,"why":"Hi goes to the screen; $r stays empty."}},{"h":"Out-File: save text","body":["Saves what you'd see on screen into a text file.","It overwrites. Add `-Append` to add to the end."],"code":"'one' | Out-File n.txt\n'two' | Out-File n.txt -Append\nGet-Content n.txt","out":"one\ntwo","check":{"t":"predict","code":"'a' | Out-File x.txt\n'b' | Out-File x.txt\nGet-Content x.txt","choices":["a","b","a\nb"],"a":1,"why":"Without -Append the file is replaced."}},{"h":"Export-Csv: save objects","body":["Each object is a row, each property a column.","pwsh 7 writes no type line. In Windows PowerShell 5.1 add `-NoTypeInformation`."],"code":"Get-MgUser -All |\n  Select-Object DisplayName,Mail |\n  Export-Csv users.csv","out":"(nothing shown; users.csv is created)","flow":["Get","Select-Object columns","Export-Csv"]},{"h":"Import-Csv: rows become objects","body":["Each row is an object; headers become property names.","All values come back as text.","Belgian Excel uses `;`: add `-Delimiter ';'`."],"code":"'Name;Dept','Ada;Sales' |\n  Set-Content u.csv\n$r = Import-Csv u.csv -Delimiter ';'\n$r.Dept","out":"Sales","check":{"t":"predict","code":"'Name;Dept','Ada;Sales' |\n  Set-Content u.csv\n$r = Import-Csv u.csv\n$r.Dept","choices":["(nothing shown)","Sales","Ada;Sales"],"a":0,"why":"Without -Delimiter ';' there is one column named Name;Dept, so no Dept."}},{"h":"Format-Table: the very last step","body":["`Format-Table` is for your eyes only.","Never put it before Export-Csv, Out-File or Sort-Object."],"flow":["Get","Where-Object","Select / Sort",{"if":"Save it?","yes":"Export-Csv","no":"Format-Table"}]}],"qs":[{"t":"predict","code":"$x = Write-Output 'Ada'\n$x.Length","choices":["3","(nothing shown)","Ada"],"a":0,"why":"Write-Output stores the text in $x."},{"t":"predict","code":"$x = Write-Host 'Ada'\n\"[$x]\"","choices":["[Ada]","Ada\n[Ada]","Ada\n[]"],"a":2,"why":"Write-Host paints Ada; $x stays empty."},{"t":"predict","code":"'Ada','Bram' | Out-File n.txt\n(Get-Content n.txt).Count","choices":["1","0","2"],"a":2,"why":"One line per item."},{"t":"predict","code":"'x' | Out-File l.txt\n'y' | Out-File l.txt -Append\n'z' | Out-File l.txt\nGet-Content l.txt","choices":["x\ny\nz","y\nz","z"],"a":2,"why":"The last Out-File without -Append wipes the file."},{"t":"predict","code":"[PSCustomObject]@{N=5} |\n  Export-Csv t.csv\n$r = Import-Csv t.csv\n$r.N + 1","choices":["Error: cannot add","51","6"],"a":1,"why":"CSV values come back as text, so + glues."},{"t":"predict","code":"'Name,Dept','Ada,Sales','Bram,IT' |\n  Set-Content u.csv\n(Import-Csv u.csv).Count","choices":["1","2","3"],"a":1,"why":"The header row is not a data row."},{"t":"predict","code":"'Name,Dept','Ada,Sales','Bram,IT' |\n  Set-Content u.csv\n$r = Import-Csv u.csv\n$r[1].Name","choices":["Ada","Name","Bram"],"a":2,"why":"[1] is the second data row."},{"t":"predict","code":"'Name;Dept','Noor;IT' |\n  Set-Content u.csv\n$r = Import-Csv u.csv -Delimiter ';'\n$r.Name","choices":["Noor;IT","(nothing shown)","Noor"],"a":2,"why":"With the right delimiter the columns split."},{"t":"pick","ask":"Which saves users so Excel shows them as columns?","choices":["Get-MgUser -All | Format-Table DisplayName,Mail | Export-Csv u.csv","Get-MgUser -All | Out-File u.csv","Get-MgUser -All | Select-Object DisplayName,Mail | Export-Csv u.cs
