es":["Set-MailboxAutoReplyConfiguration -Identity $u -AutoReplyState Enabled -InternalMessage $msg","$msg = \"$name has left. Mail Noor.\"","$name = 'Ada'","$u = 'ada@contoso.com'"],"target":"Turns on Ada's auto-reply","sol":"3,2,1,0","ok":["3,2,1,0","2,3,1,0","2,1,3,0"],"why":"$name before $msg, and both $u and $msg before the cmdlet. $u can go anywhere before it."},{"t":"bug","lines":["$u = 'ada@contoso.com'","Set-Mailbox -Identity $u -EmailAddresses 'smtp:ada.v@contoso.com'"],"bad":1,"fix":"Set-Mailbox -Identity $u -EmailAddresses @{Add='smtp:ada.v@contoso.com'}","expect":"Adds an alias, keeps the rest","got":"Tries to replace the whole address list","why":"Plain text sets the full list. @{Add=...} adds one."},{"t":"bug","lines":["$h = 'helpdesk@contoso.com'","Add-RecipientPermission -Identity $h -User noor@contoso.com -AccessRights SendAs -Confirm:$false"],"bad":1,"fix":"Add-RecipientPermission -Identity $h -Trustee noor@contoso.com -AccessRights SendAs -Confirm:$false","expect":"Noor can send as Helpdesk","got":"Error: parameter User not found","why":"This cmdlet uses -Trustee."},{"t":"bug","lines":["$h = 'helpdesk@contoso.com'","Add-RecipientPermission -Identity $h -Trustee bram@contoso.com -AccessRights FullAccess -Confirm:$false"],"bad":1,"fix":"Add-RecipientPermission -Identity $h -Trustee bram@contoso.com -AccessRights SendAs -Confirm:$false","expect":"Bram can send as Helpdesk","got":"Error: FullAccess is not a valid AccessRights value","why":"Add-RecipientPermission only takes SendAs. FullAccess belongs to Add-MailboxPermission."},{"t":"bug","lines":["Set-Mailbox -Identity lien@contoso.com -Type SharedMailbox","Get-EXOMailbox -Identity lien@contoso.com"],"bad":0,"fix":"Set-Mailbox -Identity lien@contoso.com -Type Shared","expect":"Lien's mailbox is shared","got":"Error: SharedMailbox is not a valid Type","why":"-Type takes Shared."},{"t":"bug","lines":["$u = 'ada@contoso.com'","Set-MailboxAutoReplyConfiguration -Identity $u -AutoReplyState On"],"bad":1,"fix":"Set-MailboxAutoReplyConfiguration -Identity $u -AutoReplyState Enabled","expect":"Auto-reply turns on","got":"Error: On is not a valid value","why":"Use Enabled."},{"t":"bug","lines":["$a = 'SMTP:ada@contoso.com','smtp:ada.v@contoso.com'","$a | Where-Object { $_ -like 'SMTP:*' }"],"bad":1,"fix":"$a | Where-Object { $_ -clike 'SMTP:*' }","expect":"SMTP:ada@contoso.com","got":"Both addresses","why":"-like ignores case. -clike checks it."}]},{"id":"groups","title":"Distribution groups","sub":"Members, Update, Compare-Object","cards":[{"h":"Look at a group","body":["`Get-DistributionGroup -Identity Sales` shows the group itself.","`Get-DistributionGroupMember` shows who is in it. It also stops at 1000, so add `-ResultSize Unlimited`."],"code":"$m = Get-DistributionGroupMember `\n  -Identity Sales -ResultSize Unlimited\n$m.PrimarySmtpAddress","out":"One address per line"},{"h":"Add and remove one person","body":["`Add-DistributionGroupMember -Identity Sales -Member ada@contoso.com`.","`-Identity` is the group, `-Member` (no s) is the person.","Remove asks Yes/No, so add `-Confirm:$false` in scripts."],"code":"Remove-DistributionGroupMember `\n  -Identity Sales `\n  -Member bram@contoso.com `\n  -Confirm:$false","out":"(nothing shown)","check":{"t":"predict","code":"$m = 'ada@contoso.com','bram@contoso.com'\n$m -contains 'noor@contoso.com'","choices":["True","False","noor@contoso.com"],"a":1,"why":"Noor is not in the list. Good check before you add someone."}},{"h":"Not an owner? Bypass","body":["If you are not in the group's owners list, changes fail even as admin.","Add `-BypassSecurityGroupManagerCheck` to make the change anyway."],"code":"Add-DistributionGroupMember `\n  -Identity Sales `\n  -Member ada@contoso.com `\n  -BypassSecurityGroupManagerCheck","out":"(nothing shown)","flow":[{"if":"Are you a group owner?","yes":"Run as normal","no":"Add -BypassSecurityGroupManagerCheck"}]},{"h":"Update replaces everybody","body":["`Update-DistributionGroupMember -Members` sets the WHOLE list.","Anyone not in your list is removed. Use it only when your list is complete."],"code":"$list = 'ada@contoso.com',\n  'lien@contoso.com'\nUpdate-DistributionGroupMember `\n  -Identity Sales -Members $list `\n  -Confirm:$false","out":"(nothing shown)","check":{"t":"predict","code":"$now = 'Ada','Bram','Noor'\n$new = 'Lien'\n$now = $new\n$now.Count","choices":["4","1","3"],"a":1,"why":"The old list is replaced, not added to. Update works the same way."}},{"h":"Compare two lists","body":["`Compare-Object $now $want` shows only the differences.","`<=` means only in the first list. `=>` means only in the second."],"code":"$now = 'Ada','Bram','Noor'\n$want = 'Ada','Bram'\n(Compare-Object $now $want).InputObject","out":"Noor","check":{"t":"predict","code":"$now = 'Ada','Bram','Noor'\n$want = 'Ada','Bram'\n(Compare-Object $now $want).SideIndicator","choices":["=>","<=","=="],"a":1,"why":"Noor is only in $now, the first list. The arrow points left."}},{"h":"Turn the diff into actions","body":["`=>`: should be in, is not. Add them.","`<=`: is in, should not be. Remove them."],"code":"$now = 'Ada','Bram'\n$want = 'Ada','Bram','Lien'\n$d = Compare-Object $now $want\n$add = $d | Where-Object SideIndicator -eq '=>'\n$add.InputObject","out":"Lien","flow":[{"if":"SideIndicator is =>?","yes":"Add-DistributionGroupMember","no":"Remove-DistributionGroupMember"}]}],"qs":[{"t":"predict","code":"$now = 'Ada','Bram'\n$want = 'Ada','Bram','Lien'\n(Compare-Object $now $want).SideIndicator","choices":["<=","=>","=="],"a":1,"why":"Lien is only in $want, the second list. The arrow points right."},{"t":"predict","code":"$now = 'Ada','Bram','Noor'\n$want = 'Ada','Bram'\n(Compare-Object $now $want).InputObject","choices":["Ada\nBram","(nothing shown)","Noor"],"a":2,"why":"Only differences come out. Noor is the only one not in both."},{"t":"predict","code":"$a = 'Ada','Bram'\n$b = 'Bram','Ada'\nCompare-Object $a $b","choices":["(nothing shown)","Ada\nBram","Error: lists differ"],"a":0,"why":"Same names, just another order. No differences, so nothing is shown."},{"t":"predict","code":"$m = 'ada@contoso.com','bram@contoso.com'\n$m -contains 'bram@contoso.com'","choices":["False","True","bram@contoso.com"],"a":1,"why":"Bram is in the list."},{"t":"pick","ask":"Which command lists every Sales member, even past 1000?","choices":["Get-DistributionGroup -Identity Sales -ResultSize Unlimited","Get-DistributionGroupMember -Identity Sales -All","Get-DistributionGroupMember -Identity Sales -ResultSize Unlimited","Get-MgGroupMember -GroupId Sales"],"a":2,"why":"GroupMember gets the people. Exchange uses -ResultSize Unlimited, not -All."},{"t":"pick","ask":"Which command adds Ada to Sales?","choices":["Add-DistributionGroupMember -Identity Sales -Member ada@contoso.com","Add-DistributionGroupMember -Identity Sales -Members ada@contoso.com","Add-DistributionGroupMember -Identity ada@contoso.com -Member Sales","Set-DistributionGroup -Identity Sales -Member ada@contoso.com"],"a":0,"why":"-Identity is the group, -Member is the person. Add uses -Member without s."},{"t":"pick","ask":"Which command removes Bram from Sales without a prompt?","choices":["Remove-DistributionGroup -Identity Sales -Confirm:$false","Update-DistributionGroupMember -Identity Sales -Members bram@contoso.com -Confirm:$false","Remove-DistributionGroupMember -Identity bram@contoso.com -Member Sales -Confirm:$false","Remove-DistributionGroupMember -Identity Sales -Member bram@contoso.com -Confirm:$false"],"a":3,"why":"Remove-DistributionGroup deletes the whole group. Update would leave only Bram."},{"t":"pick","ask":"You are not an owner of Helpdesk. Which switch lets the change go through?","choices":["-Force","-BypassSecurityGroupManagerCheck","-Confirm:$false","-SkipOwnerCheck"],"a":1,"why":"-BypassSecurityGroupManagerCheck skips the owner check."},{"t":"pick","ask":"Which command makes Sales contain exactly Ada and Lien?","choices":["Add-DistributionGroupMember -Identity Sales -Member ada@contoso.com,lien@contoso.com","Update-DistributionGroupMember -Identity Sales -Members ada@contoso.com,lien@contoso.com -Confirm:$false","Set-DistributionGroup -Identity Sales -Members ada@contoso.com,lien@contoso.com","Get-DistributionGroupMember -Identity Sales -Members ada@contoso.com,lien@contoso.com"],"a":1,"why":"Update replaces the full list. Add only adds one person."},{"t":"pick","ask":"$d = Compare-Object $now $want. Which line keeps the people who still need to be added?","choices":["$d | Where-Object SideIndicator -eq '<='","$d | Where-Object SideIndicator -eq '=='","$d | Where-Object SideIndicator -eq '=>'"],"a":2,"why":"=> means only in $want: they should be in but are not yet."},{"t":"fill","code":"Get-DistributionGroupMember -Identity Sales ___","target":"Lists every member, even past 1000","choices":["-All","-ResultSize Unlimited","-First 1000"],"ok":[1],"why":"Same rule as Get-EXOMailbox."},{"t":"fill","code":"Add-DistributionGroupMember -Identity Sales ___ lien@contoso.com","target":"Adds Lien to Sales","choices":["-Members","-User","-Member","-Identity"],"ok":[2],"why":"Add and Remove use -Member."},{"t":"fill","code":"Update-DistributionGroupMember -Identity Helpdesk ___ $list -Confirm:$false","target":"Sets Helpdesk to exactly the people in $list","choices":["-Members","-User","-Add"],"ok":[0],"why":"Update uses -Members, with an s. It takes the whole list."},{"t":"fill","code":"$d = Compare-Object $now $want\n$d | Where-Object SideIndicator -eq '___'","target":"People in the group now who should leave","choices":["=>","<=","=="],"ok":[1],"why":"<= means only in $now, the first list."},{"t":"fill","code":"Remove-DistributionGroupMember -Identity Sales -Member noor@contoso.com ___","target":"Removes Noor with no Yes/No prompt","choices":["-Force","-WhatIf","-Confirm:$false"],"ok":[2],"why":"-Confirm:$false skips the prompt. -WhatIf would change nothing."},{"t":"fill","code":"Add-DistributionGroupMember -Identity Sales -Member ada@contoso.com ___","target":"Works even though you are not a group owner","choices":["-BypassSecurityGroupManagerCheck","-Confirm:$false","-Force"],"ok":[0],"why":"The owner check needs its own switch."},{"t":"build","ask":"Add Noor to Helpdesk.","setup":"","target":"Noor becomes a member of Helpdesk","tiles":["Add-DistributionGroupMember","-Identity Helpdesk","-Member noor@contoso.com","-Members noor@contoso.com"],"sol":"0,1,2","ok":["0,1,2","0,2,1"],"why":"Add uses -Member."},{"t":"build","ask":"Remove Bram from Sales with no prompt.","setup":"","target":"Bram leaves Sales","tiles":["Remove-DistributionGroupMember","-Identity Sales","-Member bram@contoso.com","-Confirm:$false","Remove-DistributionGroup"],"sol":"0,1,2,3","ok":["0,1,2,3","0,1,3,2","0,2,1,3","0,2,3,1","0,3,1,2","0,3,2,1"],"why":"Remove-DistributionGroup would delete the group itself."},{"t":"build","ask":"Show just the addresses of all Sales members.","setup":"","target":"Plain list of addresses","tiles":["Get-DistributionGroupMember","-Identity Sales","-ResultSize Unlimited","|","Select-Object -ExpandProperty PrimarySmtpAddress","Get-DistributionGroup"],"sol":"0,1,2,3,4","ok":["0,1,2,3,4","0,2,1,3,4"],"why":"-ExpandProperty gives the plain values."},{"t":"build","ask":"Find who is in $want but not in $now.","setup":"$now = 'Ada','Bram'\n$want = 'Ada','Bram','Lien'","target":"Shows the row for Lien","tiles":["Compare-Object","$now","$want","|","Where-Object SideIndicator -eq '=>'","Where-Object SideIndicator -eq '<='"],"sol":"0,1,2,3,4","ok":["0,1,2,3,4"],"why":"Only in the second list means =>."},{"t":"build","ask":"Replace all Sales members with $list.","setup":"$list = 'ada@contoso.com','lien@contoso.com'","target":"Sales has exactly Ada and Lien","tiles":["Update-DistributionGroupMember","-Identity Sales","-Members $list","-Confirm:$false","Add-DistributionGroupMember"],"sol":"0,1,2,3","ok":["0,1,2,3","0,1,3,2","0,2,1,3","0,2,3,1","0,3,1,2","0,3,2,1"],"why":"Update sets the whole list."},{"t":"order","lines":["$d = Compare-Object $now $want","$want = 'Ada','Lien'","$now = 'Ada','Bram'","$d.Count"],"target":"Shows 2","sol":"2,1,0,3","ok":["2,1,0,3","1,2,0,3"],"why":"Both lists first, then compare, then count. Bram and Lien differ."},{"t":"order","lines":["  Add-DistributionGroupMember -Identity Sales -Member $_.InputObject }","$d = Compare-Object $now $want","$d | Where-Object SideIndicator -eq '=>' | ForEach-Object {"],"target":"Adds everyone who is missing to Sales","sol":"1,2,0","ok":["1,2,0"],"why":"Compare, keep the => rows, add each one."},{"t":"order","lines":["Get-DistributionGroupMember -Identity Sales -ResultSize Unlimited","Connect-ExchangeOnline -UserPrincipalName admin@contoso.com","Add-DistributionGroupMember -Identity Sales -Member ada@contoso.com"],"target":"Connects, adds Ada, then checks the list","sol":"1,2,0","ok":["1,2,0"],"why":"Connect first, check last."},{"t":"order","lines":["$want = (Import-Csv .\\sales.csv).Email","Compare-Object $now $want","$now = (Get-DistributionGroupMember -Identity Sales -ResultSize Unlimited).PrimarySmtpAddress"],"target":"Shows the difference between Sales and the CSV","sol":"2,0,1","ok":["2,0,1","0,2,1"],"why":"Both lists must exist before Compare-Object. Their order does not matter."},{"t":"bug","lines":["$u = 'ada@contoso.com'","Add-DistributionGroupMember -Identity Sales -Members $u"],"bad":1,"fix":"Add-DistributionGroupMember -Identity Sales -Member $u","expect":"Ada joins Sales","got":"Error: parameter Members not found","why":"Add uses -Member. Only Update uses -Members."},{"t":"bug","lines":["$m = Get-DistributionGroupMember -Identity Sales","$m.Count"],"bad":0,"fix":"$m = Get-DistributionGroupMember -Identity Sales -ResultSize Unlimited","expect":"1200 (all members)","got":"1000 and a warning","why":"Without -ResultSize Unlimited it stops at 1000."},{"t":"bug","lines":["$list = 'lien@contoso.com'","Update-DistributionGroupMember -Identity Sales -Members $list -Confirm:$false"],"bad":1,"fix":"Add-DistributionGroupMember -Identity Sales -Member $list","expect":"Lien is added to Sales","got":"Sales now has only Lien","why":"Update replaces everyone. To add one person, use Add."},{"t":"bug","lines":["$now = 'Ada','Bram','Noor'","$want = 'Ada','Bram'","$d = Compare-Object $now $want","($d | Where-Object SideIndicator -eq '=>').InputObject"],"bad":3,"fix":"($d | Where-Object SideIndicator -eq '<=').InputObject","expect":"Noor (who should leave)","got":"(nothing shown)","why":"Noor is only in $now, the first list, so her row has <=."},{"t":"bug","lines":["$u = 'bram@contoso.com'","Add-DistributionGroupMember -Identity Helpdesk -Member $u"],"bad":1,"fix":"Add-DistributionGroupMember -Identity Helpdesk -Member $u -BypassSecurityGroupManagerCheck","expect":"Bram joins Helpdesk","got":"Error: you are not a manager of this group","why":"You are not an owner. The bypass switch fixes that."}]},{"id":"graph","title":"Microsoft Graph","sub":"Connect-MgGraph, Get-MgUser, OData","cards":[{"h":"Connect with scopes","body":["`Connect-MgGraph -Scopes` says what you want to be allowed to do.","`User.Read.All` reads users. To change them you need `User.ReadWrite.All`.","`Get-MgContext` shows who you are and which scopes you got."],"code":"Connect-MgGraph -Scopes 'User.Read.All'\n(Get-MgContext).Account","out":"A welcome message, then admin@contoso.com","flow":["Connect-MgGraph -Scopes","Get-MgContext","Get / Update cmdlets"],"check":{"t":"predict","code":"$s = 'User.Read.All','Group.Read.All'\n$s -contains 'User.ReadWrite.All'","choices":["False","True","User.ReadWrite.All"],"a":0,"why":"Read is not ReadWrite. With these scopes you cannot change users."}},{"h":"Get-MgUser","body":["`-UserId` gets one user. `-Filter` gets matches. `-All` gets everyone.","Without `-All` you get only the first 100."],"code":"Get-MgUser -UserId ada@contoso.com","out":"Ada's DisplayName, Id, Mail and UserPrincipalName"},{"h":"-Property: ask or get nothing","body":["Graph only returns a few properties. Others come back empty.","Ask with `-Property`, then show them with `Select-Object`."],"code":"$p = 'DisplayName','Department'\nGet-MgUser -UserId ada@contoso.com `\n  -Property $p |\n  Select-Object $p","out":"Ada's DisplayName and Department","check":{"t":"predict","code":"$u = [pscustomobject]@{\n  DisplayName = 'Ada'\n  Department = $null\n}\n$u.Department","choices":["Department","(nothing shown)","Error: property not found"],"a":1,"why":"That is what you see when you forget -Property: an empty value, no error."}},{"h":"OData filter syntax","body":["Graph filters use OData: `eq`, `ne`, `startsWith(...)`. No dash.","Text goes in single quotes. True and false are plain lowercase words."],"code":"$f = 'accountEnabled eq false'\nGet-MgUser -Filter $f -All","out":"Every blocked user","flow":[{"if":"Graph cmdlet?","yes":"eq, ne, startsWith","no":"-eq, -ne, -like"}],"check":{"t":"predict","code":"$d = 'Sales'\n\"department eq '$d'\"","choices":["department -eq 'Sales'","department eq '$d'","department eq 'Sales'"],"a":2,"why":"Double quotes fill in $d. The eq stays as you typed it."}},{"h":"Advanced filters need two extras","body":["Some filters, like `endsWith`, only work with `-ConsistencyLevel eventual`.","Add `-CountVariable n` too. Write the name without `$`. Afterwards `$n` holds the count."],"code":"$f = \"endsWith(mail,'@contoso.com')\"\nGet-MgUser -Filter $f -All `\n  -ConsistencyLevel eventual `\n  -CountVariable n\n$n","out":"The users, then a number: how many matched"},{"h":"Change users and groups","body":["`Update-MgUser -AccountEnabled:$false` blocks sign-in. It is a switch, so use the colon.","Groups use Ids: `Get-MgGroupMember -GroupId` and `New-MgGroupMember -GroupId -DirectoryObjectId`."],"code":"New-MgGroupMember -GroupId $g.Id `\n  -DirectoryObjectId $u.Id","out":"(nothing shown)","check":{"t":"predict","code":"$g = [pscustomobject]@{\n  Id = '1a2b'\n  DisplayName = 'Sales'\n}\n$g.Id","choices":["Sales","1a2b","(nothing shown)"],"a":1,"why":"Graph wants the Id, not the display name."}}],"qs":[{"t":"predict","code":"$upn = 'ada@contoso.com'\n\"userPrincipalName eq '$upn'\"","choices":["userPrincipalName eq 'ada@contoso.com'","userPrincipalName eq '$upn'","userPrincipalName -eq 'ada@contoso.com'"],"a":0,"why":"Double quotes fill in $upn."},{"t":"predict","code":"$u = [pscustomobject]@{\n  DisplayName = 'Bram'\n  Department = $null\n}\n\"[$($u.Department)]\"","choices":["[Department]","(nothing shown)","[]"],"a":2,"why":"An empty value inside brackets: you see just the brackets. Ask for Department with -Property."},{"t":"predict","code":"$on = $true\n\"accountEnabled eq $on\"","choices":["accountEnabled eq true","accountEnabled eq True","accountEnabled eq $on"],"a":1,"why":"$true turns into True with a capital. In a filter, just type true yourself."},{"t":"predict","code":"$users = 1..250\n($users | Select-Object -First 100).Count","choices":["250","100","150"],"a":1,"why":"Like Get-MgUser without -All: you only get the first page of 100."},{"t":"pick","ask":"Which command connects so you can read all users?","choices":["Connect-ExchangeOnline -Scopes 'User.Read.All'","Connect-MgGraph -Permission 'User.Read.All'","Connect-MgGraph -Scopes 'User.Read.All'","Connect-MgGraph -Scopes 'User.Read'"],"a":2,"why":"User.Read only reads yourself. User.Read.All reads everyone."},{"t":"pick","ask":"Which command shows which account and scopes you are using?","choices":["Get-MgContext","Get-MgUser -Me","whoami","Get-MgScope"],"a":0,"why":"Get-MgContext shows the current Graph connection."},{"t":"pick","ask":"Which command gets ALL enabled users?","choices":["Get-MgUser -Filter 'accountEnabled -eq $true' -All","Get-MgUser -Filter 'accountEnabled eq true'","Get-MgUser -All | Where-Object AccountEnabled","Get-MgUser -Filter 'accountEnabled eq true' -All"],"a":3,"why":"OData eq plus -All. Without -All you get 100. AccountEnabled is not returned by default, so Where-Object finds nobody."},{"t":"pick","ask":"Which command shows Ada's department?","choices":["Get-MgUser -UserId ada@contoso.com | Select-Object Department","Get-MgUser -UserId ada@contoso.com -Property Department | Select-Object Department","Get-MgUser -UserId ada@contoso.com -Properties Department","Get-MgUser -Department ada@contoso.com"],"a":1,"why":"Graph uses -Property (no s). Exchange uses -Properties."},{"t":"pick","ask":"Which command blocks Bram's sign-in?","choices":["Update-MgUser -UserId bram@contoso.com -AccountEnabled $false","Update-MgUser -UserId bram@contoso.com -Enabled:$false","Update-MgUser -UserId bram@contoso.com -AccountEnabled:$false","Disable-MgUser -UserId bram@contoso.com"],"a":2,"why":"-AccountEnabled is a switch, so the value goes after a colon."},{"t":"pick","ask":"$g is the Sales group, $u is Lien. Which command adds Lien?","choices":["New-MgGroupMember -GroupId $g.Id -DirectoryObjectId $u.Id","New-MgGroupMember -GroupId Sales -DirectoryObjectId lien@contoso.com","Add-MgGroupMember -GroupId $g.Id -UserId $u.Id","New-MgGroupMember -GroupId $g.Id -Member $u.Id"],"a":0,"why":"Graph uses Ids for both. The person goes in -DirectoryObjectId."},{"t":"fill","code":"Connect-MgGraph ___ 'User.Read.All'","target":"Connects with permission to read users","choices":["-Permission","-Scopes","-Role"],"ok":[1],"why":"Graph permissions are called scopes."},{"t":"fill","code":"Get-MgUser -Filter \"department ___ 'Sales'\" -All","target":"Every user in Sales","choices":["-eq","==","eq","="],"ok":[2],"why":"OData uses eq, without a dash."},{"t":"fill","code":"Get-MgUser -UserId ada@contoso.com ___ Department |\n  Select-Object Department","target":"Shows Ada's department","choices":["-Properties","-Property","-Fields"],"ok":[1],"why":"Graph: -Property. Exchange: -Properties. Easy to mix up."},{"t":"fill","code":"Update-MgUser -UserId bram@contoso.com ___","target":"Blocks Bram's sign-in","choices":["-AccountEnabled $false","-AccountEnabled:$true","-AccountEnabled:$false","-Disabled"],"ok":[2],"why":"Colon for a switch value. $true would keep him enabled."},{"t":"fill","code":"Get-MgUser -Filter $f -All -ConsistencyLevel eventual -CountVariable ___\n$n","target":"Saves the count in $n","choices":["$n","n","count"],"ok":[1],"why":"Give the name without $. With $n you pass its value, which is empty."},{"t":"fill","code":"New-MgGroupMember -GroupId $g.Id ___ $u.Id","target":"Adds the user to the group","choices":["-UserId","-Member","-DirectoryObjectId"],"ok":[2],"why":"Group members are directory objects, so: -DirectoryObjectId."},{"t":"fill","code":"Get-MgGroupMember -GroupId $g.Id ___","target":"Every member, not just the first 100","choices":["-All","-ResultSize Unlimited","-Top 100"],"ok":[0],"why":"Graph uses -All. -ResultSize is Exchange."},{"t":"build","ask":"Connect so you can read users.","setup":"","target":"Graph session with User.Read.All","tiles":["Connect-MgGraph","-Scopes","'User.Read.All'","Connect-ExchangeOnline"],"sol":"0,1,2","ok":["0,1,2"],"why":"Connect-MgGraph -Scopes 'User.Read.All'."},{"t":"build","ask":"Get every blocked user.","setup":"","target":"All users with sign-in blocked","tiles":["Get-MgUser","-Filter 'accountEnabled eq false'","-All","-Filter 'accountEnabled -eq $false'"],"sol":"0,1,2","ok":["0,1,2","0,2,1"],"why":"OData eq false, plus -All."},{"t":"build","ask":"Block Noor's sign-in.","setup":"","target":"Noor can no longer sign in","tiles":["Update-MgUser","-UserId noor@contoso.com","-AccountEnabled:$false","-AccountEnabled $false"],"sol":"0,1,2","ok":["0,1,2","0,2,1"],"why":"The colon version is the right one."},{"t":"build","ask":"Show Lien's department.","setup":"","target":"Lien's department","tiles":["Get-MgUser","-UserId lien@contoso.com","-Property Department","|","Select-Object Department","-Properties Department"],"sol":"0,1,2,3,4","ok":["0,1,2,3,4","0,2,1,3,4"],"why":"Ask for it with -Property, then select it."},{"t":"build","ask":"Add Bram to the group.","setup":"$g = Get-MgGroup -Filter \"displayName eq 'Sales'\"\n$u = Get-MgUser -UserId bram@contoso.com","target":"Bram becomes a member of Sales","tiles":["New-MgGroupMember","-GroupId $g.Id","-DirectoryObjectId $u.Id","-DirectoryObjectId bram@contoso.com"],"sol":"0,1,2","ok":["0,1,2","0,2,1"],"why":"Ids, not addresses."},{"t":"order","lines":["Update-MgUser -UserId $u -AccountEnabled:$false","Connect-MgGraph -Scopes 'User.ReadWrite.All'","$u = 'bram@contoso.com'"],"target":"Blocks Bram's sign-in","sol":"1,2,0","ok":["1,2,0","2,1,0"],"why":"Connect and set $u first, in any order. Update last."},{"t":"order","lines":["$n","Get-MgUser -Filter $f -All -ConsistencyLevel eventual -CountVariable n","$f = \"endsWith(mail,'@contoso.com')\""],"target":"Shows how many contoso.com users there are","sol":"2,1,0","ok":["2,1,0"],"why":"Filter text, run, then read $n."},{"t":"order","lines":["New-MgGroupMember -GroupId $g.Id -DirectoryObjectId $u.Id","$u = Get-MgUser -UserId lien@contoso.com","$g = Get-MgGroup -Filter \"displayName eq 'Helpdesk'\""],"target":"Adds Lien to Helpdesk","sol":"2,1,0","ok":["2,1,0","1,2,0"],"why":"Find both objects first, then add."},{"t":"order","lines":["Get-MgUser -UserId $upn -Property $p | Select-Object $p","$p = 'DisplayName','Department'","$upn = 'noor@contoso.com'"],"target":"Shows Noor's name and department","sol":"2,1,0","ok":["2,1,0","1,2,0"],"why":"Both variables before they are used."},{"t":"bug","lines":["Connect-MgGraph -Scopes 'User.Read.All'","Get-MgUser -Filter \"department -eq 'Sales'\" -All"],"bad":1,"fix":"Get-MgUser -Filter \"department eq 'Sales'\" -All","expect":"Every Sales user","got":"Error: invalid filter clause","why":"Graph filters use OData: eq, not -eq."},{"t":"bug","lines":["$u = Get-MgUser -UserId ada@contoso.com","$u.Department"],"bad":0,"fix":"$u = Get-MgUser -UserId ada@contoso.com -Property Department","expect":"Sales","got":"(nothing shown)","why":"Department is not returned unless you ask."},{"t":"bug","lines":["Connect-ExchangeOnline -UserPrincipalName admin@contoso.com","Update-MgUser -UserId bram@contoso.com -AccountEnabled:$false"],"bad":0,"fix":"Connect-MgGraph -Scopes 'User.ReadWrite.All'","expect":"Bram is blocked","got":"Error: authentication needed, call Connect-MgGraph","why":"Update-MgUser is a Graph cmdlet. It needs a Graph session with User.ReadWrite.All, not an Exchange session."},{"t":"bug","lines":["$f = \"endsWith(mail,'@contoso.com')\"","Get-MgUser -Filter $f -All"],"bad":1,"fix":"Get-MgUser -Filter $f -All -ConsistencyLevel eventual -CountVariable n","expect":"All contoso.com users","got":"Error: unsupported query","why":"endsWith is an advanced filter. It needs -ConsistencyLevel eventual and -CountVariable."},{"t":"bug","lines":["$on = Get-MgUser -Filter 'accountEnabled eq true'","$on.Count"],"bad":0,"fix":"$on = Get-MgUser -Filter 'accountEnabled eq true' -All","expect":"350","got":"100","why":"Without -All you get one page of 100."},{"t":"bug","lines":["Connect-MgGraph -Scopes 'User.ReadWrite.All'","Update-MgUser -UserId noor@contoso.com -AccountEnabled $false"],"bad":1,"fix":"Update-MgUser -UserId noor@contoso.com -AccountEnabled:$false","expect":"Noor is blocked","got":"Noor is not blocked: $false is not read as the value","why":"-AccountEnabled is a switch. With a space, $false is not attached to it. Use the colon."}]},{"id":"offboard","title":"Safe offboarding","sub":"Order, -WhatIf, transcript, CSV","cards":[{"h":"The safe order","body":["Lock the door first, then tidy up.","Block sign-in, kick out sessions, then handle mail and groups."],"flow":["Block sign-in","Revoke sessions","Mailbox to shared","Manager FullAccess","Auto-reply","Remove from groups"]},{"h":"Block and kick out","body":["`Update-MgUser -AccountEnabled:$false` stops NEW sign-ins.","`Revoke-MgUserSignInSession` cancels the sessions that are already open.","Some apps can stay in for up to an hour, until their current token runs out."],"code":"$u = 'ada@contoso.com'\nUpdate-MgUser -UserId $u `\n  -AccountEnabled:$false\nRevoke-MgUserSignInSession -UserId $u","out":"Up const KEY = "poshle-pocket-v1";
const THEMES = ["orbital", "verdant", "walnut"];

const DAY = 864e5;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ERRS = { includes: (s) => /^Error:/.test(String(s)) };

let S = { theme: "orbital", xp: 0, learned: {}, passed: {}, best: {}, srs: {}, streak: { day: 0, n: 0 }, welcomed: false };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const KW = new Set("if elseif else foreach for while do until switch function param return try catch finally break continue in throw begin process end filter".split(" "));
function hl(src) {
  const re = /("(?:[^"`]|`.)*"|'(?:[^']|'')*')|(___)|(\$[A-Za-z_][\w:]*|\$_|\$\(|\$)|(\b[A-Z][a-z]+-[A-Za-z]+\b)|((?<=^|[\s(])-[A-Za-z]+\b)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w.]*)|([\s\S])/g;
  let out = "", m;
  while ((m = re.exec(src))) {
    if (m[1]) out += `<span class="st">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="blank" data-blank>___</span>`;
    else if (m[3]) out += `<span class="nu">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="fn">${m[4]}</span>`;
    else if (m[5]) out += `<span class="kw">${m[5]}</span>`;
    else if (m[6]) out += `<span class="nu">${m[6]}</span>`;
    else if (m[7]) out += KW.has(m[7].toLowerCase()) ? `<span class="kw">${m[7]}</span>` : esc(m[7]);
    else out += esc(m[8]);
  }
  return out;
}
const codeBlock = (src) => `<div class="code">${hl(src)}</div>`;
const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
function buzz() { try { navigator.vibrate && navigator.vibrate(25); } catch (e) {} }

function setTheme(t) {
  S.theme = t; document.documentElement.dataset.theme = t; $("themeBtn").textContent = t;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  save();
}
$("themeBtn").onclick = () => setTheme(THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length]);

function rankOf(xp) { let r = RANKS[0], nx = null; for (let i = 0; i < RANKS.length; i++) { if (xp >= RANKS[i][0]) { r = RANKS[i]; nx = RANKS[i + 1] || null; } } return { name: r[1], from: r[0], to: nx ? nx[0] : null }; }
function paintRail() {
  const r = rankOf(S.xp);
  $("rank").textContent = r.name; $("xp").textContent = S.xp;
  $("xpbar").style.width = r.to ? Math.round((S.xp - r.from) / (r.to - r.from) * 100) + "%" : "100%";
  const t = today();
  $("streak").textContent = (S.streak.day === t || S.streak.day === t - DAY) ? S.streak.n : 0;
}
function bumpStreak() {
  const t = today();
  if (S.streak.day === t) return;
  S.streak.n = S.streak.day === t - DAY ? S.streak.n + 1 : 1;
  S.streak.day = t;
}
function addXp(n) { S.xp += n; save(); paintRail(); }

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-home]").forEach((b) => (b.onclick = goHome));

const unlocked = (i) => i === 0 || !!S.passed[DATA[i - 1].id];
function stateOf(i) {
  const L = DATA[i];
  if (!unlocked(i)) return "locked";
  if (S.passed[L.id]) return "done";
  if (S.learned[L.id]) return "practice";
  return "learn";
}
function currentStep() {
  for (let i = 0; i < DATA.length; i++) { const s = stateOf(i); if (s === "learn" || s === "practice") return i; }
  return -1;
}
function knownIds() { return DATA.filter((L, i) => S.passed[L.id] || (S.learned[L.id] && unlocked(i))).map((L) => L.id); }
function dueList() {
  const t = today(), ids = new Set(knownIds());
  return Object.entries(S.srs).filter(([k, v]) => ids.has(k.split(":")[0]) && v.due <= t).map(([k]) => k);
}

function paintPath() {
  paintRail();
  $("welcome").style.display = S.welcomed && Object.keys(S.passed).length ? "none" : "";
  const cur = currentStep();
  const nu = $("nextUp");
  if (cur < 0) {
    nu.innerHTML = `<span><small>path complete</small><strong>All ${DATA.length} lessons done</strong></span><span class="go">daily ›</span>`;
    nu.onclick = () => startDaily();
  } else {
    const L = DATA[cur], st = stateOf(cur);
    nu.innerHTML = `<span><small>${st === "learn" ? "lesson" : "practice"} ${cur + 1} of ${DATA.length}</small><strong>${esc(L.title)}</strong></span><span class="go">continue ›</span>`;
    nu.onclick = () => openStep(cur);
  }
  const done = DATA.filter((L) => S.passed[L.id]).length;
  $("pathCount").textContent = `${done}/${DATA.length}`;
  $("pathList").innerHTML = DATA.map((L, i) => {
    const st = stateOf(i);
    const lbl = { locked: "locked", learn: "learn", practice: "practice", done: `${S.best[L.id] || 0}/5` }[st];
    return `<button class="step ${st}${i === cur ? " cur" : ""}" data-i="${i}" ${st === "locked" ? "disabled" : ""}><span class="n">${String(i + 1).padStart(2, "0")}</span><span><strong>${esc(L.title)}</strong><small>${esc(L.sub)}</small></span><span class="st">${lbl}</span></button>`;
  }).join("");
  $("pathList").querySelectorAll(".step").forEach((b) => (b.onclick = () => openStep(+b.dataset.i)));
  const known = knownIds(), due = dueList();
  $("dailyBtn").disabled = !known.length;
  $("dailySub").textContent = known.length ? (due.length ? `${due.length} mistake${due.length > 1 ? "s" : ""} due · only what you know` : "only what you know") : "opens after your first lesson";
  $("notesSub").textContent = known.length ? `${known.length} lesson${known.length > 1 ? "s" : ""} to reread` : "fills up as you learn";
}
function goHome() { paintPath(); show("home"); }

function openStep(i) {
  const st = stateOf(i);
  if (st === "locked") return;
  if (st === "learn") openLesson(i, false);
  else if (st === "practice") startPractice(i);
  else chooseDone(i);
}
function chooseDone(i) {
  const L = DATA[i];
  const nu = $("qcard");
  show("drill");
  $("count").textContent = ""; $("ok").textContent = "0"; $("drillDots").innerHTML = ""; $("nextBtn").classList.remove("on");
  $("quitBtn").onclick = goHome;
  nu.innerHTML = `<div class="ticket"><span>lesson ${i + 1}</span><span>best ${S.best[L.id] || 0}/5</span></div><div class="ask">${esc(L.title)}</div><div class="acts" style="grid-template-columns:1fr 1fr"><button class="btn" id="rl">Reread</button><button class="btn main" id="rp">Practice 5</button></div>`;
  $("rl").onclick = () => openLesson(i, true);
  $("rp").onclick = () => startPractice(i);
}

let LS = null;
function openLesson(i, review) {
  LS = { i, k: 0, review, passed: {} };
  show("lesson");
  renderCard();
}
function flowHtml(f) {
  const parts = f.map((n) => {
    if (typeof n === "string") return `<div class="fbox">${esc(n)}</div>`;
    if (n.if) return `<div class="fdec">${esc(n.if)}</div><div class="fsplit"><div class="y"><span>yes</span><div class="fbox">${esc(n.yes)}</div></div><div class="n"><span>no</span><div class="fbox">${esc(n.no)}</div></div></div>`;
    if (n.loop) return `<div class="floop"><div class="lbl"><span>repeat</span><span>no: leave</span></div><div class="fdec">${esc(n.loop)}</div><div class="farrow">↓ yes</div><div class="fbox">${esc(n.body)}</div><div class="farrow">↺ back to the question</div></div>`;
    return "";
  });
  return `<div class="flow">${parts.join('<div class="farrow">↓</div>')}</div>`;
}
function traceHtml(t) {
  return `<table class="trace"><tr>${t.cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>${t.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
}
function outLabel(s) { return s; }
function renderCard() {
  const L = DATA[LS.i], c = L.cards[LS.k], n = L.cards.length;
  $("lessonPos").textContent = `${LS.i + 1} · ${L.title}`;
  $("lessonDots").innerHTML = L.cards.map((_, j) => `<i class="${j < LS.k ? "good" : j === LS.k ? "on" : ""}"></i>`).join("");
  const imgs = ["junie-point", "junie-read", "junie-think", "junie-tablet"];
  let h = `<div class="lhead"><div><div class="kicker">card ${LS.k + 1} of ${n}</div><h3>${esc(c.h)}</h3></div><img src="img/junie/${imgs[LS.k % imgs.length]}.webp" alt=""></div>`;
  h += `<ul>${c.body.map((b) => `<li>${inline(b)}</li>`).join("")}</ul>`;
  if (c.code) h += codeBlock(c.code) + `<div class="out">${esc(outLabel(c.out))}</div>`;
  if (c.flow) h += flowHtml(c.flow);
  if (c.trace) h += traceHtml(c.trace);
  const done = LS.passed[LS.k] || LS.review;
  if (c.check) {
    const q = c.check;
    h += `<div class="chk"><div class="q">quick check · what does it show?</div>${codeBlock(q.code)}<div class="choices" id="cc">${q.choices.map((ch, j) => `<button class="choice${ERRS.includes(ch) ? " err" : ""}" data-j="${j}">${esc(outLabel(ch))}</button>`).join("")}</div><div class="wnote" id="cn">${LS.review ? "" : "Answer this to go on."}</div></div>`;
  }
  $("lessonBody").innerHTML = h;
  if (c.check) {
    const q = c.check;
    $("cc").querySelectorAll(".choice").forEach((b) => (b.onclick = () => {
      const j = +b.dataset.j;
      if (j === q.a) {
        b.classList.add("good");
        $("cc").querySelectorAll(".choice").forEach((x) => (x.disabled = true));
        $("cn").className = "wnote good"; $("cn").textContent = "Yes. " + q.why;
        LS.passed[LS.k] = true; $("lessonNext").disabled = false;
      } else {
        b.classList.add("bad"); buzz();
        $("cn").className = "wnote bad"; $("cn").textContent = "Not quite. " + q.why + " Try another.";
      }
    }));
  }
  $("lessonPrev").disabled = LS.k === 0;
  $("lessonNext").disabled = !!c.check && !done;
  $("lessonNext").textContent = LS.k === n - 1 ? (LS.review ? "Done" : "Start practice ›") : "Next ›";
}
$("lessonPrev").onclick = () => { if (LS.k > 0) { LS.k--; renderCard(); } };
$("lessonNext").onclick = () => {
  const L = DATA[LS.i];
  if (LS.k < L.cards.length - 1) { LS.k++; renderCard(); return; }
  if (LS.review) { goHome(); return; }
  if (!S.learned[L.id]) { S.learned[L.id] = true; S.welcomed = true; addXp(20); }
  startPractice(LS.i);
};
$("lessonBack").onclick = goHome;

function pickPractice(L) {
  const qs = L.qs.map((q, i) => ({ q, k: `${L.id}:${i}` }));
  const kinds = ["predict", "pick", "fill", "build", "order", "bug", "trace"];
  const byKind = {};
  shuffle(qs).forEach((x) => (byKind[x.q.t] = byKind[x.q.t] || []).push(x));
  const pick = [];
  shuffle(kinds.filter((k) => k !== "predict" && k !== "pick")).forEach((k) => { if (byKind[k] && byKind[k].length && pick.length < 3) pick.push(byKind[k].shift()); });
  const rest = shuffle(Object.values(byKind).flat());
  while (pick.length < 5 && rest.length) pick.push(rest.shift());
  return shuffle(pick);
}
function pickDaily() {
  const ids = knownIds();
  const due = shuffle(dueList()).slice(0, 5);
  const pick = due.map((k) => { const [id, n] = k.split(":"); return { q: DATA.find((L) => L.id === id).qs[+n], k }; });
  const have = new Set(due);
  const pool = shuffle(ids.flatMap((id) => DATA.find((L) => L.id === id).qs.map((q, i) => ({ q, k: `${id}:${i}` })))).filter((x) => !have.has(x.k));
  const fresh = pool.filter((x) => !S.srs[x.k]);
  while (pick.length < 10 && (fresh.length || pool.length)) {
    const x = (fresh.length && Math.random() < .7 ? fresh : pool).shift();
    if (!have.has(x.k)) { have.add(x.k); pick.push(x); }
    const fi = fresh.indexOf(x); if (fi >= 0) fresh.splice(fi, 1);
    const pi = pool.indexOf(x); if (pi >= 0) pool.splice(pi, 1);
  }
  return shuffle(pick);
}

let R = null;
function startPractice(i) {
  const L = DATA[i];
  R = { mode: "practice", li: i, items: pickPractice(L), at: 0, ok: 0, res: [], misses: [] };
  runRound();
}
function startDaily() {
  if (!knownIds().length) return;
  R = { mode: "daily", items: pickDaily(), at: 0, ok: 0, res: [], misses: [] };
  runRound();
}
$("dailyBtn").onclick = startDaily;
function runRound() { show("drill"); $("quitBtn").onclick = () => { if (R.at > 0) finish(); else goHome(); }; renderQ(); }
function lessonTitleOf(k) { return DATA.find((L) => L.id === k.split(":")[0]).title; }

function renderQ() {
  const it = R.items[R.at], q = it.q, n = R.items.length;
  $("count").textContent = `${R.at + 1} / ${n}`; $("ok").textContent = R.ok;
  $("drillDots").innerHTML = R.items.map((_, j) => `<i class="${j < R.at ? (R.res[j] ? "good" : "bad") : j === R.at ? "on" : ""}"></i>`).join("");
  $("nextBtn").classList.remove("on");
  const head = `<div class="ticket"><span>${{ predict: "predict", pick: "pick the command", fill: "fill the gap", build: "build it", order: "put in order", bug: "find the bug", trace: "trace the loop" }[q.t]}</span><span>${esc(lessonTitleOf(it.k))}</span></div>`;
  const box = $("qcard");
  R.done = false;
  if (q.t === "predict") {
    box.innerHTML = head + `<div class="ask">What does it show?</div>${codeBlock(q.code)}<div class="choices" id="ch">${q.choices.map((c, j) => `<button class="choice${ERRS.includes(c) ? " err" : ""}" data-j="${j}">${esc(outLabel(c))}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
    box.querySelectorAll(".choice").forEach((b) => (b.onclick = () => {
      if (R.done) return;
      const j = +b.dataset.j, good = j === q.a;
      box.querySelectorAll(".choice").forEach((x, xi) => { x.disabled = true; if (xi === q.a) x.classList.add("good"); });
      if (!good) b.classList.add("bad");
      answer(good, q.why, good ? "" : `It shows <code>${esc(outLabel(q.choices[q.a])).replace(/\n/g, "<br>")}</code>`);
    }));
  } else if (q.t === "pick") {
    box.innerHTML = head + `<div class="ask">${esc(q.ask)}</div><div class="choices" id="ch">${q.choices.map((c, j) => `<button class="choice cmd" data-j="${j}">${hl(c)}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
    box.querySelectorAll(".choice").forEach((b) => (b.onclick = () => {
      if (R.done) return;
      const j = +b.dataset.j, good = j === q.a;
      box.querySelectorAll(".choice").forEach((x, xi) => { x.disabled = true; if (xi === q.a) x.classList.add("good"); });
      if (!good) b.classList.add("bad");
      answer(good, q.why, "");
    }));
  } else if (q.t === "fill") {
    box.innerHTML = head + `<div class="ask">Pick what goes in the gap.</div>${codeBlock(q.code)}<div class="target">goal<pre>${esc(outLabel(q.target))}</pre></div><div class="chips" id="ch">${q.choices.map((c, j) => `<button class="chip" data-j="${j}">${esc(c)}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
    box.querySelectorAll(".chip").forEach((b) => (b.onclick = () => {
      if (R.done) return;
      const j = +b.dataset.j, good = q.ok.includes(j);
      const bl = box.querySelector("[data-blank]"); if (bl) bl.textContent = q.choices[j];
      box.querySelectorAll(".chip").forEach((x, xi) => { x.disabled = true; if (q.ok.includes(xi)) x.classList.add("good"); });
      if (!good) b.classList.add("bad");
      answer(good, q.why, good ? "" : `The gap is <code>${esc(q.choices[q.ok[0]])}</code>`);
    }));
  } else if (q.t === "build") {
    R.seq = [];
    box.innerHTML = head + `<div class="ask">${esc(q.ask)}</div>${q.setup ? codeBlock(q.setup) : ""}<div class="target">goal<pre>${esc(q.target)}</pre></div><div class="slot" id="slot"></div><div class="chips" id="tiles"></div><div class="acts"><button class="btn" id="howB">Show me</button><button class="btn main" id="chkB" disabled>Check</button></div><div class="fb" id="fb"></div>`;
    const paint = () => {
      $("slot").innerHTML = R.seq.length ? R.seq.map((t, p) => `<button class="chip" data-p="${p}">${esc(q.tiles[t])}</button>`).join("") : `<span class="ph">tap the pieces below to build one line</span>`;
      $("tiles").innerHTML = q.tiles.map((t, j) => `<button class="chip${R.seq.includes(j) ? " used" : ""}" data-j="${j}" ${R.seq.includes(j) ? "disabled" : ""}>${esc(t)}</button>`).join("");
      $("slot").querySelectorAll(".chip").forEach((b) => (b.onclick = () => { if (R.done) return; R.seq.splice(+b.dataset.p, 1); paint(); }));
      $("tiles").querySelectorAll(".chip").forEach((b) => (b.onclick = () => { if (R.done) return; R.seq.push(+b.dataset.j); paint(); }));
      $("chkB").disabled = !R.seq.length || R.done;
    };
    paint();
    const solText = q.sol.split(",").map((t) => q.tiles[+t]).join(" ");
    $("chkB").onclick = () => {
      const good = q.ok.includes(R.seq.join(","));
      $("slot").classList.add(good ? "good" : "bad");
      R.done = true; paint();
      answer(good, q.why, good ? "" : `One right line:${codeBlock(solText)}`);
    };
    $("howB").onclick = () => {
      if (R.done) return;
      R.seq = q.sol.split(",").map(Number); R.done = true; paint(); $("slot").classList.add("bad");
      answer(false, q.why, "Here it is. It comes back later for another go.");
    };
  } else if (q.t === "order") {
    R.seq = [];
    box.innerHTML = head + `<div class="ask">Tap the lines in the right order.</div><div class="target">goal<pre>${esc(q.target)}</pre></div><div class="built" id="built"></div><div class="lines" id="pool"></div><div class="acts"><button class="btn" id="howB">Show me</button><button class="btn main" id="chkB" disabled>Check</button></div><div class="fb" id="fb"></div>`;
    const paint = () => {
      $("built").innerHTML = R.seq.length ? R.seq.map((t, p) => `<button class="lrow" data-p="${p}"><span class="ln">${p + 1}</span><span>${hl(q.lines[t])}</span></button>`).join("") : `<span class="ph">tap the first line below</span>`;
      $("pool").innerHTML = q.lines.map((l, j) => `<button class="lrow${R.seq.includes(j) ? " picked" : ""}" data-j="${j}" ${R.seq.includes(j) ? "disabled" : ""}><span class="ln"></span><span>${hl(l)}</span></button>`).join("");
      $("built").querySelectorAll(".lrow").forEach((b) => (b.onclick = () => { if (R.done) return; R.seq.splice(+b.dataset.p, 1); paint(); }));
      $("pool").querySelectorAll(".lrow").forEach((b) => (b.onclick = () => { if (R.done) return; R.seq.push(+b.dataset.j); paint(); }));
      $("chkB").disabled = R.seq.length !== q.lines.length || R.done;
    };
    paint();
    const solCode = q.sol.split(",").map((t) => q.lines[+t]).join("\n");
    $("chkB").onclick = () => {
      const good = q.ok.includes(R.seq.join(","));
      $("built").classList.add(good ? "good" : "bad");
      R.done = true; paint();
      answer(good, q.why, good ? "" : `Right order:${codeBlock(solCode)}`);
    };
    $("howB").onclick = () => {
      if (R.done) return;
      R.seq = q.sol.split(",").map(Number); R.done = true; paint(); $("built").classList.add("bad");
      answer(false, q.why, "Here it is. It comes back later for another go.");
    };
  } else if (q.t === "trace") {
    const nc = q.cols.length, total = q.rows.length * nc;
    R.cell = 0; R.tbad = []; R.lock = false;
    box.innerHTML = head + `<div class="ask">Follow the loop. Fill the table one value at a time.</div>${codeBlock(q.code)}<table class="trace" id="tt"></table><div class="tprompt" id="tp"></div><div class="chips" id="ch"></div><div class="fb" id="fb"></div>`;
    const paint = (note) => {
      let h = `<tr><th>after lap</th>${q.cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
      q.rows.forEach((row, r) => {
        h += `<tr><td>${r + 1}</td>${row.map((v, c) => {
          const idx = r * nc + c;
          const cls = idx < R.cell ? (R.tbad.includes(idx) ? "bad" : "good") : idx === R.cell ? "cur" : "";
          return `<td class="${cls}">${idx < R.cell ? esc(v) : idx === R.cell ? "?" : ""}</td>`;
        }).join("")}</tr>`;
      });
      $("tt").innerHTML = h;
      if (R.cell >= total) { $("tp").innerHTML = ""; $("ch").innerHTML = ""; return; }
      const r = Math.floor(R.cell / nc), c = R.cell % nc;
      $("tp").className = "tprompt" + (note ? " bad" : "");
      $("tp").innerHTML = (note ? note + " " : "") + `What is <code>${esc(q.cols[c])}</code> after lap ${r + 1}?`;
      $("ch").innerHTML = q.opts[R.cell].map((o, j) => `<button class="chip" data-j="${j}">${esc(o)}</button>`).join("");
      $("ch").querySelectorAll(".chip").forEach((b) => (b.onclick = () => {
        if (R.done || R.lock) return;
        const val = q.rows[r][c], pickd = q.opts[R.cell][+b.dataset.j];
        const step = (msg) => { R.cell++; R.lock = false; paint(msg); if (R.cell >= total) answer(!R.tbad.length, q.why, R.tbad.length ? `${R.tbad.length} value${R.tbad.length > 1 ? "s" : ""} off. The red ones in the table are the right values.` : ""); };
        if (pickd === val) { b.classList.add("ok"); R.lock = true; setTimeout(() => step(""), 180); }
        else { b.classList.add("flash"); buzz(); R.tbad.push(R.cell); R.lock = true; setTimeout(() => step(`It was ${esc(val)}.`), 550); }
      }));
    };
    paint("");
  } else if (q.t === "bug") {
    box.innerHTML = head + `<div class="ask">One line is broken. Tap it.</div><div class="target">goal<pre>${esc(q.expect)}</pre></div><div class="target">but gives<pre>${esc(outLabel(q.got))}</pre></div><div class="lines" id="pool">${q.lines.map((l, j) => `<button class="lrow" data-j="${j}"><span class="ln">${j + 1}</span><span>${hl(l || " ")}</span></button>`).join("")}</div><div class="fb" id="fb"></div>`;
    box.querySelectorAll(".lrow").forEach((b) => (b.onclick = () => {
      if (R.done) return;
      const j = +b.dataset.j, good = j === q.bad;
      box.querySelectorAll(".lrow").forEach((x, xi) => { x.disabled = true; if (xi === q.bad) x.classList.add("good"); });
      if (!good) b.classList.add("bad");
      answer(good, q.why, `<div class="fix">Line ${q.bad + 1} fixed:${codeBlock(q.fix.trim())}</div>`);
    }));
  }
}

function answer(good, why, extra) {
  R.done = true;
  const it = R.items[R.at];
  R.res[R.at] = good;
  if (good) { R.ok++; $("ok").textContent = R.ok; } else { buzz(); R.misses.push(it); }
  const t = today(), s = S.srs[it.k];
  if (!good) S.srs[it.k] = { box: 0, due: t + DAY, miss: (s ? s.miss : 0) + 1 };
  else if (s) { const b = Math.min(s.box + 1, 4); s.box = b; s.due = t + [1, 3, 7, 14, 30][b] * DAY; if (b >= 4) delete S.srs[it.k]; }
  save();
  const fb = $("fb");
  fb.innerHTML = `<div class="fbrow"><div><span class="verdict ${good ? "good" : "bad"}">${good ? "Correct." : "Not this time."}</span> ${inline(why)}${extra ? `<div class="fix">${extra}</div>` : ""}</div><img src="img/junie/${good ? "junie-cheer" : "junie-think"}.webp" alt=""></div>`;
  fb.classList.add("on");
  $("nextBtn").textContent = R.at === R.items.length - 1 ? "See result ›" : "Next ›";
  $("nextBtn").classList.add("on");
  setTimeout(() => fb.scrollIntoView({ behavior: "smooth", block: "nearest" }), 30);
}
$("nextBtn").onclick = () => { if (R.at < R.items.length - 1) { R.at++; renderQ(); } else finish(); };

function finish() {
  const n = R.at + (R.done ? 1 : 0), ok = R.ok;
  let xp = ok * 10, msg = "", cls = "good";
  bumpStreak();
  if (R.mode === "practice") {
    const L = DATA[R.li];
    if (n === R.items.length) S.best[L.id] = Math.max(S.best[L.id] || 0, ok);
    if (ok >= 4 && n === R.items.length) {
      if (!S.passed[L.id]) { S.passed[L.id] = true; xp += 30; msg = R.li + 1 < DATA.length ? `Passed. Lesson ${R.li + 2} is open.` : "Passed. Path complete."; }
      else msg = "Passed again.";
    } else { cls = "bad"; msg = n < R.items.length ? "Ended early. Try a full round." : `${ok} of 5. Need 4 to open the next lesson. Go again.`; }
  } else msg = R.misses.length ? "Misses come back in a later Daily." : "Clean run.";
  addXp(xp);
  save();
  $("resNum").textContent = ok;
  $("resSub").textContent = `correct of ${n}`;
  $("resAcc").textContent = n ? Math.round(ok / n * 100) + "%" : "0%";
  $("resXp").textContent = "+" + xp;
  $("resStreak").textContent = S.streak.n;
  $("resMsg").className = "msg " + cls; $("resMsg").textContent = msg;
  $("resImg").src = `img/junie/${cls === "good" ? "junie-cheer" : "junie-worry"}.webp`;
  $("misses").innerHTML = R.misses.length ? `<div class="sect"><span>To look at again</span></div>` + R.misses.map((it) => {
    const q = it.q;
    const body = q.t === "predict" ? `${codeBlock(q.code)}<div>shows <code>${esc(outLabel(q.choices[q.a]))}</code></div>` :
      q.t === "pick" ? `<div>${esc(q.ask)}</div>${codeBlock(q.choices[q.a])}` :
      q.t === "fill" ? `${codeBlock(q.code.replace("___", q.choices[q.ok[0]]))}` :
      q.t === "build" ? `${q.setup ? codeBlock(q.setup) : ""}${codeBlock(q.sol.split(",").map((t) => q.tiles[+t]).join(" "))}` :
      q.t === "order" ? codeBlock(q.sol.split(",").map((t) => q.lines[+t]).join("\n")) :
      q.t === "trace" ? codeBlock(q.code) + traceHtml({ cols: ["after lap"].concat(q.cols), rows: q.rows.map((r, i) => [String(i + 1)].concat(r)) }) :
      `<div>line ${q.bad + 1} should be</div>${codeBlock(q.fix.trim())}`;
    return `<div class="m"><b>${esc(lessonTitleOf(it.k))}</b>${body}</div>`;
  }).join("") : "";
  const passedNow = R.mode === "practice" && S.passed[DATA[R.li].id] && R.li + 1 < DATA.length && ok >= 4;
  $("againBtn").textContent = passedNow ? `Next: ${DATA[R.li + 1].title}` : "Again";
  $("againBtn").onclick = () => {
    if (passedNow) openStep(R.li + 1);
    else if (R.mode === "practice") startPractice(R.li);
    else startDaily();
  };
  show("result");
}
$("homeBtn").onclick = goHome;

$("notesBtn").onclick = () => {
  const ids = new Set(knownIds());
  const list = DATA.map((L, i) => ({ L, i })).filter((x) => ids.has(x.L.id));
  $("notesList").innerHTML = list.length ? list.map(({ L, i }) => `<button class="step" data-i="${i}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span><strong>${esc(L.title)}</strong><small>${L.cards.map((c) => esc(c.h)).join(" · ")}</small></span><span class="st">read</span></button>`).join("") : `<div class="empty">Notes fill up as you learn.<br>Start lesson 1 from the path.</div>`;
  $("notesList").querySelectorAll(".step").forEach((b) => (b.onclick = () => openLesson(+b.dataset.i, true)));
  show("notes");
};
$("resetBtn").onclick = () => {
  if (!confirm("Reset all Poshle Pocket progress on this device?")) return;
  const t = S.theme, off = S.offlineAt;
  S = { theme: t, offlineAt: off, xp: 0, learned: {}, passed: {}, best: {}, srs: {}, streak: { day: 0, n: 0 }, welcomed: false };
  save(); goHome(); toast("Progress reset");
};

const JUNIE = ["img/junie/junie-wave.webp", "img/junie/junie-point.webp", "img/junie/junie-read.webp", "img/junie/junie-think.webp", "img/junie/junie-tablet.webp", "img/junie/junie-cheer.webp", "img/junie/junie-worry.webp"];
const SWOK = "serviceWorker" in navigator && /^https?:$/.test(location.protocol);
if (SWOK) navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});
function paintOff() { $("offBtn").textContent = S.offlineAt ? "Offline ready" : "Save offline"; }
$("offBtn").onclick = () => {
  if (!SWOK) { toast("Offline needs the live site"); return; }
  $("offBtn").textContent = "Saving...";
  navigator.serviceWorker.ready.then((reg) => {
    const sw = reg.active || navigator.serviceWorker.controller;
    if (!sw) { toast("Open once more, then try again"); paintOff(); return; }
    sw.postMessage({ type: "pack", urls: ["labs/poshle-pocket.html"].concat(JUNIE.map((j) => "labs/" + j)) });
  });
};
if (SWOK) navigator.serviceWorker.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type === "packed") { S.offlineAt = Date.now(); save(); paintOff(); toast("Saved. Works without signal now"); }
});
paintOff();
setTheme(THEMES.includes(S.theme) ? S.theme : "orbital");
goHome();
</script>
