 {c:"header('Location: /done.php'); exit;", d:"Redirect after a successful post", n:"Always exit straight after, or the rest of the script keeps running. Redirecting after post stops a refresh resubmitting the form."}
]},
{t:"Sessions and files", e:[
 {c:"session_start();", d:"Begin or resume a session", n:"Must run before any output is sent. After it, $_SESSION persists per visitor across requests."},
 {c:"$_SESSION['user'] = $id;", d:"Remember something about the visitor", n:"session_regenerate_id(true) right after login limits session fixation. session_destroy() ends it."},
 {c:"require 'header.php'; / include 'nav.php';", d:"Pull in another file", n:"require fails hard if the file is missing, include only warns. The _once variants prevent double loading. Use require for anything your page cannot live without."},
 {c:"file_get_contents / file_put_contents", d:"Read or write a whole file in one call", n:"fopen and fgets stream a large file line by line instead of loading it all. Check the return value; false means it failed."},
 {c:"$_FILES['upload']", d:"Handle an uploaded file", n:"Check the error code, verify the real type rather than trusting the name, and move it with move_uploaded_file into a folder that is not web-servable."}
]},
{t:"Classes and objects", e:[
 {c:"class Switchbox { public function __construct(private string $name) {} }", d:"Class with a constructor", n:"Constructor property promotion declares and assigns in one line. new Switchbox('ACCS4') creates an instance.", x:"class Ticket {\n    public function __construct(\n        private string $title,\n        private string $state = 'open'\n    ) {}\n\n    public function describe(): string {\n        return \"$this->title ($this->state)\";\n    }\n}"},
 {c:"$this->name", d:"Reach the current object's own members", n:"An arrow, not a dot. Static members use self:: or the class name with ::."},
 {c:"public / private / protected", d:"Visibility", n:"Default to private and expose only what callers need. protected is visible to subclasses too."},
 {c:"class Access extends Base / implements Countable", d:"Inheritance and interfaces", n:"One parent class only, but as many interfaces as you like. An interface is a contract of method signatures with no bodies."},
 {c:"namespace App\\Models; use App\\Models\\Ticket;", d:"Namespaces", n:"Keep class names from colliding across libraries. They mirror folder structure under PSR-4 autoloading."}
]},
{t:"Databases with PDO", e:[
 {c:"$pdo = new PDO($dsn, $user, $pass, $options);", d:"Connect to a database", n:"One connection object for the request. Set ERRMODE_EXCEPTION so failures throw instead of returning false silently.", x:"$pdo = new PDO('mysql:host=localhost;dbname=app;charset=utf8mb4', $user, $pass, [\n    PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,\n    PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,\n    PDO::ATTR_EMULATE_PREPARES => false,\n]);"},
 {c:"$stmt = $pdo->prepare('SELECT * FROM tickets WHERE state = ?');", d:"Prepare a statement with placeholders", n:"Never build SQL by concatenating user input. Placeholders keep data as data, which is what stops SQL injection."},
 {c:"$stmt->execute([$state]);", d:"Run the prepared statement with values", n:"Positional ? with an ordered array, or named :state with an associative one. Same statement can be executed repeatedly with different values."},
 {c:"$stmt->fetch() / $stmt->fetchAll()", d:"Read one row or all of them", n:"fetch in a while loop for large results, fetchAll when the set is small. fetchColumn() grabs a single value."},
 {c:"$pdo->lastInsertId()", d:"Get the id of the row you just inserted", n:"Call it immediately after the insert. For multi-step writes, wrap them in beginTransaction and commit, with rollBack in the catch."}
]},
{t:"Errors and tooling", e:[
 {c:"try { ... } catch (PDOException $e) { ... }", d:"Catch an exception by type", n:"Catch \\Throwable to cover both errors and exceptions. Log $e->getMessage(), show the visitor something generic."},
 {c:"throw new InvalidArgumentException('vlan out of range');", d:"Raise your own exception", n:"Pick a specific built-in type, or extend Exception for your own. It travels up until something catches it."},
 {c:"error_reporting(E_ALL); ini_set('display_errors', '1');", d:"See every error while developing", n:"Turn display_errors off in production and log instead, because stack traces reveal paths and query structure."},
 {c:"composer require vendor/package", d:"Install a dependency", n:"composer.json declares them, composer.lock pins exact versions. Add require 'vendor/autoload.php'; once and every class loads on demand."}
]}

"junos::The commit workflow": {
  concept: "Junos keeps two copies of the configuration. The active configuration is what the switch is running right now. The candidate configuration is a scratch copy you edit freely — you can make twenty changes, contradict yourself, and the switch keeps forwarding traffic as if nothing happened. Nothing you type takes effect until you commit, which validates the candidate and then swaps it in atomically. This is the single biggest difference from an IOS-style CLI, where each line applies the moment you press enter. It changes how you work: you make the whole change, read the diff, then apply it in one motion. It also means the two commands that matter most are not configuration commands at all. Before: show | compare, so you see exactly what you are about to do. After: commit confirmed, so a change that locks you out undoes itself while you are still driving to the site.",
  figure: "  edit  ->  candidate config  --commit-->  active config\n                   |                              |\n            show | compare                  rollback 1\n            (what changes)                (previous copy)",
  traps: [
    "Editing without running show | compare first — the diff is the whole point of a candidate config.",
    "Using commit confirmed and then forgetting the second commit, so your good change rolls itself back.",
    "Thinking rollback applies immediately. It only loads the old config as the candidate; you still have to commit."
  ],
  quiz: [
    { q: "You typed ten set commands and closed your laptop without committing. What is the switch running?", a: "The active configuration, exactly as before. Uncommitted candidate changes are discarded when the session ends." },

  ],
  lab: true
},

"junos::VLANs and switching": {
  concept: "A VLAN is a separate broadcast domain living on shared hardware. Two servers in VLAN 10 can talk to each other directly; a server in VLAN 20 on the same switch cannot reach them without passing through something that routes. The tag is how a frame carries that membership between switches: an access port strips tags and hands the device plain untagged Ethernet, a trunk port keeps the 802.1Q tag so the far switch knows which VLAN the frame belongs to. So access ports face things that do not know VLANs exist — servers, cameras, door controllers — and trunks face things that do. The moment you want traffic to cross between VLANs, you need a layer 3 interface. On an EX that is the irb: a virtual interface with an IP address that belongs to one VLAN and acts as the default gateway for everything in it.",
  figure: "  server --untagged--> [access port]        switch A\n                                |\n                           [trunk port] ==tagged 10,20==\n                                |\n                           [trunk port]              switch B\n\n  VLAN 10 --+\n            +--> irb.10 (10.0.10.1) --routes--> irb.20",
  traps: [
    "Creating the VLAN but never adding it to the trunk between switches, so it works locally and nowhere else.",
    "Mismatched native-vlan-id on the two ends of a trunk — untagged traffic silently lands in the wrong VLAN.",
    "Expecting an irb to come up with no active access port in its VLAN. It stays down until something is there."
  ],

    { q: "A server is plugged into a port and gets no DHCP. The port is configured as a trunk. What is wrong?", a: "The server sends untagged frames, and a trunk expects tags. The port should be an access port in the server's VLAN." },
    { q: "What does the irb interface actually provide?", a: "A gateway IP inside a VLAN, so traffic can be routed out of that broadcast domain to other VLANs or networks." }
  ],
  lab: true
},

"junos::Link aggregation and LACP": {
  concept: "A link aggregation group makes several physical links behave as one logical interface. You get more bandwidth and, more usefully, you survive a cable, optic or line card failing without a spanning tree reconvergence. The traffic is not smoothly spread across the members: the switch hashes each flow, usually on MAC and IP, and pins that flow to one member. A single large transfer therefore never exceeds one member's speed — two 1G links do not make one 2G link for one file copy. LACP is the protocol that negotiates the bundle instead of trusting you. Each side advertises, both sides agree which links belong, and a member that is cabled to the wrong neighbour is left out rather than silently black-holing traffic. That is why static bundles are a bad habit: the failure mode of a mis-patched cable becomes a working-looking bundle that drops half the traffic.",
  traps: [
    "Forgetting set chassis aggregated-devices ethernet device-count. Nothing works and the error does not point at it.",
    "Leaving family statements on the member ports. All configuration belongs on the ae interface.",
    "Setting both sides to passive, so neither ever starts the negotiation and the bundle never forms."
  ],
  quiz: [
    { q: "You bundle two 1G links and a backup job still runs at 1G. Is the LAG broken?", a: "No. One flow hashes to one member, so a single transfer is capped at one link's speed. Aggregation adds capacity across flows and adds resilience." },
    { q: "Why prefer LACP over a static bundle?", a: "LACP verifies both ends agree before using a member, so a mis-patched or one-way link is excluded instead of silently dropping traffic." }
  ],
  lab: true
},

"junos::Routing": {
  concept: "Routing is the decision of where to send a packet whose destination is not in this broadcast domain. The switch holds a routing table, picks the most specific matching prefix, and forwards to that next hop. Longest match always wins, so a /24 beats a /16 beats the 0.0.0.0/0 default regardless of how each was learned. When two protocols offer the same prefix, Junos compares preference — its name for administrative distance — and the lower number wins: direct 0, static 5, OSPF 10, BGP external 170. Static routes are hand-written and never adapt; they are right for a default route out of a small site. OSPF learns the topology inside one organisation and reconverges by itself when a link dies. BGP is for exchanging routes between organisations, where policy rather than shortest path decides what you accept and advertise. Most access switches need only the first. Knowing why the other two exist is what stops you reaching for the wrong one.",

"python::Variables and types": {
  concept: "A Python variable is not a box that holds a value. It is a label tied to an object that lives elsewhere in memory. Assignment moves the label; it never copies the object. For numbers and strings this distinction is invisible, because those objects cannot be changed — any operation that looks like a change actually builds a new object and re-points the label. For lists, dicts and sets it becomes very visible: b = a gives you two labels on one list, so appending through b changes what a sees. This one fact explains a whole family of confusing bugs, and the fix is always the same: copy deliberately with list(a) or a.copy() when you want a second object rather than a second name. Type follows the object, not the label, which is why a name can hold an int now and a string later, and why type(x) is the fastest way to end an argument with yourself.",
  figure: "  a = [1, 2]        a ---> [1, 2]\n  b = a             b ---^   (one list, two names)\n  b.append(3)       a is now [1, 2, 3]\n\n  b = list(a)       b ---> [1, 2, 3]  (a second list)",

"python::Lists": {
  concept: "A list is an ordered, mutable sequence, and mutability is the interesting half. Methods like append, sort and reverse change the list you already have and return None, while functions like sorted and reversed leave the original alone and hand you something new. Assigning the result of items.sort() to a variable is therefore one of the most common beginner bugs in the language: the variable holds None and the sorted data is still in the old name. The second thing worth internalising is that a slice always produces a new list, which makes items[:] the quickest way to copy one and makes slicing safe when a plain assignment would not be. Looping while removing items from the same list is the third hazard: the index moves under you and items get skipped, so build a new list with a comprehension instead of editing in place.",

"python::Functions": {
  concept: "A function is the unit you test, name and reuse, and the boundary it draws is scope. Names created inside a function are invisible outside it, and names outside are readable inside but not assignable unless you say so. That containment is a feature: it means calling a function cannot quietly change your state unless you handed it something mutable or it returned something you assigned. The one place the boundary leaks is the default argument. Defaults are evaluated once, when the function is defined, not each time it is called — so a mutable default like def add(item, bucket=[]) shares one list across every call and slowly accumulates data from calls you thought were independent. Use None as the default and build the real object in the body. Beyond that, a good function returns a value rather than printing one: printing is a decision about presentation, and burying it inside logic makes the logic impossible to reuse.",

"python::Environments and tooling": {
  concept: "Every Python installation has one shared set of packages, and two projects will eventually disagree about a version. A virtual environment solves that by giving each project its own interpreter link and its own site-packages directory. Creating one makes a folder, activating it puts that folder's bin directory first on your PATH, and from then on python and pip mean this project's copies. Nothing is installed magically: the venv folder is disposable and rebuildable, which is exactly why it should never be committed. What you commit is requirements.txt, the declaration of what the project needs, so the environment can be recreated on a server, on a colleague's machine, or on yours next year. On a server the same discipline matters more, not less: system Python belongs to the operating system, and installing into it with sudo pip is how you break the tools your distribution depends on.",
  figure: "  project/\n    .venv/            <- disposable, git-ignored\n    requirements.txt  <- committed, the real declaration\n    app.py\n\n  create   python3 -m venv .venv\n  enter    source .venv/bin/activate\n  record   pip freeze > requirements.txt",

"web::Page skeleton": {
  concept: "A browser does not display your file, it builds a model from it. The HTML is parsed into the DOM, a tree of nodes. The CSS is parsed into rules and matched against that tree to compute a style for every node. Layout then works out where each box goes, paint fills in pixels, and only then do you see anything. Understanding that order explains most of the surprises. A stylesheet in the head blocks rendering because painting without it would flash unstyled content. A script in the middle of the body pauses parsing, because it might write more HTML. An image without width and height makes the page jump, because layout ran before the browser knew how much space to reserve. The DOM is also what JavaScript manipulates: you are never editing the file after load, you are editing the tree the browser built from it.",
  figure: "  HTML --parse--> DOM tree  --+\n                              +--> render tree --> layout --> paint\n  CSS  --parse--> style rules-+\n\n  JS edits the DOM, which sends you back through layout and paint",
  traps: [

    "Putting a script before the elements it looks for, so querySelector returns null.",
    "Skipping the charset declaration and getting broken accented characters."
  ],
  quiz: [
    { q: "Why does a missing width and height on an image cause the page to jump?", a: "Layout runs before the image arrives, so no space is reserved; when the file loads, everything below is pushed down." },
    { q: "What is the DOM?", a: "The tree of nodes the browser built from your HTML. It is what CSS is matched against and what JavaScript edits." }
  ],
  lab: true
},

"web::The cascade and specificity": {
  concept: "When two rules set the same property on the same element, three things decide the winner, in order. First importance: an !important declaration beats a normal one. Then specificity, scored as a tuple of inline styles, ids, classes and elements — a higher number at the leftmost position wins outright, so a single id beats any number of classes. Only when specificity ties does source order decide, which is why the last rule wins in a stylesheet full of single-class selectors. Inheritance is a separate mechanism that people confuse with the cascade: some properties, mostly typographic ones, pass down to children automatically, and an inherited value always loses to any rule that targets the element directly, however weak. The practical consequence is to keep specificity low and flat. If your stylesheet is a ladder of ids and !important, each fix has to be stronger than the last, and eventually there is nothing stronger left.",
  figure: "  0,1,0,0   #main          id\n  0,0,1,0   .card          class\n  0,0,0,1   p              element\n\n  .card p   = 0,0,1,1   beats   p   = 0,0,0,1\n  #main p   = 0,1,0,1   beats both, whatever the order",
  traps: [
    "Reaching for !important instead of fixing the selector.",
    "Styling with ids and then being unable to override them anywhere.",
    "Expecting an inherited value to beat a direct rule. It never does."
  ],
  quiz: [
    { q: "Which wins: #main p or .card .body p?", a: "#main p. One id outranks any number of classes, regardless of source order." },
    { q: "Two rules have identical specificity. What decides?", a: "Source order — the one that appears later in the stylesheet wins." }
  ],
  lab: true
},

"web::The box model": {
  concept: "Every element is a rectangle made of four nested layers: the content, then padding, then the border, then the margin. The width property, by default, only sizes the content box, so a 300px box with 20px padding and a 1px border actually occupies 342px and your three-column layout breaks for reasons the CSS never mentions. Setting box-sizing: border-box changes width to mean the outer edge including padding and border, which is what everyone expects and why almost every stylesheet starts by setting it globally. The margin layer behaves differently again: it is outside the background, it can be negative, and vertical margins between siblings collapse into the larger of the two rather than adding up. That last rule catches everyone once. Modern layouts sidestep the whole thing by using gap on a flex or grid parent, where spacing is declared once and never collapses.",
  figure: "  +-------------------- margin ---------------------+\n  |  +----------------- border ------------------+  |\n  |  |  +-------------- padding ---------------+  |  |\n  |  |  |             content                  |  |  |\n  |  |  +--------------------------------------+  |  |\n  |  +--------------------------------------------+  |\n  +--------------------------------------------------+",
  traps: [
    "Forgetting box-sizing: border-box and fighting layouts that are mysteriously too wide.",
    "Expecting stacked margins to add up. They collapse to the larger one.",
    "Using margin to make a button easier to tap. Padding grows the clickable area; margin does not."
  ],
  quiz: [
    { q: "With default box-sizing, how wide is a 300px element with 20px padding and a 1px border?", a: "342px. Width sizes only the content box, so padding and border are added on top." },
    { q: "Two paragraphs each have 20px vertical margins. How far apart are they?", a: "20px. Adjacent vertical margins collapse into the larger of the two." }
  ],
  lab: true
},

"web::Flexbox": {
  concept: "Flexbox lays out along one axis at a time and lets the browser do the arithmetic. You pick a direction, and everything else is expressed relative to it: justify-content distributes along the main axis, align-items aligns across the cross axis. Switch flex-direction from row to column and those two swap meaning, which is why the properties feel unreliable until the axis idea clicks. The other half is flexibility. A flex child is not fixed: flex-grow lets it absorb leftover space, flex-shrink lets it give space back when the container is too small, and flex-basis is the size it starts from before either happens. flex: 1 is the common shorthand for grow, shrink and a zero basis — take whatever is left. Use flex when you are arranging things in a line: a toolbar, a row of buttons, a sidebar next to content. Reach for grid the moment you care about rows and columns at once.",
  traps: [
    "Reaching for justify-content to centre vertically in a row. That is align-items.",
    "Setting widths on flex children and then wondering why they will not shrink.",
    "Using margins between children instead of gap, which then also adds space at the edges."
  ],
  quiz: [

    { q: "When is grid the better choice than flex?", a: "When the layout is two-dimensional — rows and columns that must line up with each other." }
  ],

"js::Basics": {
  concept: "JavaScript in a page does one job: it changes the DOM in response to something happening. That is the whole mental model. The browser has already built the tree from your HTML and painted it; your script finds nodes in that tree, reads or changes them, and the browser re-runs layout and paint for what you touched. Everything else is detail around that loop. It also runs on a single thread, so while your code is running, nothing else happens — no clicks are handled, no pixels are painted. A long loop freezes the page. That constraint is why anything slow, like a network request, is asynchronous: your function starts it, returns immediately, and the result arrives later through a callback or a promise. Holding those two ideas — one thread, one tree — makes most JavaScript behaviour predictable, including the parts that look like magic.",
  traps: [
    "Running a script before the DOM exists, so every query returns null.",
    "Using var out of habit, which is function-scoped and leaks out of blocks.",
    "Checking a value with == and getting a surprising type conversion."
  ],
  quiz: [
    { q: "Why does a long synchronous loop freeze the page?", a: "JavaScript runs on a single thread shared with rendering, so nothing is painted or handled until the loop finishes." },
    { q: "What does a script actually modify when it changes the page?", a: "The DOM — the tree the browser built from your HTML — not the source file." }
  ],
  lab: true
},

"js::Arrays": {
  concept: "Three methods carry most array work, and they differ in what they return. map returns a new array of the same length, one output per input — use it to transform. filter returns a new, usually shorter array containing the items that passed a test — use it to narrow. reduce returns a single value built up across the items — use it to total, group or fold. All three leave the original array alone, which is why they chain: filter first to cut the data down, then map to shape it, then join or reduce to finish. forEach is the odd one out; it returns nothing at all, so it is only for side effects, and reaching for it to build a result is the sign you wanted map. Getting fluent with these replaces most of the index-juggling loops beginners write, and the resulting code says what it does rather than how it walks.",
  figure: "  [1, 2, 3, 4]\n     |\n     +-- filter(x => x > 2)  -->  [3, 4]      fewer items\n     +-- map(x => x * 10)    -->  [10,20,30,40]  same count\n     +-- reduce((a,x)=>a+x,0)-->  10           one value",
  traps: [
    "Using forEach when you want a result back.",
    "Forgetting to return inside a map callback with braces, producing an array of undefined.",
    "Mutating the array inside a map, which breaks the promise that map is pure."
  ],
  quiz: [
    { q: "You need the names of all active users. Which method?", a: "filter for the active ones, then map to pull out the names — two steps, chained." },
    { q: "What does forEach return?", a: "undefined. It exists for side effects only; use map when you want a new array." }
  ],
  lab: true
},

"js::Events": {
  concept: "An event does not fire only on the element you clicked. It travels: down from the document to the target (capture), then back up through every ancestor (bubble). Handlers run on the way up by default, which means a listener on a container hears clicks on everything inside it. That is not a quirk to work around, it is the feature that makes delegation possible. Instead of attaching a hundred listeners to a hundred rows, attach one to the table and ask event.target.closest('tr') which row was involved. One listener, less memory, and it keeps working for rows added later — which the hundred-listener version does not. The two properties to keep straight are target, the deepest element under the pointer, and currentTarget, the element whose handler is running. preventDefault stops the browser's built-in reaction, such as submitting or navigating; stopPropagation stops the travel itself and should be rare, because it makes other people's handlers silently not run.",
  figure: "  document\n    └ table        <- one listener here\n        └ tr\n            └ td   <- clicked (event.target)\n\n  click on td  ->  bubbles up  ->  table's handler runs\n  event.target.closest('tr') identifies the row",
  traps: [
    "Attaching listeners in a loop over items that get re-rendered later.",
    "Confusing event.target with event.currentTarget inside a delegated handler.",
    "Reaching for stopPropagation to fix a bug, which hides the real cause and breaks unrelated handlers."
  ],
  quiz: [
    { q: "Why does event delegation survive new rows being added?", a: "The listener is on the parent, and events from any descendant bubble up to it — including elements that did not exist when it was attached." },
    { q: "Inside a listener on a table, you click a cell. What is event.currentTarget?", a: "The table — the element whose handler is running. event.target is the cell." }
  ],
  lab: true
},

"js::Async and fetch": {
  concept: "A network request takes hundreds of milliseconds, and the single thread cannot wait. So fetch returns immediately with a promise: an object that will hold either a result or an error later. await pauses only the async function it is written in, letting the rest of the page carry on, and resumes when the promise settles. Two things about fetch trip everyone up. First, it only rejects on a network failure — a 404 or a 500 is a perfectly successful round trip as far as fetch is concerned, so you must check res.ok yourself. Second, the body is a second promise, because it streams in after the headers, which is why res.json() also needs an await. And when you need several independent requests, awaiting them one after another in a loop makes them queue; Promise.all starts them together and waits once, which is usually the difference between a slow page and a fast one.",
  figure: "  serial     await a   ---400ms--->\n             await b              ---400ms--->   total 800ms\n\n  parallel   Promise.all([a, b])\n             a ---400ms--->\n             b ---400ms--->                      total 400ms",
  traps: [
    "Treating a 404 as an error automatically. Check res.ok.",
    "Forgetting the second await on res.json().",
    "Awaiting inside a loop when the requests do not depend on each other."
  ],
  quiz: [
    { q: "Your fetch returned 500 and no catch block fired. Why?", a: "fetch only rejects on network failure. A server error is a successful request, so you must test res.ok." },
    { q: "When is Promise.all the right tool?", a: "When several requests are independent — it starts them together instead of queuing them." }
  ],
  lab: true
},

"php::Running PHP": {
  concept: "PHP runs once per request and then forgets everything. A visitor asks for a URL, the server starts a fresh PHP process, your script runs top to bottom, it produces a string of HTML, that string is sent, and every variable is destroyed. The next click starts again from nothing. This is the opposite of the browser-side model, where your JavaScript keeps state in memory for as long as the tab is open, and it explains almost every structural decision in PHP. Anything that must survive between requests has to be written somewhere: a session, a cookie, a file, a database. It also explains why output order matters — headers must be sent before any body content, so a stray blank line above your opening tag will break a redirect. And it is why PHP is comfortable being messy in small scripts and demanding about structure in large ones: nothing persists to hide your state, but nothing persists to protect it either.",
  figure: "  request --> start PHP --> run script --> output HTML --> process dies\n                                |\n                       session / database\n                       (the only things that survive)",
  traps: [
    "Whitespace before the opening tag, which sends output early and breaks headers and redirects.",
    "Expecting a variable to still exist on the next page load.",
    "Leaving display_errors on in production, exposing paths and query structure."
  ],
  quiz: [
    { q: "Why does a redirect sometimes fail with 'headers already sent'?", a: "Something was output before the header call — often a blank line before the opening PHP tag. Headers must precede any body content." },
    { q: "Where does state live between two requests?", a: "In a session, cookie, file or database. Nothing in PHP memory survives the end of the request." }
  ],
  lab: true
},

"php::Arrays": {
  concept: "PHP has one array type doing two jobs. Give it no keys and it behaves like a list with integer indexes; give it string keys and it behaves like a dictionary. Both are the same ordered map underneath, which is convenient right up to the moment it is not: unset an item from the middle of a list and the remaining keys keep their original numbers, so a later json_encode produces an object rather than an array and your JavaScript silently receives the wrong shape. array_values reindexes and fixes it. The second thing worth knowing is that arrays are assigned by value, unlike objects — copying an array really copies it, which is safe but costly for large data. And foreach with a reference (&$value) is the one exception that leaves a dangling reference behind: unset the variable after the loop, or you will corrupt the last element the next time you loop over the same array.",

  ],

},

"php::Forms and superglobals": {
  concept: "Everything in $_POST, $_GET, $_COOKIE and the request headers was typed by someone you have never met, and it arrives as a string of their choosing. The discipline has two halves, and confusing them is where vulnerabilities come from. Validation happens on the way in and asks whether the value is the right shape: is this an integer, does it look like an email, is this id one the current user is allowed to touch. Escaping happens on the way out and depends entirely on where the value is going. Text headed for HTML goes through htmlspecialchars, or a submitted script tag becomes a running script for every future visitor. A value headed for SQL goes through a prepared statement, so the database treats it as data and never as syntax. There is no single sanitize call that makes a value safe everywhere, because safety is a property of the destination, not of the value.",
  figure: "  user input\n      |\n   validate  (right shape? allowed?)\n      |\n   store / use\n      |\n   escape at the boundary:\n      HTML page  -> htmlspecialchars()\n      SQL query  -> prepared statement\n      shell cmd  -> escapeshellarg()",
  traps: [
    "Trusting a hidden field or a select value because the form only offered valid options.",
    "Escaping once on input and assuming it is safe for every destination.",
    "Using $_GET for an action that changes data, which a crawler can then trigger."
  ],
  quiz: [
    { q: "Where does htmlspecialchars belong: input or output?", a: "Output, at the moment the value is printed into HTML. Escaping depends on the destination." },
    { q: "Why is escaping not a substitute for prepared statements?", a: "HTML escaping makes a value safe for a page, not for SQL. The database needs the value kept separate from the query syntax." }
  ],
  lab: true
},

"php::Databases with PDO": {
  concept: "A prepared statement sends the query and the data to the database separately. First the SQL goes across with placeholders where the values belong, and the database parses and plans it right then, while the values are still absent. Then the values go across as data and are bound into the plan. Because the parsing already finished, a value containing quotes, semicolons or a DROP TABLE is never read as syntax — it is just a string that happens to contain those characters. That is the whole defence, and it is structural rather than a matter of filtering cleverly enough. Concatenating a value into the SQL string collapses the separation and there is no escaping routine that reliably restores it. Set ERRMODE_EXCEPTION so failures throw instead of returning false, turn off emulated prepares so the separation is real rather than simulated in the driver, and wrap multi-step writes in a transaction so a half-finished change is never left behind.",
  figure: "  concatenated:  SELECT ... WHERE id = '  \" OR 1=1 --  '\n                 (value became syntax)\n\n  prepared:      SELECT ... WHERE id = ?     <- parsed first\n                 then bind value             <- can never be syntax",
  traps: [
    "Building SQL with string concatenation, even 'just this once' for an internal tool.",
    "Leaving the default error mode, where a failed query returns false and the script continues.",
    "Leaving emulated prepares on, which sends one assembled string rather than a real prepared statement."
  ],
  quiz: [
    { q: "Why does a prepared statement stop SQL injection?", a: "The query is parsed before the values arrive, so a value can never be interpreted as SQL syntax." },
    { q: "What does ATTR_ERRMODE set to exception change?", a: "Failures throw a PDOException instead of returning false, so a broken query stops the script rather than silently continuing." }
  ],
  lab: true
},

const KEY_THEME = "codex.theme";
const KEY_PINS = "codex.pins";
const KEY_VOL = "codex.vol";
const KEY_READ = "codex.read";
const KEY_RESUME = "codex.resume";

const railEl = document.getElementById("rail");
const pageEl = document.getElementById("page");
const searchEl = document.getElementById("search");
const toastEl = document.getElementById("toast");
const pinCountEl = document.getElementById("pinCount");

const state = { vol: "junos", q: "" };
let pins = [];
let reads = [];
let resume = null;

function store(key, fallback){
  try { const raw = localStorage.getItem(key); return raw === null ? fallback : JSON.parse(raw); }
  catch (e) { return fallback; }
}
function save(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

DATA.forEach(vol => {
  vol.groups.forEach(g => {
    const extra = AUG[vol.id + "::" + g.t];
    if (extra) {
      g.concept = extra.concept;
      g.figure = extra.figure;
      g.traps = extra.traps;
      g.quiz = extra.quiz;
      g.lab = extra.lab;
    }
  });
});

const FLAT = [];
DATA.forEach(vol => {
  vol.groups.forEach(g => {
    g.e.forEach(entry => {
      FLAT.push({
        key: vol.id + "::" + g.t + "::" + entry.c,
        vol: vol, group: g.t, entry: entry,
        hay: (entry.c + " " + entry.d + " " + (entry.n || "") + " " + g.t + " " + vol.name).toLowerCase()
      });
    });
  });
});
GLOSSARY.forEach(item => {
  const vol = DATA.filter(v => v.id === item.vol)[0];
  if (!vol) return;
  FLAT.push({
    key: "glossary::" + item.vol + "::" + item.c,
    vol: vol, group: "Glossary", glossary: true,
    entry: { c: item.c, d: item.d, n: item.n },
    hay: (item.c + " " + item.d + " " + item.n + " glossary " + vol.name).toLowerCase()
  });
});

function svgIcon(kind){
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", "15"); svg.setAttribute("height", "15");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "1.7");
  const p = document.createElementNS(ns, "path");
  if (kind === "pin") p.setAttribute("d", "M6 3h12v18l-6-4.5L6 21z");
  else p.setAttribute("d", "M9 9h10v12H9zM5 15V3h10v2");
  svg.appendChild(p);
  return svg;
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => toastEl.classList.remove("show"), 1400);
}

function copy(text){
  const done = () => toast("Copied");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => toast("Copy blocked by the browser"));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Copy blocked by the browser"); }
    ta.remove();
  }
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

const HEX_LEARNED = (function(){ try { const h = JSON.parse(localStorage.getItem("hexle.v1")); return (h && h.learned) || []; } catch (e) { return []; } })();

function buildEntry(item){
  const art = el("article", "entry");
  if (item.entry.r && HEX_LEARNED.indexOf(item.entry.r) === -1) {
    art.classList.add("locked");
    const lh = el("div", "head");
    lh.appendChild(el("code", "code", "Locked"));
    lh.appendChild(el("p", "gloss", "Learn this in Hexle School · " + item.entry.w));
    art.appendChild(lh);
    return art;
  }
  const head = el("div", "head");
  head.tabIndex = 0;
  head.setAttribute("role", "button");
  head.setAttribute("aria-expanded", "false");

  const code = el("code", "code", item.entry.c);
  const gloss = el("p", "gloss", item.entry.d);
  const tools = el("div", "tools");

  const pinBtn = document.createElement("button");
  pinBtn.appendChild(svgIcon("pin"));
  pinBtn.title = "Pin this entry";
  pinBtn.setAttribute("aria-label", "Pin this entry");
  if (pins.indexOf(item.key) !== -1) pinBtn.classList.add("pinned");
  pinBtn.addEventListener("click", ev => {
    ev.stopPropagation();
    const i = pins.indexOf(item.key);
    if (i === -1) { pins.push(item.key); pinBtn.classList.add("pinned"); toast("Pinned"); }
    else { pins.splice(i, 1); pinBtn.classList.remove("pinned"); toast("Unpinned"); }
    save(KEY_PINS, pins);
    pinCountEl.textContent = pins.length;
    if (state.vol === "pins" && !state.q) render();
  });

  const copyBtn = document.createElement("button");
  copyBtn.appendChild(svgIcon("copy"));
  copyBtn.title = "Copy";
  copyBtn.setAttribute("aria-label", "Copy");
  copyBtn.addEventListener("click", ev => { ev.stopPropagation(); copy(item.entry.c); });

  tools.appendChild(pinBtn);
  tools.appendChild(copyBtn);
  head.appendChild(code);
  head.appendChild(gloss);
  head.appendChild(tools);

  const note = el("div", "note");
  if (item.entry.n) note.appendChild(el("p", null, item.entry.n));
  if (item.entry.x) note.appendChild(el("pre", null, item.entry.x));

  const toggle = () => {
    const open = art.classList.toggle("open");
    head.setAttribute("aria-expanded", open ? "true" : "false");
  };
  head.addEventListener("click", toggle);
  head.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
  });

  art.appendChild(head);
  art.appendChild(note);
  return art;
}

function volById(id){ return DATA.filter(v => v.id === id)[0]; }
function readKey(volId, title){ return volId + "::" + title; }
function isRead(volId, title){ return reads.indexOf(readKey(volId, title)) !== -1; }
function volProgress(vol){
  const done = vol.groups.filter(g => isRead(vol.id, g.t)).length;
  return { done: done, total: vol.groups.length };
}

function pageHead(title, blurb, count){
  const wrap = el("div", "vol-head");
  wrap.appendChild(el("h1", null, title));
  if (blurb) wrap.appendChild(el("p", null, blurb));
  if (count) wrap.appendChild(el("span", "count", count));
  return wrap;
}

function buildQuiz(quiz){
  const block = el("div", "block");
  block.appendChild(el("h3", null, "Check yourself"));
  quiz.forEach(item => {
    const wrap = el("div", "qa");
    const b = el("button", null, item.q);
    const a = el("p", null, item.a);
    b.addEventListener("click", () => wrap.classList.toggle("open"));
    wrap.appendChild(b); wrap.appendChild(a);
    block.appendChild(wrap);
  });
  return block;
}

function buildSection(vol, g, gi, total){
  const sec = el("section", "group");
  sec.id = vol.id + "-" + gi;

  const head = el("div", "sec-head");
  const num = el("span", "sec-num", (gi + 1) + " / " + total);
  if (isRead(vol.id, g.t)) num.classList.add("done");
  head.appendChild(num);
  head.appendChild(el("h2", null, g.t));

  const readBtn = el("button", "readbtn", isRead(vol.id, g.t) ? "Read" : "Mark read");
  if (isRead(vol.id, g.t)) readBtn.classList.add("done");
  readBtn.addEventListener("click", () => {
    const k = readKey(vol.id, g.t);
    const i = reads.indexOf(k);
    if (i === -1) {
      reads.push(k);
      resume = { vol: vol.id, gi: Math.min(gi + 1, total - 1) };
      save(KEY_RESUME, resume);
    } else {
      reads.splice(i, 1);
    }
    save(KEY_READ, reads);
    render();
    const target = document.getElementById(vol.id + "-" + gi);
    if (target) target.scrollIntoView({ block: "start" });
  });
  head.appendChild(readBtn);
  sec.appendChild(head);

  if (g.concept) {
    const c = el("div", "concept");
    c.appendChild(el("p", null, g.concept));
    if (g.figure) c.appendChild(el("pre", null, g.figure));
    sec.appendChild(c);
  }

  g.e.forEach(entry => {
    sec.appendChild(buildEntry({ key: vol.id + "::" + g.t + "::" + entry.c, vol: vol, group: g.t, entry: entry }));
  });

  if (g.traps) {
    const block = el("div", "block");
    block.appendChild(el("h3", null, "Where this goes wrong"));
    const ul = document.createElement("ul");
    g.traps.forEach(t => ul.appendChild(el("li", null, t)));
    block.appendChild(ul);
    sec.appendChild(block);
  }

  if (g.quiz) sec.appendChild(buildQuiz(g.quiz));

  const foot = el("div", "sec-foot");
  if (g.lab && LAB_LINKS[vol.id]) {
    const a = document.createElement("a");
    a.href = LAB_LINKS[vol.id].href;
    a.textContent = "Drill this in " + LAB_LINKS[vol.id].label;
    foot.appendChild(a);
  }
  const printBtn = el("button", null, "Print this section");
  printBtn.addEventListener("click", () => {
    document.body.classList.add("print-one");
    sec.classList.add("print-me");
    window.print();
    setTimeout(() => {
      document.body.classList.remove("print-one");
      sec.classList.remove("print-me");
    }, 500);
  });
  foot.appendChild(printBtn);

  if (gi + 1 < total) {
    const next = el("button", "next", "Next: " + vol.groups[gi + 1].t);
    next.addEventListener("click", () => {
      const target = document.getElementById(vol.id + "-" + (gi + 1));
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    foot.appendChild(next);
  }
  sec.appendChild(foot);
  return sec;
}

function renderVolume(vol){
  pageEl.style.setProperty("--vc", vol.color);
  const total = vol.groups.reduce((a, g) => a + g.e.length, 0);
  const p = volProgress(vol);
  pageEl.appendChild(pageHead(vol.name, vol.blurb,
    vol.groups.length + " sections, " + total + " entries, " + p.done + " read"));

  if (resume && resume.vol === vol.id && resume.gi > 0 && resume.gi < vol.groups.length) {
    const bar = el("div", "resume");
    const s = document.createElement("span");
    s.appendChild(document.createTextNode("You stopped at section " + (resume.gi + 1) + ": "));
    s.appendChild(el("b", null, vol.groups[resume.gi].t));
    bar.appendChild(s);
    const b = el("button", null, "Continue");
    b.addEventListener("click", () => {
      const target = document.getElementById(vol.id + "-" + resume.gi);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    bar.appendChild(b);
    pageEl.appendChild(bar);
  }

  vol.groups.forEach((g, gi) => pageEl.appendChild(buildSection(vol, g, gi, vol.groups.length)));
}

function renderPins(){
  pageEl.style.setProperty("--vc", "var(--pin)");
  const items = FLAT.filter(i => pins.indexOf(i.key) !== -1);
  pageEl.appendChild(pageHead("Pinned", "The entries you keep coming back to.", items.length + " pinned"));
  if (!items.length) {
    const box = el("div", "empty");
    box.appendChild(el("h2", null, "Nothing pinned yet"));
    box.appendChild(el("p", null, "Pin an entry with the bookmark button and it collects here, across every volume."));
    pageEl.appendChild(box);
    return;
  }
  DATA.forEach(vol => {
    const mine = items.filter(i => i.vol.id === vol.id);
    if (!mine.length) return;
    const sec = el("section", "group");
    sec.style.setProperty("--vc", vol.color);
    const head = el("div", "sec-head");
    head.appendChild(el("h2", null, vol.name));
    sec.appendChild(head);
    mine.forEach(i => sec.appendChild(buildEntry(i)));
    pageEl.appendChild(sec);
  });
}

function renderRecipes(){
  pageEl.style.setProperty("--vc", "var(--accent)");
  pageEl.appendChild(pageHead("Recipes",
    "Whole tasks, start to finish, with the reasoning between the steps. Look here when you know what you want to achieve but not the order to do it in.",
    RECIPES.length + " recipes"));
  DATA.forEach(vol => {
    const mine = RECIPES.filter(r => r.vol === vol.id);
    if (!mine.length) return;
    const sec = el("section", "group");
    sec.style.setProperty("--vc", vol.color);
    const head = el("div", "sec-head");
    head.appendChild(el("h2", null, vol.name));
    sec.appendChild(head);
    mine.forEach(r => {
      const card = el("div", "recipe");
      card.appendChild(el("h2", null, r.t));
      card.appendChild(el("p", null, r.why));
      r.steps.forEach((s, i) => {
        const step = el("div", "step");
        step.appendChild(el("span", "n", String(i + 1)));
        step.appendChild(el("code", null, s.c));
        step.appendChild(el("p", null, s.n));
        card.appendChild(step);
      });
      sec.appendChild(card);
    });
    pageEl.appendChild(sec);
  });
}

function renderGlossary(){
  pageEl.style.setProperty("--vc", "var(--accent)");
  pageEl.appendChild(pageHead("Glossary",
    "Every term the labs assume you already know, in one line each.",
    GLOSSARY.length + " terms"));
  DATA.forEach(vol => {
    const mine = FLAT.filter(i => i.glossary && i.vol.id === vol.id);
    if (!mine.length) return;
    const sec = el("section", "group");
    sec.style.setProperty("--vc", vol.color);
    const head = el("div", "sec-head");
    head.appendChild(el("h2", null, vol.name));
    sec.appendChild(head);
    mine.forEach(i => sec.appendChild(buildEntry(i)));
    pageEl.appendChild(sec);
  });
}

function renderSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = FLAT.filter(i => terms.every(t => i.hay.indexOf(t) !== -1));
  hits.sort((a, b) => {
    const sa = a.entry.c.toLowerCase().indexOf(terms[0]) !== -1 ? 0 : 1;
    const sb = b.entry.c.toLowerCase().indexOf(terms[0]) !== -1 ? 0 : 1;
    return sa - sb;
  });
  pageEl.style.setProperty("--vc", "var(--accent)");
  pageEl.appendChild(pageHead("Search", null, hits.length + " matches for " + q));
  if (!hits.length) {
    const box = el("div", "empty");
    box.appendChild(el("h2", null, "No match"));
    box.appendChild(el("p", null, "Try a shorter term, or the plain word rather than the full command. Search looks at commands, descriptions, notes and the glossary."));
    pageEl.appendChild(box);
    return;
  }
  const sec = el("section", "group");
  hits.slice(0, 80).forEach(i => {
    const where = el("span", "hit-where", i.vol.name + " / " + i.group);
    const node = buildEntry(i);
    node.style.setProperty("--vc", i.vol.color);
    node.insertBefore(where, node.firstChild);
    sec.appendChild(node);
  });
  pageEl.appendChild(sec);
}

function railButton(id, name, sub, sigil, color, progress){
  const b = el("button", "vol");
  b.style.setProperty("--vc", color);
  if (state.vol === id && !state.q) b.setAttribute("aria-current", "true");
  const s = el("span", "sigil", sigil);
  const meta = el("span", "vol-meta");
  meta.appendChild(el("b", null, name));
  meta.appendChild(el("small", null, sub));
  if (progress) {
    const bar = el("div", "bar");
    const fill = document.createElement("i");
    fill.style.width = Math.round(100 * progress.done / progress.total) + "%";
    bar.appendChild(fill);
    meta.appendChild(bar);
  }
  b.appendChild(s); b.appendChild(meta);
  b.addEventListener("click", () => {
    state.vol = id;
    state.q = ""; searchEl.value = "";
    save(KEY_VOL, id);
    document.body.classList.remove("nav-open");
    render();
    window.scrollTo(0, 0);
  });
  railEl.appendChild(b);
}

function renderRail(){
  railEl.textContent = "";
  railEl.appendChild(el("div", "rail-label", "Volumes"));
  DATA.forEach(v => {
    const p = volProgress(v);
    railButton(v.id, v.name, p.done + " of " + p.total + " sections read", v.sigil, v.color, p);
  });
  railEl.appendChild(el("div", "rail-sep"));
  railButton("recipes", "Recipes", RECIPES.length + " whole tasks", "RC", "var(--accent)");
  railButton("glossary", "Glossary", GLOSSARY.length + " terms", "GL", "var(--accent)");
  railButton("pins", "Pinned", pins.length + " saved", "PN", "var(--pin)");

  if (!state.q) {
    const vol = volById(state.vol);
    if (vol) {
      railEl.appendChild(el("div", "rail-sep"));
      railEl.appendChild(el("div", "rail-label", "Sections"));
      vol.groups.forEach((g, gi) => {
        const j = el("button", "jump", (isRead(vol.id, g.t) ? "\u2713 " : "") + (gi + 1) + ". " + g.t);
        if (isRead(vol.id, g.t)) j.classList.add("on");
        j.addEventListener("click", () => {
          const target = document.getElementById(vol.id + "-" + gi);
          if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
          document.body.classList.remove("nav-open");
        });
        railEl.appendChild(j);
      });
    }
  }
}

function render(){
  pageEl.textContent = "";
  if (state.q) renderSearch(state.q);
  else if (state.vol === "pins") renderPins();
  else if (state.vol === "recipes") renderRecipes();
  else if (state.vol === "glossary") renderGlossary();
  else {
    const vol = volById(state.vol) || DATA[0];
    state.vol = vol.id;
    renderVolume(vol);
  }
  renderRail();
}

function setTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  const meta = document.querySelector("meta[name=theme-color]");
  if (meta) meta.setAttribute("content", mode === "night" ? "#0e1419" : "#e7ebef");
  save(KEY_THEME, mode);
}

document.getElementById("themeBtn").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme");
  setTheme(now === "night" ? "day" : "night");
});

document.getElementById("pinBtn").addEventListener("click", () => {
  state.vol = "pins"; state.q = ""; searchEl.value = "";
  render(); window.scrollTo(0, 0);
});

document.getElementById("drawerBtn").addEventListener("click", () => {
  document.body.classList.toggle("nav-open");
});
document.getElementById("scrim").addEventListener("click", () => {
  document.body.classList.remove("nav-open");
});

let searchTimer;
searchEl.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = searchEl.value.trim();
    render();
  }, 120);
});

document.addEventListener("keydown", ev => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (ev.key === "/" && !inField) { ev.preventDefault(); searchEl.focus(); searchEl.select(); }
  if (ev.key === "Escape") {
    document.body.classList.remove("nav-open");
    if (state.q) { searchEl.value = ""; state.q = ""; render(); }
    searchEl.blur();
  }
});

pins = store(KEY_PINS, []);
if (!Array.isArray(pins)) pins = [];
reads = store(KEY_READ, []);
if (!Array.isArray(reads)) reads = [];
resume = store(KEY_RESUME, null);
pinCountEl.textContent = pins.length;
setTheme(store(KEY_THEME, "day"));
state.vol = store(KEY_VOL, "junos");
render();
</script>
</body>
</html>
