<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7ebef">
<title>Codex — Mega Lab Reference</title>
<style>
:root{
  --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --rail: 268px;
  --r: 3px;
}
html[data-theme="day"]{
  --bg:#e7ebef; --panel:#f8f9fb; --sunk:#eef1f4; --ink:#151e27; --strong:#0a1118;
  --muted:#5d6b79; --faint:#8a97a3; --line:#d4dae0; --hair:#e3e8ec;
  --accent:#0d6a85; --accent-soft:#d8e8ed; --pin:#a96c2e;
}
html[data-theme="night"]{
  --bg:#0e1419; --panel:#151c22; --sunk:#111920; --ink:#d9e2e8; --strong:#f1f6f9;
  --muted:#8a9dab; --faint:#65788a; --line:#242f38; --hair:#1d262e;
  --accent:#54c3dc; --accent-soft:#12303a; --pin:#d3924b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}

.top{
  display:flex; align-items:center; gap:14px;
  height:56px; padding:0 16px;
  background:var(--panel); border-bottom:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
}
.brand{display:flex;align-items:baseline;gap:9px;flex:none}
.brand b{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--strong)}
.brand span{color:var(--faint);font-size:12px}
.drawer-btn{display:none;padding:6px;border-radius:var(--r)}
.search-wrap{flex:1;max-width:520px;position:relative;display:flex;align-items:center}
.search-wrap > svg{position:absolute;left:10px;opacity:.5;pointer-events:none}
#search{
  width:100%; padding:8px 12px 8px 32px; font:inherit;
  background:var(--sunk); color:var(--ink);
  border:1px solid var(--line); border-radius:var(--r);
}
#search::placeholder{color:var(--faint)}
.kbd{
  position:absolute;right:8px;color:var(--faint);font-family:var(--mono);font-size:11px;
  border:1px solid var(--line);border-radius:2px;padding:1px 5px;pointer-events:none
}
#search:focus + .kbd{display:none}
.top-tools{display:flex;gap:4px;margin-left:auto;flex:none}
.tbtn{padding:7px 10px;border-radius:var(--r);color:var(--muted);display:flex;align-items:center;gap:6px;font-size:13px}
.tbtn:hover{background:var(--sunk);color:var(--ink)}

.shell{display:flex;min-height:calc(100vh - 56px);align-items:flex-start}

.rail{
  width:var(--rail); flex:none; position:sticky; top:56px;
  height:calc(100vh - 56px); overflow-y:auto; overscroll-behavior:contain;
  background:var(--panel); border-right:1px solid var(--line); padding:14px 0 40px;
}
.rail-label{font-size:11px;letter-spacing:.06em;color:var(--faint);padding:0 16px 8px}
.vol{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 16px;text-align:left;border-left:2px solid transparent;color:var(--muted);
}
.vol:hover{background:var(--sunk);color:var(--ink)}
.vol[aria-current="true"]{border-left-color:var(--vc,var(--accent));color:var(--strong);background:var(--sunk)}
.sigil{
  width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:2px;
  font-family:var(--mono);font-size:12px;font-weight:600;
  color:var(--vc);border:1px solid var(--vc);opacity:.85;
}
.vol-meta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.vol-meta b{font-weight:600;font-size:14px}
.vol-meta small{color:var(--faint);font-size:11.5px}
.rail-sep{height:1px;background:var(--hair);margin:12px 16px}
.jump{display:block;width:100%;text-align:left;padding:5px 16px 5px 26px;color:var(--muted);font-size:13px}
.jump:hover{color:var(--accent)}
.jump.on{color:var(--strong);font-weight:600}

.page{flex:1;min-width:0;padding:34px 40px 140px;max-width:1180px}
.vol-head{margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.vol-head h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;color:var(--strong)}
.vol-head p{color:var(--muted);margin-top:7px;max-width:62ch;font-size:14.5px}
.vol-head .count{color:var(--faint);font-size:12.5px;font-family:var(--mono);margin-top:10px;display:block}

.group{margin-bottom:34px;scroll-margin-top:78px}
.group > h2{
  font-size:13px;font-weight:600;color:var(--vc,var(--accent));letter-spacing:.03em;
  padding-bottom:7px;margin-bottom:0;border-bottom:1px solid var(--hair);
}
.entry{border-bottom:1px solid var(--hair);background:var(--panel)}
.entry.open{background:var(--sunk)}
.head{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 14px;
  align-items:baseline;padding:11px 12px;cursor:pointer;
}
.head:hover .code{color:var(--accent)}
.code{font-family:var(--mono);font-size:13.5px;color:var(--strong);word-break:break-word;grid-column:1}
.gloss{color:var(--muted);font-size:13.5px;grid-column:1;max-width:74ch}
.tools{grid-column:2;grid-row:1 / span 2;display:flex;gap:2px;align-self:center}
.tools button{padding:6px;border-radius:var(--r);color:var(--faint);opacity:.5;display:grid;place-items:center}
.entry:hover .tools button,.entry:focus-within .tools button{opacity:1}
.tools button:hover{background:var(--bg);color:var(--ink)}
.tools button.pinned{color:var(--pin);opacity:1}
.note{display:none;padding:2px 12px 16px 12px}
.entry.open .note{display:block}
.note p{font-family:var(--serif);font-size:15.5px;line-height:1.62;color:var(--ink);max-width:66ch}
.note pre{
  font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--ink);
  background:var(--bg);border:1px solid var(--hair);border-left:2px solid var(--vc,var(--accent));
  border-radius:var(--r);padding:10px 12px;margin-top:11px;overflow-x:auto;max-width:80ch;white-space:pre;
}
.hit-where{font-size:11.5px;color:var(--faint);font-family:var(--mono);padding:9px 12px 0;display:block}
.empty{padding:56px 4px;max-width:52ch}
.empty h2{font-family:var(--serif);font-size:22px;color:var(--strong);margin-bottom:8px}
.empty p{color:var(--muted)}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--strong);color:var(--panel);padding:8px 16px;border-radius:var(--r);
  font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s;
}
.toast.show{opacity:1}
.scrim{display:none}

.sec-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--hair);padding-bottom:7px;margin-bottom:0}
.sec-head h2{font-size:13px;font-weight:600;color:var(--vc,var(--accent));letter-spacing:.03em;border:none;padding:0;margin:0;flex:1}
.sec-num{
  font-family:var(--mono);font-size:11px;color:var(--faint);
  border:1px solid var(--line);border-radius:2px;padding:1px 6px;flex:none;
}
.sec-num.done{color:var(--vc,var(--accent));border-color:var(--vc,var(--accent))}
.readbtn{font-size:12px;color:var(--faint);padding:3px 8px;border:1px solid var(--line);border-radius:var(--r);flex:none}
.readbtn:hover{color:var(--ink);border-color:var(--muted)}
.readbtn.done{color:var(--vc,var(--accent));border-color:var(--vc,var(--accent))}
.concept{padding:16px 12px 18px;background:var(--panel);border-bottom:1px solid var(--hair)}
.concept p{font-family:var(--serif);font-size:16px;line-height:1.66;color:var(--ink);max-width:68ch}
.concept pre{
  font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--muted);
  background:var(--bg);border:1px solid var(--hair);border-radius:var(--r);
  padding:12px 14px;margin-top:14px;overflow-x:auto;max-width:80ch;white-space:pre;
}
.block{padding:14px 12px 16px;background:var(--panel);border-top:1px solid var(--hair)}
.block h3{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:.03em}
.block ul{list-style:none;max-width:72ch}
.block li{position:relative;padding-left:16px;margin-bottom:6px;font-size:14px;color:var(--ink)}
.block li::before{content:"–";position:absolute;left:0;color:var(--vc,var(--accent))}
.qa{max-width:70ch;margin-bottom:10px}
.qa button{
  text-align:left;font-size:14px;color:var(--ink);padding:8px 10px;width:100%;
  border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);
}
.qa button:hover{border-color:var(--vc,var(--accent))}
.qa p{
  display:none;font-family:var(--serif);font-size:15px;line-height:1.6;
  color:var(--muted);padding:9px 10px 2px;
}
.qa.open p{display:block}
.sec-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 12px 0}
.sec-foot a,.sec-foot button{
  font-size:13px;color:var(--muted);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 11px;text-decoration:none;display:inline-block;
}
.sec-foot a:hover,.sec-foot button:hover{color:var(--strong);border-color:var(--vc,var(--accent))}
.sec-foot .next{color:var(--vc,var(--accent));border-color:var(--vc,var(--accent))}
.bar{height:2px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden;width:150px}
.bar i{display:block;height:100%;background:var(--vc,var(--accent))}
.resume{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--vc,var(--accent));
  border-radius:var(--r);padding:12px 14px;margin-bottom:24px;
}
.resume span{font-size:14px;color:var(--muted);flex:1;min-width:220px}
.resume b{color:var(--strong);font-weight:600}
.resume button{font-size:13px;color:var(--vc,var(--accent));border:1px solid var(--vc,var(--accent));border-radius:var(--r);padding:6px 12px}
.recipe{background:var(--panel);border-bottom:1px solid var(--hair);padding:16px 12px 18px;margin-bottom:0}
.recipe h2{font-family:var(--serif);font-size:20px;color:var(--strong);font-weight:600;border:none;padding:0}
.recipe > p{color:var(--muted);font-size:13.5px;margin:4px 0 14px;max-width:70ch}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 12px;margin-bottom:12px}
.step .n{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:3px}
.step code{
  font-family:var(--mono);font-size:13px;color:var(--strong);white-space:pre-wrap;
  background:var(--bg);border:1px solid var(--hair);border-left:2px solid var(--vc,var(--accent));
  border-radius:var(--r);padding:7px 10px;display:block;
}
.step p{grid-column:2;font-size:13.5px;color:var(--muted);max-width:70ch}

@media (max-width:900px){
  .drawer-btn{display:grid;place-items:center}
  .rail{
    position:fixed;top:0;left:0;height:100%;z-index:60;
    transform:translateX(-100%);transition:transform .22s ease;
    padding-top:calc(16px + env(safe-area-inset-top,0px));
  }
  body.nav-open .rail{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
  .page{padding:22px 16px 140px}
  .vol-head h1{font-size:27px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.rail,.tools,.sec-foot,.readbtn,.resume{display:none}
  .page{padding:0;max-width:none}
  .note,.qa p{display:block!important}
  .entry{break-inside:avoid}
  body.print-one .group{display:none}
  body.print-one .group.print-me{display:block}
  body.print-one .vol-head{display:none}
}
.entry.locked{opacity:.5}.entry.locked .head{cursor:default}
</style>
</head>
<body>
<header class="top">
  <button class="drawer-btn tbtn" id="drawerBtn" aria-label="Open volumes">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand"><b>Codex</b><span>Mega Lab reference</span></div>
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search every volume" autocomplete="off" spellcheck="false">
    <span class="kbd">/</span>
  </div>
  <div class="top-tools">
    <button class="tbtn" id="pinBtn" title="Pinned entries">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
      <span id="pinCount">0</span>
    </button>
    <button class="tbtn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main class="page" id="page"></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA = [];
DATA.push({
id:"junos", sigil:"JN", name:"Junos", sub:"Switch CLI", color:"#b3673c",
blurb:"EX-series command line, ELS dialect. Everything you type at a switch: modes, config, protocols, and the show commands that prove it worked.",
groups:[
{t:"Modes and navigation", e:[
 {c:"cli", d:"Enter the Junos CLI from the shell prompt", n:"A % prompt means you are in the FreeBSD shell, not Junos. Type cli to get the > operational prompt. Typing exit from operational mode drops you back to the shell."},
 {c:"configure", d:"Move from operational mode to configuration mode", n:"The prompt changes from > to #. Shared mode by default, so two people can edit at once and both see each other's uncommitted changes."},
 {c:"configure exclusive", d:"Lock the candidate config so nobody else can edit", n:"Use it on a production switch during a change window. If someone else already holds the lock you are told who."},
 {c:"edit interfaces ge-0/0/1", d:"Drop into a branch of the hierarchy", n:"Everything you type after this is relative to that branch, so you type fewer words and make fewer typos. up moves one level back, top returns to the root, exit leaves the branch."},
 {c:"show | display set", d:"Show the config as flat set commands", n:"The default view is a curly-brace tree. This flattens it into the same set lines you would type, which is what you want when copying config between switches or into a change ticket.", x:"user@sw> show configuration interfaces ge-0/0/1 | display set"},
 {c:"run show interfaces terse", d:"Run an operational command without leaving config mode", n:"run is the bridge from # back to >. Saves you committing or exiting just to check something."},
 {c:"help reference ospf", d:"Open the built-in documentation for a statement", n:"help topic explains the concept, help reference explains the syntax. Useful when you are offline in a datacenter with no browser."}
]},
{t:"The commit workflow", e:[
 {c:"show | compare", d:"Diff the candidate config against what is running", n:"The single most important habit in Junos. Lines with + are being added, lines with - removed. Read this before every commit, every time.", x:"[edit]\nuser@sw# show | compare\n[edit interfaces ge-0/0/1]\n+   description UPLINK-TO-CORE"},
 {c:"commit check", d:"Validate the candidate without applying it", n:"Catches syntax and consistency errors (missing units, an ae bundle with no device-count) while the running config stays untouched."},
 {c:"commit confirmed 5", d:"Commit, but roll back automatically in 5 minutes", n:"Your safety net for remote changes. If the change locks you out, the switch restores the previous config on its own. If it works, type commit again within the window to make it permanent."},
 {c:"commit and-quit", d:"Apply the change and return to operational mode", n:"Common end-of-change shortcut. Add comment 'text' to label the commit in the log."},
 {c:"rollback 1", d:"Load the previous committed config as the candidate", n:"rollback only loads it, it does not apply it. You still have to commit. The switch keeps 50 previous commits, rollback 0 is the current running config, so rollback 0 discards your uncommitted edits."},
 {c:"show system commit", d:"List recent commits with user, time and comment", n:"Your audit trail. Pair it with commit comment so the list reads as a change log instead of a row of timestamps."},
 {c:"request system configuration rescue save", d:"Save the current config as the rescue copy", n:"Do this once a switch is known-good. rollback rescue then brings that copy back no matter how deep the mess."},
 {c:"load set terminal", d:"Paste a block of set commands into the candidate", n:"Paste your lines, then press Ctrl+D to finish. load merge and load override read from a file instead. Always follow with show | compare."}
]},
{t:"Interfaces", e:[
 {c:"set interfaces ge-0/0/1 description UPLINK-CORE", d:"Label a port", n:"Free text, no spaces unless you quote it. Descriptions appear in show interfaces descriptions and save you tracing cables later."},
 {c:"set interfaces ge-0/0/1 unit 0 family ethernet-switching", d:"Make the port a switch port", n:"Unit 0 is the logical interface. family ethernet-switching means layer 2. family inet with an address would make it a routed port instead."},
 {c:"set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode access", d:"Set an access port (ELS syntax)", n:"ELS is the dialect on EX4300 and newer. The old non-ELS word was port-mode, which will be rejected here. One untagged VLAN for one device.", x:"set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode access\nset interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members SERVERS"},
 {c:"set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode trunk", d:"Set a trunk port carrying tagged VLANs", n:"Trunks go switch to switch, or to a hypervisor. Add vlan members per VLAN, or vlan members all. Untagged traffic on a trunk needs native-vlan-id."},
 {c:"set interfaces ge-0/0/1 mtu 9216", d:"Raise the MTU for jumbo frames", n:"On EX the MTU is set on the physical interface and includes the Ethernet header. Every device in the path must agree or you get silent drops on large packets."},
 {c:"set interfaces ge-0/0/9 disable", d:"Administratively shut a port", n:"Junos has no shutdown keyword. delete interfaces ge-0/0/9 disable brings it back up."},
 {c:"set interfaces em0 unit 0 family inet address 10.0.0.9/24", d:"Address the out-of-band management port", n:"em0 (or me0/vme on a Virtual Chassis) lives in its own routing instance on many boxes, so it needs its own static route through the management gateway."}
]},
{t:"VLANs and switching", e:[
 {c:"set vlans SERVERS vlan-id 10", d:"Create a VLAN with a name and a tag", n:"In ELS the VLAN name is the handle you use everywhere else. Numbers live only in the vlan-id statement.", x:"set vlans SERVERS vlan-id 10\nset vlans SERVERS description Customer-facing servers"},
 {c:"set vlans SERVERS l3-interface irb.10", d:"Give the VLAN a gateway interface", n:"irb is the routed virtual interface for a VLAN. The unit number does not have to match the VLAN id, but make it match anyway so the config reads itself."},
 {c:"set interfaces irb unit 10 family inet address 10.0.10.1/24", d:"Address the VLAN gateway", n:"This is the default gateway your servers in VLAN 10 will point at. The irb stays down until at least one access port in that VLAN is up."},
 {c:"set vlans SERVERS vlan-id 10 vlan-id-list 10-20", d:"Create a range of VLANs at once", n:"A shortcut for building lab or customer ranges. Each id gets its own VLAN named with the range prefix."},
 {c:"set interfaces ge-0/0/2 unit 0 family ethernet-switching native-vlan-id 99", d:"Set the untagged VLAN on a trunk", n:"Frames arriving untagged on the trunk land in VLAN 99. Mismatched native VLANs between two switches are a classic silent misconfiguration."},
 {c:"show ethernet-switching table", d:"See which MAC addresses are learned where", n:"Your first stop for 'is the server actually plugged in'. Add vlan SERVERS to narrow it, or interface ge-0/0/1 to check one port."}
]},
{t:"Link aggregation and LACP", e:[
 {c:"set chassis aggregated-devices ethernet device-count 4", d:"Reserve ae interfaces before you can use them", n:"Nothing works without this. The count is how many ae bundles exist (ae0 to ae3), not how many members each has. Forgetting it is the most common LAG mistake."},
 {c:"set interfaces ge-0/0/1 ether-options 802.3ad ae0", d:"Add a physical port to a bundle", n:"The member port must have no family statements of its own. All configuration (VLANs, mode, MTU) moves to ae0."},
 {c:"set interfaces ae0 aggregated-ether-options lacp active", d:"Turn on LACP negotiation", n:"Active sends LACP packets, passive only answers. At least one side must be active. Both passive means the bundle never forms.", x:"set interfaces ae0 aggregated-ether-options lacp active\nset interfaces ae0 aggregated-ether-options lacp periodic fast\nset interfaces ae0 unit 0 family ethernet-switching interface-mode trunk"},
 {c:"show lacp interfaces ae0", d:"Check the bundle negotiated", n:"You want Collecting and Distributing on both sides. Defaulted or Expired means the far end is not talking LACP, usually because it is static or misconfigured."}
]},
{t:"Virtual Chassis", e:[
 {c:"show virtual-chassis", d:"See members, roles and neighbour IDs", n:"Roles are Master, Backup and Linecard. Prsnt means the member is up. This is the command you run first when a stack behaves oddly."},
 {c:"request virtual-chassis vc-port set pic-slot 1 port 0", d:"Convert an uplink port into a VC port", n:"Run it on the member you are cabling, in operational mode. Dedicated VC ports on the rear need no conversion."},
 {c:"set virtual-chassis preprovisioned", d:"Pin roles to serial numbers", n:"Preprovisioning stops the stack from electing a different master after a reboot. You list each member's serial and role explicitly.", x:"set virtual-chassis preprovisioned\nset virtual-chassis member 0 role routing-engine serial-number PE3714120001\nset virtual-chassis member 1 role line-card serial-number PE3714120002"},
 {c:"show virtual-chassis vc-port statistics", d:"Check VC link health and errors", n:"Rising errors on a VC port mean a bad cable or optic, and show up as members flapping in and out of the stack."}
]},
{t:"Spanning tree and port protection", e:[
 {c:"set protocols rstp bridge-priority 4096", d:"Influence which switch becomes root", n:"Lower wins, in steps of 4096. Set the core switch low on purpose rather than letting the lowest MAC address decide for you."},
 {c:"set protocols rstp interface ge-0/0/1 edge", d:"Mark an access port as an edge port", n:"Edge ports go to forwarding immediately instead of waiting through listening and learning. Only ever on ports facing hosts, never switches."},
 {c:"set protocols rstp bpdu-block-on-edge", d:"Shut down an edge port that receives BPDUs", n:"Protection against someone plugging a switch into a desk port. The port is disabled until you clear it."},
 {c:"show spanning-tree bridge", d:"See the root bridge and this switch's role", n:"Confirms whether your priority change actually took effect. show spanning-tree interface shows per-port state and cost."},
 {c:"set forwarding-options storm-control-profiles SC all bandwidth-percentage 5", d:"Cap broadcast and unknown traffic per port", n:"Applied with storm-control SC under the port's ethernet-switching family. It limits a broadcast storm to a slice of the link instead of the whole thing.", x:"set forwarding-options storm-control-profiles SC all bandwidth-percentage 5\nset interfaces ge-0/0/1 unit 0 family ethernet-switching storm-control SC"}
]},
{t:"Routing", e:[
 {c:"set routing-options static route 0.0.0.0/0 next-hop 10.0.0.1", d:"Add a default route", n:"On a switch this is often all the routing you need. Check it landed with show route 0.0.0.0/0."},
 {c:"set routing-options autonomous-system 65001", d:"Set the local AS number before configuring BGP", n:"BGP will not commit without it. Private AS range is 64512 to 65534."},
 {c:"set protocols ospf area 0.0.0.0 interface irb.10", d:"Run OSPF on an interface", n:"Area 0 is the backbone and every other area must touch it. Junos enables OSPF per interface, not per network statement.", x:"set protocols ospf area 0.0.0.0 interface irb.10\nset protocols ospf area 0.0.0.0 interface lo0.0 passive"},
 {c:"set protocols ospf area 0.0.0.0 interface irb.20 passive", d:"Advertise a subnet without forming neighbours there", n:"Use it on user-facing VLANs. The prefix still gets advertised but the switch stops sending hellos where no router lives."},
 {c:"show ospf neighbor", d:"Check adjacencies", n:"Full is what you want. Stuck in ExStart usually means an MTU mismatch, stuck in Init means hellos are only going one way. Mismatched area, timers or subnet mask means no neighbour at all."},
 {c:"set protocols bgp group EXT type external peer-as 65002", d:"Define an external BGP peer group", n:"Group first, then neighbours inside it. type internal is for peers in your own AS.", x:"set protocols bgp group EXT type external\nset protocols bgp group EXT peer-as 65002\nset protocols bgp group EXT neighbor 192.0.2.2"},
 {c:"show bgp summary", d:"Check peer state and prefix counts", n:"State Establ means the session is up and the number after it is prefixes received. Active means it is trying and failing, usually reachability or a wrong peer-as."},
 {c:"show route 10.0.10.0/24 detail", d:"Inspect how a prefix was learned", n:"Shows protocol, preference and next hop. Junos calls administrative distance preference: direct 0, static 5, OSPF internal 10, BGP external 170."}
]},
{t:"Gateway redundancy", e:[
 {c:"set interfaces irb unit 10 family inet address 10.0.10.2/24 vrrp-group 10 virtual-address 10.0.10.1", d:"Share a virtual gateway IP between two switches", n:"Each switch keeps its own real address and both answer for the virtual one. Servers point at the virtual address and never notice a failover.", x:"set interfaces irb unit 10 family inet address 10.0.10.2/24 vrrp-group 10 virtual-address 10.0.10.1\nset interfaces irb unit 10 family inet address 10.0.10.2/24 vrrp-group 10 priority 200"},
 {c:"set interfaces irb unit 10 family inet address 10.0.10.2/24 vrrp-group 10 priority 200", d:"Decide which switch is master", n:"Higher wins, default 100. Set the primary explicitly so failback is predictable. Add preempt or no-preempt to control whether it takes the role back after recovering."},
 {c:"show vrrp", d:"See master and backup state per group", n:"Both sides reporting master means they cannot hear each other, usually a VLAN missing from the trunk between them."}
]},
{t:"DHCP", e:[
 {c:"set forwarding-options dhcp-relay server-group DC 10.0.1.5", d:"Relay client DHCP requests to a central server", n:"The switch forwards broadcasts from the VLAN to the server's unicast address. Without a relay, DHCP stops at the VLAN boundary.", x:"set forwarding-options dhcp-relay server-group DC 10.0.1.5\nset forwarding-options dhcp-relay group CLIENTS interface irb.10"},
 {c:"set system services dhcp-local-server group LAB interface irb.10", d:"Let the switch itself hand out addresses", n:"Handy in a lab. It needs an address pool under access address-assignment to draw from."},
 {c:"show dhcp relay binding", d:"See which clients got which lease through the relay", n:"Empty bindings with clients complaining points at the relay group missing the right irb interface."}
]},
{t:"Firewall filters and policy", e:[
 {c:"set firewall family inet filter MGMT term ALLOW from source-address 10.0.0.0/24", d:"Match traffic in a filter term", n:"Filters are ordered lists of terms, each with from (match) and then (action). Terms are evaluated top down and the first match wins."},
 {c:"set firewall family inet filter MGMT term ALLOW then accept", d:"Act on a matched term", n:"Common actions are accept, discard, reject, count and log. discard drops silently, reject sends an ICMP message back."},
 {c:"set firewall family inet filter MGMT term DENY-ALL then discard", d:"Close the list with an explicit deny", n:"There is an implicit discard at the end of every filter, but writing it out means you can attach a count and actually see what is being dropped."},
 {c:"set interfaces irb.10 family inet filter input MGMT", d:"Apply the filter to an interface", n:"input is traffic arriving, output is traffic leaving. A filter that is configured but not applied does nothing at all, which is an easy hour to lose."},
 {c:"set policy-options policy-statement EXPORT-LAN term 1 then accept", d:"Build a routing policy", n:"Policies control what routing protocols advertise and accept, filters control data traffic. Different tools, similar shape."}
]},
{t:"Verify and troubleshoot", e:[
 {c:"show interfaces terse", d:"One line per interface: admin state, link state, address", n:"The fastest whole-switch overview. Add | match ge-0/0/1 to narrow, or | match down to find what is dark."},
 {c:"show interfaces ge-0/0/1 extensive", d:"Full counters including errors and drops", n:"Pipe it with | match error to skip the wall of text. CRC errors point at cabling or an optic, input drops usually at congestion."},
 {c:"show lldp neighbors", d:"See what is connected to each port", n:"Your cable map when you cannot be in the datacenter. Requires set protocols lldp interface all on both ends."},
 {c:"show chassis hardware", d:"Model, serial numbers and installed modules", n:"Needed for support cases, licence checks and Virtual Chassis preprovisioning."},
 {c:"show system alarms", d:"Current alarms with severity", n:"A red alarm on a new switch is often just a missing rescue config or an unused power supply."},
 {c:"show log messages | last 40", d:"Read the tail of the system log", n:"Use | match interface-name to follow one port's flaps. monitor start messages streams it live, monitor stop ends it."},
 {c:"monitor interface traffic", d:"Live per-second counters across interfaces", n:"Press f to freeze, q to quit. Good for spotting which port is actually moving traffic during an incident."},
 {c:"show configuration | display set | match ge-0/0/1", d:"Find every line touching one interface", n:"The quickest way to audit a port when the config is thousands of lines long."}
]},
{t:"System, users and files", e:[
 {c:"set system host-name SW-OOST1-ACCS4", d:"Name the switch", n:"The prompt updates on commit. Use a naming scheme that encodes site and role, because it ends up in every log line you will ever read."},
 {c:"set system services ssh", d:"Enable SSH management access", n:"Junos ships with SSH off on some images. Pair it with root-authentication before you commit, or you will lock yourself out."},
 {c:"set system login user kaatje class super-user authentication plain-text-password", d:"Create a login account", n:"Classes are read-only, operator, super-user or a custom one. The password is prompted for and stored hashed, never in plain text."},
 {c:"set system ntp server 10.0.0.5", d:"Sync the clock", n:"Without NTP, log timestamps across switches do not line up and correlating an incident becomes guesswork."},
 {c:"request system reboot at now", d:"Reboot the switch", n:"On a Virtual Chassis add member N to reboot one member only. request system halt stops it without restarting."},
 {c:"file copy /var/tmp/backup.conf scp://user@10.0.0.9/backups/", d:"Move files off the switch", n:"Use it for config backups and log bundles. request support information gathers everything JTAC will ask for."}
]}
]});
DATA.push({
id:"python", sigil:"PY", name:"Python", sub:"Language and terminal", color:"#2f7a6f",
blurb:"The working reference behind Pyle: syntax, the data types you reach for daily, and the terminal commands that run and manage it all.",
groups:[
{t:"Running Python", e:[
 {c:"python3 script.py", d:"Run a script file", n:"On Windows the command is usually python or py. Add arguments after the filename and read them from sys.argv."},
 {c:"python3", d:"Open the interactive shell (REPL)", n:"Type expressions and see results immediately. exit() or Ctrl+D leaves. Perfect for testing one line before putting it in a file."},
 {c:"python3 -m http.server 8000", d:"Serve the current folder over HTTP", n:"A real web server in one line, for testing a static site. Visit localhost:8000. Ctrl+C stops it. Never use it in production."},
 {c:"python3 -i script.py", d:"Run a script, then drop into the shell with its variables loaded", n:"Excellent for debugging: the script finishes and everything it created is still there to poke at."},
 {c:"if __name__ == '__main__':", d:"Only run this part when the file is executed directly", n:"When another file imports yours, Python sets __name__ to the module name instead of '__main__', so this block stays quiet. It is how you keep a file usable as both a script and a library.", x:"def main():\n    print('doing the work')\n\nif __name__ == '__main__':\n    main()"},
 {c:"print(value, sep=' ', end='\\n')", d:"Write to the screen", n:"print takes several values at once. end='' stops the newline, which is how you build a line piece by piece."}
]},
{t:"Variables and types", e:[
 {c:"name = 'Kaatje'", d:"Assign a value to a name", n:"No declaration keyword and no type. The name is a label pointing at an object, and pointing it somewhere else later is fine."},
 {c:"type(x)", d:"Ask what something is", n:"Returns the class: int, float, str, list, dict, bool, NoneType. Your first move whenever a value behaves strangely."},
 {c:"int('42')  float('3.5')  str(42)", d:"Convert between types", n:"int and float are different types: 3 is not 3.0 in memory, and dividing with / always gives a float. int('3.5') raises an error because it will not guess whether you meant to round."},
 {c:"x = None", d:"The explicit nothing value", n:"Not zero, not empty string. Test with is None, never == None. A function with no return statement returns None."},
 {c:"True / False", d:"The two booleans", n:"Capitalised. Empty things (0, '', [], {}, None) count as false in a condition, everything else counts as true."},
 {c:"a, b = b, a", d:"Swap or unpack several values at once", n:"The right side is built first, so no temporary variable is needed. Works for any sequence: first, rest = items[0], items[1:]."}
]},
{t:"Strings", e:[
 {c:"f'Hello {name}, you have {n} tickets'", d:"Format values into a string (f-string)", n:"The f prefix lets you drop any expression inside braces. f'{price:.2f}' rounds to two decimals, f'{name:>10}' pads to the right."},
 {c:"len(s)", d:"Count the characters", n:"Works on any sequence: strings, lists, dicts, tuples."},
 {c:"s.strip()", d:"Remove whitespace from both ends", n:"The fix for input that arrived with a trailing newline. lstrip and rstrip do one side only."},
 {c:"s.split(',')", d:"Break a string into a list", n:"With no argument it splits on any whitespace. ','.join(parts) is the reverse.", x:"line = 'ge-0/0/1,up,trunk'\nport, state, mode = line.split(',')"},
 {c:"s.replace('old', 'new')", d:"Swap every occurrence", n:"Strings are immutable, so this returns a new string. s.replace(...) on its own changes nothing unless you assign the result."},
 {c:"s.lower()  s.upper()  s.title()", d:"Change case", n:"Lowercase both sides before comparing user input, otherwise 'Yes' and 'yes' are two different answers."},
 {c:"'error' in line", d:"Test whether a substring is present", n:"in works on strings, lists, dicts (checks keys) and sets. s.startswith('set ') is the anchored version."}
]},
{t:"Numbers and math", e:[
 {c:"7 / 2  ->  3.5", d:"True division always returns a float", n:"Even 4 / 2 gives 2.0. Use // when you want a whole number."},
 {c:"7 // 2  ->  3", d:"Floor division, and 7 % 2 gives the remainder", n:"% is the modulo operator. n % 2 == 0 tests for even, and modulo is how you wrap around a compass or a clock."},
 {c:"round(3.14159, 2)", d:"Round to a number of decimals", n:"For money, floats will eventually betray you: use the decimal module when exactness matters."},
 {c:"import random; random.randint(1, 6)", d:"Random integer, both ends included", n:"random.choice(list) picks an item, random.shuffle(list) reorders in place. Never use random for anything security related, use secrets."}
]},
{t:"Lists", e:[
 {c:"items = [1, 2, 3]", d:"An ordered, changeable sequence", n:"Indexed from 0. items[-1] is the last one, and mixing types in one list is legal but usually a sign the data wants a dict."},
 {c:"items.append(x)", d:"Add one item to the end", n:"extend(other) adds every item of another list. append(other_list) would nest the whole list as a single item instead."},
 {c:"items.insert(0, x)  items.pop()  items.remove(x)", d:"Insert, take off the end, delete by value", n:"pop() returns the item it removed, pop(0) takes from the front. remove raises ValueError if the value is not there."},
 {c:"items[1:3]", d:"Slice out a section", n:"Start is included, end is not, so [1:3] gives two items. items[:] makes a shallow copy, items[::-1] reverses.", x:"ports = ['ge-0/0/0','ge-0/0/1','ge-0/0/2','ge-0/0/3']\nprint(ports[1:3])\nprint(ports[-1])"},
 {c:"sorted(items)", d:"Return a new sorted list", n:"items.sort() sorts in place and returns None, which is a classic trap. Add reverse=True, or key=len to sort by a computed value."},
 {c:"len(items)  sum(items)  max(items)", d:"Count, total, largest", n:"min, sum and max only work when the items are comparable to each other."},
 {c:"for i, item in enumerate(items, start=1):", d:"Loop with a counter", n:"Cleaner than tracking an index yourself. zip(a, b) walks two lists side by side in the same way."}
]},
{t:"Dictionaries, sets and tuples", e:[
 {c:"d = {'port': 'ge-0/0/1', 'vlan': 10}", d:"Key to value lookup", n:"Keys must be immutable (string, number, tuple). Since 3.7 dicts remember insertion order."},
 {c:"d['vlan']", d:"Read a value by key", n:"Raises KeyError if the key is missing. d.get('vlan', 0) returns a fallback instead of blowing up, which is what you usually want."},
 {c:"d['state'] = 'up'", d:"Add or overwrite a key", n:"Same syntax for both, so a typo in a key silently creates a new entry rather than erroring."},
 {c:"for key, value in d.items():", d:"Loop over pairs", n:"d.keys() and d.values() give one side only. Looping over d itself gives the keys."},
 {c:"unique = set(items)", d:"An unordered collection with no duplicates", n:"Fast membership tests and set maths: a & b is the overlap, a - b is what only a has. Deduplicating a list is list(set(items))."},
 {c:"point = (10, 20)", d:"A tuple: ordered and unchangeable", n:"Use it for fixed groups like coordinates or a returned pair. Because it cannot change, a tuple can be a dict key."}
]},
{t:"Control flow", e:[
 {c:"if x > 10:\n    ...\nelif x > 5:\n    ...\nelse:\n    ...", d:"Branch on a condition", n:"The colon opens the block and the indentation is the block. Four spaces, consistently, or Python refuses to run the file."},
 {c:"for item in items:", d:"Loop over a sequence", n:"Python's for is a for-each. To repeat a fixed number of times use for i in range(5), which counts 0 to 4."},
 {c:"while condition:", d:"Loop until something stops being true", n:"Something inside the loop has to change the condition, or it runs forever. Ctrl+C is your escape."},
 {c:"break / continue", d:"Leave the loop, or skip to the next round", n:"break exits entirely, continue abandons just this iteration. A for loop can have an else block that runs only when no break happened."},
 {c:"and  or  not", d:"Combine conditions", n:"Written as words, not && and ||. Chained comparisons work too: if 0 < x < 10."},
 {c:"x = 'up' if link else 'down'", d:"Conditional expression", n:"A one-line if/else that produces a value. Fine for short choices, unreadable if you nest them."}
]},
{t:"Comprehensions", e:[
 {c:"[x * 2 for x in items]", d:"Build a list from another sequence", n:"Reads as: the doubled value, for each item. Replaces three lines of append-in-a-loop with one.", x:"ports = ['ge-0/0/1','ge-0/0/2']\nnames = [p.upper() for p in ports]\nup = [p for p in ports if p.endswith('1')]"},
 {c:"[x for x in items if x > 3]", d:"Filter while you build", n:"The if goes at the end. Add both a transform and a filter and you have most of what map and filter used to do."},
 {c:"{k: v for k, v in pairs}", d:"Dict and set comprehensions", n:"Same shape with braces. {x for x in items} builds a set instead."}
]},
{t:"Functions", e:[
 {c:"def greet(name):\n    return f'Hello {name}'", d:"Define a function", n:"Arguments go in the brackets, the body is indented, return hands a value back. Without return you get None."},
 {c:"def greet(name, greeting='Hello'):", d:"Give an argument a default", n:"Defaults must come after non-default arguments. Never use a mutable default like [] because it is created once and shared between calls."},
 {c:"greet(name='Kaatje')", d:"Call with keyword arguments", n:"Order stops mattering and the call site documents itself. Especially worth it for booleans: send(retry=True) beats send(True)."},
 {c:"def total(*numbers):", d:"Accept any number of positional arguments", n:"numbers arrives as a tuple. **kwargs does the same for keyword arguments and arrives as a dict."},
 {c:"def area(w: float, h: float) -> float:", d:"Type hints", n:"Python does not enforce them, but editors and mypy use them to catch mistakes before you run anything."},
 {c:"'''Docstring on the first line of the function.'''", d:"Document what a function does", n:"Triple-quoted string as the first statement. help(function) prints it, and it is the difference between code you can come back to and code you cannot."}
]},
{t:"Classes", e:[
 {c:"class Switch:", d:"Define a class", n:"A class is a template: it bundles data and the functions that work on that data. CapWords naming by convention."},
 {c:"def __init__(self, name):\n    self.name = name", d:"The constructor", n:"Runs when you create an instance. self is the instance itself and is always the first parameter, though you never pass it when calling.", x:"class Switch:\n    def __init__(self, name, ports=48):\n        self.name = name\n        self.ports = ports\n\n    def describe(self):\n        return f'{self.name} with {self.ports} ports'\n\nsw = Switch('ACCS4')\nprint(sw.describe())"},
 {c:"sw = Switch('ACCS4')", d:"Create an instance", n:"Calling the class runs __init__. Each instance carries its own attributes."},
 {c:"def __str__(self):", d:"Control what print() shows", n:"Return a readable string. Without it you get the unhelpful default with a memory address in it."},
 {c:"class Access(Switch):", d:"Inherit from another class", n:"Access gets everything Switch has and can override any of it. super().__init__(...) calls the parent version."}
]},
{t:"Errors", e:[
 {c:"try:\n    ...\nexcept ValueError as e:\n    ...", d:"Catch a specific error", n:"Name the exception type you expect. A bare except swallows everything including your own typos and Ctrl+C."},
 {c:"finally:", d:"Run cleanup whether it failed or not", n:"else runs only when no exception happened, finally runs always. Closing things belongs here, or better, in a with block."},
 {c:"raise ValueError('vlan id must be 1-4094')", d:"Throw your own error", n:"Fail loudly and early with a message that says what was expected. Silent wrong answers cost far more time than crashes."},
 {c:"Traceback (most recent call last)", d:"How to read a traceback", n:"Read it bottom up: the last line is the error type and message, the lines above are the call chain, and the deepest file you recognise as your own is usually where the mistake is."}
]},
{t:"Files", e:[
 {c:"with open('data.txt') as f:", d:"Open a file and close it automatically", n:"The with block closes the file even if an error happens inside. Always prefer it to a bare open().", x:"with open('ports.txt') as f:\n    for line in f:\n        print(line.strip())"},
 {c:"open('log.txt', 'w')", d:"Modes: r read, w overwrite, a append", n:"w truncates the file the moment it opens, with no warning. Use a when you mean to add to it."},
 {c:"f.read()  f.readlines()  for line in f", d:"Three ways to get the content", n:"read() gives one big string, readlines() a list, and looping over the file streams it line by line without loading it all into memory."},
 {c:"import json; json.load(f) / json.dump(obj, f)", d:"Read and write JSON", n:"json.loads and json.dumps work on strings instead of files. dump with indent=2 makes it human readable."}
]},
{t:"Modules and the standard library", e:[
 {c:"import os", d:"Import a whole module", n:"You then use os.path.join(...). Keep imports at the top of the file, standard library first, then third party, then your own."},
 {c:"from pathlib import Path", d:"Import one name from a module", n:"Shorter to use but easier to collide with your own names. Avoid from module import * entirely."},
 {c:"import numpy as np", d:"Import under a shorter alias", n:"Only use aliases the community already knows, otherwise your code stops being readable to anyone else."},
 {c:"from pathlib import Path; Path('logs/app.log')", d:"Modern path handling", n:"Path objects join with /, and carry .exists(), .read_text() and .mkdir(parents=True). Cleaner than stitching strings with os.path."},
 {c:"import sys; sys.argv", d:"Command-line arguments", n:"sys.argv[0] is the script name, the rest are what the user typed. argparse turns that into a real CLI with flags and help text."},
 {c:"import datetime; datetime.datetime.now()", d:"Dates and times", n:"strftime('%Y-%m-%d') formats one, strptime parses one. Store timestamps in UTC and convert only when displaying."}
]},
{t:"Environments and tooling", e:[
 {c:"python3 -m venv .venv", d:"Create an isolated environment for a project", n:"Keeps each project's packages separate, so upgrading one project cannot break another. The folder is disposable, delete and recreate it freely."},
 {c:"source .venv/bin/activate", d:"Activate the environment", n:"Your prompt gains a (.venv) prefix. On Windows it is .venv\\Scripts\\activate. deactivate leaves it."},
 {c:"pip install requests", d:"Install a package", n:"Install inside an activated venv, not system-wide. pip install -r requirements.txt installs everything a project declares."},
 {c:"pip freeze > requirements.txt", d:"Record exactly what is installed", n:"Commit that file so the environment can be rebuilt on another machine, or next year."},
 {c:"python3 -m pdb script.py", d:"Step through code in the debugger", n:"Or drop breakpoint() into the code and run normally. n steps over, s steps in, c continues, p prints a variable."}
]}
]});
DATA.push({
id:"web", sigil:"HC", name:"HTML & CSS", sub:"Structure and style", color:"#7a5aa6",
blurb:"The Style lab in reference form: the tags that build a page, the selectors that reach them, and the layout systems that arrange them.",
groups:[
{t:"Page skeleton", e:[
 {c:"<!DOCTYPE html>", d:"First line of every page", n:"Tells the browser to use standards mode. Leave it out and you get quirks mode, where old broken layout rules apply and nothing behaves.", x:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Page title</title>\n</head>\n<body>\n</body>\n</html>"},
 {c:"<html lang=\"en\">", d:"Wraps the whole document and declares the language", n:"Screen readers use lang to pick a voice, and browsers use it for hyphenation and spellcheck."},
 {c:"<meta charset=\"UTF-8\">", d:"Character encoding, first thing in the head", n:"Without it accented characters and symbols turn into mojibake. It must appear within the first 1024 bytes of the document."},
 {c:"<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">", d:"Make the page respect the device width", n:"Missing this is why a page looks zoomed out and tiny on a phone: mobile browsers otherwise pretend to be 980px wide."},
 {c:"<head> vs <body>", d:"Instructions versus content", n:"head holds metadata, title, stylesheets and scripts. body holds everything a visitor actually sees."}
]},
{t:"Text and structure", e:[
 {c:"<h1> through <h6>", d:"Headings, in order of rank", n:"One h1 per page, and never skip a level for size reasons. Headings are the outline that screen readers and search engines navigate by. Use CSS if you want a smaller h2."},
 {c:"<p>", d:"A paragraph of text", n:"Block level, so it stacks. Browsers add a default margin you will usually reset."},
 {c:"<span> vs <div>", d:"Meaningless containers: inline versus block", n:"Reach for them only when no meaningful element fits. A div stacks and takes full width, a span flows inside a line of text."},
 {c:"<strong>  <em>", d:"Importance and emphasis", n:"They carry meaning, unlike <b> and <i> which only look bold and italic. Screen readers change intonation for em."},
 {c:"<header> <nav> <main> <section> <article> <footer>", d:"Landmark elements", n:"Same visual result as divs, but they tell assistive technology what each region is. One main per page."},
 {c:"<br> and &nbsp;", d:"Line break and non-breaking space", n:"Both are typography of last resort. Space between blocks belongs in CSS margin, not in a stack of br tags."}
]},
{t:"Links, images and media", e:[
 {c:"<a href=\"/about\">About</a>", d:"A link", n:"Link text should make sense alone: 'read the setup guide', not 'click here'. Add target=\"_blank\" plus rel=\"noopener\" to open a new tab."},
 {c:"<img src=\"cat.jpg\" alt=\"Black cat asleep on a switch\">", d:"An image with a text alternative", n:"alt is required. Describe the meaning, not the file. For purely decorative images use alt=\"\" so screen readers skip it."},
 {c:"<img width=\"800\" height=\"600\">", d:"Declare the intrinsic size", n:"Lets the browser reserve the space before the file loads, so the page stops jumping around as images arrive."},
 {c:"<svg viewBox=\"0 0 24 24\">", d:"Inline vector graphics", n:"Inline SVG can be styled with CSS, including stroke=\"currentColor\" so an icon takes the text colour around it."},
 {c:"<video controls src=\"clip.mp4\">", d:"Embed video", n:"controls shows the player UI. Add muted if you want autoplay to be allowed at all."}
]},
{t:"Lists and tables", e:[
 {c:"<ul> <li>", d:"Unordered list", n:"Use ol when the order carries meaning. li elements may only live directly inside ul, ol or menu."},
 {c:"<dl> <dt> <dd>", d:"Description list: term and definition", n:"The right element for a glossary or a spec sheet of label and value pairs."},
 {c:"<table> <thead> <tbody> <tr> <th> <td>", d:"A data table", n:"Only for tabular data, never for layout. th is a header cell and needs scope=\"col\" or scope=\"row\" so the relationship is announced."},
 {c:"<caption>", d:"Table title, inside the table", n:"The accessible way to name a table. Visually styleable like anything else."}
]},
{t:"Forms", e:[
 {c:"<form action=\"/save\" method=\"post\">", d:"Wrap inputs so they can be submitted", n:"get puts the data in the URL (searches), post sends it in the body (anything that changes state or is private)."},
 {c:"<label for=\"email\">Email</label>\n<input id=\"email\" name=\"email\">", d:"Tie a label to its field", n:"for must match the input id. It makes the label clickable and tells screen readers what the field is. Every input needs one.", x:"<label for=\"site\">Site</label>\n<select id=\"site\" name=\"site\">\n  <option value=\"oost1\">Oostende</option>\n  <option value=\"okmp\">Oostkamp</option>\n</select>"},
 {c:"<input type=\"email|number|date|password|checkbox\">", d:"The type picks the keyboard and the validation", n:"type=\"email\" gives a phone an @ key and free format checking. Correct types are the cheapest usability win in forms."},
 {c:"name=\"field\"", d:"The key the server receives", n:"No name attribute means the value is never submitted, no matter how nice the field looks."},
 {c:"required  placeholder  disabled  readonly", d:"Common input attributes", n:"placeholder is a hint, not a label, and disappears the moment someone types. disabled fields are not submitted, readonly ones are."},
 {c:"<button type=\"submit\">Save changes</button>", d:"The submit control", n:"Inside a form a button defaults to type=\"submit\", which surprises people. Set type=\"button\" for anything that only runs JavaScript."}
]},
{t:"CSS syntax and selectors", e:[
 {c:"selector { property: value; }", d:"The anatomy of a rule", n:"Selector picks the elements, the braces hold declarations, each declaration is property colon value semicolon. The whole thing is a rule set."},
 {c:".card", d:"Class selector: reusable, many per page", n:"Your default tool. Elements can carry several classes separated by spaces."},
 {c:"#main", d:"Id selector: unique, one per page", n:"Powerful specificity makes ids hard to override later. Use them as anchors and JavaScript hooks, style with classes."},
 {c:".card p  vs  .card > p", d:"Descendant versus direct child", n:"A space means any depth below. The > means only immediate children, which stops styles leaking into nested components."},
 {c:"a:hover  input:focus  li:nth-child(2n)", d:"Pseudo-classes: state and position", n:"They select based on a condition rather than markup. Always pair :hover styling with :focus-visible so keyboard users get the same signal."},
 {c:".card::before { content: ''; }", d:"Pseudo-elements: generated boxes", n:"Two colons. They need a content property, even an empty one, to exist. Good for decorative marks you do not want in the HTML."}
]},
{t:"The cascade and specificity", e:[
 {c:"style attribute > #id > .class > element", d:"Specificity ranking", n:"Scored as (inline, ids, classes, elements). A higher score wins regardless of order. Ties are broken by whichever rule comes last."},
 {c:"!important", d:"Overrides everything in its layer", n:"A signal that specificity has gone wrong. Fixing the selector is almost always better than adding another important."},
 {c:"inherit / initial / unset", d:"Explicit inheritance keywords", n:"Some properties inherit by default (colour, font), most do not (border, padding). These let you force either behaviour."},
 {c:":root { --accent: #0d6a85; }", d:"Custom properties (CSS variables)", n:"Defined on a selector, read with var(--accent). Because they cascade, redefining them under a theme selector restyles a whole page at once.", x:":root { --accent: #0d6a85; }\n[data-theme=\"night\"] { --accent: #54c3dc; }\n.button { background: var(--accent); }"}
]},
{t:"The box model", e:[
 {c:"box-sizing: border-box;", d:"Make width include padding and border", n:"Without it, adding padding makes a 300px box wider than 300px. Set it globally on * as the first rule of any stylesheet."},
 {c:"margin: 12px 16px;", d:"Space outside the box", n:"Two values are vertical then horizontal, four go clockwise from the top. margin: 0 auto centres a block that has a width."},
 {c:"padding: 12px;", d:"Space inside the box, within the background", n:"Padding grows the clickable area of a button, margin does not."},
 {c:"Vertical margin collapse", d:"Adjacent top and bottom margins merge into the larger one", n:"Two stacked paragraphs with 20px margins sit 20px apart, not 40. Flex and grid containers do not collapse margins, which is one reason gap is easier to reason about."},
 {c:"border: 1px solid var(--line);", d:"Width, style, colour in one line", n:"border-radius rounds the corners. outline draws outside the box without affecting layout, which is why focus rings use it."}
]},
{t:"Units, colour and text", e:[
 {c:"px  rem  em  %", d:"Absolute and relative sizes", n:"rem is relative to the root font size and is the safe default for type and spacing. em compounds against the parent, which is useful inside a component and surprising everywhere else."},
 {c:"vw / vh / dvh", d:"Viewport units", n:"100vh on mobile is taller than the visible area because of the browser bars. dvh tracks the real, changing height."},
 {c:"color / background", d:"Foreground and background paint", n:"Accepts #hex, rgb(), hsl() and named colours. hsl is the one you can adjust by hand: same hue, different lightness gives a coherent palette."},
 {c:"font-family: system-ui, sans-serif;", d:"A font stack with fallbacks", n:"The browser walks the list until it finds one it has. Always end with a generic family."},
 {c:"line-height: 1.5;", d:"Space between lines", n:"Use a unitless number so it scales with the font size. Body text wants roughly 1.4 to 1.6, headings tighter."}
]},
{t:"Flexbox", e:[
 {c:"display: flex;", d:"Lay children out in one direction", n:"The default direction is a row. Flex is for one dimension, grid for two.", x:".bar {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n}"},
 {c:"flex-direction: row | column;", d:"Choose the main axis", n:"Switching this swaps what justify-content and align-items control, which is the source of most flexbox confusion."},
 {c:"justify-content: space-between;", d:"Distribute along the main axis", n:"flex-start, center, flex-end, space-between, space-around, space-evenly."},
 {c:"align-items: center;", d:"Align across the cross axis", n:"With a row, this is the vertical centring people spend years looking for. stretch is the default."},
 {c:"gap: 12px;", d:"Space between children", n:"Replaces margin hacks and never adds space on the outer edges. Works in flex and grid."},
 {c:"flex: 1;", d:"Let a child take the remaining space", n:"Shorthand for grow 1, shrink 1, basis 0. flex: none keeps a child at its natural size, useful for icons and sidebars."}
]},
{t:"Grid", e:[
 {c:"display: grid;", d:"Lay out in rows and columns at once", n:"Grid controls both dimensions from the parent, so children do not need widths."},
 {c:"grid-template-columns: 200px 1fr;", d:"Define the columns", n:"fr is a fraction of the free space. 1fr next to 200px means a fixed sidebar and a flexible main area.", x:".layout {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));\n  gap: 16px;\n}"},
 {c:"repeat(auto-fit, minmax(240px, 1fr))", d:"Responsive columns with no media query", n:"Fit as many 240px-minimum columns as will go, then share the leftover space. One line replaces three breakpoints."},
 {c:"grid-column: span 2;", d:"Make an item straddle columns", n:"Or name explicit lines: grid-column: 1 / 3 runs from line 1 to line 3."},
 {c:"grid-template-areas", d:"Draw the layout as ASCII in CSS", n:"Name regions on children with grid-area, then sketch the arrangement in quoted strings. Rearranging for mobile becomes rewriting the sketch."},
 {c:"place-items: center;", d:"Centre every item in both directions", n:"Shorthand for align-items and justify-items. On a grid parent, place-items: center is the shortest true centring in CSS."}
]},
{t:"Position, layers and flow", e:[
 {c:"position: static | relative | absolute | fixed | sticky;", d:"How an element is placed", n:"static is the default flow. relative nudges from its own spot and creates a reference point. absolute is placed against the nearest positioned ancestor and leaves the flow."},
 {c:"position: sticky; top: 0;", d:"Scroll with the page, then stick", n:"Needs an offset (top) to do anything, and fails silently if any ancestor has overflow: hidden."},
 {c:"z-index: 10;", d:"Stacking order", n:"Only works on positioned elements, and only within the same stacking context. A parent with transform or opacity below 1 creates a new context, which is why a high z-index sometimes does nothing."},
 {c:"overflow: auto | hidden | scroll;", d:"What happens to content that does not fit", n:"overflow-x: auto on a wide table or code block keeps the page itself from scrolling sideways."}
]},
{t:"Responsive and motion", e:[
 {c:"@media (max-width: 900px) { ... }", d:"Apply rules below a width", n:"Set breakpoints where the layout actually breaks, not at device names. Mobile-first uses min-width and adds complexity as space appears."},
 {c:"max-width: 100%;", d:"Stop images overflowing their container", n:"Pair with height: auto so the aspect ratio holds."},
 {c:"clamp(1rem, 2.5vw, 1.5rem)", d:"A value with a floor, a preference and a ceiling", n:"Fluid type that never gets unreadably small or comically large, without a single media query."},
 {c:"transition: background .18s ease;", d:"Animate a change in a property", n:"Put it on the base state, not inside :hover, so it plays both on and off. Name the property rather than using all."},
 {c:"@media (prefers-reduced-motion: reduce)", d:"Respect people who turn motion off", n:"Wrap it around a rule that disables transitions and animations. It is one of the cheapest accessibility fixes there is."}
]}
]});
DATA.push({
id:"js", sigil:"JS", name:"JavaScript", sub:"Browser scripting", color:"#a8862c",
blurb:"What Spelle teaches, written down: the language itself, then the browser half — reading the page, reacting to people, and talking to servers.",
groups:[
{t:"Basics", e:[
 {c:"let count = 0;", d:"A variable you can reassign", n:"Block scoped, so it only exists inside the nearest braces. var is the old function-scoped version and is worth forgetting."},
 {c:"const name = 'Kaatje';", d:"A binding you cannot reassign", n:"Default to const and only switch to let when you actually reassign. const on an object still lets you change what is inside it, it only locks the name."},
 {c:"console.log(value)", d:"Print to the browser console", n:"console.table(arrayOfObjects) is far more readable for lists, and console.error shows a stack trace."},
 {c:"typeof x", d:"Check a type", n:"Returns 'string', 'number', 'boolean', 'object', 'function', 'undefined'. typeof null returns 'object', a famous bug that can never be fixed."},
 {c:"null vs undefined", d:"Deliberately empty versus never set", n:"undefined is what you get from a missing variable or a function with no return. null is a value you assign on purpose."}
]},
{t:"Numbers, strings and operators", e:[
 {c:"`Hello ${name}, ${n} ports`", d:"Template literal", n:"Backticks let you interpolate expressions and write multi-line strings without concatenation."},
 {c:"=== vs ==", d:"Strict versus loose equality", n:"=== compares value and type. == converts first, which is why '' == 0 is true. Always use === unless you have a specific reason."},
 {c:"Number('42')  parseInt('42px')  String(42)", d:"Convert between types", n:"Number is strict and gives NaN on junk. parseInt reads until it hits a non-digit, so it survives '42px'."},
 {c:"Math.floor(Math.random() * 6) + 1", d:"Random whole number in a range", n:"Math.random gives a float from 0 up to but not including 1. Multiply, floor, then shift."},
 {c:"?? and ?.", d:"Nullish coalescing and optional chaining", n:"value ?? fallback uses the fallback only for null or undefined, unlike || which also fires on 0 and ''. user?.name returns undefined instead of throwing when user is missing."}
]},
{t:"Arrays", e:[
 {c:"const items = [1, 2, 3];", d:"An ordered list", n:"items.length counts, items[0] reads the first, items.at(-1) reads the last."},
 {c:"items.push(x) / items.pop()", d:"Add or remove at the end", n:"unshift and shift do the same at the start but are slower because everything reindexes."},
 {c:"items.map(x => x * 2)", d:"Transform every item into a new array", n:"Returns a new array of the same length. The workhorse for turning data into HTML strings or objects.", x:"const ports = ['ge-0/0/1','ge-0/0/2'];\nconst rows = ports.map(p => `<li>${p}</li>`).join('');"},
 {c:"items.filter(x => x > 2)", d:"Keep only the items that pass a test", n:"Returns a new, usually shorter array. Chain it before map to narrow first."},
 {c:"items.find(x => x.id === 3)", d:"Get the first match, or undefined", n:"findIndex gives its position instead. some and every return booleans."},
 {c:"items.forEach(x => ...)", d:"Run something for each item", n:"Returns nothing, so use it for side effects only. If you want a result back, you want map."},
 {c:"items.reduce((acc, x) => acc + x, 0)", d:"Fold a list into a single value", n:"The accumulator carries between rounds and the last argument is its starting value. Sums, totals, grouping."}
]},
{t:"Objects", e:[
 {c:"const sw = { name: 'ACCS4', ports: 48 };", d:"Key and value pairs", n:"Read with sw.name or sw['name']. The bracket form is for keys held in a variable."},
 {c:"const { name, ports } = sw;", d:"Destructure into variables", n:"Pull several properties out in one line. Works on arrays too, with square brackets and by position."},
 {c:"const copy = { ...sw, ports: 24 };", d:"Spread into a new object", n:"Copies the properties, then later keys override earlier ones. This is how you update state without mutating the original."},
 {c:"Object.keys(o) / Object.values(o) / Object.entries(o)", d:"Turn an object into arrays", n:"entries gives [key, value] pairs, which you can then map or feed to a for...of loop."},
 {c:"JSON.stringify(o, null, 2)", d:"Object to JSON text and back", n:"JSON.parse(text) reverses it. Functions and undefined are dropped by stringify, which surprises people."}
]},
{t:"Control flow", e:[
 {c:"if (x > 10) { ... } else { ... }", d:"Branch on a condition", n:"Braces are optional for one statement but always write them. Empty string, 0, null, undefined and NaN are falsy."},
 {c:"for (let i = 0; i < 5; i++)", d:"Classic counting loop", n:"Start, condition, step. Use it when you need the index or are walking backwards."},
 {c:"for (const item of items)", d:"Loop over values", n:"for...of walks arrays and strings. for...in walks keys and will also pick up inherited ones, so avoid it for arrays."},
 {c:"while (condition) { ... }", d:"Repeat until it stops being true", n:"Something inside must change the condition. In the browser an infinite loop freezes the whole tab."},
 {c:"switch (value) { case 'a': ... break; }", d:"Match one value against many cases", n:"Forgetting break means execution falls through into the next case, which is occasionally useful and usually a bug."}
]},
{t:"Functions", e:[
 {c:"function greet(name) { return `Hi ${name}`; }", d:"Declare a function", n:"Declarations are hoisted, so they can be called from above where they are written."},
 {c:"const greet = (name) => `Hi ${name}`;", d:"Arrow function", n:"With no braces the expression is returned automatically. Arrows do not have their own this, which is exactly what you want inside callbacks."},
 {c:"function tag(name, mode = 'access')", d:"Default parameter", n:"Used only when the argument is undefined, not when it is null or 0."},
 {c:"function sum(...numbers)", d:"Rest parameters", n:"Collects any extra arguments into a real array. The mirror image of spreading an array into a call with fn(...args)."},
 {c:"Callback functions", d:"Passing a function as an argument", n:"setTimeout(fn, 1000), items.map(fn), button.addEventListener('click', fn). Pass the name without brackets, otherwise you pass its result instead."},
 {c:"Closure", d:"An inner function remembers the variables around it", n:"The variables stay alive as long as the inner function does. It is how a counter or an event handler keeps private state without a global."}
]},
{t:"Classes", e:[
 {c:"class Switch { constructor(name) { this.name = name; } }", d:"Define a class and its constructor", n:"new Switch('ACCS4') runs the constructor. Methods go in the body with no function keyword.", x:"class Switch {\n  constructor(name, ports = 48) {\n    this.name = name;\n    this.ports = ports;\n  }\n  describe() {\n    return `${this.name} with ${this.ports} ports`;\n  }\n}"},
 {c:"class Access extends Switch", d:"Inherit from another class", n:"Call super(...) first inside the child constructor, before touching this."},
 {c:"this", d:"What object the method is running on", n:"Its value depends on how a function is called, not where it is written. Arrow functions inherit this from their surroundings, which sidesteps most of the pain."}
]},
{t:"Finding things on the page", e:[
 {c:"document.querySelector('.card')", d:"First element matching a CSS selector", n:"Takes any selector you would write in CSS. Returns null when nothing matches, so guard before using it."},
 {c:"document.querySelectorAll('.card')", d:"All matches, as a NodeList", n:"It has forEach but not map. Array.from(list) or [...list] converts it to a real array."},
 {c:"document.getElementById('main')", d:"Fetch by id", n:"Slightly faster and self-documenting, but querySelector covers every case so most code sticks to one tool."},
 {c:"el.closest('.row')", d:"Walk up to the nearest matching ancestor", n:"The key to event delegation: from whatever was clicked, find the row it belongs to."}
]},
{t:"Changing the page", e:[
 {c:"el.textContent = 'Saved';", d:"Set text safely", n:"Escapes everything, so user input cannot inject markup. Use this unless you specifically need HTML."},
 {c:"el.innerHTML = '<b>hi</b>';", d:"Set markup", n:"Parses the string as HTML. Never hand it raw user input: that is how cross-site scripting gets in."},
 {c:"el.classList.add('open') / .remove() / .toggle()", d:"Change classes", n:"The clean way to change appearance: keep the styling in CSS and flip a class from JavaScript. contains() tests."},
 {c:"el.setAttribute('aria-current', 'true')", d:"Read and write attributes", n:"getAttribute reads, removeAttribute clears. Dataset properties (data-id) are available as el.dataset.id."},
 {c:"parent.append(child)  el.remove()", d:"Add and remove nodes", n:"document.createElement('li') makes one first. Build a fragment and append once rather than appending in a loop."}
]},
{t:"Events", e:[
 {c:"el.addEventListener('click', handler)", d:"React to something happening", n:"Common types: click, input, change, submit, keydown, focus. removeEventListener needs the same function reference to undo it.", x:"button.addEventListener('click', (e) => {\n  e.preventDefault();\n  console.log('clicked', e.target);\n});"},
 {c:"event.preventDefault()", d:"Stop the browser's default action", n:"Stops a form submitting or a link navigating so your script can handle it instead."},
 {c:"event.target vs event.currentTarget", d:"What was clicked versus what is listening", n:"target is the deepest element under the pointer, currentTarget is the element the handler sits on."},
 {c:"Event delegation", d:"One listener on a parent for many children", n:"Listen on the container, then use event.target.closest(...) to work out which row it was. Survives items being added later."},
 {c:"document.addEventListener('keydown', e => ...)", d:"Keyboard shortcuts", n:"Check e.key for the character ('Escape', '/'), and e.ctrlKey or e.metaKey for modifiers. Ignore the event when the focus is inside an input."}
]},
{t:"Async and fetch", e:[
 {c:"setTimeout(fn, 1000)", d:"Run something later", n:"Milliseconds. setInterval repeats until you clearInterval the id it returned."},
 {c:"const res = await fetch('/api/ports');", d:"Request data from a server", n:"fetch returns a promise. Only await works inside an async function, or at the top level of a module.", x:"async function load() {\n  const res = await fetch('/api/ports');\n  if (!res.ok) throw new Error(res.status);\n  const data = await res.json();\n  return data;\n}"},
 {c:"await res.json()", d:"Read and parse the response body", n:"It is a second promise because the body streams in. res.text() when it is not JSON."},
 {c:"if (!res.ok) { ... }", d:"Check the HTTP status", n:"fetch only rejects on a network failure, so a 404 or 500 still counts as success. Checking res.ok yourself is not optional."},
 {c:"Promise.all([a, b])", d:"Wait for several things at once", n:"Runs them in parallel and resolves when all are done. Awaiting them one after another in a loop is much slower."}
]},
{t:"Storage, errors and debugging", e:[
 {c:"localStorage.setItem('key', JSON.stringify(obj))", d:"Persist data in the browser", n:"Strings only, so stringify going in and parse coming out. Per browser and per device, and it can be full or blocked, so wrap it in try/catch."},
 {c:"try { ... } catch (err) { ... }", d:"Handle a thrown error", n:"catch gets the error object with .message and .stack. finally runs either way."},
 {c:"throw new Error('vlan id out of range')", d:"Raise your own error", n:"Throw early with a clear message rather than returning a quietly wrong value."},
 {c:"debugger;", d:"Pause execution where this line runs", n:"With devtools open, the browser stops here and lets you inspect every variable in scope. Faster than scattering console.log calls."}
]}
]});
DATA.push({
id:"php", sigil:"PH", name:"PHP", sub:"Server side", color:"#3a6ea8",
blurb:"The Passle reference: the language that runs before the page is sent, handles the form, talks to the database, and decides what the browser ever sees.",
groups:[
{t:"Running PHP", e:[
 {c:"<?php ... ?>", d:"Open and close a PHP block", n:"Anything outside the tags is sent to the browser untouched. In a file that is pure PHP, leave the closing tag off to avoid stray whitespace in the output."},
 {c:"php -S localhost:8000", d:"Start the built-in development server", n:"Serves the current folder and runs .php files. Development only, single threaded, no config. Ctrl+C stops it."},
 {c:"php script.php", d:"Run a file from the command line", n:"No web server involved. php -a opens an interactive shell, php -l file.php checks the syntax without running it."},
 {c:"echo 'text';", d:"Send output to the page", n:"echo takes several comma-separated values. print_r($array) and var_dump($x) are the debugging versions and show types and structure."},
 {c:"<?= $name ?>", d:"Short echo tag inside templates", n:"The readable way to drop a value into HTML. Always pass it through htmlspecialchars first when the value came from a user."}
]},
{t:"Syntax and variables", e:[
 {c:"$name = 'Kaatje';", d:"Every variable starts with a dollar sign", n:"Case sensitive for variables, not for function names. Statements end with a semicolon, always."},
 {c:"$total = $a + $b;", d:"Types are decided at runtime", n:"PHP converts between strings and numbers freely. gettype() tells you what something became, and declare(strict_types=1) at the top of a file stops silent conversions in function calls."},
 {c:"define('SITE', 'DCU'); / const SITE = 'DCU';", d:"Constants", n:"No dollar sign when you use them. const is evaluated at compile time, define at runtime."},
 {c:"=== vs ==", d:"Identical versus equal", n:"== converts types before comparing, which is a long-running source of security bugs. Use === and !== by default."},
 {c:"$x ?? 'default'", d:"Null coalescing", n:"Gives the fallback when the left side is null or not set, without a notice. $a ?: $b is the older version that also fires on empty strings and zero."}
]},
{t:"Strings", e:[
 {c:"\"Hello $name\"", d:"Double quotes interpolate variables", n:"Single quotes do not, and are marginally faster and safer to read. Use {$user['name']} braces when the expression is complex."},
 {c:"$a . $b", d:"Concatenate with a dot", n:"Not a plus. .= appends to an existing string."},
 {c:"strlen($s)  strtolower($s)  trim($s)", d:"Length, case, whitespace", n:"For anything with accented characters, reach for the mb_ versions such as mb_strlen and mb_strtolower."},
 {c:"str_replace('old', 'new', $s)", d:"Replace every occurrence", n:"Accepts arrays for both search and replace, so you can run several substitutions in one call."},
 {c:"explode(',', $line) / implode(',', $parts)", d:"String to array and back", n:"explode is PHP's split. sprintf('%05.2f', $n) formats numbers with padding and decimals."}
]},
{t:"Arrays", e:[
 {c:"$items = ['a', 'b', 'c'];", d:"A list array, indexed from 0", n:"PHP has one array type that is both list and dictionary. count($items) gives the length."},
 {c:"$row = ['port' => 'ge-0/0/1', 'vlan' => 10];", d:"An associative array", n:"Read with $row['vlan']. A missing key raises a warning and gives null, so check with isset() or use ?? first."},
 {c:"$items[] = 'd';", d:"Append to the end", n:"Shorter than array_push and the idiomatic way to build up a list in a loop."},
 {c:"foreach ($rows as $key => $value)", d:"Loop over an array", n:"The main tool for arrays. Add & before $value to modify in place, then unset($value) afterwards to avoid the classic reference bug.", x:"foreach ($ports as $name => $vlan) {\n    echo \"$name is in vlan $vlan\\n\";\n}"},
 {c:"array_map / array_filter / array_column", d:"Transform, keep, or pull one field", n:"array_column($rows, 'name') is the fastest way to turn database rows into a plain list. array_filter with no callback drops falsy values."},
 {c:"in_array($x, $a) / array_key_exists('k', $a)", d:"Test for a value or a key", n:"in_array with a third argument true does a strict comparison, which you almost always want."}
]},
{t:"Control flow", e:[
 {c:"if (...) { } elseif (...) { } else { }", d:"Branch", n:"elseif is one word in PHP. The alternative syntax if(): ... endif; is nicer inside HTML templates."},
 {c:"for ($i = 0; $i < 5; $i++)", d:"Counting loop", n:"Use foreach for arrays; for is for genuine counting."},
 {c:"while (...) / do { } while (...)", d:"Repeat while a condition holds", n:"do-while always runs at least once, which matters when you are reading rows."},
 {c:"switch ($v) { case 'a': ... break; }", d:"Match against several cases", n:"Needs break or it falls through. match($v) { 'a' => ..., default => ... } is the modern, strict, expression version."},
 {c:"foreach with break and continue", d:"Leave or skip an iteration", n:"break 2 leaves two nested loops at once, which is rare but occasionally exactly right."}
]},
{t:"Functions", e:[
 {c:"function total(array $rows): int { ... }", d:"Declare a function with types", n:"Type declarations on parameters and return values turn silent conversions into real errors. Worth it everywhere."},
 {c:"function greet(string $name, string $greeting = 'Hello')", d:"Default arguments", n:"Defaults must come last. Named arguments at the call site, greet(greeting: 'Hi', name: 'K'), free you from the order."},
 {c:"return", d:"Hand a value back", n:"A function without return gives null. Returning early on invalid input keeps the rest of the body free of nesting."},
 {c:"$f = function () use ($x) { ... };", d:"Anonymous function with captured variables", n:"Unlike JavaScript, PHP closures do not capture automatically: you list what you need in use. Arrow functions fn($x) => ... capture by value automatically."},
 {c:"Scope", d:"Variables inside a function are local", n:"There is no access to outer variables unless passed in. global is available and is almost always the wrong answer."}
]},
{t:"Forms and superglobals", e:[
 {c:"$_POST['email']", d:"Data from a form submitted with post", n:"Never trust it. Validate the shape, then escape on output. Check with isset() or ?? before reading."},
 {c:"$_GET['page']", d:"Data from the query string", n:"Visible in the URL and bookmarkable, so fine for filters and searches, wrong for passwords or anything that changes data."},
 {c:"$_SERVER['REQUEST_METHOD']", d:"Details about the request", n:"Guard write actions with a check that the method is POST. Also holds REMOTE_ADDR, SCRIPT_NAME and the headers."},
 {c:"filter_input(INPUT_POST, 'email', FILTER_VALIDATE_EMAIL)", d:"Read and validate in one step", n:"Returns false when the value does not match the filter. Validation is about shape; escaping is a separate job done at output time."},
 {c:"htmlspecialchars($value, ENT_QUOTES, 'UTF-8')", d:"Escape before printing user input", n:"Turns angle brackets and quotes into entities so a submitted script tag displays as text instead of running. This one line is your XSS defence.", x:"<p>Hello <?= htmlspecialchars($name, ENT_QUOTES, 'UTF-8') ?></p>"},
