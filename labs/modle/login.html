<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>modle &mdash; sign in</title>
<style>
:root{
  --bg:#12161d; --bg2:#0d1117; --line:#252c36; --line-soft:#1e242c;
  --text:#d7dce2; --muted:#7d879a; --faint:#4d5666;
  --wheat:#e3b23c; --wheat2:#f2c94c;
  --xp:#9b8cff; --correct:#6fcf97; --wrong:#d1655c;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --ui:var(--mono);
  --glass:rgba(255,255,255,0.045);
  --glass-line:rgba(255,255,255,0.10);
  --glass-hi:rgba(255,255,255,0.16);
  --field:rgba(0,0,0,0.22);
  --r-sm:7px; --r-md:10px; --r-lg:18px;
}
html[data-theme="minimal"]{
  --bg:#eef1f4; --bg2:#ffffff; --line:#e2e5e9; --line-soft:#eceff1;
  --text:#16191f; --muted:#5c646e; --faint:#98a0a9;
  --wheat:#16191f; --wheat2:#3d444e;
  --xp:#4338ca; --correct:#0f7b52; --wrong:#b42318;
  --glass:rgba(255,255,255,0.60);
  --glass-line:rgba(255,255,255,0.85);
  --glass-hi:rgba(255,255,255,0.95);
  --field:rgba(255,255,255,0.75);
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --r-sm:4px; --r-md:6px; --r-lg:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:28px;
  color:var(--text);
  font-family:var(--ui);font-size:13px;
  background:
    radial-gradient(680px 460px at 22% 18%, rgba(227,178,60,0.16), transparent 62%),
    radial-gradient(620px 520px at 82% 76%, rgba(155,140,255,0.16), transparent 62%),
    radial-gradient(520px 400px at 62% 12%, rgba(111,207,151,0.07), transparent 60%),
    var(--bg);
}
html[data-theme="minimal"] body{
  background:
    radial-gradient(680px 460px at 22% 18%, rgba(67,56,202,0.13), transparent 62%),
    radial-gradient(620px 520px at 82% 76%, rgba(15,123,82,0.11), transparent 62%),
    var(--bg);
}

.gate{width:100%;max-width:340px}

.card{
  position:relative;
  background:var(--glass);
  border:1px solid var(--glass-line);
  border-radius:var(--r-lg);
  padding:30px 28px 24px;
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 24px 60px -26px rgba(0,0,0,0.65);
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);
}

.head{text-align:center;margin-bottom:26px}
.mark{font-size:24px;font-weight:700;letter-spacing:1px;color:var(--wheat)}
.cursor{
  display:inline-block;width:8px;height:0.82em;background:var(--wheat);
  margin-left:3px;vertical-align:baseline;animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
.head .tag{
  margin-top:9px;font-size:9.5px;letter-spacing:3px;
  text-transform:uppercase;color:var(--faint);
}

.field{margin-bottom:14px}
.field label{
  display:block;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--faint);margin-bottom:6px;
}
.field input{
  width:100%;font-family:var(--ui);font-size:13px;color:var(--text);
  background:var(--field);
  border:1px solid var(--glass-line);border-radius:var(--r-sm);
  padding:11px 13px;outline:none;transition:border-color 0.15s ease;
}
.field input:focus{border-color:var(--wheat)}
.field input::placeholder{color:var(--faint)}

.enter{
  width:100%;font-family:var(--ui);font-size:12.5px;font-weight:700;
  color:#16120a;background:var(--wheat);
  border:none;border-radius:var(--r-sm);padding:12px;cursor:pointer;
  margin-top:8px;transition:background 0.15s ease;
}
html[data-theme="minimal"] .enter{color:#fff}
.enter:hover{background:var(--wheat2)}
.enter:disabled{opacity:0.45;cursor:default}

.say{min-height:15px;margin-top:12px;font-size:11px;color:var(--muted);text-align:center}
.say.bad{color:var(--wrong)}
.say.good{color:var(--correct)}

.escape{
  margin-top:20px;padding-top:16px;
  border-top:1px solid var(--glass-line);
  text-align:center;font-size:11px;
}
.escape a{color:var(--faint);text-decoration:none}
.escape a:hover{color:var(--muted)}

.notice{
  margin-top:22px;
  text-align:center;
  font-size:11px;line-height:1.9;color:var(--faint);
}
.notice b{
  display:block;font-weight:400;
  font-size:9px;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
}
</style>
</head>
<body>

<div class="gate">
  <div class="card">

    <div class="head">
      <div class="mark">modle<span class="cursor"></span></div>
      <div class="tag">sign in</div>
    </div>

    <div class="field">
      <label for="email">email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@modle.net">
    </div>

    <div class="field">
      <label for="pw">password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
    </div>

    <button class="enter" id="enter">Enter</button>
    <div class="say" id="say"></div>

    <div class="escape"><a href="index.html">practise without an account &rarr;</a></div>
  </div>

  <div class="notice">
    <b>in development</b>
    Accounts are invite-only for now, and progress may reset without warning.
  </div>
</div>

<script type="module">
const emailEl = document.getElementById("email");
const pwEl = document.getElementById("pw");
const btn = document.getElementById("enter");
const say = document.getElementById("say");

function message(text, kind){
  say.textContent = text;
  say.className = "say" + (kind ? " " + kind : "");
}

async function attempt(){
  const email = emailEl.value.trim();
  const password = pwEl.value;

  if (!email || !password){
    message("Both fields, please.", "bad");
    return;
  }

  btn.disabled = true;
  message("Checking\u2026");

  try {
    const { signIn } = await import("./js/core/auth.js");
    const { error } = await signIn(email, password);

    if (error){
      message("Check the address and password.", "bad");
      btn.disabled = false;
      return;
    }

    message("Welcome back.", "good");
    const { pullProfile } = await import("./js/core/sync.js");
    await pullProfile();
    window.location.href = "index.html";
  } catch (e){
    message("Couldn't reach the server.", "bad");
    btn.disabled = false;
  }
}

btn.addEventListener("click", attempt);
[emailEl, pwEl].forEach(function(el){
  el.addEventListener("keydown", function(e){ if (e.key === "Enter") attempt(); });
});
</script>

</body>
</html>
