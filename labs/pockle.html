    {"u":"l1-move","q":"Two domain controllers must never sit on the same host. Which rule says that?","o":["an affinity rule","an anti-affinity rule","admission control","EVC mode"],"a":1,"why":"Anti-affinity keeps VMs apart, so one host failure cannot take both."},
    {"u":"l1-move","q":"A host dies. What does HA do with its VMs?","o":["moves them live, nobody notices","restores them from backup","powers them on again on other hosts","nothing until someone clicks"],"a":2,"why":"HA is a restart: the VMs boot again on the surviving hosts. Count on minutes, not seconds."},
    {"u":"l1-move","q":"What keeps spare room free in a cluster so HA has somewhere to restart VMs?","o":["DRS","Fault Tolerance","Storage vMotion","admission control"],"a":3,"why":"Without admission control a cluster can be full, and HA has nowhere to put the VMs."},
    {"u":"l1-snap","q":"Why is a snapshot not a backup?","o":["it lives on the same datastore and needs the base disk","it is too small","it only saves the RAM","it cannot be reverted"],"a":0,"why":"Datastore gone, snapshot gone. Base disk corrupt, snapshot useless."},
    {"u":"l1-snap","q":"You delete a snapshot. What happens to its delta file?","o":["it is thrown away","it is merged into the base disk","it becomes a backup","it is moved to another host"],"a":1,"why":"Deleting merges the changes back. Reverting is what throws the delta away."},
    {"u":"l1-snap","q":"A snapshot was forgotten for months on a busy database. What is the real danger?","o":["the VM loses its licence","the snapshot expires","the delta fills the datastore and VMs on it pause","the host reboots"],"a":2,"why":"The delta grows with every write. A full datastore pauses every VM that wants to write."},
    {"u":"l1-snap","q":"A thin 500 GB disk holds 120 GB of data. How much does it take on the datastore?","o":["500 GB","620 GB","0 GB","about 120 GB"],"a":3,"why":"Thin grows as data is written. Thick claims all 500 GB from day one."},
    {"u":"l2-roles","q":"DNS Server and Print Services are jobs a Windows server does for others. What are they called?","o":["roles","features","services packs","snap-ins"],"a":0,"why":"A role is a job for others. A feature supports the server itself, like Windows Server Backup."},
    {"u":"l2-roles","q":"A service with startup type Automatic is stopped. How do you read that?","o":["normal, it starts when asked","a red flag worth a look","it is disabled","it is delayed"],"a":1,"why":"Automatic means it should run after boot. Stopped is only normal for Manual."},
    {"u":"l2-roles","q":"Which command gives you a prompt on a remote server?","o":["Invoke-WebRequest ad-dc-01","Get-Service ad-dc-01","Enter-PSSession ad-dc-01","Test-NetConnection ad-dc-01"],"a":2,"why":"`Enter-PSSession` opens an interactive remote session over WinRM. `Exit-PSSession` leaves it."},
    {"u":"l2-logs","q":"Which event ID says a service terminated unexpectedly?","o":["4625","1074","6008","7034"],"a":3,"why":"7034 is a service crash. 7036 is a normal start or stop."},
    {"u":"l2-logs","q":"Who restarted this server, and why? Which event ID answers that?","o":["1074","41","4740","2013"],"a":0,"why":"1074 records who or what asked for the restart."},
    {"u":"l2-logs","q":"A service is stopped. What comes before restarting it?","o":["reboot the server","find out why it stopped: the first error in the log","reinstall the role","restart its partner too"],"a":1,"why":"Restarting is the fix only once you know the cause. Otherwise you are back tomorrow."},
    {"u":"l2-patch","q":"Kerberos refuses logons when clocks differ by more than how long?","o":["30 seconds","1 minute","5 minutes","1 hour"],"a":2,"why":"The default tolerance is 5 minutes. A drifting clock quietly breaks domain logons."},
    {"u":"l1-hyper","q":"A VM is a folder of files. What is the .vmx file?","o":["the virtual hard disk","the recipe: vCPUs, RAM, disks, network","a snapshot delta","the memory dump"],"a":1,"why":"The `.vmx` describes the VM. The `.vmdk` is its disk."},
    {"u":"l1-hyper","q":"You want to give a running VM more CPU. What does that need?","o":["nothing, it always works","a snapshot first","hot-add switched on, or the VM powered off","a second host"],"a":2,"why":"CPU and memory changes need the VM off, unless hot-add is on, and then only upwards."},
    {"u":"l1-move","q":"What does N+1 mean for a cluster?","o":["it can lose one host and still run everything","every VM has one backup","one host is always switched off","each VM has one spare vCPU"],"a":0,"why":"N hosts carry the load, plus one of room for a failure or a patch round."},
    {"u":"l1-move","q":"Two hosts each run at 55% memory. Is that N+1?","o":["yes, both are under 60%","yes, HA sorts it out","only with DRS on","no, one host would need 110%"],"a":3,"why":"If one dies, the other must carry both loads. 110% does not fit, so not every VM restarts."},
    {"u":"l1-move","q":"What usually breaks N+1 first?","o":["CPU","memory","network ports","licences"],"a":1,"why":"CPU can be shared and slowed down. Memory cannot."},
    {"u":"l1-move","q":"What do you do with a host before you patch it?","o":["take a snapshot of it","switch HA off","put it in maintenance mode","remove it from the cluster"],"a":2,"why":"A host in maintenance mode runs and starts no VMs, so they move off first."},
    {"u":"l1-move","q":"Which option keeps a live shadow copy of a VM on another host for zero downtime?","o":["Fault Tolerance","HA","DRS","vMotion"],"a":0,"why":"Fault Tolerance is the zero-downtime option. Expensive and rarely used. HA is a restart."},
    {"u":"l2-roles","q":"What is Server Core?","o":["a server with one CPU core","the first domain controller","a licence type","Windows Server without a desktop"],"a":3,"why":"No desktop: you manage it remotely with PowerShell. Fewer parts, fewer patches."},
    {"u":"l2-roles","q":"You want the same check on dns-01 and dns-02 in one go. Which command?","o":["Enter-PSSession dns-01,dns-02","Invoke-Command -ComputerName dns-01,dns-02 -ScriptBlock { ... }","Get-Service -Both","Test-NetConnection dns-01,dns-02"],"a":1,"why":"`Invoke-Command` runs a script block on many servers at once. `Enter-PSSession` is one server, interactive."},
    {"u":"l2-logs","q":"Event 6008 in the System log. What happened?","o":["a logon failed","a service timed out","the previous shutdown was unexpected","a disk is nearly full"],"a":2,"why":"6008 means the server went down without a clean shutdown."},
    {"u":"l2-logs","q":"Which event ID says an account was locked out?","o":["4740","4625","7000","2013"],"a":0,"why":"4740 is a lockout, logged on a domain controller. 4625 is one failed logon."},
    {"u":"l2-logs","q":"Event 2013 is a warning worth acting on. What does it say?","o":["a service crashed","someone asked for a restart","an account was locked out","a disk is at or near capacity"],"a":3,"why":"2013 warns hours before a full disk starts breaking services."},
    {"u":"l2-patch","q":"When does Microsoft ship its monthly security updates?","o":["the first Monday","the second Tuesday","the last Friday","every Sunday night"],"a":1,"why":"Patch Tuesday is the second Tuesday of each month."},
    {"u":"l2-patch","q":"A server is in pending reboot. What does that mean?","o":["it will reboot within a minute","it is broken","updates are installed but only finish at the next restart","it is waiting for a licence"],"a":2,"why":"Until the restart, the server runs a mix of old and new files."},
    {"u":"l0-team","q":"The galley screens are black. In which layer does the cause usually live?","o":["always in the screens","lower down: VM, host, storage or network","always in the app","in the ticket system"],"a":1,"why":"Symptoms show up at the top. Start where the symptom is and walk down until a layer looks unhealthy."},
    {"u":"l0-team","q":"The VM behind the screens is running again. Who asks why it was off at all?","o":["first line","second line","third line","nobody, it works"],"a":2,"why":"Third line is not about more commands. It is about not stopping at 'it works again'."},
    {"u":"l0-team","q":"Get the service back, fast. Which kind of record is that?","o":["an incident","a problem","a change","a CI"],"a":0,"why":"Incident: restore the service. Problem: find the root cause. Change: alter something on purpose, safely."},
    {"u":"l0-team","q":"Why did the host stay in maintenance? Which record investigates that?","o":["an incident","a problem","a change","a CMDB entry"],"a":1,"why":"A problem record hunts the root cause so the incident does not come back."},
    {"u":"l0-team","q":"What does every change need?","o":["a plan, an approval and a rollback","only a ticket number","a reboot","a second engineer typing"],"a":0,"why":"A change is planned. If it goes wrong, the rollback says how you get back."},
    {"u":"l0-team","q":"Priority is two questions. Which two?","o":["cost and time","who asked and how loud","impact and urgency","layer and owner"],"a":2,"why":"Impact: how many people or services are hit. Urgency: how fast it hurts if nobody acts."},
    {"u":"l0-team","q":"High impact, high urgency. Which priority?","o":["P1","P2","P3","P4"],"a":0,"why":"All galley screens at breakfast: high and high, so P1. One screen at 3am is low and low, P4."},
    {"u":"l0-stack","q":"A host fails. What else goes down?","o":["only the host","only the datastore","everything that hangs on it: its VMs and their services","the backups"],"a":2,"why":"A fault low in the chain breaks everything above it. Check one layer at a time, top to bottom."},
    {"u":"l0-stack","q":"What is a LUN?","o":["a virtual CPU","a slice of the storage array handed to the hosts","a backup copy","a VM template"],"a":1,"why":"Datastores sit on LUNs carved out of the array."},
    {"u":"l0-stack","q":"The patch is done. What is the step that gets forgotten?","o":["the reboot","exit maintenance mode and start the VMs that were shut down","delete the snapshot","close the ticket"],"a":1,"why":"While a host is in maintenance, vSphere runs no VM on it. VMs that were shut down stay down until someone starts them."},
    {"u":"l0-stack","q":"Which PowerCLI verbs only read and are always safe?","o":["Set-","Start-","Restart-","Get-"],"a":3,"why":"Get- reads. Set-, Start- and Restart- change things, so they need a rollback plan first."},
    {"u":"l0-stack","q":"How do you start every VM on esx-02 in one line?","o":["Start-VM esx-02","Get-VM -Location esx-02 | Start-VM","Get-VMHost esx-02 | Restart-VM","Start-VMHost esx-02"],"a":1,"why":"The pipe hands every VM that Get-VM found to Start-VM."},
    {"u":"l0-stack","q":"Every PowerCLI command fails. What did you forget?","o":["Connect-VIServer","Import-Csv","ssh root@esx-02","Get-Cluster"],"a":0,"why":"Connect to vCenter first: `Connect-VIServer vcenter.meridian.local`."},
    {"u":"l0-stack","q":"vCenter is down. How do you still see what a host thinks?","o":["wait for vCenter","ssh root@ to the ESXi host","reboot the host","ping a VM"],"a":1,"why":"Each door sees from a different height. The host over SSH still works without vCenter, logs in /var/log."},
    {"u":"l0-stack","q":"Is `Get-VM -Loc esx-02` valid PowerShell?","o":["no, parameters must be typed in full","only in PowerShell 5","yes, any unique start of a parameter name works","only with Tab"],"a":2,"why":"`-Loc` is enough for `-Location`. Names are not case sensitive either."},
    {"u":"l0-stack","q":"The CMDB and vCenter disagree. What is that?","o":["a typo, ignore it","a clue, and often a follow-up of its own","proof vCenter is wrong","proof the CMDB is wrong"],"a":1,"why":"The CMDB says what should be. The live system says what is. The gap is worth recording."},
    {"u":"l0-stack","q":"Why look in the CMDB before you touch anything?","o":["it is faster than vCenter","it fixes things","it shows who else is hit and who owns it","it holds the backups"],"a":2,"why":"It tells you the scope, the owner to inform, and the exact names to query."},
    {"u":"l2-patch","q":"Which cmdlet shows the updates installed on a server, and when?","o":["Get-WindowsFeature","Get-Service","Get-HotFix","Get-Volume"],"a":2,"why":"`Get-HotFix` lists installed updates with their install date."},
    {"u":"l2-patch","q":"How do you ask a script if a server needs a restart?","o":["Test-Path on the RebootPending registry key","Get-Service Spooler","ping the server","Restart-Computer -WhatIf"],"a":0,"why":"Windows writes keys such as `RebootPending`. If the key exists, a restart is pending."},
    {"u":"l2-patch","q":"You will restart dns-01 of a pair. What comes first?","o":["stop dns-02","prove dns-02 answers: resolve a name against it","take a snapshot of dns-02","nothing, DNS has two servers"],"a":1,"why":"Running is not enough. The partner must answer before you take its twin down."},
    {"u":"l2-patch","q":"Which command restarts dns-01 cleanly and leaves your name in event 1074?","o":["Stop-Computer dns-01","shutdown /a","Restart-Service dns-01","Restart-Computer dns-01"],"a":3,"why":"`Restart-Computer` asks Windows for a clean restart. Event 1074 records who and why."},
    {"u":"l2-patch","q":"Where does a domain member take its time from?","o":["a domain controller","the internet","its own BIOS","the VMware host"],"a":0,"why":"Members follow the domain hierarchy. Only the PDC emulator looks outside."},
    {"u":"l2-patch","q":"Which domain controller should take time from an outside source?","o":["every DC","the newest DC","the one with the PDC emulator role","none"],"a":2,"why":"The PDC emulator is the top of the time chain. The other DCs follow it."},
    {"u":"l2-patch","q":"A domain member VM also gets time from VMware Tools. What is the rule?","o":["keep both on","domain time only, VMware time sync off","VMware time only","switch off the domain time"],"a":1,"why":"Two sources fight. Domain members follow the domain."},
    {"u":"l2-patch","q":"Which command shows a server's time source and last sync?","o":["w32tm /resync","Get-Date","w32tm /query /status","net time"],"a":2,"why":"`w32tm /query /status` shows the source. `w32tm /resync` forces a sync."},
    {"u":"l2-roles","q":"Which service does the printing on a Windows server?","o":["Netlogon","DNS","WinRM","Spooler"],"a":3,"why":"Printing is the Spooler service. Domain logons go through Netlogon."},
    {"u":"l2-roles","q":"A Manual service is stopped. How do you read that?","o":["normal, it starts when asked","a red flag","it is disabled","it crashed"],"a":0,"why":"Manual starts on demand. A stopped Automatic service is the red flag."},
    {"u":"l2-roles","q":"Enter-PSSession and Invoke-Command travel over what?","o":["RDP","WinRM","SMB","ssh to port 22"],"a":1,"why":"PowerShell remoting runs over WinRM. RDP (3389) gives the full desktop instead."},
    {"u":"l2-roles","q":"Which port does RDP use?","o":["22","443","3389","5985"],"a":2,"why":"RDP listens on 3389. Useful for GUI tools, but one server at a time."},
    {"u":"l2-roles","q":"C: is full. Which folder holds downloaded Windows updates?","o":["C:\\Windows\\Temp","C:\\Windows\\System32\\spool\\PRINTERS","C:\\Windows\\System32\\LogFiles","C:\\Windows\\SoftwareDistribution"],"a":3,"why":"SoftwareDistribution holds downloaded updates. The spool folder holds waiting print jobs."},
    {"u":"l2-roles","q":"Which cmdlet shows free space on the volumes?","o":["Get-Volume","Get-HotFix","Get-Service","Get-WinEvent"],"a":0,"why":"`Get-Volume` or `Get-PSDrive C`. Under about 10% free, services start failing in odd ways."},
    {"u": "l1-hyper", "q": "VirtualBox on your laptop runs a VM. Which kind of hypervisor is that?", "o": ["Type 1, bare metal", "Type 2, hosted", "a container runtime", "a cluster"], "a": 1, "why": "Type 2 is an app on a normal OS. Fine for labs, not what a datacenter runs."},
    {"u": "l1-hyper", "q": "A VM will not power on. Its disk fits, but the datastore is nearly full. Which file has no room?", "o": ["the .vmx", "the .vmdk", "the .vswp", "the vmware.log"], "a": 2, "why": "The .vswp swap file is made at power-on and is about as big as the VM's RAM."},
    {"u": "l1-hyper", "q": "vCenter is down. How do you still reach an ESXi host?", "o": ["you cannot until vCenter is back", "through DRS", "over RDP on port 3389", "ssh straight into the host"], "a": 3, "why": "Each host can be managed on its own. The direct door still works when the console view is gone."},
    {"u": "l1-hyper", "q": "Around which CPU ready value per vCPU do users start to notice?", "o": ["about 5%", "about 0.5%", "about 50%", "about 95%"], "a": 0, "why": "CPU ready is time a VM waited for a free core. Above about 5% per vCPU it shows."},
    {"u": "l1-move", "q": "Older and newer hosts must swap VMs with vMotion. Which cluster setting makes their CPUs look alike?", "o": ["admission control", "EVC mode", "an anti-affinity rule", "thin disks"], "a": 1, "why": "EVC hides the newer CPU features, so a VM can move both ways."},
    {"u": "l1-move", "q": "DRS is set to Manual. What does it do?", "o": ["moves VMs on its own", "restarts VMs after a crash", "only recommends, a human clicks", "nothing at all"], "a": 2, "why": "Manual recommends. Partially automated places VMs at power-on. Fully automated moves them itself."},
    {"u": "l1-move", "q": "Which PowerCLI line moves galley-disp-01 to esx-01?", "o": ["Start-VM galley-disp-01 esx-01", "Get-VM galley-disp-01 | Select-Object VMHost", "Set-Cluster esx-01", "Move-VM galley-disp-01 -Destination esx-01"], "a": 3, "why": "`Move-VM -Destination <host>` does a vMotion when the VM is running."},
    {"u": "l1-move", "q": "HA is on. Which problem does it not solve?", "o": ["a VM that is on but broken", "a host that loses power", "a host that stops answering", "a host with a dead mainboard"], "a": 0, "why": "HA covers one failure: the host. A broken VM on a healthy host stays broken."},
    {"u": "l1-snap", "q": "As a rule of thumb, how long should a snapshot live?", "o": ["until the next patch round", "about a month", "no longer than about 72 hours", "as long as the VM exists"], "a": 2, "why": "A snapshot is a safety net for a change. Keep it hours or days, then delete it."},
    {"u": "l1-snap", "q": "Which PowerCLI line lists the snapshots of every VM?", "o": ["Get-VM | Remove-Snapshot", "Get-VM | Get-Snapshot", "Get-Datastore | Select-Object Name", "Get-Cluster"], "a": 1, "why": "`Get-VM | Get-Snapshot` lists them. `Remove-Snapshot` deletes, which merges the delta."},
    {"u": "l1-snap", "q": "Removing a large snapshot on a busy VM. Why do it outside peak hours?", "o": ["the VM reboots", "the licence checks it", "the backup stops", "merging takes time and extra disk I/O"], "a": 3, "why": "Delete merges the delta into the base disk. On a big delta that is real work for the storage."},
    {"u": "l1-snap", "q": "Which PowerCLI line gives the first look at datastore space?", "o": ["Get-Datastore | Select-Object Name,CapacityGB,FreeSpaceGB", "Get-Volume", "Get-VM | Select-Object MemoryGB", "Get-Snapshot -VM cargo-db-01"], "a": 0, "why": "`Get-Datastore` shows capacity and free space. `Get-Volume` is for Windows disks."},
    {"u": "l2-logs", "q": "A Windows service misbehaves. Which event log is your first stop?", "o": ["Security", "Application", "System", "Setup"], "a": 2, "why": "System holds services, drivers, shutdowns and disks."},
    {"u": "l2-logs", "q": "In Get-WinEvent -FilterHashtable, which Level number means Error?", "o": ["1", "2", "3", "4"], "a": 1, "why": "Level 1 is Critical, 2 Error, 3 Warning."},
    {"u": "l2-logs", "q": "Event 4625 in the Security log. What happened?", "o": ["an account was locked out", "a service crashed", "someone asked for a restart", "a logon failed"], "a": 3, "why": "4625 is a failed logon. 4740 is the lockout, on a domain controller."},
    {"u": "l2-logs", "q": "Event 41, Kernel-Power, in the System log. What does it say?", "o": ["the server rebooted without a clean shutdown", "a disk is nearly full", "a service started", "an update was installed"], "a": 0, "why": "41 means the server came back up without shutting down cleanly: power loss, hang or hard reset."},
    {"u": "l1-hyper", "q": "UTM on your Mac runs a Linux VM. Which kind of hypervisor is that?", "o": ["Type 1, bare metal", "Type 2, hosted", "a cluster", "a container"], "a": 1, "why": "Type 2 is an app on a normal OS. Great for labs, not for production."},
    {"u": "l1-hyper", "q": "A VM refuses to start. Where is the answer usually?", "o": ["in vmware.log or a full datastore", "in the BIOS of the host", "in the CMDB", "in the DNS logs"], "a": 0, "why": "A VM is a folder of files. Its log and the space around it tell the story."},
    {"u": "l1-hyper", "q": "A VM's files sit on esx-02's local disk. Which hosts can run it?", "o": ["every host in the cluster", "only esx-02", "only vCenter", "any host after a reboot"], "a": 1, "why": "Moving a VM is moving files. Storage only one host reaches ties the VM to that host."},
    {"u": "l1-hyper", "q": "A host promises far more vCPUs than it has cores. What is that called, and is it OK?", "o": ["overcommit, normal", "overload, never allowed", "hyperthreading, risky", "a licence breach"], "a": 0, "why": "Most VMs idle most of the time. It only hurts when CPU ready climbs."},
    {"u": "l1-hyper", "q": "RAM runs short on a host. Which step makes its VMs crawl?", "o": ["ballooning", "compression", "swapping VM memory to disk", "DRS"], "a": 2, "why": "ESXi reclaims quietly first. Swapping to disk is the slow last resort."},
    {"u": "l1-hyper", "q": "vcsa-01 runs on esx-03, and esx-03 dies. What do you lose?", "o": ["every VM on the ship", "the console view, not the other VMs", "all datastores", "nothing at all"], "a": 1, "why": "vCenter is a VM too. SSH straight into a host still works."},
    {"u": "l1-hyper", "q": "Which command lists the clusters in vCenter?", "o": ["Get-VMHost", "Get-Datacenter", "Get-Cluster", "Get-VM -Cluster"], "a": 2, "why": "Get-Cluster, Get-VMHost, Get-Datastore: three commands, the whole shape."},
    {"u": "l1-move", "q": "What moves a VM's disk to another datastore?", "o": ["vMotion", "Storage vMotion", "DRS", "HA"], "a": 1, "why": "Plain vMotion leaves the disk where it is. Storage vMotion moves it, slower."},
    {"u": "l1-move", "q": "Keep an app and its database on the same host for speed. Which rule?", "o": ["an affinity rule", "an anti-affinity rule", "admission control", "EVC"], "a": 0, "why": "Affinity keeps VMs together. Anti-affinity keeps them apart."},
    {"u": "l1-move", "q": "HA restarts the VMs of a dead host. How long does that take?", "o": ["no time, nobody notices", "about one ping", "minutes: the OS boots again", "a full day"], "a": 2, "why": "HA is a restart, like pulling the plug and powering on. Plan for minutes."},
    {"u": "l1-move", "q": "Three hosts, keep N+1. Average use must stay below about...", "o": ["33%", "50%", "66%", "90%"], "a": 2, "why": "Rule of thumb: under (n-1)/n. Three hosts: 2/3. Two hosts: 50%."},
    {"u": "l1-snap", "q": "You revert to a snapshot. What happens to the delta?", "o": ["it is merged into the base", "it is thrown away", "it becomes a backup", "it is copied to another host"], "a": 1, "why": "Revert: back to the frozen moment. Delete: the delta merges into the base."},
    {"u": "l1-snap", "q": "Which snapshot name follows the rule?", "o": ["test", "snap1", "pre-patch 2026-11 kaatje", "new"], "a": 2, "why": "Who, why and when. Then nobody has to guess in three months."},
    {"u": "l1-snap", "q": "A thick 500 GB disk holds 120 GB of data. How much does it take?", "o": ["120 GB", "500 GB", "620 GB", "0 GB"], "a": 1, "why": "Thick claims everything on day one. Thin grows with the data."},
    {"u": "l1-snap", "q": "Which command shows the datastores, right on an ESXi host?", "o": ["show datastores", "esxcli storage filesystem list", "Get-Datastore -Host", "vim-cmd storage list"], "a": 1, "why": "esxcli works on the host itself, also when vCenter is down."},

    {"u":"l2-logs","q":"Event 7000 in the System log. What happened?","o":["a logon failed","a service failed to start","a disk is nearly full","someone asked for a restart"],"a":1,"why":"7000 is a failed start. 7009 is a start that timed out."},
    {"u":"l2-logs","q":"Which log holds logons and permission changes?","o":["Security","System","Application","Setup"],"a":0,"why":"On a domain controller, lockouts land here too."},
    {"u":"l2-logs","q":"Show the newest 20 System events. Fill the blank.","code":"Get-WinEvent -LogName System ___ 20","o":["-Newest","-First","-Count","-MaxEvents"],"a":3,"why":"Get-WinEvent uses -MaxEvents. -Newest belongs to the older Get-EventLog."},

    {"u":"l2-logs","q":"The log shows a hundred errors. Which one matters most?","o":["the first one","the newest one","the longest one","the one with the highest ID"],"a":0,"why":"The first error is closest to the cause. The rest often follow from it."},
    {"u":"l2-logs","q":"Test-NetConnection to dns-02 gets no answer at all. Where do you look?","o":["the DNS service","the VM or the network","the Security log","Get-HotFix"],"a":1,"why":"No answer at all points below Windows: the VM is off or the network is broken."},
    {"u":"l2-logs","q":"What changed lately? Which line shows the newest updates?","o":["Get-Service | Sort-Object Status","Get-Volume","Get-HotFix | Sort-Object InstalledOn -Descending","Test-Path HKLM:\\"],"a":2,"why":"Updates are a common answer to 'what changed?'. Event 1074 shows restarts."},
    {"u":"l0-team","q":"Who owns the machines, the storage and the network between them?","o":["the developers","the infra team","facilities","first line"],"a":1,"why":"Apps belong to developers, the building to facilities. The middle is infra."},
    {"u":"l0-team","q":"First line hears 'the galley screens are black'. What do they do?","o":["rebuild the host","rewrite the patch process","log it, try the known fix, escalate","close the ticket"],"a":2,"why":"Easy things get fixed fast. Hard things go up a line."},
    {"u":"l0-team","q":"Same black screen: one VM, or fourteen services. What sets the priority?","o":["who called first","the time of day","the ticket number","the scope: how much is hit"],"a":3,"why":"Priority is impact times urgency. You only know the impact after you scope."},

  cards: [
    {"u":"connect","q":"Any Mg command fails with \"Authentication needed\". What did you skip?","o":["Import-Module","Connect-MgGraph","Get-MgContext","Start-Transcript"],"a":1,"why":"Every command with Mg in its name talks to Graph, and Graph needs a sign-in first."},
    {"u":"connect","q":"You only want to read users. Which scope do you ask for?","o":["User.ReadWrite.All","Users.Read.All","User.Read.All","Directory.ReadWrite.All"],"a":2,"why":"Least privilege: read-only when you only look. `Users.Read.All` is not a real scope."},
    {"u":"connect","q":"Before a change you want to be sure you are in the right tenant. Which command?","o":["Get-MgContext","Get-MgUser","Get-Command","Get-Member"],"a":0,"why":"`Get-MgContext` shows the account, the tenant and the scopes of your connection."},
    {"u":"connect","q":"You forgot the name of a command that changes something. How do you list candidates?","o":["Get-Help -Verb Update","Get-Member -Verb Update","Get-MgContext -Verb Update","Get-Command -Verb Update"],"a":3,"why":"`Get-Command` finds commands, by word, by module or by verb."},
    {"u":"connect","q":"You want working examples of Get-MgUser and nothing else.","o":["Get-Help Get-MgUser -Examples","Get-Command Get-MgUser -Examples","Get-MgUser -Help","Get-Member Get-MgUser"],"a":0,"why":"`Get-Help <command> -Examples` shows only the examples."},
    {"u":"users","q":"Pick what looks up one user by sign-in name.","o":["Get-MgUser -Name x@domain","Get-MgUser -Filter x@domain","Get-MgUser -UserId x@domain","Get-MgUser -Top x@domain"],"a":2,"why":"`-UserId` takes the sign-in name or the object Id."},
    {"u":"users","q":"You pipe a user into Select-Object AccountEnabled and the column is empty. Why?","o":["the account is blocked","you forgot to ask for it with -Property","the scope is wrong","Select-Object cannot show true or false"],"a":1,"why":"Graph only returns a default set of properties. Ask for the others with `-Property`, then show them."},
    {"u":"users","q":"Which filter finds everyone in the IT department?","o":["-Filter \"department = 'IT'\"","-Filter \"department -eq 'IT'\"","-Filter department:IT","-Filter \"department eq 'IT'\""],"a":3,"why":"Graph filters use OData: `eq` without a dash, and single quotes around text."},
    {"u":"users","q":"Get-MgUser gives you 100 users in a tenant of 400. What is missing?","o":["-All","-Top","-Force","-Count"],"a":0,"why":"Graph answers in pages. `-All` fetches every page."},
    {"u":"users","q":"Someone left today. What blocks new sign-ins?","o":["Remove-MgUser -UserId x","Update-MgUser -UserId x -AccountEnabled:$false","Revoke-MgUserSignInSession -UserId x","Disconnect-MgGraph"],"a":1,"why":"Setting `AccountEnabled` to false blocks sign-in. Deleting comes later, if ever."},
    {"u":"users","q":"The account is blocked, but the leaver is still signed in on a phone. What ends those sessions?","o":["Disconnect-MgGraph","Update-MgUser -UserId x -AccountEnabled:$true","Get-MgContext","Revoke-MgUserSignInSession -UserId x"],"a":3,"why":"Blocking stops new sign-ins. Revoking invalidates the refresh tokens the user already holds."},
    {"u":"mailboxes","q":"Which command lists every shared mailbox?","o":["Get-EXOMailbox -RecipientTypeDetails SharedMailbox","Get-MgUser -Filter \"shared eq true\"","Get-EXOMailbox -Shared","Get-MailboxPermission -Shared"],"a":0,"why":"`-RecipientTypeDetails` filters on the kind of mailbox."},
    {"u":"mailboxes","q":"Who can open the Finance Inbox? Which command reads that?","o":["Get-EXOMailbox -Identity \"Finance Inbox\"","Get-MgUser -UserId \"Finance Inbox\"","Get-MailboxPermission -Identity \"Finance Inbox\"","Get-InboxRule -Mailbox \"Finance Inbox\""],"a":2,"why":"`Get-MailboxPermission` lists who has which rights on a mailbox."},
    {"u":"groups","q":"Who gets mail sent to All Staff? Which command lists them?","o":["Get-MgUser -Filter \"All Staff\"","Get-DistributionGroupMember -Identity \"All Staff\"","Get-MailboxPermission -Identity \"All Staff\"","Get-MgContext"],"a":1,"why":"Distribution lists live in Exchange. `Get-DistributionGroupMember` shows who is on one."},
    {"u":"groups","q":"Which command puts someone on a distribution list?","o":["Add-DistributionGroupMember -Identity x -Member y","New-DistributionGroup -Name x","Add-MailboxPermission -Identity x -User y","New-MgGroupMember -GroupId x"],"a":0,"why":"`Add-DistributionGroupMember` adds one member to an existing list."},

    {"u":"licenses","q":"Which command shows the licenses your tenant owns?","o":["Get-MgUserLicenseDetail","Get-MgSubscribedSku","Get-MgContext","Get-EXOMailbox"],"a":1,"why":"`Get-MgSubscribedSku` lists every SKU with bought and used seats."},
    {"u":"licenses","q":"Assigning a license fails with \"invalid usage location\". What do you set first?","o":["the department","the password profile","the usage location, like BE","the mail nickname"],"a":2,"why":"A user needs a `UsageLocation` before any license can be assigned."},

    {"u":"reports","q":"Pick the filter for job titles that contain Manager.","o":["Where-Object { $_.JobTitle -eq 'Manager' }","Where-Object { $_.JobTitle = '*Manager*' }","Where-Object { $_.JobTitle -like '*Manager*' }","Where-Object JobTitle contains Manager"],"a":2,"why":"`-like` takes wildcards. `-eq` only matches the exact text."},
    {"u":"reports","q":"How do you count users per department?","o":["Group-Object Department","Measure-Object Department","Sort-Object Department","Select-Object Department -Unique"],"a":0,"why":"`Group-Object` makes one row per value, with a Count."},
    {"u":"reports","q":"You want the five largest by X.","o":["Select-Object -First 5 | Sort-Object X","Sort-Object X -Descending | Select-Object -First 5","Sort-Object X | Select-Object -First 5","Group-Object X -Top 5"],"a":1,"why":"Sort first, biggest on top, then take the first five."},
    {"u":"reports","q":"Which command writes a result to a file Excel can open?","o":["Out-Host","Get-Content","Import-Csv","Export-Csv"],"a":3,"why":"`Export-Csv` turns objects into rows and columns. `Import-Csv` reads them back."},

    {"u":"bulk","q":"Import-Csv read a file with a column UPN. How do you read that value from one row $r?","o":["$r.UPN","$r[UPN]","$r->UPN","$UPN"],"a":0,"why":"Every column becomes a property and every row an object, so it is `$r.UPN`."},
    {"u":"bulk","q":"After $rows = Import-Csv ./x.csv, what does $rows.Count tell you?","o":["the number of columns","the number of rows, header not counted","the file size","the number of empty cells"],"a":1,"why":"Check `$rows.Count` and `$rows[0]` before you loop, so you know the file was read the way you think."},
    {"u":"bulk","q":"In foreach ($r in $rows) { ... }, what is $r?","o":["the whole file","the row number","the current row, a new one each turn","the last row only"],"a":2,"why":"The block runs once per row, with `$r` as that row."},
    {"u":"bulk","q":"Which is the pipeline version of a foreach loop?","o":["Where-Object","Group-Object","Select-Object","ForEach-Object"],"a":3,"why":"`$rows | ForEach-Object { $_.UPN }`. In the pipeline the current item is `$_`."},
    {"u":"bulk","q":"You are about to change 200 users in a loop. What do you add for the rehearsal?","o":["-WhatIf","-Force","-Confirm:$false","-Verbose"],"a":0,"why":"`-WhatIf` prints what would happen and changes nothing. Read every line, then remove it."},

    {"u":"bulk","q":"$p = @{ UserId = 'x'; Department = 'Sales' }. How do you hand it to Update-MgUser?","o":["Update-MgUser $p","Update-MgUser -Params $p","Update-MgUser | $p","Update-MgUser @p"],"a":3,"why":"Splatting: `@p` instead of `$p`, and every key becomes a parameter."},
    {"u":"bulk","q":"How do you switch on a switch parameter inside a splat?","o":["Name = $true","Name = 'yes'","-Name","Name"],"a":0,"why":"A hashtable needs a value for every key. For a switch that value is `$true`."},
    {"u":"bulk","q":"Which command records every command and its output to a file?","o":["Get-History","Start-Transcript -Path ./run.log","Out-Host","Export-Csv ./run.log"],"a":1,"why":"`Start-Transcript` is your proof of what a bulk run did. `Stop-Transcript` ends it."},
    {"u":"investigate","q":"Which command reads the sign-in log?","o":["Search-UnifiedAuditLog","Get-MessageTraceV2","Get-MgAuditLogSignIn","Get-MgContext"],"a":2,"why":"Every sign-in is logged with time, app, IP, country and result."},
    {"u":"investigate","q":"In a sign-in record, which status error code means the sign-in worked?","o":["200","1","50126","0"],"a":3,"why":"`status/errorCode eq 0` filters on the successful ones."},
    {"u":"investigate","q":"Sign-in error 50126. What happened?","o":["wrong user name or password","the account is locked","MFA is needed","the account does not exist"],"a":0,"why":"50126 is a bad password. 50053 is a locked account and 50074 asks for MFA."},
    {"u":"investigate","q":"One IP address fails with a wrong password on forty accounts. What is that?","o":["a broken phone","a password spray","an expired license","a mail loop"],"a":1,"why":"A spray tries a few common passwords on many accounts, to stay under the lockout limit."},

    {"u":"investigate","q":"Which command lists the rules of one mailbox?","o":["Get-InboxRule -Mailbox x","Get-EXOMailbox x -Rules","Get-MailboxPermission x","Get-MgUser -UserId x"],"a":0,"why":"Look for rules that delete, forward or redirect."},
    {"u":"investigate","q":"What did this account send last week? Which command?","o":["Get-InboxRule -Mailbox x","Get-MessageTraceV2 -SenderAddress x","Get-MgAuditLogSignIn","Get-EXOMailbox x"],"a":1,"why":"Message trace shows sender, recipient, subject and delivery status. Give it a `-StartDate` and an `-EndDate`."},

    {"u":"scripts","q":"You are in the script's folder. Typing Get-StaleUsers.ps1 answers 'not recognized'. What works?","o":["./Get-StaleUsers.ps1","run Get-StaleUsers.ps1","Get-StaleUsers","Start Get-StaleUsers.ps1"],"a":0,"why":"PowerShell never runs a file from the current folder by name alone. `./` means this folder."},

<script>
const $ = id => document.getElementById(id);
const KEY = "pockle.v1";
const THEMES = ["orbital", "verdant", "graphite"];
const THEME_COLORS = { orbital: "#e8eaee", verdant: "#0e1712", graphite: "#111214" };
const RANKS = [[0, "Cadet"], [150, "Deckhand"], [400, "Technician"], [800, "Operator"], [1400, "Engineer"], [2200, "Navigator"], [3300, "Commander"], [5000, "Admiral"]];
const GAPS = [0, 1, 2, 4, 8, 16, 32];
const SLOW = 10000;
const SLOW_BY = { fill: 12000, bug: 15000, build: 25000, order: 25000, trace: 45000 };
const SPRINTABLE = c => !c.t || c.t === "fill" || c.t === "bug";
const TNAME = { fill: "fill the gap", build: "build it", order: "put in order", bug: "find the bug", trace: "trace the loop" };
function slowFor(c) { return SLOW_BY[c.t] || SLOW; }
const DRAGON_OF = {
  "junos-oops": "night", "junle": "night", "junos-lab": "night", "subnle-pocket": "night", "shelle": "night", "git-lab": "night",
  "pyle": "jade", "pyle-pocket": "jade", "sleeple": "jade", "modle": "jade",
  "passle": "ember", "seqle": "ember",
  "hexle": "pearl", "webble": "pearl", "spelle": "pearl", "rebble": "pearl"
};
function dragonOf(lab) { return DRAGON_OF[lab] || "night"; }
function dragonImg(d, small) { return "img/pockle/dragon-" + d + (small ? "-head" : "") + ".webp"; }
function topDragon(cards) {
  const n = {}; let best = "night", hi = 0;
  cards.forEach(c => { const d = dragonOf(c.lab); n[d] = (n[d] || 0) + 1; if (n[d] > hi) { hi = n[d]; best = d; } });
  return best;
}

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load() { try { return JSON.parse(lsGet(KEY)) || {}; } catch (e) { return {}; } }
let S = Object.assign({ xp: 0, streak: 0, last: null, theme: "orbital", off: [], cards: {}, best: 0, recall: true }, load());
function save() { lsSet(KEY, JSON.stringify(S)); }
function today() { const d = new Date(); return Math.floor((d - d.getTimezoneOffset() * 6e4) / 864e5); }

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function getter(k) { const v = lsGet(k); if (v == null) return null; try { return JSON.parse(v); } catch (e) { return v; } }

const OPEN_LABS = ["junos-oops", "junle", "junos-lab"];
let POOL = [], LABSTATE = [];
function scan() {
  POOL = []; LABSTATE = [];
  for (const b of BANKS) {
    let done = [], weak = [];
    try { done = b.done(getter) || []; } catch (e) { done = []; }
    if (OPEN_LABS.includes(b.id)) done = b.units.map(u => u.id);
    try { weak = (b.weak ? b.weak(getter) : []) || []; } catch (e) { weak = []; }
    const flagAt = {};
    weak.forEach(w => { if (w && w.u && b.units.some(u => u.id === w.u)) flagAt[w.u] = Math.max(flagAt[w.u] || 0, w.at || 1); });
    const set = new Set(done.concat(Object.keys(flagAt)));
    const units = b.units.filter(u => set.has(u.id));
    const cards = b.cards.filter(c => set.has(c.u)).map(c => {
      const unit = b.units.find(u => u.id === c.u);
      return Object.assign({}, c, { flagAt: flagAt[c.u] || 0, lab: b.id, labName: b.name, topic: b.topic, href: b.href, unitTitle: unit ? unit.title : "", id: b.id + ":" + hash(c.t ? JSON.stringify([c.t, c.code || "", c.setup || "", c.lines || c.tiles || c.cols || "", c.target || "", c.sol || c.bad || ""]) : c.q + "|" + (c.code || "") + "|" + c.o[c.a]) });
    });
    if (b.live) {
      let live = [];
      try { live = b.live(getter) || []; } catch (e) { live = []; }
      live.forEach(c => cards.unshift(Object.assign({}, c, { flagAt: c.at || 1, lab: b.id, labName: b.name, topic: b.topic, href: b.href, unitTitle: c.ut || "", id: b.id + ":live:" + hash(c.code + "|" + c.o[c.a]) })));
    }
    LABSTATE.push({ b, units, cards });
    if (!S.off.includes(b.id)) POOL.push(...cards);
  }
}

function setTheme(t) {
  S.theme = t; document.documentElement.dataset.theme = t; $("themeBtn").textContent = t;
  document.querySelector('meta[name="theme-color"]').content = THEME_COLORS[t]; save();
}
$("themeBtn").onclick = () => setTheme(THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length]);

function rankOf(xp) { let r = RANKS[0], nx = null; for (let i = 0; i < RANKS.length; i++) if (xp >= RANKS[i][0]) { r = RANKS[i]; nx = RANKS[i + 1] || null; } return { name: r[1], from: r[0], to: nx ? nx[0] : null }; }
function paintRail() {
  const r = rankOf(S.xp);
  $("rank").textContent = r.name; $("xp").textContent = S.xp;
  $("streak").textContent = (S.last === today() || S.last === today() - 1) ? S.streak : 0;
  $("xpbar").style.width = r.to ? Math.round((S.xp - r.from) / (r.to - r.from) * 100) + "%" : "100%";
}
function bumpStreak() {
  const t = today();
  if (S.last === t) return;
  S.streak = S.last === t - 1 ? S.streak + 1 : 1; S.last = t;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hl(src) {
  const re = /((?<=^|\s)\/\/[^\n]*|(?<=^|\s)# [^\n]*|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`|\b\d+(?:\.\d+)?\b|_{3,})/g;
  let out = "", i = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(i, m.index));
    const t = m[0];
    if (/^_{3,}$/.test(t)) out += '<span class="bl">&nbsp;</span>';
    else if (t[0] === "/" || t[0] === "#") out += '<span class="cm">' + esc(t) + "</span>";
    else if (/^["'`]/.test(t)) out += '<span class="st">' + esc(t) + "</span>";
    else out += '<span class="nu">' + esc(t) + "</span>";
    i = m.index + t.length;
  }
  return out + esc(src.slice(i));
}
const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200); }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0, 0); }

function st(c) { return S.cards[c.id] || null; }
function dueCards(pool) { const t = today(); return pool.filter(c => { const s = st(c); return s && s.b > 0 && s.due <= t; }); }
function flagged(c) { if (!c.flagAt) return false; const s = st(c); return !s || !s.ok || !!s.g || (s.at || 0) < c.flagAt; }
function flagCards(pool) { return pool.filter(flagged); }
function missCards(pool) { return pool.filter(c => { const s = st(c); return flagged(c) || (s && (s.w > 0 || s.g) && s.b <= 1); }); }
function mastered(c) { const s = st(c); return !!(s && s.ok && !s.g && s.b >= 4 && !(s.t > slowFor(c))); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function spread(list) {
  const by = {}; list.forEach(c => (by[c.lab] = by[c.lab] || []).push(c));
  const labs = shuffle(Object.keys(by)), out = [];
  while (labs.some(l => by[l].length)) for (const l of labs) if (by[l].length) out.push(by[l].shift());
  return out;
}
function pickMix(pool, n) {
  const picked = new Map();
  const add = arr => { for (const c of arr) { if (picked.size >= n) return; if (!picked.has(c.id)) picked.set(c.id, c); } };
  add(spread(shuffle(flagCards(pool))).slice(0, Math.ceil(n / 2)));
  add(shuffle(dueCards(pool)).sort((a, b) => st(a).due - st(b).due));
  add(shuffle(missCards(pool)));
  add(spread(shuffle(pool.filter(c => !st(c)))));
  add(spread(shuffle(pool)));
  return spread(shuffle([...picked.values()]));
}

function fluency(cards) {
  const seen = cards.map(st).filter(Boolean);
  if (seen.length < 3) return null;
  if (seen.some(s => s.ok === false || s.g)) return "shaky";
  if (cards.filter(c => { const s = st(c); return s && s.t > slowFor(c); }).length / seen.length > 0.3) return "slow";
  return "fluent";
}
function paintRecall() { $("recallBtn").textContent = S.recall ? "recall on" : "recall off"; $("recallBtn").classList.toggle("on", !!S.recall); }
$("recallBtn").onclick = () => { S.recall = !S.recall; save(); paintRecall(); toast(S.recall ? "Options stay hidden until you have an answer in mind" : "Options show straight away"); };

function paintHome() {
  scan(); paintRail();
  const unlockedLabs = LABSTATE.filter(l => l.cards.length);
  const totalUnits = LABSTATE.reduce((n, l) => n + l.units.length, 0);
  const due = dueCards(POOL).length, miss = missCards(POOL).length;
  if (!unlockedLabs.length) {
    $("welcomeImg").src = dragonImg("night"); $("welcomeImg").classList.add("sleep");
    $("welcomeTxt").innerHTML = "Nothing to quiz yet. Finish a lesson in any lab and its cards show up here. On another device? Use <b>Send to phone</b> in the Workshop and scan the code.";
  } else {
    $("welcomeImg").src = dragonImg(topDragon(dueCards(POOL).length ? dueCards(POOL) : POOL)); $("welcomeImg").classList.remove("sleep");
    const openN = POOL.filter(c => OPEN_LABS.includes(c.lab)).length, doneN = POOL.length - openN;
    const doneLabs = unlockedLabs.filter(l => !OPEN_LABS.includes(l.b.id)).length;
    $("welcomeTxt").innerHTML = (doneN ? "<b>" + doneN + " cards</b> from lessons you finished in <b>" + doneLabs + " lab" + (doneLabs === 1 ? "" : "s") + "</b>, plus " : "")
      + "<b>" + openN + " Juniper rehearsal cards</b> that are always open. Tap only, no typing.";
  }
  $("mixBtn").disabled = !POOL.length;
  $("mixSub").textContent = due ? due + " due for review · mix 10" : "mix 10 · all labs shuffled";
  $("missBtn").disabled = !miss;
  const fromLabs = flagCards(POOL).length;
  $("missSub").textContent = miss ? miss + " to fix" + (fromLabs ? " · " + fromLabs + " from the labs" : "") : "nothing to fix";
  $("sprintBtn").disabled = POOL.length < 4;
  $("sprintSub").textContent = S.best ? "best " + S.best + " · beat it" : "as many as you can";
  const on = LABSTATE.filter(l => l.cards.length && !S.off.includes(l.b.id)).length;
  const mAll = POOL.filter(mastered).length;
  $("labCount").textContent = on + " on" + (POOL.length ? " · " + mAll + "/" + POOL.length + " mastered" : "");
  paintDay();
  const list = $("labList"); list.innerHTML = "";
  const sorted = LABSTATE.slice().sort((a, b) => (b.cards.length > 0) - (a.cards.length > 0));
  for (const l of sorted) {
    const locked = !l.cards.length, inMix = !locked && !S.off.includes(l.b.id);
    const seen = l.cards.filter(c => st(c)).length, mc = l.cards.filter(mastered).length, fl = fluency(l.cards);
    const row = document.createElement("div");
    row.className = "lab" + (locked ? " locked" : "") + (inMix ? " in" : "");
    row.innerHTML = '<button class="tog" aria-label="toggle"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></button>'
      + '<div class="nm"><strong>' + esc(l.b.name) + '</strong><small>' + esc(l.b.topic) + " · " + (locked ? "nothing finished yet" : l.units.length + "/" + l.b.units.length + " lessons" + (fl ? ' · <b class="' + fl + '">' + fl + "</b>" : "")) + '</small>'
      + (locked ? "" : '<small class="m2"><span class="mn">' + mc + "</span> of " + l.cards.length + " mastered</small>")
      + '<div class="meter"><i class="seen" style="width:' + (l.cards.length ? Math.round(seen / l.cards.length * 100) : 0) + '%"></i><i class="mast" style="width:' + (l.cards.length ? Math.round(mc / l.cards.length * 100) : 0) + '%"></i></div></div>'
      + (locked ? (TAB_OF[l.b.id] ? '<button class="solo" data-tab="' + TAB_OF[l.b.id] + '">open</button>' : '<a class="solo" href="' + esc(l.b.href) + '">open</a>') : '<button class="solo">solo</button>');
    if (locked && TAB_OF[l.b.id]) row.querySelector(".solo").onclick = () => setTab(TAB_OF[l.b.id]);
    if (!locked) {
      row.querySelector(".tog").onclick = () => { S.off = inMix ? S.off.concat(l.b.id) : S.off.filter(x => x !== l.b.id); save(); paintHome(); };
      row.querySelector(".solo").onclick = () => start("solo", pickMix(l.cards, 10), l.b.name);
    }
    list.appendChild(row);
  }
}

let R = null;
function start(mode, cards, label) {
  if (!cards.length) { toast("nothing to quiz here yet"); return; }
  R = { mode, label, cards, i: 0, ok: 0, xp: 0, miss: [], answered: false, t0: Date.now(), timer: null, newM: 0, guesses: 0 };
  $("timer").hidden = mode !== "sprint";
  $("dots").hidden = mode === "sprint";
  if (mode === "sprint") {
    R.left = 60; $("timerBar").style.transition = "none"; $("timerBar").style.width = "100%";
    requestAnimationFrame(() => { $("timerBar").style.transition = "width 1s linear"; });
    R.timer = setInterval(() => { R.left--; $("timerBar").style.width = (R.left / 60 * 100) + "%"; if (R.left <= 0) finish(); }, 1000);
  }
  $("dots").innerHTML = cards.map(() => "<i></i>").join("");
  show("drill"); render();
}

function head(c) { return '<div class="ticket"><span class="lt"><img class="dg" src="' + dragonImg(dragonOf(c.lab), true) + '" alt="">' + esc(c.labName) + (flagged(c) ? ' <i class="flag">lab redo</i>' : "") + '</span><span>' + esc(c.t ? TNAME[c.t] + " · " + c.unitTitle : c.unitTitle) + '</span></div>'; }
function tgt(c, label, v) { return '<div class="target">' + esc(label) + '<pre>' + esc(v) + '</pre></div>'; }
function guessRow() { return R.mode === "sprint" ? "" : '<div class="qtools"><button class="guess" id="guessBtn"><i></i>I\'m guessing</button></div>'; }
function wireGuess() {
  const g = $("guessBtn"); if (!g) return;
  g.onclick = () => { if (R.answered) return; R.guess = !R.guess; g.classList.toggle("on", R.guess); };
}
function recallWrap(sel) {
  if (!(S.recall && R.mode !== "sprint")) return;
  const ch = $("qcard").querySelector(sel); ch.classList.add("hide");
  const b = document.createElement("button"); b.className = "reveal";
  b.innerHTML = "<b>Think of the answer</b><span>then tap to show options</span>";
  ch.before(b); b.onclick = () => { b.remove(); ch.classList.remove("hide"); };
}

function render() {
  const c = R.cards[R.i]; R.answered = false; R.guess = false;
  $("count").textContent = R.mode === "sprint" ? R.ok + " right" : (R.i + 1) + " / " + R.cards.length;
  $("ok").textContent = R.ok;
  [...$("dots").children].forEach((d, k) => { if (k === R.i) d.className = "on"; });
  $("nextBtn").classList.remove("on");
  if (c.t) { renderTyped(c); R.t0 = performance.now(); return; }
  const order = shuffle(c.o.map((t, k) => k));
  R.order = order;
  $("qcard").innerHTML = head(c)
    + '<div class="ask">' + inl(c.q) + '</div>'
    + (c.code ? '<div class="code' + (c.topic === "Junos" ? " wrap" : "") + '">' + hl(c.code) + '</div>' : "")
    + guessRow()
    + '<div class="choices">' + order.map(k => '<button class="choice" data-k="' + k + '">' + esc(c.o[k]) + '</button>').join("") + '</div>'
    + '<div class="fb" id="fb"></div>';
  $("qcard").querySelectorAll(".choice").forEach(b => b.onclick = () => answer(+b.dataset.k));
  wireGuess();
  R.t0 = performance.now();
  recallWrap(".choices");
}

function renderTyped(c) {
  const box = $("qcard");
  if (c.t === "fill") {
    box.innerHTML = head(c) + '<div class="ask">Pick what goes in the gap.</div><div class="code">' + hl(c.code) + '</div>' + tgt(c, c.tl, c.target) + guessRow()
      + '<div class="chips" id="ch">' + c.o.map((o, j) => '<button class="chip" data-j="' + j + '">' + esc(o) + '</button>').join("") + '</div><div class="fb" id="fb"></div>';
    box.querySelectorAll("#ch .chip").forEach(b => b.onclick = () => {
      if (R.answered) return;
      const j = +b.dataset.j, right = c.ok.includes(j);
      const bl = box.querySelector(".code .bl"); if (bl) bl.textContent = c.o[j];
      box.querySelectorAll("#ch .chip").forEach((x, xi) => { x.disabled = true; if (c.ok.includes(xi)) x.classList.add("good"); });
      if (!right) b.classList.add("bad");
      settle(c, right, right ? "" : "The gap is <code>" + esc(c.o[c.ok[0]]) + "</code>.");
    });
    wireGuess(); recallWrap("#ch");
  } else if (c.t === "build" || c.t === "order") {
    const isB = c.t === "build", items = isB ? c.tiles : c.lines;
    R.seq = [];
    box.innerHTML = head(c) + '<div class="ask">' + esc(isB ? c.ask : "Tap the lines in the right order.") + '</div>'
      + (isB && c.setup ? '<div class="code">' + hl(c.setup) + '</div>' : "") + tgt(c, c.tl, c.target)
      + (isB ? '<div class="slot" id="slot"></div><div class="chips" id="pool"></div>' : '<div class="built" id="slot"></div><div class="lines" id="pool"></div>')
      + guessRow() + '<div class="acts"><button class="btn" id="howB">Show me</button><button class="btn main" id="chkB" disabled>Check</button></div><div class="fb" id="fb"></div>';
    const piece = (t, extra, attr) => isB ? '<button class="chip' + extra + '" ' + attr + '>' + esc(t) + '</button>'
      : '<button class="lrow' + extra + '" ' + attr + '><span class="ln"></span><span>' + hl(t) + '</span></button>';
    const paint = () => {
      $("slot").innerHTML = R.seq.length ? R.seq.map((t, p) => piece(items[t], "", 'data-p="' + p + '"')).join("")
        : '<span class="ph">' + (isB ? "tap the pieces below to build one line" : "tap the first line below") + '</span>';
      if (!isB) $("slot").querySelectorAll(".ln").forEach((n, k) => n.textContent = k + 1);
      $("pool").innerHTML = items.map((t, j) => piece(t, R.seq.includes(j) ? (isB ? " used" : " picked") : "", 'data-j="' + j + '"' + (R.seq.includes(j) ? " disabled" : ""))).join("");
      $("slot").querySelectorAll("[data-p]").forEach(b => b.onclick = () => { if (R.answered) return; R.seq.splice(+b.dataset.p, 1); paint(); });
      $("pool").querySelectorAll("[data-j]").forEach(b => b.onclick = () => { if (R.answered) return; R.seq.push(+b.dataset.j); paint(); });
      $("chkB").disabled = R.answered || (isB ? !R.seq.length : R.seq.length !== items.length);
    };
    paint();
    const solTxt = c.sol.split(",").map(t => items[+t]).join(isB ? " " : "\n");
    $("chkB").onclick = () => {
      if (R.answered) return;
      const right = c.ok.includes(R.seq.join(","));
      $("slot").classList.add(right ? "good" : "bad");
      settle(c, right, right ? "" : (isB ? "One right line:" : "Right order:") + '<div class="code">' + hl(solTxt) + '</div>');
      paint(); $("howB").disabled = true;
    };
    $("howB").onclick = () => {
      if (R.answered) return;
      R.seq = c.sol.split(",").map(Number); $("slot").classList.add("bad");
      settle(c, false, "Here it is. It comes back soon for another go.");
      paint(); $("howB").disabled = true;
    };
    wireGuess();
  } else if (c.t === "bug") {
    box.innerHTML = head(c) + '<div class="ask">One line is broken. Tap it.</div>' + tgt(c, c.tl, c.expect) + tgt(c, "but gives", c.got) + guessRow()
      + '<div class="lines" id="pool">' + c.lines.map((l, j) => '<button class="lrow" data-j="' + j + '"><span class="ln">' + (j + 1) + '</span><span>' + hl(l || " ") + '</span></button>').join("") + '</div><div class="fb" id="fb"></div>';
    box.querySelectorAll("#pool .lrow").forEach(b => b.onclick = () => {
      if (R.answered) return;
      const j = +b.dataset.j, right = j === c.bad;
      box.querySelectorAll("#pool .lrow").forEach((x, xi) => { x.disabled = true; if (xi === c.bad) x.classList.add("good"); });
      if (!right) b.classList.add("bad");
      settle(c, right, "Line " + (c.bad + 1) + " fixed:" + '<div class="code">' + hl(c.fix.trimEnd()) + '</div>');
    });
    wireGuess();
  } else if (c.t === "trace") {
    const nc = c.cols.length, total = c.rows.length * nc;
    R.cell = 0; R.tbad = []; R.lock = false;
    box.innerHTML = head(c) + '<div class="ask">Follow the loop. Fill the table one value at a time.</div><div class="code">' + hl(c.code) + '</div><table class="trace" id="tt"></table><div class="tprompt" id="tp"></div><div class="chips" id="ch"></div>' + guessRow() + '<div class="fb" id="fb"></div>';
    const paint = note => {
      let h = '<tr><th>after lap</th>' + c.cols.map(x => '<th>' + esc(x) + '</th>').join("") + '</tr>';
      c.rows.forEach((row, r) => {
        h += '<tr><td>' + (r + 1) + '</td>' + row.map((v, k) => {
          const idx = r * nc + k;
          const cls = idx < R.cell ? (R.tbad.includes(idx) ? "bad" : "good") : idx === R.cell ? "cur" : "";
          return '<td class="' + cls + '">' + (idx < R.cell ? esc(v) : idx === R.cell ? "?" : "") + '</td>';
        }).join("") + '</tr>';
      });
      $("tt").innerHTML = h;
      if (R.cell >= total) { $("tp").innerHTML = ""; $("ch").innerHTML = ""; return; }
      const r = Math.floor(R.cell / nc), k = R.cell % nc;
      $("tp").className = "tprompt" + (note ? " bad" : "");
      $("tp").innerHTML = (note ? note + " " : "") + "What is <code>" + esc(c.cols[k]) + "</code> after lap " + (r + 1) + "?";
      $("ch").innerHTML = c.opts[R.cell].map((o, j) => '<button class="chip" data-j="' + j + '">' + esc(o) + '</button>').join("");
      $("ch").querySelectorAll(".chip").forEach(b => b.onclick = () => {
        if (R.answered || R.lock) return;
        const val = c.rows[r][k], pick = c.opts[R.cell][+b.dataset.j];
        const step = msg => {
          R.cell++; R.lock = false; paint(msg);
          if (R.cell >= total) settle(c, !R.tbad.length, R.tbad.length ? R.tbad.length + " value" + (R.tbad.length > 1 ? "s" : "") + " off. The red ones in the table are the right values." : "");
        };
        R.lock = true;
        if (pick === val) { b.classList.add("ok"); setTimeout(() => step(""), 180); }
        else { b.classList.add("flash"); R.tbad.push(R.cell); setTimeout(() => step("It was " + esc(val) + "."), 550); }
      });
    };
    paint("");
    wireGuess();
  }
}

function grade(c, right, dt, guess) {
  const s = S.cards[c.id] || { b: 0, due: 0, w: 0, n: 0 };
  s.n++; s.at = Date.now(); s.ok = right; s.t = dt; s.g = !!(right && guess);
  if (right && guess) { s.b = Math.max(Math.min(s.b, 1), 1); s.due = today() + 1; }
  else if (right && dt > slowFor(c)) { s.b = Math.max(s.b, 1); s.due = today() + 1; }
  else if (right && s.due > today()) { s.b = Math.max(s.b, 1); }
  else if (right) { s.b = Math.min(s.b + 1, GAPS.length - 1); s.due = today() + GAPS[s.b]; }
  else { s.b = 1; s.due = today(); s.w++; }
  S.cards[c.id] = s;
}

function answer(k) {
  if (R.answered) return;
  const c = R.cards[R.i], right = k === c.a;
  $("qcard").querySelectorAll(".choice").forEach(b => {
    const bk = +b.dataset.k; b.disabled = true;
    if (bk === c.a) b.classList.add("good"); else if (bk === k) b.classList.add("bad");
  });
  settle(c, right, "");
}

function settle(c, right, extra) {
  if (R.answered) return; R.answered = true;
  const sprint = R.mode === "sprint", guess = !sprint && !!R.guess;
  const dt = Math.round(performance.now() - R.t0), slow = right && !guess && dt > slowFor(c) && !sprint;
  const wasM = mastered(c);
  grade(c, right, sprint ? 0 : dt, guess);
  if (!wasM && mastered(c)) R.newM++;
  if (guess) R.guesses++;
  const gain = right ? (guess ? 5 : 10) : 2; R.xp += gain; S.xp += gain;
  if (right) R.ok++; else R.miss.push(c);
  bumpStreak(); save(); paintRail();
  const g = $("guessBtn"); if (g) g.disabled = true;
  const dot = $("dots").children[R.i]; if (dot) dot.className = right ? (guess ? "on" : "good") : "bad";
  $("ok").textContent = R.ok;
  if (sprint) { $("count").textContent = R.ok + " right"; setTimeout(advance, right ? 450 : 1100); return; }
  const verdict = right ? (guess ? "Right, but a guess." : "Right.") : "Not quite.";
  const note = right && guess ? " A lucky guess does not count as known yet, so it comes back tomorrow."
    : slow ? " Right, but it took " + Math.round(dt / 1000) + "s. It comes back tomorrow to get faster."
    : !wasM && mastered(c) ? " Mastered." : "";
  const fb = $("fb"); fb.classList.add("on");
  fb.innerHTML = '<div class="fbrow"><div><span class="verdict ' + (right ? (guess ? "warn" : "good") : "bad") + '">' + verdict + '</span>' + inl(c.why) + note
    + (extra ? '<div style="margin-top:6px">' + extra + '</div>' : "")
    + '<div style="margin-top:6px"><a href="' + esc(c.href) + '">revisit in ' + esc(c.labName) + '</a></div></div><img class="' + (right && !guess ? "good" : "bad") + '" src="' + dragonImg(dragonOf(c.lab), true) + '" alt=""></div>';
  $("nextBtn").textContent = R.i + 1 < R.cards.length ? "Next" : "Finish";
  $("nextBtn").classList.add("on");
  setTimeout(() => fb.scrollIntoView({ behavior: "smooth", block: "nearest" }), 30);
}

function advance() {
  if (!R || R.done) return;
  R.i++;
  if (R.mode === "sprint" && R.i >= R.cards.length) R.cards.push(...pickMix(POOL.filter(SPRINTABLE), 20)), $("dots").innerHTML = "";
  if (R.i >= R.cards.length) return finish();
  render();
}
$("nextBtn").onclick = advance;
$("quitBtn").onclick = () => { if (R && R.i > 0 || (R && R.answered)) finish(); else { stopTimer(); R = null; paintHome(); show("home"); } };

function stopTimer() { if (R && R.timer) { clearInterval(R.timer); R.timer = null; } }
function finish() {
  stopTimer(); if (!R) return;
  const answered = R.mode === "sprint" ? R.ok + R.miss.length : Math.min(R.i + (R.answered ? 1 : 0), R.cards.length);
  let msg = "", cls = "good";
  if (R.mode === "sprint") {
    if (R.ok > S.best) { S.best = R.ok; msg = "New best."; } else msg = "Best is " + S.best + ".";
    save();
  } else {
    const acc = answered ? R.ok / answered : 0;
    msg = acc >= .9 ? "Clean run." : acc >= .7 ? "Solid. Misses come back first next time." : "Misses are queued for review. Revisit those lessons.";
    cls = acc >= .7 ? "good" : "bad";
    if (R.newM) msg += " " + R.newM + " card" + (R.newM > 1 ? "s" : "") + " newly mastered.";
    if (R.guesses) msg += " " + R.guesses + " guess" + (R.guesses > 1 ? "es" : "") + " come" + (R.guesses > 1 ? "" : "s") + " back tomorrow.";
  }
  $("resImg").src = dragonImg(topDragon(R.cards.slice(0, Math.max(answered, 1))));
  $("resNum").textContent = R.ok;
  $("resSub").textContent = R.mode === "sprint" ? "right in 60 seconds" : "correct of " + answered;
  $("resAcc").textContent = (answered ? Math.round(R.ok / answered * 100) : 0) + "%";
  $("resXp").textContent = "+" + R.xp;
  $("resStreak").textContent = S.streak;
  $("resMsg").textContent = msg; $("resMsg").className = "msg " + cls;
  $("resMiss").innerHTML = R.miss.length ? '<div class="sect"><span>To fix</span><span>' + R.miss.length + '</span></div>' + R.miss.map(c =>
    '<div class="m"><b>' + esc(c.labName) + " · " + esc(c.unitTitle) + '</b>' + missBody(c) + '<div>' + inl(c.why) + '</div></div>').join("") : "";
  if (R.mode === "daily") {
    const got = new Set(R.cards.slice(0, answered).map(c => c.id));
    for (const id of R.dailyLabs) if (R.cards.filter(c => c.lab === id).every(c => got.has(c.id)) && !S.day.done.includes(id)) S.day.done.push(id);
    save();
    const left = dayLabs().filter(l => !S.day.done.includes(l.b.id)).length;
    msg += left ? " " + left + " lab" + (left > 1 ? "s" : "") + " left today." : " All of today's reviews are done.";
    $("againBtn").textContent = "Today";
  } else $("againBtn").textContent = "Again";
  R.done = true; show("result");
}
$("againBtn").onclick = () => { if (R && R.mode === "daily") { R = null; paintHome(); show("home"); return; } const m = R ? R.mode : "mix", lab = R && R.mode === "solo" && LABSTATE.find(l => l.b.name === R.label); scan(); if (lab) { const l = LABSTATE.find(x => x.b.id === lab.b.id); start("solo", pickMix(l.cards, 10), l.b.name); } else go(m); };
$("homeBtn").onclick = () => { R = null; paintHome(); show("home"); };

function missBody(c) {
  const code = t => '<div class="code">' + hl(t) + '</div>';
  if (!c.t) return inl(c.q) + (c.code ? code(c.code) : "") + '<div class="ans">' + esc(c.o[c.a]) + '</div>';
  if (c.t === "fill") return code(c.code.replace(/_{3,}/, c.o[c.ok[0]]));
  if (c.t === "build") return (c.setup ? code(c.setup) : "") + code(c.sol.split(",").map(t => c.tiles[+t]).join(" "));
  if (c.t === "order") return code(c.sol.split(",").map(t => c.lines[+t]).join("\n"));
  if (c.t === "bug") return "line " + (c.bad + 1) + " should be" + code(c.fix.trimEnd());
  if (c.t === "trace") return code(c.code) + '<table class="trace"><tr><th>after lap</th>' + c.cols.map(x => '<th>' + esc(x) + '</th>').join("") + '</tr>' + c.rows.map((r, i) => '<tr><td>' + (i + 1) + '</td>' + r.map(v => '<td>' + esc(v) + '</td>').join("") + '</tr>').join("") + '</table>';
  return "";
}

const DAILY_MAX = 8, DAILY_FRESH = 5;
function dayState() { if (!S.day || S.day.d !== today()) S.day = { d: today(), done: [] }; return S.day; }
function dayLabs() { dayState(); return LABSTATE.filter(l => l.cards.length && !S.off.includes(l.b.id)); }
function dailyCards(l) {
  const due = dueCards(l.cards).sort((a, b) => st(a).due - st(b).due);
  return due.length ? due.slice(0, DAILY_MAX) : pickMix(l.cards, DAILY_FRESH);
}
function startDaily(labs, label) {
  if (!labs.length) { toast("All of today's reviews are done"); return; }
  const cards = labs.flatMap(l => shuffle(dailyCards(l)));
  if (!cards.length) { toast("Nothing to review yet"); return; }
  start("daily", cards, label);
  R.dailyLabs = [...new Set(cards.map(c => c.lab))];
}
function paintDay() {
  const labs = dayLabs(), list = $("dayList"); list.innerHTML = "";
  const done = labs.filter(l => S.day.done.includes(l.b.id)).length;
  $("dayCount").textContent = labs.length ? done + "/" + labs.length : "";
  $("dayAllBtn").hidden = !labs.length || done === labs.length;
  if (!labs.length) { list.innerHTML = '<div class="empty">Finish a lesson in any lab and its daily review shows up here.</div>'; return; }
  const order = labs.slice().sort((a, b) => S.day.done.includes(a.b.id) - S.day.done.includes(b.b.id));
  for (const l of order) {
    const isDone = S.day.done.includes(l.b.id), due = dueCards(l.cards).length;
    const row = document.createElement("button");
    row.className = "lab day" + (isDone ? " done" : "");
    row.innerHTML = '<span class="tog"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span>'
      + '<span class="nm"><strong>' + esc(l.b.name) + '</strong><small>' + esc(l.b.topic) + '</small></span>'
      + '<span class="cnt' + (!isDone && due ? " due" : "") + '">' + (isDone ? "done" : due ? Math.min(due, DAILY_MAX) + " due" : DAILY_FRESH + " warm-up") + '</span>';
    row.onclick = () => startDaily([l], l.b.name);
    list.appendChild(row);
  }
}
$("dayAllBtn").onclick = () => startDaily(dayLabs().filter(l => !S.day.done.includes(l.b.id)), "Today");

const TAB_OF = { "pyle-pocket": "python", "subnle-pocket": "subnet" };
function setTab(t) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.body.classList.toggle("ext", t !== "review");
  document.querySelectorAll(".pane").forEach(f => {
    const on = f.id === "pane-" + t;
    f.classList.toggle("on", on);
    if (on && !f.src) f.src = f.dataset.src;
  });
  if (t === "review" && !R) { paintHome(); show("home"); }
  if (S.tab !== t) { S.tab = t; save(); }
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
const qTab = new URLSearchParams(location.search).get("tab");

function go(mode) {
  if (mode === "miss") { const f = spread(shuffle(flagCards(POOL))), ids = new Set(f.map(c => c.id)); start("miss", f.concat(spread(shuffle(missCards(POOL).filter(c => !ids.has(c.id))))).slice(0, 10), "Mistakes"); }
  else if (mode === "sprint") start("sprint", pickMix(POOL.filter(SPRINTABLE), 20), "Sprint");
  else start("mix", pickMix(POOL, 10), "Mix");
}
$("mixBtn").onclick = () => go("mix");
$("missBtn").onclick = () => go("miss");
$("sprintBtn").onclick = () => go("sprint");

$("resetBtn").onclick = () => { if (confirm("Reset Pockle xp, streak and review history? Your lab progress stays.")) { S = { xp: 0, streak: 0, last: null, theme: S.theme, off: [], cards: {}, best: 0, recall: S.recall }; save(); paintHome(); } };

$("sendBtn").onclick = () => MegaSync.send().catch(e => toast("send failed: " + e.message));
MegaSync.listen(() => { S = Object.assign({ xp: 0, streak: 0, last: null, theme: "orbital", off: [], cards: {}, best: 0, recall: true }, load()); setTheme(THEMES.includes(S.theme) ? S.theme : "orbital"); paintRecall(); paintHome(); });

window.addEventListener("storage", () => { if ($("home").classList.contains("on")) paintHome(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && $("home").classList.contains("on")) paintHome(); });

setTheme(THEMES.includes(S.theme) ? S.theme : "orbital");
paintRecall();
paintHome();
setTab(["review", "python", "subnet"].includes(qTab) ? qTab : (S.tab || "review"));
</script>
</body>
</html>
