<!DOCTYPE html>
<html lang="en" data-theme="orbital">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8eaee">
<title>Pockle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a26'/%3E%3Crect x='9' y='7' width='14' height='18' rx='3' fill='none' stroke='%23e2b85c' stroke-width='2.2'/%3E%3Cpath d='M13 12h6M13 16h6M13 20h3' stroke='%23e2b85c' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root, :root[data-theme="orbital"] {
  --bg: #e8eaee; --panel: #f7f7f4; --panel2: #eef0f2; --line: #d4d7dd; --text: #19202c; --muted: #5f6775;
  --accent: #c99a3b; --accent-ink: #19202c; --good: #3d7a52; --bad: #b4473b; --warn: #a87414;
  --term-bg: #141a26; --term-text: #ece6d2; --term-muted: #8b93a3; --term-accent: #e2b85c;
  --k-str: #9fcf9a; --k-num: #e9a17c; --k-com: #7f8899;
}
:root[data-theme="verdant"] {
  --bg: #0e1712; --panel: #142019; --panel2: #1a281f; --line: #273b2e; --text: #e3e8df; --muted: #8ea091;
  --accent: #e0a23a; --accent-ink: #1a1206; --good: #86c27f; --bad: #e57a5f; --warn: #e0a23a;
  --term-bg: #09100c; --term-text: #f0e6cc; --term-muted: #7f907f; --term-accent: #e0a23a;
  --k-str: #a6d49d; --k-num: #f0a688; --k-com: #6c7d6f;
}
:root[data-theme="graphite"] {
  --bg: #111214; --panel: #18191c; --panel2: #1e2024; --line: #2a2c31; --text: #e7e8ea; --muted: #8b8f97;
  --accent: #d8dce3; --accent-ink: #111214; --good: #7fc29b; --bad: #e0796b; --warn: #d6b46a;
  --term-bg: #0b0c0e; --term-text: #e7e8ea; --term-muted: #7a7e86; --term-accent: #c9ced6;
  --k-str: #a8d4b4; --k-num: #e2b48a; --k-com: #646872;
}
:root {
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; transition: background .25s, color .25s; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; gap: 8px; height: 38px; }
.logo { font-family: var(--serif); font-size: 21px; white-space: nowrap; }
.logo i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .14em; text-transform: uppercase; margin-left: 6px; vertical-align: 3px; }
.top .spacer { flex: 1; }
.chipbtn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.rail { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin: 6px 0 14px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.rail b { color: var(--text); font-weight: 600; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.screen { display: none; flex: 1; flex-direction: column; min-width: 0; }
.screen.on { display: flex; }
.sect { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.welcome { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--muted); margin-bottom: 10px; }
.welcome b { color: var(--text); }
.junie { width: 64px; height: 64px; object-fit: cover; border-radius: 50%; border: 1px solid var(--line); transition: filter .4s; }
.junie.sleep { filter: grayscale(1) brightness(.85); }
.ticket .dg { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; vertical-align: -5px; margin-right: 6px; border: 1px solid var(--line); }
.nextup { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; text-align: left; width: 100%; background: var(--term-bg); color: var(--term-text); border: 0; border-radius: 14px; padding: 14px 16px; min-height: 78px; }
.nextup small { display: block; font-family: var(--mono); font-size: 11px; color: var(--term-muted); letter-spacing: .1em; text-transform: uppercase; }
.nextup strong { display: block; font-family: var(--serif); font-size: 20px; font-weight: 500; margin-top: 3px; }
.nextup .go { font-family: var(--mono); color: var(--term-accent); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.nextup:disabled { opacity: .5; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.qbtn { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; min-height: 74px; display: flex; flex-direction: column; justify-content: space-between; }
.qbtn strong { font-family: var(--serif); font-size: 17px; font-weight: 500; }
.qbtn small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.qbtn:disabled { opacity: .45; }
.labs { display: grid; gap: 6px; }
.lab { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 6px 10px 6px 12px; min-height: 50px; }
.lab .tog { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: none; padding: 0; display: grid; place-items: center; }
.lab .tog svg { width: 16px; height: 16px; stroke: var(--accent-ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.lab.in .tog { background: var(--accent); border-color: var(--accent); }
.lab.in .tog svg { opacity: 1; }
.lab .nm { min-width: 0; }
.lab strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 16px; }
.lab small { display: block; color: var(--muted); font-size: 12px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab .meter { height: 2px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.lab .meter i { display: block; height: 100%; background: var(--good); }
.lab .solo { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 7px 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lab.locked { opacity: .45; }
.lab.locked .tog { visibility: hidden; }
.links { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.links a, .links button, .links label { text-align: center; text-decoration: none; padding: 10px 6px; font-size: 13px; color: var(--text); border-radius: 10px; border: 1px solid var(--line); background: none; cursor: pointer; }
.links input { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--term-bg); color: var(--term-text); font-size: 13px; padding: 9px 14px; border-radius: 10px; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.drillhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 28px; }
.drillhead .quit { justify-self: start; border: 0; background: none; color: var(--muted); padding: 4px 0; font-family: var(--mono); font-size: 12px; }
.drillhead .score { justify-self: end; }
.drillhead .score b { color: var(--text); }
.dots { display: flex; gap: 4px; margin: 6px 0 2px; }
.dots i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.dots i.good { background: var(--good); }
.dots i.bad { background: var(--bad); }
.dots i.on { background: var(--accent); }
.timer { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 6px 0 2px; }
.timer i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 1s linear; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 8px; min-width: 0; }
.ticket { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); padding-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.ticket span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket .lt { color: var(--accent); white-space: nowrap; flex: none; }
.ticket .flag { font-style: normal; color: var(--muted); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 6px; }
.ask { font-family: var(--serif); font-size: 18px; line-height: 1.35; margin-bottom: 4px; }
.ask code { font-family: var(--mono); font-size: .85em; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
.code { background: var(--term-bg); color: var(--term-text); border-radius: 10px; padding: 11px 13px; font-family: var(--mono); font-size: 13.5px; line-height: 1.55; overflow-x: auto; white-space: pre; margin: 8px 0 0; -webkit-overflow-scrolling: touch; }
.code.wrap { white-space: pre-wrap; word-break: break-word; }
.code .st { color: var(--k-str); }
.code .nu { color: var(--k-num); }
.code .cm { color: var(--k-com); font-style: italic; }
.code .bl { display: inline-block; min-width: 2.2em; border-bottom: 2px solid var(--term-accent); color: var(--term-accent); text-align: center; }
.choices { display: grid; gap: 8px; margin-top: 12px; }
.choice { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; font-family: var(--mono); font-size: 14px; white-space: pre-wrap; word-break: break-word; min-height: 50px; line-height: 1.4; }
.choice.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
.choice.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.choice:disabled { color: inherit; opacity: 1; }
.fb { margin-top: 12px; font-size: 14px; line-height: 1.55; display: none; border-top: 1px solid var(--line); padding-top: 10px; }
.fb.on { display: block; }
.fbrow { display: grid; grid-template-columns: 1fr 60px; gap: 8px; align-items: start; }
.fbrow img { width: 60px; height: 60px; object-fit: cover; border-radius: 50%; border: 2px solid var(--line); }
.fbrow img.good { border-color: var(--good); animation: dgpop .5s ease-out; }
.fbrow img.bad { border-color: var(--bad); filter: saturate(.45); transform: rotate(-10deg); }
@keyframes dgpop { 0% { transform: scale(.7); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
.verdict { font-weight: 700; display: block; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.verdict.warn { color: var(--warn); }
.fb code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: .93em; }
.fb a { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.next { margin-top: auto; height: 54px; border-radius: 11px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; display: none; }
.next.on { display: block; }
.spacer16 { height: 14px; }
.btn { height: 50px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.result { text-align: center; padding-top: 10px; }
.result img { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; border: 1px solid var(--line); }
.result .num { font-family: var(--serif); font-size: 60px; line-height: 1.1; }
.result .lbl { color: var(--muted); font-size: 13px; }
.result .line { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result .line div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; }
.result .line b { display: block; font-family: var(--mono); font-size: 19px; }
.result .line span { font-size: 11px; color: var(--muted); }
.result .msg { margin-top: 14px; font-weight: 600; min-height: 1.4em; }
.result .msg.good { color: var(--good); }
.result .msg.bad { color: var(--warn); }
.result .actions { margin-top: 18px; display: grid; gap: 8px; }
.misses { margin-top: 14px; text-align: left; font-size: 13px; }
.misses .m { padding: 9px 0; border-bottom: 1px solid var(--line); line-height: 1.45; }
.misses .m .code { font-size: 12px; margin-top: 4px; }
.misses .m b { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; display: block; }
.misses .m .ans { font-family: var(--mono); color: var(--good); }
.reveal { width: 100%; min-height: 64px; margin-top: 12px; border: 1px dashed var(--accent); border-radius: 11px; background: color-mix(in srgb, var(--accent) 7%, var(--panel)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.reveal b { font-family: var(--serif); font-weight: 500; font-size: 16px; }
.reveal span { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hide { display: none !important; }
.chipbtn.on { border-color: var(--accent); color: var(--text); }
.lab small b { font-weight: 600; }
.lab small b.fluent { color: var(--good); }
.lab small b.slow { color: var(--warn); }
.lab small b.shaky { color: var(--bad); }
.target { margin-top: 8px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.target pre { margin: 4px 0 0; font-size: 14px; color: var(--text); background: var(--panel2); border-radius: 8px; padding: 7px 10px; white-space: pre-wrap; word-break: break-word; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; min-height: 46px; font-family: var(--mono); font-size: 14px; min-width: 52px; }
.chip.used { opacity: .25; }
.chip.good, .chip.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
.chip.bad, .chip.flash { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.chip:disabled { color: inherit; }
.slot { min-height: 54px; border: 1px dashed var(--line); border-radius: 11px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; background: var(--panel2); }
.slot .ph, .built .ph { color: var(--muted); font-size: 13px; padding: 0 6px; }
.slot .chip { min-height: 40px; background: var(--term-bg); color: var(--term-text); border-color: var(--term-bg); }
.slot.good, .built.good { border: 1px solid var(--good); }
.slot.bad, .built.bad { border: 1px solid var(--bad); }
.lines { display: grid; gap: 6px; margin-top: 10px; }
.lrow { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 8px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-family: var(--mono); font-size: 13.5px; white-space: pre; overflow-x: auto; min-height: 44px; }
.lrow .ln { font-size: 11px; color: var(--muted); text-align: right; }
.lrow.picked { opacity: .3; }
.lrow.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
.lrow.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.lrow:disabled { color: inherit; }
.built { display: grid; gap: 4px; margin-top: 10px; min-height: 52px; border: 1px dashed var(--line); border-radius: 11px; padding: 6px; background: var(--panel2); align-content: start; }
.built .ph { padding: 10px 6px; }
.built .lrow { background: var(--term-bg); color: var(--term-text); border-color: var(--term-bg); min-height: 38px; padding: 6px 10px; }
.built .lrow .ln { color: var(--term-muted); }
.built .st, .slot .st { color: var(--k-str); }
.built .nu, .slot .nu { color: var(--k-num); }
.acts { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 12px; }
.acts .btn:disabled { opacity: .4; }
.trace { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; margin: 10px 0 2px; }
.trace td, .trace th { padding: 6px 5px; border-bottom: 1px solid var(--line); text-align: center; }
.trace td:first-child, .trace th:first-child { text-align: left; color: var(--muted); width: 90px; }
.trace th { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.trace td.cur { outline: 2px solid var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--accent); font-weight: 700; }
.trace td.good { color: var(--good); }
.trace td.bad { color: var(--bad); }
.tprompt { font-size: 14px; margin-top: 10px; min-height: 1.5em; line-height: 1.5; }
.tprompt code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
.tprompt.bad { color: var(--bad); }
.qtools { display: flex; justify-content: flex-end; margin-top: 10px; }
.guess { display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 12px; color: var(--muted); }
.guess i { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-block; }
.guess.on { border-color: var(--warn); color: var(--text); }
.guess.on i { background: var(--warn); border-color: var(--warn); }
.lab .meter { position: relative; }
.lab .meter i.seen { position: absolute; inset: 0 auto 0 0; background: var(--line); filter: brightness(.85); }
.lab .meter i.mast { position: absolute; inset: 0 auto 0 0; background: var(--good); }
.lab small.m2 { margin-top: 1px; }
.lab small .mn { color: var(--good); font-weight: 600; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding: 0 max(8px, calc(50% - 240px)) env(safe-area-inset-bottom); }
.tabs button { background: none; border: 0; height: 52px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); position: relative; }
.tabs button.on { color: var(--text); font-weight: 600; }
.tabs button.on::before { content: ""; position: absolute; left: 30%; right: 30%; top: 0; height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; }
.app { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
.pane { position: fixed; left: 0; right: 0; top: 0; bottom: calc(53px + env(safe-area-inset-bottom)); width: 100%; height: calc(100% - 53px - env(safe-area-inset-bottom)); border: 0; display: none; background: var(--bg); }
body.ext .app { display: none; }
body.ext .pane.on { display: block; }
.sect .chipbtn { text-transform: none; letter-spacing: 0; font-weight: 500; }
.day { grid-template-columns: 30px 1fr auto; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
.day .tog { pointer-events: none; }
.day.done .tog { background: var(--good); border-color: var(--good); }
.day.done .tog svg { opacity: 1; stroke: var(--bg); }
.day.done strong { color: var(--muted); }
.day .cnt { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day .cnt.due { color: var(--warn); font-weight: 600; }
.empty img { width: 96px; height: 96px; object-fit: contain; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="logo">Pockle<i>pocket</i></span>
    <span class="spacer"></span>
    <button class="chipbtn" id="recallBtn">recall on</button>
    <button class="chipbtn" id="themeBtn">orbital</button>
  </div>
  <div class="rail"><span id="rank">Cadet</span><div class="bar"><i id="xpbar"></i></div><span><b id="xp">0</b> xp · <b id="streak">0</b>d</span></div>

  <section class="screen on" id="home">
    <div class="welcome"><img class="junie" id="welcomeImg" src="img/pockle/dragon-night.webp" alt=""><div id="welcomeTxt"></div></div>
    <button class="nextup" id="mixBtn"><span><small id="mixSub">mix 10</small><strong>Pocket mix</strong></span><span class="go">start</span></button>
    <div class="quick">

<script>
(function () {
  const BACKUP = "megasync-backup";
  const SKIP = new Set([BACKUP]);
  const QR_SRC = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";

  const ls = {
    keys() { const out = []; try { for (let i = 0; i < localStorage.length; i++) out.push(localStorage.key(i)); } catch (e) {} return out; },
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };

  const b64u = {
    enc(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); },
    dec(str) { const s = atob(str.replace(/-/g, "+").replace(/_/g, "/")); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },
  };

  async function squeeze(text, mode) {
    const stream = new Blob([text]).stream().pipeThrough(mode === "in" ? new DecompressionStream("deflate-raw") : new CompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function pack() {
    const data = {};
    ls.keys().forEach((k) => { if (!SKIP.has(k)) data[k] = ls.get(k); });
    const bytes = await squeeze(JSON.stringify({ v: 1, at: Date.now(), data }), "out");
    return { code: b64u.enc(bytes), count: Object.keys(data).length };
  }

  async function unpack(code) {
    const bytes = await squeeze(b64u.dec(code), "in");
    const p = JSON.parse(new TextDecoder().decode(bytes));
    if (!p || p.v !== 1 || typeof p.data !== "object") throw new Error("not a Mega Lab sync code");
    return p;
  }

  function merge(a, b) {
    if (Array.isArray(a) && Array.isArray(b)) {
      if (a.every((x) => typeof x !== "object") && b.every((x) => typeof x !== "object")) return Array.from(new Set(a.concat(b)));
      return b.length >= a.length ? b : a;
    }
    if (a && b && typeof a === "object" && typeof b === "object") {
      const out = Object.assign({}, a);
      for (const k of Object.keys(b)) out[k] = k in a ? merge(a[k], b[k]) : b[k];
      return out;
    }
    if (typeof a === "number" && typeof b === "number") return Math.max(a, b);
    if (typeof a === "boolean" && typeof b === "boolean") return a || b;
    return b === undefined || b === null ? a : b;
  }

  function mergeValue(oldRaw, newRaw) {
    if (oldRaw == null) return newRaw;
    let o, n;
    try { o = JSON.parse(oldRaw); n = JSON.parse(newRaw); } catch (e) { return newRaw; }
    if (o && n && typeof o === "object" && typeof n === "object") return JSON.stringify(merge(o, n));
    if (typeof o === "number" && typeof n === "number") return JSON.stringify(Math.max(o, n));
    return newRaw;
  }

  function apply(p) {
    const backup = {};
    let changed = 0;
    for (const [k, v] of Object.entries(p.data)) {
      if (SKIP.has(k) || typeof v !== "string") continue;
      const old = ls.get(k);
      const next = mergeValue(old, v);
      if (next !== old) { backup[k] = old; ls.set(k, next); changed++; }
    }
    ls.set(BACKUP, JSON.stringify({ at: Date.now(), data: backup }));
    return changed;
  }

  function undo() {
    let b; try { b = JSON.parse(ls.get(BACKUP)); } catch (e) { b = null; }
    if (!b || !b.data) return 0;
    let n = 0;
    for (const [k, v] of Object.entries(b.data)) { if (v === null) { try { localStorage.removeItem(k); } catch (e) {} } else ls.set(k, v); n++; }
    try { localStorage.removeItem(BACKUP); } catch (e) {}
    return n;
  }

  function loadQr() {
    if (window.qrcode) return Promise.resolve(window.qrcode);
    return new Promise((res, rej) => { const s = document.createElement("script"); s.src = QR_SRC; s.onload = () => res(window.qrcode); s.onerror = rej; document.head.appendChild(s); });
  }

  const CSS = `.msync{position:fixed;inset:0;z-index:9999;background:rgba(8,10,14,.6);display:flex;align-items:flex-end;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (min-width:700px){.msync{align-items:center}.msync .sh{border-radius:16px}}
.msync .sh{width:100%;max-width:440px;background:#17191d;color:#e9eaec;border:1px solid #2b2e34;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 20px 60px rgba(0,0,0,.45)}
.msync h3{margin:0 0 4px;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:500;font-size:21px;color:#f2f2f3}
.msync p{margin:0 0 12px;font-size:13px;line-height:1.55;color:#a3a7ae}
.msync .qr{display:flex;justify-content:center;margin:8px 0 14px}
.msync .qr svg{width:220px;height:220px;background:#fff;padding:12px;border-radius:12px}
.msync .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.msync .row.one{grid-template-columns:1fr}
.msync button{height:48px;border-radius:11px;border:1px solid #33363d;background:#202328;color:#e9eaec;font:inherit;font-weight:600;cursor:pointer}
.msync button.main{background:#d8b25e;border-color:#d8b25e;color:#17191d}
.msync .meta{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#d8b25e;margin-bottom:10px}`;

  function sheet(html) {
    if (!document.getElementById("msync-css")) { const st = document.createElement("style"); st.id = "msync-css"; st.textContent = CSS; document.head.appendChild(st); }
    const el = document.createElement("div");
    el.className = "msync";
    el.innerHTML = `<div class="sh">${html}</div>`;
    el.addEventListener("click", (e) => { if (e.target === el) el.remove(); });
    document.body.appendChild(el);
    return el;
  }

  function target() {
    const u = new URL(location.href);
    const base = u.pathname.replace(/[^/]*$/, "");
    const path = /\/labs\/$/.test(base) ? base + "pockle.html" : base + "labs/pockle.html";
    return u.origin + path;
  }

  async function send() {
    const { code, count } = await pack();
    const url = target() + "#sync=" + code;
    const kb = Math.round(url.length / 1024);
    const el = sheet(`<h3>Send progress</h3><div class="meta">${count} saves · ${kb} kB link</div>
      <p>Scan this with your other device, or share the link to yourself. It opens Pockle and merges your progress in, keeping the best of both.</p>
      <div class="qr" id="msyncQr"></div>
      <div class="row${navigator.share ? "" : " one"}"><button id="msyncCopy"${navigator.share ? "" : ' class="main"'}>Copy link</button>${navigator.share ? '<button class="main" id="msyncShare">Share</button>' : ""}</div>
      <div class="row one"><button id="msyncClose">Close</button></div>`);
    el.querySelector("#msyncClose").onclick = () => el.remove();
    el.querySelector("#msyncCopy").onclick = async () => { try { await navigator.clipboard.writeText(url); el.querySelector("#msyncCopy").textContent = "Copied"; } catch (e) { prompt("Copy this link", url); } };
    const sh = el.querySelector("#msyncShare");
    if (sh) sh.onclick = () => navigator.share({ title: "Mega Lab progress", url }).catch(() => {});
    const box = el.querySelector("#msyncQr");
    if (url.length > 2900) { box.innerHTML = `<p style="text-align:center">Too much progress for a QR code. Use Share or Copy link.</p>`; return; }
    try {
      const qrcode = await loadQr();
      const q = qrcode(0, "L"); q.addData(url, "Byte"); q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch (e) { box.innerHTML = `<p style="text-align:center">QR code needs internet. Use Share or Copy link.</p>`; }
  }

  async function receive(onDone) {
    const m = location.hash.match(/[#&]sync=([A-Za-z0-9_-]+)/);
    if (!m) return;
    history.replaceState(null, "", location.pathname + location.search);
    let p;
    try { p = await unpack(m[1]); } catch (e) { sheet(`<h3>Sync link broken</h3><p>${String(e.message || e)}. Make a new link on the other device.</p><div class="row one"><button class="main" onclick="this.closest('.msync').remove()">OK</button></div>`); return; }
    const when = new Date(p.at).toLocaleString();
    const el = sheet(`<h3>Load progress?</h3><div class="meta">${Object.keys(p.data).length} saves · made ${when}</div>
      <p>This merges the progress from your other device into this one. Finished lessons, xp and streaks keep the best of both. You can undo it straight after.</p>
      <div class="row"><button id="msyncNo">Not now</button><button class="main" id="msyncYes">Load it</button></div>`);
    el.querySelector("#msyncNo").onclick = () => el.remove();
    el.querySelector("#msyncYes").onclick = () => {
      const n = apply(p);
      el.innerHTML = `<div class="sh"><h3>Synced</h3><p>${n} lab saves updated on this device.</p><div class="row"><button id="msyncUndo">Undo</button><button class="main" id="msyncOk">Done</button></div></div>`;
      el.querySelector("#msyncOk").onclick = () => { el.remove(); onDone && onDone(n); };
      el.querySelector("#msyncUndo").onclick = () => { undo(); el.remove(); onDone && onDone(0); };
    };
  }

  function listen(onDone) { receive(onDone); window.addEventListener("hashchange", () => receive(onDone)); }

  window.MegaSync = { send, receive, listen, pack, unpack, apply, undo, merge };
})();

</script>

    { u: "basics", q: "Which command gives a one-line status of every interface?", o: ["show ports all", "show ip interface brief", "show interface status", "show interfaces terse"], a: 3, why: "show interfaces terse is the fastest up/down/IP overview on Junos." },

    { u: "basics", q: "You need serial and part numbers for an RMA. Which command?", o: ["show chassis hardware", "show version", "show system storage", "show system alarms"], a: 0, why: "show chassis hardware lists the installed parts with serials." },

    { u: "basics", q: "A commit fails and you suspect a full /var. Which command checks it?", o: ["show chassis hardware", "show system storage", "show system users", "show route"], a: 1, why: "show system storage shows free disk per filesystem." },

    { u: "basics", q: "A fresh problem started an hour ago. Which command shows if the switch rebooted?", o: ["show system uptime", "show version", "show route", "show vlans"], a: 0, why: "A recent reboot in show system uptime often explains a fresh problem." },
    { u: "dayzero", q: "A factory-default switch waits at the console. Which user do you log in as?", o: ["admin", "kaatje", "juniper", "root"], a: 3, why: "A factory box only has root, with no password yet." },
    { u: "dayzero", q: "After logging in as root you see a % prompt. What do you type?", code: "root@:RE:0%", o: ["configure", "start shell", "cli", "exit"], a: 2, why: "Root lands in the FreeBSD shell; cli starts the Junos CLI." },
    { u: "dayzero", q: "Fill the blank to set the root password.", code: "set system ___ plain-text-password", o: ["root-password", "login root", "root-authentication", "authentication root"], a: 2, why: "root-authentication holds root's password; the switch prompts for it." },
    { u: "dayzero", q: "Fill the blank to give user kaatje full admin rights.", code: "set system login user kaatje\n  class ___", o: ["admin", "super-user", "operator", "root"], a: 1, why: "super-user is the built-in class with every permission." },
    { u: "dayzero", q: "Which line sets the hostname to accs4?", o: ["set system host-name accs4", "set hostname accs4", "hostname accs4", "set system name accs4"], a: 0, why: "The hostname lives under system host-name." },
    { u: "dayzero", q: "irb.0 has 10.0.0.5/24 but stays down. Which line is missing?", code: "set interfaces irb unit 0\n  family inet address 10.0.0.5/24", o: ["set routing-options irb.0", "set interfaces irb.0 enable", "set vlans default vlan-id irb.0", "set vlans default l3-interface irb.0"], a: 3, why: "An irb address does nothing until a VLAN binds it as its l3-interface." },
    { u: "dayzero", q: "Which line sets the default route via 10.0.0.1?", o: ["set route 0.0.0.0/0 10.0.0.1", "set routing-options default 10.0.0.1", "ip route 0.0.0.0 0.0.0.0 10.0.0.1", "set routing-options static route 0.0.0.0/0 next-hop 10.0.0.1"], a: 3, why: "Static routes live under routing-options static." },
    { u: "dayzero", q: "How do you stop the switch auto-upgrading its image on boot?", o: ["set chassis auto-image-upgrade disable", "set system no-upgrade", "delete chassis auto-image-upgrade", "request system auto-upgrade stop"], a: 2, why: "Deleting the auto-image-upgrade statement turns the feature off." },
    { u: "dayzero", q: "Which line enables SSH access?", o: ["set services ssh enable", "set system services ssh", "set system ssh on", "set protocols ssh"], a: 1, why: "Management services live under system services." },
    { u: "dayzero", q: "Which single command commits and leaves configuration mode?", o: ["commit and-quit", "commit confirmed", "commit check", "save and exit"], a: 0, why: "commit and-quit applies the candidate and drops you to operational mode." },
    { u: "vlans", q: "Which line creates VLAN servers with tag 20?", o: ["set vlans servers vlan-id 20", "set vlan 20 name servers", "set vlans 20 name servers", "set vlans servers tag 20"], a: 0, why: "A VLAN needs a name and a vlan-id before anything can join it." },
    { u: "vlans", q: "EX4300 is ELS. Fill the blank to make an access port.", code: "set interfaces ge-0/0/10 unit 0\n  family ethernet-switching\n  ___ access", o: ["vlan-mode", "switchport mode", "access-mode", "interface-mode"], a: 3, why: "On ELS the mode is set with interface-mode access or trunk." },
    { u: "vlans", q: "Which line puts ge-0/0/10 in VLAN servers?", o: ["set vlans servers interface ge-0/0/10", "set interfaces ge-0/0/10 vlan servers", "set interfaces ge-0/0/10 unit 0 family ethernet-switching vlan members servers", "set interfaces ge-0/0/10 unit 0 vlan-id servers"], a: 2, why: "On ELS the port lists its VLAN under vlan members." },
    { u: "vlans", q: "Trunk ge-0/0/47 must carry every VLAN. Fill the blank.", code: "set interfaces ge-0/0/47 unit 0\n  family ethernet-switching\n  vlan members ___", o: ["any", "all", "1-4094", "*"], a: 1, why: "vlan members all lets every VLAN ride the trunk." },
    { u: "vlans", q: "How do you administratively shut ge-0/0/11?", o: ["set interfaces ge-0/0/11 shutdown", "set interfaces ge-0/0/11 disable", "delete interfaces ge-0/0/11", "set interfaces ge-0/0/11 down"], a: 1, why: "disable shuts the port while keeping its config." },
    { u: "vlans", q: "On ELS, where does native-vlan-id go for trunk ge-0/0/47?", o: ["At the physical interface level", "Under vlans", "Under unit 0 family ethernet-switching", "Under protocols"], a: 0, why: "ELS: set interfaces ge-0/0/47 native-vlan-id <id>." },
    { u: "vlans", q: "Which line makes ge-0/0/44 a member of ae0?", o: ["set interfaces ae0 member ge-0/0/44", "set lacp ae0 ge-0/0/44", "set interfaces ge-0/0/44 unit 0 family ae0", "set interfaces ge-0/0/44 ether-options 802.3ad ae0"], a: 3, why: "On ELS the member carries only this 802.3ad line." },
    { u: "vlans", q: "What does lacp active mean on ae0?", code: "set interfaces ae0\n  aggregated-ether-options lacp active", o: ["LACP only replies", "The bundle is forced up", "This side sends LACP packets", "All members are active"], a: 2, why: "At least one side must be active or the bundle never negotiates." },
    { u: "vlans", q: "On the EX4300 (ELS), where do storm-control profiles live?", o: ["Under interfaces", "Under protocols rstp", "Under forwarding-options", "Under vlans"], a: 2, why: "ELS moved storm control to forwarding-options storm-control-profiles." },
    { u: "vlans", q: "Which line disables PoE on ge-0/0/20?", o: ["set interfaces ge-0/0/20 poe disable", "set poe interface ge-0/0/20 disable", "delete poe ge-0/0/20", "set chassis poe ge-0/0/20 off"], a: 1, why: "PoE has its own top-level poe hierarchy." },
    { u: "loops", q: "Which line enables RSTP on the switch?", o: ["set protocols rstp", "set spanning-tree rapid", "set protocols stp", "set rstp enable"], a: 0, why: "set protocols rstp turns on Rapid Spanning Tree." },
    { u: "loops", q: "You want this switch to be root. Which bridge priority helps?", o: ["65535", "32768", "61440", "4096"], a: 3, why: "Lower number wins the root election; 32768 is the default." },
    { u: "loops", q: "Fill the blank so access port ge-0/0/10 comes up instantly.", code: "set protocols rstp interface\n  ge-0/0/10 ___", o: ["fast", "portfast", "access", "edge"], a: 3, why: "An edge port skips the listening wait because no switch sits behind it." },
    { u: "loops", q: "Which line blocks BPDUs on edge ports so nobody plugs in a rogue switch?", o: ["set interfaces bpdu-guard", "set protocols rstp bpdu-filter", "set protocols rstp bpdu-block-on-edge", "set protocols rstp edge-block"], a: 2, why: "bpdu-block-on-edge disables an edge port that receives a BPDU." },
    { u: "loops", q: "Stop uplink ge-0/0/47 from ever becoming the root port. Fill the blank.", code: "set protocols rstp interface\n  ge-0/0/47 ___", o: ["edge", "no-root-port", "root-guard", "block-root"], a: 1, why: "no-root-port is Junos root protection." },
    { u: "loops", q: "Which command shows which switch is the current root?", o: ["show spanning-tree bridge", "show spanning-tree interface", "show rstp root", "show vlans"], a: 0, why: "show spanning-tree bridge shows the root and your own priority." },
    { u: "loops", q: "Which command shows the STP state of every port?", o: ["show spanning-tree interface", "show interfaces terse", "show spanning-tree bridge", "show ethernet-switching table"], a: 0, why: "It lists each port's role and whether it is forwarding or blocking." },
    { u: "loops", q: "What does BPDU protection do when a stray BPDU arrives on that port?", o: ["Reshapes the tree", "Ignores it", "Makes the port root", "Shuts the port"], a: 3, why: "bpdu-block disables the port instead of letting the tree change." },
    { u: "vc", q: "Which command shows the Virtual Chassis members and roles?", o: ["show chassis hardware", "show vc members", "show virtual-chassis", "show system virtual"], a: 2, why: "show virtual-chassis lists each member, its status and role." },
    { u: "vc", q: "Which command shows the VC port connections?", o: ["show interfaces vcp", "show virtual-chassis vc-port", "show lldp neighbors", "show virtual-chassis links"], a: 1, why: "vc-port shows which VC ports are up and where they lead." },
    { u: "vc", q: "Which command converts pic-slot 1 port 0 into a VC port?", o: ["set virtual-chassis vc-port 1/0", "request virtual-chassis vc-port set pic-slot 1 port 0", "set interfaces xe-0/1/0 vc-port", "request chassis vc-port 1 0"], a: 1, why: "It is an operational request, not a config set line." },
    { u: "vc", q: "Member 0 has mastership-priority 255, member 1 has 128. Who becomes master?", o: ["Member 0", "Member 1", "The lowest MAC", "Neither"], a: 0, why: "Highest mastership priority wins." },
    { u: "vc", q: "Fill the blank to renumber member 1 to member 2.", code: "request virtual-chassis renumber\n  member-id 1 ___ 2", o: ["to", "new-id", "member", "new-member-id"], a: 3, why: "The full form is renumber member-id 1 new-member-id 2." },
    { u: "vc", q: "Which line turns on preprovisioned mode?", o: ["set chassis preprovisioned", "request virtual-chassis preprovision", "set virtual-chassis preprovisioned", "set virtual-chassis auto"], a: 2, why: "Preprovisioned mode means members join only if listed in config." },
    { u: "vc", q: "show virtual-chassis lists member 1 as NotPrsnt. A good next command?", o: ["request system reboot", "show route", "show virtual-chassis vc-port", "rollback 1"], a: 2, why: "Check if the cabled port was ever made a VC port." },
    { u: "routing", q: "Which line gives irb.20 the address 10.20.0.1/24?", o: ["set interfaces irb.20 address 10.20.0.1/24", "set interfaces irb unit 20 family inet address 10.20.0.1/24", "set vlans servers address 10.20.0.1/24", "set interfaces vlan unit 20 family inet address 10.20.0.1/24"], a: 1, why: "On ELS the routed VLAN interface is irb, unit = VLAN gateway." },
    { u: "routing", q: "irb.20 has an IP but stays down. Which line is missing?", o: ["set vlans servers l3-interface irb.20", "set interfaces irb unit 20 enable", "set routing-options irb.20", "set vlans servers vlan-id irb.20"], a: 0, why: "Without the l3-interface binding the irb never comes up." },
    { u: "routing", q: "Which line adds a static route to 192.168.50.0/24 via 10.0.0.254?", o: ["set static 192.168.50.0/24 via 10.0.0.254", "set route 192.168.50.0/24 10.0.0.254", "set routing-options route 192.168.50.0/24 gateway 10.0.0.254", "set routing-options static route 192.168.50.0/24 next-hop 10.0.0.254"], a: 3, why: "Static routes live under routing-options static route." },
    { u: "routing", q: "Fill the blank to put irb.20 into OSPF area 0.", code: "set protocols ospf area ___\n  interface irb.20", o: ["backbone", "1", "zero", "0.0.0.0"], a: 3, why: "Area 0 is written 0.0.0.0 (or 0)." },
    { u: "routing", q: "What does passive do on an OSPF interface?", o: ["Only receives routes", "Disables OSPF there", "Advertises the subnet but forms no neighbours", "Makes it the DR"], a: 2, why: "Passive shares the subnet without talking OSPF to hosts." },
    { u: "routing", q: "Which line sets your own BGP AS to 65010?", o: ["set protocols bgp local-as 65010", "set routing-options autonomous-system 65010", "set bgp as 65010", "set protocols bgp asn 65010"], a: 1, why: "Your AS lives under routing-options." },
    { u: "routing", q: "Fill the blank for an eBGP peering group.", code: "set protocols bgp group upstream\n  type ___", o: ["external", "ebgp", "internal", "peer"], a: 0, why: "type external peers with a different AS." },
    { u: "routing", q: "Which command shows routes you learned FROM 10.0.0.254?", o: ["show route receive-protocol bgp 10.0.0.254", "show route advertising-protocol bgp 10.0.0.254", "show bgp summary", "show route protocol static"], a: 0, why: "receive-protocol = what came in; advertising-protocol = what you send." },
    { u: "routing", q: "Which command shows the state of your BGP sessions?", o: ["show bgp routes", "show route", "show ospf neighbor", "show bgp summary"], a: 3, why: "show bgp summary lists each peer and its state." },
    { u: "routing", q: "Which command shows which router is the VRRP master?", o: ["show interfaces irb", "show route", "show vrrp", "show route vrrp"], a: 2, why: "show vrrp shows each group's state: master or backup." },
    { u: "rescue", q: "Which command shows your uncommitted changes against the running config?", o: ["show configuration", "show | compare", "commit check", "show system commit"], a: 1, why: "show | compare diffs the candidate against the active config." },
    { u: "rescue", q: "What does rollback 0 do?", o: ["Loads the previous commit", "Throws away uncommitted changes", "Reboots the switch", "Deletes all config"], a: 1, why: "rollback 0 reloads the active config into the candidate." },
    { u: "rescue", q: "What does rollback 1 do?", o: ["Loads the previous committed config into the candidate", "Discards uncommitted edits only", "Applies the previous config at once", "Restores factory default"], a: 0, why: "It loads it; a commit is still needed to apply it." },
    { u: "rescue", q: "Which command checks the config for errors without applying it?", o: ["commit and-quit", "commit confirmed", "show | compare", "commit check"], a: 3, why: "commit check validates but changes nothing." },
    { u: "rescue", q: "You run commit confirmed 5 and then lose access. What happens?", o: ["Nothing", "The switch reboots", "It rolls back after 5 minutes", "It commits for good after 5 minutes"], a: 2, why: "Without a second commit to confirm, Junos auto-rolls back." },
    { u: "rescue", q: "Which command saves the current config as the rescue config?", o: ["request system snapshot", "save rescue", "request system configuration rescue save", "rollback rescue"], a: 2, why: "This packs your known-good parachute." },
    { u: "rescue", q: "Which command wipes the switch back to factory default?", o: ["request system reboot", "request system zeroize", "rollback 0", "delete"], a: 1, why: "zeroize is the nuclear option: it erases config and data." },
    { u: "rescue", q: "Fill the blank to see the last 20 log lines.", code: "show log messages | ___ 20", o: ["last", "tail", "count", "end"], a: 0, why: "| last n shows the final n lines, where new events are." },
    { u: "rescue", q: "Which command shows who made the last commits and when?", o: ["show system users", "show log commits", "show | compare", "show system commit"], a: 3, why: "show system commit is the commit history." },
    { u: "rescue", q: "Which command watches the log live as it happens?", o: ["show log messages", "show log live", "monitor traffic", "monitor start messages"], a: 3, why: "monitor start messages streams new log lines to your session." },
    { u: "dcl2sec", q: "Which line turns on DHCP snooping for VLAN klanten (ELS)?", o: ["set protocols dhcp-snooping klanten", "set vlans klanten dhcp-security", "set vlans klanten forwarding-options dhcp-security", "set vlans klanten dhcp-snooping"], a: 2, why: "On ELS, DHCP security lives under the VLAN's forwarding-options." },
    { u: "dcl2sec", q: "Why must the port to the real DHCP server be trusted?", o: ["To speed up DHCP", "Snooping drops server replies on untrusted ports", "Trusted ports skip VLANs", "It enables DHCP relay"], a: 1, why: "Only trusted ports may send server-type DHCP replies." },
    { u: "dcl2sec", q: "Fill the blank to trust group servers.", code: "set vlans klanten forwarding-options\n  dhcp-security group servers\n  overrides ___", o: ["trusted", "trust", "allow", "server"], a: 0, why: "overrides trusted marks that group's ports as trusted." },
    { u: "dcl2sec", q: "What do DAI and IP source guard check traffic against?", o: ["The DHCP snooping binding table", "The routing table", "The MAC address table", "The ARP cache of the gateway"], a: 0, why: "Snooping builds IP/MAC-to-port bindings that the other features use." },
    { u: "dcl2sec", q: "Dynamic ARP inspection mainly blocks...", o: ["Loops", "Broadcast storms", "Rogue DHCP servers", "ARP spoofing and man-in-the-middle"], a: 3, why: "Every ARP is checked against the binding table." },
    { u: "dcl2sec", q: "Which feature drops packets whose source IP/MAC does not match the binding table?", o: ["arp-inspection", "storm-control", "ip-source-guard", "bpdu-block"], a: 2, why: "IP source guard stops IP spoofing." },
    { u: "dcl2sec", q: "Fill the blank to cap ge-0/0/5 at 2 MACs and drop the rest.", code: "set switch-options interface ge-0/0/5\n  interface-mac-limit 2\n  packet-action ___", o: ["discard", "drop", "deny", "block"], a: 1, why: "packet-action drop discards frames from extra MACs." },
    { u: "dcl2sec", q: "What attack does a per-port MAC limit stop?", o: ["ARP spoofing", "MAC flooding (CAM table exhaustion)", "DHCP starvation of the server", "VLAN hopping"], a: 1, why: "Capping MACs stops a port filling the MAC table." },

    {"u":"vlans","q":"Which line gives ge-0/0/47 the description uplink to core?","o":["set interfaces ge-0/0/47 name \"uplink to core\"","set description ge-0/0/47 \"uplink to core\"","set interfaces ge-0/0/47 description \"uplink to core\"","set interfaces ge-0/0/47 alias \"uplink to core\""],"a":2,"why":"description sits on the interface. Quotes because the text has spaces."},
    {"u":"vlans","q":"Which command lists every VLAN with its tag and ports?","o":["show vlans","show vlan brief","show interfaces vlan","show ethernet-switching vlans"],"a":0,"why":"show vlans. show vlan brief is Cisco."},
    {"u":"vlans","q":"On the EX4300, which line forces ge-0/0/12 to 1 Gbps?","o":["set interfaces ge-0/0/12 speed 1000","set interfaces ge-0/0/12 unit 0 speed 1g","set ethernet ge-0/0/12 speed 1g","set interfaces ge-0/0/12 ether-options speed 1g"],"a":3,"why":"On the EX4300 speed lives under ether-options, not under the unit."},

    {"u":"routing","q":"Fill the blank: neighbour 10.0.0.254 lives in AS 65020.","code":"set protocols bgp group upstream neighbor 10.0.0.254 ___ 65020","o":["remote-as","as","peer-as","neighbor-as"],"a":2,"why":"Junos says peer-as. remote-as is Cisco."},

    {"u":"routing","q":"Fill the blank to give irb.20 a VRRP gateway address.","code":"set interfaces irb unit 20 family inet address 10.20.0.1/24 vrrp-group 20 ___ 10.20.0.254","o":["virtual-ip","virtual-address","standby-ip","gateway"],"a":1,"why":"virtual-address is the shared gateway the hosts use. It hangs under the real address."},
    {"u":"rescue","q":"A commit fails because the switch is almost full. Which command frees space?","o":["request system storage cleanup","clear system storage","request system cleanup","delete /var/log"],"a":0,"why":"It lists old logs and images and removes them after you confirm."},
    {"u":"rescue","q":"You want to see live which packets arrive on irb.0. Which command?","o":["show traffic irb.0","monitor start irb.0","monitor traffic interface irb.0","debug traffic irb.0"],"a":2,"why":"monitor traffic is a packet capture. monitor start follows a log file."},

    {"u": "vlans", "q": "Before any ae interface can exist, what must the chassis get?", "o": ["set chassis aggregated-devices ethernet device-count 2", "set interfaces ae0 enable", "set chassis lacp enable", "set interfaces ae count 2"], "a": 0, "why": "No ae0 until the chassis reserves slots. Without it the commit fails."},
    {"u": "vlans", "q": "ge-0/0/44 still has unit 0 with ethernet-switching. It must join ae0. First?", "o": ["deactivate interfaces ae0", "delete interfaces ge-0/0/44 unit 0", "set interfaces ge-0/0/44 disable", "delete vlans default"], "a": 1, "why": "A member port carries no unit config of its own. Leave it and the commit errors."},
    {"u": "vlans", "q": "Fill the blank so ae0 sends LACP every second.", "code": "set interfaces ae0 aggregated-ether-options lacp periodic ___", "o": ["fast", "1", "quick", "short"], "a": 0, "why": "fast is every second, slow every 30. Fast spots a dead member in 3 s, not 90."},
    {"u": "vlans", "q": "Keep ae0 up while at least one member link works. Fill the blank.", "code": "set interfaces ae0 aggregated-ether-options ___ 1", "o": ["link-count", "minimum-links", "members", "min-active"], "a": 1, "why": "minimum-links is how many members must be up for the bundle to stay up."},
    {"u": "vlans", "q": "show lacp interfaces says Defaulted on a member. What does that tell you?", "o": ["the bundle is healthy", "the port is disabled", "the far side sends no LACP", "the speed is wrong"], "a": 2, "why": "Defaulted: nothing heard from the other end. Healthy members say Collecting Distributing."},
    {"u": "vlans", "q": "Which command shows PoE status for every port?", "o": ["show poe interface", "show interfaces poe", "show chassis poe", "show power"], "a": 0, "why": "show poe interface lists each port's PoE state and power drawn."},

    {"u":"switch","q":"You change a far-away switch and fear locking yourself out. Which commit do you use?","o":["commit check","commit and-quit","commit confirmed","commit synchronize"],"a":2,"why":"`commit confirmed` rolls back by itself unless you commit again in time, so a mistake undoes itself."},
    {"u":"ready","q":"Which command shows the Proxmox version on a node?","o":["pveversion","pvecm status","qm list","uname -a"],"a":0,"why":"`pveversion` prints the installed Proxmox VE version."},
    {"u":"create","q":"Where do you run pvecm create?","o":["on every node","once, on the first node","on the node that joins","on your laptop"],"a":1,"why":"One node creates the cluster. The others join it later with `pvecm add`."},
    {"u":"join","q":"pve2 must join the cluster that pve1 created. Where do you type pvecm add, and which address do you give?","o":["on pve1, with the address of pve2","on pve2, with the address of pve1","on pve2, with its own address","on both, with the cluster name"],"a":1,"why":"You join from the new node and point at a node that is already a member."},
    {"u":"join","q":"What must be true of a node before it joins a cluster?","o":["it runs at least one VM","it has shared storage","it holds no VMs","it has two network bridges"],"a":2,"why":"A joining node must be empty, so its VM numbers cannot clash with the cluster."},
    {"u":"move","q":"What does a VM need before it can move live to another node?","o":["a disk the target node can reach","a backup from last night","a stopped state","a second network card"],"a":0,"why":"Shared storage first, then live migration. A disk on `local-lvm` exists on one node only."},
    {"u":"move","q":"Which command moves a running VM 101 to pve2?","o":["qm move 101 pve2","qm start 101 --node pve2","pvecm add pve2","qm migrate 101 pve2 --online"],"a":3,"why":"`qm migrate <vmid> <node> --online` moves it while it keeps running."},
    {"u":"dies","q":"A cluster of 3 nodes loses one. Is it still quorate?","o":["no, all three must be up","yes, 2 of 3 is a majority","only if HA is on","only after a reboot"],"a":1,"why":"More than half of the votes must see each other. With 3 nodes, 2 are enough."},
    {"u":"dies","q":"HA should restart a VM on another node. What does that need?","o":["only the VM under HA","only a disk on shared storage","the VM under HA and its disk on shared storage","a backup on the NAS"],"a":2,"why":"HA needs both. A disk on a dead node cannot be started anywhere else."},
    {"u":"add","q":"A cluster grows to 4 nodes. How many votes are a majority?","o":["2","3","4","1"],"a":1,"why":"More than half of 4 is 3."},
    {"u":"bka","q":"A NAS share must hold backups. Which option tells Proxmox it may?","o":["--content backup","--content images","--mode snapshot","--shared 1"],"a":0,"why":"Storage only holds the content types you allow. Backups need `--content backup`."},
    {"u":"bka","q":"Which vzdump mode backs up a VM while it keeps running?","o":["stop","suspend","snapshot","online"],"a":2,"why":"`--mode snapshot` backs up a running VM with the least downtime."},
    {"u":"bkb","q":"You restore a VM with qmrestore. In which state does it come back?","o":["running","stopped","paused","migrating"],"a":1,"why":"A restored VM comes back stopped. You start it yourself with `qm start`."},
    {"u":"bkb","q":"What does the 3-2-1 backup rule mean?","o":["3 nodes, 2 switches, 1 NAS","3 backups a day, 2 a week, 1 a month","3 admins, 2 passwords, 1 key","3 copies, 2 kinds of storage, 1 offsite"],"a":3,"why":"Three copies of the data, on two kinds of storage, one of them at another site."},
    {"u":"install","q":"On a fresh node, which storage holds the disks of your VMs?","o":["local","local-lvm","vmbr0","/etc/pve"],"a":1,"why":"`local-lvm` holds VM disks. `local` is a folder for ISO files, templates and backups."},
    {"u":"ready","q":"Which command lists the VMs on this node?","o":["pvecm nodes","pvesm status","qm list","pveversion"],"a":2,"why":"`qm list` shows the VMs of the node you are on, with their state."},
    {"u":"ready","q":"pvecm status says the corosync config does not exist. What does that tell you?","o":["this node is not in a cluster yet","the node is broken","the network is down","the cluster lost quorum"],"a":0,"why":"A standalone node has no cluster config. That is the answer you want before `pvecm create` or `pvecm add`."},
    {"u":"create","q":"In pvecm create west, what is west?","o":["the name of the node","the name of the storage","the name of the bridge","the name of the new cluster"],"a":3,"why":"`pvecm create <clustername>` makes a new cluster with that name on the first node."},
    {"u":"create","q":"Which command gives the short list of cluster members?","o":["pvecm nodes","qm list","pvesm list","ha-manager status"],"a":0,"why":"`pvecm nodes` lists the members. `pvecm status` adds the votes and quorum."},
    {"u":"join","q":"pvecm add asks for a password. Whose is it?","o":["your laptop user","root on the member you point at","the switch","the NAS"],"a":1,"why":"The new node logs in to an existing member as root to fetch the cluster config."},
    {"u":"join","q":"The node that must join still holds a stopped test VM 900. What do you do first?","o":["qm start 900","qm migrate 900 pve1","qm destroy 900","nothing, it joins anyway"],"a":2,"why":"A joining node must be empty. `qm destroy <vmid>` deletes a stopped VM."},
    {"u":"move","q":"Which command attaches a NAS share to the cluster?","o":["qm disk move","pvecm add","vzdump --storage","pvesm add nfs"],"a":3,"why":"`pvesm add nfs <id> --server <ip> --export <path> --content <types>` adds the share as storage."},
    {"u":"move","q":"The disk of VM 101 sits on local-lvm. Which command moves it to the NAS storage nas-west?","o":["qm disk move 101 scsi0 nas-west","qm migrate 101 nas-west","pvesm add nfs nas-west","qm move 101 nas-west"],"a":0,"why":"`qm disk move <vmid> <disk> <storage>` moves one disk. `qm migrate` moves the VM to another node."},
    {"u":"move","q":"Who can reach a storage of type nfs?","o":["only the node that added it","every node in the cluster","only the first node","only the VM that uses it"],"a":1,"why":"The share lives on the NAS, so every node sees it. That is what makes a live move possible."},
    {"u":"dies","q":"Which command puts VM 101 under HA?","o":["qm start 101 --ha","pvecm add vm:101","ha-manager add vm:101","qm migrate 101 --ha"],"a":2,"why":"`ha-manager add vm:<vmid>` makes the VM an HA resource."},
    {"u":"add","q":"In a cluster of 4, two nodes are down. Is it quorate?","o":["yes, half is enough","yes, if HA is on","only on the first node","no, 2 is not more than half"],"a":3,"why":"A majority means more than half. With 4 votes you need 3."},
    {"u":"add","q":"Which command shows what HA is doing with your VMs?","o":["ha-manager status","pvesm status","qm list","pvecm nodes"],"a":0,"why":"`ha-manager status` shows the HA resources and on which node they run."},
    {"u":"bka","q":"Pick the command that backs up VM 101 to backup-a while it keeps running.","o":["qmrestore 101 backup-a","vzdump 101 --storage backup-a --mode snapshot","qm migrate 101 backup-a --online","pvesm add backup-a 101"],"a":1,"why":"`vzdump <vmid> --storage <id> --mode snapshot` writes the backup without stopping the VM."},
    {"u":"bkb","q":"Which command shows the backups stored on backup-a?","o":["qm list backup-a","pvecm status","pvesm list backup-a","vzdump --list"],"a":2,"why":"`pvesm list <storage>` shows what is on it. `qmrestore` needs the exact name from that list."},
    {"u":"bkb","q":"qmrestore needs two things. Which?","o":["the node and the storage","the VM name and a date","the cluster name and a password","the backup archive and a VM number"],"a":3,"why":"`qmrestore <archive> <vmid>`: which backup, and which VM number it becomes."},
    {"u":"install","q":"You open https://<server>:8006 the first time and the browser warns you. Why?","o":["the server is hacked","the certificate is self-signed","port 8006 is blocked","the ISO was wrong"],"a":1,"why":"Proxmox makes its own certificate at install. The browser does not know it yet, so it warns once."},
    {"u":"install","q":"You picked a ZFS mirror (RAID1) in the installer. Where do VM disks go?","o":["local-zfs","local-lvm","vmbr0","local"],"a":0,"why":"A ZFS install gives `local-zfs` for VM disks. An ext4 install gives `local-lvm`."},
    {"u":"install","q":"The server boots, but VMs will not start. What did you forget in the BIOS?","o":["the boot order","the fan profile","virtualization (VT-x or AMD-V)","the clock"],"a":2,"why":"A hypervisor needs the CPU's virtualization switched on in the BIOS."},
    {"u":"install","q":"On your laptop, which command shows the gateway of your network?","o":["cat /etc/resolv.conf","ping 192.168.0.1","hostname -f","ip route"],"a":3,"why":"`ip route` shows the line `default via <gateway>`. Look it up, never guess it."},
    {"u":"install","q":"Which file shows the DNS server your laptop uses?","o":["/etc/resolv.conf","/etc/hostname","/etc/hosts","/etc/pve/storage.cfg"],"a":0,"why":"`cat /etc/resolv.conf` lists the `nameserver` lines."},
    {"u":"switch","q":"You typed set commands on a Juniper switch. When do they take effect?","o":["right away","after commit","after a reboot","after show | compare"],"a":1,"why":"Junos keeps changes in a candidate config. Nothing is active before `commit`."},
    {"u":"switch","q":"The first commit on a factory-fresh Juniper switch fails. What is missing?","o":["a hostname","a VLAN","a root password","an ssh key"],"a":2,"why":"Junos refuses to commit without `root-authentication`. No root password, no commit."},
    {"u":"switch","q":"You set an address without its /24 on a Junos interface. What happens?","o":["Junos guesses /24","the commit fails","it becomes a /8","it becomes a /32 and reaches nobody"],"a":3,"why":"No prefix means a /32: a network of one address."},
    {"u":"switch","q":"A new switch port has not been touched yet. In which VLAN is it?","o":["the default VLAN, ID 1","no VLAN at all","the last VLAN you made","VLAN 4095"],"a":0,"why":"Every access port sits in `default` (VLAN 1) until you move it."},
    {"u":"switch","q":"Which link carries several VLANs between two switches?","o":["an access port","a trunk, with the VLAN on both ends","a console cable","a bridge"],"a":1,"why":"Switch to switch is a trunk. If one end lacks the VLAN, nothing passes."},
    {"u":"switch","q":"Which command proves that a trunk really carries traffic?","o":["show vlans","show interfaces terse","show ethernet-switching table","show system uptime"],"a":2,"why":"The MAC table only fills when frames arrive. Empty table, no traffic."},
    {"u":"switch","q":"ssh to a fresh Juniper switch is refused. Which statement turns it on?","o":["set interfaces ssh","set system login ssh","set vlans ssh","set system services ssh"],"a":3,"why":"ssh is off until you set `system services ssh` and commit."},
    {"u":"move","q":"How do you check where the disk of VM 101 lives?","o":["qm config 101","qm list","pvecm status","pvesm add"],"a":0,"why":"`qm config <vmid>` shows each disk as `<storage>:<volume>`."},
    {"u":"dies","q":"A cluster has lost quorum. What happens to changes?","o":["they work as normal","they are refused: /etc/pve turns read-only","they are queued","the cluster deletes itself"],"a":1,"why":"No quorum, no changes. That protects the config, it is not a fault."},
    {"u":"bka","q":"Where do you schedule a nightly backup in the web interface?","o":["Node > System","Datacenter > Storage","Datacenter > Backup","VM > Hardware"],"a":2,"why":"Datacenter > Backup holds the backup jobs that run on a schedule."},
    {"u": "install", "q": "You copied the Proxmox ISO onto a USB stick like any other file. Will the server start from it?", "o": ["yes, any stick works", "no, it must be written with a flashing tool", "only on old BIOS servers", "only after a reboot"], "a": 1, "why": "A server only starts from a stick that a flashing tool wrote the image onto."},
    {"u": "install", "q": "The install is done. Why take the USB stick out before the reboot?", "o": ["USB comes first in the boot order, so the installer starts again", "Proxmox wipes it", "it holds the licence", "the server overheats"], "a": 0, "why": "Leave it in and the server boots the installer instead of its own disks."},
    {"u": "install", "q": "A server has two power supplies. How do you cable them?", "o": ["both on feed A", "both on one power strip", "one on feed A, one on feed B", "one plugged in, one spare"], "a": 2, "why": "Two supplies on one feed protect against nothing. A and B keep it running when one feed fails."},
    {"u": "install", "q": "What does the management port (MGT, the BMC) let you do from your desk?", "o": ["only read the temperature", "run VMs", "nothing until Proxmox is installed", "power on, see the screen and attach an ISO"], "a": 3, "why": "The BMC runs as soon as the server has power. That is why it works before any OS."},
    {"u": "install", "q": "How do you choose the address for a new node?", "o": ["take what DHCP hands out", "free in the register, pinged, outside the DHCP range, reserved", "any number that looks unused", "the address of the gateway plus one"], "a": 1, "why": "A register can be out of date. Ping first, then reserve it so nobody else takes it."},
    {"u": "install", "q": "Why must a cluster node have a fixed address?", "o": ["cluster nodes find each other by address", "DHCP is too slow", "the web interface needs it", "the licence is tied to it"], "a": 0, "why": "Change a node's address later and the other nodes lose it."},
    {"u": "switch", "q": "A factory-fresh Juniper switch shows Amnesiac at the login. What does that mean?", "o": ["it lost power", "it is broken", "it has no configuration yet", "it is in a Virtual Chassis"], "a": 2, "why": "No name, no address, no password. You log in as root on the console."},
    {"u": "switch", "q": "You log in as root on the console and see a % prompt. What gets you into Junos?", "o": ["configure", "enable", "exit", "cli"], "a": 3, "why": "`%` is the shell. `cli` starts Junos operational mode (`>`). `configure` comes after that."},
    {"u": "switch", "q": "Which command shows what your commit would change?", "o": ["commit check", "show configuration", "show | compare", "rollback 0"], "a": 2, "why": "`show | compare` lists the lines you added (+) and took out (-). Look before you commit."},
    {"u": "switch", "q": "me0 has a wrong address. You set the right one on top. What happens?", "o": ["the new one replaces the old", "me0 now has two addresses", "the commit fails", "both become /32"], "a": 1, "why": "`set` adds a line. Take the wrong one out with `delete` first."},
    {"u": "switch", "q": "Two switches share VLANs over a trunk. How does a frame keep its VLAN on the cable?", "o": ["a tag with the VLAN number", "the VLAN name in the frame", "a separate cable per VLAN", "the MAC of the switch"], "a": 0, "why": "A trunk puts the VLAN number in a tag. Same number on both ends, or nothing passes."},
    {"u": "dies", "q": "A node is cut off and you run pvecm expected 1 on it. When is that right?", "o": ["every time a node reboots", "to add a new node", "to speed up HA", "only in an emergency, when you are certain the others are down"], "a": 3, "why": "If the others are alive but unreachable, both sides can now change the same VM."},
    {"u": "add", "q": "A fourth node joined. Do you add the NAS storage on it again?", "o": ["yes, pvesm add on every node", "yes, after a reboot", "no, cluster storage arrives by itself", "no, nodes 4 and up have no storage"], "a": 2, "why": "Storage is a cluster setting. A new member gets it when it joins."},
    {"u": "add", "q": "A cluster has 5 nodes. How many must see each other for quorum?", "o": ["2", "3", "4", "5"], "a": 1, "why": "More than half of 5 is 3. Two nodes can fail."},
    {"u": "bkb", "q": "Backup A sits close by, Backup B at another site. What is B for?", "o": ["everyday accidents", "faster restores", "when A or the whole site is lost", "testing new VMs"], "a": 2, "why": "A for speed, B for disasters."},
    {"u":"ready","q":"You sit at your laptop. What comes before any Proxmox command?","o":["pveversion","pvecm create west","ssh root@192.168.0.201","qm list"],"a":2,"why":"Proxmox commands only exist on the servers. Log in to one first."},
    {"u":"ready","q":"Which command tells you which server you are on?","o":["whoami","hostname","pwd","pvecm nodes"],"a":1,"why":"`hostname` prints the server's name. `whoami` only says you are root."},
    {"u":"ready","q":"Why check the server name before a cluster command?","o":["the command acts on the server you type it on","names are case sensitive","the cluster needs it as a password","it makes the command faster"],"a":0,"why":"The right command on the wrong server is the classic mistake."},
    {"u":"ready","q":"pve1 cannot ping pve2. Can they form a cluster?","o":["yes, the cluster finds another way","only with HA on","no, fix the network first","only with shared storage"],"a":2,"why":"Nodes that cannot reach each other can never form a cluster. Test the network before you blame Proxmox."},
    {"u":"create","q":"Cluster west was created on pve1. Do you also run pvecm create west on pve2?","o":["yes, every node needs it","no, pve2 joins with pvecm add","yes, with another name","only if pve2 runs VMs"],"a":1,"why":"A second create makes a second, separate cluster. The other nodes join the first one."},
    {"u":"create","q":"A brand-new cluster has one node. Is it quorate?","o":["no, it needs at least two","only after a reboot","only with HA on","yes, one vote of one"],"a":3,"why":"One vote out of one is a majority, so pvecm status shows Quorate: Yes."},
    {"u":"create","q":"You ran pvecm create west. How do you prove it worked?","o":["pvecm status, and read the Quorate line","reboot pve1","qm list","ping 192.168.0.201"],"a":0,"why":"Never assume a change worked. The status shows the cluster, its votes and Quorate: Yes."},
    {"u":"join","q":"You type pvecm add on pve1, which is already a member. What happens?","o":["pve1 joins a second time","pve2 joins instead","the cluster is reset","it is refused"],"a":3,"why":"A node that is already in a cluster cannot join one. The join is typed on the new node."},
    {"u":"join","q":"pvecm add asks you to confirm the fingerprint of the member. What do you type?","o":["yes","the root password again","the cluster name","nothing, press Enter"],"a":0,"why":"It asks \"Are you sure you want to continue connecting (yes/no)?\" and wants the word yes."},
    {"u":"join","q":"pve2 and pve3 joined pve1. How many members, and how many may fail?","o":["2 members, none may fail","3 members, 1 may fail","3 members, 2 may fail","3 members, none may fail"],"a":1,"why":"Three votes, and two of three is still a majority."},
    {"u":"join","q":"After the join, you compare the issuer of two nodes' pve-ssl.pem. What do you see?","o":["each node signed its own","a public web authority","the same cluster authority","no issuer at all"],"a":2,"why":"Each node has its own certificate, all signed by one cluster authority. That is how the nodes trust each other."},
    {"u":"bka","q":"Why not keep the backup on the server the VM runs on?","o":["if that server dies, the backup dies with it","it is slower","Proxmox forbids it","backups need a VM to be stopped"],"a":0,"why":"A backup must live somewhere other than the thing it protects."},
    {"u":"bka","q":"nas-west only allows VM disks (content images). Can vzdump write a backup to it?","o":["yes, any storage works","only in stop mode","no, the storage must allow content backup","only with compression"],"a":2,"why":"Storage only holds what its content list allows. Backups need `--content backup`."},
    {"u":"bka","q":"VM 101 runs under HA. Why does it still need a backup?","o":["HA is already a backup","HA cannot bring back a deleted or broken VM","backups make HA faster","HA needs a backup to start"],"a":1,"why":"HA would faithfully restart the broken VM. Only a backup brings the old one back."},
    {"u":"bka","q":"vzdump says the job is finished. What do you do before calling it done?","o":["nothing, it said finished","qm start 101","reboot the NAS","pvesm list backup-a, and see the file"],"a":3,"why":"A backup you have not seen is a hope, not a backup."},
    {"u":"ready","q":"Which command shows every storage with its type, whether it is active, and how full it is?","o":["pvesm list","pvesm status","qm list","df -h /etc/pve"],"a":1,"why":"pvesm status gives one line per storage: name, type, status, total, used, available."},
    {"u":"join","q":"On a cluster member, what does ls /etc/pve/nodes show?","o":["one folder per node in the cluster","the VMs of this node only","the NAS shares","the log files of corosync"],"a":0,"why":"/etc/pve is shared by the whole cluster, so every member sees a folder for every node."},
    {"u":"create","q":"Why is /etc/pve not an ordinary folder?","o":["it lives on the NAS","it only exists on the first node","it is the cluster file system, the same on every node","it is wiped at every reboot"],"a":2,"why":"pmxcfs keeps /etc/pve in sync across all nodes. A change on one shows up on all."},
    {"u":"join","q":"Which command shows who issued a certificate file?","o":["cat <file> | grep issuer","pvecm status --cert","openssl x509 -in <file> -noout -issuer","ssh-keygen -l -f <file>"],"a":2,"why":"openssl x509 reads the certificate; -noout skips the encoded blob, -issuer prints who signed it."},
    {"u":"ready","q":"What does qm stop 101 do to a running VM?","o":["asks the guest to shut down nicely","pauses it in memory","moves it to another node","ends it at once, like pulling the power plug"],"a":3,"why":"qm stop kills the VM process. qm shutdown is the polite one that asks the guest OS."},
    {"u":"move","q":"VM 101 is running. You type qm migrate 101 pve2 without --online. What happens?","o":["it is refused: a running VM needs --online","it migrates offline after a stop","it migrates live anyway","it copies the VM and leaves both running"],"a":0,"why":"Proxmox answers: can't migrate running VM without --online."},
    {"u":"add","q":"Where does the corosync configuration of a cluster live?","o":["/etc/corosync/local.conf on node 1 only","/etc/pve/corosync.conf, shared by every node","/var/lib/pve/cluster.db on the NAS","in the web interface only"],"a":1,"why":"It sits in /etc/pve, so every member reads the same file. Not in a cluster yet: the file does not exist."}
]
});

    {"u":"l1-hyper","q":"A hypervisor that is itself the operating system of the server is which type?","o":["Type 2, hosted","Type 1, bare metal","Type 3, clustered","a container runtime"],"a":1,"why":"Type 1 runs straight on the hardware: ESXi, Hyper-V, Proxmox. Type 2 is an app on a normal OS."},
    {"u":"l1-hyper","q":"A VM has 4 vCPUs. What does it really own?","o":["4 physical cores","4 cores on each host","nothing fixed, it gets turns on the cores","half of the host"],"a":2,"why":"vCPUs are promises. The hypervisor hands out turns, which is why a host can promise more vCPUs than it has cores."},
    {"u":"l1-hyper","q":"A VM is slow and its CPU ready is high. What is often the wrong fix?","o":["right-size it","check what else runs on the host","move it to a quieter host","add more vCPUs"],"a":3,"why":"A VM with more vCPUs waits longer, because it needs that many cores free at once."},
