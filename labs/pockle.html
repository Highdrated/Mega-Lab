<!DOCTYPE html>
<html lang="en" data-theme="orbital">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8eaee">
<title>Pockle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a26'/%3E%3Crect x='9' y='7' width='14' height='18' rx='3' fill='none' stroke='%23e2b85c' stroke-width='2.2'/%3E%3Cpath d='M13 12h6M13 16h6M13 20h3' stroke='%23e2b85c' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root, :root[data-theme="orbital"] {
  --bg: #e8eaee; --panel: #f7f7f4; --panel2: #eef0f2; --line: #d4d7dd; --text: #19202c; --muted: #5f6775;
  --accent: #c99a3b; --accent-ink: #19202c; --good: #3d7a52; --bad: #b4473b; --warn: #a87414;
  --term-bg: #141a26; --term-text: #ece6d2; --term-muted: #8b93a3; --term-accent: #e2b85c;
  --k-str: #9fcf9a; --k-num: #e9a17c; --k-com: #7f8899;
}
:root[data-theme="verdant"] {
  --bg: #0e1712; --panel: #142019; --panel2: #1a281f; --line: #273b2e; --text: #e3e8df; --muted: #8ea091;
  --accent: #e0a23a; --accent-ink: #1a1206; --good: #86c27f; --bad: #e57a5f; --warn: #e0a23a;
  --term-bg: #09100c; --term-text: #f0e6cc; --term-muted: #7f907f; --term-accent: #e0a23a;
  --k-str: #a6d49d; --k-num: #f0a688; --k-com: #6c7d6f;
}
:root[data-theme="graphite"] {
  --bg: #111214; --panel: #18191c; --panel2: #1e2024; --line: #2a2c31; --text: #e7e8ea; --muted: #8b8f97;
  --accent: #d8dce3; --accent-ink: #111214; --good: #7fc29b; --bad: #e0796b; --warn: #d6b46a;
  --term-bg: #0b0c0e; --term-text: #e7e8ea; --term-muted: #7a7e86; --term-accent: #c9ced6;
  --k-str: #a8d4b4; --k-num: #e2b48a; --k-com: #646872;
}
:root {
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; transition: background .25s, color .25s; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; gap: 8px; height: 38px; }
.logo { font-family: var(--serif); font-size: 21px; white-space: nowrap; }
.logo i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .14em; text-transform: uppercase; margin-left: 6px; vertical-align: 3px; }
.top .spacer { flex: 1; }
.chipbtn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.rail { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin: 6px 0 14px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.rail b { color: var(--text); font-weight: 600; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.screen { display: none; flex: 1; flex-direction: column; min-width: 0; }
.screen.on { display: flex; }
.sect { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.welcome { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--muted); margin-bottom: 10px; }
.welcome b { color: var(--text); }
.junie { width: 64px; height: 64px; object-fit: contain; }
.nextup { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; text-align: left; width: 100%; background: var(--term-bg); color: var(--term-text); border: 0; border-radius: 14px; padding: 14px 16px; min-height: 78px; }
.nextup small { display: block; font-family: var(--mono); font-size: 11px; color: var(--term-muted); letter-spacing: .1em; text-transform: uppercase; }
.nextup strong { display: block; font-family: var(--serif); font-size: 20px; font-weight: 500; margin-top: 3px; }
.nextup .go { font-family: var(--mono); color: var(--term-accent); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.nextup:disabled { opacity: .5; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.qbtn { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; min-height: 74px; display: flex; flex-direction: column; justify-content: space-between; }
.qbtn strong { font-family: var(--serif); font-size: 17px; font-weight: 500; }
.qbtn small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.qbtn:disabled { opacity: .45; }
.labs { display: grid; gap: 6px; }
.lab { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 6px 10px 6px 12px; min-height: 50px; }
.lab .tog { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: none; padding: 0; display: grid; place-items: center; }
.lab .tog svg { width: 16px; height: 16px; stroke: var(--accent-ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.lab.in .tog { background: var(--accent); border-color: var(--accent); }
.lab.in .tog svg { opacity: 1; }
.lab .nm { min-width: 0; }
.lab strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 16px; }
.lab small { display: block; color: var(--muted); font-size: 12px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab .meter { height: 2px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.lab .meter i { display: block; height: 100%; background: var(--good); }
.lab .solo { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 7px 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lab.locked { opacity: .45; }
.lab.locked .tog { visibility: hidden; }
.links { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.links a, .links button, .links label { text-align: center; text-decoration: none; padding: 10px 6px; font-size: 13px; color: var(--text); border-radius: 10px; border: 1px solid var(--line); background: none; cursor: pointer; }
.links input { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--term-bg); color: var(--term-text); font-size: 13px; padding: 9px 14px; border-radius: 10px; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.drillhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 28px; }
.drillhead .quit { justify-self: start; border: 0; background: none; color: var(--muted); padding: 4px 0; font-family: var(--mono); font-size: 12px; }
.drillhead .score { justify-self: end; }
.drillhead .score b { color: var(--text); }
.dots { display: flex; gap: 4px; margin: 6px 0 2px; }
.dots i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.dots i.good { background: var(--good); }
.dots i.bad { background: var(--bad); }
.dots i.on { background: var(--accent); }
.timer { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 6px 0 2px; }
.timer i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 1s linear; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 8px; min-width: 0; }
.ticket { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); padding-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.ticket span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket .lt { color: var(--accent); }
.ask { font-family: var(--serif); font-size: 18px; line-height: 1.35; margin-bottom: 4px; }
.ask code { font-family: var(--mono); font-size: .85em; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
.code { background: var(--term-bg); color: var(--term-text); border-radius: 10px; padding: 11px 13px; font-family: var(--mono); font-size: 13.5px; line-height: 1.55; overflow-x: auto; white-space: pre; margin: 8px 0 0; -webkit-overflow-scrolling: touch; }
.code .st { color: var(--k-str); }
.code .nu { color: var(--k-num); }
.code .cm { color: var(--k-com); font-style: italic; }
.code .bl { display: inline-block; min-width: 2.2em; border-bottom: 2px solid var(--term-accent); color: var(--term-accent); text-align: center; }
.choices { display: grid; gap: 8px; margin-top: 12px; }
.choice { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; font-family: var(--mono); font-size: 14px; white-space: pre-wrap; word-break: break-word; min-height: 50px; line-height: 1.4; }
.choice.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
.choice.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.choice:disabled { color: inherit; opacity: 1; }
.fb { margin-top: 12px; font-size: 14px; line-height: 1.55; display: none; border-top: 1px solid var(--line); padding-top: 10px; }
.fb.on { display: block; }
.fbrow { display: grid; grid-template-columns: 1fr 60px; gap: 8px; align-items: start; }
.fbrow img { width: 60px; height: 60px; object-fit: contain; }
.verdict { font-weight: 700; display: block; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.fb code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: .93em; }
.fb a { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.next { margin-top: auto; height: 54px; border-radius: 11px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; display: none; }
.next.on { display: block; }
.spacer16 { height: 14px; }
.btn { height: 50px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.result { text-align: center; padding-top: 10px; }
.result img { width: 110px; height: 110px; object-fit: contain; }
.result .num { font-family: var(--serif); font-size: 60px; line-height: 1.1; }
.result .lbl { color: var(--muted); font-size: 13px; }
.result .line { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result .line div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; }
.result .line b { display: block; font-family: var(--mono); font-size: 19px; }
.result .line span { font-size: 11px; color: var(--muted); }
.result .msg { margin-top: 14px; font-weight: 600; min-height: 1.4em; }
.result .msg.good { color: var(--good); }
.result .msg.bad { color: var(--warn); }
.result .actions { margin-top: 18px; display: grid; gap: 8px; }
.misses { margin-top: 14px; text-align: left; font-size: 13px; }
.misses .m { padding: 9px 0; border-bottom: 1px solid var(--line); line-height: 1.45; }
.misses .m .code { font-size: 12px; margin-top: 4px; }
.misses .m b { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; display: block; }
.misses .m .ans { font-family: var(--mono); color: var(--good); }
.reveal { width: 100%; min-height: 64px; margin-top: 12px; border: 1px dashed var(--accent); border-radius: 11px; background: color-mix(in srgb, var(--accent) 7%, var(--panel)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.reveal b { font-family: var(--serif); font-weight: 500; font-size: 16px; }
.reveal span { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hide { display: none !important; }
.chipbtn.on { border-color: var(--accent); color: var(--text); }
.lab small b { font-weight: 600; }
.lab small b.fluent { color: var(--good); }
.lab small b.slow { color: var(--warn); }
.lab small b.shaky { color: var(--bad); }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.empty img { width: 96px; height: 96px; object-fit: contain; }
</style>
</head>

<script>
(function () {
  const BACKUP = "megasync-backup";
  const SKIP = new Set([BACKUP]);
  const QR_SRC = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";

  const ls = {
    keys() { const out = []; try { for (let i = 0; i < localStorage.length; i++) out.push(localStorage.key(i)); } catch (e) {} return out; },
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };

  const b64u = {
    enc(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); },
    dec(str) { const s = atob(str.replace(/-/g, "+").replace(/_/g, "/")); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },
  };

  async function squeeze(text, mode) {
    const stream = new Blob([text]).stream().pipeThrough(mode === "in" ? new DecompressionStream("deflate-raw") : new CompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function pack() {
    const data = {};
    ls.keys().forEach((k) => { if (!SKIP.has(k)) data[k] = ls.get(k); });
    const bytes = await squeeze(JSON.stringify({ v: 1, at: Date.now(), data }), "out");
    return { code: b64u.enc(bytes), count: Object.keys(data).length };
  }

  async function unpack(code) {
    const bytes = await squeeze(b64u.dec(code), "in");
    const p = JSON.parse(new TextDecoder().decode(bytes));
    if (!p || p.v !== 1 || typeof p.data !== "object") throw new Error("not a Mega Lab sync code");
    return p;
  }

  function merge(a, b) {
    if (Array.isArray(a) && Array.isArray(b)) {
      if (a.every((x) => typeof x !== "object") && b.every((x) => typeof x !== "object")) return Array.from(new Set(a.concat(b)));
      return b.length >= a.length ? b : a;
    }
    if (a && b && typeof a === "object" && typeof b === "object") {
      const out = Object.assign({}, a);
      for (const k of Object.keys(b)) out[k] = k in a ? merge(a[k], b[k]) : b[k];
      return out;
    }
    if (typeof a === "number" && typeof b === "number") return Math.max(a, b);
    if (typeof a === "boolean" && typeof b === "boolean") return a || b;
    return b === undefined || b === null ? a : b;
  }

  function mergeValue(oldRaw, newRaw) {
    if (oldRaw == null) return newRaw;
    let o, n;
    try { o = JSON.parse(oldRaw); n = JSON.parse(newRaw); } catch (e) { return newRaw; }
    if (o && n && typeof o === "object" && typeof n === "object") return JSON.stringify(merge(o, n));
    if (typeof o === "number" && typeof n === "number") return JSON.stringify(Math.max(o, n));
    return newRaw;
  }

  function apply(p) {
    const backup = {};
    let changed = 0;
    for (const [k, v] of Object.entries(p.data)) {
      if (SKIP.has(k) || typeof v !== "string") continue;
      const old = ls.get(k);
      const next = mergeValue(old, v);
      if (next !== old) { backup[k] = old; ls.set(k, next); changed++; }
    }
    ls.set(BACKUP, JSON.stringify({ at: Date.now(), data: backup }));
    return changed;
  }

  function undo() {
    let b; try { b = JSON.parse(ls.get(BACKUP)); } catch (e) { b = null; }
    if (!b || !b.data) return 0;
    let n = 0;
    for (const [k, v] of Object.entries(b.data)) { if (v === null) { try { localStorage.removeItem(k); } catch (e) {} } else ls.set(k, v); n++; }
    try { localStorage.removeItem(BACKUP); } catch (e) {}
    return n;
  }

  function loadQr() {
    if (window.qrcode) return Promise.resolve(window.qrcode);
    return new Promise((res, rej) => { const s = document.createElement("script"); s.src = QR_SRC; s.onload = () => res(window.qrcode); s.onerror = rej; document.head.appendChild(s); });
  }

  const CSS = `.msync{position:fixed;inset:0;z-index:9999;background:rgba(8,10,14,.6);display:flex;align-items:flex-end;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (min-width:700px){.msync{align-items:center}.msync .sh{border-radius:16px}}
.msync .sh{width:100%;max-width:440px;background:#17191d;color:#e9eaec;border:1px solid #2b2e34;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 20px 60px rgba(0,0,0,.45)}
.msync h3{margin:0 0 4px;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:500;font-size:21px;color:#f2f2f3}
.msync p{margin:0 0 12px;font-size:13px;line-height:1.55;color:#a3a7ae}
.msync .qr{display:flex;justify-content:center;margin:8px 0 14px}
.msync .qr svg{width:220px;height:220px;background:#fff;padding:12px;border-radius:12px}
.msync .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.msync .row.one{grid-template-columns:1fr}
.msync button{height:48px;border-radius:11px;border:1px solid #33363d;background:#202328;color:#e9eaec;font:inherit;font-weight:600;cursor:pointer}
.msync button.main{background:#d8b25e;border-color:#d8b25e;color:#17191d}
.msync .meta{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#d8b25e;margin-bottom:10px}`;

  function sheet(html) {
    if (!document.getElementById("msync-css")) { const st = document.createElement("style"); st.id = "msync-css"; st.textContent = CSS; document.head.appendChild(st); }
    const el = document.createElement("div");
    el.className = "msync";
    el.innerHTML = `<div class="sh">${html}</div>`;
    el.addEventListener("click", (e) => { if (e.target === el) el.remove(); });
    document.body.appendChild(el);
    return el;
  }

  function target() {
    const u = new URL(location.href);
    const base = u.pathname.replace(/[^/]*$/, "");
    const path = /\/labs\/$/.test(base) ? base + "pockle.html" : base + "labs/pockle.html";
    return u.origin + path;
  }

  async function send() {
    const { code, count } = await pack();
    const url = target() + "#sync=" + code;
    const kb = Math.round(url.length / 1024);
    const el = sheet(`<h3>Send progress</h3><div class="meta">${count} saves · ${kb} kB link</div>
      <p>Scan this with your other device, or share the link to yourself. It opens Pockle and merges your progress in, keeping the best of both.</p>
      <div class="qr" id="msyncQr"></div>
      <div class="row${navigator.share ? "" : " one"}"><button id="msyncCopy"${navigator.share ? "" : ' class="main"'}>Copy link</button>${navigator.share ? '<button class="main" id="msyncShare">Share</button>' : ""}</div>
      <div class="row one"><button id="msyncClose">Close</button></div>`);
    el.querySelector("#msyncClose").onclick = () => el.remove();
    el.querySelector("#msyncCopy").onclick = async () => { try { await navigator.clipboard.writeText(url); el.querySelector("#msyncCopy").textContent = "Copied"; } catch (e) { prompt("Copy this link", url); } };
    const sh = el.querySelector("#msyncShare");
    if (sh) sh.onclick = () => navigator.share({ title: "Mega Lab progress", url }).catch(() => {});
    const box = el.querySelector("#msyncQr");
    if (url.length > 2900) { box.innerHTML = `<p style="text-align:center">Too much progress for a QR code. Use Share or Copy link.</p>`; return; }
    try {
      const qrcode = await loadQr();
      const q = qrcode(0, "L"); q.addData(url, "Byte"); q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch (e) { box.innerHTML = `<p style="text-align:center">QR code needs internet. Use Share or Copy link.</p>`; }
  }

  async function receive(onDone) {
    const m = location.hash.match(/[#&]sync=([A-Za-z0-9_-]+)/);
    if (!m) return;
    history.replaceState(null, "", location.pathname + location.search);
    let p;
    try { p = await unpack(m[1]); } catch (e) { sheet(`<h3>Sync link broken</h3><p>${String(e.message || e)}. Make a new link on the other device.</p><div class="row one"><button class="main" onclick="this.closest('.msync').remove()">OK</button></div>`); return; }
    const when = new Date(p.at).toLocaleString();
    const el = sheet(`<h3>Load progress?</h3><div class="meta">${Object.keys(p.data).length} saves · made ${when}</div>
      <p>This merges the progress from your other device into this one. Finished lessons, xp and streaks keep the best of both. You can undo it straight after.</p>
      <div class="row"><button id="msyncNo">Not now</button><button class="main" id="msyncYes">Load it</button></div>`);
    el.querySelector("#msyncNo").onclick = () => el.remove();
    el.querySelector("#msyncYes").onclick = () => {
      const n = apply(p);
      el.innerHTML = `<div class="sh"><h3>Synced</h3><p>${n} lab saves updated on this device.</p><div class="row"><button id="msyncUndo">Undo</button><button class="main" id="msyncOk">Done</button></div></div>`;
      el.querySelector("#msyncOk").onclick = () => { el.remove(); onDone && onDone(n); };
      el.querySelector("#msyncUndo").onclick = () => { undo(); el.remove(); onDone && onDone(0); };
    };
  }

  function listen(onDone) { receive(onDone); window.addEventListener("hashchange", () => receive(onDone)); }

  window.MegaSync = { send, receive, listen, pack, unpack, apply, undo, merge };
})();

<script>
POCKET.register(Object.assign({"id": "poshle-pocket", "name": "Poshle Pocket", "topic": "PowerShell", "href": "poshle-pocket.html", "keys": ["poshle-pocket-v1"], "units": [{"id": "cmdlets", "title": "Cmdlets and help"}, {"id": "vars", "title": "Variables and text"}, {"id": "operators", "title": "Comparing and maths"}, {"id": "collections", "title": "Arrays and objects"}, {"id": "pipeline", "title": "The pipeline"}, {"id": "where", "title": "Filtering with Where"}, {"id": "shape", "title": "Select, sort, count"}, {"id": "output", "title": "Output and CSV"}, {"id": "ifs", "title": "Making decisions"}, {"id": "loops", "title": "Loops"}, {"id": "functions", "title": "Functions"}, {"id": "errors", "title": "Handling errors"}, {"id": "scripts", "title": "Script files"}, {"id": "exo", "title": "Exchange Online"}, {"id": "mailbox", "title": "Changing mailboxes"}, {"id": "groups", "title": "Distribution groups"}, {"id": "graph", "title": "Microsoft Graph"}, {"id": "offboard", "title": "Safe offboarding"}], "sample": {"poshle-pocket-v1": "{\"passed\": {\"cmdlets\": true}}"}, "sampleDone": ["cmdlets"], "cards": [{"u": "cmdlets", "q": "What does it show?", "code": "(Get-Command New-Item).Noun", "o": ["Item", "New", "New-Item"], "a": 0, "why": "The noun is the part after the dash."}, {"u": "cmdlets", "q": "What does it show?", "code": "(Get-Command Set-Location).Verb", "o": ["Location", "Set-Location", "Set"], "a": 2, "why": "The verb is the part before the dash."}, {"u": "cmdlets", "q": "What does it show?", "code": "Get-Proces", "o": ["(nothing shown)", "a list of processes", "Error: term not recognized"], "a": 2, "why": "One letter missing means PowerShell can't find the command."}, {"u": "cmdlets", "q": "What does it show?", "code": "Delete-Item C:\\temp\\a.txt", "o": ["(nothing shown)", "Error: access denied", "Error: term not recognized"], "a": 2, "why": "Delete is not a PowerShell verb. The real cmdlet is Remove-Item."}, {"u": "cmdlets", "q": "What does it show?", "code": "(Get-Alias gm).Definition", "o": ["Get-Module", "Get-Mailbox", "Get-Member"], "a": 2, "why": "`gm` is short for Get-Member."}, {"u": "cmdlets", "q": "What does it show?", "code": "(Get-Date).GetType().Name", "o": ["Date", "Get-Date", "DateTime"], "a": 2, "why": "Get-Date returns a DateTime object, not text."}, {"u": "cmdlets", "q": "What does it show?", "code": "(5).GetType().Name", "o": ["Int32", "Number", "5"], "a": 0, "why": "Whole numbers are Int32 objects."}, {"u": "cmdlets", "q": "What does it show?", "code": "'hi'.ToUpper()", "o": ["ToUpper", "HI", "hi"], "a": 1, "why": "`ToUpper()` is a method: an action that returns new text."}, {"u": "cmdlets", "q": "Which lists every cmdlet with User in its noun?", "o": ["Get-Member -Noun User", "Get-Command -Noun *User*", "Get-Help User", "Get-Command User"], "a": 1, "why": "Get-Command searches cmdlets; `*` matches any text around User."}, {"u": "cmdlets", "q": "Which shows only ready-made examples for Set-Mailbox?", "o": ["Get-Help Set-Mailbox -Full", "Get-Command Set-Mailbox -Examples", "Set-Mailbox -Help", "Get-Help Set-Mailbox -Examples"], "a": 3, "why": "`-Examples` belongs to Get-Help and shows just the examples."}, {"u": "cmdlets", "q": "Which is a real cmdlet that deletes a Graph user?", "o": ["Delete-MgUser", "Erase-MgUser", "Kill-MgUser", "Remove-MgUser"], "a": 3, "why": "Remove is the approved verb for deleting."}, {"u": "cmdlets", "q": "Which shows the properties and methods of what Get-Mailbox returns?", "o": ["Get-Mailbox | Get-Help", "Get-Mailbox | Get-Member", "Get-Help Get-Mailbox", "Get-Member Get-Mailbox"], "a": 1, "why": "Pipe the real objects into Get-Member to look inside them."}, {"u": "cmdlets", "q": "Which cmdlet puts Ada into the Sales distribution group?", "o": ["Get-DistributionGroupMember", "Add-DistributionGroupMember", "New-DistributionGroupMember"], "a": 1, "why": "Add puts something into a container that already exists."}, {"u": "cmdlets", "q": "Fill the gap. Goal: Lists only cmdlets that start with Get", "code": "Get-Command -___ Get", "o": ["Verb", "Noun", "Help"], "a": 0, "why": "Get is a verb, so search with `-Verb`."}, {"u": "cmdlets", "q": "Fill the gap. Goal: Shows only usage examples", "code": "Get-Help Get-Date ___", "o": ["-Examples", "-Full", "-Online"], "a": 0, "why": "`-Full` shows everything, `-Online` opens a web page."}, {"u": "cmdlets", "q": "Fill the gap. Goal: Changes a setting on Ada's mailbox", "code": "___-Mailbox -Identity ada@contoso.com -HiddenFromAddressListsEnabled $true", "o": ["Get", "Set", "New", "Add"], "a": 1, "why": "Set changes something that already exists."}, {"u": "vars", "q": "What does it show?", "code": "$n = 'Bram'\n'Hello $n'", "o": ["Hello Bram", "Hello 'Bram'", "Hello $n"], "a": 2, "why": "Single quotes never swap variables."}, {"u": "vars", "q": "What does it show?", "code": "$n = 'Bram'\n\"$n.Length\"", "o": ["Bram4", "Bram.Length", "4"], "a": 1, "why": "Only `$n` is swapped; `.Length` stays as text."}, {"u": "vars", "q": "What does it show?", "code": "$n = 'Lien'\n\"Chars: $($n.Length)\"", "o": ["Chars: 4", "Chars: Lien.Length", "Chars: $($n.Length)"], "a": 0, "why": "`$( )` runs `$n.Length` first."}, {"u": "vars", "q": "What does it show?", "code": "5 + '5'", "o": ["55", "Error: cannot add", "10"], "a": 2, "why": "Left side is a number, so '5' becomes the number 5."}, {"u": "vars", "q": "What does it show?", "code": "$n = 'noor'\n$n.ToUpper()\n$n", "o": ["NOOR\nnoor", "NOOR\nNOOR", "noor\nnoor"], "a": 0, "why": "ToUpper() returns new text; `$n` itself is unchanged."}, {"u": "vars", "q": "What does it show?", "code": "$x = $null\n$x", "o": ["$null", "0", "(nothing shown)"], "a": 2, "why": "$null prints nothing at all."}, {"u": "vars", "q": "What does it show?", "code": "$a = 'Sales'\n$A", "o": ["Sales", "(nothing shown)", "Error: variable not found"], "a": 0, "why": "Variable names ignore case."}, {"u": "vars", "q": "What does it show?", "code": "$d = 'contoso.com'\n\"ada@$d\"", "o": ["ada@contoso.com", "ada@$d", "ada@"], "a": 0, "why": "Double quotes swap `$d` for its value."}, {"u": "vars", "q": "What does it show?", "code": "$t = 'Hi'\n$t.Length + 1", "o": ["21", "3", "Hi1"], "a": 1, "why": "`.Length` is the number 2, plus 1 is 3."}, {"u": "vars", "q": "$n is 'Ada'. Which shows: Welcome, Ada!", "o": ["\"Welcome, $n!\"", "'Welcome, $n!'", "\"Welcome, \" + n + \"!\""], "a": 0, "why": "Double quotes swap `$n`; without `$` it's not a variable."}, {"u": "vars", "q": "Which shows the length of $n inside text?", "o": ["'Len: $($n.Length)'", "\"Len: $($n.Length)\"", "\"Len: $n.Length\""], "a": 1, "why": "Properties inside a string need `$( )` and double quotes."}, {"u": "vars", "q": "Which gives the text in $mail in lowercase?", "o": ["$mail.Lower()", "$mail.ToLower()", "$mail.ToLower", "ToLower($mail)"], "a": 1, "why": "The method is ToLower and it needs `()`."}, {"u": "vars", "q": "Which empties the variable $x?", "o": ["$x = $null", "$x = 'null'", "$x = null"], "a": 0, "why": "'null' is the word null; bare null is an unknown command."}, {"u": "vars", "q": "Fill the gap. Goal: Shows Length: 4", "code": "$n = 'Lien'\n\"Length: ___\"", "o": ["$n.Length", "$($n.Length)", "$(n.Length)"], "a": 1, "why": "Only `$( )` runs the property inside text."}, {"u": "vars", "q": "Fill the gap. Goal: Shows bram@contoso.com", "code": "$m = 'BRAM@CONTOSO.COM'\n$m.___", "o": ["ToLower()", "ToLower", "Lower()", "ToUpper()"], "a": 0, "why": "Lowercase is ToLower, with `()` to run it."}, {"u": "operators", "q": "What does it show?", "code": "'Noor' -eq 'NOOR'", "o": ["Error: case mismatch", "True", "False"], "a": 1, "why": "-eq ignores case."}, {"u": "operators", "q": "What does it show?", "code": "'Noor' -ceq 'NOOR'", "o": ["False", "True", "NOOR"], "a": 0, "why": "-ceq checks case too."}, {"u": "operators", "q": "What does it show?", "code": "'Sales Team' -contains 'Sales'", "o": ["False", "True", "Sales"], "a": 0, "why": "-contains is for lists, not for text inside text."}, {"u": "operators", "q": "What does it show?", "code": "'Sales' -in 'sales','it'", "o": ["True", "False", "sales"], "a": 0, "why": "-in ignores case too."}, {"u": "operators", "q": "What does it show?", "code": "1,5,9 -gt 4", "o": ["9", "5\n9", "True"], "a": 1, "why": "A list on the left returns the items that pass."}, {"u": "operators", "q": "What does it show?", "code": "7 / 2", "o": ["4", "3.5", "3"], "a": 1, "why": "PowerShell does not cut off decimals."}, {"u": "operators", "q": "What does it show?", "code": "10 % 4", "o": ["2", "2.5", "4"], "a": 0, "why": "% gives the remainder: 10 = 4 + 4 + 2."}, {"u": "operators", "q": "What does it show?", "code": "[math]::Floor(9 / 2)", "o": ["5", "4", "4.5"], "a": 1, "why": "9/2 is 4.5, Floor rounds down."}, {"u": "operators", "q": "What does it show?", "code": "-not (3 -eq 3)", "o": ["3", "False", "True"], "a": 1, "why": "-not flips True into False."}, {"u": "operators", "q": "What does it show?", "code": "$x = 1,2,3\n$null -eq $x", "o": ["True", "False", "(nothing shown)"], "a": 1, "why": "$null on the left gives a clean True/False."}, {"u": "operators", "q": "What does it show?", "code": "2 + 3 * 4", "o": ["14", "20", "234"], "a": 0, "why": "* goes before +."}, {"u": "operators", "q": "What does it show?", "code": "'Helpdesk' -match 'desk$'", "o": ["False", "desk", "True"], "a": 2, "why": "`$` in regex means: ends with."}, {"u": "operators", "q": "Which tests if $dept is Sales, any case?", "o": ["$dept -eq 'Sales'", "$dept = 'Sales'", "$dept == 'Sales'", "$dept -ceq 'sales'"], "a": 0, "why": "`=` stores, `==` doesn't exist, -ceq checks case."}, {"u": "operators", "q": "Which is True for every address ending in @contoso.com?", "o": ["$m -eq '*@contoso.com'", "$m -like '*@contoso.com'", "$m -like '@contoso.com'", "$m -contains '@contoso.com'"], "a": 1, "why": "-like needs `*` for the part before."}, {"u": "operators", "q": "Which gives True or False for: is 'Ada' in the list $admins?", "o": ["$admins -contains 'Ada'", "$admins -in 'Ada'", "'Ada' -contains $admins", "$admins -like 'Ada'"], "a": 0, "why": "List -contains item. -like on a list returns items, not True/False."}, {"u": "operators", "q": "Which is the safe way to check that $u is empty?", "o": ["$null -eq $u", "$u -eq $null", "$u = $null", "$u -is null"], "a": 0, "why": "If $u is a list, `$u -eq $null` filters it instead of answering."}, {"u": "operators", "q": "Which gives 3 for 7 / 2, rounded down?", "o": ["7 % 2", "[int](7 / 2)", "[math]::Floor(7 / 2)", "7 / 2"], "a": 2, "why": "Floor always rounds down. [int] rounds 3.5 to 4."}, {"u": "operators", "q": "Fill the gap. Goal: Shows True", "code": "$d = 'Sales','Helpdesk'\n'Helpdesk' ___ $d", "o": ["-in", "-contains", "-like"], "a": 0, "why": "Item on the left, list on the right: -in."}, {"u": "operators", "q": "Fill the gap. Goal: Shows False", "code": "$n = 12\n$n -gt 10 ___ $n -gt 15", "o": ["-and", "-or", "-xor"], "a": 0, "why": "First is True, second False: only -and gives False."}, {"u": "collections", "q": "What does it show?", "code": "$u = 'Ada','Bram','Lien'\n$u[1]", "o": ["Bram", "Ada", "Lien"], "a": 0, "why": "Counting starts at 0."}, {"u": "collections", "q": "What does it show?", "code": "$u = 'Ada','Bram','Lien'\n$u[-1]", "o": ["Ada", "(nothing shown)", "Lien"], "a": 2, "why": "[-1] is the last item."}, {"u": "collections", "q": "What does it show?", "code": "$a = @()\n$a += 'Ada'\n$a += 'Noor'\n$a.Count", "o": ["2", "1", "0"], "a": 0, "why": "Each += adds one item."}, {"u": "collections", "q": "What does it show?", "code": "$s = 'Ada'\n$s += 'Bram'\n$s", "o": ["Ada Bram", "AdaBram", "Ada\nBram"], "a": 1, "why": "$s was text, so += glues text."}, {"u": "collections", "q": "What does it show?", "code": "$n = 3..1\n$n", "o": ["3\n2\n1", "1\n2\n3", "3..1"], "a": 0, "why": "Ranges can count down."}, {"u": "collections", "q": "What does it show?", "code": "$h = @{Ada='Sales';Bram='IT'}\n$h.Count", "o": ["1", "2", "4"], "a": 1, "why": "Count is the number of keys."}, {"u": "collections", "q": "What does it show?", "code": "$h = @{Ada='Sales'}\n$h.Lien", "o": ["(nothing shown)", "Error: key not found", "Lien"], "a": 0, "why": "A missing key just gives nothing."}, {"u": "collections", "q": "What does it show?", "code": "$o = [PSCustomObject]@{N='Ada'}\n$o.Dept = 'IT'", "o": ["(nothing shown)", "IT", "Error: property 'Dept' not found"], "a": 2, "why": "You can't add a property to a PSCustomObject with `=`. Include it when you create it."}, {"u": "collections", "q": "What does it show?", "code": "$u = 'Ada'\n$u.Count", "o": ["3", "Error: not an array", "1"], "a": 2, "why": "A single value counts as 1."}, {"u": "collections", "q": "What does it show?", "code": "$u = 'Ada','Bram'\n\"First: $u[0]\"", "o": ["First: A", "First: Ada Bram[0]", "First: Ada"], "a": 1, "why": "Only `$u` is swapped. Use \"$($u[0])\"."}, {"u": "collections", "q": "What does it show?", "code": "$n = 10,20,30\n$n[0] + $n[-1]", "o": ["10\n30", "1030", "40"], "a": 2, "why": "10 + 30 = 40."}, {"u": "collections", "q": "What does it show?", "code": "$o = [PSCustomObject]@{N='Ada'}\n\"Hi $($o.N)\"", "o": ["Hi N", "Hi Ada", "Hi @{N=Ada}.N"], "a": 1, "why": "`$( )` reads the property first."}, {"u": "collections", "q": "Which makes an empty list to fill later?", "o": ["$u = @()", "$u = @{}", "$u = ()", "$u = $null[]"], "a": 0, "why": "@() is a list; @{} is a hashtable."}, {"u": "collections", "q": "Which reads the last item of $list?", "o": ["$list.Last", "$list[-1]", "$list[0]", "$list[$list.Count]"], "a": 1, "why": "[-1] counts from the end. [$list.Count] is one past the end."}, {"u": "collections", "q": "Which adds key Noor with value Helpdesk to $h?", "o": ["$h[Noor] = Helpdesk", "$h.Add(Noor)", "$h.Noor = 'Helpdesk'", "$h += 'Noor'"], "a": 2, "why": "Set a new key like a property; text needs quotes."}, {"u": "collections", "q": "Which makes one object you can read as $o.Name?", "o": ["$o = 'Name=Ada;Dept=Sales'", "$o = [PSCustomObject]@{Name='Ada';Dept='Sales'}", "$o = @('Ada','Sales')"], "a": 1, "why": "A list or a string has no Name property."}, {"u": "collections", "q": "Which gives the numbers 1 to 10?", "o": ["1..10", "1-10", "(1,10)", "range(1,10)"], "a": 0, "why": "`..` makes a range. 1-10 is just -9."}, {"u": "collections", "q": "Fill the gap. Goal: Shows IT", "code": "$o = [PSCustomObject]@{\n  Name='Bram'; Dept='IT'\n}\n$o.___", "o": ["Dept", "IT", "Name", "Department"], "a": 0, "why": "Read a property by its exact name."}, {"u": "pipeline", "q": "What does it show?", "code": "1..4 | ForEach-Object { $_ * 2 }", "o": ["1\n2\n3\n4", "2\n4\n6\n8", "8"], "a": 1, "why": "Each number is doubled."}, {"u": "pipeline", "q": "What does it show?", "code": "'Ada','Lien' | ForEach-Object {\n  $_.ToUpper()\n}", "o": ["ADA\nLIEN", "Ada\nLien", "ADALIEN"], "a": 0, "why": "One result per object, one per line."}, {"u": "pipeline", "q": "What does it show?", "code": "'Noor' | ForEach-Object {\n  \"Hi $_\"\n}", "o": ["Hi $_", "Hi", "Hi Noor"], "a": 2, "why": "Double quotes swap `$_` for Noor."}, {"u": "pipeline", "q": "What does it show?", "code": "$o = [PSCustomObject]@{N='Ada'}\n$s = $o | Select-Object N\n\"Hi $s\"", "o": ["Hi N", "Hi @{N=Ada}", "Hi Ada"], "a": 1, "why": "Select-Object keeps an object, not plain text."}, {"u": "pipeline", "q": "What does it show?", "code": "$o = [PSCustomObject]@{N='Ada'}\n$s = $o |\n  Select-Object -ExpandProperty N\n$s.Length", "o": ["1", "(nothing shown)", "3"], "a": 2, "why": "$s is the text Ada: 3 letters."}, {"u": "pipeline", "q": "What does it show?", "code": "'a','bb','ccc' |\n  ForEach-Object { $_.Length } |\n  ForEach-Object { $_ * 10 }", "o": ["10\n20\n30", "1\n2\n3", "60"], "a": 0, "why": "Lengths 1,2,3 flow on and are each times 10."}, {"u": "pipeline", "q": "What does it show?", "code": "'Ada','Bram' | ForEach-Object {\n  $_.Length\n} | Measure-Object -Sum |\n  ForEach-Object { $_.Sum }", "o": ["3\n4", "2", "7"], "a": 2, "why": "Lengths 3 and 4 flow into Measure-Object; its Sum is 7."}, {"u": "pipeline", "q": "What does it show?", "code": "1..3 | ForEach-Object { 'go' }", "o": ["go\ngo\ngo", "go", "1\n2\n3"], "a": 0, "why": "The block runs once per object, even if it ignores `$_`."}, {"u": "pipeline", "q": "What does it show?", "code": "(1..5 | ForEach-Object { $_ }).Count", "o": ["5", "1", "15"], "a": 0, "why": "Five objects in, five out."}, {"u": "pipeline", "q": "Which gives just the names as plain text?", "o": ["Get-Process | Select-Object Name", "Get-Process | Format-Table Name", "Get-Process | Get-Member Name", "Get-Process | Select-Object -ExpandProperty Name"], "a": 3, "why": "-ExpandProperty unwraps the value."}, {"u": "pipeline", "q": "Inside ForEach-Object, which means the current object?", "o": ["$_", "$item", "$this"], "a": 0, "why": "`$_` (or `$PSItem`) is the current object."}, {"u": "pipeline", "q": "Which line will produce a broken CSV?", "o": ["Get-Mailbox | Select-Object Name | Export-Csv m.csv", "Get-Mailbox | Export-Csv m.csv", "Get-Mailbox | Format-Table Name | Export-Csv m.csv"], "a": 2, "why": "Format-Table output is layout, not data."}, {"u": "pipeline", "q": "Which builds an email address for each name in $names?", "o": ["$names | ForEach-Object { \"$_@contoso.com\" }", "$names | ForEach-Object { '$_@contoso.com' }", "$names@contoso.com"], "a": 0, "why": "Double quotes swap `$_`; single quotes don't."}, {"u": "pipeline", "q": "Fill the gap. Goal: Gives plain address strings", "code": "Get-Mailbox |\n  Select-Object ___ PrimarySmtpAddress", "o": ["-ExpandProperty", "-Property", "-First"], "a": 0, "why": "-Property keeps objects; -ExpandProperty gives values."}, {"u": "where", "q": "What does it show?", "code": "1..10 | Where-Object { $_ % 5 -eq 0 }", "o": ["2", "0\n0", "5\n10"], "a": 2, "why": "Only 5 and 10 divide by 5."}, {"u": "where", "q": "What does it show?", "code": "'Sales','Helpdesk','IT' |\n  Where-Object { $_ -like 'h*' }", "o": ["(nothing shown)", "Sales\nHelpdesk", "Helpdesk"], "a": 2, "why": "-like ignores case; only Helpdesk starts with h."}, {"u": "where", "q": "What does it show?", "code": "'Ada','Bram','Lien' |\n  Where-Object Length -ne 4", "o": ["Bram\nLien", "Ada\nBram\nLien", "Ada"], "a": 2, "why": "Only Ada isn't 4 letters."}, {"u": "where", "q": "What does it show?", "code": "$n = 3,8,1 | Where-Object { $_ -gt 2 }\n$n.Count", "o": ["1", "2", "3"], "a": 1, "why": "3 and 8 pass."}, {"u": "where", "q": "What does it show?", "code": "'ada','Ada','ADA' |\n  Where-Object { $_ -ceq 'Ada' }", "o": ["ada\nAda\nADA", "(nothing shown)", "Ada"], "a": 2, "why": "-ceq checks case, so only exact Ada."}, {"u": "where", "q": "What does it show?", "code": "1..4 | Where-Object { $_ -gt 9 }", "o": ["0", "(nothing shown)", "False"], "a": 1, "why": "Nothing passes, nothing is shown."}, {"u": "where", "q": "What does it show?", "code": "$u = @(\n [pscustomobject]@{N='Ada';On=$true}\n [pscustomobject]@{N='Bram';On=$false}\n)\n($u | Where-Object On -eq $false).N", "o": ["Ada", "(nothing shown)", "Bram"], "a": 2, "why": "Only Bram has On = False."}, {"u": "where", "q": "What does it show?", "code": "$big = 1..20 |\n  Where-Object { $_ -gt 15 }\n$big.Count", "o": ["5", "15", "20"], "a": 0, "why": "16, 17, 18, 19, 20."}, {"u": "where", "q": "Which keeps only enabled users (short syntax)?", "o": ["Where-Object $_.Enabled = $true", "Where-Object -Enabled $true", "Where-Object Enabled -eq $true", "Where-Object { Enabled -eq $true }"], "a": 2, "why": "Short syntax: property, operator, value. No braces."}, {"u": "where", "q": "Which is fastest for disabled accounts in a big tenant?", "o": ["Get-MgUser -All | Where-Object AccountEnabled -eq $false", "Get-MgUser | Format-Table | Where-Object AccountEnabled -eq $false", "Get-MgUser -Filter 'accountEnabled eq false' -All"], "a": 2, "why": "-Filter lets Graph do the work and send only the matches."}, {"u": "where", "q": "Which keeps files bigger than 1 MB?", "o": ["Get-ChildItem -Filter Length -gt 1MB", "Get-ChildItem | Where-Object Length -gt 1MB", "G ich sets the Office to Gent for every user in users.csv (column UPN)?", "o": ["Import-Csv users.csv | ForEach-Object { Set-Mailbox -Identity $_.UPN -Office \"Gent\" }", "Import-Csv users.csv | ForEach-Object { Set-Mailbox -Identity $u.UPN -Office \"Gent\" }", "Import-Csv users.csv | Set-Mailbox -Identity UPN -Office \"Gent\""], "a": 0, "why": "Inside ForEach-Object the current row is $_. $u was never set."}, {"u": "loops", "q": "Fill the gap. Goal: Shows every user's Mail", "code": "foreach ($u ___ $users) {\n  $u.Mail\n}", "o": ["of", "-in", "in", "from"], "a": 2, "why": "The foreach statement always uses the word in."}, {"u": "loops", "q": "Fill the gap. Goal: Shows 1 2 4 5", "code": "foreach ($n in 1..5) {\n  if ($n -eq 3) { ___ }\n  $n\n}", "o": ["break", "continue", "skip"], "a": 1, "why": "continue skips only 3. break would stop after 2."}, {"u": "functions", "q": "What does it show?", "code": "function Get-Sq {\n  param([int]$N)\n  $N * $N\n}\nGet-Sq -N 4", "o": ["8", "16", "44"], "a": 1, "why": "4 times 4."}, {"u": "functions", "q": "What does it show?", "code": "function Get-Sq {\n  param([int]$N)\n  $N * $N\n}\nGet-Sq 3", "o": ["Error: -N missing", "3", "9"], "a": 2, "why": "3 fills the first parameter by position."}, {"u": "functions", "q": "What does it show?", "code": "function Get-A {\n  \"a\"\n  return\n  \"b\"\n}\nGet-A", "o": ["a", "a\nb", "b"], "a": 0, "why": "return leaves before \"b\" is reached."}, {"u": "functions", "q": "What does it show?", "code": "function Get-N {\n  param([int]$N)\n  $N\n}\nGet-N -N 2.7", "o": ["2.7", "2", "3"], "a": 2, "why": "[int] rounds 2.7 to the nearest whole number. An exact .5 goes to the even number: 2.5 becomes 2."}, {"u": "functions", "q": "What does it show?", "code": "function Get-Data {\n  $null = \"hidden\"\n  \"shown\"\n}\nGet-Data", "o": ["hidden\nshown", "shown", "(nothing shown)"], "a": 1, "why": "Assigning to $null throws the value away. Only \"shown\" is output."}, {"u": "functions", "q": "What does it show?", "code": "function Add-Two {\n  param($A, $B)\n  $A + $B\n}\nAdd-Two 2 3", "o": ["5", "23", "2\n3"], "a": 0, "why": "Two values, split by a space, fill $A and $B."}, {"u": "functions", "q": "What does it show?", "code": "function Show-Two {\n  param($A, $B)\n  \"A=$A B=$B\"\n}\nShow-Two(2, 3)", "o": ["A=2 B=3", "Error: missing B", "A=2 3 B="], "a": 2, "why": "(2, 3) is ONE array, so it all goes into $A and $B stays empty."}, {"u": "functions", "q": "What does it show?", "code": "function Get-Count {\n  param([string[]]$Names)\n  $Names.Count\n}\nGet-Count -Names Ada, Bram, Lien", "o": ["1", "3", "Ada"], "a": 1, "why": "[string[]] takes a list. Commas build a list of 3."}, {"u": "functions", "q": "What does it show?", "code": "function Set-X {\n  $x = 99\n}\n$x = 1\nSet-X\n$x", "o": ["99", "(nothing shown)", "1"], "a": 2, "why": "$x inside the function is its own copy. The outside $x stays 1."}, {"u": "functions", "q": "What does it show?", "code": "function Get-Hi {\n  param($Name = \"you\")\n  \"Hi $Name\"\n}\nGet-Hi -Name Noor", "o": ["Hi you", "Hi Noor", "Hi $Name"], "a": 1, "why": "A value you pass wins over the default."}, {"u": "functions", "q": "Which name follows the PowerShell Verb-Noun rule?", "o": ["GetUserReport", "get_user_report", "Get-UserReport", "User-Get"], "a": 2, "why": "Approved verb first (Get), dash, then a noun."}, {"u": "functions", "q": "How do you call Send-Report with Name Ada and Days 3?", "o": ["Send-Report(\"Ada\", 3)", "Send-Report -Name Ada -Days 3", "Send-Report -Name=Ada -Days=3", "Send-Report(-Name Ada -Days 3)"], "a": 1, "why": "pwsh commands take -Name value pairs, no brackets or commas."}, {"u": "functions", "q": "Which param line makes $Upn required?", "o": ["param([Mandatory][string]$Upn)", "param([Required][string]$Upn)", "param([string]$Upn = Mandatory)", "param([Parameter(Mandatory)][string]$Upn)"], "a": 3, "why": "Mandatory lives inside [Parameter(...)]."}, {"u": "functions", "q": "Which parameter works as an on/off flag like -Force?", "o": ["[switch]$Force", "[bool]$Force", "[flag]$Force", "[string]$Force"], "a": 0, "why": "A [switch] needs no value. A [bool] would demand -Force:$true."}, {"u": "functions", "q": "Which gives $Days a default of 30?", "o": ["param([int]$Days -eq 30)", "param([int]$Days = 30)", "param([int]$Days == 30)"], "a": 1, "why": "= sets the default value."}, {"u": "functions", "q": "Fill the gap. Goal: $Count always holds a whole number", "code": "param([___]$Count)", "o": ["string", "int", "switch"], "a": 1, "why": "[int] is a whole number."}, {"u": "functions", "q": "Fill the gap. Goal: Passes Ada to the Name parameter", "code": "Get-Report ___ Ada", "o": ["--Name", "/Name", "-Name", "Name="], "a": 2, "why": "Parameter names start with a single dash."}, {"u": "functions", "q": "Fill the gap. Goal: Shows all", "code": "function Get-X {\n  param([___]$Full)\n  if ($Full) { \"all\" } else { \"short\" }\n}\nGet-X -Full", "o": ["switch", "bool", "string"], "a": 0, "why": "Only [switch] can be used without a value."}, {"u": "errors", "q": "What does it show?", "code": "try {\n  throw \"x\"\n} catch {\n  \"caught\"\n}", "o": ["x", "caught", "x\ncaught"], "a": 1, "why": "throw is terminating, catch takes over."}, {"u": "errors", "q": "What does it show?", "code": "try {\n  \"a\"\n  throw \"b\"\n  \"c\"\n} catch { \"d\" }", "o": ["a\nd", "a\nc\nd", "d", "a\nb\nd"], "a": 0, "why": "\"a\" runs, then throw jumps to catch. \"c\" is skipped."}, {"u": "errors", "q": "What does it show?", "code": "try { \"ok\" }\ncatch { \"bad\" }\nfinally { \"end\" }", "o": ["ok", "ok\nbad\nend", "ok\nend"], "a": 2, "why": "No error, so catch is skipped, but finally always runs."}, {"u": "errors", "q": "What does it show?", "code": "try {\n  throw \"a\"\n} catch { \"b\" }\nfinally { \"c\" }", "o": ["b\nc", "a\nb\nc", "b"], "a": 0, "why": "catch handles it, then finally runs."}, {"u": "errors", "q": "What does it show?", "code": "$z = 0\ntry { 10 / $z }\ncatch { \"math error\" }", "o": ["0", "math error", "Infinity"], "a": 1, "why": "Dividing by zero is a terminating error."}, {"u": "errors", "q": "What does it show?", "code": "Get-Item nope.txt -ErrorAction SilentlyContinue\n\"next\"", "o": ["Error: cannot find path", "(nothing shown)", "next"], "a": 2, "why": "The error is hidden and the script goes on. nope.txt does not exist."}, {"u": "errors", "q": "What does it show?", "code": "try {\n  Get-Item nope.txt -ErrorAction Stop\n  \"found\"\n} catch { \"missing\" }", "o": ["found", "missing", "found\nmissing"], "a": 1, "why": "nope.txt does not exist. Stop sends the error to catch, so \"found\" is skipped."}, {"u": "errors", "q": "What does it show?", "code": "$ErrorActionPreference = \"Stop\"\ntry {\n  Get-Item nope.txt\n  \"found\"\n} catch { \"caught\" }", "o": ["caught", "found", "Red error, then: found"], "a": 0, "why": "The preference makes every error terminating, so catch runs."}, {"u": "errors", "q": "What does it show?", "code": "try {\n  Get-Item nope.txt\n  \"after\"\n} catch { \"caught\" }", "o": ["caught", "Red error, then: after", "after\ncaught"], "a": 1, "why": "Without Stop the error is non-terminating: catch never sees it."}, {"u": "errors", "q": "What does it show?", "code": "try {\n  throw \"No license\"\n} catch {\n  \"Failed: \" + $_.Exception.Message\n}", "o": ["Failed: ", "No license", "Failed: No license"], "a": 2, "why": "$_.Exception.Message is the thrown text."}, {"u": "errors", "q": "Which makes a Get-Mailbox error jump into catch?", "o": ["Get-Mailbox -Identity ada@contoso.com -ErrorAction Continue", "Get-Mailbox -Identity ada@contoso.com -ErrorAction Stop", "Get-Mailbox -Identity ada@contoso.com -Catch"], "a": 1, "why": "-ErrorAction Stop turns the error into a terminating one."}, {"u": "errors", "q": "In a catch block, which shows only the error text?", "o": ["$_.Message", "$Error.Text", "$_.Exception.Message", "$Exception"], "a": 2, "why": "$_ is the error record; the text sits in .Exception.Message."}, {"u": <script>
const $ = id => document.getElementById(id);
const KEY = "pockle.v1";
const THEMES = ["orbital", "verdant", "graphite"];
const THEME_COLORS = { orbital: "#e8eaee", verdant: "#0e1712", graphite: "#111214" };
const RANKS = [[0, "Cadet"], [150, "Deckhand"], [400, "Technician"], [800, "Operator"], [1400, "Engineer"], [2200, "Navigator"], [3300, "Commander"], [5000, "Admiral"]];
const GAPS = [0, 1, 2, 4, 8, 16, 32];
const SLOW = 10000;
const JUNIE = { good: ["junie-cheer", "junie-point", "junie-swim"], bad: ["junie-think", "junie-confused", "junie-worry"] };

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load() { try { return JSON.parse(lsGet(KEY)) || {}; } catch (e) { return {}; } }
let S = Object.assign({ xp: 0, streak: 0, last: null, theme: "orbital", off: [], cards: {}, best: 0, recall: true }, load());
function save() { lsSet(KEY, JSON.stringify(S)); }
function today() { const d = new Date(); return Math.floor((d - d.getTimezoneOffset() * 6e4) / 864e5); }

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function getter(k) { const v = lsGet(k); if (v == null) return null; try { return JSON.parse(v); } catch (e) { return v; } }

let POOL = [], LABSTATE = [];
function scan() {
  POOL = []; LABSTATE = [];
  for (const b of BANKS) {
    let done = [];
    try { done = b.done(getter) || []; } catch (e) { done = []; }
    const set = new Set(done);
    const units = b.units.filter(u => set.has(u.id));
    const cards = b.cards.filter(c => set.has(c.u)).map(c => {
      const unit = b.units.find(u => u.id === c.u);
      return Object.assign({}, c, { lab: b.id, labName: b.name, topic: b.topic, href: b.href, unitTitle: unit ? unit.title : "", id: b.id + ":" + hash(c.q + "|" + (c.code || "") + "|" + c.o[c.a]) });
    });
    LABSTATE.push({ b, units, cards });
    if (!S.off.includes(b.id)) POOL.push(...cards);
  }
}

function setTheme(t) {
  S.theme = t; document.documentElement.dataset.theme = t; $("themeBtn").textContent = t;
  document.querySelector('meta[name="theme-color"]').content = THEME_COLORS[t]; save();
}
$("themeBtn").onclick = () => setTheme(THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length]);

function rankOf(xp) { let r = RANKS[0], nx = null; for (let i = 0; i < RANKS.length; i++) if (xp >= RANKS[i][0]) { r = RANKS[i]; nx = RANKS[i + 1] || null; } return { name: r[1], from: r[0], to: nx ? nx[0] : null }; }
function paintRail() {
  const r = rankOf(S.xp);
  $("rank").textContent = r.name; $("xp").textContent = S.xp;
  $("streak").textContent = (S.last === today() || S.last === today() - 1) ? S.streak : 0;
  $("xpbar").style.width = r.to ? Math.round((S.xp - r.from) / (r.to - r.from) * 100) + "%" : "100%";
}
function bumpStreak() {
  const t = today();
  if (S.last === t) return;
  S.streak = S.last === t - 1 ? S.streak + 1 : 1; S.last = t;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hl(src) {
  const re = /((?<=^|\s)\/\/[^\n]*|(?<=^|\s)# [^\n]*|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`|\b\d+(?:\.\d+)?\b|_{3,})/g;
  let out = "", i = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(i, m.index));
    const t = m[0];
    if (/^_{3,}$/.test(t)) out += '<span class="bl">&nbsp;</span>';
    else if (t[0] === "/" || t[0] === "#") out += '<span class="cm">' + esc(t) + "</span>";
    else if (/^["'`]/.test(t)) out += '<span class="st">' + esc(t) + "</span>";
    else out += '<span class="nu">' + esc(t) + "</span>";
    i = m.index + t.length;
  }
  return out + esc(src.slice(i));
}
const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200); }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0, 0); }

function st(c) { return S.cards[c.id] || null; }
function dueCards(pool) { const t = today(); return pool.filter(c => { const s = st(c); return s && s.b > 0 && s.due <= t; }); }
function missCards(pool) { return pool.filter(c => { const s = st(c); return s && s.w > 0 && s.b <= 1; }); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function spread(list) {
  const by = {}; list.forEach(c => (by[c.lab] = by[c.lab] || []).push(c));
  const labs = shuffle(Object.keys(by)), out = [];
  while (labs.some(l => by[l].length)) for (const l of labs) if (by[l].length) out.push(by[l].shift());
  return out;
}
function pickMix(pool, n) {
  const picked = new Map();
  const add = arr => { for (const c of arr) { if (picked.size >= n) return; if (!picked.has(c.id)) picked.set(c.id, c); } };
  add(shuffle(dueCards(pool)).sort((a, b) => st(a).due - st(b).due));
  add(shuffle(missCards(pool)));
  add(spread(shuffle(pool.filter(c => !st(c)))));
  add(spread(shuffle(pool)));
  return spread(shuffle([...picked.values()]));
}

function fluency(cards) {
  const seen = cards.map(st).filter(Boolean);
  if (seen.length < 3) return null;
  if (seen.some(s => s.ok === false)) return "shaky";
  if (seen.filter(s => s.t > SLOW).length / seen.length > 0.3) return "slow";
  return "fluent";
}
function paintRecall() { $("recallBtn").textContent = S.recall ? "recall on" : "recall off"; $("recallBtn").classList.toggle("on", !!S.recall); }
$("recallBtn").onclick = () => { S.recall = !S.recall; save(); paintRecall(); toast(S.recall ? "Options stay hidden until you have an answer in mind" : "Options show straight away"); };

function paintHome() {
  scan(); paintRail();
  const unlockedLabs = LABSTATE.filter(l => l.cards.length);
  const totalUnits = LABSTATE.reduce((n, l) => n + l.units.length, 0);
  const due = dueCards(POOL).length, miss = missCards(POOL).length;
  if (!unlockedLabs.length) {
    $("welcomeImg").src = "img/junie/junie-sleep.webp";
    $("welcomeTxt").innerHTML = "Nothing to quiz yet. Finish a lesson in any lab and its cards show up here. On another device? Use <b>Send to phone</b> in the Workshop and scan the code.";
  } else {
    $("welcomeImg").src = "img/junie/junie-wave.webp";
    $("welcomeTxt").innerHTML = "Only what you've already done. <b>" + POOL.length + " cards</b> from <b>" + totalUnits + " finished lessons</b> across <b>" + unlockedLabs.length + " labs</b>. Tap only, no typing.";
  }
  $("mixBtn").disabled = !POOL.length;
  $("mixSub").textContent = due ? due + " due for review · mix 10" : "mix 10 · all labs shuffled";
  $("missBtn").disabled = !miss;
  $("missSub").textContent = miss ? miss + " to fix" : "nothing to fix";
  $("sprintBtn").disabled = POOL.length < 4;
  $("sprintSub").textContent = S.best ? "best " + S.best + " · beat it" : "as many as you can";
  const on = LABSTATE.filter(l => l.cards.length && !S.off.includes(l.b.id)).length;
  $("labCount").textContent = on + " on";
  const list = $("labList"); list.innerHTML = "";
  const sorted = LABSTATE.slice().sort((a, b) => (b.cards.length > 0) - (a.cards.length > 0));
  for (const l of sorted) {
    const locked = !l.cards.length, inMix = !locked && !S.off.includes(l.b.id);
    const seen = l.cards.filter(c => st(c)).length;
    const row = document.createElement("div");
    row.className = "lab" + (locked ? " locked" : "") + (inMix ? " in" : "");
    row.innerHTML = '<button class="tog" aria-label="toggle"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></button>'
      + '<div class="nm"><strong>' + esc(l.b.name) + '</strong><small>' + esc(l.b.topic) + " · " + (locked ? "nothing finished yet" : l.units.length + "/" + l.b.units.length + " done · " + l.cards.length + " cards") + (fluency(l.cards) ? ' · <b class="' + fluency(l.cards) + '">' + fluency(l.cards) + "</b>" : "") + '</small>'
      + '<div class="meter"><i style="width:' + (l.cards.length ? Math.round(seen / l.cards.length * 100) : 0) + '%"></i></div></div>'
      + (locked ? '<a class="solo" href="' + esc(l.b.href) + '">open</a>' : '<button class="solo">solo</button>');
    if (!locked) {
      row.querySelector(".tog").onclick = () => { S.off = inMix ? S.off.concat(l.b.id) : S.off.filter(x => x !== l.b.id); save(); paintHome(); };
      row.querySelector(".solo").onclick = () => start("solo", pickMix(l.cards, 10), l.b.name);
    }
    list.appendChild(row);
  }
}

let R = null;
function start(mode, cards, label) {
  if (!cards.length) { toast("nothing to quiz here yet"); return; }
  R = { mode, label, cards, i: 0, ok: 0, xp: 0, miss: [], answered: false, t0: Date.now(), timer: null };
  $("timer").hidden = mode !== "sprint";
  $("dots").hidden = mode === "sprint";
  if (mode === "sprint") {
    R.left = 60; $("timerBar").style.transition = "none"; $("timerBar").style.width = "100%";
    requestAnimationFrame(() => { $("timerBar").style.transition = "width 1s linear"; });
    R.timer = setInterval(() => { R.left--; $("timerBar").style.width = (R.left / 60 * 100) + "%"; if (R.left <= 0) finish(); }, 1000);
  }
  $("dots").innerHTML = cards.map(() => "<i></i>").join("");
  show("drill"); render();
}

function render() {
  const c = R.cards[R.i]; R.answered = false;
  $("count").textContent = R.mode === "sprint" ? R.ok + " right" : (R.i + 1) + " / " + R.cards.length;
  $("ok").textContent = R.ok;
  [...$("dots").children].forEach((d, k) => { if (k === R.i) d.className = "on"; });
  const order = shuffle(c.o.map((t, k) => k));
  R.order = order;
  $("qcard").innerHTML = '<div class="ticket"><span class="lt">' + esc(c.labName) + '</span><span>' + esc(c.unitTitle) + '</span></div>'
    + '<div class="ask">' + inl(c.q) + '</div>'
    + (c.code ? '<div class="code">' + hl(c.code) + '</div>' : "")
    + '<div class="choices">' + order.map(k => '<button class="choice" data-k="' + k + '">' + esc(c.o[k]) + '</button>').join("") + '</div>'
    + '<div class="fb" id="fb"></div>';
  $("qcard").querySelectorAll(".choice").forEach(b => b.onclick = () => answer(+b.dataset.k));
  R.t0 = performance.now();
  if (S.recall && R.mode !== "sprint") {
    const ch = $("qcard").querySelector(".choices"); ch.classList.add("hide");
    const b = document.createElement("button"); b.className = "reveal";
    b.innerHTML = "<b>Think of the answer</b><span>then tap to show options</span>";
    ch.before(b); b.onclick = () => { b.remove(); ch.classList.remove("hide"); };
  }
  $("nextBtn").classList.remove("on");
}

function grade(c, right, dt) {
  const s = S.cards[c.id] || { b: 0, due: 0, w: 0, n: 0 };
  s.n++; s.ok = right; s.t = dt;
  if (right && dt > SLOW) { s.b = Math.max(s.b, 1); s.due = today() + 1; }
  else if (right) { s.b = Math.min(s.b + 1, GAPS.length - 1); s.due = today() + GAPS[s.b]; }
  else { s.b = 1; s.due = today(); s.w++; }
  S.cards[c.id] = s;
}

function answer(k) {
  if (R.answered) return; R.answered = true;
  const c = R.cards[R.i], right = k === c.a;
  const dt = Math.round(performance.now() - R.t0), slow = right && dt > SLOW && R.mode !== "sprint";
  grade(c, right, R.mode === "sprint" ? 0 : dt);
  const gain = right ? 10 : 2; R.xp += gain; S.xp += gain;
  if (right) R.ok++; else R.miss.push(c);
  bumpStreak(); save(); paintRail();
  $("qcard").querySelectorAll(".choice").forEach(b => {
    const bk = +b.dataset.k; b.disabled = true;
    if (bk === c.a) b.classList.add("good"); else if (bk === k) b.classList.add("bad");
  });
  const dot = $("dots").children[R.i]; if (dot) dot.className = right ? "good" : "bad";
  $("ok").textContent = R.ok;
  if (R.mode === "sprint") { $("count").textContent = R.ok + " right"; setTimeout(advance, right ? 450 : 1100); return; }
  const pic = JUNIE[right ? "good" : "bad"][Math.floor(Math.random() * 3)];
  const fb = $("fb"); fb.classList.add("on");
  fb.innerHTML = '<div class="fbrow"><div><span class="verdict ' + (right ? "good" : "bad") + '">' + (right ? "Right." : "Not quite.") + '</span>' + inl(c.why) + (slow ? " Right, but it took " + Math.round(dt / 1000) + "s. It comes back tomorrow to get faster." : "")
    + '<div style="margin-top:6px"><a href="' + esc(c.href) + '">revisit in ' + esc(c.labName) + '</a></div></div><img src="img/junie/' + pic + '.webp" alt=""></div>';
  $("nextBtn").textContent = R.i + 1 < R.cards.length ? "Next" : "Finish";
  $("nextBtn").classList.add("on");
}

function advance() {
  if (!R) return;
  R.i++;
  if (R.mode === "sprint" && R.i >= R.cards.length) R.cards.push(...pickMix(POOL, 20)), $("dots").innerHTML = "";
  if (R.i >= R.cards.length) return finish();
  render();
}
$("nextBtn").onclick = advance;
$("quitBtn").onclick = () => { if (R && R.i > 0 || (R && R.answered)) finish(); else { stopTimer(); R = null; paintHome(); show("home"); } };

function stopTimer() { if (R && R.timer) { clearInterval(R.timer); R.timer = null; } }
function finish() {
  stopTimer(); if (!R) return;
  const total = R.mode === "sprint" ? R.i + (R.answered ? 0 : 0) : R.cards.length;
  const answered = R.mode === "sprint" ? R.ok + R.miss.length : Math.min(R.i + (R.answered ? 1 : 0), R.cards.length);
  let msg = "", cls = "good";
  if (R.mode === "sprint") {
    if (R.ok > S.best) { S.best = R.ok; msg = "New best."; } else msg = "Best is " + S.best + ".";
    save();
  } else {
    const acc = answered ? R.ok / answered : 0;
    msg = acc >= .9 ? "Clean run." : acc >= .7 ? "Solid. Misses come back first next time." : "Misses are queued for review. Revisit those lessons.";
    cls = acc >= .7 ? "good" : "bad";
  }
  $("resImg").src = "img/junie/" + (cls === "good" ? "junie-cheer" : "junie-think") + ".webp";
  $("resNum").textContent = R.ok;
  $("resSub").textContent = R.mode === "sprint" ? "right in 60 seconds" : "correct of " + answered;
  $("resAcc").textContent = (answered ? Math.round(R.ok / answered * 100) : 0) + "%";
  $("resXp").textContent = "+" + R.xp;
  $("resStreak").textContent = S.streak;
  $("resMsg").textContent = msg; $("resMsg").className = "msg " + cls;
  $("resMiss").innerHTML = R.miss.length ? '<div class="sect"><span>To fix</span><span>' + R.miss.length + '</span></div>' + R.miss.map(c =>
    '<div class="m"><b>' + esc(c.labName) + " · " + esc(c.unitTitle) + '</b>' + inl(c.q) + (c.code ? '<div class="code">' + hl(c.code) + '</div>' : "")
    + '<div class="ans">' + esc(c.o[c.a]) + '</div><div>' + inl(c.why) + '</div></div>').join("") : "";
  R.done = true; show("result");
}
$("againBtn").onclick = () => { const m = R ? R.mode : "mix"; scan(); go(m); };
$("homeBtn").onclick = () => { R = null; paintHome(); show("home"); };

function go(mode) {
  if (mode === "miss") start("miss", spread(shuffle(missCards(POOL))).slice(0, 10), "Mistakes");
  else if (mode === "sprint") start("sprint", pickMix(POOL, 20), "Sprint");
  else start("mix", pickMix(POOL, 10), "Mix");
}
$("mixBtn").onclick = () => go("mix");
$("missBtn").onclick = () => go("miss");
$("sprintBtn").onclick = () => go("sprint");

$("resetBtn").onclick = () => { if (confirm("Reset Pockle xp, streak and review history? Your lab progress stays.")) { S = { xp: 0, streak: 0, last: null, theme: S.theme, off: [], cards: {}, best: 0 }; save(); paintHome(); } };

$("sendBtn").onclick = () => MegaSync.send().catch(e => toast("send failed: " + e.message));
MegaSync.listen(() => { S = Object.assign({ xp: 0, streak: 0, last: null, theme: "orbital", off: [], cards: {}, best: 0, recall: true }, load()); setTheme(THEMES.includes(S.theme) ? S.theme : "orbital"); paintRecall(); paintHome(); });

window.addEventListener("storage", () => { if ($("home").classList.contains("on")) paintHome(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && $("home").classList.contains("on")) paintHome(); });

setTheme(THEMES.includes(S.theme) ? S.theme : "orbital");
paintRecall();
paintHome();
</script>
</body>
