<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f1ec;--sheet:#fbfaf7;--card:#ffffff;--ink:#121212;--ink2:#56524b;--ink3:#8d887e;
  --line:#e0dcd3;--line2:#cfc9bd;--acc:#ff4b1f;--acc-soft:#ffe6dd;--ok:#178a4c;--ok-soft:#dff3e7;--bad:#cf3127;--bad-soft:#fbe3e0;--tip:#9a6a00;--tip-soft:#fbf1d6;
  --serif:"Instrument Serif",Georgia,serif;--sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root{--callout:#121212;--callout-fg:#e9e6df;--on-acc:#fff;--acc-ink:#ffb199;--soft:#ebe7df;--soft2:#efece5;--mute:#b9b3a8;--codebg:#ece8e0;--gut:#f7f5f0;--gutt:#b3ad9f;--dot:#e7e2d8;--ring:rgba(18,18,18,.07);--blend:multiply;--sx-k:#b4321a;--sx-s:#1d7a46;--sx-c:#a8a294;--sx-n:#a35d00;--sx-p:#2a52be;--sx-a:#7a4bb5;color-scheme:light}
:root[data-theme="noir"]{--callout:#232327;--callout-fg:#f1efe9;--paper:#0d0d0f;--sheet:#141416;--card:#1a1a1d;--ink:#f1efe9;--ink2:#a7a39b;--ink3:#76726b;--line:#28282c;--line2:#38383e;--acc:#ff5a2e;--acc-soft:#2c1813;--ok:#4cc38a;--ok-soft:#12251b;--bad:#ff6b5e;--bad-soft:#2b1513;--tip:#e3b34a;--tip-soft:#2a2313;--on-acc:#fff;--acc-ink:#ff8a6a;--soft:#222226;--soft2:#1e1e22;--mute:#4f4c47;--codebg:#26262b;--gut:#161618;--gutt:#4a4741;--dot:#252529;--ring:rgba(241,239,233,.08);--blend:screen;--sx-k:#ff7d5c;--sx-s:#7fd3a0;--sx-c:#6b675f;--sx-n:#f0b35a;--sx-p:#8fb2ff;--sx-a:#c39cff;color-scheme:dark}
:root[data-theme="midnight"]{--callout:#1a2031;--callout-fg:#e6ebf5;--paper:#0a0c11;--sheet:#0f1219;--card:#141823;--ink:#e6ebf5;--ink2:#97a1b6;--ink3:#626b80;--line:#20263a;--line2:#2d3550;--acc:#c8ff3e;--acc-soft:#1d2711;--ok:#5ee0a0;--ok-soft:#10241c;--bad:#ff7a8a;--bad-soft:#2a1419;--tip:#ffd166;--tip-soft:#2a2415;--on-acc:#0a0c11;--acc-ink:#c8ff3e;--soft:#1a2030;--soft2:#171c2a;--mute:#3c4560;--codebg:#1c2233;--gut:#0e1118;--gutt:#3e475f;--dot:#1c2232;--ring:rgba(230,235,245,.08);--blend:screen;--sx-k:#ff8fa3;--sx-s:#c8ff3e;--sx-c:#5a6378;--sx-n:#ffd166;--sx-p:#7cc4ff;--sx-a:#c3a6ff;color-scheme:dark}
:root[data-theme="bone"]{--callout:#1e1c18;--callout-fg:#f4efe4;--paper:#ebe5d8;--sheet:#f4efe4;--card:#fbf8f1;--ink:#1e1c18;--ink2:#5a5448;--ink3:#8e8676;--line:#dbd2c1;--line2:#c9bfac;--acc:#2f5d4f;--acc-soft:#dbe6df;--ok:#2f7a4f;--ok-soft:#dcecdf;--bad:#b23a2b;--bad-soft:#f3dcd6;--tip:#8a6400;--tip-soft:#f2e8cc;--on-acc:#fbf8f1;--acc-ink:#a8d5c4;--soft:#e4ddcf;--soft2:#ebe5d9;--mute:#b8ad98;--codebg:#e6dfd1;--gut:#f1ebe0;--gutt:#b2a893;--dot:#e2dacb;--ring:rgba(30,28,24,.08);--blend:multiply;--sx-k:#9b3b22;--sx-s:#2f6b45;--sx-c:#a49a86;--sx-n:#8a5a00;--sx-p:#2c5aa8;--sx-a:#6b4aa0;color-scheme:light}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.theming *,.theming *::before,.theming *::after{transition:background-color .35s ease,color .35s ease,border-color .35s ease!important}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.88em;background:var(--codebg);padding:1px 5px;border-radius:4px}
.top{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--sheet)}
.logo{font-family:var(--serif);font-size:30px;line-height:1;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo i{color:var(--acc)}
.logo small{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.sep{width:1px;height:24px;background:var(--line)}
select{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 28px 6px 10px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.pills{display:flex;gap:6px}
.pill{position:relative;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;transition:transform .25s var(--ease),background .25s,border-color .25s}
.pill:hover{transform:translateY(-2px);border-color:var(--line2)}
.pill.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pill .seals{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);display:flex;gap:2px}
.pill .seals b{width:4px;height:4px;border-radius:50%;background:var(--line2)}
.pill .seals b.s{background:var(--acc)}
.pill.school{width:auto;padding:0 12px;font-size:12px;letter-spacing:.04em}
.pill.school.done::after{content:"✓";margin-left:6px;color:var(--ok)}
.pill.school.on.done::after{color:#7fe0a8}
.grow{flex:1}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;padding:6px 13px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2);transition:color .25s}
.seg button.on{color:var(--ink)}
.seg .knob{position:absolute;top:3px;bottom:3px;border-radius:7px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);transition:left .35s var(--ease),width .35s var(--ease)}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--sheet);display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease),background .2s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn kbd{font-family:var(--mono);font-size:10px;opacity:.7}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:14px;transition:transform .2s var(--ease)}
.icon:hover{transform:translateY(-2px)}
.main{height:calc(100% - 54px);display:grid;grid-template-columns:330px minmax(0,1fr) minmax(0,1fr);}
.col{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.col:last-child{border-right:0}
.brief{position:relative;background:var(--sheet);overflow:auto;padding:22px 22px 30px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.brief h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;margin:6px 0 14px;letter-spacing:-.01em}
.brief p{line-height:1.6;color:var(--ink2);margin:0 0 12px}
.brief h4{margin:22px 0 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:4px 0}
.specs dt{color:var(--ink3)}
.specs dd{margin:0;font-weight:600}
.bp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.bp li{font-family:var(--mono);font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.bp li span{color:var(--ink3);font-family:var(--sans)}
.note{font-size:12.5px;line-height:1.55;padding:10px 12px;border-radius:10px;background:var(--soft2);color:var(--ink2)}
.jn{display:flex;align-items:center;gap:12px;margin:12px 0}
.jn img{width:74px;height:auto;flex:none;animation:jnbob 4.5s ease-in-out infinite}
.jn p{margin:0;font-size:13px;line-height:1.55;color:var(--ink2);padding:10px 12px;border-radius:12px;background:var(--soft2)}
@keyframes jnbob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.jn img,.jnhero{animation:none!important}}
.hero>div:first-child{position:relative}
.jnhero{position:absolute;right:2%;top:-6px;width:clamp(110px,11vw,160px);height:auto;pointer-events:none;animation:jnswim 7s ease-in-out infinite}
@keyframes jnswim{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(-14px,8px) rotate(2deg)}}
@media (max-width:900px){.jnhero{display:none}}

.note b{color:var(--ink)}
.hints{display:flex;flex-direction:column;gap:6px}
.hint{font-size:13px;line-height:1.55;padding:10px 12px;border-left:3px solid var(--acc);background:var(--acc-soft);border-radius:0 8px 8px 0;animation:slideIn .35s var(--ease) both}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 11px;border-radius:10px;font-size:13px;line-height:1.5;animation:slideIn .4s var(--ease) both}
.chk .ic{font-weight:700}
.chk.ok{background:var(--ok-soft)}.chk.ok .ic{color:var(--ok)}
.chk.no{background:var(--bad-soft)}.chk.no .ic{color:var(--bad)}
.chk.tip{background:var(--tip-soft)}.chk.tip .ic{color:var(--tip)}
.chk small{display:block;color:var(--ink2)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stamp{margin:18px 0 4px;display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:2px solid var(--acc);color:var(--acc);border-radius:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;animation:stamp .6s cubic-bezier(.2,1.6,.4,1) both}
.stamp b{font-family:var(--serif);font-size:24px;letter-spacing:0;font-weight:400;text-transform:none}
@keyframes stamp{from{opacity:0;transform:scale(1.6) rotate(-6deg)}to{opacity:1;transform:rotate(-2deg)}}
.edhead{display:flex;align-items:center;gap:2px;padding:8px 10px 0;background:var(--sheet);border-bottom:1px solid var(--line)}
.ftab{border:0;background:none;padding:8px 12px 9px;font-family:var(--mono);font-size:12px;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:0;transition:color .2s,border-color .2s}
.ftab:hover{color:var(--ink)}
.ftab.on{color:var(--ink);border-color:var(--acc)}
.ftab .dir{color:var(--ink3)}
.ftab .lock{font-size:10px;opacity:.6;margin-left:6px}
.edhead .grow{flex:1}
.edbox{flex:1;min-height:0;display:flex;background:var(--card);position:relative}
.gutter{width:44px;flex:none;overflow:hidden;background:var(--gut);border-right:1px solid var(--line);color:var(--gutt);font:12.5px/1.65 var(--mono);text-align:right;padding:14px 8px 14px 0;white-space:pre;user-select:none}
.code{position:relative;flex:1;min-width:0}
.code pre,.code textarea{position:absolute;inset:0;margin:0;padding:14px 16px;font:12.5px/1.65 var(--mono);white-space:pre;tab-size:2;border:0;letter-spacing:0;word-spacing:0}
.code pre{overflow:hidden;pointer-events:none;color:var(--ink)}
.code textarea{background:transparent;color:transparent;caret-color:var(--ink);resize:none;outline:none;overflow:auto}
.code textarea::selection{background:rgba(255,75,31,.22);color:transparent}
.code textarea[readonly]{caret-color:transparent}
.ro-banner{position:absolute;right:12px;top:10px;z-index:2;font-size:11px;padding:4px 9px;border-radius:999px;background:var(--soft2);color:var(--ink2);pointer-events:none}
.k{color:var(--sx-k)}.s{color:var(--sx-s)}.c{color:var(--sx-c);font-style:italic}.n{color:var(--sx-n)}.p{color:var(--sx-p)}.t{color:var(--sx-k)}.a{color:var(--sx-a)}.v{color:var(--ink)}.sel{color:var(--ink);font-weight:500}.f{color:var(--sx-p)}
.cons{height:150px;flex:none;border-top:1px solid var(--line);background:#16161a;color:#d9d6cf;font:12px/1.6 var(--mono);display:flex;flex-direction:column}
.cons .ch{display:flex;align-items:center;padding:6px 12px;font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8d887e;border-bottom:1px solid #26262c}
.cons .ch .grow{flex:1}
.cons .ch button{border:0;background:none;color:#8d887e;cursor:pointer;font-size:11px;letter-spacing:.05em}
.cons .cb{flex:1;overflow:auto;padding:8px 12px}
.cl{padding:2px 0;white-space:pre-wrap;animation:slideIn .25s var(--ease) both}
.cl.err{color:#ff8a7a}.cl.warn{color:#ffd27a}.cl.hint{color:#9fe0b8}.cl.dim{color:#6f6b64}
.stages{background:var(--paper);padding:12px;gap:10px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sheet);transition:box-shadow .3s}
.stage.busy{box-shadow:0 0 0 2px var(--acc)}
.sh{display:flex;align-items:center;gap:10px;height:42px;flex:none;padding:0 12px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.sh .dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}
.stage.mine .sh .dot{background:var(--acc)}
.sh .act{font-weight:500;letter-spacing:.02em;text-transform:none;font-size:12px;color:var(--ink3)}
.sh .grow{flex:1}
.stage iframe{flex:1;width:100%;border:0;background:#fbfaf7;display:block}
.playbar{display:flex;justify-content:center;gap:8px}
.view{display:none}
.view.on{display:contents}
.schoolwrap{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);min-height:0;animation:fadeUp .45s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.teach{overflow:auto;padding:34px 44px 60px;background:var(--sheet);border-right:1px solid var(--line)}
.teach h2{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1;margin:6px 0 10px}
.teach h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:30px 0 10px;color:var(--ink)}
.teach p,.teach li{line-height:1.7;color:var(--ink2);font-size:15px}
.teach ul{padding-left:18px}
.teach pre{font:13px/1.65 var(--mono);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0}
.flow b{padding:8px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--card);font-weight:600;font-size:13px}
.flow b.hot{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.flow b.acc{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.flow i{font-style:normal;color:var(--ink3)}
.eases{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.ease{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:12px;font-family:var(--mono);font-size:12px}
.lane{height:22px;border-radius:999px;background:var(--soft);position:relative}
.lane::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--acc);animation:lane 1.6s infinite alternate}
.lane.ov::after{animation-timing-function:cubic-bezier(.34,1.56,.64,1)}.lane.linear::after{animation-timing-function:linear}.lane.ease::after{animation-timing-function:ease}.lane.ein::after{animation-timing-function:ease-in}.lane.eout::after{animation-timing-function:ease-out}.lane.einout::after{animation-timing-function:ease-in-out}
@keyframes lane{from{left:3px}to{left:calc(100% - 19px)}}
.tl{position:relative;height:84px;margin:14px 0;font-size:11px;font-family:var(--mono)}
.tl .ax{position:absolute;left:0;right:0;top:60px;height:1px;background:var(--line2)}
.tl .seg2{position:absolute;top:22px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:600}
.tl .lbl{position:absolute;top:66px;color:var(--ink3)}
.demo-bars{display:flex;gap:8px;align-items:flex-end;height:70px}
.demo-bars i{width:22px;height:60px;border-radius:6px;background:var(--ink);animation:dup 2.4s infinite both}
.demo-bars i:nth-child(2){animation-delay:.15s}.demo-bars i:nth-child(3){animation-delay:.3s;background:var(--acc)}.demo-bars i:nth-child(4){animation-delay:.45s}
@keyframes dup{0%{opacity:0;transform:translateY(20px)}25%,80%{opacity:1;transform:none}100%{opacity:0}}
.drills{overflow:auto;padding:34px 30px;display:flex;flex-direction:column;gap:16px}
.dprog{display:flex;gap:5px}
.dprog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.dprog i.on{background:var(--ink)}
.dprog i.ok{background:var(--acc)}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;animation:fadeUp .4s var(--ease) both}
.dcard .q{font-size:17px;line-height:1.5;margin:6px 0 16px}
.dcard input{width:100%;font:15px var(--mono);padding:12px 14px;border:1px solid var(--line2);border-radius:10px;outline:none;background:var(--sheet);transition:border-color .2s,box-shadow .2s}
.dcard input:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--ring)}
.dcard input.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.dfb{margin-top:12px;font-size:13px;line-height:1.55;min-height:20px}
.dfb.ok{color:var(--ok)}.dfb.no{color:var(--bad)}.dfb.tip{color:var(--tip)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:12px 0}
.tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tool b{font-family:var(--mono);font-size:13px}
.tool span{font-size:13px;line-height:1.5;color:var(--ink2)}
.tool pre,.mbox .tool pre{margin:0;font:11.5px/1.55 var(--mono);background:var(--soft2);border:0;border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.tool i{font-style:normal;font-size:12px;color:var(--acc)}
.tool a.mdn{align-self:flex-start;margin-top:2px;font-size:11.5px;font-weight:600;color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line2);transition:color .2s,border-color .2s}
.tool a.mdn:hover{color:var(--acc);border-color:var(--acc)}
.tool small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.needs{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.needs div{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.needs div:nth-child(odd){color:var(--ink2)}
.needs div:nth-child(even){font-family:var(--mono);font-size:12px}
.needs div:nth-last-child(-n+2){border-bottom:0}
.mbox.wide{width:min(1100px,94vw)}
.dcard textarea.pat{width:100%;height:220px;font:13px/1.6 var(--mono);padding:12px 14px;border:1px solid var(--line2);border-radius:10px;outline:none;background:var(--sheet);resize:vertical;tab-size:2}
.dcard textarea.pat:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--ring)}
.dcard textarea.pat.shake{animation:shake .35s}

.d10w{perspective:400px}
.d10w i{display:block;width:74px;height:96px;border-radius:12px;background:var(--ink);animation:d10 3.2s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes d10{0%,25%{transform:rotateY(0)}50%,75%{transform:rotateY(180deg);background:var(--acc)}100%{transform:rotateY(360deg)}}
.d11{width:72%}
.d11 path{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;animation:d11 2.8s ease-in-out infinite}
@keyframes d11{0%{stroke-dashoffset:1}50%,78%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.d12w{position:relative;width:62%;height:96px}
.d12w i{position:absolute;left:0;right:0;top:0;height:54px;border-radius:10px;background:var(--ink);animation:d12 3.2s cubic-bezier(.2,.8,.2,1) infinite both}
.d12w i:nth-child(2){background:var(--acc);animation-delay:.25s}
.d12w i:nth-child(3){background:var(--mute);animation-delay:.5s}
@keyframes d12{0%{transform:translateY(110px);opacity:0}25%,82%{transform:translateY(calc(var(--k) * 14px));opacity:1}100%{transform:translateY(calc(var(--k) * 14px));opacity:0}}
.d13w{position:relative;width:78%;display:flex;flex-direction:column;gap:7px}
.d13w b{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;animation:d13 3.4s cubic-bezier(.2,.8,.2,1) infinite both}
.d13w i{height:8px;border-radius:4px;background:var(--line);width:80%}
.d13w i+i{width:55%}
.d13w span{position:absolute;right:0;top:0;color:var(--acc);font-size:22px;animation:dspin 4s linear infinite}
@keyframes d13{0%{opacity:0;transform:translateY(14px)}25%,85%{opacity:1;transform:none}100%{opacity:0}}
.d15w{position:absolute;inset:0;overflow:hidden}
.d15w i{position:absolute;top:50%;left:0;border-radius:50%}
.d15w .m{width:8px;height:8px;margin:-4px;background:var(--ink);animation:d15m 3.2s cubic-bezier(.65,0,.35,1) infinite alternate}
.d15w .f{width:30px;height:30px;margin:-15px;background:var(--acc);opacity:.85;animation:d15m 3.2s cubic-bezier(.2,.9,.25,1) .18s infinite alternate}
@keyframes d15m{0%{transform:translate(30px,-20px)}50%{transform:translate(120px,24px)}100%{transform:translate(220px,-10px)}}
.d14w{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.d14w b{font-family:var(--serif);font-weight:400;font-size:32px;animation:d14t 3.2s steps(1) infinite}
.d14w i{position:absolute;inset:0;background:var(--acc);animation:d14 3.2s cubic-bezier(.7,0,.3,1) infinite}
@keyframes d14{0%,20%{transform:translateX(-100%)}45%,55%{transform:translateX(0)}80%,100%{transform:translateX(100%)}}
@keyframes d14t{0%{opacity:1}50%{opacity:.35}}
.d0w{position:relative;width:150px;height:96px}
.d0w i{position:absolute;width:84px;height:58px;border-radius:10px;background:var(--ink);animation:d0 3.6s cubic-bezier(.2,.8,.2,1) infinite}
.d0w i:nth-child(1){left:0;top:0}.d0w i:nth-child(2){left:33px;top:19px;background:var(--acc);animation-delay:-1.2s}.d0w i:nth-child(3){left:66px;top:38px;background:var(--mute);animation-delay:-2.4s}
@keyframes d0{0%,30%{z-index:1;transform:none}33%,63%{z-index:3;transform:translateY(-6px)}66%,100%{z-index:1;transform:none}}
.dsoon{font-family:var(--serif);font-size:30px;color:var(--ink3);font-style:italic}
.hcursor{position:fixed;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--acc);pointer-events:none;z-index:40;opacity:0;transition:transform .14s ease-out,width .25s,height .25s,margin .25s,opacity .25s;mix-blend-mode:var(--blend)}
body.home-on .hcursor{opacity:1}
.hcursor.big{width:58px;height:58px;margin:-29px 0 0 -29px}
body.home-on .hcursor.big{opacity:.3}
.used{position:fixed;right:16px;bottom:16px;z-index:30;border:0;font:inherit;font-size:11.5px;padding:8px 14px;border-radius:999px;background:var(--callout);color:var(--callout-fg);cursor:pointer;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);animation:fadeUp .6s .9s both;transition:transform .25s var(--ease)}
.used:hover{transform:translateY(-2px)}
.used b{color:var(--acc-ink);font-weight:600}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--card);cursor:pointer;transition:transform .2s var(--ease),border-color .2s,background .2s}
.chip:hover{transform:translateY(-2px);border-color:var(--ink)}
.wild{font-size:13px;line-height:1.55;padding:12px 14px;border-radius:12px;background:var(--callout);color:var(--callout-fg)}
.wild b{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc-ink);margin-bottom:4px}
.graph{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;animation:slideIn .4s var(--ease) both}
.graph svg{width:100%;height:118px;display:block;overflow:visible}
.graph .gt{stroke:var(--ink);stroke-width:2;fill:none;opacity:.85}
.graph .gu{stroke:var(--acc);stroke-width:2.6;fill:none;stroke-linecap:round}
.graph .lg{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink3);margin-top:6px}
.graph .lg i{display:inline-block;width:14px;height:3px;border-radius:3px;margin-right:6px;vertical-align:middle}
.graph .lg .grow{flex:1}
.stages.overlay{display:grid;grid-template-rows:auto minmax(0,1fr)}
.stages.overlay .playbar{grid-row:1}
.stages.overlay .stage{grid-row:2;grid-column:1}
.stages.overlay #stT{z-index:2;pointer-events:none;background:transparent;border-color:transparent;opacity:.5}
.stages.overlay #stT iframe{mix-blend-mode:multiply}
.stages.overlay #stT .sh{visibility:hidden}
#themeBtn .thi{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);background:linear-gradient(135deg,var(--ink) 50%,transparent 50%);transition:transform .5s var(--ease)}
#themeBtn:hover .thi{transform:rotate(180deg)}
#ovBtn .ovi{width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
#ovBtn.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.elab{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:28px;align-items:start}
.elab svg{width:100%;height:auto;user-select:none;-webkit-user-select:none;background:var(--card);border:1px solid var(--line);border-radius:20px;touch-action:none;overflow:visible}
.elab .gridl{stroke:var(--line);stroke-width:1}
.elab .diag{stroke:var(--ink3);stroke-dasharray:4 4;stroke-width:1}
.elab .arm{stroke:var(--ink3);stroke-width:1.5}
.elab .crv{fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round}
.elab .hdl{fill:var(--sheet);stroke:var(--ink);stroke-width:3;cursor:grab}
.elab .hdl:active{cursor:grabbing}
.elab .ax{font:11px var(--mono,monospace);fill:var(--ink3)}
.llanes{display:grid;gap:12px;margin:18px 0}
.llane{position:relative;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.llane b{position:absolute;left:6px;top:6px;width:32px;height:32px;border-radius:50%;background:var(--acc)}
.llane.ref b{background:var(--ink3)}
.llane span{position:absolute;left:50%;transform:translateX(-50%);top:12px;font-size:12px;color:var(--ink3)}
.elab .out{font-family:var(--mono,monospace);font-size:14px;padding:14px 16px;border-radius:14px;background:var(--callout);color:var(--callout-fg);display:flex;justify-content:space-between;gap:12px;align-items:center;word-break:break-all}
.elab .out code{background:none;color:inherit;padding:0;font:inherit}
.elab .feel{margin:10px 0 0;color:var(--ink2);font-size:14px}
.elab input[type=range]{width:100%;accent-color:var(--acc)}
@media (max-width:760px){.elab{grid-template-columns:1fr}}
.gymband{width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px;border-radius:20px;border:0;background:var(--callout);color:var(--callout-fg);font:inherit;text-align:left;cursor:pointer;transition:transform .3s var(--ease)}
.gymband:hover{transform:translateY(-3px)}
.gymband b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--callout-fg);margin-bottom:4px}
.ghero{margin-bottom:34px}
.gh1{font-family:var(--serif);font-weight:400;font-size:clamp(52px,6.6vw,96px);line-height:.95;margin:12px 0 18px;letter-spacing:-.02em}
.gh1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
.gh1 .ln span{display:inline-block;animation:heroUp 1.1s cubic-bezier(.2,.8,.2,1) both}
.gh1 .ln:nth-child(2) span{animation-delay:.13s}
.gh1 em{color:var(--acc)}
.ghero p{font-size:17px;line-height:1.6;color:var(--ink2);max-width:680px;animation:fadeUp .8s .35s both}
.loop{display:flex;align-items:stretch;gap:8px;margin-bottom:40px}
.lstep{flex:1;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px;animation:fadeUp .6s both;animation-delay:calc(var(--i) * 90ms + .3s)}
.lstep span{font-family:var(--mono);font-size:11px;color:var(--acc)}
.lstep b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;margin:4px 0 6px}
.lstep p{margin:0;font-size:13px;line-height:1.55;color:var(--ink2)}
.larr{font-style:normal;align-self:center;color:var(--ink3)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gcard .num{font-size:40px}
.gcard .sub2{margin-top:0;line-height:1.5}
.tips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.tip b{font-size:15px}
.tip p{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--ink2)}
.gymtop{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.gymtop h2{font-family:var(--serif);font-weight:400;font-size:42px;margin:2px 0 0}
.gsub{font-size:13px;color:var(--ink2)}
.gwork{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:18px;align-items:start}
.gstage{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--sheet);display:flex;flex-direction:column}
.gstage iframe{height:440px;border:0;width:100%;background:#fbfaf7}
.gstage .sh{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.gstage .sh .dot{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.gstage .sh .act{font-weight:500;letter-spacing:.02em;text-transform:none;font-size:12px;color:var(--ink3)}
.gstage .sh .grow{flex:1}
.gstage.eye{padding:30px 28px;background:var(--card) radial-gradient(var(--dot) 1px,transparent 1px) 0 0/18px 18px}
.lanes{display:flex;flex-direction:column;gap:34px;padding-top:18px}
.elane{position:relative;height:56px;border-radius:999px;background:var(--soft);padding:8px}
.elane span{position:absolute;left:14px;top:-18px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.elane .eball{display:block;width:40px;height:40px;border-radius:50%;background:var(--ink)}
.elane.guess{background:var(--acc-soft)}
.elane.guess .eball{background:var(--acc)}
.gpanel{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:22px}
.gq{font-family:var(--serif);font-size:30px;line-height:1.1;margin:6px 0 8px}
.gp{font-size:14px;line-height:1.6;color:var(--ink2);margin:0 0 14px}
.gpanel .fn{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.missed{border:1.5px dashed var(--bad);color:var(--bad)}
.chip.extra{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through}
.chip.dim{opacity:.4}
pre.gcode{font:12px/1.6 var(--mono);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:240px;overflow:auto;margin:6px 0 12px}
.bcard .sub2{margin-top:0;line-height:1.5}
.bcard.fixed{border-color:var(--ok)}
.bugbox{margin:4px 0 12px;padding:12px 14px;border-radius:12px;border:1.5px dashed var(--bad);background:var(--bad-soft);font-size:14px;line-height:1.5}
.bugbox b{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bad);margin-bottom:4px}
.conf{position:fixed;width:8px;height:13px;border-radius:2px;z-index:70;pointer-events:none}
@media (max-width:1180px){
  .hero{grid-template-columns:1fr}
  .grid8,.g4,.tips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gwork{grid-template-columns:1fr}
  .loop{flex-wrap:wrap}.larr{display:none}
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,30%) minmax(0,70%)}
  .brief{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}
  .schoolwrap{grid-template-columns:1fr;grid-row:1/-1}
  .top .logo small{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo" id="logo" title="Studio home"><span>Webble<i>.</i></span><small>vol. VI · motion</small></div>
  <div class="sep"></div>
  <select id="chap"></select>
  <div class="pills" id="pills"></div>
  <div class="grow"></div>
  <div class="seg" id="modes"><span class="knob"></span><button data-m="normal">Normal</button><button data-m="hard">Hard</button><button data-m="expert">Expert</button></div>
  <button class="btn acc" id="checkBtn">Check <kbd>⌘↵</kbd></button>
  <button class="icon" id="themeBtn" title="Switch theme (T)"><span class="thi"></span></button>
  <button class="icon" id="gymBtn" title="Practice gym">🏋</button>
  <button class="icon" id="cheatBtn" title="Cheat sheet (C)">📜</button>
  <button class="icon" id="toolBtn" title="Toolbox">🧰</button>
  <button class="icon" id="sndBtn" title="Sound">🔈</button>
  <button class="icon" id="saveBtn" title="Export / import progress">⇅</button>
</header>
<main class="main" id="main">
  <div class="view" id="workView">
    <aside class="col brief" id="brief"></aside>
    <section class="col">
      <div class="edhead" id="ftabs"></div>
      <div class="edbox">
        <div class="gutter" id="gutter"></div>
        <div class="code"><pre id="hl"></pre><textarea id="ta" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea><span class="ro-banner" id="roBanner" hidden>read-only</span></div>
      </div>
      <div class="cons"><div class="ch"><span>Console</span><span class="grow"></span><button id="clearCons">clear</button></div><div class="cb" id="cons"></div></div>
    </section>
    <section class="col stages" id="stages">
      <div class="stage" id="stT"><div class="sh"><span class="dot"></span><span id="tLabel">Target</span><span class="act" id="actT"></span><span class="grow"></span><button class="btn ghost sm" id="replayT">↻ replay</button></div><iframe id="frT" title="Target"></iframe></div>
      <div class="playbar"><button class="btn sm" id="playBoth">▶ Play both</button><button class="btn ghost sm" id="runBtn">Run mine <kbd>⌘S</kbd></button><button class="btn ghost sm" id="ovBtn" title="Ghost the target over yours"><span class="ovi"></span>Overlay</button></div>
      <div class="stage mine" id="stU"><div class="sh"><span class="dot"></span>Yours<span class="act" id="actU">try it yourself here</span><span class="grow"></span><button class="btn ghost sm" id="exportBtn" hidden>⬇ export folder</button></div><iframe id="frU" title="Yours"></iframe></div>
    </section>
  </div>
  <div class="view" id="schoolView"><div class="schoolwrap" id="school"></div></div>
  <div class="view" id="homeView"><div class="homewrap" id="home"></div></div>
  <div class="view" id="gymView"><div class="homewrap" id="gym"></div></div>
</main>
<aside class="cheat" id="cheat" aria-label="Cheat sheet"></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div class="hcursor" id="hcur"></div>
<button class="used" id="used" hidden></button>
<script>
const KIT = `*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#fbfaf7 radial-gradient(#e6e1d6 1px,transparent 1px) 0 0/22px 22px;color:#121212;font-family:"Inter Tight",system-ui,sans-serif;font-size:16px}
.btn{font:inherit;font-weight:600;padding:14px 26px;border:0;border-radius:999px;background:#121212;color:#fbfaf7;cursor:pointer}

.card{width:200px;height:130px;border-radius:16px;background:#fff;border:1px solid #e3dfd6;display:grid;place-items:center;font-weight:600;cursor:pointer}
.track{width:420px;height:150px;border:1px dashed #d9d4c9;border-radius:18px;padding:5px;display:flex;align-items:center}
.panel{width:140px;height:140px;border-radius:14px;background:#121212}
.dot{width:36px;height:36px;border-radius:50%;background:#ff4b1f}
.loader{width:56px;height:56px;border-radius:50%;border:5px solid #e3dfd6;border-top-color:#ff4b1f}
.title{margin:0;font-size:64px;letter-spacing:-.03em;font-weight:700}
.bars{display:flex;gap:16px;align-items:flex-end}
.bar{width:44px;height:150px;border-radius:12px;background:#121212}
.bar:nth-child(2){height:110px}
.bar:nth-child(3){height:180px;background:#ff4b1f}
.menu-btn{position:fixed;top:18px;left:18px;z-index:6}
.side{position:fixed;top:0;left:0;width:260px;height:100vh;background:#121212;color:#fbfaf7;padding:84px 28px;display:flex;flex-direction:column;gap:14px;font-size:22px;z-index:5}
.side a{color:inherit;text-decoration:none}
.feed{display:flex;flex-direction:column;gap:120px;padding:40vh 0 60vh}
.reveal{width:320px;height:170px;border-radius:18px;background:#fff;border:1px solid #e3dfd6;display:grid;place-items:center;font-size:28px;font-weight:700}

.line{position:absolute;left:0;bottom:0;width:100%;height:3px;background:#ff4b1f}
.cta{display:block;width:240px;text-align:center;line-height:128px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:26px;font-weight:600;min-height:200px}
.sub{margin:0;font-size:18px;color:#56524b;letter-spacing:.04em}
.type{margin:0;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:28px;white-space:nowrap}
.frame{width:320px;height:200px;border-radius:18px}
.photo{width:100%;height:100%;background:radial-gradient(circle at 30% 30%,#ffb199,transparent 45%),linear-gradient(135deg,#ff4b1f,#121212)}
.zone{width:420px;height:220px;display:grid;place-items:center;border:1px dashed #d9d4c9;border-radius:18px}
.cursor{position:fixed;top:0;left:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#ff4b1f;pointer-events:none;z-index:9}
.ripple-btn{position:relative;overflow:hidden}
.ripple{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
.spacer{width:100%;height:40vh;flex:none}
.bar-top{width:100%;padding:16px;background:#121212;color:#fbfaf7;font-weight:600;text-align:center;z-index:2}
.topbar{position:fixed;top:0;left:0;right:0;padding:18px 24px;background:#121212;color:#fbfaf7;font-weight:700;z-index:3}
.scene{position:relative;width:100%;height:60vh;display:grid;place-items:center;flex:none}
.orb{position:absolute;width:180px;height:180px;border-radius:50%;background:#ff4b1f;opacity:.85}
.scene .title{position:relative}
.h-wrap{width:100%;height:300vh;flex:none}

{
  id:'c1', name:'Transitions', sub:'CSS glides · JS triggers',
  teach:`<div class="eyebrow">Chapter 1 · School</div><h2>Transitions</h2>
<p>Every motion on a site like Marcelo's is the same trick: an element has a <b>state A</b>, something changes it to <b>state B</b>, and the browser animates the in-between.</p>
<div class="flow"><b>state A</b><i>→ something changes →</i><b class="acc">state B</b></div>
<h3>1 · transition = “glide, don't jump”</h3>
<div class="cols"><pre>.btn {
  transition: transform 0.3s ease;
}

.btn:hover {
  transform: translateY(-8px);
}</pre><div><ul><li><b>transform</b> → which property glides</li><li><b>0.3s</b> → how long (300ms also works)</li><li><b>ease</b> → the speed curve</li><li><code>translateY(-8px)</code> → up 8px (minus = up)</li></ul></div></div>
<h3>2 · the golden rule</h3>
<p>Put <code>transition</code> on the <b>normal</b> state, not on <code>:hover</code>. Then it glides in <i>and</i> out. On <code>:hover</code> only, it snaps back when the mouse leaves.</p>
<h3>3 · JS pulls the trigger</h3>
<div class="flow"><b>click</b><i>→</i><b class="hot">JS adds a class</b><i>→</i><b class="acc">CSS animates</b></div>
<div class="cols"><pre>.box { opacity: 0; transition: opacity 0.5s; }
.box.show { opacity: 1; }</pre><pre>const btn = document.querySelector('.btn');
const box = document.querySelector('.box');

btn.addEventListener('click', () => {
  box.classList.add('show');
});</pre></div>
<ul><li><code>classList.add</code> → turn on · <code>remove</code> → turn off · <code>toggle</code> → flip</li><li><code>.box.show</code> (no space) = an element with <b>both</b> classes</li><li>Two properties? Separate with a comma: <code>transition: transform 0.4s, background-color 0.4s;</code></li></ul>
<h3>4 · easing, visually</h3>
<div class="eases"><div class="ease">linear<div class="lane linear"></div></div><div class="ease">ease<div class="lane ease"></div></div><div class="ease">ease-in<div class="lane ein"></div></div><div class="ease">ease-out<div class="lane eout"></div></div><div class="ease">ease-in-out<div class="lane einout"></div></div></div>
<p><b>ease-out</b> starts fast and lands softly. It's the “premium” feel for things entering the screen.</p>`,

{
  id:'c2', name:'Keyframes', sub:'animations that run on their own',
  teach:`<div class="eyebrow">Chapter 2 · School</div><h2>Keyframes</h2>
<p>A transition needs a trigger. A <b>keyframe animation</b> runs by itself: on page load, forever, or after a delay. It's how loaders spin and titles slide in.</p>
<h3>1 · two steps: define, then use</h3>
<div class="cols"><pre>@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

.dot {
  animation: pulse 1.2s ease-in-out infinite;
}</pre><div><div class="flow"><b class="hot">@keyframes name</b><i>→</i><b>the steps</b></div><div class="flow"><b class="acc">animation: name …</b><i>→</i><b>plays them</b></div><ul><li><code>from</code> = <code>0%</code>, <code>to</code> = <code>100%</code></li><li><code>infinite</code> = repeat forever</li></ul></div></div>
<h3>2 · the animation shorthand</h3>
<pre>animation: name  duration  easing  delay  count  fill-mode;
animation: rise  0.8s      ease-out 0.2s  1      both;</pre>
<p>Order is forgiving, but the <b>first time value is the duration</b> and the <b>second is the delay</b>.</p>
<h3>3 · fill-mode: both (the invisible hero)</h3>
<div class="tl"><div class="ax"></div><div class="seg2" style="left:0;width:24%;background:#8d887e">delay</div><div class="seg2" style="left:25%;width:45%;background:#ff4b1f">animation</div><div class="seg2" style="left:71%;width:29%;background:#121212">after</div><div class="lbl" style="left:0">backwards: shows FIRST frame here</div><div class="lbl" style="left:71%">forwards: keeps LAST frame</div></div>
<p><code>both</code> = backwards + forwards. Without it, a delayed element is visible, vanishes, then animates in. Ugly!</p>
<h3>4 · stagger = same animation, growing delays</h3>
<div class="cols"><pre>.bar { animation: up 0.5s ease-out both; }
.bar:nth-child(2) { animation-delay: 0.15s; }
.bar:nth-child(3) { animation-delay: 0.3s; }</pre><div class="demo-bars"><i></i><i></i><i></i><i></i></div></div>
<p><code>:nth-child(2)</code> = the 2nd child inside its parent.</p>`,
  drills:[
    {q:'Which at-rule defines the steps of an animation?', a:['@keyframes'], hint:'Starts with @.'},
    {q:'Inside keyframes, which word means the same as <code>0%</code>?', a:['from'], hint:'from … to …'},
    {q:'Write the declaration: play animation <code>pulse</code>, 1.2s, forever.', a:[{tokens:['animation','pulse','1.2s','infinite']}], kind:'css', show:'animation: pulse 1.2s infinite;'},
    {q:'Which property waits before an animation starts?', a:['animation-delay'], hint:'animation-____'},
    {q:'Which fill-mode keeps the first frame during the delay AND the last frame after?', a:['both'], hint:'backwards + forwards'},
    {q:'Which timing function gives a constant speed (perfect for spinners)?', a:['linear']},
    {q:'Selector for the 3rd <code>.bar</code> inside its parent?', a:[/^\.bar:nth-child\(\s*3\s*\)$/], kind:'css', show:'.bar:nth-child(3)'}
  ],

{
  id:'c3', name:'JS triggers', sub:'menus · scroll · tabs',
  teach:`<div class="eyebrow">Chapter 3 · School</div><h2>JS triggers</h2>
<p>CSS knows <b>how</b> to move. JavaScript decides <b>when</b>: a click, a scroll, an element coming into view. Real motion sites are 80% this pattern.</p>
<div class="flow"><b>event</b><i>→</i><b class="hot">JS: classList / style</b><i>→</i><b class="acc">CSS transition plays</b></div>
<h3>1 · one element vs many</h3>
<div class="cols"><pre>const btn = document.querySelector('.btn');

const cards = document.querySelectorAll('.card');
cards.forEach((card) => {
  card.classList.add('ready');
});</pre><ul><li><code>querySelector</code> → the first match</li><li><code>querySelectorAll</code> → a list of all matches</li><li>a list needs <code>forEach</code> to touch each one</li></ul></div>
<h3>2 · IntersectionObserver = “tell me when it's on screen”</h3>
<div class="flow"><b>you scroll</b><i>→</i><b>card enters viewport</b><i>→</i><b class="hot">observer calls you</b><i>→</i><b class="acc">add .visible</b></div>
<pre>const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.2 });

cards.forEach((card) => observer.observe(card));</pre>
<p><code>threshold: 0.2</code> = fire when 20% of the card is visible.</p>
<h3>3 · scroll math</h3>
<div class="cols"><pre>const max = document.documentElement.scrollHeight - window.innerHeight;
const percent = (window.scrollY / max) * 100;</pre><ul><li><code>scrollHeight</code> → total page height</li><li><code>innerHeight</code> → the visible window</li><li><code>scrollY</code> → how far you scrolled</li></ul></div>
<h3>4 · setting styles from JS</h3>
<pre>indicator.style.width = tab.offsetWidth + 'px';
indicator.style.transform = \`translateX(\${tab.offsetLeft}px)\`;</pre>
<p>Values set from JS still glide if CSS has a <code>transition</code> for them. Numbers need a unit: <code>+ 'px'</code> or <code>+ '%'</code>.</p>
<h3>5 · real-life: defer</h3>
<div class="flow"><b>no defer</b><i>→</i><b>script runs</b><i>→</i><b>HTML not built</b><i>→</i><b class="acc">null 💥</b></div>
<div class="flow"><b>defer</b><i>→</i><b>HTML builds</b><i>→</i><b class="hot">script runs</b><i>→</i><b>elements exist ✨</b></div>
<pre>&lt;script src="js/main.js" defer&gt;&lt;/script&gt;</pre>`,

{
  id:'c4', name:'Easing & timing', sub:'curves · origin · delays',
  teach:`<div class="eyebrow">Chapter 4 · School</div><h2>Easing & timing</h2>
<p>Two sites can move the same box the same distance, and one feels cheap while the other feels expensive. The difference is almost always <b>timing</b>: the curve, the origin and the delays.</p>
<h3>1 · cubic-bezier = your own curve</h3>
<div class="cols"><pre>transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);</pre><ul><li>4 numbers = 2 handles of a curve: <code>(x1, y1, x2, y2)</code></li><li>x values stay between 0 and 1 (time)</li><li><b>y above 1 = overshoot</b>: it goes past the end, then settles back</li></ul></div>
<div class="eases"><div class="ease">ease-out<div class="lane eout"></div></div><div class="ease">overshoot<div class="lane ov"></div></div></div>
<p>Studio favourites: <code>cubic-bezier(0.2, 0.8, 0.2, 1)</code> (smooth premium glide) and <code>cubic-bezier(0.34, 1.56, 0.64, 1)</code> (playful pop).</p>
<h3>2 · transform-origin = the pivot point</h3>
<div class="cols"><pre>.line {
  transform: scaleX(0);
  transform-origin: left;
}</pre><ul><li>default origin is the <b>center</b>: scaling grows both ways</li><li><code>left</code> → grows to the right, like an underline being drawn</li><li>works for rotate too: <code>transform-origin: top left</code></li></ul></div>
<h3>3 · delays make a sequence</h3>
<div class="tl"><div class="ax"></div><div class="seg2" style="left:0;width:45%;background:#121212">card lifts 0.3s</div><div class="seg2" style="left:22%;width:45%;background:#ff4b1f;top:52px;height:22px">arrow slides (delay 0.15s)</div></div>
<pre>transition: transform 0.3s ease 0.15s;</pre>
<div class="flow"><b>transform</b><i>property</i><b>0.3s</b><i>duration</i><b>ease</b><i>curve</i><b class="acc">0.15s</b><i>delay</i></div>
<h3>4 · CSS variables for staggers</h3>
<div class="cols"><pre>&lt;li class="item" style="--i: 0"&gt;
&lt;li class="item" style="--i: 1"&gt;
&lt;li class="item" style="--i: 2"&gt;</pre><pre>.item {
  transition: opacity 0.4s ease;
  transition-delay: calc(var(--i) * 0.08s);
}</pre></div>

  teach:`<div class="eyebrow">Chapter 5 · School</div><h2>Text reveals</h2>
<p>The signature move of studio sites: big type that slides up out of nowhere. The trick is a <b>mask</b>: a box with <code>overflow: hidden</code>, and text that starts below it.</p>
<h3>1 · the mask trick</h3>
<div class="cols"><pre>&lt;h1 class="mask"&gt;&lt;span&gt;Studio&lt;/span&gt;&lt;/h1&gt;

.mask { overflow: hidden; }
.mask span {
  display: inline-block;
  animation: up 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes up {
  from { transform: translateY(100%); }
}</pre><div><div class="flow"><b>span starts 100% lower</b></div><div class="flow"><b class="hot">mask hides what's outside</b></div><div class="flow"><b class="acc">span slides up into view</b></div><ul><li><code>translateY(100%)</code> = down by <b>its own height</b></li><li>no <code>to</code> step? It animates to the normal state</li></ul></div></div>
<h3>2 · splitting text with JS</h3>
<pre>const title = document.querySelector('.split');
const letters = title.textContent.split('');
title.textContent = '';

letters.forEach((letter, i) => {
  const span = document.createElement('span');
  span.textContent = letter;
  span.style.setProperty('--i', i);
  title.appendChild(span);
});</pre>

<h3>3 · steps() = jump instead of glide</h3>

  animation: typing 1.3s steps(13) both;

@keyframes typing { from { width: 0; } }</pre><ul><li><code>ch</code> = the width of one character (perfect in monospace fonts)</li><li><code>steps(13)</code> = 13 jumps → one letter per jump</li><li>a blinking caret: <code>border-right</code> + <code>step-end</code></li></ul></div>`,

  id:'c6', name:'Micro-interactions', sub:'zoom · magnet · cursor · ripple',
  teach:`<div class="eyebrow">Chapter 6 · School</div><h2>Micro-interactions</h2>
<p>The tiny reactions that make a site feel <b>alive</b>: images that breathe, buttons that pull towards your mouse, a custom cursor. They're all mouse events + a bit of math.</p>
<h3>1 · zoom inside a frame</h3>
<div class="cols"><pre>.frame { overflow: hidden; }
.photo { transition: transform 0.6s ease; }
.frame:hover .photo { transform: scale(1.1); }</pre><p>The photo grows, the frame stays the same size and crops it. <code>overflow: hidden</code> again!</p></div>
<h3>2 · where is the mouse?</h3>
<div class="cols"><pre>zone.addEventListener('mousemove', (e) => {
  console.log(e.clientX, e.clientY);
});</pre><ul><li><code>e</code> = the event object, the browser fills it in</li><li><code>e.clientX</code> / <code>e.clientY</code> = mouse position in the window</li><li><code>mouseleave</code> = the mouse left the element</li></ul></div>
<h3>3 · where is the element?</h3>
<pre>const r = zone.getBoundingClientRect();
const centerX = r.left + r.width / 2;
const centerY = r.top + r.height / 2;</pre>
<h3>4 · the magnet formula</h3>
<div class="flow"><b>mouse − center</b><i>=</i><b class="hot">distance</b><i>× 0.3 =</i><b class="acc">how far the button follows</b></div>
<pre>const x = e.clientX - centerX;
const y = e.clientY - centerY;
magnet.style.transform = \`translate(\${x * 0.3}px, \${y * 0.3}px)\`;</pre>
<p>Mouse 100px right of center → button moves 30px right. Smaller number = weaker magnet.</p>
<h3>5 · create, animate, clean up</h3>
<pre>const ripple = document.createElement('span');
ripple.classList.add('ripple');
btn.appendChild(ripple);
ripple.addEventListener('animationend', () => ripple.remove());</pre>
<p>Always remove elements you create for an effect. Otherwise every click leaves one behind, forever.</p>`,

  },

    id:'magnet', title:'Magnetic button', act:{label:'mouse moves near the button', a:{type:'move',sel:'.zone',ox:100,oy:-50}},
    brief:'When the mouse moves inside the zone, the button is pulled towards it (30% of the distance). When the mouse leaves, it springs back.',
    specs:[['follows','(mouse − zone center) × 0.3'],['transition','transform 0.2s ease-out'],['on leave','back to the center'],['listen on','.zone']],

    js:`const zone = document.querySelector('.zone');

  id:'c7', name:'Scroll storytelling', sub:'sticky · parallax · horizontal',
  teach:`<div class="eyebrow">Chapter 7 · School</div><h2>Scroll storytelling</h2>
<p>On Marcelo-style sites, scrolling is the play button. Things stick, slide sideways and move at different speeds. All of it comes from a few building blocks.</p>
<h3>1 · position: sticky</h3>
<div class="cols"><pre>.bar-top {
  position: sticky;
  top: 0;
}</pre><p>Scrolls normally until it reaches <code>top: 0</code>, then sticks. It stays inside its parent: when the parent scrolls away, it goes too. That's the base of every pinned section.</p></div>
<h3>2 · scroll direction</h3>
<pre>let lastY = window.scrollY;
window.addEventListener('scroll', () => {
  if (window.scrollY > lastY) {  }
  lastY = window.scrollY;
});</pre>
<div class="flow"><b>scrollY bigger</b><i>→</i><b class="hot">going down</b><i> · </i><b>scrollY smaller</b><i>→</i><b class="acc">going up</b></div>
<h3>3 · parallax = different speeds</h3>
<pre>orb.style.transform = \`translateY(\${window.scrollY * 0.5}px)\`;</pre>
<p>The orb moves down half as fast as you scroll, so it seems farther away. 0 = scrolls normally, 1 = stays fixed on screen.</p>
<h3>4 · progress through a section</h3>
<pre>const top = wrap.getBoundingClientRect().top;
const max = wrap.offsetHeight - window.innerHeight;
const progress = Math.min(Math.max(-top / max, 0), 1);</pre>
<div class="flow"><b>section top hits window top</b><i>→</i><b class="hot">0</b><i>…</i><b class="acc">1</b><i>←</i><b>section bottom hits window bottom</b></div>
<p><code>Math.min(Math.max(value, 0), 1)</code> = <b>clamp</b>: keep a number between 0 and 1.</p>
<h3>5 · horizontal scroll section</h3>
<div class="flow"><b>tall wrapper (300vh)</b><i>→</i><b>sticky screen inside</b><i>→</i><b class="hot">progress</b><i>→</i><b class="acc">translateX the track</b></div>`,

{
  id:'c8', name:'JS timelines', sub:'element.animate · await · scrub',
  teach:`<div class="eyebrow">Chapter 8 · School</div><h2>JS timelines</h2>
<p>Classes are great for on/off. But for <b>sequences</b> (this, then that, then that) you want to animate straight from JavaScript. Browsers have that built in: the <b>Web Animations API</b>. It's the same idea GSAP is built around, so this chapter is your bridge to GSAP.</p>
<h3>1 · element.animate(keyframes, options)</h3>
<div class="cols"><pre>panel.animate(
  [
    { transform: 'translateX(0)' },
    { transform: 'translateX(240px)' }
  ],
  { duration: 700, easing: 'ease-out', fill: 'forwards' }
);</pre><ul><li>keyframes = an <b>array</b> of states (from → to)</li><li><code>duration</code> is in <b>milliseconds</b>: 700, not 0.7s</li><li><code>fill: 'forwards'</code> = keep the last frame</li><li><code>delay</code>, <code>iterations: Infinity</code> also exist</li></ul></div>
<h3>2 · CSS ↔ JS dictionary</h3>
<pre>@keyframes + animation: rise 0.6s ease-out both
el.animate([...], { duration: 600, easing: 'ease-out', fill: 'both' })</pre>
<h3>3 · stagger with the index</h3>
<pre>dots.forEach((dot, i) => {
  dot.animate(frames, { duration: 400, delay: i * 100, fill: 'both' });
});</pre>
<h3>4 · then… then… with await</h3>
<div class="flow"><b>title rises</b><i>→ await .finished →</i><b>subtitle fades</b><i>→ await →</i><b class="acc">button pops</b></div>
<pre>async function intro() {
  await title.animate(frames, options).finished;
  await sub.animate(frames, options).finished;
  btn.animate(frames, options);
}
intro();</pre>
<p>⚠️ Elements that animate later are visible until their turn. Hide them in CSS first (<code>opacity: 0</code> / <code>scale(0)</code>), and let <code>fill</code> keep the end state.</p>
<h3>5 · scrubbing = scroll controls time</h3>
<div class="flow"><b>animation.pause()</b><i>→</i><b class="hot">scroll</b><i>→</i><b class="acc">currentTime = progress × duration</b></div>
<pre>const spin = wheel.animate(frames, { duration: 1000, fill: 'both' });
spin.pause();
window.addEventListener('scroll', () => {
  spin.currentTime = progress * 1000;
});</pre>
<p>This is exactly what GSAP's <b>ScrollTrigger scrub</b> does. You now know how it works inside.</p>`,

const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.2 });

reveals.forEach((el) => observer.observe(el));`,

    teach:`<div class="eyebrow">Chapter 9 · School</div><h2>The Studio Build</h2>
<p>Time to ship a real site: <b>Verdant Studio</b>, a Marcelo-style one-pager. Six stages, one project. Your files <b>carry over</b> from stage to stage, just like a real repo. Everything you need, you've already practised.</p>
<div class="flow"><b>1 Hero</b><i>→</i><b>2 Work grid</b><i>→</i><b>3 Smart nav</b><i>→</i><b>4 Contact + cursor</b><i>→</i><b>5 Horizontal</b><i>→</i><b class="acc">6 Marquee + launch</b></div>
<h3>1 · how a real project is organised</h3>
<div class="cols"><pre>verdant/
├── index.html
├── css/
│   ├── kit.css
│   └── style.css
└── js/
    └── main.js</pre><ul><li><b>kit.css</b> = layout and colours (given, like a design system)</li><li><b>style.css</b> = all your motion</li><li><b>main.js</b> = all your triggers, loaded with <code>defer</code></li><li>link kit.css <b>before</b> style.css, so your styles win</li></ul></div>
<h3>2 · one script, many features</h3>
<p>Every stage adds code to the <b>same</b> main.js. Use clear, different names per feature (<code>nav</code>, <code>menu</code>, <code>zone</code>, <code>track</code>…). Two <code>const</code>s with the same name break the whole file.</p>
<h3>3 · sections, in order</h3>
<div class="flow"><b>header.nav</b><i>→</i><b>nav.menu</b><i>→</i><b>section.hero</b><i>→</i><b>section.work</b><i>→</i><b>section.h-wrap</b><i>→</i><b>section.contact</b><i>→</i><b>footer</b><i>→</i><b>div.cursor</b></div>
<h3>4 · finishing like a pro</h3>
<ul><li>Animate <b>transform</b> and <b>opacity</b> only</li><li>Respect <code>prefers-reduced-motion</code></li><li>Test on your phone: open the GitHub Pages link and scroll it</li></ul>
<h3>5 · ship it</h3>
<div class="flow"><b>⬇ export folder</b><i>→</i><b>new GitHub repo</b><i>→</i><b>upload the files</b><i>→</i><b>Settings → Pages</b><i>→</i><b class="acc">live URL ✦</b></div>`,

      {q:'Which <code>&lt;script&gt;</code> attribute lets main.js sit in the head safely?', a:['defer']},
      {q:'Two features both declare <code>const nav</code> in main.js. What happens?', a:['error','syntax error','it breaks','the script breaks','nothing runs','crash','an error'], hint:'JavaScript refuses to declare the same const twice.'},
      {q:'A marquee has its text twice. How far does the track move for a seamless loop? (CSS value)', a:[/^translatex\(\s*-50%\s*\)$/, /^-50%$/], kind:'css', show:'translateX(-50%)'}
    ],

      const n = i + 1;

        id:'studio' + n, kit: SITEKIT, stage:n,

        bp: SLOTS.filter((x) => x.st === n).flatMap((x) => x.html.split('\n').map((l) => { const m = l.match(/^(\s*)<([a-z0-9]+)([^>]*)>(.*)$/i); if (!m) return null; const cls = (m[3].match(/class="([^"]+)"/) || [,''])[1]; const txt = m[4].replace(/<[^>]+>/g, '').trim(); return [m[1] + m[2] + (cls ? '.' + cls.split(' ').join('.') : ''), txt ? 'text: ' + txt : '']; }).filter(Boolean))
      });
    })
  };

  id:'c15', name:'App glue', sub:'themes · popups · safe text · numbers · SVG maps · files',
  teach:`<div class="eyebrow">Chapter 15 · School</div><h2>App glue</h2>
<p>Motion makes a site feel alive. These eight small patterns make it work like an <b>app</b>: dashboards, tools, admin pages. You will meet every one of them again in your own projects (Rebble rebuilds them line by line).</p>
<div class="flow"><b>script starts</b><i>→</i><b>theme set</b><i>→</i><b>data drawn safely</b><i>→</i><b class="hot">user clicks</b><i>→</i><b class="acc">popup opens / closes</b></div>
<h3>1 · when may my script start?</h3>
<div class="cols"><pre>&lt;script src="js/main.js" defer&gt;&lt;/script&gt;

document.addEventListener('DOMContentLoaded', () => {
  init();
});</pre><ul><li><code>defer</code> = download now, run after the HTML is read</li><li><code>DOMContentLoaded</code> = an event that fires at that same moment</li><li>with <code>defer</code> you don't strictly need it, but many projects wrap their start-up code in it anyway: it says "start here"</li><li>without either, a script in the head runs before the page exists: <code>querySelector</code> returns <code>null</code></li></ul></div>
<h3>2 · themes: one attribute switches every colour</h3>
<div class="cols"><pre>[data-theme="light"] { --bg: #f4f2ee; --text: #1b1b1f; }
[data-theme="dark"]  { --bg: #16161a; --text: #f2f2f2; }

body {
  background: var(--bg);
  color: var(--text);
  transition: background-color 0.4s ease;
}

document.documentElement.setAttribute('data-theme', 'dark');</pre><ul><li><code>document.documentElement</code> = the <code>&lt;html&gt;</code> element</li><li>same token names in both blocks, different values</li><li>a transition on the colours makes the switch fade instead of flash</li><li>save the choice in <code>localStorage</code> and set it again on start</li></ul></div>
<h3>3 · popups: backdrop click and Escape</h3>
<div class="flow"><b>click button</b><i>→</i><b class="hot">.overlay.open</b><i>→</i><b>click backdrop / Esc / ✕</b><i>→</i><b class="acc">remove .open</b></div>
<div class="cols"><pre>overlay.addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closePopup();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePopup();
});</pre><ul><li><code>e.target</code> = what you actually clicked</li><li><code>e.currentTarget</code> = the element that owns the listener (the overlay)</li><li>equal = you clicked the dark backdrop, not the box inside</li><li>hide with <code>opacity: 0</code> + <code>pointer-events: none</code> so it can fade</li></ul></div>
<h3>4 · user text: textContent, not innerHTML</h3>
<div class="cols"><pre>li.textContent = site.name;
li.innerHTML = site.name;</pre><ul><li><code>textContent</code> shows the text exactly as written: <code>&lt;b&gt;</code> stays visible as characters</li><li><code>innerHTML</code> <b>runs</b> it as HTML. Text from users or an API in innerHTML = XSS: someone can inject a script</li><li>when you must build HTML strings, escape the text first (<code>&amp;</code> → <code>&amp;amp;</code>, <code>&lt;</code> → <code>&amp;lt;</code> …)</li></ul></div>
<h3>5 · numbers people can read</h3>
<pre>(12450).toLocaleString('en-US')   // "12,450"
(12450).toLocaleString('nl-BE')   // "12.450"
(0.734 * 100).toFixed(1) + '%'    // "73.4%"</pre>
<p>Pass the locale yourself, so every computer shows the same thing.</p>
<h3>6 · from data to SVG positions: scaling a range</h3>
<div class="flow"><b>value in its range</b><i>→ (value − min) / (max − min) →</i><b>0 … 1</b><i>→ × width →</i><b class="acc">pixels</b></div>
<div class="cols"><pre>function toXY(lat, lng) {
  const x = ((lng - B.minLng) / (B.maxLng - B.minLng)) * W;
  const y = H - ((lat - B.minLat) / (B.maxLat - B.minLat)) * H;
  return [Math.round(x), Math.round(y)];
}</pre><ul><li>works for maps, charts, sliders, gauges: any "this range onto that range"</li><li>SVG's y grows <b>down</b>, latitude grows <b>up</b>: flip with <code>H − …</code></li><li>give the <code>&lt;svg&gt;</code> a <code>viewBox</code> and the browser scales the drawing to any size</li></ul></div>
<h3>7 · reading a file the user picks</h3>
<div class="cols"><pre>&lt;input type="file" id="pick" accept=".csv"&gt;

const input = document.querySelector('#pick');
input.addEventListener('change', async () => {
  const text = await input.files[0].text();
  console.log(text);
});</pre><ul><li><code>input.files</code> = the list of chosen files (empty until you pick)</li><li><code>.text()</code> reads one as a string; it returns a promise, so <code>await</code></li><li>nothing is uploaded yet: the file stays in the browser until you <code>fetch</code> it somewhere</li></ul></div>
<h3>8 · handing the user a file to save</h3>
<div class="flow"><b>text</b><i>→</i><b>new Blob([text])</b><i>→</i><b>URL.createObjectURL()</b><i>→</i><b class="acc">&lt;a download&gt;.click()</b></div>
<pre>const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
const a = document.createElement('a');
a.href = url;
a.download = 'export.csv';
a.click();
setTimeout(() =&gt; URL.revokeObjectURL(url), 1000);</pre>
<p>A <b>Blob</b> is a file that lives in memory. The object URL points at it, <code>download</code> says "save, don't open", and revoking later frees the memory.</p>`,

  teach:`<div class="eyebrow">Chapter 10 · Advanced · School</div><h2>3D & depth</h2>
<p>Studio sites love depth: cards that flip, panels that tilt towards your mouse, layers that float at different distances. CSS has a real 3D engine. You only need four ideas.</p>
<h3>1 · perspective = the camera</h3>
<div class="cols"><pre>.scene3d {
  perspective: 800px;
}</pre><ul><li>goes on the <b>parent</b>, not the moving element</li><li>it's the distance from your eye to the screen</li><li><b>smaller = stronger 3D</b> (400px dramatic, 1200px subtle)</li></ul></div>
<h3>2 · the three axes</h3>
<div class="flow"><b>rotateY</b><i>turns like a door</i><b>rotateX</b><i>tips like a laptop lid</i><b class="acc">translateZ</b><i>moves towards you</i></div>
<h3>3 · keep children in 3D</h3>
<div class="cols"><pre>.flip { transform-style: preserve-3d; }
.face { backface-visibility: hidden; }
.back { transform: rotateY(180deg); }</pre><ul><li><code>preserve-3d</code> = children live in the same 3D space (without it, everything gets flattened)</li><li><code>backface-visibility: hidden</code> = you can't see a face from behind</li><li>the back face starts already turned around, so it faces you when the card flips</li></ul></div>
<h3>4 · mouse → angle</h3>
<pre>const px = (e.clientX - r.left) / r.width - 0.5;
card.style.transform = 'rotateY(' + px * 30 + 'deg)';</pre>
<div class="flow"><b>left edge = −0.5</b><i>→</i><b>center = 0</b><i>→</i><b>right edge = +0.5</b><i>× 30 →</i><b class="acc">−15° … +15°</b></div>
<h3>5 · CSS variables from JS</h3>
<pre>layers.style.setProperty('--mx', mx);

.l3 { transform: translate(calc(var(--mx, 0) * 90px), 0); }</pre>
<p>JS only sends <b>one number</b>. CSS decides how far each layer travels. Bigger multiplier = closer layer = more movement. <code>var(--mx, 0)</code> uses 0 until JS sets it.</p>`,

  &lt;path d="M14 112 C 60 20 …" /&gt;
&lt;/svg&gt;</pre><ul><li><code>viewBox</code> = the drawing's own coordinate system</li><li><code>d</code> = the pen's instructions (move, curve…)</li><li>style it with CSS: <code>stroke</code>, <code>stroke-width</code>, <code>fill: none</code></li></ul></div>

  teach:`<div class="eyebrow">Chapter 12 · Advanced · School</div><h2>Modern CSS</h2>
<p>Newer CSS can do things that needed JavaScript a few years ago: animations driven by scrolling, stacked sticky cards, frosted glass. Less code, and the browser runs it more smoothly.</p>
<h3>1 · scroll-driven animations</h3>
<div class="cols"><pre>.sbar {
  animation: grow linear both;
  animation-timeline: scroll();
}</pre><ul><li>no duration: the <b>scrollbar</b> is the clock</li><li>top of the page = 0%, bottom = 100%</li><li>⚠️ write <code>animation-timeline</code> <b>after</b> the shorthand. The shorthand resets it.</li></ul></div>
<h3>2 · view() = while it crosses the screen</h3>
<pre>.vcard {
  animation: reveal linear both;
  animation-timeline: view();
  animation-range: entry 0% cover 30%;
}</pre>
<div class="flow"><b>entry 0%</b><i>card peeks in at the bottom</i><b class="acc">cover 30%</b><i>animation done</i></div>
<p>It's the scroll reveal from chapter 3 with <b>zero JavaScript</b>, and it plays backwards when you scroll up.</p>
<h3>3 · browser support</h3>
<p>Scroll-driven animations work in Chrome, Edge and Safari 26+. Firefox still keeps them behind a flag (as of mid-2026). So wrap them: <code>@supports (animation-timeline: scroll()) { … }</code> and keep the content visible otherwise. Check <b>caniuse.com</b> before you rely on new CSS.</p>
<h3>4 · sticky stacking</h3>
<pre>.card-s { position: sticky; top: calc(24px + var(--i) * 18px); }</pre>
<p>Each card sticks a little lower than the one before, so they pile up like a deck. Pure CSS.</p>
<h3>5 · liquid glass</h3>
<pre>.glass {
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(16px);
}</pre>

  teach:`<div class="eyebrow">Chapter 13 · Advanced · School</div><h2>Page transitions</h2>
<p>On studio sites, pages never just <i>blink</i> into the next one. A curtain sweeps over, a thumbnail grows into a full page, a loader counts up and lifts away. The trick is always the same: <b>hide the swap behind motion</b>.</p>
<div class="flow"><b>animate out</b><i>→</i><b class="hot">swap content (hidden)</b><i>→</i><b class="acc">animate in</b></div>
<h3>1 · the curtain wipe</h3>
<div class="tl"><div class="ax"></div><div class="seg2" style="left:0;width:48%;background:#121212">curtain covers 0 → 0.5s</div><div class="seg2" style="left:52%;width:48%;background:#ff4b1f">curtain leaves 0.5 → 1s</div><div class="lbl" style="left:44%">swap here ↑</div></div>
<pre>setTimeout(() => {
  a.classList.toggle('active');
  b.classList.toggle('active');
}, 500);</pre>
<h3>2 · restarting a CSS animation</h3>
<pre>wipe.classList.remove('run');
void wipe.offsetWidth;
wipe.classList.add('run');</pre>
<p>Removing and re-adding a class in the same moment does nothing: the browser never sees the change. Reading <code>offsetWidth</code> in between forces it to update (a "reflow"), so the animation plays again.</p>
<h3>3 · the View Transitions API</h3>
<pre>if (!document.startViewTransition) {
  swap();
} else {
  document.startViewTransition(() => swap());
}</pre>
<ul><li>the browser screenshots the old page, runs your swap, then crossfades to the new one</li><li>style it with <code>::view-transition-old(root)</code> and <code>::view-transition-new(root)</code></li><li>always <b>feature-detect</b>: older browsers just swap instantly</li></ul>

  id:'c14', name:'Feel & polish', sub:'60fps · lerp · @property · snap', adv:true,
  teach:`<div class="eyebrow">Chapter 14 · Advanced · School</div><h2>Feel &amp; polish</h2>
<p>Two sites can use the exact same effects, and one feels <i>expensive</i> while the other feels cheap. The difference is <b>smoothness</b>: no stutter, motion that eases in from where it was, and scrolling that lands exactly where it should. This chapter is the polish layer studio sites put on top of everything you already know.</p>
<h3>1 · the 60fps budget: what is cheap to animate?</h3>
<div class="flow"><b>Layout</b><i>width, height, top, left, margin</i><b class="hot">Paint</b><i>color, background, shadow</i><b class="acc">Composite</b><i>transform, opacity</i></div>
<ul><li>the browser draws a new frame about <b>60 times a second</b>: roughly 16ms per frame</li><li>animating <code>top</code> or <code>width</code> makes it redo the <b>whole layout</b> every frame, which causes stutter ("jank")</li><li><code>transform</code> and <code>opacity</code> skip straight to the last step: the GPU just moves a picture</li><li><code>will-change: transform</code> warns the browser in advance. Use it on <i>a few</i> elements that really move a lot, never on everything</li></ul>
<pre>.slow { transition: left 0.3s; }
.fast { transition: transform 0.3s; }</pre>
<h3>2 · requestAnimationFrame: your own animation loop</h3>
<div class="cols"><pre>function tick() {
  requestAnimationFrame(tick);
}
tick();</pre><ul><li>"call <code>tick</code> again right before the next frame is drawn"</li><li>so <code>tick</code> runs ~60 times a second, perfectly in sync with the screen</li><li>it pauses by itself when the tab is hidden, unlike <code>setInterval</code></li></ul></div>
<h3>3 · lerp: the secret of "buttery" motion</h3>
<p><b>Lerp</b> (linear interpolation) means: every frame, move a <b>fraction</b> of the remaining distance. Far away? Big steps. Almost there? Tiny steps. That's a natural ease-out, and it keeps working while the target moves.</p>
<pre>x += (target - x) * 0.1;</pre>
<div class="tl"><div class="ax"></div><div class="seg2" style="left:0;width:34%;background:#ff4b1f">frame 1: gap 100 → 90</div><div class="seg2" style="left:36%;width:30%;background:#56524b">frame 2: 90 → 81</div><div class="seg2" style="left:68%;width:32%;background:#121212">frame 20: → 12</div></div>
<ul><li><code>0.1</code> = smooth and floaty, <code>0.3</code> = snappy. That one number is the whole feel</li><li>Marcelo-style cursors, magnetic blobs and "smooth scroll" libraries like <b>Lenis</b> are all this one line inside a <code>requestAnimationFrame</code> loop</li></ul>
<h3>4 · @property: teach CSS what a variable is</h3>
<div class="cols"><pre>@property --x {
  syntax: '&lt;length&gt;';
  inherits: false;
  initial-value: 0px;
}</pre><ul><li>a normal <code>--x</code> is just text to the browser, so animating it <b>jumps</b> halfway</li><li>register it with a type and the browser can <b>tween</b> it smoothly</li><li>unlocks things transitions can't do, like spinning a <code>conic-gradient</code> border</li></ul></div>
<h3>5 · scroll-snap: scrolling that lands perfectly</h3>
<pre>.row  { scroll-snap-type: x mandatory; }
.card { scroll-snap-align: start; }</pre>
<ul><li>the <b>container</b> says which direction and how strict (<code>mandatory</code> = always land on a card)</li><li>each <b>child</b> says which edge snaps: <code>start</code>, <code>center</code> or <code>end</code></li><li>pure CSS, works with touch, trackpad and mouse wheel</li></ul>
<h3>6 · polish checklist</h3>
<div class="flow"><b>transform + opacity</b><i>→</i><b>ease-out, not linear</b><i>→</i><b class="hot">nothing pops, everything eases</b><i>→</i><b class="acc">prefers-reduced-motion</b></div>`,

  id:'c0', name:'Foundations', sub:'position · z-index · units · JS basics',
  teach:`<div class="eyebrow">Chapter 0 · School</div><h2>Foundations</h2>
<p>Every effect in Webble quietly relies on a few basics: where an element <b>sits</b>, which one is <b>on top</b>, how big things are in <b>screen units</b>, and a handful of JavaScript habits. Learn them once and every later chapter gets easier.</p>
<h3>1 · position: who is my reference?</h3>
<div class="flow"><b>static</b><i>normal flow (default)</i><b>relative</b><i>nudge from its own spot, and becomes a reference</i><b class="hot">absolute</b><i>placed inside the nearest positioned parent</i><b class="acc">fixed</b><i>placed on the screen, ignores scrolling</i><b>sticky</b><i>flows, then sticks</i></div>
<div class="cols"><pre>.card0 { position: relative; }
.badge0 {
  position: absolute;
  top: -12px;
  right: -12px;
}</pre><ul><li><code>absolute</code> looks up the tree for the first parent that isn't <code>static</code></li><li>forget <code>position: relative</code> on the parent and it uses the whole page instead</li><li><code>top / right / bottom / left</code> are distances from that reference</li></ul></div>
<h3>2 · z-index: who is on top?</h3>
<div class="cols"><pre>.s2 { z-index: 2; }
.sheet0:hover { z-index: 5; }</pre><ul><li>later in the HTML = on top, by default</li><li><code>z-index</code> needs a <b>positioned</b> element (anything but <code>static</code>), or a flex / grid item</li><li>higher number wins, inside the same parent</li></ul></div>
<h3>3 · units</h3>
<pre>px    fixed pixels                   border: 1px
%     of the parent                  width: 50%
vw/vh % of the screen (1vw = 1%)     height: 100vh
rem   of the root font size (16px)   font-size: 2rem
ch    width of one character         max-width: 60ch</pre>
<h3>4 · JS you'll write a hundred times</h3>
<div class="cols"><pre>let x = 0;
x += 40;

btn.addEventListener('click', () => {
  panel.style.transform = \`translateX(\${x}px)\`;
});</pre><ul><li><code>const</code> = never reassigned · <code>let</code> = will change</li><li><code>() => { }</code> = an arrow function: a short way to write a function</li><li>backticks <code>\`…\${x}…\`</code> = template literal: put a value <b>inside</b> a string</li><li><code>(e) => …</code> = the browser passes you an <b>event object</b> with details (clientX, target…)</li><li><code>addEventListener('click', …)</code> = run this function on every click (the full story is in chapter 1)</li></ul></div>
<h3>5 · transform: move without breaking the layout</h3>
<div class="cols"><pre>transform: translateX(40px);
transform: translateY(-8px);
transform: scale(1.1);
transform: rotate(45deg);
transform: translateY(-8px) scale(1.05);</pre><ul><li><b>translate</b> = move · <b>scale</b> = resize · <b>rotate</b> = turn</li><li>the element keeps its spot in the layout: <b>neighbours don't move</b></li><li>that's why it's smooth and cheap: the browser only repaints the element</li><li>combine several with spaces. A new <code>transform</code> line <b>replaces</b> the old one, it doesn't add to it</li></ul></div>
<h3>6 · when it doesn't work</h3>
<div class="flow"><b>1 · read the console</b><i>→</i><b>2 · check capitals & typos</b><i>→</i><b>3 · did the selector find it?</b><i>→</i><b>4 · is the script loaded (defer)?</b><i>→</i><b class="acc">5 · console.log the value</b></div>
<pre>console.log(x);
console.log(document.querySelector('.panel'));</pre>

function crc32(u8){ let c, t = crc32.t; if (!t) { t = crc32.t = []; for (let n = 0; n < 256; n++) { c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } } let crc = 0 ^ -1; for (let i = 0; i < u8.length; i++) crc = (crc >>> 8) ^ t[(crc ^ u8[i]) & 0xFF]; return (crc ^ -1) >>> 0; }
