<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7ebef">
<title>Poshle — PowerShell muscle memory</title>
<style>
:root{
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", Consolas, monospace;
  --r: 4px;
  --rail: 256px;
  --keys: 316px;
  --top: 56px;
}
html[data-theme="day"]{
  --bg:#e7ebef; --panel:#f8f9fb; --sunk:#eef1f4; --ink:#151e27; --strong:#0a1118;
  --muted:#5d6b79; --faint:#8a97a3; --line:#d4dae0; --hair:#e2e7ec;
  --accent:#1f6feb; --accent-soft:#dbe7fb; --good:#1a7f4b; --good-soft:#d9efe3; --warn:#b5532a;
}
html[data-theme="night"]{
  --bg:#0e1419; --panel:#151c22; --sunk:#111920; --ink:#d9e2e8; --strong:#f1f6f9;
  --muted:#8a9dab; --faint:#65788a; --line:#242f38; --hair:#1d262e;
  --accent:#5aa2ff; --accent-soft:#132b47; --good:#4cc38a; --good-soft:#12301f; --warn:#e98a5c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{height:var(--top);display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px;flex:none}
.brand b{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--strong);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--faint)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex:none}
.seg button{padding:6px 12px;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.stats{display:flex;gap:18px;margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats div{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.stats b{font-size:15px;color:var(--strong);font-weight:600}
.tbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r);color:var(--muted);flex:none}
.tbtn:hover{background:var(--sunk);color:var(--ink)}

.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--keys);height:calc(100vh - var(--top))}
.rail{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 0 24px}
.rail h4{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 16px 8px}
.rail hr{border:none;border-top:1px solid var(--line);margin:12px 16px}
.sc{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 16px;border-left:3px solid transparent}
.sc:hover{background:var(--sunk)}
.sc.on{background:var(--sunk);border-left-color:var(--accent)}
.sc i{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:600;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r);color:var(--muted);background:var(--panel)}
.sc.on i{border-color:var(--accent);color:var(--accent)}
.sc.full i{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.sc b{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600;color:var(--strong)}
.sc b em{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--faint)}
.sc.full b em{color:var(--good)}
.sc small{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc > span{min-width:0}
.bar{height:3px;background:var(--hair);border-radius:2px;margin-top:5px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.sc.full .bar span{background:var(--good)}

.stage{display:flex;flex-direction:column;gap:14px;padding:16px;min-width:0;min-height:0}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;flex:none}
.bhead{display:flex;align-items:center;gap:12px}
.bhead h2{font-size:15px;font-weight:650;color:var(--strong)}
.bhead .count{font-family:var(--mono);font-size:12px;color:var(--faint)}
.bhead .acts{margin-left:auto;display:flex;gap:6px}
.chip{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r);color:var(--muted);background:var(--panel)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.prime{background:var(--accent);border-color:var(--accent);color:#fff}
.task{margin-top:8px;font-size:14.5px;color:var(--ink);max-width:88ch}
.task kbd,.kbd{font-family:var(--mono);font-size:11.5px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--sunk);color:var(--strong);white-space:nowrap}
.target{margin-top:10px;font-family:var(--mono);font-size:13px;padding:8px 10px;background:var(--sunk);border:1px solid var(--hair);border-radius:var(--r);color:var(--strong);white-space:pre-wrap;overflow-wrap:anywhere}
.target.multi{white-space:pre;overflow-wrap:normal;overflow-x:auto}
.target.hidden{color:var(--faint);font-style:italic;font-family:var(--sans)}
.dots{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.dots span{width:18px;height:6px;border-radius:2px;background:var(--hair)}
.dots span.done{background:var(--faint)}
.dots span.clean{background:var(--good)}
.dots span.cur{background:var(--accent)}

.term{flex:1;min-height:0;display:flex;flex-direction:column;background:#1e1e1e;border-radius:8px;border:1px solid #000;box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden;position:relative}
.tbar{height:30px;flex:none;display:flex;align-items:center;padding:0 12px;background:linear-gradient(#3a3a3a,#2e2e2e);border-bottom:1px solid #111;position:relative}
.tbar .lights{display:flex;gap:8px}
.tbar .lights span{width:12px;height:12px;border-radius:50%}
.tbar .lights span:nth-child(1){background:#ff5f57}
.tbar .lights span:nth-child(2){background:#febc2e}
.tbar .lights span:nth-child(3){background:#28c840}
.tbar .ttl{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:#a8a8a8;pointer-events:none}
.screen{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.45;color:#d4d4d4;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.screen::-webkit-scrollbar{width:10px}
.screen::-webkit-scrollbar-thumb{background:#444;border-radius:5px}
.ln{min-height:1.45em}
.p{color:#d4d4d4}
.cp{color:#7a7a7a}
.k-cmd{color:#e5e510}
.k-str{color:#29b8db}
.k-var{color:#23d18b}
.k-par{color:#8a8a8a}
.k-op{color:#8a8a8a}
.k-num{color:#ffffff}
.k-type{color:#b0b0b0}
.k-com{color:#3c9b3c}
.ghost{color:#6b6b6b}
.cur{background:#d4d4d4;color:#1e1e1e}
.blur .cur{background:transparent;color:inherit;outline:1px solid #9a9a9a;outline-offset:-1px}
.err{color:#f14c4c}
.coach{color:#c586c0}
.coach b{color:#e0a8dc;font-weight:600}
.ok{color:#23d18b}
.dim{color:#8a8a8a}
.srch{color:#d4d4d4}
.srch.fail{color:#f14c4c}
.hl{background:#5a4b00}
#ta{position:absolute;left:-9999px;top:0;width:10px;height:10px;opacity:0}

.keys{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 14px 24px}
.keys h4{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.keys h4:first-child{margin-top:0}
.kr{display:grid;grid-template-columns:78px 1fr 24px;gap:8px;align-items:center;min-height:30px;padding:3px 6px;border-radius:var(--r);font-size:12.5px;color:var(--muted);transition:background .25s}
.kr .ks{display:flex;gap:3px}
.kr .also{display:block;font-size:11px;color:var(--faint)}
.kr .n{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
.kr.flash{background:var(--accent-soft);color:var(--strong)}
.kr.used .n{color:var(--accent)}
.tip{margin-top:16px;font-size:12px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:var(--r)}
.tip b{color:var(--strong)}

.brief.case{max-height:56vh;overflow-y:auto}
.cl-h{margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.clues{margin-top:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.clue{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;align-items:start;padding:7px 10px;border:1px solid var(--hair);border-radius:var(--r);background:var(--sunk);font-size:12.5px;line-height:1.4;color:var(--faint)}
.clue i{font-style:normal;font-family:var(--mono);font-size:11.5px;font-weight:700;line-height:1.5}
.clue.got{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.clue.got i{color:var(--good)}
.cnote{margin-top:10px;font-size:12.5px;color:var(--muted);max-width:88ch}
.opts{display:grid;gap:6px;margin-top:6px}
.opt{text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:13.5px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.no{border-color:var(--warn);color:var(--warn)}
.opt.yes{border-color:var(--good);background:var(--good-soft);color:var(--strong)}
.verdict{margin-top:10px;padding:10px 12px;border-left:3px solid var(--good);background:var(--sunk);border-radius:0 var(--r) var(--r) 0;font-size:13.5px;max-width:88ch}
.verdict.bad{border-left-color:var(--warn)}
.verdict b{color:var(--strong)}
.verdict .lesson{margin-top:8px;color:var(--ink)}
.sc.solved i{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.sc.solved small{color:var(--good)}

@media (max-width:1180px){
  .shell{grid-template-columns:var(--rail) minmax(0,1fr)}
  .keys{display:none}
  .keys.open{display:block;position:fixed;right:0;top:var(--top);bottom:0;width:var(--keys);z-index:30;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
  #keysBtn{display:grid}
}
@media (min-width:1181px){ #keysBtn{display:none} }
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .rail.open{display:block;position:fixed;left:0;top:var(--top);bottom:0;width:var(--rail);z-index:30;box-shadow:8px 0 30px rgba(0,0,0,.15)}
  .top{gap:10px}
  .bhead{flex-wrap:wrap;row-gap:6px}
  .bhead h2{flex-basis:100%}
  .stats{display:none}
  #keysBtn{margin-left:auto}
  .brand span{display:none}
  .stage{padding:10px}
  #railBtn{display:grid}
}
@media (min-width:761px){ #railBtn{display:none} }
</style>
</head>
<body>
<header class="top">
  <button class="tbtn" id="railBtn" aria-label="Scenarios"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand"><b>Poshle</b><span>PowerShell muscle memory</span></div>
  <div class="seg" id="modeSeg">
    <button data-mode="ghost">Ghost</button>
    <button data-mode="recall">Recall</button>
  </div>
  <div class="stats">
    <div><b id="stWpm">–</b>last wpm</div>
    <div><b id="stAvg">–</b>avg wpm</div>
    <div><b id="stClean">0/0</b>clean</div>
    <div><b id="stStreak">0</b>streak</div>
  </div>
  <button class="tbtn" id="keysBtn" aria-label="Shortcuts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h0M7 14h10"/></svg></button>
  <button class="tbtn" id="themeBtn" aria-label="Switch theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg></button>
</header>

<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main class="stage">
    <section class="brief" id="brief"></section>
    <section class="term" id="term">
      <div class="tbar"><div class="lights"><span></span><span></span><span></span></div><div class="ttl">pwsh — user         — 120×32</div></div>
      <div class="screen" id="screen"><div id="scroll"></div><div class="ln" id="live"></div></div>
      <textarea id="ta" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    </section>
  </main>
  <aside class="keys" id="keys"></aside>
</div>

<script>
const PROMPT = "PS /Users/user        > ";
const CONT = ">> ";

const USER_TABLE = "\nDisplayName Id                                   Mail             UserPrincipalName\n----------- --                                   ----             -----------------\nLena Maes   6f1c2e8a-0b4d-4f7e-9c2a-1d3e5f7a9b0c user@contoso.com user@contoso.com\n";
const ADMIN_TABLE = "\nDisplayName Id                                   Mail              UserPrincipalName\n----------- --                                   ----              -----------------\nIT Admin    0a9e4c71-3b2f-4d8a-b6e5-7c1f2a3d4e5f admin@contoso.com admin@contoso.com\n";
const WELCOME = "Welcome to Microsoft Graph!\n\nConnected via delegated access using 14d82eec-204b-4c2f-b7e8-296a70dab67e\nReadme: https://aka.ms/graph/sdk/powershell\nSDK Docs: https://aka.ms/graph/sdk/powershell/docs\nAPI Docs: https://aka.ms/graph/docs\n\nNOTE: You can use the -NoWelcome parameter to suppress this message.\n";
const CONTEXT = "\nClientId     : 14d82eec-204b-4c2f-b7e8-296a70dab67e\nTenantId     : 3c5e7a91-2d4f-4b6a-8e1c-9f0a2b4c6d8e\nScopes       : {openid, profile, User.Read.All, email}\nAuthType     : Delegated\nAccount      : admin@contoso.com\nAppName      : Microsoft Graph Command Line Tools\nContextScope : CurrentUser\n";

function fmtDate(d){
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const p = n => String(n).padStart(2,"0");
  return "\n" + days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "\n";
}

const SCEN = [
{id:"start", name:"Start here", sub:"How Poshle works", steps:[
 {task:"Every step gives you a job. Type the command and press <kbd>Enter</kbd>, exactly like in your real terminal. Start with the date.", cmd:"Get-Date", out:()=>fmtDate(new Date())},
 {task:"Press <kbd>↑</kbd> to bring the last command back, then <kbd>Enter</kbd>. Your history works like real pwsh, and it is saved between visits.", cmd:"Get-Date", use:["hist"], out:()=>fmtDate(new Date())},
 {task:"Type <b>get-hi</b> and press <kbd>Tab</kbd>. PowerShell completes it to Get-History and fixes the capitals for you.", cmd:"Get-History", use:["tab"], out:()=>historyOut()},
 {task:"In <b>Ghost</b> mode the rest of the command shows in grey, like PSReadLine's prediction. <kbd>→</kbd> at the end would accept it, but then the line doesn't count as clean. Type this one fully.", cmd:"Get-MgContext", out:CONTEXT},
 {task:"Switch to <b>Recall</b> at the top when a scenario feels easy: then only the job is shown and you type from memory. Clear the screen with <kbd>Ctrl</kbd><kbd>L</kbd>, then run Get-Date.", cmd:"Get-Date", use:["C-l"], out:()=>fmtDate(new Date())}
]},
{id:"connect", name:"Connect & check", sub:"Sessions and scopes", steps:[
 {task:"Log into Microsoft Graph with read rights on users.", cmd:'Connect-MgGraph -Scopes "User.Read.All"', out:WELCOME},
 {task:"Show which account and scopes this session has.", cmd:"Get-MgContext | Select-Object Account, Scopes", out:"\nAccount           Scopes\n-------           ------\nadmin@contoso.com {openid, profile, User.Read.All, email}\n"},
 {task:"Reconnect with write rights on users, without the welcome banner.", cmd:'Connect-MgGraph -Scopes "User.ReadWrite.All" -NoWelcome'},
 {task:"Open the Exchange Online door too, without the banner.", cmd:"Connect-ExchangeOnline -ShowBanner:$false"},
 {task:"Check your PowerShell version.", cmd:"$PSVersionTable.PSVersion", out:"\nMajor  Minor  Patch  PreReleaseLabel BuildLabel\n-----  -----  -----  --------------- ----------\n7      5      3\n"},
 {task:"Find which scopes Get-MgUser needs.", cmd:"Find-MgGraphCommand -Command Get-MgUser | Select-Object -Expand Permissions", out:"\nName               IsAdmin Description\n----               ------- -----------\nUser.Read.All      True    Read all users' full profiles\nUser.ReadWrite.All True    Read and write all users' full profiles\nDirectory.Read.All True    Read directory data\n"}
]},
{id:"users", name:"Find users", sub:"Get-MgUser and filters", steps:[
 {task:"Store every user with the properties you need in $all.", cmd:"$all = Get-MgUser -All -Property Id,DisplayName,UserPrincipalName,AccountEnabled"},
 {task:"Count them.", cmd:"$all.Count", out:"214\n"},
 {task:"Find one user by sign-in name with a server-side filter.", cmd:"Get-MgUser -Filter \"userPrincipalName eq 'user@contoso.com'\"", out:USER_TABLE},
 {task:"Find users whose display name starts with Jan.", cmd:"Get-MgUser -Filter \"startswith(displayName,'Jan')\"", out:"\nDisplayName  Id                                   Mail                     UserPrincipalName\n-----------  --                                   ----                     -----------------\nJan Peeters  2b7d9f13-6c4a-4e81-a0d2-5f8b3c1e7a46 jan.peeters@contoso.com  jan.peeters@contoso.com\nJana Wouters 9e3a1c5b-7d2f-4b86-8c0e-1a4f6d2b9e73 jana.wouters@contoso.com jana.wouters@contoso.com\n"},
 {task:"From $all, keep only the blocked accounts and show name and sign-in name.", cmd:"$all | Where-Object { $_.AccountEnabled -eq $false } | Select-Object DisplayName, UserPrincipalName", out:"\nDisplayName  UserPrincipalName\n-----------  -----------------\nTom Claes    tom.claes@contoso.com\nSara Jacobs  sara.jacobs@contoso.com\n"},
 {task:"Active users only, sorted by name, first 5 names.", cmd:"$all | Where-Object AccountEnabled | Sort-Object DisplayName | Select-Object -First 5 DisplayName", out:"\nDisplayName\n-----------\nAiko Haring\nAnke Dumon\nBart Lenaerts\nCas Verbeke\nDries Wouters\n"}
]},
{id:"rename", name:"Bulk rename", sub:"Plan, check, export", steps:[
 {task:"Fetch personal mailboxes only, as lowercase sign-in names, into $people.", cmd:"$people = (Get-EXOMailbox -RecipientTypeDetails UserMailbox -ResultSize Unlimited).UserPrincipalName.ToLower()"},
 {task:"Collect every sign-in name already in use into $taken.", cmd:"$taken = $all.UserPrincipalName.ToLower()"},
 {task:"Is jpe@contoso.com already taken?", cmd:'$taken -contains "jpe@contoso.com"', out:"False\n"},
 {task:"Save $plan to your Desktop as rename-plan.csv, UTF8, without type info.", cmd:"$plan | Export-Csv ~/Desktop/rename-plan.csv -NoTypeInformation -Encoding UTF8"},
 {task:"Read it back into $rows, keeping only rows without a conflict.", cmd:'$rows = Import-Csv ~/Desktop/rename-plan.csv | Where-Object Conflict -eq "False"'},
 {task:"How many rows are ready?", cmd:"$rows.Count", out:"12\n"},
 {task:"Copy all old addresses to the clipboard, separated by semicolons, for the BCC field.", cmd:'(Import-Csv ~/Desktop/rename-plan.csv).OldUPN -join "; " | Set-Clipboard'}
]},
{id:"addr", name:"Mailbox addresses", sub:"Primary, alias, UPN", steps:[
 {task:"List every address on Jan's mailbox, one per line.", cmd:"Get-Mailbox jan.peeters@contoso.com | Select-Object -Expand EmailAddresses", out:"SMTP:jan.peeters@contoso.com\nSIP:jan.peeters@contoso.com\n"},
 {task:"Make jpe@contoso.com his primary email address.", cmd:"Set-Mailbox -Identity jan.peeters@contoso.com -WindowsEmailAddress jpe@contoso.com"},
 {task:"Change his sign-in name to match.", cmd:"Update-MgUser -UserId jan.peeters@contoso.com -UserPrincipalName jpe@contoso.com"},
 {task:"Check again: the new primary in capitals, the old one kept as alias.", cmd:"Get-Mailbox jpe@contoso.com | Select-Object -Expand EmailAddresses", out:"SMTP:jpe@contoso.com\nsmtp:jan.peeters@contoso.com\nSIP:jan.peeters@contoso.com\n"},
 {task:"Add jan@contoso.com as an extra alias.", cmd:"Set-Mailbox -Identity jpe@contoso.com -EmailAddresses @{Add='smtp:jan@contoso.com'}"},
 {task:"Who owns jan@contoso.com?", cmd:"Get-EXORecipient -Filter \"EmailAddresses -eq 'smtp:jan@contoso.com'\"", out:"\nName         RecipientType\n----         -------------\nJan Peeters  UserMailbox\n"}
]},
{id:"tap", name:"Temp Access Pass", sub:"Sign-in without a password", steps:[
 {task:"Connect with the scope that lets you create sign-in methods, no banner.", cmd:'Connect-MgGraph -Scopes "UserAuthenticationMethod.ReadWrite.All" -NoWelcome'},
 {task:"Store the user in $u, on its own line.", cmd:'$u = "user@contoso.com"'},
 {task:"Check whether the user already has a TAP.", cmd:"Get-MgUserAuthenticationTemporaryAccessPassMethod -UserId $u"},
 {task:"Create an 8-hour, reusable TAP and show only the code.", cmd:"New-MgUserAuthenticationTemporaryAccessPassMethod -UserId $u -BodyParameter @{ lifetimeInMinutes = 480; isUsableOnce = $false } | Select-Object TemporaryAccessPass", out:"\nTemporaryAccessPass\n-------------------\nRq4#mT9z\n"},
 {task:"Store the TAP's Id in $id.", cmd:"$id = (Get-MgUserAuthenticationTemporaryAccessPassMethod -UserId $u).Id"},
 {task:"Remove the TAP once setup is done.", cmd:"Remove-MgUserAuthenticationTemporaryAccessPassMethod -UserId $u -TemporaryAccessPassAuthenticationMethodId $id"}
]},
{id:"shared", name:"Shared mailboxes", sub:"FullAccess and SendAs", steps:[
 {task:"Give user@ full access to sales@, appearing in Outlook automatically.", cmd:"Add-MailboxPermission -Identity sales@contoso.com -User user@contoso.com -AccessRights FullAccess -AutoMapping $true", out:"\nIdentity User             AccessRights  IsInherited Deny\n-------- ----             ------------  ----------- ----\nSales    user@contoso.com {FullAccess}  False       False\n"},
 {task:"Let user@ send as sales@, without the confirmation prompt.", cmd:"Add-RecipientPermission -Identity sales@contoso.com -Trustee user@contoso.com -AccessRights SendAs -Confirm:$false", out:"\nIdentity Trustee          AccessControlType AccessRights Inherited\n-------- -------          ----------------- ------------ ---------\nSales    user@contoso.com Allow             {SendAs}     False\n"},
 {task:"Show who has access to sales@, without the inherited system entries.", cmd:"Get-MailboxPermission -Identity sales@contoso.com | Where-Object IsInherited -eq $false", out:"\nIdentity User                 AccessRights IsInherited Deny\n-------- ----                 ------------ ----------- ----\nSales    NT AUTHORITY\\SELF    {FullAccess} False       False\nSales    user@contoso.com     {FullAccess} False       False\n"},
 {task:"Take the full access away again, no prompt.", cmd:"Remove-MailboxPermission -Identity sales@contoso.com -User user@contoso.com -AccessRights FullAccess -Confirm:$false"}
]},
{id:"offboard", name:"Offboard a leaver", sub:"Block, keep, free", steps:[
 {task:"Block sign-in.", cmd:"Update-MgUser -UserId user@contoso.com -AccountEnabled:$false"},
 {task:"Sign the user out everywhere.", cmd:"Revoke-MgUserSignInSession -UserId user@contoso.com", out:"\nValue\n-----\nTrue\n"},
 {task:"Convert the mailbox to a shared mailbox.", cmd:"Set-Mailbox -Identity user@contoso.com -Type Shared"},
 {task:"Give the manager full access.", cmd:"Add-MailboxPermission -Identity user@contoso.com -User manager@contoso.com -AccessRights FullAccess -AutoMapping $true", out:"\nIdentity  User                AccessRights  IsInherited Deny\n--------  ----                ------------  ----------- ----\nLena Maes manager@contoso.com {FullAccess}  False       False\n"},
 {task:"Set an auto-reply for everyone outside too.", cmd:'Set-MailboxAutoReplyConfiguration -Identity user@contoso.com -AutoReplyState Enabled -ExternalMessage "Please contact info@contoso.com." -ExternalAudience All'},
 {task:"Hide the mailbox from the address book.", cmd:"Set-Mailbox -Identity user@contoso.com -HiddenFromAddressListsEnabled $true"},
 {task:"Which licence does the user still have?", cmd:"Get-MgUserLicenseDetail -UserId user@contoso.com | Select-Object SkuPartNumber", out:"\nSkuPartNumber\n-------------\nSPB\n"}
]},
{id:"contain", name:"Compromise", sub:"Contain: the first 15 min", steps:[
 {task:"Connect with sign-in log and user write rights, no banner.", cmd:'Connect-MgGraph -Scopes "AuditLog.Read.All","User.ReadWrite.All" -NoWelcome'},
 {task:"Block the account.", cmd:"Update-MgUser -UserId user@contoso.com -AccountEnabled:$false"},
 {task:"Kill every session and stolen token.", cmd:"Revoke-MgUserSignInSession -UserId user@contoso.com", out:"\nValue\n-----\nTrue\n"},
 {task:"List the inbox rules: name, enabled, move-to folder, delete.", cmd:"Get-InboxRule -Mailbox user@contoso.com | Select-Object Name, Enabled, MoveToFolder, DeleteMessage", out:"\nName      Enabled MoveToFolder DeleteMessage\n----      ------- ------------ -------------\nInvoices  True    Invoices     False\n.         True    RSS Feeds    False\n"},
 {task:"Remove the suspicious rule called . without a prompt.", cmd:'Remove-InboxRule -Mailbox user@contoso.com -Identity "." -Confirm:$false'},
 {task:"Check mailbox forwarding.", cmd:"Get-Mailbox -Identity user@contoso.com | Format-List ForwardingSmtpAddress, DeliverToMailboxAndForward", out:"\nForwardingSmtpAddress      : smtp:collect@example.net\nDeliverToMailboxAndForward : True\n"},
 {task:"Remove the forwarding.", cmd:"Set-Mailbox -Identity user@contoso.com -ForwardingSmtpAddress $null -DeliverToMailboxAndForward $false"}
]},
{id:"investigate", name:"Investigate", sub:"Sign-ins, trace, audit", steps:[
 {task:"Store all sign-ins for user@ in $s.", cmd:"$s = Get-MgAuditLogSignIn -Filter \"userPrincipalName eq 'user@contoso.com'\" -All"},
 {task:"Count sign-ins per IP address.", cmd:"$s | Group-Object IpAddress | Select-Object Name, Count", out:"\nName          Count\n----          -----\n198.51.100.7     31\n203.0.113.10      6\n"},
 {task:"Show time and app for the strange IP 203.0.113.10.", cmd:'$s | Where-Object IpAddress -eq "203.0.113.10" | Select-Object CreatedDateTime, AppDisplayName', out:"\nCreatedDateTime     AppDisplayName\n---------------     --------------\n01/10/2026 03:12:44 OfficeHome\n01/10/2026 03:13:02 Office 365 Exchange Online\n"},
 {task:"Store everything user@ sent in the last 3 days in $t.", cmd:"$t = Get-MessageTraceV2 -SenderAddress user@contoso.com -StartDate (Get-Date).AddDays(-3) -EndDate (Get-Date) -ResultSize 5000"},
 {task:"Count recipients per domain, biggest first.", cmd:'$t | Group-Object { ($_.RecipientAddress -split "@")[1] } | Sort-Object Count -Descending | Select-Object Name, Count', out:"\nName          Count\n----          -----\nfabrikam.com     58\nexample.org      41\ncontoso.com      12\n"},
 {task:"Search the audit log for mails the account opened, into $a.", cmd:"$a = Search-UnifiedAuditLog -StartDate 2026-10-01 -EndDate 2026-10-03 -UserIds user@contoso.com -Operations MailItemsAccessed -ResultSize 5000"},
 {task:"Read the client IP from the first audit record.", cmd:"($a[0].AuditData | ConvertFrom-Json).ClientIPAddress", out:"203.0.113.10\n"}
]},
{id:"export", name:"Export & data", sub:"CSV, Excel, clipboard", steps:[
 {task:"Save the sign-ins in $s to your Desktop as signins.csv, UTF8.", cmd:"$s | Export-Csv ~/Desktop/signins.csv -NoTypeInformation -Encoding UTF8"},
 {task:"Open it from the terminal.", cmd:"open ~/Desktop/signins.csv"},
 {task:"Write $s to a Sign-ins tab in incident.xlsx with filters, frozen header, auto width.", cmd:'$s | Export-Excel ~/Desktop/incident.xlsx -WorksheetName "Sign-ins" -AutoFilter -FreezeTopRow -AutoSize'},
 {task:"Add $t as a second tab called Sent mail in the same file.", cmd:'$t | Export-Excel ~/Desktop/incident.xlsx -WorksheetName "Sent mail" -AutoFilter -FreezeTopRow -AutoSize'},
 {task:"Copy every unique recipient address to the clipboard.", cmd:"$t.RecipientAddress | Sort-Object -Unique | Set-Clipboard"},
 {task:"Check the Excel file exists.", cmd:"Test-Path ~/Desktop/incident.xlsx", out:"True\n"}
]},
{id:"secrename", name:"Bulk rename: Security", sub:"Preview, dry run, timed run", steps:[
 {task:"Graph <b>first</b>, always. Connect with write rights on users, no banner. Loading Exchange before Graph can break the Graph login (the Detective has a case on it).", cmd:'Connect-MgGraph -Scopes "User.ReadWrite.All" -NoWelcome'},
 {task:"Now open the Exchange door, no banner.", cmd:"Connect-ExchangeOnline -ShowBanner:$false"},
 {task:"Define a helper that turns a name into an address part: split accents off (FormD), strip the accent marks (<b>\\p{Mn}</b>), drop everything that is not a letter, lowercase. After the <b>{</b> press <kbd>Enter</kbd>: pwsh waits with <b>&gt;&gt;</b> until the braces close.", cmd:"function ConvertTo-NamePart($s) {\n  $t = $s.Normalize([Text.NormalizationForm]::FormD) -replace '\\p{Mn}', ''\n  ($t -replace '[^a-zA-Z]', '').ToLower()\n}", use:["cont"]},
 {task:"Test it. Type <b>convertto-n</b> and press <kbd>Tab</kbd>, then the name. Spaces disappear, and Zoë would come out as zoe.", cmd:'ConvertTo-NamePart "Van den Broeck"', use:["tab"], out:"vandenbroeck\n"},
 {task:"Fetch everyone with the properties the plan needs, Department included, into $users.", cmd:"$users = Get-MgUser -All -Property Id,GivenName,Surname,UserPrincipalName,Department"},
 {task:"Every sign-in name already in use, lowercase, into $taken.", cmd:"$taken = $users.UserPrincipalName.ToLower()"},
 {task:"Build $plan: Security department only, one [pscustomobject] row per person with the old name, the new name and two checks.", cmd:'$plan = $users | Where-Object Department -eq "Security" | ForEach-Object {\n  $new = "{0}.{1}.security@contoso.com" -f (ConvertTo-NamePart $_.GivenName), (ConvertTo-NamePart $_.Surname)\n  [pscustomobject]@{\n    OldUPN = $_.UserPrincipalName\n    NewUPN = $new\n    Same = $_.UserPrincipalName -eq $new\n    Conflict = $taken -contains $new\n  }\n}'},
 {task:"Look at the plan before anything changes. Lena already has the right name (Same, and her own name counts as taken). Bart's new name belongs to a test account (Conflict).", cmd:"$plan | Format-Table", out:"\nOldUPN                         NewUPN                                 Same Conflict\n------                         ------                                 ---- --------\nsara.jacobs@contoso.com        sara.jacobs.security@contoso.com      False    False\nzvdb@contoso.com               zoe.vandenbroeck.security@contoso.com False    False\njan.peeters@contoso.com        jan.peeters.security@contoso.com      False    False\nlena.maes.security@contoso.com lena.maes.security@contoso.com         True     True\nbart.lenaerts@contoso.com      bart.lenaerts.security@contoso.com    False     True\n"},
 {task:"Save the preview to your Desktop, UTF8, no type info.", cmd:"$plan | Export-Csv ~/Desktop/security-plan.csv -NoTypeInformation -Encoding UTF8"},
 {task:"Read it back into $rows, keeping rows where Same and Conflict are both \"False\". CSV values are text, so compare to the word in quotes.", cmd:'$rows = Import-Csv ~/Desktop/security-plan.csv | Where-Object { $_.Same -eq "False" -and $_.Conflict -eq "False" }'},
 {task:"How many rows are left?", cmd:"$rows.Count", out:"3\n"},
 {task:"Alias check: does anyone already own one of the new addresses as an alias? No output means all free.", cmd:"$rows | ForEach-Object { Get-EXORecipient -Filter \"EmailAddresses -eq 'smtp:$($_.NewUPN)'\" }"},
 {task:"Dry run. -WhatIf tells you what Set-Mailbox <i>would</i> do and changes nothing.", cmd:"$rows | ForEach-Object { Set-Mailbox -Identity $_.OldUPN -WindowsEmailAddress $_.NewUPN -WhatIf }", out:'What if: Setting mailbox "sara.jacobs@contoso.com".\nWhat if: Setting mailbox "zvdb@contoso.com".\nWhat if: Setting mailbox "jan.peeters@contoso.com".\n'},
 {task:"The real run, after office hours. Wrap it in <b>&amp; { }</b> so it runs as one block. Start-Sleep waits until 18:00, try/catch with -ErrorAction Stop catches each failure, and every row lands in a log.", cmd:"& {\n  Start-Sleep -Seconds ((Get-Date \"18:00\") - (Get-Date)).TotalSeconds\n  $log = foreach ($r in $rows) {\n    try {\n      Set-Mailbox -Identity $r.OldUPN -WindowsEmailAddress $r.NewUPN -ErrorAction Stop\n      Update-MgUser -UserId $r.OldUPN -UserPrincipalName $r.NewUPN -ErrorAction Stop\n      $status = \"OK\"\n    } catch { $status = $_.Exception.Message }\n    [pscustomobject]@{ OldUPN = $r.OldUPN; NewUPN = $r.NewUPN; Status = $status }\n  }\n  $log | Export-Csv ~/Desktop/security-log.csv -NoTypeInformation -Encoding UTF8\n}", use:["cont"]},
 {task:"It is past 18:00. Read the log.", cmd:"Import-Csv ~/Desktop/security-log.csv | Format-Table", out:"\nOldUPN                  NewUPN                                Status\n------                  ------                                ------\nsara.jacobs@contoso.com sara.jacobs.security@contoso.com      OK\nzvdb@contoso.com        zoe.vandenbroeck.security@contoso.com OK\njan.peeters@contoso.com jan.peeters.security@contoso.com      OK\n"},
 {task:"Trust, but verify. Per row: is the mailbox found under the new name, is the new name the primary address, and is the old address kept as an alias?", cmd:"$check = foreach ($r in $rows) {\n  $m = Get-EXOMailbox -Identity $r.NewUPN -Properties EmailAddresses -ErrorAction SilentlyContinue\n  [pscustomobject]@{\n    NewUPN = $r.NewUPN\n    Found = [bool]$m\n    Primary = $m.PrimarySmtpAddress -eq $r.NewUPN\n    OldKept = $m.EmailAddresses -contains \"smtp:$($r.OldUPN)\"\n  }\n}"},
 {task:"Show the check. Jan says Primary False even though the log said OK. The next scenario fixes that.", cmd:"$check | Format-Table", out:"\nNewUPN                                Found Primary OldKept\n------                                ----- ------- -------\nsara.jacobs.security@contoso.com       True    True    True\nzoe.vandenbroeck.security@contoso.com  True    True    True\njan.peeters.security@contoso.com       True   False    True\n"}
]},
{id:"primary", name:"Stuck primary address", sub:"SMTP vs smtp, the -ceq swap", steps:[
 {task:"Jan's rename said OK, yet mail still goes out from his old address. Check his primary address.", cmd:"Get-Mailbox jan.peeters.security@contoso.com | Select-Object PrimarySmtpAddress", out:"\nPrimarySmtpAddress\n------------------\njp@contoso.com\n"},
 {task:"List every address, one per line. <b>SMTP:</b> in capitals is the primary, small <b>smtp:</b> is an alias. The new address is there, but only as an alias.", cmd:"Get-Mailbox jan.peeters.security@contoso.com | Select-Object -Expand EmailAddresses", out:"SMTP:jp@contoso.com\nsmtp:jan.peeters.security@contoso.com\nsmtp:jan.peeters@contoso.com\nSIP:jan.peeters.security@contoso.com\n"},
 {task:"The obvious fix: add it again with capitals. Exchange compares addresses without looking at case, sees it already has this one, and changes nothing.", cmd:'Set-Mailbox jan.peeters.security@contoso.com -EmailAddresses @{Add="SMTP:jan.peeters.security@contoso.com"}', out:"WARNING: The command completed successfully but no settings of 'Jan Peeters' have been modified.\n"},
 {task:"Rebuild the list yourself. <b>-ceq</b> is the case-sensitive -eq: it only matches the exact capitals. Swap the two lines and keep every other line as it is.", cmd:'$list = (Get-Mailbox jan.peeters.security@contoso.com).EmailAddresses | ForEach-Object {\n  if ($_ -ceq "SMTP:jp@contoso.com") { "smtp:jp@contoso.com" }\n  elseif ($_ -ceq "smtp:jan.peeters.security@contoso.com") { "SMTP:jan.peeters.security@contoso.com" }\n  else { $_ }\n}'},
 {task:"Print $list before you write anything. Exactly one SMTP: in capitals?", cmd:"$list", out:"smtp:jp@contoso.com\nSMTP:jan.peeters.security@contoso.com\nsmtp:jan.peeters@contoso.com\nSIP:jan.peeters.security@contoso.com\n"},
 {task:"Write the whole list back. -EmailAddresses without @{Add=...} replaces the full list, which is exactly why you checked it first.", cmd:"Set-Mailbox jan.peeters.security@contoso.com -EmailAddresses $list"},
 {task:"Verify with the command from step 2. Find it with <kbd>Ctrl</kbd><kbd>R</kbd>, type <b>expand</b>, press <kbd>Enter</kbd>.", cmd:"Get-Mailbox jan.peeters.security@contoso.com | Select-Object -Expand EmailAddresses", use:["C-r"], out:"SMTP:jan.peeters.security@contoso.com\nsmtp:jp@contoso.com\nsmtp:jan.peeters@contoso.com\nSIP:jan.peeters.security@contoso.com\n"},
 {task:"Last check: primary address and sign-in name side by side.", cmd:"Get-Mailbox jan.peeters.security@contoso.com | Select-Object PrimarySmtpAddress, UserPrincipalName", out:"\nPrimarySmtpAddress               UserPrincipalName\n------------------               -----------------\njan.peeters.security@contoso.com jan.peeters.security@contoso.com\n"}
]},
{id:"newusers", name:"New users from a template", sub:"Splat, licence, shared box", steps:[
 {task:"Graph first: user write rights plus the right to read licences, no banner.", cmd:'Connect-MgGraph -Scopes "User.ReadWrite.All","Organization.Read.All" -NoWelcome'},
 {task:"Put the shared details in a hashtable called <b>$userInfo</b>. Not $profile: PowerShell already uses that name for your profile script. BusinessPhones is a list, so it gets @( ).", cmd:'$userInfo = @{\n  Department = "Security"\n  JobTitle = "Security Analyst"\n  OfficeLocation = "HQ"\n  City = "Brussels"\n  Country = "Belgium"\n  UsageLocation = "BE"\n  MobilePhone = "+32 470 00 00 00"\n  BusinessPhones = @("+32 2 000 00 00")\n}', use:["cont"]},
 {task:"Make a random temporary password.", cmd:'$pw = "Tmp-" + (Get-Random -Minimum 100000 -Maximum 999999) + "!"'},
 {task:"Add it to the template, forcing a new password at first sign-in.", cmd:"$userInfo.PasswordProfile = @{ Password = $pw; ForceChangePasswordNextSignIn = $true }"},
 {task:"Create the user. <b>@userInfo</b> (an @, not a $) splats: every key becomes a parameter. The personal ones you add by hand.", cmd:'$new = New-MgUser @userInfo -DisplayName "Noor Haddad" -MailNickname "noor.haddad" -UserPrincipalName "noor.haddad@contoso.com" -AccountEnabled'},
 {task:"Check what landed on the account.", cmd:"$new | Select-Object DisplayName, UserPrincipalName, Department, UsageLocation", out:"\nDisplayName UserPrincipalName       Department UsageLocation\n----------- -----------------       ---------- -------------\nNoor Haddad noor.haddad@contoso.com Security   BE\n"},
 {task:"Which licence does a colleague in the same job have? Use them as the reference.", cmd:"Get-MgUserLicenseDetail -UserId user@contoso.com | Select-Object SkuPartNumber, SkuId", out:"\nSkuPartNumber         SkuId\n-------------         -----\nO365_BUSINESS_PREMIUM f245ecc8-75af-4f8e-b61f-27d8114de5f3\n"},
 {task:"Store that SkuId in $sku.", cmd:"$sku = (Get-MgUserLicenseDetail -UserId user@contoso.com).SkuId"},
 {task:"Are there free ones? <b>@{n=...;e={...}}</b> adds a calculated column. Free = Total minus ConsumedUnits.", cmd:'Get-MgSubscribedSku | Select-Object SkuPartNumber, ConsumedUnits, @{n="Total";e={$_.PrepaidUnits.Enabled}}', out:"\nSkuPartNumber            ConsumedUnits Total\n-------------            ------------- -----\nO365_BUSINESS_ESSENTIALS             6    10\nO365_BUSINESS_PREMIUM               38    40\nSPB                                 12    12\nFLOW_FREE                            9 10000\n"},
 {task:"Give Noor the licence. Both parameters are required, so pass an empty @() for the one you don't use.", cmd:"Set-MgUserLicense -UserId $new.Id -AddLicenses @{SkuId = $sku} -RemoveLicenses @()", out:"\nDisplayName Id                                   Mail UserPrincipalName\n----------- --                                   ---- -----------------\nNoor Haddad 4d2c8e1f-7a3b-4c96-8e05-b1f2a9d6c374      noor.haddad@contoso.com\n"},
 {task:"Now the Exchange door, no banner.", cmd:"Connect-ExchangeOnline -ShowBanner:$false"},
 {task:"The mailbox appears a few minutes after the licence. Wait for it: -ErrorAction SilentlyContinue hides the 'not found' errors while you wait.", cmd:"while (-not (Get-EXOMailbox -Identity $new.UserPrincipalName -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds 30 }"},
 {task:"Create a shared mailbox for the team.", cmd:'New-Mailbox -Shared -Name "Security Desk" -PrimarySmtpAddress security@contoso.com', out:"\nName          Alias        Database           ProhibitSendQuota    ExternalDirectoryObjectId\n----          -----        --------           -----------------    -------------------------\nSecurity Desk SecurityDesk EURPR02DG115-db081 49.5 GB (53,150,...)\n"},
 {task:"Give Noor full access, showing up in Outlook automatically.", cmd:"Add-MailboxPermission -Identity security@contoso.com -User $new.UserPrincipalName -AccessRights FullAccess -AutoMapping $true", out:"\nIdentity      User                    AccessRights IsInherited Deny\n--------      ----                    ------------ ----------- ----\nSecurity Desk noor.haddad@contoso.com {FullAccess} False       False\n"},
 {task:"And let her send as the shared mailbox, no prompt.", cmd:"Add-RecipientPermission -Identity security@contoso.com -Trustee $new.UserPrincipalName -AccessRights SendAs -Confirm:$false", out:"\nIdentity      Trustee                 AccessControlType AccessRights Inherited\n--------      -------                 ----------------- ------------ ---------\nSecurity Desk noor.haddad@contoso.com Allow             {SendAs}     False\n"},
 {task:"Label her mailbox. Custom attributes are free fields that scripts (like a group sync) can read.", cmd:'Set-Mailbox -Identity $new.UserPrincipalName -CustomAttribute1 "Employee" -CustomAttribute2 "Security"'},
 {task:"Copy the login details to the clipboard, one per line. <b>\"`n\"</b> (backtick n) is a new line.", cmd:'@("Name: Noor Haddad", "Login: $($new.UserPrincipalName)", "Temp password: $pw") -join "`n" | Set-Clipboard'}
]},
{id:"gym", name:"Shortcut gym", sub:"Editing without the mouse", gym:true, steps:[
 {task:"The G is missing. <kbd>Ctrl</kbd><kbd>A</kbd> jumps to the start of the line. Type G and press <kbd>Enter</kbd>.", pre:"et-MgUser -UserId user@contoso.com", cmd:"Get-MgUser -UserId user@contoso.com", use:["C-a"], out:USER_TABLE},
 {task:"Wrong address. <kbd>Ctrl</kbd><kbd>E</kbd> to the end, <kbd>Ctrl</kbd><kbd>W</kbd> cuts the word before the cursor, then type user@contoso.com.", pre:"Get-MgUser -UserId wrong@contoso.com", at:0, cmd:"Get-MgUser -UserId user@contoso.com", use:["C-e","C-w"], out:USER_TABLE},
 {task:"<kbd>↑</kbd> brings back the last command. <kbd>Ctrl</kbd><kbd>W</kbd> the address away and type admin@contoso.com.", cmd:"Get-MgUser -UserId admin@contoso.com", use:["hist","C-w"], out:ADMIN_TABLE},
 {task:"Type <b>Revoke-MgUserSignInSession -UserId </b> and press <kbd>⌥</kbd><kbd>.</kbd> to drop in the last argument of the previous command.", cmd:"Revoke-MgUserSignInSession -UserId admin@contoso.com", use:["M-."], out:"\nValue\n-----\nTrue\n"},
 {task:"Throw the whole line away with <kbd>Ctrl</kbd><kbd>U</kbd>, then type Get-MgContext.", pre:"Get-Mailbox -Identity typo@contosso.com", cmd:"Get-MgContext", use:["C-u"], out:CONTEXT},
 {task:"The cursor sits just after the address. <kbd>Ctrl</kbd><kbd>U</kbd> cuts everything before it, <kbd>Ctrl</kbd><kbd>E</kbd> jumps to the end, <kbd>Ctrl</kbd><kbd>Y</kbd> pastes it back.", pre:"user@contoso.com Get-MgUser -UserId ", at:17, cmd:"Get-MgUser -UserId user@contoso.com", use:["C-u","C-e","C-y"], out:USER_TABLE},
 {task:"Change Shared into Regular: <kbd>⌥</kbd><kbd>B</kbd> jumps back one word, <kbd>⌥</kbd><kbd>D</kbd> cuts the word after the cursor, then type Regular.", pre:"Set-Mailbox -Identity user@contoso.com -Type Shared", cmd:"Set-Mailbox -Identity user@contoso.com -Type Regular", use:["M-b","M-d"]},
 {task:"Two letters are swapped and the cursor is on the s. <kbd>Ctrl</kbd><kbd>T</kbd> swaps the letter before the cursor with the one under it.", pre:"Get-MgUesr -All", at:8, cmd:"Get-MgUser -All", use:["C-t"]},
 {task:"<kbd>⌥</kbd><kbd>F</kbd> jumps forward word by word. Press it three times to land after -UserId, cut the rest with <kbd>Ctrl</kbd><kbd>K</kbd>, then type a space and user@contoso.com.", pre:"Get-MgUser -UserId nobody@contoso.com", at:0, cmd:"Get-MgUser -UserId user@contoso.com", use:["M-f","C-k"], out:USER_TABLE},
 {task:"Wipe the line with <kbd>Ctrl</kbd><kbd>U</kbd>, then undo with <kbd>Ctrl</kbd><kbd>_</kbd> (Ctrl+Shift+-) and run it.", pre:"Get-MgUser -All", cmd:"Get-MgUser -All", use:["C-u","undo"]},
 {task:"Let Tab do the typing: type <b>get-mgu</b> + <kbd>Tab</kbd>, then <b>-Us</b> + <kbd>Tab</kbd>, then the address.", cmd:"Get-MgUser -UserId user@contoso.com", use:["tab"], out:USER_TABLE},
 {task:"Run this once so it is in your history.", cmd:'Connect-MgGraph -Scopes "User.Read.All" -NoWelcome'},
 {task:"Run something else in between.", cmd:"Get-Date", out:()=>fmtDate(new Date())},
 {task:"Find it again: <kbd>Ctrl</kbd><kbd>R</kbd>, type <b>conn</b>, press <kbd>Enter</kbd>. <kbd>Ctrl</kbd><kbd>R</kbd> again jumps to older matches.", cmd:'Connect-MgGraph -Scopes "User.Read.All" -NoWelcome', use:["C-r"]},
 {task:"Split a pipeline: type <b>Get-MgUser -All |</b> and press <kbd>Enter</kbd>. pwsh waits with <b>&gt;&gt;</b>. Type Select-Object DisplayName and press <kbd>Enter</kbd>.", cmd:"Get-MgUser -All | Select-Object DisplayName", use:["cont"], out:"\nDisplayName\n-----------\nAiko Haring\nAnke Dumon\nBart Lenaerts\n...\n"},
 {task:"Start typing anything, cancel the line with <kbd>Ctrl</kbd><kbd>C</kbd>, then run Get-MgContext.", cmd:"Get-MgContext", use:["C-c"], out:CONTEXT}
]}
];

const ADD_FILTER = "\"activityDisplayName eq 'Add member to group'\"";
const REM_FILTER = "\"activityDisplayName eq 'Remove member from group'\"";
const ALL_FILTER = "\"mail eq 'all@contoso.com'\"";
function mbx(id, tail){ return ["Get-Mailbox " + id + tail, "Get-Mailbox -Identity " + id + tail, "Get-EXOMailbox " + id + tail, "Get-EXOMailbox -Identity " + id + tail]; }

  {t:"The Graph module is corrupt. Reinstall it.", why:"Reinstalling does not help in this window: the Exchange copy of the library is already loaded and stays loaded."},
  {t:"Exchange loaded its own copy of the login library (MSAL) first, and Graph cannot use that version. Connect Graph first in a fresh window, or update both modules.", ok:true, why:"The loaded Microsoft.Identity.Client comes from the Exchange module folder, and it was loaded by the failed Get-EXOMailbox before Graph got a chance."}
 ],
 lesson:"Both modules ship Microsoft.Identity.Client (MSAL), the library that handles the sign-in. One PowerShell process can only load one version of it, so whichever module loads first wins. PowerShell auto-loads a module the moment you run any of its commands, even a command that fails. Fix: close the window, open a new one, run Connect-MgGraph first and Connect-ExchangeOnline second. Long-term: Update-Module both, so their MSAL versions line up again."},

 options:[
  {t:"Exchange needs 24 hours. Wait until tomorrow.", why:"The mailbox itself already reports jp@ as primary. Waiting does not change a setting that was never made."},
  {t:"His primary (jp@) already differed from his old sign-in name, so -WindowsEmailAddress only added the new address as an alias. Swap SMTP: and smtp: with the -ceq list.", ok:true, why:"EmailAddresses shows SMTP:jp@ and the new address as small smtp:, and jp@ was never his old sign-in name."},
  {t:"Update-MgUser overwrote the primary address with the old one.", why:"Update-MgUser changes the sign-in name in Entra. It never touches Exchange addresses."},

 ],
 lesson:"Exchange keeps one primary address (SMTP: in capitals) and any number of aliases (smtp: in small letters). On a mailbox where the primary already differed from the sign-in name, -WindowsEmailAddress can end up only adding the new address as an alias. And @{Add=\"SMTP:...\"} does nothing when the address already exists, because Exchange ignores case when it checks. The fix is to rebuild the list with -ceq, swapping SMTP: and smtp:, and write it back with Set-Mailbox -EmailAddresses $list. Poshle scenario: Stuck primary address."},

const KNOWN = new Map();
const PARAMS = {};
(function buildDict(){
  const add = n => KNOWN.set(n.toLowerCase(), n);
  EXTRA_CMDS.forEach(add);
  SCEN.forEach(s => s.steps.forEach(st => {
    (st.cmd.match(/\b[A-Z][a-z]+-[A-Z][A-Za-z0-9]+/g) || []).forEach(add);
  }));
  CASES.forEach(c => c.map.forEach(e => [].concat(e.cmd).forEach(x => (x.match(/\b[A-Z][a-z]+-[A-Z][A-Za-z0-9]+/g) || []).forEach(add))));
  Object.keys(MANUAL_PARAMS).forEach(k => PARAMS[k] = MANUAL_PARAMS[k].slice());
  const all = [];
  SCEN.forEach(s => s.steps.forEach(st => all.push(st.cmd)));
  CASES.forEach(c => c.map.forEach(e => [].concat(e.cmd).forEach(x => all.push(x))));
  all.forEach(cmd => {
    splitSegments(cmd).forEach(seg => {
      const m = seg.trim().replace(/^\$[\w:]+\s*=\s*/, "").replace(/^\(/, "").match(/^([A-Za-z]+-[A-Za-z0-9]+)/);
      if (!m) return;
      const key = m[1].toLowerCase();
      if (!PARAMS[key]) PARAMS[key] = [];
      const list = PARAMS[key];
      let bare = seg.replace(/"[^"]*"|'[^']*'/g, '""');
      while (/\{[^{}]*\}/.test(bare)) bare = bare.replace(/\{[^{}]*\}/g, "");
      (bare.match(/(?:^|\s)-([A-Za-z][A-Za-z0-9]*)/g) || []).forEach(p => {
        const name = p.trim().slice(1);
        if (/^(eq|ne|gt|lt|ge|le|ceq|cne|like|notlike|match|notmatch|contains|notcontains|in|notin|join|split|replace|and|or|not|f)$/i.test(name) && !(MANUAL_PARAMS[key] || []).some(x => x.toLowerCase() === name.toLowerCase())) return;
        if (list.some(x => x.toLowerCase() === name.toLowerCase())) return;
        if (list.some(x => x.toLowerCase().startsWith(name.toLowerCase()))) return;
        list.push(name);
      });
    });
  });
})();

function splitSegments(s){
  const out = []; let cur = ""; let q = null; let depth = 0;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){ cur += c; if (c === q) q = null; continue; }
    if (c === "'" || c === '"'){ q = c; cur += c; continue; }
    if (c === "{" || c === "(") depth++;
    if (c === "}" || c === ")") depth--;
    if ((c === "|" || c === ";") && depth <= 0){ out.push(cur); cur = ""; continue; }
    cur += c;
  }
  out.push(cur);
  return out;
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function classify(s){
  const cls = new Array(s.length).fill("");
  let i = 0, cmdPos = true, prev = "";
  const set = (a, b, c) => { for (let k = a; k < b; k++) cls[k] = c; };
  while (i < s.length){
    const c = s[i];
    if (c === "\n" || c === " " || c === "\t"){ if (c === "\n") cmdPos = true; i++; continue; }
    if (c === "#"){ let j = s.indexOf("\n", i); if (j < 0) j = s.length; set(i, j, "k-com"); i = j; continue; }
    if (c === "'" || c === '"'){
      let j = i + 1;
      while (j < s.length && s[j] !== c){ if (c === '"' && s[j] === "`") j++; j++; }
      j = Math.min(j + 1, s.length);
      set(i, j, "k-str"); i = j; cmdPos = false; prev = "str"; continue;
    }
    if (c === "$"){
      const m = s.slice(i).match(/^\$(\{[^}]*\}?|[\w:?^$]+)?/);
      const j = i + Math.max(1, m[0].length);
      set(i, j, "k-var"); i = j; cmdPos = false; prev = "var"; continue;
    }
    if (c === "-" && /[A-Za-z]/.test(s[i+1] || "") && (i === 0 || /[\s(]/.test(s[i-1]))){
      const m = s.slice(i).match(/^-[A-Za-z][\w-]*:?/);
      set(i, i + m[0].length, "k-par"); i += m[0].length; prev = "par"; continue;
    }
    if (/[0-9]/.test(c) && (i === 0 || !/[\w.@-]/.test(s[i-1]))){
      const m = s.slice(i).match(/^\d[\d.]*(?:[kKmMgGtT][bB])?/);
      const after = s[i + m[0].length] || "";
      if (!/[A-Za-z@_]/.test(after)){ set(i, i + m[0].length, "k-num"); i += m[0].length; cmdPos = false; continue; }
    }
    if (c === "["){
      const m = s.slice(i).match(/^\[[\w.]+\]/);
      if (m){ set(i, i + m[0].length, "k-type"); i += m[0].length; continue; }
    }
    if (/[\w~./%?]/.test(c)){
      const m = s.slice(i).match(/^[\w~./@%?:-]+/);
      const w = m[0];
      if (prev !== "dot" && cmdPos && (/^[A-Za-z]+-[A-Za-z0-9]+$/.test(w) || ALIASES.indexOf(w.toLowerCase()) >= 0)) set(i, i + w.length, "k-cmd");
      i += w.length; cmdPos = false; prev = "word"; continue;
    }
    if (c === "|" || c === ";" || c === "{" || c === "(" || c === "="){ cmdPos = true; if (c === "|" || c === "=" || c === ";") cls[i] = "k-op"; i++; prev = "op"; continue; }
    if (c === "@" && (s[i+1] === "{" || s[i+1] === "(")){ i++; continue; }
    if (c === ","){ cls[i] = "k-op"; i++; continue; }
    i++;
  }
  return cls;
}

function renderLine(text, opt){
  opt = opt || {};
  const cls = classify(text);
  let html = '<span class="p">' + esc(PROMPT) + "</span>";
  let run = "", runCls = null;
  const flush = () => { if (run) html += runCls ? '<span class="' + runCls + '">' + esc(run) + "</span>" : esc(run); run = ""; };
  for (let i = 0; i <= text.length; i++){
    if (opt.cursor !== undefined && i === opt.cursor && !(i === text.length && opt.ghost)){
      flush();
      const ch = i < text.length && text[i] !== "\n" ? text[i] : " ";
      html += '<span class="cur ' + (cls[i] || "") + '">' + esc(ch) + "</span>";
      if (i < text.length && text[i] === "\n"){ html += '\n<span class="cp">' + CONT + "</span>"; }
      runCls = null;
      continue;
    }
    if (i === text.length) break;
    const ch = text[i];
    if (ch === "\n"){ flush(); html += '\n<span class="cp">' + CONT + "</span>"; runCls = null; continue; }
    let c = cls[i] || null;
    if (opt.hl && i >= opt.hl[0] && i < opt.hl[1]) c = (c ? c + " " : "") + "hl";
    if (c !== runCls){ flush(); runCls = c; }
    run += ch;
  }
  flush();
  if (opt.ghost){
    const g = opt.ghost;
    if (opt.cursor === text.length){
      html += '<span class="cur">' + esc(g[0]) + '</span><span class="ghost">' + esc(g.slice(1)) + "</span>";
    } else {
      html += '<span class="ghost">' + esc(g) + "</span>";
    }
  }
  return html;
}

function suggestion(){
  if (S.search || S.cur !== S.buf.length || !S.buf) return "";
  const st = curStep();
  if (store.mode === "ghost" && st && !st.pre){
    if (st.cmd.toLowerCase().startsWith(S.buf.toLowerCase()) && st.cmd.length > S.buf.length) return st.cmd.slice(S.buf.length).split("\n")[0];
    return "";
  }
  if (store.mode === "ghost" && st && st.pre) return "";
  for (let i = hist.length - 1; i >= 0; i--){
    const h = hist[i];
    if (h.length > S.buf.length && h.toLowerCase().startsWith(S.buf.toLowerCase()) && h.indexOf("\n") < 0) return h.slice(S.buf.length);
  }
  return "";
}

function render(){
  const g = suggestion();
  let html = renderLine(S.buf, {cursor: S.cur, ghost: g || null, hl: S.search && S.search.hit ? S.search.hit : null});
  if (S.search){
    html += '\n<span class="srch' + (S.search.fail ? " fail" : "") + '">' + (S.search.fail ? "failing " : "") + (S.search.dir < 0 ? "bck" : "fwd") + "-i-search: " + esc(S.search.q) + "_</span>";
  }
  liveEl.innerHTML = html;
  screenEl.classList.toggle("blur", !S.focused);
  screenEl.scrollTop = screenEl.scrollHeight;
}

function print(html, cls){
  const d = document.createElement("div");
  d.className = "ln" + (cls ? " " + cls : "");
  d.innerHTML = html;
  scrollEl.appendChild(d);
  while (scrollEl.childNodes.length > 500) scrollEl.removeChild(scrollEl.firstChild);
}
