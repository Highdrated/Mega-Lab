function flashKey(id){
  S.used.add(id);
  const row = document.querySelector('.kr[data-ids~="' + CSS.escape(id) + '"]');
  if (!row) return;
  const n = row.querySelector(".n");
  n.textContent = String((parseInt(n.textContent, 10) || 0) + 1);
  row.classList.add("used", "flash");
  clearTimeout(row._t);
  row._t = setTimeout(() => row.classList.remove("flash"), 450);
}

function snap(){ return {buf: S.buf, cur: S.cur}; }
function pushUndo(kind){
  if (kind === "ins" && S.last === "ins") return;
  const top = S.undo[S.undo.length - 1];
  if (top && top.buf === S.buf && top.cur === S.cur) return;
  S.undo.push(snap());
  if (S.undo.length > 200) S.undo.shift();
}
function setBuf(b, c){ S.buf = b; S.cur = Math.max(0, Math.min(c, b.length)); }
function startClock(){ if (!S.t0) S.t0 = performance.now(); }

function insert(text){
  if (!text) return;
  startClock();
  if (S.search){ S.search.q += text; doSearch(false); render(); return; }
  pushUndo("ins");
  setBuf(S.buf.slice(0, S.cur) + text + S.buf.slice(S.cur), S.cur + text.length);
  S.last = "ins";
  render();
}

function isW(c){ return c !== undefined && !/\s/.test(c) && WD.indexOf(c) < 0; }
function backWord(){ let i = S.cur; while (i > 0 && !isW(S.buf[i-1])) i--; while (i > 0 && isW(S.buf[i-1])) i--; return i; }
function fwdWord(){ let i = S.cur; const n = S.buf.length; while (i < n && !isW(S.buf[i])) i++; while (i < n && isW(S.buf[i])) i++; return i; }
function lineStart(){ const i = S.buf.lastIndexOf("\n", S.cur - 1); return i + 1; }
function lineEnd(){ const i = S.buf.indexOf("\n", S.cur); return i < 0 ? S.buf.length : i; }

function killRange(a, b, backward){
  if (a === b) return;
  pushUndo("kill");
  const text = S.buf.slice(a, b);
  if (S.last === "kill" && S.kill.length){ S.kill[0] = backward ? text + S.kill[0] : S.kill[0] + text; }
  else { S.kill.unshift(text); if (S.kill.length > 30) S.kill.pop(); }
  setBuf(S.buf.slice(0, a) + S.buf.slice(b), a);
}

function tokenize(line){
  const out = []; let cur = ""; let q = null;
  for (const c of line){
    if (q){ cur += c; if (c === q) q = null; continue; }
    if (c === "'" || c === '"'){ q = c; cur += c; continue; }
    if (/\s/.test(c)){ if (cur){ out.push(cur); cur = ""; } continue; }
    cur += c;
  }
  if (cur) out.push(cur);
  return out;
}

function acceptSuggestion(word){
  const g = suggestion();
  if (!g) return false;
  let add = g;
  if (word){ const m = g.match(/^\s*[^\s]+/); add = m ? m[0] : g; }
  pushUndo("acc");
  setBuf(S.buf + add, S.buf.length + add.length);
  S.assisted = true;
  return true;
}

function histMove(dir){
  if (S.buf.indexOf("\n") >= 0){
    const ls = lineStart();
    if (dir < 0 && ls > 0){ const col = S.cur - ls; const pe = ls - 1; const ps = S.buf.lastIndexOf("\n", pe - 1) + 1; S.cur = Math.min(ps + col, pe); return; }
    const le = lineEnd();
    if (dir > 0 && le < S.buf.length){ const col = S.cur - ls; const ns = le + 1; let ne = S.buf.indexOf("\n", ns); if (ne < 0) ne = S.buf.length; S.cur = Math.min(ns + col, ne); return; }
  }
  if (dir < 0){
    if (S.hIdx <= 0) return;
    if (S.hIdx === hist.length) S.pending = S.buf;
    S.hIdx--; setBuf(hist[S.hIdx], hist[S.hIdx].length);
  } else {
    if (S.hIdx >= hist.length) return;
    S.hIdx++;
    const b = S.hIdx === hist.length ? S.pending : hist[S.hIdx];
    setBuf(b, b.length);
  }
}

function startSearch(dir){
  if (!S.search){ S.search = {dir, q: "", idx: hist.length, fail: false, hit: null, save: snap()}; }
  else { S.search.dir = dir; doSearch(true); }
}
function doSearch(next){
  const s = S.search;
  if (!s.q){ s.fail = false; s.hit = null; return; }
  const q = s.q.toLowerCase();
  let i = next ? s.idx + s.dir : (s.idx >= hist.length ? hist.length - 1 : s.idx);
  if (!next && s.dir > 0) i = Math.max(0, s.idx);
  for (; i >= 0 && i < hist.length; i += s.dir){
    const p = hist[i].toLowerCase().indexOf(q);
    if (p >= 0){ s.idx = i; s.fail = false; setBuf(hist[i], p); s.hit = [p, p + q.length]; return; }
  }
  s.fail = true;
}
function endSearch(keep){
  if (!S.search) return;
  if (!keep) setBuf(S.search.save.buf, S.search.save.cur);
  S.hIdx = S.search.fail || !S.search.q ? hist.length : S.search.idx;
  S.search = null;
}

function curStep(){ return S.list ? S.list[S.idx] || null : null; }

function cnorm(s){ return norm(s).replace(/'/g, '"'); }
function caseRec(id){ if (!store.cases) store.cases = {}; if (!store.cases[id]) store.cases[id] = {solved: 0, best: 0, last: 0}; return store.cases[id]; }
function newCase(c){ return {c, found: new Set(), vars: new Set(), cmds: 0, hints: 0, solving: false, tried: new Set(), closed: false}; }

function caseHit(t){
  const n = cnorm(t);
  return S.case.c.map.find(e => [].concat(e.cmd).some(x => cnorm(x) === n)) || null;
}

function caseFind(ids){
  const k = S.case;
  [].concat(ids || []).forEach(id => {
    if (k.found.has(id)) return;
    const cl = k.c.clues.find(x => x.id === id);
    if (!cl) return;
    k.found.add(id);
    coach('<span class="ok">new clue</span> ' + esc(cl.t));
  });
}

function caseRun(t, m){
  const k = S.case;
  const hit = caseHit(t);
  if (!hit && builtin(t)) return;
  k.cmds++;
  if (hit){
    if (hit.needs && !k.vars.has(hit.needs)){
      coach("<b>" + esc(hit.needs) + "</b> is empty in this session, so this prints nothing. Fill it first.");
    } else {
      if (m){ k.vars.add("$" + m[1]); S.vars.add("$" + m[1]); }
      const out = typeof hit.out === "function" ? hit.out() : hit.out;
      if (out){ if (hit.err) print('<span class="err">' + esc(out.replace(/\n$/, "")) + "</span>"); else printText(out); }
      caseFind(hit.clue);
    }
  } else {
    const bad = unknownCommand(t);
    if (bad) notRecognized(bad);
    else {
      if (m){ k.vars.add("$" + m[1]); S.vars.add("$" + m[1]); }
      print('<span class="dim">(no results)</span>');
    }
  }
  renderBrief();
}

function caseHint(){
  const k = S.case;
  const h = k.c.hints.find(x => !k.found.has(x.clue) && !(x.sets && k.vars.has(x.sets)));
  if (!h){ coach("you have every clue you need. Press <b>Solve</b>."); return; }
  k.hints++;
  coach("try: <b>" + esc(h.cmd) + "</b>");
}

function casePick(i){
  const k = S.case, o = k.c.options[i];
  if (k.closed || k.tried.has(i)) return;
  k.tried.add(i);
  if (o.ok){
    k.closed = true;
    const r = caseRec(k.c.id);
    r.solved++;
    r.last = k.cmds;
    r.best = r.best ? Math.min(r.best, k.cmds) : k.cmds;
    r.at = Date.now();
    save(KEY_STORE, store);
    coach('<span class="ok">✓ case closed</span> in ' + k.cmds + (k.cmds === 1 ? " command" : " commands") + (k.hints ? ", " + k.hints + (k.hints === 1 ? " hint" : " hints") : "") + ".");
    renderRail();
  }
  renderBrief();
  const v = document.querySelector("#brief .verdict");
  if (v) v.scrollIntoView({block: "nearest"});
}

function renderCaseBrief(el){
  const k = S.case, c = k.c, r = caseRec(c.id);
  let h = '<div class="bhead"><h2>' + esc(c.name) + '</h2><span class="count">' + k.cmds + (k.cmds === 1 ? " command" : " commands") + " · " + k.found.size + "/" + c.clues.length + " clues" + (r.best ? " · best " + r.best : "") + '</span><div class="acts">';
  if (!k.closed) h += '<button class="chip" id="bHint">Hint</button>';
  h += '<button class="chip" id="bRestart">Restart</button>';
  if (!k.closed && !k.solving) h += '<button class="chip prime" id="bSolve">Solve</button>';
  h += "</div></div>";
  h += '<p class="task">' + c.problem + "</p>";
  h += '<div class="cl-h">Clues</div><div class="clues">';
  c.clues.forEach(cl => {
    const got = k.found.has(cl.id);
    h += '<div class="clue' + (got ? " got" : "") + '"><i>' + (got ? "✓" : "?") + "</i><span>" + (got ? esc(cl.t) : "not found yet") + "</span></div>";
  });
  h += "</div>";
  if (k.solving || k.closed){
    h += '<div class="cl-h">Your diagnosis</div><div class="opts">';
    c.options.forEach((o, i) => {
      const t = k.tried.has(i);
      const cls = t ? (o.ok ? " yes" : " no") : "";
      h += '<button class="opt' + cls + '" data-i="' + i + '"' + (t || k.closed ? " disabled" : "") + ">" + esc(o.t) + "</button>";
    });
    h += "</div>";
    const last = [...k.tried].pop();
    if (last !== undefined){
      const o = c.options[last];
      h += '<div class="verdict' + (o.ok ? "" : " bad") + '"><b>' + (o.ok ? "Correct." : "Not this one.") + "</b> " + esc(o.why) + (o.ok ? '<p class="lesson">' + esc(c.lesson) + "</p>" : "") + "</div>";
    }
  } else {
    h += '<p class="cnote">Type your own commands in the terminal. Scripted commands answer like the real tenant, other known cmdlets say (no results), unknown names give the real error. Press <b>Solve</b> when you know.</p>';
  }
  el.innerHTML = h;
  const bind = (id, fn) => { const b = $(id); if (b) b.addEventListener("click", () => { fn(); ta.focus({preventScroll: true}); }); };
  bind("bHint", () => { caseHint(); render(); });
  bind("bSolve", () => { k.solving = true; renderBrief(); });
  bind("bRestart", () => { S.case = newCase(c); coach("case reopened: " + esc(c.name) + "."); renderBrief(); render(); });
  el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { casePick(parseInt(b.dataset.i, 10)); ta.focus({preventScroll: true}); }));
}


function completionCtx(){
  let s = S.cur;
  while (s > 0 && !/[\s|;({,=]/.test(S.buf[s-1])) s--;
  return {start: s, tok: S.buf.slice(s, S.cur)};
}
function commandBefore(pos){
  const segs = splitSegments(S.buf.slice(0, pos));
  const seg = segs[segs.length - 1].trim().replace(/^\$[\w:]+\s*=\s*/, "").replace(/^\(/, "");
  const m = seg.match(/^([A-Za-z]+-[A-Za-z0-9]+)/);
  return m ? m[1].toLowerCase() : null;
}
function candidates(tok, start){
  const lo = tok.toLowerCase();
  if (tok.startsWith("-")){
    const cmd = commandBefore(start);
    const list = (cmd && PARAMS[cmd] ? PARAMS[cmd] : []).concat(COMMON);
    return [...new Set(list)].filter(p => ("-" + p).toLowerCase().startsWith(lo)).map(p => "-" + p);
  }
  if (tok.startsWith("$")){
    const all = AUTO_VARS.concat([...S.vars]);
    return [...new Set(all)].filter(v => v.toLowerCase().startsWith(lo) && v.toLowerCase() !== "$_").sort();
  }
  if (tok.startsWith("~/")){
    const slash = tok.lastIndexOf("/");
    const dir = tok.slice(0, slash + 1), rest = tok.slice(slash + 1).toLowerCase();
    return (FS[dir] || []).filter(f => f.toLowerCase().startsWith(rest)).map(f => dir + f);
  }
  if (!tok) return [];
  const names = [...KNOWN.values()];
  return names.filter(n => n.toLowerCase().startsWith(lo)).sort();
}
function commonPrefix(list){
  let p = list[0];
  for (const x of list){ let i = 0; while (i < p.length && i < x.length && p[i].toLowerCase() === x[i].toLowerCase()) i++; p = p.slice(0, i); }
  return p;
}
function complete(listNow){
  const {start, tok} = completionCtx();
  const c = candidates(tok, start);
  if (!c.length) return;
  if (!listNow && c.length === 1){
    pushUndo("tab");
    setBuf(S.buf.slice(0, start) + c[0] + S.buf.slice(S.cur), start + c[0].length);
    return;
  }
  const p = commonPrefix(c);
  if (!listNow && p.length > tok.length){
    pushUndo("tab");
    setBuf(S.buf.slice(0, start) + p + S.buf.slice(S.cur), start + p.length);
    return;
  }
  if (listNow || S.last === "tab"){
    freeze();
    const w = Math.max(...c.map(x => x.length)) + 2;
    const cols = Math.max(1, Math.floor(110 / w));
    let out = "";
    c.slice(0, 60).forEach((x, i) => { out += x.padEnd(w); if ((i + 1) % cols === 0) out += "\n"; });
    if (c.length > 60) out += "\n… " + (c.length - 60) + " more";
    printText(out.replace(/\s+$/, ""));
  }
}

function yankLastArg(){
  const chain = S.last === "lastarg" && S.lastArg;
  const k = chain ? S.lastArg.k + 1 : 0;
  const line = hist[hist.length - 1 - k];
  if (line === undefined) return;
  const toks = tokenize(line);
  const arg = toks.length ? toks[toks.length - 1] : "";
  if (chain){
    setBuf(S.buf.slice(0, S.lastArg.at) + arg + S.buf.slice(S.lastArg.at + S.lastArg.len), S.lastArg.at + arg.length);
  } else {
    pushUndo("lastarg");
    setBuf(S.buf.slice(0, S.cur) + arg + S.buf.slice(S.cur), S.cur + arg.length);
  }
  S.lastArg = {k, at: S.cur - arg.length, len: arg.length};
}

function incomplete(s){
  let q = null, d = 0;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){ if (c === "`" && q === '"'){ i++; continue; } if (c === q) q = null; continue; }
    if (c === "#"){ const j = s.indexOf("\n", i); if (j < 0) break; i = j; continue; }
    if (c === "'" || c === '"'){ q = c; continue; }
    if (c === "{" || c === "(" || c === "[") d++;
    if (c === "}" || c === ")" || c === "]") d--;
  }
  if (q || d > 0) return true;
  const t = s.replace(/\s+$/, "");
  return /\|$/.test(t) || /`$/.test(t);
}

function norm(s){
  return s.replace(/\s+/g, " ").trim().replace(/\s*([|;,(){}=])\s*/g, "$1").replace(/;$/, "").toLowerCase();
}
function firstDiff(a, b){
  const x = a.replace(/\s+/g, " ").trim(), y = b.replace(/\s+/g, " ").trim();
  let i = 0; while (i < x.length && i < y.length && x[i].toLowerCase() === y[i].toLowerCase()) i++;
  return {i, typed: x, want: y};
}

function unknownCommand(line){
  for (const raw of splitSegments(line)){
    let seg = raw.trim().replace(/^\$[\w:.]+\s*=\s*/, "");
    while (seg.startsWith("(")) seg = seg.slice(1).trim();
    if (!seg) continue;
    if (/^[$'"@\[0-9.!-]/.test(seg)) continue;
    const w = seg.match(/^[^\s(){}]+/);
    if (!w) continue;
    const word = w[0];
    if (KEYWORDS.indexOf(word.toLowerCase()) >= 0) continue;
    if (KNOWN.has(word.toLowerCase())) continue;
    if (ALIASES.indexOf(word.toLowerCase()) >= 0) continue;
    return word;
  }
  return null;
}
function notRecognized(word){
  print('<span class="err">' + esc(word + ": The term '" + word + "' is not recognized as a name of a cmdlet, function, script file, or executable program.\nCheck the spelling of the name, or if a path was included, verify that the path is correct and try again.") + "</span>");
}

function historyOut(){
  const rows = hist.slice(-12);
  const base = hist.length - rows.length + 1;
  let out = "\n  Id     Duration CommandLine\n  --     -------- -----------\n";
  rows.forEach((h, i) => { out += String(base + i).padStart(4) + "        0.0" + String(Math.floor(Math.random() * 90) + 10) + " " + h.replace(/\n/g, " ") + "\n"; });
  return out;
}

function builtin(t){
  const lo = t.toLowerCase();
  if (lo === "clear" || lo === "cls" || lo === "clear-host"){ clearScreen(); return true; }
  if (lo === "exit"){ coach("in real pwsh this closes the session. Here you stay."); return true; }
  if (lo === "history" || lo === "h"){ printText(historyOut()); return true; }
  if (lo === "clear-history"){ hist = []; save(KEY_HIST, hist); S.hIdx = 0; return true; }
  return false;
}

function keyOf(scId, st, i){ return st.rk || scId + ":" + i; }
function stepKey(){ return keyOf(S.scen.id, S.list[S.idx], S.idx); }
function rec(key){ if (!store.steps[key]) store.steps[key] = {done: 0, clean: 0, miss: 0, best: 0}; return store.steps[key]; }

function addHist(line){
  if (!line.trim()) return;
  if (hist[hist.length - 1] !== line) hist.push(line);
  if (hist.length > 400) hist = hist.slice(-400);
  save(KEY_HIST, hist);
}

function run(line){
  const t = line.trim();
  addHist(line);
  S.hIdx = hist.length;
  const m = t.match(/^\$([\w]+)\s*=/);
  if (!t) return;
  if (S.case){ caseRun(t, m); return; }
  if (builtin(t)) return;
  const st = curStep();
  if (st){
    const wanted = [st.cmd].concat(st.alt || []);
    if (wanted.some(w => norm(w) === norm(t))){
      const missing = (st.use || []).filter(id => !S.used.has(id));
      if (missing.length){
        coach("right line — now do it with <b>" + missing.map(id => USE_LABEL[id] || id).join("</b>, <b>") + "</b>. That's the muscle you're training.");
        S.misses++;
        rec(stepKey()).miss++;
        resetStep();
        return;
      }
      if (m) S.vars.add("$" + m[1]);
      const out = typeof st.out === "function" ? st.out() : st.out;
      if (out) printText(out);
      finishStep();
      return;
    }
    const bad = unknownCommand(t);
    if (bad) notRecognized(bad);
    else {
      const d = firstDiff(t, st.cmd);
      const pad = " ".repeat(PROMPT.length + d.i);
      if (store.mode === "ghost" || S.revealed){
        coach("not quite. First difference at column " + (d.i + 1) + ":");
        print('<span class="dim">' + esc(PROMPT) + "</span>" + esc(d.typed) + "\n" + '<span class="coach">' + pad + "^</span>\n" + '<span class="coach">' + " ".repeat(PROMPT.length - 10) + "expected: </span><span class=\"ok\">" + esc(d.want) + "</span>");
      } else {
        coach("not quite. Correct up to column " + d.i + ": <b>" + esc(d.want.slice(0, d.i)) + "</b>…");
      }
    }
    S.misses++;
    rec(stepKey()).miss++;
    save(KEY_STORE, store);
    renderRail();
    return;
  }
  const bad = unknownCommand(t);
  if (bad){ notRecognized(bad); return; }
  if (m) S.vars.add("$" + m[1]);
  for (const sc of SCEN) for (const s2 of sc.steps){
    if (norm(s2.cmd) === norm(t)){ const out = typeof s2.out === "function" ? s2.out() : s2.out; if (out) printText(out); return; }
  }
}

function wpmNow(len){
  if (!S.t0) return 0;
  const min = (performance.now() - S.t0) / 60000;
  return min > 0 ? Math.round((len / 5) / min) : 0;
}

let lastLen = 0;
function finishStep(){
  const key = stepKey();
  const r = rec(key);
  const clean = S.misses === 0 && !S.assisted && !S.pasted && !S.revealed;
  r.done++;
  if (clean) r.clean++;
  const w = wpmNow(lastLen);
  if (clean && w > r.best) r.best = w;
  const ss = S.session;
  ss.done++;
  if (clean){ ss.clean++; ss.streak++; } else ss.streak = 0;
  if (w > 0 && w < 300){ ss.wpmSum += w; ss.wpmN++; $("stWpm").textContent = w; }
  save(KEY_STORE, store);
  if (!clean){
    const why = [];
    if (S.misses) why.push(S.misses + (S.misses === 1 ? " miss" : " misses"));
    if (S.assisted) why.push("grey suggestion accepted");
    if (S.pasted) why.push("pasted");
    if (S.revealed) why.push("answer shown");
    coach('<span class="ok">✓</span> done, not clean (' + why.join(", ") + ")");
  }
  S.idx++;
  if (S.idx >= S.list.length){
    const n = S.list.length;
    const c = S.list.filter((st, i) => { const k = keyOf(S.scen.id, st, i); return store.steps[k] && store.steps[k].clean; }).length;
    coach('<span class="ok">✓ ' + esc(S.scen.name) + " complete.</span> " + c + "/" + n + " steps have a clean run. Press <b>Enter</b> on an empty line or pick the next scenario.");
  }
  stats();
  newStep();
  renderRail();
}

function resetStep(){
  S.used = new Set(); S.assisted = false; S.pasted = false; S.t0 = 0;
  const st = curStep();
  if (st && st.pre){ setBuf(st.pre, st.at === undefined ? st.pre.length : st.at); }
}

function newStep(){
  S.used = new Set(); S.misses = 0; S.assisted = false; S.pasted = false; S.revealed = false; S.t0 = 0;
  S.undo = []; S.last = "";
  const st = curStep();
  if (st && st.pre) setBuf(st.pre, st.at === undefined ? st.pre.length : st.at);
  else setBuf("", 0);
  renderBrief();
  render();
}

function stats(){
  const s = S.session;
  $("stAvg").textContent = s.wpmN ? Math.round(s.wpmSum / s.wpmN) : "–";
  $("stClean").textContent = s.clean + "/" + s.done;
  $("stStreak").textContent = s.streak;
}

function acceptLine(shift){
  if (S.search){ endSearch(true); }
  if (shift || incomplete(S.buf)){
    flashKey("cont");
    pushUndo("nl");
    setBuf(S.buf.slice(0, S.cur) + "\n" + S.buf.slice(S.cur), S.cur + 1);
    S.last = "nl";
    render();
    return;
  }
  flashKey("enter");
  const line = S.buf;
  lastLen = line.length;
  freeze();
  setBuf("", 0);
  S.undo = [];
  S.last = "";
  if (!line.trim()){
    if (S.list && S.idx >= S.list.length) nextScenario();
    render();
    return;
  }
  run(line);
  S.t0 = 0;
  render();
}

function cancelLine(){
  if (S.search) endSearch(true);
  print(renderLine(S.buf, {}) + '<span class="dim">^C</span>');
  setBuf("", 0); S.undo = []; S.hIdx = hist.length; S.t0 = 0;
  const st = curStep();
  if (st && st.pre) setBuf(st.pre, st.at === undefined ? st.pre.length : st.at);
}

function act(id){
  const prevLast = S.last;
  let keepLast = false;
  switch (id){
    case "C-a": case "home": { const ls = lineStart(); S.cur = S.cur === ls ? 0 : ls; break; }
    case "C-e": case "end": {
      if (S.cur === S.buf.length && acceptSuggestion(false)) break;
      const le = lineEnd(); S.cur = S.cur === le ? S.buf.length : le; break;
    }
    case "C-b": case "left": if (S.cur > 0) S.cur--; break;
    case "C-f": case "right": if (S.cur < S.buf.length) S.cur++; else acceptSuggestion(false); break;
    case "M-b": S.cur = backWord(); break;
    case "M-f": if (S.cur === S.buf.length) acceptSuggestion(true); else S.cur = fwdWord(); break;
    case "bs": case "C-h":
      if (S.search){ S.search.q = S.search.q.slice(0, -1); S.search.idx = hist.length; doSearch(false); break; }
      if (S.cur > 0){ pushUndo("del"); setBuf(S.buf.slice(0, S.cur - 1) + S.buf.slice(S.cur), S.cur - 1); } break;
    case "del": if (S.cur < S.buf.length){ pushUndo("del"); setBuf(S.buf.slice(0, S.cur) + S.buf.slice(S.cur + 1), S.cur); } break;
    case "C-d":
      if (!S.buf){ coach("Ctrl+D on an empty line closes pwsh in a real terminal."); break; }
      if (S.cur < S.buf.length){ pushUndo("del"); setBuf(S.buf.slice(0, S.cur) + S.buf.slice(S.cur + 1), S.cur); } break;
    case "C-u": killRange(lineStart(), S.cur, true); keepLast = "kill"; break;
    case "C-k": killRange(S.cur, lineEnd(), false); keepLast = "kill"; break;
    case "C-w": { let i = S.cur; while (i > 0 && /\s/.test(S.buf[i-1])) i--; while (i > 0 && !/\s/.test(S.buf[i-1])) i--; killRange(i, S.cur, true); keepLast = "kill"; break; }
    case "M-bs": killRange(backWord(), S.cur, true); keepLast = "kill"; break;
    case "M-d": killRange(S.cur, fwdWord(), false); keepLast = "kill"; break;
    case "C-y": {
      if (!S.kill.length) break;
      pushUndo("yank");
      const t = S.kill[0];
      S.yank = {at: S.cur, len: t.length, i: 0};
      setBuf(S.buf.slice(0, S.cur) + t + S.buf.slice(S.cur), S.cur + t.length);
      keepLast = "yank"; break;
    }
    case "M-y": {
      if (prevLast !== "yank" || !S.yank || S.kill.length < 2) break;
      const i = (S.yank.i + 1) % S.kill.length;
      const t = S.kill[i];
      setBuf(S.buf.slice(0, S.yank.at) + t + S.buf.slice(S.yank.at + S.yank.len), S.yank.at + t.length);
      S.yank = {at: S.yank.at, len: t.length, i};
      keepLast = "yank"; break;
    }
    case "C-t": {
      if (S.buf.length < 2 || S.cur === 0) break;
      pushUndo("swap");
      let p = S.cur === S.buf.length ? S.cur - 1 : S.cur;
      const a = S.buf.split("");
      [a[p-1], a[p]] = [a[p], a[p-1]];
      setBuf(a.join(""), Math.min(p + 1, a.length));
      break;
    }
    case "undo": { const u = S.undo.pop(); if (u) setBuf(u.buf, u.cur); break; }
    case "M-.": yankLastArg(); keepLast = "lastarg"; break;
    case "hist": if (S.search) endSearch(true); histMove(-1); break;
    case "hist-next": if (S.search) endSearch(true); histMove(1); break;
    case "C-r": startSearch(-1); break;
    case "C-s": if (S.search) startSearch(1); break;
    case "C-g": if (S.search) endSearch(false); break;
    case "tab": complete(false); keepLast = "tab"; break;
    case "list": complete(true); break;
    case "C-l": clearScreen(); break;
    case "cmd-k": clearScreen(); break;
    case "C-c": cancelLine(); break;
  }
  S.last = keepLast || id;
  render();
}

function bindingFor(e, meta){
  const c = e.code, k = e.key;
  if (e.ctrlKey && !e.altKey && !e.metaKey){
    if (e.shiftKey && (c === "Minus" || k === "_")) return "undo";
    if (c === "Space") return "list";
    const map = {KeyA:"C-a",KeyE:"C-e",KeyB:"C-b",KeyF:"C-f",KeyU:"C-u",KeyK:"C-k",KeyW:"C-w",KeyY:"C-y",KeyT:"C-t",KeyD:"C-d",KeyH:"C-h",KeyP:"hist",KeyN:"hist-next",KeyR:"C-r",KeyS:"C-s",KeyG:"C-g",KeyL:"C-l",KeyC:"C-c"};
    if (map[c]) return map[c];
    if (c === "ArrowLeft") return "M-b";
    if (c === "ArrowRight") return "M-f";
    return "ctrl-other";
  }
  if ((e.altKey || meta) && !e.ctrlKey && !e.metaKey){
    const map = {KeyB:"M-b",KeyF:"M-f",KeyD:"M-d",KeyY:"M-y",Period:"M-.",Backspace:"M-bs",Equal:"list",ArrowLeft:"M-b",ArrowRight:"M-f"};
    if (map[c]) return map[c];
    if (meta) return "meta-other";
    return null;
  }
  if (e.metaKey) return null;
  switch (k){
    case "Enter": return e.shiftKey ? "S-enter" : "enter";
    case "Backspace": return "bs";
    case "Delete": return "del";
    case "ArrowLeft": return "left";
    case "ArrowRight": return "right";
    case "ArrowUp": return "hist";
    case "ArrowDown": return "hist-next";
    case "Home": return "home";
    case "End": return "end";
    case "Tab": return "tab";
    case "Escape": return "esc";
  }
  return null;
}

ta.addEventListener("keydown", e => {
  if (e.isComposing) return;
  if (e.metaKey && !e.ctrlKey && !e.altKey){
    if (e.code === "KeyK"){ e.preventDefault(); flashKey("cmd-k"); act("cmd-k"); }
    return;
  }
  const meta = S.meta;
  const b = bindingFor(e, meta);
  if (!b) { S.meta = false; return; }
  e.preventDefault();
  S.meta = false;
  startClock();
  if (b === "ctrl-other" || b === "meta-other") return;
  if (b === "esc"){
    if (S.search){ endSearch(true); render(); return; }
    S.meta = true; flashKey("esc"); return;
  }
  if (b === "enter" || b === "S-enter"){ acceptLine(b === "S-enter"); return; }
  if (S.search && !["bs","C-h","C-r","C-s","C-g"].includes(b)) endSearch(true);
  flashKey(b);
  act(b);
});
ta.addEventListener("input", e => {
  if (e.isComposing) return;
  const v = ta.value; ta.value = "";
  if (!v) return;
  if (e.inputType === "insertFromPaste"){ S.pasted = true; insert(v.replace(/\r\n?/g, "\n")); return; }
  insert(v);
});
ta.addEventListener("compositionend", () => { const v = ta.value; ta.value = ""; if (v) insert(v); });
ta.addEventListener("focus", () => { S.focused = true; render(); });
ta.addEventListener("blur", () => { S.focused = false; render(); });
screenEl.addEventListener("mouseup", () => { const sel = window.getSelection(); if (!sel || sel.isCollapsed) ta.focus({preventScroll: true}); });

function renderKeys(){
  const el = $("keys");
  let h = "";
  KEYMAP.forEach(g => {
    h += "<h4>" + g.g + "</h4>";
    g.rows.forEach(r => {
      const ks = r.k[0].map(x => '<span class="kbd">' + esc(x) + "</span>").join("");
      const also = r.k.slice(1).map(c => c.join("+")).join(", ");
      h += '<div class="kr" data-ids="' + r.ids.join(" ") + '"><div class="ks">' + ks + "</div><div>" + esc(r.t) + (also ? '<span class="also">also ' + esc(also) + "</span>" : "") + '</div><div class="n"></div></div>';
    });
  });
  h += '<div class="tip"><b>Same keys in your real terminal.</b> pwsh on a Mac uses PSReadLine in Emacs mode, which is what Poshle copies. For the ⌥ shortcuts, turn on <b>Use Option as Meta key</b> in Terminal → Settings → Profiles → Keyboard (iTerm2: Profiles → Keys → Left Option = Esc+). Without it, press <span class="kbd">Esc</span> and then the letter.</div>';
  el.innerHTML = h;
}

function scenProgress(sc){
  let d = 0, c = 0;
  sc.steps.forEach((st, i) => { const r = store.steps[keyOf(sc.id, st, i)]; if (r && r.done) d++; if (r && r.clean) c++; });
  return {d, c, n: sc.steps.length};
}

function weakList(){
  const out = [];
  SCEN.forEach(sc => { if (sc.gym || sc.id === "start") return; sc.steps.forEach((st, i) => { const r = store.steps[sc.id + ":" + i]; if (r && r.miss > 0) out.push({st, sc, i, score: r.miss / (r.clean + 1)}); }); });
  out.sort((a, b) => b.score - a.score);
  return out.slice(0, 10).map(o => Object.assign({}, o.st, {rk: o.sc.id + ":" + o.i, from: o.sc.name}));
}

function renderRail(){
  const el = $("rail");
  let h = "<h4>Scenarios</h4>";
  SCEN.forEach((sc, i) => {
    const p = scenProgress(sc);
    const on = S.scen && S.scen.id === sc.id;
    const full = p.c === p.n;
    h += '<button class="sc' + (on ? " on" : "") + (full ? " full" : "") + '" data-id="' + sc.id + '"><i>' + (sc.gym ? "⌘" : i === 0 ? "?" : String(i).padStart(2, "0")) + "</i><span><b>" + esc(sc.name) + "<em>" + p.c + "/" + p.n + "</em></b><small>" + esc(sc.sub) + '</small><div class="bar"><span style="width:' + Math.round(p.d / p.n * 100) + '%"></span></div></span></button>';
  });
  const weak = weakList();
  h += "<hr><h4>Practice</h4>";
  h += '<button class="sc' + (S.scen && S.scen.id === "weak" ? " on" : "") + '" data-id="weak"><i>!</i><span><b>Review weak spots</b><small>' + (weak.length ? weak.length + " steps you missed before" : "nothing missed yet") + "</small></span></button>";
  h += '<button class="sc' + (S.scen && S.scen.id === "free" ? " on" : "") + '" data-id="free"><i>&gt;_</i><span><b>Free terminal</b><small>no task, just type</small></span></button>';
  const nSolved = CASES.filter(c => caseRec(c.id).solved).length;
  h += "<hr><h4>Detective · " + nSolved + "/" + CASES.length + " solved</h4>";
  CASES.forEach((c, i) => {
    const r = caseRec(c.id);
    const on = S.scen && S.scen.id === "case:" + c.id;
    h += '<button class="sc' + (on ? " on" : "") + (r.solved ? " solved" : "") + '" data-id="case:' + c.id + '"><i>D' + (i + 1) + "</i><span><b>" + esc(c.name) + "</b><small>" + (r.solved ? "solved · best " + r.best + (r.best === 1 ? " command" : " commands") : esc(c.sub)) + "</small></span></button>";
  });
  el.innerHTML = h;
  el.querySelectorAll(".sc").forEach(b => b.addEventListener("click", () => { openScenario(b.dataset.id); el.classList.remove("open"); }));
}

function renderBrief(){
  const el = $("brief");
  const sc = S.scen;
  el.classList.toggle("case", !!S.case);
  if (S.case){ renderCaseBrief(el); return; }
  if (!S.list){
    el.innerHTML = '<div class="bhead"><h2>Free terminal</h2><span class="count">no task</span></div><p class="task">Type anything. Commands from the scenarios answer with their simulated output, unknown commands give the real PowerShell error. Every shortcut works.</p>';
    return;
  }
  const st = curStep();
  const n = S.list.length;
  let h = '<div class="bhead"><h2>' + esc(sc.name) + '</h2><span class="count">' + (st ? "step " + (S.idx + 1) + " of " + n : "complete") + (st && st.from ? " · " + esc(st.from) : "") + '</span><div class="acts">';
  if (st){
    if (store.mode === "recall" && !S.revealed) h += '<button class="chip" id="bReveal">Show answer</button>';
    h += '<button class="chip" id="bSkip">Skip</button>';
  }
  h += '<button class="chip" id="bRestart">Restart</button>';
  if (!st){ const nx = nextScenarioId(); if (nx) h += '<button class="chip prime" id="bNext">Next scenario</button>'; }
  h += "</div></div>";
  if (st){
    h += '<p class="task">' + st.task + "</p>";
    if (store.mode === "ghost" || S.revealed || sc.gym) h += '<div class="target' + (st.cmd.indexOf("\n") >= 0 ? " multi" : "") + '">' + esc(st.cmd) + "</div>";
    else h += '<div class="target hidden">Recall mode: type it from memory. Tab completion still helps.</div>';
  } else {
    const p = sc.id === "weak" ? null : scenProgress(sc);
    h += '<p class="task">Scenario done' + (p ? " — " + p.c + " of " + p.n + " steps have a clean run" : "") + ". Repeat it in <b>Recall</b> mode to make it stick, or move on.</p>";
  }
  h += '<div class="dots">';
  S.list.forEach((s2, i) => {
    const r = store.steps[keyOf(sc.id, s2, i)];
    let c = "";
    if (i === S.idx) c = "cur"; else if (r && r.clean) c = "clean"; else if (r && r.done) c = "done";
    h += '<span class="' + c + '"></span>';
  });
  h += "</div>";
  el.innerHTML = h;
  const bind = (id, fn) => { const b = $(id); if (b) b.addEventListener("click", () => { fn(); ta.focus({preventScroll: true}); }); };
  bind("bReveal", () => { S.revealed = true; renderBrief(); render(); });
  bind("bSkip", () => { coach("skipped."); S.idx++; newStep(); renderRail(); });
  bind("bRestart", () => { S.idx = 0; coach("restarted " + esc(sc.name) + "."); newStep(); renderRail(); });
  bind("bNext", () => nextScenario());
}

function nextScenarioId(){
  if (!S.scen) return null;
  const i = SCEN.findIndex(s => s.id === S.scen.id);
  return i >= 0 && i < SCEN.length - 1 ? SCEN[i + 1].id : null;
}
function nextScenario(){ const id = nextScenarioId(); if (id) openScenario(id); }

function openScenario(id){
  if (S.search) endSearch(false);
  S.case = null;
  const cs = id.indexOf("case:") === 0 ? CASES.find(c => "case:" + c.id === id) : null;
  if (cs){ S.scen = {id, name: "Case: " + cs.name}; S.list = null; S.idx = 0; S.case = newCase(cs); }
  else if (id === "free" || id.indexOf("case:") === 0){ S.scen = {id: "free", name: "Free terminal"}; S.list = null; S.idx = 0; }
  else if (id === "weak"){
    const list = weakList();
    S.scen = {id: "weak", name: "Review weak spots"};
    S.list = list.length ? list : null;
    S.idx = 0;
    if (!list.length) S.scen = {id: "free", name: "Free terminal"};
  } else {
    S.scen = SCEN.find(s => s.id === id) || SCEN[0];
    S.list = S.scen.steps;
    S.idx = 0;
  }
  store.scen = S.scen.id === "weak" ? store.scen : S.scen.id;
  try { window.history.replaceState(null, "", "#" + S.scen.id); } catch(e){}
  save(KEY_STORE, store);
  print('<span class="dim">── ' + esc(S.scen.name) + " ──</span>");
  newStep();
  renderRail();
  ta.focus({preventScroll: true});
}

function setMode(m){
  store.mode = m; save(KEY_STORE, store);
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  renderBrief(); render();
}
document.querySelectorAll("#modeSeg button").forEach(b => b.addEventListener("click", () => { setMode(b.dataset.mode); ta.focus({preventScroll: true}); }));

function setTheme(t){ document.documentElement.dataset.theme = t; save(KEY_THEME, t); }
$("themeBtn").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "day" ? "night" : "day"));
$("keysBtn").addEventListener("click", () => $("keys").classList.toggle("open"));
$("railBtn").addEventListener("click", () => $("rail").classList.toggle("open"));

setTheme(load(KEY_THEME, "day"));
renderKeys();
document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === store.mode));
printText("PowerShell 7.5.3");
print('<span class="dim">Poshle — every key behaves like pwsh on your Mac. Click the terminal and start typing.</span>');
print("");
function validScen(id){ return !!id && (SCEN.some(s => s.id === id) || id === "free" || id === "weak" || CASES.some(c => "case:" + c.id === id)); }
function hashScen(){ try { return decodeURIComponent(location.hash.slice(1)); } catch(e){ return ""; } }
window.addEventListener("hashchange", () => { const h = hashScen(); if (validScen(h) && (!S.scen || S.scen.id !== h)) openScenario(h); });
openScenario(validScen(hashScen()) ? hashScen() : validScen(store.scen) ? store.scen : "start");
</script>
</body>
