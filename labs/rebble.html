\"label\": \"Emerald City · customers\", \"total\": 64, \"used\": 50 },\n  { \"range\": \"198.51.100.192/27\", \"label\": \"Shermer · customers\", \"total\": 32, \"used\": 31 },\n  { \"range\": \"198.51.100.224/27\", \"label\": \"Castle Rock · customers\", \"total\": 32, \"used\": 12 },\n  { \"range\": \"203.0.113.0/26\", \"label\": \"Twin Peaks · customers\", \"total\": 64, \"used\": 55 },\n  { \"range\": \"203.0.113.64/27\", \"label\": \"Amity Island · customers\", \"total\": 32, \"used\": 20 },\n  { \"range\": \"203.0.113.96/27\", \"label\": \"Bedford Falls · customers\", \"total\": 32, \"used\": 9 },\n  { \"range\": \"203.0.113.128/26\", \"label\": \"VPN gateways\", \"total\": 64, \"used\": 48 },\n  { \"range\": \"203.0.113.192/27\", \"label\": \"Management\", \"total\": 32, \"used\": 27 },\n  { \"range\": \"203.0.113.224/28\", \"label\": \"Spare\", \"total\": 16, \"used\": 2 }\n]\n"},{"index.html":"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"light\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>IT Dashboard</title>\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <script src=\"js/app.js\" defer><\/script>\n</head>\n<body>\n\n<div class=\"toast-container\" id=\"toast-container\"></div>\n\n<div class=\"site-popup-overlay\" id=\"site-popup-overlay\">\n  <div class=\"site-popup\">\n    <div class=\"site-popup-header\">\n      <span id=\"site-popup-title\">Site</span>\n      <button class=\"icon-btn\" id=\"site-popup-close\" aria-label=\"Close\">×</button>\n    </div>\n    <div class=\"site-popup-body\" id=\"site-popup-body\"></div>\n  </div>\n</div>\n\n<header class=\"topbar\">\n  <div class=\"topbar-brand\">\n    <span class=\"topbar-logo\">IT</span>\n    <span class=\"topbar-name\">IT Dashboard</span>\n  </div>\n  <div class=\"topbar-right\">\n    <button class=\"icon-btn\" id=\"refresh-btn\" aria-label=\"Refresh\">↻</button>\n    <div class=\"theme-switcher\">\n      <button class=\"theme-btn\" data-theme=\"light\">Light</button>\n      <button class=\"theme-btn\" data-theme=\"dark\">Dark</button>\n    </div>\n  </div>\n</header>\n\n<div class=\"layout\">\n  <nav class=\"sidebar\">\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-label\">Overview</div>\n      <button class=\"nav-item\" data-page=\"overview\">Dashboard</button>\n      <button class=\"nav-item\" data-page=\"map\">Site Map</button>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-label\">IP Management</div>\n      <button class=\"nav-item\" data-page=\"ip-external\">External IPs</button>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-label\">System</div>\n      <button class=\"nav-item\" data-page=\"settings\">Settings</button>\n    </div>\n  </nav>\n\n  <main class=\"main\">\n    <div class=\"page\" id=\"page-overview\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Overview</div>\n        <div class=\"page-desc\">Live status across all connected systems</div>\n      </div>\n      <div class=\"metric-grid\" id=\"metric-grid\"></div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Recent activity</span></div>\n        <div id=\"activity-list\"></div>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-map\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Site Map</div>\n        <div class=\"page-desc\">Click a marker for details</div>\n      </div>\n      <div class=\"card map-card\">\n        <svg class=\"site-map\" id=\"site-map\" viewBox=\"0 0 700 580\"></svg>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-ip-external\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">External IP Usage</div>\n        <div class=\"page-desc\">Public IP ranges</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"table-tools\">\n          <input type=\"text\" class=\"filter-input\" id=\"ip-external-filter\" placeholder=\"Filter range or label\">\n          <select id=\"ip-external-pagesize\">\n            <option value=\"10\">10 per page</option>\n            <option value=\"25\">25 per page</option>\n          </select>\n        </div>\n        <table class=\"data-table\">\n          <thead>\n            <tr><th>Range</th><th>Label</th><th>Total</th><th>Used</th><th>Free</th><th>Usage</th><th>Status</th></tr>\n          </thead>\n          <tbody id=\"ip-external-tbody\"></tbody>\n        </table>\n        <div class=\"pager\">\n          <button class=\"btn\" id=\"ip-external-prev\">← Prev</button>\n          <span id=\"ip-external-page-info\"></span>\n          <button class=\"btn\" id=\"ip-external-next\">Next →</button>\n        </div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Notes</span></div>\n        <textarea class=\"notes-input\" id=\"notes-ip-external\" placeholder=\"Pinned note for this page\"></textarea>\n        <div class=\"notes-actions\">\n          <button class=\"btn\" onclick=\"saveNote('ip-external', 'save')\">Save</button>\n          <button class=\"btn btn-primary\" onclick=\"saveNote('ip-external', 'post')\">Post</button>\n          <button class=\"btn\" onclick=\"saveNote('ip-external', 'clear')\">Clear</button>\n        </div>\n        <div id=\"notes-log-ip-external\"></div>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-settings\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Settings</div>\n        <div class=\"page-desc\">Saved in this browser</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Thresholds</span></div>\n        <label class=\"field\">Warning at (%) <input type=\"number\" id=\"threshold-warn\" min=\"1\" max=\"100\"></label>\n        <label class=\"field\">Critical at (%) <input type=\"number\" id=\"threshold-crit\" min=\"1\" max=\"100\"></label>\n      </div>\n    </div>\n  </main>\n</div>\n\n</body>\n</html>\n","css/style.css":"[data-theme=\"light\"] {\n  --bg: #f0f2f7;\n  --surface: #ffffff;\n  --surface-2: #f5f7fa;\n  --border: #dde2ec;\n  --text: #1e2d4a;\n  --text-muted: #6b7a96;\n  --accent: #2f5bd3;\n  --accent-light: #ebf0fa;\n  --green: #2a8c72;\n  --amber: #9a5e08;\n  --red: #d94f3d;\n  --topbar-bg: #1e2d4a;\n  --radius: 8px;\n}\n\n[data-theme=\"dark\"] {\n  --bg: #1c1c1e;\n  --surface: #2c2c2e;\n  --surface-2: #232325;\n  --border: #3a3a3c;\n  --text: #f2f2f7;\n  --text-muted: #8e8e93;\n  --accent: #0a84ff;\n  --accent-light: rgba(10, 132, 255, 0.14);\n  --green: #30d158;\n  --amber: #ff9f0a;\n  --red: #ff453a;\n  --topbar-bg: #000000;\n  --radius: 8px;\n}\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;\n  font-size: 14px;\n  background: var(--bg);\n  color: var(--text);\n}\n\n.topbar {\n  height: 52px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 20px;\n  background: var(--topbar-bg);\n  color: #ffffff;\n}\n\n.topbar-brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.topbar-logo {\n  width: 28px;\n  height: 28px;\n  display: grid;\n  place-items: center;\n  border-radius: 6px;\n  background: rgba(255, 255, 255, 0.14);\n  font-size: 11px;\n  font-weight: 700;\n}\n\n.topbar-name {\n  font-weight: 600;\n}\n\n.layout {\n  display: grid;\n  grid-template-columns: 220px 1fr;\n  height: calc(100vh - 52px);\n}\n\n.sidebar {\n  background: var(--surface);\n  border-right: 1px solid var(--border);\n  padding: 16px 10px;\n  overflow-y: auto;\n}\n\n.main {\n  padding: 24px 28px;\n  overflow-y: auto;\n}\n\n.sidebar-section {\n  margin-bottom: 18px;\n}\n\n.sidebar-label {\n  padding: 0 10px 6px;\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n.nav-item {\n  display: block;\n  width: 100%;\n  padding: 8px 10px;\n  border: 0;\n  border-radius: var(--radius);\n  background: transparent;\n  color: var(--text);\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n}\n\n.nav-item:hover {\n  background: var(--surface-2);\n}\n\n.nav-item.active {\n  background: var(--accent-light);\n  color: var(--accent);\n  font-weight: 600;\n}\n\n.page {\n  display: none;\n}\n\n.page.active {\n  display: block;\n}\n\n.page-header {\n  margin-bottom: 20px;\n}\n\n.page-title {\n  font-size: 22px;\n  font-weight: 600;\n}\n\n.page-desc {\n  margin-top: 4px;\n  color: var(--text-muted);\n}\n\n.topbar-right {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.theme-switcher {\n  display: flex;\n  gap: 4px;\n  padding: 3px;\n  border-radius: var(--radius);\n  background: rgba(255, 255, 255, 0.08);\n}\n\n.theme-btn {\n  padding: 5px 12px;\n  border: 0;\n  border-radius: 6px;\n  background: transparent;\n  color: rgba(255, 255, 255, 0.7);\n  font: inherit;\n  font-size: 12px;\n  cursor: pointer;\n}\n\n.theme-btn.active {\n  background: rgba(255, 255, 255, 0.18);\n  color: #ffffff;\n}\n\n.card {\n  margin-bottom: 16px;\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.card-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 12px;\n}\n\n.card-title {\n  font-weight: 600;\n}\n\n.field {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  max-width: 320px;\n  padding: 6px 0;\n  color: var(--text-muted);\n}\n\ninput,\nselect,\ntextarea {\n  padding: 6px 8px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface-2);\n  color: var(--text);\n  font: inherit;\n}\n\n.field input {\n  width: 80px;\n}\n\n.metric-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n  margin-bottom: 16px;\n}\n\n.metric-card {\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.metric-label {\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.metric-value {\n  margin: 6px 0 2px;\n  font-size: 30px;\n  font-weight: 600;\n}\n\n.metric-sub {\n  margin-bottom: 12px;\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.progress {\n  height: 6px;\n  border-radius: 3px;\n  background: var(--surface-2);\n  overflow: hidden;\n}\n\n.progress-fill {\n  height: 100%;\n  border-radius: 3px;\n}\n\n.progress-fill.ok {\n  background: var(--green);\n}\n\n.progress-fill.warn {\n  background: var(--amber);\n}\n\n.progress-fill.crit {\n  background: var(--red);\n}\n\n.icon-btn {\n  width: 30px;\n  height: 30px;\n  border: 0;\n  border-radius: 6px;\n  background: rgba(255, 255, 255, 0.08);\n  color: #ffffff;\n  font-size: 16px;\n  cursor: pointer;\n}\n\n.toast-container {\n  position: fixed;\n  right: 20px;\n  bottom: 20px;\n  z-index: 100;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.toast {\n  padding: 10px 14px;\n  border: 1px solid var(--border);\n  border-left: 4px solid var(--accent);\n  border-radius: var(--radius);\n  background: var(--surface);\n  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);\n}\n\n.toast.success {\n  border-left-color: var(--green);\n}\n\n.toast.error {\n  border-left-color: var(--red);\n}\n\n.empty {\n  padding: 12px 0;\n  color: var(--text-muted);\n}\n\n.table-tools {\n  display: flex;\n  gap: 8px;\n  margin-bottom: 12px;\n}\n\n.filter-input {\n  flex: 1;\n  max-width: 280px;\n}\n\n.data-table {\n  width: 100%;\n  border-collapse: collapse;\n}\n\n.data-table th {\n  padding: 8px 10px;\n  border-bottom: 1px solid var(--border);\n  color: var(--text-muted);\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  text-align: left;\n  text-transform: uppercase;\n}\n\n.data-table td {\n  padding: 9px 10px;\n  border-bottom: 1px solid var(--border);\n}\n\n.data-table .progress {\n  width: 90px;\n}\n\n.badge {\n  display: inline-block;\n  padding: 2px 8px;\n  border-radius: 999px;\n  font-size: 11px;\n  font-weight: 600;\n}\n\n.badge.ok {\n  background: rgba(42, 140, 114, 0.12);\n  color: var(--green);\n}\n\n.badge.warn {\n  background: rgba(154, 94, 8, 0.12);\n  color: var(--amber);\n}\n\n.badge.crit {\n  background: rgba(217, 79, 61, 0.12);\n  color: var(--red);\n}\n\n.pager {\n  display: flex;\n  justify-content: flex-end;\n  align-items: center;\n  gap: 10px;\n  margin-top: 12px;\n  color: var(--text-muted);\n  font-size: 12px;\n}\n\n.btn {\n  padding: 6px 12px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface);\n  color: var(--text);\n  font: inherit;\n  cursor: pointer;\n}\n\n.btn:disabled {\n  opacity: 0.4;\n  cursor: default;\n}\n\n.notes-input {\n  width: 100%;\n  min-height: 70px;\n  resize: vertical;\n}\n\n.notes-actions {\n  display: flex;\n  gap: 8px;\n  margin: 10px 0;\n}\n\n.btn-primary {\n  border-color: var(--accent);\n  background: var(--accent);\n  color: #ffffff;\n}\n\n.log-row {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  padding: 8px 0;\n  border-top: 1px solid var(--border);\n}\n\n.log-time {\n  color: var(--text-muted);\n  font-size: 11px;\n  white-space: nowrap;\n}\n\n.log-text {\n  flex: 1;\n}\n\n.log-del {\n  border: 0;\n  background: none;\n  color: var(--text-muted);\n  font-size: 16px;\n  cursor: pointer;\n}\n\n.activity-row {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  padding: 8px 4px;\n  border-top: 1px solid var(--border);\n  cursor: pointer;\n}\n\n.activity-row:hover {\n  background: var(--surface-2);\n}\n\n.activity-tag {\n  padding: 2px 8px;\n  border-radius: 999px;\n  background: var(--accent-light);\n  color: var(--accent);\n  font-size: 11px;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\n.activity-text {\n  flex: 1;\n}\n\n.activity-time {\n  color: var(--text-muted);\n  font-size: 11px;\n}\n\n.map-card {\n  padding: 8px;\n}\n\n.site-map {\n  display: block;\n  width: 100%;\n  max-height: calc(100vh - 200px);\n}\n\n.map-land {\n  fill: var(--surface-2);\n  stroke: var(--border);\n  stroke-width: 2;\n}\n\n.marker {\n  cursor: pointer;\n}\n\n.marker circle {\n  stroke: var(--surface);\n  stroke-width: 3;\n}\n\n.marker text {\n  fill: var(--text);\n  font-size: 11px;\n  font-weight: 600;\n  text-anchor: middle;\n}\n\n.marker.ok circle {\n  fill: var(--green);\n}\n\n.marker.warn circle {\n  fill: var(--amber);\n}\n\n.marker.crit circle {\n  fill: var(--red);\n}\n\n.marker.offline circle {\n  fill: var(--text-muted);\n}\n\n.site-popup-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 50;\n  display: none;\n  justify-content: center;\n  align-items: center;\n  background: rgba(0, 0, 0, 0.35);\n}\n\n.site-popup-overlay.open {\n  display: flex;\n}\n\n.site-popup {\n  width: 340px;\n  border-radius: var(--radius);\n  background: var(--surface);\n  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);\n}\n\n.site-popup-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 14px 18px;\n  border-bottom: 1px solid var(--border);\n  font-weight: 600;\n}\n\n.site-popup .icon-btn {\n  background: var(--surface-2);\n  color: var(--text);\n}\n\n.site-popup-body {\n  padding: 12px 18px 16px;\n}\n\n.kv {\n  display: flex;\n  justify-content: space-between;\n  padding: 6px 0;\n  color: var(--text-muted);\n}\n\n.kv b {\n  color: var(--text);\n}\n","js/app.js":"const API_URL = 'api/data.php';\nlet DATA = null;\n\nconst pagerState = {};\n\nconst PAGE_LABELS = { 'ip-external': 'External IPs', 'map': 'Site Map' };\n\nconst MAP_BOUNDS = { minLat: 10, maxLat: 20, minLng: 30, maxLng: 44 };\nconst MAP_W = 700;\nconst MAP_H = 580;\nconst BORDER = [\n  [19.2, 33], [19.6, 35.5], [19, 38], [19.4, 40.5], [18.2, 42.8], [16.5, 43.3],\n  [15, 42], [13.4, 43], [11.6, 41.5], [10.6, 39], [11.2, 36.5], [10.5, 34],\n  [11.8, 31.5], [13.8, 30.8], [15.5, 31.8], [17.2, 30.6], [18.6, 31.4],\n];\n\nfunction getSetting(key, def) {\n  try {\n    const v = localStorage.getItem('dash-setting-' + key);\n    return v !== null ? JSON.parse(v) : def;\n  } catch (err) {\n    return def;\n  }\n}\n\nfunction setSetting(key, val) {\n  localStorage.setItem('dash-setting-' + key, JSON.stringify(val));\n}\n\nfunction getThreshold(type) {\n  return getSetting('threshold-' + type, type === 'warn' ? 70 : 80);\n}\n\nfunction pct(used, total) {\n  return total ? Math.round((used / total) * 100) : 0;\n}\n\nfunction statusClass(p) {\n  if (p >= getThreshold('crit')) return 'crit';\n  if (p >= getThreshold('warn')) return 'warn';\n  return 'ok';\n}\n\nfunction fmt(v) {\n  return v.toLocaleString('en-US');\n}\n\nfunction escapeHtml(s) {\n  return String(s)\n    .replace(/&/g, '&amp;')\n    .replace(/</g, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;');\n}\n\nfunction toast(msg, type = 'info') {\n  const c = document.getElementById('toast-container');\n  const el = document.createElement('div');\n  el.className = 'toast ' + type;\n  el.textContent = msg;\n  c.appendChild(el);\n  setTimeout(() => el.remove(), 3000);\n}\n\nfunction setTheme(t) {\n  document.documentElement.setAttribute('data-theme', t);\n  localStorage.setItem('dash-theme', t);\n  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));\n}\n\nfunction initSettings() {\n  ['warn', 'crit'].forEach(type => {\n    const input = document.getElementById('threshold-' + type);\n    input.value = getThreshold(type);\n    input.addEventListener('change', () => {\n      setSetting('threshold-' + type, Number(input.value));\n      renderOverview();\n      renderExternalIpTable();\n      renderMap();\n    });\n  });\n}\n\nfunction overviewMetrics() {\n  return [\n    { label: 'External IPs', used: DATA.ip_external.used, total: DATA.ip_external.total },\n    { label: 'Switch ports', used: DATA.ports.used, total: DATA.ports.total },\n    { label: 'Racks', used: DATA.racks.used, total: DATA.racks.total },\n  ];\n}\n\nfunction renderOverview() {\n  const grid = document.getElementById('metric-grid');\n  if (!DATA) {\n    grid.innerHTML = '<div class=\"empty\">No data. Check api/data.php</div>';\n    return;\n  }\n  grid.innerHTML = overviewMetrics().map(m => {\n    const p = pct(m.used, m.total);\n    return `<div class=\"metric-card\">\n      <div class=\"metric-label\">${m.label}</div>\n      <div class=\"metric-value\">${fmt(m.used)}</div>\n      <div class=\"metric-sub\">of ${fmt(m.total)} · ${p}%</div>\n      <div class=\"progress\"><div class=\"progress-fill ${statusClass(p)}\" style=\"width: ${p}%\"></div></div>\n    </div>`;\n  }).join('');\n}\n\nasync function fetchData(force = false) {\n  try {\n    const res = await fetch(API_URL + (force ? '?refresh=1' : ''));\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    DATA = await res.json();\n    toast('Data refreshed', 'success');\n  } catch (err) {\n    DATA = null;\n    toast('No connection to api/data.php', 'error');\n  } finally {\n    renderOverview();\n    renderExternalIpTable();\n    renderRecentActivity();\n    if (document.getElementById('page-map').classList.contains('active')) renderMap();\n  }\n}\n\nfunction computePagedRows(key, rows, searchFn) {\n  pagerState[key] = pagerState[key] || 0;\n  const q = document.getElementById(key + '-filter').value.toLowerCase().trim();\n  const pageSize = parseInt(document.getElementById(key + '-pagesize').value);\n  const filtered = q ? rows.filter(r => searchFn(r, q)) : rows;\n  const pages = Math.max(1, Math.ceil(filtered.length / pageSize));\n  pagerState[key] = Math.min(pagerState[key], pages - 1);\n  const start = pagerState[key] * pageSize;\n  return { filtered, slice: filtered.slice(start, start + pageSize), pages };\n}\n\nfunction updatePagerUI(key, pages, count) {\n  document.getElementById(key + '-page-info').textContent = `Page ${pagerState[key] + 1} of ${pages} · ${count} item(s)`;\n  document.getElementById(key + '-prev').disabled = pagerState[key] === 0;\n  document.getElementById(key + '-next').disabled = pagerState[key] >= pages - 1;\n}\n\nfunction renderExternalIpTable() {\n  const tbody = document.getElementById('ip-external-tbody');\n  if (!DATA) {\n    tbody.innerHTML = '<tr><td colspan=\"7\" class=\"empty\">No data</td></tr>';\n    return;\n  }\n  const { slice, pages, filtered } = computePagedRows('ip-external', DATA.ip_external.ranges,\n    (r, q) => r.range.toLowerCase().includes(q) || r.label.toLowerCase().includes(q));\n  tbody.innerHTML = slice.map(r => {\n    const p = pct(r.used, r.total);\n    const s = statusClass(p);\n    return `<tr>\n      <td><code>${r.range}</code></td>\n      <td>${r.label}</td>\n      <td>${r.total}</td>\n      <td>${r.used}</td>\n      <td>${r.total - r.used}</td>\n      <td><div class=\"progress\"><div class=\"progress-fill ${s}\" style=\"width: ${p}%\"></div></div></td>\n      <td><span class=\"badge ${s}\">${s.toUpperCase()}</span></td>\n    </tr>`;\n  }).join('') || '<tr><td colspan=\"7\" class=\"empty\">No ranges match your filter</td></tr>';\n  updatePagerUI('ip-external', pages, filtered.length);\n}\n\nasync function loadNote(page) {\n  const box = document.getElementById('notes-' + page);\n  if (!box) return;\n  try {\n    const res = await fetch('api/notes.php');\n    const j = await res.json();\n    const entry = (j.notes || {})[page] || { note: '', log: [] };\n    box.value = entry.note || '';\n    renderNoteLog(page, entry.log || []);\n  } catch (err) {\n    toast('Could not load notes', 'error');\n  }\n}\n\nfunction renderNoteLog(page, log) {\n  let html = '';\n  for (let i = log.length - 1; i >= 0; i--) {\n    html += `<div class=\"log-row\">\n      <span class=\"log-time\">${new Date(log[i].at).toLocaleString('en-GB')}</span>\n      <span class=\"log-text\">${escapeHtml(log[i].text)}</span>\n      <button class=\"log-del\" onclick=\"saveNote('${page}', 'delete_log', ${i})\">×</button>\n    </div>`;\n  }\n  document.getElementById('notes-log-' + page).innerHTML = html || '<div class=\"empty\">No posts yet</div>';\n}\n\nasync function saveNote(page, action, index = -1) {\n  const box = document.getElementById('notes-' + page);\n  try {\n    const res = await fetch('api/notes.php', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ page, action, note: box.value, index }),\n    });\n    const j = await res.json();\n    if (!j.ok) throw new Error(j.error);\n    box.value = j.note;\n    renderNoteLog(page, j.log);\n    renderRecentActivity();\n    toast(action === 'post' ? 'Note posted' : 'Saved', 'success');\n  } catch (err) {\n    toast('Could not save: ' + err.message, 'error');\n  }\n}\n\nfunction relAge(iso) {\n  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);\n  if (min < 1) return 'just now';\n  if (min < 60) return min + 'm ago';\n  const hr = Math.round(min / 60);\n  if (hr < 24) return hr + 'h ago';\n  return Math.round(hr / 24) + 'd ago';\n}\n\nasync function renderRecentActivity() {\n  const el = document.getElementById('activity-list');\n  try {\n    const res = await fetch('api/notes.php');\n    const j = await res.json();\n    const notes = j.notes || {};\n    const entries = [];\n    Object.keys(notes).forEach(page => {\n      (notes[page].log || []).forEach(entry => {\n        entries.push({ page, text: entry.text, at: entry.at });\n      });\n    });\n    entries.sort((a, b) => new Date(b.at) - new Date(a.at));\n    el.innerHTML = entries.slice(0, 8).map(e => `\n      <div class=\"activity-row\" onclick=\"navigate('${e.page}')\">\n        <span class=\"activity-tag\">${PAGE_LABELS[e.page] || e.page}</span>\n        <span class=\"activity-text\">${escapeHtml(e.text)}</span>\n        <span class=\"activity-time\">${relAge(e.at)}</span>\n      </div>`).join('') || '<div class=\"empty\">No posted notes yet</div>';\n  } catch (err) {\n    el.innerHTML = '<div class=\"empty\">Could not load recent activity</div>';\n  }\n}\n\nfunction latLngToXY(lat, lng) {\n  const x = ((lng - MAP_BOUNDS.minLng) / (MAP_BOUNDS.maxLng - MAP_BOUNDS.minLng)) * MAP_W;\n  const y = MAP_H - ((lat - MAP_BOUNDS.minLat) / (MAP_BOUNDS.maxLat - MAP_BOUNDS.minLat)) * MAP_H;\n  return [Math.round(x), Math.round(y)];\n}\n\nfunction renderMap() {\n  const svg = document.getElementById('site-map');\n  if (!DATA) return;\n  const outline = BORDER.map(([lat, lng]) => latLngToXY(lat, lng).join(',')).join(' ');\n  let html = `<polygon class=\"map-land\" points=\"${outline}\"/>`;\n  DATA.sites.forEach(site => {\n    const [x, y] = latLngToXY(site.lat, site.lng);\n    const status = site.online ? statusClass(pct(site.ports_used, site.ports_total)) : 'offline';\n    html += `<g class=\"marker ${status}\" data-id=\"${site.id}\" transform=\"translate(${x}, ${y})\">\n      <circle r=\"9\"></circle>\n      <text y=\"-14\">${site.id}</text>\n    </g>`;\n  });\n  svg.innerHTML = html;\n  svg.querySelectorAll('.marker').forEach(m => m.addEventListener('click', () => openSitePopup(m.dataset.id)));\n}\n\nfunction openSitePopup(id) {\n  const site = DATA.sites.find(s => s.id === id);\n  const p = pct(site.ports_used, site.ports_total);\n  document.getElementById('site-popup-title').textContent = site.name;\n  document.getElementById('site-popup-body').innerHTML = `\n    <div class=\"kv\"><span>City</span><b>${site.city}</b></div>\n    <div class=\"kv\"><span>Region</span><b>${site.region}</b></div>\n    <div class=\"kv\"><span>Status</span><b>${site.online ? 'Online' : 'Offline'}</b></div>\n    <div class=\"kv\"><span>Switch ports</span><b>${site.ports_used} / ${site.ports_total} (${p}%)</b></div>`;\n  document.getElementById('site-popup-overlay').classList.add('open');\n}\n\nfunction closeSitePopup() {\n  document.getElementById('site-popup-overlay').classList.remove('open');\n}\n\nfunction navigate(id) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));\n  const page = document.getElementById('page-' + id);\n  if (page) page.classList.add('active');\n  const nav = document.querySelector(`.nav-item[data-page=\"${id}\"]`);\n  if (nav) nav.classList.add('active');\n  localStorage.setItem('dash-page', id);\n  loadNote(id);\n  if (id === 'map') renderMap();\n}\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  setTheme(localStorage.getItem('dash-theme') || 'light');\n  document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));\n  initSettings();\n  document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigate(i.dataset.page)));\n  document.getElementById('refresh-btn').addEventListener('click', () => fetchData(true));\n  document.getElementById('ip-external-filter').addEventListener('input', () => {\n    pagerState['ip-external'] = 0;\n    renderExternalIpTable();\n  });\n  document.getElementById('ip-external-pagesize').addEventListener('change', renderExternalIpTable);\n  document.getElementById('ip-external-prev').addEventListener('click', () => {\n    pagerState['ip-external']--;\n    renderExternalIpTable();\n  });\n  document.getElementById('ip-external-next').addEventListener('click', () => {\n    pagerState['ip-external']++;\n    renderExternalIpTable();\n  });\n  document.getElementById('site-popup-close').addEventListener('click', closeSitePopup);\n  document.getElementById('site-popup-overlay').addEventListener('click', e => {\n    if (e.target === e.currentTarget) closeSitePopup();\n  });\n  document.addEventListener('keydown', e => {\n    if (e.key === 'Escape') closeSitePopup();\n  });\n  fetchData();\n  navigate(localStorage.getItem('dash-page') || 'overview');\n});\n","api/data.php":"<?php\nheader('Content-Type: application/json');\nheader('Cache-Control: no-store');\n\nfunction pct(int $used, int $total): int {\n    return $total > 0 ? (int) round(($used / $total) * 100) : 0;\n}\n\nfunction read_json(string $file): array {\n    if (!is_file($file)) return [];\n    $data = json_decode(file_get_contents($file), true);\n    return is_array($data) ? $data : [];\n}\n\n$sites = read_json(__DIR__ . '/../data/sites.json');\n$ranges = read_json(__DIR__ . '/../data/ip_external.json');\n\n$ports = ['used' => 0, 'total' => 0];\n$racks = ['used' => 0, 'total' => 0];\nforeach ($sites as $site) {\n    $ports['used'] += $site['ports_used'];\n    $ports['total'] += $site['ports_total'];\n    $racks['used'] += $site['racks_used'];\n    $racks['total'] += $site['racks_total'];\n}\n\n$ipUsed = 0;\n$ipTotal = 0;\nforeach ($ranges as $r) {\n    $ipUsed += $r['used'];\n    $ipTotal += $r['total'];\n}\n\n$payload = json_encode([\n    'generated_at' => date('c'),\n    'sites'        => $sites,\n    'ports'        => $ports,\n    'racks'        => $racks,\n    'ip_external'  => [\n        'used'   => $ipUsed,\n        'total'  => $ipTotal,\n        'pct'    => pct($ipUsed, $ipTotal),\n        'ranges' => $ranges,\n    ],\n], JSON_UNESCAPED_UNICODE);\n\necho $payload;\n","api/notes.php":"<?php\nheader('Content-Type: application/json');\nheader('Cache-Control: no-store');\n\n$file = __DIR__ . '/../data/notes.json';\n$dir = dirname($file);\n\nfunction read_notes(string $file): array {\n    if (!is_file($file)) return [];\n    $data = json_decode(file_get_contents($file), true);\n    return is_array($data) ? $data : [];\n}\n\n$allowed = ['ip-external', 'map'];\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    if (!is_dir($dir) || !is_writable($dir)) {\n        http_response_code(500);\n        echo json_encode(['ok' => false, 'error' => 'data/ directory is not writable by the web server']);\n        exit;\n    }\n    $body = json_decode(file_get_contents('php://input'), true);\n    $page = $body['page'] ?? '';\n    $note = (string) ($body['note'] ?? '');\n    $action = $body['action'] ?? 'save';\n    if (!in_array($action, ['save', 'post', 'clear', 'delete_log'], true)) $action = 'save';\n    if (!in_array($page, $allowed, true)) {\n        http_response_code(400);\n        echo json_encode(['ok' => false, 'error' => 'invalid page']);\n        exit;\n    }\n    if ($action === 'post' && trim($note) === '') {\n        http_response_code(400);\n        echo json_encode(['ok' => false, 'error' => 'cannot post an empty note']);\n        exit;\n    }\n\n    $fp = fopen($file, 'c+');\n    if (!$fp || !flock($fp, LOCK_EX)) {\n        http_response_code(500);\n        echo json_encode(['ok' => false, 'error' => 'could not lock notes file']);\n        exit;\n    }\n    $notes = json_decode(stream_get_contents($fp), true);\n    if (!is_array($notes)) $notes = [];\n    $existing = $notes[$page] ?? ['note' => '', 'log' => []];\n    $log = $existing['log'] ?? [];\n\n    if ($action === 'post') {\n        $log[] = ['text' => $note, 'at' => date('c')];\n        $notes[$page] = ['note' => $existing['note'], 'log' => $log];\n    } elseif ($action === 'clear') {\n        $notes[$page] = ['note' => '', 'log' => $log];\n    } elseif ($action === 'delete_log') {\n        $index = (int) ($body['index'] ?? -1);\n        if (isset($log[$index])) array_splice($log, $index, 1);\n        $notes[$page] = ['note' => $existing['note'], 'log' => $log];\n    } else {\n        $notes[$page] = ['note' => $note, 'log' => $log];\n    }\n\n    ftruncate($fp, 0);\n    rewind($fp);\n    fwrite($fp, json_encode($notes, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE));\n    flock($fp, LOCK_UN);\n    fclose($fp);\n    echo json_encode(['ok' => true, 'note' => $notes[$page]['note'], 'log' => $log]);\n    exit;\n}\n\necho json_encode(['ok' => true, 'notes' => read_notes($file)]);\n","data/sites.json":"[\n  {\n    \"id\": \"GOT1\",\n    \"name\": \"Gotham DC\",\n    \"city\": \"Gotham\",\n    \"region\": \"center\",\n    \"lat\": 15,\n    \"lng\": 37,\n    \"online\": true,\n    \"ports_used\": 288,\ label\">System</div>\n      <button class=\"nav-item\" data-page=\"settings\">Settings</button>\n    </div>\n  </nav>\n\n  <main class=\"main\">\n    <div class=\"page\" id=\"page-overview\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Overview</div>\n        <div class=\"page-desc\">Live status across all connected systems</div>\n      </div>\n      <div class=\"metric-grid\" id=\"metric-grid\"></div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Recent activity</span></div>\n        <div id=\"activity-list\"></div>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-map\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Site Map</div>\n        <div class=\"page-desc\">Click a marker for details</div>\n      </div>\n      <div class=\"card map-card\">\n        <svg class=\"site-map\" id=\"site-map\" viewBox=\"0 0 700 580\"></svg>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-ip-external\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">External IP Usage</div>\n        <div class=\"page-desc\">Public IP ranges</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"table-tools\">\n          <input type=\"text\" class=\"filter-input\" id=\"ip-external-filter\" placeholder=\"Filter range or label\">\n          <select id=\"ip-external-pagesize\">\n            <option value=\"10\">10 per page</option>\n            <option value=\"25\">25 per page</option>\n          </select>\n        </div>\n        <table class=\"data-table\">\n          <thead>\n            <tr><th>Range</th><th>Label</th><th>Total</th><th>Used</th><th>Free</th><th>Usage</th><th>Status</th></tr>\n          </thead>\n          <tbody id=\"ip-external-tbody\"></tbody>\n        </table>\n        <div class=\"pager\">\n          <button class=\"btn\" id=\"ip-external-prev\">← Prev</button>\n          <span id=\"ip-external-page-info\"></span>\n          <button class=\"btn\" id=\"ip-external-next\">Next →</button>\n        </div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Notes</span></div>\n        <textarea class=\"notes-input\" id=\"notes-ip-external\" placeholder=\"Pinned note for this page\"></textarea>\n        <div class=\"notes-actions\">\n          <button class=\"btn\" onclick=\"saveNote('ip-external', 'save')\">Save</button>\n          <button class=\"btn btn-primary\" onclick=\"saveNote('ip-external', 'post')\">Post</button>\n          <button class=\"btn\" onclick=\"saveNote('ip-external', 'clear')\">Clear</button>\n        </div>\n        <div id=\"notes-log-ip-external\"></div>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-settings\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Settings</div>\n        <div class=\"page-desc\">Saved in this browser</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Thresholds</span></div>\n        <label class=\"field\">Warning at (%) <input type=\"number\" id=\"threshold-warn\" min=\"1\" max=\"100\"></label>\n        <label class=\"field\">Critical at (%) <input type=\"number\" id=\"threshold-crit\" min=\"1\" max=\"100\"></label>\n      </div>\n    </div>\n  </main>\n</div>\n\n</body>\n</html>\n","css/style.css":"[data-theme=\"light\"] {\n  --bg: #f0f2f7;\n  --surface: #ffffff;\n  --surface-2: #f5f7fa;\n  --border: #dde2ec;\n  --text: #1e2d4a;\n  --text-muted: #6b7a96;\n  --accent: #2f5bd3;\n  --accent-light: #ebf0fa;\n  --green: #2a8c72;\n  --amber: #9a5e08;\n  --red: #d94f3d;\n  --topbar-bg: #1e2d4a;\n  --radius: 8px;\n}\n\n[data-theme=\"dark\"] {\n  --bg: #1c1c1e;\n  --surface: #2c2c2e;\n  --surface-2: #232325;\n  --border: #3a3a3c;\n  --text: #f2f2f7;\n  --text-muted: #8e8e93;\n  --accent: #0a84ff;\n  --accent-light: rgba(10, 132, 255, 0.14);\n  --green: #30d158;\n  --amber: #ff9f0a;\n  --red: #ff453a;\n  --topbar-bg: #000000;\n  --radius: 8px;\n}\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;\n  font-size: 14px;\n  background: var(--bg);\n  color: var(--text);\n}\n\n.topbar {\n  height: 52px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 20px;\n  background: var(--topbar-bg);\n  color: #ffffff;\n}\n\n.topbar-brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.topbar-logo {\n  width: 28px;\n  height: 28px;\n  display: grid;\n  place-items: center;\n  border-radius: 6px;\n  background: rgba(255, 255, 255, 0.14);\n  font-size: 11px;\n  font-weight: 700;\n}\n\n.topbar-name {\n  font-weight: 600;\n}\n\n.layout {\n  display: grid;\n  grid-template-columns: 220px 1fr;\n  height: calc(100vh - 52px);\n}\n\n.sidebar {\n  background: var(--surface);\n  border-right: 1px solid var(--border);\n  padding: 16px 10px;\n  overflow-y: auto;\n}\n\n.main {\n  padding: 24px 28px;\n  overflow-y: auto;\n}\n\n.sidebar-section {\n  margin-bottom: 18px;\n}\n\n.sidebar-label {\n  padding: 0 10px 6px;\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n.nav-item {\n  display: block;\n  width: 100%;\n  padding: 8px 10px;\n  border: 0;\n  border-radius: var(--radius);\n  background: transparent;\n  color: var(--text);\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n}\n\n.nav-item:hover {\n  background: var(--surface-2);\n}\n\n.nav-item.active {\n  background: var(--accent-light);\n  color: var(--accent);\n  font-weight: 600;\n}\n\n.page {\n  display: none;\n}\n\n.page.active {\n  display: block;\n}\n\n.page-header {\n  margin-bottom: 20px;\n}\n\n.page-title {\n  font-size: 22px;\n  font-weight: 600;\n}\n\n.page-desc {\n  margin-top: 4px;\n  color: var(--text-muted);\n}\n\n.topbar-right {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.theme-switcher {\n  display: flex;\n  gap: 4px;\n  padding: 3px;\n  border-radius: var(--radius);\n  background: rgba(255, 255, 255, 0.08);\n}\n\n.theme-btn {\n  padding: 5px 12px;\n  border: 0;\n  border-radius: 6px;\n  background: transparent;\n  color: rgba(255, 255, 255, 0.7);\n  font: inherit;\n  font-size: 12px;\n  cursor: pointer;\n}\n\n.theme-btn.active {\n  background: rgba(255, 255, 255, 0.18);\n  color: #ffffff;\n}\n\n.card {\n  margin-bottom: 16px;\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.card-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 12px;\n}\n\n.card-title {\n  font-weight: 600;\n}\n\n.field {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  max-width: 320px;\n  padding: 6px 0;\n  color: var(--text-muted);\n}\n\ninput,\nselect,\ntextarea {\n  padding: 6px 8px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface-2);\n  color: var(--text);\n  font: inherit;\n}\n\n.field input {\n  width: 80px;\n}\n\n.metric-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n  margin-bottom: 16px;\n}\n\n.metric-card {\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.metric-label {\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.metric-value {\n  margin: 6px 0 2px;\n  font-size: 30px;\n  font-weight: 600;\n}\n\n.metric-sub {\n  margin-bottom: 12px;\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.progress {\n  height: 6px;\n  border-radius: 3px;\n  background: var(--surface-2);\n  overflow: hidden;\n}\n\n.progress-fill {\n  height: 100%;\n  border-radius: 3px;\n}\n\n.progress-fill.ok {\n  background: var(--green);\n}\n\n.progress-fill.warn {\n  background: var(--amber);\n}\n\n.progress-fill.crit {\n  background: var(--red);\n}\n\n.icon-btn {\n  width: 30px;\n  height: 30px;\n  border: 0;\n  border-radius: 6px;\n  background: rgba(255, 255, 255, 0.08);\n  color: #ffffff;\n  font-size: 16px;\n  cursor: pointer;\n}\n\n.toast-container {\n  position: fixed;\n  right: 20px;\n  bottom: 20px;\n  z-index: 100;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.toast {\n  padding: 10px 14px;\n  border: 1px solid var(--border);\n  border-left: 4px solid var(--accent);\n  border-radius: var(--radius);\n  background: var(--surface);\n  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);\n}\n\n.toast.success {\n  border-left-color: var(--green);\n}\n\n.toast.error {\n  border-left-color: var(--red);\n}\n\n.empty {\n  padding: 12px 0;\n  color: var(--text-muted);\n}\n\n.table-tools {\n  display: flex;\n  gap: 8px;\n  margin-bottom: 12px;\n}\n\n.filter-input {\n  flex: 1;\n  max-width: 280px;\n}\n\n.data-table {\n  width: 100%;\n  border-collapse: collapse;\n}\n\n.data-table th {\n  padding: 8px 10px;\n  border-bottom: 1px solid var(--border);\n  color: var(--text-muted);\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  text-align: left;\n  text-transform: uppercase;\n}\n\n.data-table td {\n  padding: 9px 10px;\n  border-bottom: 1px solid var(--border);\n}\n\n.data-table .progress {\n  width: 90px;\n}\n\n.badge {\n  display: inline-block;\n  padding: 2px 8px;\n  border-radius: 999px;\n  font-size: 11px;\n  font-weight: 600;\n}\n\n.badge.ok {\n  background: rgba(42, 140, 114, 0.12);\n  color: var(--green);\n}\n\n.badge.warn {\n  background: rgba(154, 94, 8, 0.12);\n  color: var(--amber);\n}\n\n.badge.crit {\n  background: rgba(217, 79, 61, 0.12);\n  color: var(--red);\n}\n\n.pager {\n  display: flex;\n  justify-content: flex-end;\n  align-items: center;\n  gap: 10px;\n  margin-top: 12px;\n  color: var(--text-muted);\n  font-size: 12px;\n}\n\n.btn {\n  padding: 6px 12px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface);\n  color: var(--text);\n  font: inherit;\n  cursor: pointer;\n}\n\n.btn:disabled {\n  opacity: 0.4;\n  cursor: default;\n}\n\n.notes-input {\n  width: 100%;\n  min-height: 70px;\n  resize: vertical;\n}\n\n.notes-actions {\n  display: flex;\n  gap: 8px;\n  margin: 10px 0;\n}\n\n.btn-primary {\n  border-color: var(--accent);\n  background: var(--accent);\n  color: #ffffff;\n}\n\n.log-row {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  padding: 8px 0;\n  border-top: 1px solid var(--border);\n}\n\n.log-time {\n  color: var(--text-muted);\n  font-size: 11px;\n  white-space: nowrap;\n}\n\n.log-text {\n  flex: 1;\n}\n\n.log-del {\n  border: 0;\n  background: none;\n  color: var(--text-muted);\n  font-size: 16px;\n  cursor: pointer;\n}\n\n.activity-row {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  padding: 8px 4px;\n  border-top: 1px solid var(--border);\n  cursor: pointer;\n}\n\n.activity-row:hover {\n  background: var(--surface-2);\n}\n\n.activity-tag {\n  padding: 2px 8px;\n  border-radius: 999px;\n  background: var(--accent-light);\n  color: var(--accent);\n  font-size: 11px;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\n.activity-text {\n  flex: 1;\n}\n\n.activity-time {\n  color: var(--text-muted);\n  font-size: 11px;\n}\n\n.map-card {\n  padding: 8px;\n}\n\n.site-map {\n  display: block;\n  width: 100%;\n  max-height: calc(100vh - 200px);\n}\n\n.map-land {\n  fill: var(--surface-2);\n  stroke: var(--border);\n  stroke-width: 2;\n}\n\n.marker {\n  cursor: pointer;\n}\n\n.marker circle {\n  stroke: var(--surface);\n  stroke-width: 3;\n}\n\n.marker text {\n  fill: var(--text);\n  font-size: 11px;\n  font-weight: 600;\n  text-anchor: middle;\n}\n\n.marker.ok circle {\n  fill: var(--green);\n}\n\n.marker.warn circle {\n  fill: var(--amber);\n}\n\n.marker.crit circle {\n  fill: var(--red);\n}\n\n.marker.offline circle {\n  fill: var(--text-muted);\n}\n\n.site-popup-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 50;\n  display: none;\n  justify-content: center;\n  align-items: center;\n  background: rgba(0, 0, 0, 0.35);\n}\n\n.site-popup-overlay.open {\n  display: flex;\n}\n\n.site-popup {\n  width: 340px;\n  border-radius: var(--radius);\n  background: var(--surface);\n  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);\n}\n\n.site-popup-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 14px 18px;\n  border-bottom: 1px solid var(--border);\n  font-weight: 600;\n}\n\n.site-popup .icon-btn {\n  background: var(--surface-2);\n  color: var(--text);\n}\n\n.site-popup-body {\n  padding: 12px 18px 16px;\n}\n\n.kv {\n  display: flex;\n  justify-content: space-between;\n  padding: 6px 0;\n  color: var(--text-muted);\n}\n\n.kv b {\n  color: var(--text);\n}\n","js/app.js":"const API_URL = 'api/data.php';\nlet DATA = null;\n\nconst pagerState = {};\n\nconst PAGE_LABELS = { 'ip-external': 'External IPs', 'map': 'Site Map' };\n\nconst MAP_BOUNDS = { minLat: 10, maxLat: 20, minLng: 30, maxLng: 44 };\nconst MAP_W = 700;\nconst MAP_H = 580;\nconst BORDER = [\n  [19.2, 33], [19.6, 35.5], [19, 38], [19.4, 40.5], [18.2, 42.8], [16.5, 43.3],\n  [15, 42], [13.4, 43], [11.6, 41.5], [10.6, 39], [11.2, 36.5], [10.5, 34],\n  [11.8, 31.5], [13.8, 30.8], [15.5, 31.8], [17.2, 30.6], [18.6, 31.4],\n];\n\nfunction getSetting(key, def) {\n  try {\n    const v = localStorage.getItem('dash-setting-' + key);\n    return v !== null ? JSON.parse(v) : def;\n  } catch (err) {\n    return def;\n  }\n}\n\nfunction setSetting(key, val) {\n  localStorage.setItem('dash-setting-' + key, JSON.stringify(val));\n}\n\nfunction getThreshold(type) {\n  return getSetting('threshold-' + type, type === 'warn' ? 70 : 80);\n}\n\nfunction pct(used, total) {\n  return total ? Math.round((used / total) * 100) : 0;\n}\n\nfunction statusClass(p) {\n  if (p >= getThreshold('crit')) return 'crit';\n  if (p >= getThreshold('warn')) return 'warn';\n  return 'ok';\n}\n\nfunction fmt(v) {\n  return v.toLocaleString('en-US');\n}\n\nfunction escapeHtml(s) {\n  return String(s)\n    .replace(/&/g, '&amp;')\n    .replace(/</g, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;');\n}\n\nfunction toast(msg, type = 'info') {\n  const c = document.getElementById('toast-container');\n  const el = document.createElement('div');\n  el.className = 'toast ' + type;\n  el.textContent = msg;\n  c.appendChild(el);\n  setTimeout(() => el.remove(), 3000);\n}\n\nfunction setTheme(t) {\n  document.documentElement.setAttribute('data-theme', t);\n  localStorage.setItem('dash-theme', t);\n  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));\n}\n\nfunction initSettings() {\n  ['warn', 'crit'].forEach(type => {\n    const input = document.getElementById('threshold-' + type);\n    input.value = getThreshold(type);\n    input.addEventListener('change', () => {\n      setSetting('threshold-' + type, Number(input.value));\n      renderOverview();\n      renderExternalIpTable();\n      renderMap();\n    });\n  });\n}\n\nfunction overviewMetrics() {\n  return [\n    { label: 'External IPs', used: DATA.ip_external.used, total: DATA.ip_external.total },\n    { label: 'Switch ports', used: DATA.ports.used, total: DATA.ports.total },\n    { label: 'Racks', used: DATA.racks.used, total: DATA.racks.total },\n  ];\n}\n\nfunction renderOverview() {\n  const grid = document.getElementById('metric-grid');\n  if (!DATA) {\n    grid.innerHTML = '<div class=\"empty\">No data. Check api/data.php</div>';\n    return;\n  }\n  grid.innerHTML = overviewMetrics().map(m => {\n    const p = pct(m.used, m.total);\n    return `<div class=\"metric-card\">\n      <div class=\"metric-label\">${m.label}</div>\n      <div class=\"metric-value\">${fmt(m.used)}</div>\n      <div class=\"metric-sub\">of ${fmt(m.total)} · ${p}%</div>\n      <div class=\"progress\"><div class=\"progress-fill ${statusClass(p)}\" style=\"width: ${p}%\"></div></div>\n    </div>`;\n  }).join('');\n}\n\nasync function fetchData(force = false) {\n  try {\n    const res = await fetch(API_URL + (force ? '?refresh=1' : ''));\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    DATA = await res.json();\n    toast('Data refreshed', 'success');\n  } catch (err) {\n    DATA = null;\n    toast('No connection to api/data.php', 'error');\n  } finally {\n    renderOverview();\n    renderExternalIpTable();\n    renderRecentActivity();\n    if (document.getElementById('page-map').classList.contains('active')) renderMap();\n  }\n}\n\nfunction computePagedRows(key, rows, searchFn) {\n  pagerState[key] = pagerState[key] || 0;\n  const q = document.getElementById(key + '-filter').value.toLowerCase().trim();\n  const pageSize = parseInt(document.getElementById(key + '-pagesize').value);\n  const filtered = q ? rows.filter(r => searchFn(r, q)) : rows;\n  const pages = Math.max(1, Math.ceil(filtered.length / pageSize));\n  pagerState[key] = Math.min(pagerState[key], pages - 1);\n  const start = pagerState[key] * pageSize;\n  return { filtered, slice: filtered.slice(start, start + pageSize), pages };\n}\n\nfunction updatePagerUI(key, pages, count) {\n  document.getElementById(key + '-page-info').textContent = `Page ${pagerState[key] + 1} of ${pages} · ${count} item(s)`;\n  document.getElementById(key + '-prev').disabled = pagerState[key] === 0;\n  document.getElementById(key + '-next').disabled = pagerState[key] >= pages - 1;\n}\n\nfunction renderExternalIpTable() {\n  const tbody = document.getElementById('ip-external-tbody');\n  if (!DATA) {\n    tbody.innerHTML = '<tr><td colspan=\"7\" class=\"empty\">No data</td></tr>';\n    return;\n  }\n  const { slice, pages, filtered } = computePagedRows('ip-external', DATA.ip_external.ranges,\n    (r, q) => r.range.toLowerCase().includes(q) || r.label.toLowerCase().includes(q));\n  tbody.innerHTML = slice.map(r => {\n    const p = pct(r.used, r.total);\n    const s = statusClass(p);\n    return `<tr>\n      <td><code>${r.range}</code></td>\n      <td>${r.label}</td>\n      <td>${r.total}</td>\n      <td>${r.used}</td>\n      <td>${r.total - r.used}</td>\n      <td><div class=\"progress\"><div class=\"progress-fill ${s}\" style=\"width: ${p}%\"></div></div></td>\n      <td><span class=\"badge ${s}\">${s.toUpperCase()}</span></td>\n    </tr>`;\n  }).join('') || '<tr><td colspan=\"7\" class=\"empty\">No ranges match your filter</td></tr>';\n  updatePagerUI('ip-external', pages, filtered.length);\n}\n\nasync function loadNote(page) {\n  const box = document.getElementById('notes-' + page);\n  if (!box) return;\n  try {\n    const res = await fetch('api/notes.php');\n    const j = await res.json();\n    const entry = (j.notes || {})[page] || { note: '', log: [] };\n    box.value = entry.note || '';\n    renderNoteLog(page, entry.log || []);\n  } catch (err) {\n    toast('Could not load notes', 'error');\n  }\n}\n\nfunction renderNoteLog(page, log) {\n  let html = '';\n  for (let i = log.length - 1; i >= 0; i--) {\n    html += `<div class=\"log-row\">\n      <span class=\"log-time\">${new Date(log[i].at).toLocaleString('en-GB')}</span>\n      <span class=\"log-text\">${escapeHtml(log[i].text)}</span>\n      <button class=\"log-del\" onclick=\"saveNote('${page}', 'delete_log', ${i})\">×</button>\n    </div>`;\n  }\n  document.getElementById('notes-log-' + page).innerHTML = html || '<div class=\"empty\">No posts yet</div>';\n}\n\nasync function saveNote(page, action, index = -1) {\n  const box = document.getElementById('notes-' + page);\n  try {\n    const res = await fetch('api/notes.php', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ page, action, note: box.value, index }),\n    });\n    const j = await res.json();\n    if (!j.ok) throw new Error(j.error);\n    box.value = j.note;\n    renderNoteLog(page, j.log);\n    renderRecentActivity();\n    toast(action === 'post' ? 'Note posted' : 'Saved', 'success');\n  } catch (err) {\n    toast('Could not save: ' + err.message, 'error');\n  }\n}\n\nfunction relAge(iso) {\n  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);\n  if (min < 1) return 'just now';\n  if (min < 60) return min + 'm ago';\n  const hr = Math.round(min / 60);\n  if (hr < 24) return hr + 'h ago';\n  return Math.round(hr / 24) + 'd ago';\n}\n\nasync function renderRecentActivity() {\n  const el = document.getElementById('activity-list');\n  try {\n    const res = await fetch('api/notes.php');\n    const j = await res.json();\n    const notes = j.notes || {};\n    const entries = [];\n    Object.keys(notes).forEach(page => {\n      (notes[page].log || []).forEach(entry => {\n        entries.push({ page, text: entry.text, at: entry.at });\n      });\n    });\n    entries.sort((a, b) => new Date(b.at) - new Date(a.at));\n    el.innerHTML = entries.slice(0, 8).map(e => `\n      <div class=\"activity-row\" onclick=\"navigate('${e.page}')\">\n        <span class=\"activity-tag\">${PAGE_LABELS[e.page] || e.page}</span>\n        <span class=\"activity-text\">${escapeHtml(e.text)}</span>\n        <span class=\"activity-time\">${relAge(e.at)}</span>\n      </div>`).join('') || '<div class=\"empty\">No posted notes yet</div>';\n  } catch (err) {\n    el.innerHTML = '<div class=\"empty\">Could not load recent activity</div>';\n  }\n}\n\nfunction latLngToXY(lat, lng) {\n  const x = ((lng - MAP_BOUNDS.minLng) / (MAP_BOUNDS.maxLng - MAP_BOUNDS.minLng)) * MAP_W;\n  const y = MAP_H - ((lat - MAP_BOUNDS.minLat) / (MAP_BOUNDS.maxLat - MAP_BOUNDS.minLat)) * MAP_H;\n  return [Math.round(x), Math.round(y)];\n}\n\nfunction renderMap() {\n  const svg = document.getElementById('site-map');\n  if (!DATA) return;\n  const outline = BORDER.map(([lat, lng]) => latLngToXY(lat, lng).join(',')).join(' ');\n  let html = `<polygon class=\"map-land\" points=\"${outline}\"/>`;\n  DATA.sites.forEach(site => {\n    const [x, y] = latLngToXY(site.lat, site.lng);\n    const status = site.online ? statusClass(pct(site.ports_used, site.ports_total)) : 'offline';\n    html += `<g class=\"marker ${status}\" data-id=\"${site.id}\" transform=\"translate(${x}, ${y})\">\n      <circle r=\"9\"></circle>\n      <text y=\"-14\">${site.id}</text>\n    </g>`;\n  });\n  svg.innerHTML = html;\n  svg.querySelectorAll('.marker').forEach(m => m.addEventListener('click', () => openSitePopup(m.dataset.id)));\n}\n\nfunction openSitePopup(id) {\n  const site = DATA.sites.find(s => s.id === id);\n  const p = pct(site.ports_used, site.ports_total);\n  document.getElementById('site-popup-title').textContent = site.name;\n  document.getElementById('site-popup-body').innerHTML = `\n    <div class=\"kv\"><span>City</span><b>${site.city}</b></div>\n    <div class=\"kv\"><span>Region</span><b>${site.region}</b></div>\n    <div class=\"kv\"><span>Status</span><b>${site.online ? 'Online' : 'Offline'}</b></div>\n    <div class=\"kv\"><span>Switch ports</span><b>${site.ports_used} / ${site.ports_total} (${p}%)</b></div>`;\n  document.getElementById('site-popup-overlay').classList.add('open');\n}\n\nfunction closeSitePopup() {\n  document.getElementById('site-popup-overlay').classList.remove('open');\n}\n\nfunction navigate(id) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));\n  const page = document.getElementById('page-' + id);\n  if (page) page.classList.add('active');\n  const nav = document.querySelector(`.nav-item[data-page=\"${id}\"]`);\n  if (nav) nav.classList.add('active');\n  localStorage.setItem('dash-page', id);\n  loadNote(id);\n  if (id === 'map') renderMap();\n}\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  setTheme(localStorage.getItem('dash-theme') || 'light');\n  document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));\n  initSettings();\n  document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigate(i.dataset.page)));\n  document.getElementById('refresh-btn').addEventListener('click', () => fetchData(true));\n  document.getElementById('ip-external-filter').addEventListener('input', () => {\n    pagerState['ip-external'] = 0;\n    renderExternalIpTable();\n  });\n  document.getElementById('ip-external-pagesize').addEventListener('change', renderExternalIpTable);\n  document.getElementById('ip-external-prev').addEventListener('click', () => {\n    pagerState['ip-external']--;\n    renderExternalIpTable();\n  });\n  document.getElementById('ip-external-next').addEventListener('click', () => {\n    pagerState['ip-external']++;\n    renderExternalIpTable();\n  });\n  document.getElementById('site-popup-close').addEventListener('click', closeSitePopup);\n  document.getElementById('site-popup-overlay').addEventListener('click', e => {\n    if (e.target === e.currentTarget) closeSitePopup();\n  });\n  document.addEventListener('keydown', e => {\n    if (e.key === 'Escape') closeSitePopup();\n  });\n  fetchData();\n  navigate(localStorage.getItem('dash-page') || 'overview');\n});\n","api/data.php":"<?php\nrequire __DIR__ . '/config.php';\n\nheader('Content-Type: application/json');\nheader('Cache-Control: no-store');\n\n$cacheFile = __DIR__ . '/../data/response_cache.json';\n$force = isset($_GET['refresh']);\n\nif (!$force && is_file($cacheFile) && time() - filemtime($cacheFile) < CACHE_TTL) {\n    header('X-Cache: HIT');\n    readfile($cacheFile);\n    exit;\n}\n\nfunction pct(int $used, int $total): int {\n    return $total > 0 ? (int) round(($used / $total) * 100) : 0;\n}\n\nfunction read_json(string $file): array {\n    if (!is_file($file)) return [];\n    $data = json_decode(file_get_contents($file), true);\n    return is_array($data) ? $data : [];\n}\n\n$sites = read_json(__DIR__ . '/../data/sites.json');\n$ranges = read_json(__DIR__ . '/../data/ip_external.json');\n\n$ports = ['used' => 0, 'total' => 0];\n$racks = ['used' => 0, 'total' => 0];\nforeach ($sites as $site) {\n    $ports['used'] += $site['ports_used'];\n    $ports['total'] += $site['ports_total'];\n    $racks['used'] += $site['racks_used'];\n    $racks['total'] += $site['racks_total'];\n}\n\n$ipUsed = 0;\n$ipTotal = 0;\nforeach ($ranges as $r) {\n    $ipUsed += $r['used'];\n    $ipTotal += $r['total'];\n}\n\n$payload = json_encode([\n    'generated_at' => date('c'),\n    'sites'        => $sites,\n    'ports'        => $ports,\n    'racks'        => $racks,\n    'ip_external'  => [\n        'used'   => $ipUsed,\n        'total'  => $ipTotal,\n        'pct'    => pct($ipUsed, $ipTotal),\n        'ranges' => $ranges,\n    ],\n], JSON_UNESCAPED_UNICODE);\n\nfile_put_contents($cacheFile, $payload);\nheader('X-Cache: MISS');\necho $payload;\n","api/notes.php":"<?php\nheader('Content-Type: application/json');\nheader('Cache-Control: no-store');\n\n$file = __DIR__ . '/../data/notes.json';\n$dir = dirname($file);\n\nfunction read_notes(string $file): array {\n    if (!is_file($file)) return [];\n    $data = json_decode(file_get_contents($file), true);\n    return is_array($data) ? $data : [];\n}\n\n$allowed = ['ip-external', 'map'];\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    if (!is_dir($dir) || !is_writable($dir)) {\n        http_response_code(500);\n        echo json_encode(['ok' => false, 'error' => 'data/ directory is not writable by the web server']);\n        exit;\n    }\n    $body = json_decode(file_get_contents('php://input'), true);\n    $page = $body['page'] ?? '';\n    $note = (string) ($body['note'] ?? '');\n    $action = $body['action'] ?? 'save';\n    if (!in_array($action, ['save', 'post', 'clear', 'delete_log'], true)) $action = 'save';\n    if (!in_array($page, $allowed, true)) {\n        http_response_code(400);\n        echo json_encode(['ok' => false, 'error' => 'invalid page']);\n        exit;\n    }\n    if ($action === 'post' && trim($note) === '') {\n        http_response_code(400)
