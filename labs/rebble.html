{
  title: 'Notes API', sub: 'PHP writes a file: POST, validation, locking', commit: 'Add notes API with locking', view: 'api', probes: NOTE_PROBES,
  brief: 'Server only this time. Build <code>api/notes.php</code>: it answers GET with every note, and on POST it pins, posts, clears or deletes notes in <code>data/notes.json</code>. Test it with the request runner on the right.',
  teach: '<div class="eyebrow">Stage 9 · School</div><h2>Notes API</h2><p>Until now PHP only <b>read</b>. Now it <b>writes</b>. Writing needs three new habits: read the request body, refuse bad input, and lock the file.</p>'
    + '<h3>the data</h3>' + P('{\n    "ip-external": {\n        "note": "Check the /26 in Hill Valley",\n        "log": [\n            { "text": "Moved 3 IPs to Emerald City", "at": "2026-10-26T09:12:00+00:00" }\n        ]\n    }\n}')
    + '<h3>GET vs POST</h3>' + FLOW('GET', '→', 'read file', '→', '{ok, notes}') + FLOW('POST {page, action, note}', '→', 'check', '→', 'lock + change + write', '→', '{ok, note, log}')
    + '<h3>1 · the body</h3>' + COLS(P("$body = json_decode(file_get_contents('php://input'), true);\n$page = $body['page'] ?? '';"), UL('JS sends JSON, so <code>$_POST</code> stays empty', '<code>php://input</code> = the raw body', '<code>??</code> = "or this default if missing"'))
    + '<h3>2 · refuse bad input</h3>' + COLS(P("$allowed = ['ip-external', 'map'];\nif (!in_array($page, $allowed, true)) {\n    http_response_code(400);\n    echo json_encode(['ok' => false, 'error' => 'invalid page']);\n    exit;\n}"), UL('an <b>allow-list</b>: only pages you know', '<b>400</b> = "your request is wrong"', '<code>exit</code> = stop here'))
    + '<h3>3 · lock while writing</h3>' + COLS(P("$fp = fopen($file, 'c+');\nflock($fp, LOCK_EX);\n$notes = json_decode(stream_get_contents($fp), true);\n…change $notes…\nftruncate($fp, 0);\nrewind($fp);\nfwrite($fp, json_encode($notes, JSON_PRETTY_PRINT));\nflock($fp, LOCK_UN);\nfclose($fp);"), UL('<code>c+</code> = open for read+write, create if missing, don\'t wipe', '<code>LOCK_EX</code> = "my turn": a second request waits', 'empty the file, go back to the start, write it all', 'two colleagues posting at the same second can\'t erase each other'))
    + '<h3>the four actions</h3>' + UL('<b>save</b>: <code>note</code> becomes the pinned note', '<b>post</b>: add <code>{text, at: date(\'c\')}</code> to the log (empty → 400)', '<b>clear</b>: pinned note becomes <code>\'\'</code>, log stays', '<b>delete_log</b>: <code>array_splice($log, $index, 1)</code>')
    + REAL('this is your <code>notes.php</code> almost line for line, including the writable check, the allow-list and flock.'),
  drills: [
    { k: 'pick', q: 'JS sends JSON. Where does PHP find the body?', o: ['<code>php://input</code>', '<code>$_GET</code>', "<code>$_SERVER['body']</code>"], a: 0 },
    { k: 'type', q: 'Status code for "your request is wrong"', a: ['400'] },
    { k: 'pick', q: 'Why <code>flock($fp, LOCK_EX)</code>?', o: ['two requests can\'t write the file at the same time', 'it makes the file read-only', 'it encrypts it'], a: 0 },
    { k: 'type', q: "<code>$page = $body['page'] ____ '';</code> (default when missing)", a: ['??'] },
    { k: 'order', q: 'Order the safe write.', lines: ["$fp = fopen($file, 'c+');", 'flock($fp, LOCK_EX);', '$notes = json_decode(stream_get_contents($fp), true);', 'ftruncate($fp, 0);', 'rewind($fp);', 'fwrite($fp, json_encode($notes));', 'flock($fp, LOCK_UN);', 'fclose($fp);'], hint: 'Open, lock, read… then empty, rewind, write… unlock, close.' }
  ],
  specs: [['file', '<code>api/notes.php</code> · stores in <code>data/notes.json</code>'], ['GET', '<code>{ok: true, notes: {…}}</code> (empty when no file)'], ['POST body', 'JSON <code>{page, action, note, index}</code>'], ['save', 'pin <code>note</code>'], ['post', 'add <code>{text, at}</code> to <code>log</code> · empty → 400 "cannot post an empty note"'], ['clear', 'pinned note → <code>\'\'</code>, log stays'], ['delete_log', 'remove <code>log[index]</code>'], ['pages', 'allow-list: ip-external · map · others → 400 "invalid page"'], ['answer', '<code>{ok: true, note, log}</code>'], ['safety', 'data/ not writable → 500 · <code>flock</code> while writing']],
  blanks: { 'api/notes.php': ["__DIR__ . '/../data/notes.json'", "['ip-external', 'map']", "$_SERVER['REQUEST_METHOD'] === 'POST'", "'php://input'", '??', 'in_array($page, $allowed, true)', 'http_response_code(400)', 'trim($note)', "'c+'", 'LOCK_EX', 'stream_get_contents', "date('c')", 'array_splice', 'ftruncate', 'LOCK_UN', "'ok' => true, 'notes'"] },
  hints: ['Two halves: <code>if ($_SERVER[\'REQUEST_METHOD\'] === \'POST\') { … exit; }</code> and, below it, the GET answer.', 'Inside POST, in this order: writable check → read body → validate (action, page, empty post) → lock → change → write → unlock → answer.', '<code>$existing = $notes[$page] ?? [\'note\' => \'\', \'log\' => []];</code> gives you a safe starting point for a page with no notes yet.'],
  tests: [
    { t: 'GET answers <code>{ok: true, notes}</code> before anything is saved', f: async (c) => { need(c.has('api/notes.php'), 'Create <code>api/notes.php</code>'); const r = await c.api('GET', 'api/notes.php'); need(r.status === 200 && r.json, 'GET should answer JSON with 200: <code>' + esc(r.text.slice(0, 160)) + '</code>'); need(r.json.ok === true, '<code>ok</code> should be true'); need(r.json.notes && typeof r.json.notes === 'object' && Object.keys(r.json.notes).length === 0, '<code>notes</code> should be empty'); } },
    { t: 'POST save pins a note', f: async (c) => { const r = await c.api('POST', 'api/notes.php', { page: 'ip-external', action: 'save', note: 'Pinned A' }); need(r.status === 200 && r.json && r.json.ok === true, 'save failed: <code>' + esc(r.text.slice(0, 160)) + '</code>'); need(r.json.note === 'Pinned A', 'The answer should include <code>note</code>'); const g = (await c.api('GET', 'api/notes.php')).json; need(g && g.notes['ip-external'] && g.notes['ip-external'].note === 'Pinned A', 'GET should now return the pinned note'); need(c.srvFile('data/notes.json'), 'PHP should write <code>data/notes.json</code>'); } },
    { t: 'POST post adds <code>{text, at}</code>, keeps the pin', f: async (c) => { await c.api('POST', 'api/notes.php', { page: 'ip-external', action: 'post', note: 'first' }); const r = await c.api('POST', 'api/notes.php', { page: 'ip-external', action: 'post', note: 'second' }); const j = r.json || {}; need(Array.isArray(j.log) && j.log.length === 2, 'After two posts, <code>log</code> should hold 2 entries'); need(j.log[1].text === 'second' && !isNaN(Date.parse(j.log[1].at)), 'Each entry is <code>{text, at: date(\'c\')}</code>'); need(j.note === 'Pinned A', 'Posting must not change the pinned note'); } },
    { t: 'delete_log removes one entry by index', f: async (c) => { const j = (await c.api('POST', 'api/notes.php', { page: 'ip-external', action: 'delete_log', index: 0 })).json || {}; need(Array.isArray(j.log) && j.log.length === 1 && j.log[0].text === 'second', 'After deleting index 0, only "second" should remain'); } },
    { t: 'clear empties the pin, keeps the log', f: async (c) => { const j = (await c.api('POST', 'api/notes.php', { page: 'ip-external', action: 'clear' })).json || {}; need(j.note === '', 'note should be an empty string'); need(Array.isArray(j.log) && j.log.length === 1, 'clear must keep the log'); } },
    { t: 'Unknown page → 400', f: async (c) => { const r = await c.api('POST', 'api/notes.php', { page: 'settings', action: 'save', note: 'x' }); need(r.status === 400, 'Expected status 400, got ' + r.status); need(r.json && r.json.ok === false && r.json.error, 'Answer <code>{ok: false, error: \'invalid page\'}</code>'); } },
    { t: 'Empty post → 400', f: async (c) => { const r = await c.api('POST', 'api/notes.php', { page: 'ip-external', action: 'post', note: '   ' }); need(r.status === 400 && r.json && r.json.ok === false, 'A post with only spaces should be refused with 400'); } },
    { t: 'Reads <code>php://input</code> and uses <code>flock</code>', f: (c) => { const s = c.src('api/notes.php'); need(/php:\/\/input/.test(s), 'Read the body from <code>php://input</code>'); need(/flock\s*\(\s*\$\w+\s*,\s*LOCK_EX/.test(s) && /LOCK_UN/.test(s), 'Lock with <code>LOCK_EX</code> and release with <code>LOCK_UN</code>'); } }
  ]
},
{

  brief: 'Give the API a face. Put a notes card on External IPs: a textarea with Save / Post / Clear, and the log under it, newest first, each with a × to delete. Notes load whenever you open the page.',
  teach: '<div class="eyebrow">Stage 10 · School</div><h2>Notes UI</h2><p>This is the stage where front and back meet: a button in the browser changes a file on the server.</p>'
    + FLOW('click Post', '→', "saveNote('ip-external', 'post')", '→', 'POST api/notes.php', '→', '{ok, note, log}', '→', 'renderNoteLog()')
    + '<h3>sending JSON</h3>' + P("const res = await fetch('api/notes.php', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json' },\n  body: JSON.stringify({ page, action, note: box.value, index }),\n});\nconst j = await res.json();\nif (!j.ok) throw new Error(j.error);") + '<p><code>{ page, action }</code> is short for <code>{ page: page, action: action }</code>.</p>'
    + '<h3>newest first</h3>' + COLS(P("let html = '';\nfor (let i = log.length - 1; i >= 0; i--) {\n  html += §<div class=\"log-row\">…$\\{escapeHtml(log[i].text)}…</div>§;\n}"), UL('walk the array backwards', 'keep <code>i</code>: the × button needs the real index for <code>delete_log</code>'))
    + '<h3>never trust text</h3><p>If a note says <code>&lt;img src=x onerror=alert(1)&gt;</code> and you put it in innerHTML, the browser <b>runs</b> it. That is called XSS. Escape every piece of user text:</p>' + P("function escapeHtml(s) {\n  return String(s)\n    .replace(/&/g, '&amp;')\n    .replace(/</g, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;');\n}") + '<p><b>&amp; first</b>, or you would escape your own escapes.</p>'

    { k: 'type', q: "<code>escapeHtml('&lt;b&gt;')</code> returns…", a: ['&lt;b&gt;'] },

  ],
  specs: [['card', '<code>.card</code> on External IPs, under the table · title "Notes"'], ['input', '<code>textarea#notes-ip-external.notes-input</code>'], ['buttons', 'in <code>.notes-actions</code>: Save · Post (<code>.btn-primary</code>) · Clear → <code>onclick="saveNote(\'ip-external\', \'save\')"</code> etc.'], ['log', '<code>#notes-log-ip-external</code> › <code>.log-row</code> › <code>.log-time</code> + <code>.log-text</code> + <code>button.log-del</code> × · newest first'], ['load', '<code>navigate(id)</code> → <code>loadNote(id)</code> fills textarea + log'], ['after save', 'textarea shows the pinned note (<code>j.note</code>) · log redrawn · toast'], ['safety', '<code>escapeHtml()</code> on every note text']],

  tests: [
    { t: 'Notes card on External IPs', f: async (c) => { await c.load(); need(c.$('#page-ip-external textarea#notes-ip-external'), 'Add <code>textarea#notes-ip-external</code> inside #page-ip-external'); need(c.$('#page-ip-external #notes-log-ip-external'), 'Add <code>#notes-log-ip-external</code> under the buttons'); const b = ['Save', 'Post', 'Clear'].filter((t) => !c.byText('#page-ip-external button', t)); need(!b.length, 'Missing buttons: ' + b.join(', ')); } },

{
  title: 'Recent activity', sub: 'combine, sort, relative time', commit: 'Add recent activity panel to the overview',
  brief: 'Fill the empty space under the Overview cards with a Recent activity panel: the latest posts from every page, newest first, with "5m ago"-style times. Click one to jump to its page.',
  teach: '<div class="eyebrow">Stage 11 · School</div><h2>Recent activity</h2><p>The notes API answers per page. The Overview wants one list across all pages. So: <b>flatten</b>, <b>sort</b>, <b>cut</b>.</p>'
    + FLOW('{page: {log: […]}}', '→ flatten →', '[{page, text, at}, …]', '→ sort newest →', 'slice(0, 8)', '→', '.activity-row')
    + COLS(P("const entries = [];\nObject.keys(notes).forEach(page => {\n  (notes[page].log || []).forEach(entry => {\n    entries.push({ page, text: entry.text, at: entry.at });\n  });\n});\nentries.sort((a, b) => new Date(b.at) - new Date(a.at));"), UL('<code>Object.keys(notes)</code> → <code>[\'ip-external\', \'map\']</code>', '<code>|| []</code> = a page without a log is fine', 'sort gets two items: return a negative number to put <code>a</code> first', '<code>b − a</code> = largest (newest) first'))
    + '<h3>relAge(iso)</h3>' + COLS(P("function relAge(iso) {\n  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);\n  if (min < 1) return 'just now';\n  if (min < 60) return min + 'm ago';\n  const hr = Math.round(min / 60);\n  if (hr < 24) return hr + 'h ago';\n  return Math.round(hr / 24) + 'd ago';\n}"), UL('milliseconds ÷ 60000 = minutes', 'then hours, then days', 'each <code>return</code> stops the function: no else needed'))
    + '<p>Each row gets <code>onclick="navigate(\'…\')"</code> and a tag from <code>PAGE_LABELS</code>. Refresh the list on load (in fetchData\'s finally) and after every saveNote.</p>'
    + REAL('the Overview had a big empty area on wide screens; this panel ("latest posted notes across all pages, newest first, relative timestamps, click-through") is how you filled it.'),
  drills: [
    { k: 'pick', q: '<code>arr.sort((a, b) => b - a)</code> sorts…', o: ['largest first', 'smallest first', 'alphabetically'], a: 0 },
    { k: 'type', q: 'A post from 90 minutes ago: relAge gives…', a: ['2h ago'], hint: 'Math.round(90 / 60) = ?' },
    { k: 'type', q: 'Keep only the first 8 items of <code>entries</code>', a: [/^entries\.slice\(\s*0\s*,\s*8\s*\)\s*;?$/], show: 'entries.slice(0, 8)' },
    { k: 'pick', q: "<code>Object.keys({ a: 1, b: 2 })</code>", o: ["<code>['a', 'b']</code>", '<code>[1, 2]</code>', '<code>2</code>'], a: 0 }
  ],
  specs: [['card', '<code>.card</code> on Overview under the metrics · title "Recent activity" · <code>#activity-list</code>'], ['row', '<code>.activity-row</code> › <code>.activity-tag</code> + <code>.activity-text</code> + <code>.activity-time</code>'], ['order', 'newest first · max 8'], ['labels', '<code>PAGE_LABELS</code>: ip-external → External IPs · map → Site Map'], ['time', '<code>relAge(iso)</code>: just now · 5m ago · 2h ago · 3d ago'], ['click', 'row → <code>navigate(page)</code>'], ['refresh', 'in fetchData\'s finally + after saveNote'], ['empty', '"No posted notes yet"']],
  seedSrv: () => ({ 'data/notes.json': notesSeed() }),
  blanks: { 'index.html': ['activity-list'], 'css/style.css': ['.activity-row:hover', '.activity-tag'], 'js/app.js': ["'map': 'Site Map'", '60000', "min + 'm ago'", 'Math.round(hr / 24)', 'Object.keys(notes)', 'entries.push', 'new Date(b.at) - new Date(a.at)', 'slice(0, 8)', 'relAge(e.at)', '${e.page}'] },
  hints: ['renderRecentActivity() is async: fetch api/notes.php, flatten into <code>entries</code>, sort, slice, map to rows, join. Wrap it in try/catch.', 'Two calls: <code>renderRecentActivity();</code> in fetchData\'s finally and in saveNote after renderNoteLog.'],
  tests: [
    { t: '<code>relAge()</code> speaks human', f: async (c) => { await c.load(); const r = c.fn('relAge'); need(typeof r === 'function', 'Define <code>relAge(iso)</code>'); const got = [20e3, 5 * 60e3, 90 * 60e3, 3 * 864e5].map((ms) => r(new Date(Date.now() - ms).toISOString())); need(got.join('|') === 'just now|5m ago|2h ago|3d ago', 'Got: ' + got.join(' · ')); } },
    { t: 'Empty state when nobody posted', fresh: true, f: async (c) => { await c.load(); need(c.$('#page-overview #activity-list'), 'Add <code>#activity-list</code> to the Overview'); need(await c.until(() => /no posted notes yet/i.test(c.text('#activity-list'))), 'Show "No posted notes yet" when the log is empty'); } },
    { t: 'Shows posts from every page, newest first', fresh: true, f: async (c) => { c.setSrv('data/notes.json', notesSeed()); await c.reload(); need(await c.until(() => c.$$('#activity-list .activity-row').length === 3), 'Expected 3 <code>.activity-row</code>, found ' + c.$$('#activity-list .activity-row').length); const r = c.$$('#activity-list .activity-row'); need(/Moved 3 IPs/.test(r[0].textContent) && /HAD1/.test(r[1].textContent) && /Spare range/.test(r[2].textContent), 'Order should be 5m ago, 2h ago, 3d ago'); need(c.text(r[1].querySelector('.activity-tag')) === 'Site Map' && c.text(r[0].querySelector('.activity-tag')) === 'External IPs', 'Tags should come from PAGE_LABELS'); need(c.text(r[0].querySelector('.activity-time')) === '5m ago', 'Times use relAge()'); } },
    { t: 'At most 8 rows', fresh: true, f: async (c) => { const log = Array.from({ length: 12 }, (_, i) => ({ text: 'post ' + i, at: isoAgo(i * 60e3 + 1000) })); c.setSrv('data/notes.json', JSON.stringify({ 'ip-external': { note: '', log } })); await c.reload(); await c.until(() => c.$$('#activity-list .activity-row').length > 0); need(c.$$('#activity-list .activity-row').length === 8, 'Show only the 8 newest'); } },
    { t: 'Clicking a row opens its page', fresh: true, f: async (c) => { c.setSrv('data/notes.json', notesSeed()); await c.reload(); await c.until(() => c.$$('#activity-list .activity-row').length === 3); await c.click(c.$$('#activity-list .activity-row')[1]); need(c.visible('#page-map'), 'Clicking the Site Map row should navigate(\'map\')'); } },
    { t: 'Posting a note updates the list', fresh: true, f: async (c) => { await onPage(c, 'ip-external'); await c.type('#notes-ip-external', 'fresh from the UI'); await c.click(c.byText('#page-ip-external button', 'Post')); await c.idle(); need(await c.until(() => /fresh from the UI/.test(c.text('#activity-list'))), 'Call renderRecentActivity() after a successful saveNote'); } },
    { t: 'Text is escaped', fresh: true, f: async (c) => { c.setSrv('data/notes.json', JSON.stringify({ map: { note: '', log: [{ text: '<i>sneaky</i>', at: isoAgo(1000) }] } })); await c.reload(); await c.until(() => c.$('#activity-list .activity-row')); const t = c.$('#activity-list .activity-text'); need(t && !t.querySelector('i') && /<i>/.test(t.textContent), 'Use escapeHtml(e.text)'); } }
  ]
},
{
  title: 'Site map', sub: 'SVG, coordinates, a popup', commit: 'Add SVG site map with popups',
  brief: 'Draw the island as SVG and put a marker on every site, coloured by status. Turning latitude/longitude into x/y is one small formula. Clicking a marker opens a popup with the site details.',
  teach: '<div class="eyebrow">Stage 12 · School</div><h2>Site map</h2><p>SVG is drawing with tags. A <code>viewBox</code> gives you your own coordinate system, then the browser scales it to any size.</p>'
    + COLS(P('<svg viewBox="0 0 700 580">\n  <polygon points="10,20 80,20 50,90"/>\n  <g transform="translate(120, 80)">\n    <circle r="9"/>\n    <text y="-14">GOT1</text>\n  </g>\n</svg>'), UL('(0, 0) is the <b>top-left</b>, y grows <b>down</b>', '<code>&lt;g&gt;</code> = a group, moved as one with <code>translate(x, y)</code>', 'inside the group, the circle sits at (0, 0)', 'CSS styles SVG too: <code>fill</code>, <code>stroke</code>'))
    + '<h3>lat/lng → x/y</h3>' + FLOW('lng 30 … 44', '→', 'x 0 … 700') + FLOW('lat 20 … 10', '→', 'y 0 … 580')
    + P("function latLngToXY(lat, lng) {\n  const x = ((lng - MAP_BOUNDS.minLng) / (MAP_BOUNDS.maxLng - MAP_BOUNDS.minLng)) * MAP_W;\n  const y = MAP_H - ((lat - MAP_BOUNDS.minLat) / (MAP_BOUNDS.maxLat - MAP_BOUNDS.minLat)) * MAP_H;\n  return [Math.round(x), Math.round(y)];\n}")
    + UL('<code>(value − min) / (max − min)</code> = how far along, from 0 to 1', '× the width = pixels', '<b>y is flipped</b>: north = higher latitude = smaller y, so <code>MAP_H − …</code>')
    + '<h3>given: the border</h3><p>Copy this list into app.js. Each pair is [lat, lng]; map it through latLngToXY and join into a polygon:</p>' + P('const BORDER = [\n  [19.2, 33], [19.6, 35.5], [19, 38], [19.4, 40.5], [18.2, 42.8], [16.5, 43.3],\n  [15, 42], [13.4, 43], [11.6, 41.5], [10.6, 39], [11.2, 36.5], [10.5, 34],\n  [11.8, 31.5], [13.8, 30.8], [15.5, 31.8], [17.2, 30.6], [18.6, 31.4],\n];')
    + '<h3>the popup</h3>' + COLS(P("overlay.addEventListener('click', e => {\n  if (e.target === e.currentTarget) closeSitePopup();\n});\ndocument.addEventListener('keydown', e => {\n  if (e.key === 'Escape') closeSitePopup();\n});"), UL('<code>.site-popup-overlay</code> covers the screen, hidden until <code>.open</code>', '<code>e.target</code> = what you clicked, <code>e.currentTarget</code> = the overlay', 'equal = you clicked the dark backdrop, not the popup'))
    + REAL('the same <code>MAP_BOUNDS</code> and <code>latLngToXY()</code>, with a map image behind and draggable markers saved in localStorage.'),
  drills: [
    { k: 'pick', q: 'In SVG, y = 0 is…', o: ['the top', 'the bottom', 'the middle'], a: 0 },
    { k: 'type', q: 'Bounds lng 30 → 44, map 700 wide. lng 30 lands at x =', a: ['0'] },
    { k: 'type', q: '…and lng 44 at x =', a: ['700'] },
    { k: 'pick', q: 'Why <code>MAP_H − (…)</code> for y?', o: ['latitude grows north but SVG y grows down', 'to centre the map', 'it is a typo'], a: 0 },
    { k: 'type', q: 'Move a group to x 120, y 80: <code>transform="____"</code>', a: [/^translate\(\s*120\s*,?\s*80\s*\)$/], show: 'translate(120, 80)' },
    { k: 'pick', q: '<code>if (e.target === e.currentTarget)</code> on the overlay means…', o: ['only clicks on the backdrop close it', 'every click closes it', 'it never closes'], a: 0 }
  ],
  specs: [['svg', '<code>svg#site-map.site-map</code> · viewBox 0 0 700 580 · in <code>.card.map-card</code> on Site Map'], ['bounds', '<code>MAP_BOUNDS</code> lat 10 → 20 · lng 30 → 44 · <code>MAP_W</code> 700 · <code>MAP_H</code> 580'], ['land', '<code>polygon.map-land</code> from <code>BORDER</code> (given in School)'], ['markers', '<code>g.marker.{ok|warn|crit|offline}[data-id]</code> › <code>circle r="9"</code> + <code>text</code> site id · translate to latLngToXY'], ['status', 'offline when <code>!site.online</code>, else statusClass(port %)'], ['popup', '<code>#site-popup-overlay</code> (.open) › <code>.site-popup</code> › header <code>#site-popup-title</code> + × <code>#site-popup-close</code> · <code>#site-popup-body</code>: City · Region · Status · Switch ports "288 / 384 (75%)"'], ['close', '× · backdrop click · Escape'], ['draw', 'renderMap() when the map page opens and after fetchData']],
  blanks: { 'index.html': ['site-popup-overlay', 'site-popup-title', 'site-popup-body', 'site-map', 'viewBox="0 0 700 580"'], 'css/style.css': ['.marker.crit circle', 'display: none', '.site-popup-overlay.open'], 'js/app.js': ['(lng - MAP_BOUNDS.minLng)', 'MAP_H -', 'Math.round(x)', ".join(',')", 'site.online ?', 'translate(', 'data-id', 'openSitePopup(m.dataset.id)', 'DATA.sites.find', "classList.add('open')", "classList.remove('open')", 'e.target === e.currentTarget', "'Escape'", "if (id === 'map') renderMap();"] },
  hints: ['renderMap(): build one string: the polygon first, then <code>DATA.sites.forEach(site => html += …)</code>, then <code>svg.innerHTML = html</code>, then add click listeners to every <code>.marker</code>.', 'The popup HTML goes at the top of &lt;body&gt;, next to the toast container.'],
  tests: [
    { t: '<code>latLngToXY()</code> maps the corners', f: async (c) => { await c.load(); const f = c.fn('latLngToXY'); need(typeof f === 'function', 'Define <code>latLngToXY(lat, lng)</code>'); need(f(20, 30).join() === '0,0', 'North-west corner (20, 30) should be [0, 0], got [' + f(20, 30) + ']'); need(f(10, 44).join() === '700,580', 'South-east corner (10, 44) should be [700, 580], got [' + f(10, 44) + ']'); } },
    { t: 'Map draws the island and 10 markers', fresh: true, f: async (c) => { await onPage(c, 'map'); need(c.$('#page-map svg#site-map'), 'Add <code>svg#site-map</code> on the map page'); need(await c.until(() => c.$$('#site-map .marker').length === 10), 'Expected 10 <code>g.marker</code>, found ' + c.$$('#site-map .marker').length); const pg = c.$('#site-map polygon.map-land'); need(pg && (pg.getAttribute('points') || '').split(' ').length >= 12, 'Draw <code>polygon.map-land</code> from BORDER'); } },
    { t: 'Marker colour follows the status', f: async (c) => { await onPage(c, 'map'); await c.until(() => c.$$('#site-map .marker').length); const cls = (id) => ['ok', 'warn', 'crit', 'offline'].find((s) => (c.$('#site-map .marker[data-id="' + id + '"]') || { classList: { contains: () => false } }).classList.contains(s)); need(cls('HAD1') === 'offline', 'HAD1 is offline: class <code>offline</code>'); need(cls('MET1') === 'crit' && cls('GOT1') === 'warn' && cls('BED1') === 'ok', 'MET1 crit · GOT1 warn · BED1 ok (by port %)'); need(c.css('#site-map .marker[data-id="MET1"] circle', 'fill') !== c.css('#site-map .marker[data-id="BED1"] circle', 'fill'), 'Colour the circles by class'); } },
    { t: 'Markers sit on their coordinates', f: async (c) => { await onPage(c, 'map'); await c.until(() => c.$$('#site-map .marker').length); const m = c.$('#site-map .marker[data-id="GOT1"]'); need(m, 'Each marker needs <code>data-id</code>'); const [x, y] = c.fn('latLngToXY')(15, 37); const t = (m.getAttribute('transform') || '').replace(/\s+/g, ''); need(t === 'translate(' + x + ',' + y + ')', 'GOT1 should be at translate(' + x + ', ' + y + '), found ' + esc(m.getAttribute('transform') || 'none')); } },
    { t: 'Clicking a marker opens the popup', f: async (c) => { await onPage(c, 'map'); await c.until(() => c.$('#site-map .marker[data-id="GOT1"]')); await c.click('#site-map .marker[data-id="GOT1"]'); need(c.$('#site-popup-overlay.open') && c.visible('#site-popup-overlay'), 'The overlay should get <code>.open</code> and show'); need(c.text('#site-popup-title') === 'Gotham DC', 'Title should be the site name'); const b = c.text('#site-popup-body'); need(/Gotham/.test(b) && /center/.test(b) && /Online/.test(b) && /288 \/ 384 \(75%\)/.test(b), 'Body should list City, Region, Status, Switch ports "288 / 384 (75%)"'); } },
    { t: 'Closes with ×, backdrop and Escape', f: async (c) => { await onPage(c, 'map'); await c.until(() => c.$('#site-map .marker')); const open = () => c.click('#site-map .marker[data-id="HIL1"]'), isOpen = () => !!c.$('#site-popup-overlay.open'); await open(); await c.click('#site-popup-close'); need(!isOpen(), '× should close it'); await open(); await c.click('.site-popup'); need(isOpen(), 'Clicking inside the popup must NOT close it'); c.$('#site-popup-overlay').dispatchEvent(new c.win.MouseEvent('click', { bubbles: true })); need(!isOpen(), 'Clicking the backdrop should close it'); await open(); await c.key('Escape'); need(!isOpen(), 'Escape should close it'); } }
  ]
},
{
  title: 'Config, secrets + cache', sub: 'config.php, .gitignore, response cache', commit: 'Add config file and response cache',
  brief: 'Two grown-up habits. One: settings and secrets live in <code>api/config.php</code>, which never goes into git (you commit an example file instead). Two: data.php caches its answer for 2 minutes, so 20 open browsers don\'t hammer every API every minute.',
  teach: '<div class="eyebrow">Stage 13 · School</div><h2>Config, secrets + cache</h2><h3>1 · secrets out of git</h3>'
    + '<div class="tree">api/\n├── config.php          ← real values, NEVER committed\n├── config.example.php  ← same keys, fake values, committed\n.gitignore              ← tells git to ignore config.php</div>'
    + COLS(P("<?php\ndefine('CACHE_TTL', 120);\ndefine('MAP_API_KEY', 'lab-only-key-7f3a');"), UL('<code>define(\'NAME\', value)</code> = a constant, readable everywhere after <code>require</code>', 'a new machine: copy the example to config.php and fill it in', '.gitignore = one path per line'))
    + '<div class="callout"><b>Why this matters</b> · a real config.php holds API secrets, tokens and database passwords. Once one has been in a zip or a repo, treat those secrets as leaked: rotate them. Keep config.php out of every zip and repo; share config.example.php instead.</div>'
    + '<h3>2 · the cache</h3>' + FLOW('request', '→', 'cache file younger than CACHE_TTL?', 'yes →', 'readfile + exit (HIT)') + FLOW('no / ?refresh=1', '→', 'build payload', '→', 'write cache', '→', 'echo (MISS)')
    + P("$cacheFile = __DIR__ . '/../data/response_cache.json';\n$force = isset($_GET['refresh']);\n\nif (!$force && is_file($cacheFile) && time() - filemtime($cacheFile) < CACHE_TTL) {\n    header('X-Cache: HIT');\n    readfile($cacheFile);\n    exit;\n}\n\n…build $payload…\n\nfile_put_contents($cacheFile, $payload);\nheader('X-Cache: MISS');\necho $payload;")
    + UL('<code>filemtime()</code> = when the file was last written (seconds)', '<code>time() − filemtime()</code> = its age', 'the ↻ button sends <code>?refresh=1</code>: that skips the cache (fetchData(true) already does this since stage 7)', '<code>X-Cache</code> = a note for you in DevTools, the browser ignores it')
    + REAL('data.php has a 120-second response cache with HIT / STALE / REVALIDATING and a lock so only one request rebuilds at a time. This is its simple core.'),
  drills: [
    { k: 'pick', q: 'Which file goes into git?', o: ['config.example.php', 'config.php', 'both'], a: 0 },
    { k: 'type', q: 'PHP: the age in seconds of <code>$cacheFile</code>', a: [/^time\(\)\s*-\s*filemtime\(\s*\$cacheFile\s*\)\s*;?$/], show: 'time() - filemtime($cacheFile)' },
    { k: 'pick', q: "<code>isset($_GET['refresh'])</code> is true for…", o: ['api/data.php?refresh=1', 'api/data.php', 'both'], a: 0 },
    { k: 'type', q: 'The .gitignore line that keeps <code>api/config.php</code> out of git', a: ['api/config.php', '/api/config.php'] },
    { k: 'pick', q: 'TTL 120, the cache file is 30 seconds old. The next request…', o: ['gets the cached file (HIT)', 'rebuilds (MISS)', 'fails'], a: 0 }
  ],
  specs: [['config', '<code>api/config.php</code> · <code>define(\'CACHE_TTL\', 120)</code> + <code>define(\'MAP_API_KEY\', …)</code>'], ['example', '<code>api/config.example.php</code> · same keys · placeholder values'], ['git', '<code>.gitignore</code>: api/config.php · data/notes.json · data/response_cache.json'], ['data.php', '<code>require __DIR__ . \'/config.php\';</code> first'], ['cache', '<code>data/response_cache.json</code> · fresh → readfile + exit · X-Cache HIT / MISS'], ['refresh', '<code>?refresh=1</code> skips the cache and rebuilds']],
  blanks: { 'api/config.php': ["'CACHE_TTL', 120", 'MAP_API_KEY'], 'api/config.example.php': ["'put-your-key-here'"], '.gitignore': ['api/config.php', 'data/response_cache.json'], 'api/data.php': ["require __DIR__ . '/config.php'", "isset($_GET['refresh'])", '!$force', 'time() - filemtime($cacheFile) < CACHE_TTL', 'readfile', 'exit', 'file_put_contents'] },
  hints: ['The cache check goes right after the two header() lines, before any work. The write goes right before <code>echo $payload;</code>.', 'config.example.php is a copy of config.php with the secret replaced, e.g. <code>\'put-your-key-here\'</code>.'],
  tests: [
    { t: '<code>config.php</code> defines CACHE_TTL', f: (c) => { need(c.has('api/config.php'), 'Create <code>api/config.php</code>'); need(/define\(\s*['"]CACHE_TTL['"]\s*,\s*\d+\s*\)/.test(c.src('api/config.php')), "Add <code>define('CACHE_TTL', 120);</code>"); } },
    { t: 'An example file with the same keys, no real secret', f: (c) => { need(c.has('api/config.example.php'), 'Create <code>api/config.example.php</code>'); const keys = (s) => [...s.matchAll(/define\(\s*['"](\w+)['"]\s*,\s*([^)]*)\)/g)].map((m) => [m[1], m[2].trim()]); const a = keys(c.src('api/config.php')), b = keys(c.src('api/config.example.php')); need(sameSet(a.map((x) => x[0]), b.map((x) => x[0])), 'Both files need the same define() names'); const secret = a.find((x) => x[0] !== 'CACHE_TTL'); need(secret, 'Add a secret to config.php, e.g. MAP_API_KEY'); need(b.find((x) => x[0] === secret[0])[1] !== secret[1], 'The example must not contain the real ' + secret[0]); } },
    { t: '<code>.gitignore</code> keeps secrets and runtime files out', f: (c) => { const g = c.src('.gitignore').split('\n').map((l) => l.trim().replace(/^\//, '')); const miss = ['api/config.php', 'data/notes.json', 'data/response_cache.json'].filter((p) => !g.includes(p)); need(!miss.length, 'Add to .gitignore: ' + miss.join(', ')); need(!g.includes('api/config.example.php'), 'The example file SHOULD be committed'); } },
    { t: '<code>data.php</code> loads the config and still answers', f: async (c) => { need(/require(_once)?\s*\(?\s*__DIR__\s*\.\s*['"]\/config\.php['"]/.test(c.src('api/data.php')), "Start data.php with <code>require __DIR__ . '/config.php';</code>"); const r = await c.api('GET', 'api/data.php'); need(r.status === 200 && r.json && r.json.sites, 'data.php should still answer JSON: <code>' + esc(r.text.slice(0, 160)) + '</code>'); } },
    { t: 'First request writes the cache file', fresh: true, f: async (c) => { await c.api('GET', 'api/data.php'); const f = c.srvFile('data/response_cache.json'); need(f, 'Write <code>data/response_cache.json</code> with file_put_contents'); let j = null; try { j = JSON.parse(f); } catch (e) {} need(j && j.generated_at, 'The cache file should hold the same JSON payload'); } },
    { t: 'Next request comes from the cache', f: async (c) => { const keep = c.src('data/sites.json'); c.setFile('data/sites.json', '[]'); const j = (await c.api('GET', 'api/data.php')).json || {}; c.setFile('data/sites.json', keep); need(j.sites && j.sites.length === 10, 'A fresh cache should be served as-is (readfile + exit), even though sites.json changed'); } },
    { t: '<code>?refresh=1</code> rebuilds it', f: async (c) => { const keep = c.src('data/sites.json'); c.setFile('data/sites.json', '[]'); const a = (await c.api('GET', 'api/data.php?refresh=1')).json || {}; const b = (await c.api('GET', 'api/data.php')).json || {}; c.setFile('data/sites.json', keep); need(a.sites && a.sites.length === 0, '?refresh=1 should skip the cache'); need(b.sites && b.sites.length === 0, 'The rebuilt answer should become the new cache'); } },
    { t: 'The dashboard still works', fresh: true, f: async (c) => { await c.load(); need(await c.until(() => c.$$('.metric-card').length === 3), 'Overview cards should still render'); } }
  ]
},
{
  title: 'Alerts + bell', sub: 'server rules, a dropdown, event bubbling', commit: 'Add alert rules and a bell in the top bar',
  brief: 'Let the server decide what is worth a warning. <code>data.php</code> builds a list of alerts from simple rules; the top bar gets a bell with a count, and a dropdown that jumps to the right page.',
  teach: '<div class="eyebrow">Stage 14 · School</div><h2>Alerts + bell</h2><p>An alert is just data: a level, a sentence, and where to look. The <b>rules</b> live on the server, so every browser sees the same alerts.</p>'
    + FLOW('sites + ranges', '→ rules →', '[{level, title, page}, …]', '→ JSON →', 'bell count + list')
    + COLS(P("function build_alerts(array $sites, array $ranges): array {\n    $alerts = [];\n    foreach ($sites as $site) {\n        if (!$site['online']) {\n            $alerts[] = ['level' => 'crit', 'title' => $site['name'] . ' is offline', 'page' => 'map'];\n        } elseif (pct($site['ports_used'], $site['ports_total']) >= 80) {\n            $alerts[] = ['level' => 'warn', 'title' => …, 'page' => 'map'];\n        }\n    }\n    …ranges at 90% or more → crit…\n    return $alerts;\n}"), UL('<code>$alerts[] = …</code> = push onto the list', '<code>elseif</code>: an offline site gets ONE alert, not two', '<code>.</code> joins strings in PHP', 'add it to the payload: <code>\'alerts\' => build_alerts($sites, $ranges)</code>'))
    + '<h3>the dropdown</h3>' + COLS(P("bellBtn.addEventListener('click', () => {\n  panel.classList.toggle('open');\n});\n\ndocument.addEventListener('click', e => {\n  if (!e.target.closest('.bell-wrap')) panel.classList.remove('open');\n});"), UL('a click <b>bubbles</b> up: button → … → document, so BOTH listeners hear the bell click', '<code>closest(\'.bell-wrap\')</code> = "was this click inside the bell?"', 'inside → the document listener leaves it alone, so the bell can open the panel', 'outside → close'))
    + '<h3>one listener for many rows</h3>' + P("panel.addEventListener('click', e => {\n  const row = e.target.closest('.alert-row');\n  if (!row) return;\n  navigate(row.dataset.page);\n});") + '<p>The rows are re-drawn every refresh. One listener on the panel keeps working for every new row: that is <b>event delegation</b>.</p>'
    + REAL('the bell with its count and the alert panel sit in the top bar, and the alert rules are built server-side in <code>build_alerts()</code>.'),
  drills: [
    { k: 'type', q: 'PHP: add <code>$a</code> to the end of the array <code>$alerts</code> (short form)', a: [/^\$alerts\[\]\s*=\s*\$a\s*;?$/], show: '$alerts[] = $a;' },
    { k: 'pick', q: 'A site is offline AND its ports are at 85%. How many alerts with <code>if / elseif</code>?', o: ['1: the offline one', '2', '0'], a: 0 },
    { k: 'pick', q: 'The bell click also reaches the document listener. Why doesn\'t that close the panel right away?', o: ['the document listener skips clicks inside <code>.bell-wrap</code> (closest)', 'clicks never reach the document', 'toggle runs last'], a: 0 },
    { k: 'type', q: 'From a clicked element <code>e.target</code>, find the nearest <code>.alert-row</code> above it (or itself)', a: [/^e\.target\.closest\(\s*['"]\.alert-row['"]\s*\)\s*;?$/], show: "e.target.closest('.alert-row')" },
    { k: 'pick', q: 'One listener on the panel instead of one per row is called…', o: ['event delegation', 'event bubbling prevention', 'lazy loading'], a: 0 }
  ],
  specs: [['php', '<code>build_alerts(array $sites, array $ranges): array</code> in data.php · payload key <code>alerts</code>'], ['rules', 'site offline → crit, page map · else ports ≥ 80% → warn, page map · range ≥ 90% → crit, page ip-external'], ['shape', '<code>{level, title, page}</code> · titles: "Haddonfield DC is offline", "Metropolis DC switch ports above 80%", "198.51.100.192/27 is almost full"'], ['bell', '<code>.bell-wrap</code> in .topbar-right after ↻ › <code>button#bell-btn.icon-btn</code> (bell SVG) + <code>span#bell-count.bell-count</code> + <code>div#alert-panel.alert-panel</code>'], ['count', 'number of alerts · class <code>zero</code> hides it at 0'], ['list', '<code>.alert-row[data-page]</code> › <code>span.alert-dot.{crit|warn}</code> + escaped title · empty → "No alerts"'], ['open / close', 'bell toggles <code>.open</code> · a click outside <code>.bell-wrap</code> closes · clicking a row closes and navigates'], ['draw', '<code>renderAlerts()</code> in fetchData\'s finally']],
  blanks: { 'index.html': ['bell-wrap', 'bell-count', 'alert-panel'], 'css/style.css': ['.bell-count.zero', '.alert-panel.open', '.alert-dot.crit'], 'js/app.js': ['DATA.alerts', "toggle('zero', alerts.length === 0)", 'escapeHtml(a.title)', 'renderAlerts();', "closest('.alert-row')", 'row.dataset.page', "closest('.bell-wrap')"], 'api/data.php': ["!$site['online']", 'elseif', '>= 80', '>= 90', "'page' => 'ip-external'", 'return $alerts', 'build_alerts($sites, $ranges)'] },
  hints: ['PHP first: build_alerts() under read_json(), then one line in the payload. Check with the network log: <code>GET api/data.php</code> should now carry <code>alerts</code>.', 'renderAlerts() sets the count, toggles <code>zero</code>, and fills the panel with one <code>.alert-row</code> per alert.', 'Three listeners in DOMContentLoaded: the bell (toggle), the panel (delegation), the document (a click outside .bell-wrap closes).'],
  explain: { q: 'A click on the bell bubbles up to the document, and the document listener closes the panel. Why does the bell still open?', a: 'The document listener first asks e.target.closest(\'.bell-wrap\'): was this click inside the bell area? For the bell click the answer is yes, so it leaves the panel alone and the toggle wins. Only clicks outside the bell close it.' },
  tests: [
    { t: '<code>data.php</code> sends a list of alerts', cp: 'Server rules', f: async (c) => { const j = (await c.api('GET', 'api/data.php')).json || {}; need(Array.isArray(j.alerts), 'Add <code>\'alerts\' => build_alerts($sites, $ranges)</code> to the payload'); need(j.alerts.length === 7, 'Expected 7 alerts, got ' + j.alerts.length); need(j.alerts.every((a) => a.level && a.title && a.page), 'Each alert is <code>{level, title, page}</code>'); need(j.alerts.filter((a) => a.level === 'crit').length === 5, '5 of them should be crit'); } },
    { t: 'Rules: offline → crit, ports ≥ 80% → warn, range ≥ 90% → crit', cp: 'Server rules', f: async (c) => { const a = ((await c.api('GET', 'api/data.php')).json || {}).alerts || []; const find = (re) => a.find((x) => re.test(x.title)); const off = find(/Haddonfield/), met = find(/Metropolis/), rng = find(/198\.51\.100\.192\/27/); need(off && off.level === 'crit' && off.page === 'map', 'Haddonfield DC is offline: crit, page map'); need(met && met.level === 'warn' && met.page === 'map', 'Metropolis DC (83% ports): warn, page map'); need(rng && rng.level === 'crit' && rng.page === 'ip-external', '198.51.100.192/27 (97%): crit, page ip-external'); need(!a.some((x) => /Haddonfield/.test(x.title) && x.level === 'warn'), 'An offline site gets only the offline alert: use elseif'); } },
    { t: 'The bell shows the count', cp: 'The bell', fresh: true, f: async (c) => { await c.load(); need(c.$('.topbar .bell-wrap #bell-btn'), 'Add <code>.bell-wrap</code> with <code>#bell-btn</code> to the top bar'); need(await c.until(() => c.text('#bell-count') === '7'), '#bell-count should say 7, says ' + esc(c.text('#bell-count'))); } },
    { t: 'Bell opens the list, a click outside closes it', cp: 'The bell', f: async (c) => { await c.load(); await c.click('#bell-btn'); need(c.$('#alert-panel.open') && c.visible('#alert-panel'), 'Clicking the bell should add <code>.open</code>'); need(c.$$('#alert-panel .alert-row').length === 7, 'One <code>.alert-row</code> per alert'); await c.click('.main'); need(!c.$('#alert-panel.open'), 'A click outside .bell-wrap should close it'); } },
    { t: 'Clicking an alert opens its page', cp: 'The bell', f: async (c) => { await c.load(); await c.click('#bell-btn'); const row = c.$$('#alert-panel .alert-row').find((r) => r.dataset.page === 'ip-external'); need(row, 'Rows need <code>data-page</code>'); await c.click(row); need(c.visible('#page-ip-external'), 'Clicking the row should navigate to its page'); need(!c.$('#alert-panel.open'), 'and close the panel'); } },
    { t: 'No alerts → no count, a calm message', cp: 'The bell', fresh: true, f: async (c) => { const a = c.src('data/sites.json'), b = c.src('data/ip_external.json'); c.setFile('data/sites.json', '[]'); c.setFile('data/ip_external.json', '[]'); delete c.sp.srv['data/response_cache.json']; await c.reload(); c.setFile('data/sites.json', a); c.setFile('data/ip_external.json', b); await c.until(() => c.$('#bell-count.zero')); need(!c.visible('#bell-count'), 'At 0 alerts, add class <code>zero</code> so the count hides'); need(/no alerts/i.test(c.text('#alert-panel')), 'An empty list says "No alerts"'); } },
    { t: 'Alert titles are escaped', cp: 'The bell', fresh: true, f: async (c) => { const a = c.src('data/sites.json'); c.setFile('data/sites.json', JSON.stringify([{ id: 'X1', name: '<b>X</b>', city: 'X', region: 'west', lat: 12, lng: 35, online: false, ports_used: 1, ports_total: 10, racks_used: 1, racks_total: 2 }])); delete c.sp.srv['data/response_cache.json']; await c.reload(); c.setFile('data/sites.json', a); await c.until(() => c.$('#alert-panel .alert-row')); const r = c.$('#alert-panel .alert-row'); need(r && !r.querySelector('b') && /<b>X<\/b>/.test(r.textContent), 'Use escapeHtml(a.title)'); } }
  ]
},
{
  title: 'CSV export', sub: 'build a file in the browser', commit: 'Add CSV export to the IP table',
  brief: 'One button on the IP table that downloads every range as a CSV file, ready for Excel. No server needed: the browser builds the file itself.',
  teach: '<div class="eyebrow">Stage 15 · School</div><h2>CSV export</h2><p>CSV = <b>comma-separated values</b>: one line per row, commas between cells, the first line is the header. Excel opens it directly.</p>'
    + P('range,label,total,used\n192.0.2.0/26,Gotham · customers,64,61\n203.0.113.224/28,Spare,16,2')
    + '<h3>the one tricky rule</h3>' + COLS(P("function csvCell(v) {\n  const s = String(v);\n  return /[\",\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n}"), UL('a comma inside a cell would split it in two', 'so: wrap such cells in double quotes', 'a quote inside a quoted cell is written twice: <code>""</code>', '<code>Gotham, lab</code> → <code>"Gotham, lab"</code>'))
    + '<h3>a download without a server</h3>' + FLOW('CSV text', '→', 'new Blob([csv])', '→', 'URL.createObjectURL()', '→', '&lt;a download&gt;.click()')
    + P("const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));\nconst a = document.createElement('a');\na.href = url;\na.download = 'external-ips.csv';\na.click();\nsetTimeout(() => URL.revokeObjectURL(url), 1000);") + UL('a <b>Blob</b> = a file that lives in memory', 'the object URL points at it', '<code>download</code> = save instead of open', 'revoke later to free the memory')
    + REAL('the Overview has an Export button that turns the current numbers into a CSV the same way.'),
  drills: [
    { k: 'type', q: 'A cell holds <code>Gotham, lab</code>. How is it written in the CSV?', a: ['"Gotham, lab"'] },
    { k: 'type', q: 'A cell holds <code>5" rack</code>. How is it written?', a: ['"5"" rack"'], hint: 'Wrap it in quotes, and double the quote inside.' },
    { k: 'pick', q: 'What does <code>a.download = \'x.csv\'</code> do?', o: ['the click saves the file as x.csv instead of opening it', 'it uploads x.csv', 'it renames the page'], a: 0 },
    { k: 'order', q: 'Order the download.', lines: ["const url = URL.createObjectURL(new Blob([csv]));", "const a = document.createElement('a');", 'a.href = url;', "a.download = 'external-ips.csv';", 'a.click();'] }
  ],
  specs: [['button', '<code>button#export-btn.btn</code> "Export CSV" in <code>.table-tools</code>, after the page-size select'], ['columns', 'range, label, total, used · header first'], ['helpers', '<code>csvCell(v)</code> quotes cells with <code>,</code> <code>"</code> or a line break, doubling inner quotes · <code>toCSV(rows, cols)</code> joins with <code>\\n</code>'], ['download', '<code>exportCSV()</code>: Blob <code>text/csv</code> → object URL → <code>a.download = \'external-ips.csv\'</code> → click → revoke after 1s'], ['data', 'all ranges in DATA, not just the visible page']],
  blanks: { 'index.html': ['export-btn'], 'js/app.js': ['/[",\\n]/', '\'""\'', "cols.join(',')", 'csvCell(r[c])', "join('\\n')", 'new Blob', 'createObjectURL', 'a.download', 'a.click()', 'revokeObjectURL', "addEventListener('click', exportCSV)"] },
  hints: ['Start with toCSV() and csvCell(); test them in the console tab: <code>toCSV([{a: 1}], [\'a\'])</code>.', 'Export ALL ranges (<code>DATA.ip_external.ranges</code>), not the filtered page.'],
  explain: { q: 'Why does a cell like <code>Gotham, lab</code> need quotes in a CSV?', a: 'Commas separate the cells. Without quotes, the comma inside the label would split it into two cells and shift every column after it. Quotes tell the reader that everything inside belongs to one cell; a quote inside is written twice.' },
  tests: [
    { t: '<code>toCSV()</code>: header line, then one line per row', f: async (c) => { await c.load(); const f = c.fn('toCSV'); need(typeof f === 'function', 'Define <code>toCSV(rows, cols)</code>'); const out = f([{ a: 1, b: 'x' }, { a: 2, b: 'y' }], ['a', 'b']); need(out === 'a,b\n1,x\n2,y', 'toCSV gave <code>' + esc(JSON.stringify(out)) + '</code>, expected <code>"a,b\\n1,x\\n2,y"</code>'); } },
    { t: 'Commas and quotes are wrapped', f: async (c) => { await c.load(); const f = c.fn('csvCell'); need(typeof f === 'function', 'Define <code>csvCell(v)</code>'); need(f('plain') === 'plain', 'Plain cells stay as they are'); need(f('Gotham, lab') === '"Gotham, lab"', 'A comma → wrap in quotes'); need(f('5" rack') === '"5"" rack"', 'A quote → wrap and double it: <code>"5"" rack"</code>'); need(f(64) === '64', 'Numbers become text'); } },
    { t: 'Export button sits in the table tools', f: async (c) => { await c.load(); need(c.$('#page-ip-external .table-tools #export-btn'), 'Put <code>#export-btn</code> inside .table-tools'); } },
    { t: 'Clicking it downloads external-ips.csv with every range', f: async (c) => { await onPage(c, 'ip-external'); await c.until(() => c.$$('#ip-external-tbody tr').length); const W = c.win; let got = null, blob = null; W.URL.createObjectURL = (b) => { blob = b; return 'blob:rebble-test'; }; W.URL.revokeObjectURL = () => {}; W.HTMLAnchorElement.prototype.click = function () { got = { download: this.download, href: this.href }; }; await c.click('#export-btn'); need(got, 'No download: create an &lt;a&gt; and call click()'); need(got.download === 'external-ips.csv', 'a.download should be external-ips.csv'); need(blob, 'Make the file with new Blob([csv])'); const lines = (await blob.text()).trim().split('\n'); need(lines[0] === 'range,label,total,used', 'First line should be the header'); need(lines.length === 15, 'Expected 14 ranges + header, got ' + lines.length + ' lines'); } }
  ]
},
{
  title: 'CSV import', sub: 'upload, validate, save', commit: 'Add CSV import for external IP ranges', given: [],
  brief: 'The other direction: upload a CSV and replace the IP ranges. The browser reads the file, PHP checks every line and refuses anything broken with a message that names the line, then saves the JSON and clears the cache.',
  teach: '<div class="eyebrow">Stage 16 · School</div><h2>CSV import</h2><p>Imports are where bad data gets in. So the rule is: <b>check everything, trust nothing, say exactly what is wrong</b>.</p>'
    + FLOW('choose file', '→', 'file.text()', '→', 'POST {csv}', '→', 'PHP: check every line', '→', 'save JSON + clear cache')
    + '<h3>the browser side</h3>' + P("const csv = await input.files[0].text();\nconst res = await fetch('api/import.php', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json' },\n  body: JSON.stringify({ csv }),\n});") + '<p><code>input.files</code> is the list of chosen files; <code>.text()</code> reads one as a string (it returns a promise, so <code>await</code>).</p>'
    + '<h3>the PHP side</h3>' + COLS(P("$lines = preg_split('/\\r\\n|\\n|\\r/', $csv);\n$header = array_map('trim', str_getcsv(array_shift($lines), ',', '\"', ''));\nif ($header !== ['range', 'label', 'total', 'used']) fail(400, '…');\n\nforeach ($lines as $i => $line) {\n    $row = $i + 2;\n    $cells = array_map('trim', str_getcsv($line, ',', '\"', ''));\n    if (count($cells) !== 4) fail(400, \"line $row: expected 4 columns\");\n    [$range, $label, $total, $used] = $cells;\n    …preg_match checks…\n}"), UL('<code>preg_split</code> handles Windows (<code>\\r\\n</code>) and Mac line ends', '<code>str_getcsv</code> understands quotes; pass the escape <code>\'\'</code> explicitly (newer PHP warns otherwise)', '<code>$i + 2</code>: arrays start at 0 and the header was line 1', '<code>[$a, $b] = $cells</code> unpacks a list into names', 'one <code>fail()</code> helper: status + JSON + exit'))
    + '<p>After saving, delete <code>data/response_cache.json</code>: otherwise the cache from stage 13 keeps serving the old ranges for two minutes.</p>'
    + REAL('the IP pages are fed by an uploaded workbook: upload → parse → check → save as JSON is exactly that pipeline. This stage uses CSV, because the in-browser PHP has no zip support for .xlsx.'),
  drills: [
    { k: 'pick', q: 'The 3rd data row is broken. With <code>foreach ($lines as $i => $line)</code> after shifting off the header, <code>$i</code> is 2. Which line number do you report?', o: ['4', '3', '2'], a: 0, hint: 'Index 0 is line 2 (the header was line 1).' },
    { k: 'type', q: 'PHP: unpack <code>$cells</code> into <code>$a</code> and <code>$b</code>', a: [/^\[\s*\$a\s*,\s*\$b\s*\]\s*=\s*\$cells\s*;?$/, /^list\(\s*\$a\s*,\s*\$b\s*\)\s*=\s*\$cells\s*;?$/], show: '[$a, $b] = $cells;' },
    { k: 'type', q: 'JS: read the first chosen file of <code>input</code> as text (with await)', a: [/^(const csv = )?await input\.files\[0\]\.text\(\)\s*;?$/], show: 'await input.files[0].text()' },
    { k: 'pick', q: 'Why clear <code>response_cache.json</code> after an import?', o: ['the cache would keep serving the old ranges until it expires', 'to free disk space', 'PHP requires it'], a: 0 },
    { k: 'pick', q: 'Which status code for "your file is wrong"?', o: ['400', '500', '200'], a: 0 }
  ],
  specs: [['page', 'nav item "Import CSV" (<code>data-page="import"</code>) under External IPs · <code>#page-import</code> › card with <code>input#import-file[type=file]</code>, <code>button#import-btn</code>, <code>#import-result</code>'], ['js', '<code>importCSV()</code>: no file → "Choose a .csv file first." · read with <code>.text()</code> · POST <code>{csv}</code> · "Imported N ranges." · <code>fetchData(true)</code>'], ['endpoint', '<code>api/import.php</code> · POST only (405) · empty → 400'], ['header', 'exactly <code>range,label,total,used</code> → else 400'], ['each line', '4 columns · range like <code>192.0.2.0/26</code> · total and used whole numbers · used ≤ total · errors say <code>line N: …</code>'], ['save', 'write <code>data/ip_external.json</code> (pretty, LOCK_EX) · delete <code>data/response_cache.json</code> · answer <code>{ok: true, count}</code>']],
  blanks: { 'index.html': ['data-page="import"', 'page-import', 'import-file', 'import-btn'], 'js/app.js': ['input.files.length', 'input.files[0].text()', "'api/import.php'", 'JSON.stringify({ csv })', 'j.count', 'fetchData(true);\n@16|  } catch'.split('\n')[0], "addEventListener('click', importCSV)"], 'api/import.php': ['http_response_code($code)', "!== 'POST'", 'preg_split', 'array_shift($lines)', "['range', 'label', 'total', 'used']", '$i + 2', 'count($cells) !== 4', '[$range, $label, $total, $used] = $cells', '(int) $used > (int) $total', 'LOCK_EX', 'unlink($cache)'] },
  hints: ['Build import.php first and try it from the console: <code>fetch(\'api/import.php\', {method: \'POST\', body: JSON.stringify({csv: \'range,label,total,used\'})})</code>.', 'A <code>fail($code, $error)</code> helper keeps every check to one line.', 'The line number is <code>$i + 2</code>: index 0 is the second line of the file.'],
  explain: { q: 'Why should the import refuse the whole file when one line is wrong, and say which line?', a: 'A half-imported file leaves the dashboard showing a mix of old and new ranges that nobody can trust. Refusing everything keeps the data consistent, and naming the line tells the person exactly what to fix in the spreadsheet instead of guessing.' },
  tests: [
    { t: 'Import page in the sidebar', cp: 'The page', f: async (c) => { await c.load(); need(c.$('.sidebar .nav-item[data-page="import"]'), 'Add a nav item with <code>data-page="import"</code>'); need(c.$('#page-import input#import-file[type="file"]') && c.$('#page-import #import-btn') && c.$('#page-import #import-result'), 'The page needs <code>#import-file</code>, <code>#import-btn</code> and <code>#import-result</code>'); } },
    { t: 'A good CSV replaces the ranges', cp: 'PHP checks', fresh: true, f: async (c) => { need(c.has('api/import.php'), 'Create <code>api/import.php</code>'); const r = await c.api('POST', 'api/import.php', { csv: 'range,label,total,used\n192.0.2.0/28,"Gotham, lab",16,4\n203.0.113.0/29,Spare,8,0\n' }); need(r.status === 200 && r.json && r.json.ok === true && r.json.count === 2, 'Expected {ok: true, count: 2}: <code>' + esc(r.text.slice(0, 160)) + '</code>'); const saved = JSON.parse(c.srvFile('data/ip_external.json') || '[]'); need(saved.length === 2 && saved[0].label === 'Gotham, lab' && saved[0].total === 16, 'data/ip_external.json should hold the 2 new ranges, numbers as numbers'); } },
    { t: 'A wrong header → 400', cp: 'PHP checks', f: async (c) => { const r = await c.api('POST', 'api/import.php', { csv: 'cidr,name,size,used\n192.0.2.0/28,x,16,4' }); need(r.status === 400 && r.json && r.json.ok === false, 'Refuse a wrong header with 400'); } },
    { t: 'A broken line → 400 that names the line', cp: 'PHP checks', f: async (c) => { const r = await c.api('POST', 'api/import.php', { csv: 'range,label,total,used\n192.0.2.0/28,a,16,4\nnope,b,8,1\n' }); need(r.status === 400, 'Expected 400, got ' + r.status); need(r.json && /line 3/.test(r.json.error || ''), 'The error should say <code>line 3</code>: got "' + esc((r.json || {}).error || r.text) + '"'); const r2 = await c.api('POST', 'api/import.php', { csv: 'range,label,total,used\n192.0.2.0/28,a,16,40\n' }); need(r2.status === 400 && /line 2/.test((r2.json || {}).error || ''), 'used bigger than total → 400 on line 2'); const r3 = await c.api('POST', 'api/import.php', { csv: 'range,label,total,used\n192.0.2.0/28,a,16\n' }); need(r3.status === 400, 'A line with 3 columns → 400'); } },
    { t: 'Import clears the cache', cp: 'PHP checks', fresh: true, f: async (c) => { await c.api('GET', 'api/data.php'); need(c.srvFile('data/response_cache.json'), 'data.php should have written its cache'); await c.api('POST', 'api/import.php', { csv: 'range,label,total,used\n192.0.2.0/28,a,16,4\n' }); const j = (await c.api('GET', 'api/data.php')).json || {}; need(j.ip_external && j.ip_external.ranges.length === 1, 'After an import, data.php must show the new ranges: delete response_cache.json'); } },
