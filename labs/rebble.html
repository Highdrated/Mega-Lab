<!DOCTYPE html>
<html lang="en" data-theme="drafting">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1f0eb;--sheet:#faf9f6;--card:#ffffff;--ink:#16181d;--ink2:#555a64;--ink3:#8a8f99;
  --line:#e1dfd8;--line2:#cfccc3;--acc:#2f5bd3;--acc-soft:#e3eafb;--on-acc:#fff;
  --ok:#178a4c;--ok-soft:#dff3e7;--bad:#cf3127;--bad-soft:#fbe3e0;--tip:#9a6a00;--tip-soft:#fbf1d6;
  --soft:#ebe9e2;--soft2:#f0eee8;--codebg:#ecebe5;--gut:#f6f5f1;--gutt:#b0ada4;--ring:rgba(47,91,211,.18);
  --grid:rgba(47,91,211,.05);
  --sx-k:#b4321a;--sx-s:#1d7a46;--sx-c:#a8a294;--sx-n:#a35d00;--sx-p:#2a52be;--sx-a:#7a4bb5;
  --serif:"Instrument Serif",Georgia,serif;--sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);color-scheme:light
}
:root[data-theme="blueprint"]{--paper:#0a1830;--sheet:#0e1f3d;--card:#11264a;--ink:#e6efff;--ink2:#9fb4d8;--ink3:#6b82a8;--line:#1d3561;--line2:#2a4778;--acc:#5cc8ff;--acc-soft:#123352;--on-acc:#06142a;--ok:#5ee0a0;--ok-soft:#0f2e2a;--bad:#ff7a8a;--bad-soft:#331a2a;--tip:#ffd166;--tip-soft:#2e2a1e;--soft:#14294f;--soft2:#102344;--codebg:#163058;--gut:#0c1c38;--gutt:#3f5a86;--ring:rgba(92,200,255,.2);--grid:rgba(92,200,255,.07);--sx-k:#ff9db0;--sx-s:#9ef0b8;--sx-c:#5c74a0;--sx-n:#ffd166;--sx-p:#7cd0ff;--sx-a:#c9a8ff;color-scheme:dark}
:root[data-theme="noir"]{--paper:#0d0d0f;--sheet:#141416;--card:#1a1a1d;--ink:#f1efe9;--ink2:#a7a39b;--ink3:#76726b;--line:#28282c;--line2:#38383e;--acc:#ff5a2e;--acc-soft:#2c1813;--on-acc:#fff;--ok:#4cc38a;--ok-soft:#12251b;--bad:#ff6b5e;--bad-soft:#2b1513;--tip:#e3b34a;--tip-soft:#2a2313;--soft:#222226;--soft2:#1e1e22;--codebg:#26262b;--gut:#161618;--gutt:#4a4741;--ring:rgba(255,90,46,.2);--grid:transparent;--sx-k:#ff7d5c;--sx-s:#7fd3a0;--sx-c:#6b675f;--sx-n:#f0b35a;--sx-p:#8fb2ff;--sx-a:#c39cff;color-scheme:dark}
:root[data-theme="bone"]{--paper:#ebe5d8;--sheet:#f4efe4;--card:#fbf8f1;--ink:#1e1c18;--ink2:#5a5448;--ink3:#8e8676;--line:#dbd2c1;--line2:#c9bfac;--acc:#2f5d4f;--acc-soft:#dbe6df;--on-acc:#fbf8f1;--ok:#2f7a4f;--ok-soft:#dcecdf;--bad:#b23a2b;--bad-soft:#f3dcd6;--tip:#8a6400;--tip-soft:#f2e8cc;--soft:#e4ddcf;--soft2:#ebe5d9;--codebg:#e6dfd1;--gut:#f1ebe0;--gutt:#b2a893;--ring:rgba(47,93,79,.18);--grid:rgba(47,93,79,.05);--sx-k:#9b3b22;--sx-s:#2f6b45;--sx-c:#a49a86;--sx-n:#8a5a00;--sx-p:#2c5aa8;--sx-a:#6b4aa0;color-scheme:light}
.theming *,.theming *::before,.theming *::after{transition:background-color .3s ease,color .3s ease,border-color .3s ease!important}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.88em;background:var(--codebg);padding:1px 5px;border-radius:4px}
kbd{font-family:var(--mono);font-size:10px;opacity:.7}

.top{height:54px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--sheet)}
.logo{font-family:var(--serif);font-size:30px;line-height:1;display:flex;align-items:baseline;gap:8px;white-space:nowrap;cursor:pointer;user-select:none}
.logo i{color:var(--acc);font-style:normal}
.logo small{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.pills{display:flex;gap:5px;min-width:0;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{position:relative;flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:12px;cursor:pointer;transition:transform .2s var(--ease),border-color .2s}
.pill:hover{transform:translateY(-2px);border-color:var(--line2)}
.pill.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pill.lock{opacity:.4;cursor:not-allowed}
.pill.lock:hover{transform:none}
.pill .st{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);display:flex;gap:2px}
.pill .st b{width:4px;height:4px;border-radius:50%;background:var(--line2)}
.pill .st b.s{background:var(--acc)}
.pill.home{width:auto;padding:0 10px}
.pill.home.done{border-color:var(--ok)}
.grow{flex:1;min-width:8px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink2);transition:background .2s,color .2s;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--sheet);display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease),opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:14px;transition:transform .2s var(--ease)}
.icon:hover{transform:translateY(-2px)}
.icon.off{opacity:.5}
.eng{flex:none;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--soft);color:var(--ink3)}
.eng.ready{background:var(--ok-soft);color:var(--ok)}
.eng.fail{background:var(--bad-soft);color:var(--bad)}
.eng.warm{background:var(--tip-soft);color:var(--tip)}

.view{display:none;height:calc(100% - 54px)}
.view.on{display:block}
#workView.on{display:grid;grid-template-columns:330px minmax(0,1.05fr) minmax(0,1fr)}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.col:last-child{border-right:0}
.mtabs{display:none}

.brief{background:var(--sheet);overflow:auto;padding:20px 20px 30px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.brief h1{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.02;margin:6px 0 12px}
.brief p{line-height:1.6;color:var(--ink2);margin:0 0 12px}
.brief h4{margin:20px 0 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;margin:4px 0}
.specs dt{color:var(--ink3);white-space:nowrap}
.specs dd{margin:0;font-weight:600;line-height:1.45}
.specs dd code{font-weight:500}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.files li{font-family:var(--mono);font-size:12px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);display:flex;justify-content:space-between;gap:8px}
.files li span{font-family:var(--sans);font-size:11px;color:var(--ink3)}
.files li.new{border-color:var(--acc)}
.files li.new span{color:var(--acc);font-weight:600}
.note{font-size:12.5px;line-height:1.55;padding:10px 12px;border-radius:10px;background:var(--soft2);color:var(--ink2);margin:0 0 10px}
.note b{color:var(--ink)}
.hint{font-size:13px;line-height:1.55;padding:10px 12px;border-left:3px solid var(--acc);background:var(--acc-soft);border-radius:0 8px 8px 0;margin-bottom:6px;animation:slideIn .35s var(--ease) both}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 10px;border-radius:9px;font-size:12.5px;line-height:1.5;animation:slideIn .35s var(--ease) both}
.chk .ic{font-weight:700}
.chk.ok{background:var(--ok-soft)}.chk.ok .ic{color:var(--ok)}
.chk.no{background:var(--bad-soft)}.chk.no .ic{color:var(--bad)}
.chk.wait{background:var(--soft2)}.chk.wait .ic{color:var(--ink3)}
.chk small{display:block;color:var(--ink2)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stamp{margin:16px 0 6px;display:inline-flex;align-items:center;gap:10px;padding:9px 15px;border:2px solid var(--ok);color:var(--ok);border-radius:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;animation:stamp .5s var(--ease) both}
@keyframes stamp{from{opacity:0;transform:scale(1.4) rotate(-6deg)}to{opacity:1;transform:rotate(-2deg)}}

.edhead{height:40px;flex:none;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);background:var(--sheet);overflow-x:auto;scrollbar-width:thin}
.ftab{flex:none;border:0;border-right:1px solid var(--line);background:none;padding:0 13px;font:500 12px var(--mono);color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:6px;position:relative}
.ftab.on{background:var(--card);color:var(--ink)}
.ftab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc)}
.ftab .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.ftab .srv{font:600 9px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tip)}
.edbox{flex:1;min-height:0;display:flex;background:var(--card);position:relative}
.gutter{width:44px;flex:none;overflow:hidden;background:var(--gut);border-right:1px solid var(--line);color:var(--gutt);font:12.5px/1.65 var(--mono);text-align:right;padding:14px 8px 14px 0;white-space:pre;user-select:none}
.code{position:relative;flex:1;min-width:0}
.code pre,.code textarea{position:absolute;inset:0;margin:0;padding:14px 16px;font:12.5px/1.65 var(--mono);white-space:pre;tab-size:2;border:0;letter-spacing:0;word-spacing:0}
.code pre{overflow:hidden;pointer-events:none;color:var(--ink)}
.code textarea{background:transparent;color:transparent;caret-color:var(--ink);resize:none;outline:none;overflow:auto}
.code textarea::selection{background:var(--ring);color:transparent}
.code textarea[readonly]{caret-color:transparent}
.ro{position:absolute;right:12px;top:10px;font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tip);background:var(--tip-soft);padding:4px 8px;border-radius:6px;z-index:2}
.k{color:var(--sx-k)}.s{color:var(--sx-s)}.c{color:var(--sx-c);font-style:italic}.n{color:var(--sx-n)}.p{color:var(--sx-p)}.t{color:var(--sx-k)}.a{color:var(--sx-a)}.sel{color:var(--ink);font-weight:500}.f{color:var(--sx-p)}.v{color:var(--sx-a)}
.blank{background:var(--tip-soft);color:var(--tip);border-radius:3px;outline:1px dashed var(--tip)}

.cons{height:150px;flex:none;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--sheet)}
.ch{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line)}
.ch .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-right:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:11px;padding:2px 9px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.cb{flex:1;overflow:auto;font:12px/1.55 var(--mono);padding:6px 10px}
.cl{display:grid;grid-template-columns:38px 1fr auto;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}
.cl .tg{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.cl.js .tg{color:var(--sx-p)}.cl.net .tg{color:var(--ok)}.cl.php .tg{color:var(--sx-a)}
.cl.err{color:var(--bad)}.cl.err .tg{color:var(--bad)}
.cl.warn{color:var(--tip)}
.cl .w{color:var(--ink3);font-size:11px}
.cl .msg{white-space:pre-wrap;word-break:break-word}

.stages{background:var(--paper)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.sh{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;background:var(--sheet);border-bottom:1px solid var(--line)}
.sh .ttl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink3)}
.sh .ttl b{color:var(--ink)}
.sh .url{flex:1;min-width:0;font:11px var(--mono);color:var(--ink3);background:var(--soft2);border-radius:6px;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:12px;padding:3px 8px;cursor:pointer;flex:none}
.sbtn:hover{border-color:var(--line2)}
.frame{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--soft2)}
.frame .scaler{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:4px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 6px 24px rgba(0,0,0,.08);background:#fff}
.frame iframe{display:block;border:0;width:1280px;height:800px;background:#fff}
.frame .cover{position:absolute;inset:0;cursor:zoom-in}
.frame .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:12px}
.apiview{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.probe{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.probe .ph{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font:12px var(--mono)}
.probe .ph .m{font-weight:700;color:var(--acc)}
.probe .ph .lb{font-family:var(--sans);color:var(--ink2);flex:1;text-align:right;font-size:11.5px}
.probe .pb{display:grid;grid-template-columns:1fr 1fr}
.probe .pb>div{min-width:0;padding:8px 10px;border-right:1px solid var(--line)}
.probe .pb>div:last-child{border-right:0}
.probe .pb .h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.probe pre{margin:0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}
.code200{color:var(--ok)}.code400{color:var(--tip)}.code500{color:var(--bad)}

.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:28px}
.overlay.on{display:flex}
.overlay .big{width:100%;height:100%;display:flex;flex-direction:column;background:var(--sheet);border-radius:14px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.35)}
.overlay .big .frame{background:var(--soft2)}

.modal{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mbox{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--sheet);border-radius:16px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.3);animation:slideIn .3s var(--ease) both}
.mbox.wide{width:min(980px,100%)}
.mbox h2{font-family:var(--serif);font-weight:400;font-size:32px;margin:4px 0 10px}
.mbox p{color:var(--ink2);line-height:1.6}
.mbox input[type=text],.mbox textarea{width:100%;font:13px var(--mono);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);outline:none}
.mbox input[type=text]:focus,.mbox textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
.mbox textarea{height:120px;resize:vertical}
.diff{font:12px/1.6 var(--mono);background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:52vh;margin:8px 0 14px}
.diff .fh{position:sticky;top:0;background:var(--soft);padding:6px 10px;font-weight:600;border-bottom:1px solid var(--line)}
.diff .ln{white-space:pre;padding:0 10px}
.diff .ln.add{background:var(--ok-soft)}
.diff .ln.add::before{content:"+ ";color:var(--ok)}
.diff .ln.ctx{color:var(--ink3)}
.diff .ln.ctx::before{content:"  "}
.diff .gap{color:var(--ink3);padding:0 10px;font-style:italic}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:90;pointer-events:none;transition:opacity .3s,transform .3s var(--ease)}
.toast.on{opacity:1;transform:translateX(-50%)}

.wrap{height:100%;overflow:auto}
.inner{max-width:1240px;margin:0 auto;padding:28px 28px 60px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:stretch}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:22px}
.jn{display:flex;align-items:center;gap:12px;margin:12px 0}
.jn img{width:74px;height:auto;flex:none;animation:jnbob 4.5s ease-in-out infinite}
.jn p{margin:0;font-size:13px;line-height:1.55;color:var(--ink2);padding:10px 12px;border-radius:12px;background:var(--soft2)}
@keyframes jnbob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.jn img,.jnhero{animation:none!important}}

.panel h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;margin:6px 0 10px}
.panel h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:18px 0 8px}
.panel p{color:var(--ink2);line-height:1.6;margin:0 0 10px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .6s var(--ease)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 16px}
.stats div{font-size:12px;color:var(--ink3)}
.stats b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--ink);line-height:1.1}
.map{width:100%;height:auto;display:block}
.map .bx rect{fill:var(--card);stroke:var(--line2);stroke-width:1.2}
.map .bx text{font:600 11px var(--mono);fill:var(--ink3)}
.map .bx.lit rect{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.6}
.map .bx.lit text{fill:var(--ink)}
.map .bx.next rect{stroke:var(--acc);stroke-dasharray:4 3}
.map .zone{fill:none;stroke:var(--line);stroke-dasharray:3 4}
.map .zl{font:600 10px var(--sans);letter-spacing:.14em;fill:var(--ink3);text-transform:uppercase}
.map .ar{stroke:var(--line2);stroke-width:1.4;fill:none;marker-end:url(#ah)}
.map .ar.lit{stroke:var(--acc)}
.map #ah path{fill:var(--line2)}
.stagelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sc{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;transition:transform .2s var(--ease),border-color .2s}
.sc:hover{transform:translateY(-2px);border-color:var(--line2)}
.sc .no{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--soft)}
.sc.done .no{background:var(--acc);color:var(--on-acc)}
.sc.lock{opacity:.45;cursor:not-allowed}
.sc.lock:hover{transform:none}
.sc b{display:block;font-size:13.5px}
.sc small{color:var(--ink3);font-size:11.5px}
.sc .stars{font-size:11px;color:var(--acc);letter-spacing:1px}
.log{font:12px/1.7 var(--mono);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto}
.log .h{color:var(--sx-n)}
.log .e{color:var(--ink3)}
.bpcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.bpc{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.bpc.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
.bpc.empty{border-style:dashed;background:transparent}
.bpc b{font-size:15px}
.bpc small{color:var(--ink3);line-height:1.5}

.schoolwrap{height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.teach{overflow:auto;padding:26px 32px 50px;background:var(--sheet);border-right:1px solid var(--line)}
.teach h2{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;margin:6px 0 14px}
.teach h3{font-size:15px;margin:24px 0 8px}
.teach p,.teach li{line-height:1.65;color:var(--ink2)}
.teach ul{padding-left:20px;margin:6px 0}
.teach b{color:var(--ink)}
.teach pre,.mbox pre.ex{font:12.5px/1.6 var(--mono);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;margin:8px 0;white-space:pre}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0;padding:12px 14px;border:1px dashed var(--line2);border-radius:12px;background:var(--card)}
.flow b{font:600 12px var(--mono);padding:5px 10px;border-radius:8px;background:var(--soft)}
.flow b.acc{background:var(--acc);color:var(--on-acc)}
.flow i{font-style:normal;color:var(--ink3);font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.cols pre{margin:0}
.tree{font:12.5px/1.6 var(--mono);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre;margin:8px 0}
.callout{padding:12px 14px;border-radius:12px;background:var(--acc-soft);border-left:3px solid var(--acc);line-height:1.6;margin:12px 0;color:var(--ink)}
.drills{overflow:auto;padding:26px 26px 50px;display:flex;flex-direction:column;gap:12px}
.dcard{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px}
.dcard.ok{border-color:var(--ok)}
.dcard .q{font-size:14px;line-height:1.6;margin:6px 0 10px}
.dcard pre{font:12.5px/1.55 var(--mono);background:var(--soft2);border-radius:8px;padding:10px 12px;margin:0 0 10px;overflow:auto;white-space:pre}
.dcard input{width:100%;font:13px var(--mono);padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--sheet);color:var(--ink);outline:none}
.dcard input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
.dcard.ok input{border-color:var(--ok);background:var(--ok-soft)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:13px;line-height:1.45}
.opt:hover{border-color:var(--line2)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt code{font-size:12px}
.ord{display:flex;flex-direction:column;gap:5px}
.oline{font:12.5px var(--mono);border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:pre;display:flex;gap:10px;align-items:center}
.oline:hover{border-color:var(--line2)}
.oline .nb{font:600 10px var(--sans);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none}
.oline.picked{opacity:.35}
.oans{min-height:34px;display:flex;flex-direction:column;gap:4px;padding:6px;border:1px dashed var(--line2);border-radius:9px;margin-bottom:8px}
.oans .oline{background:var(--acc-soft);border-color:transparent}
.dfb{font-size:12.5px;line-height:1.5;margin-top:8px;min-height:1px}
.dfb.ok{color:var(--ok)}.dfb.no{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.mission .step{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.mission .step:first-child{border-top:0}
.mission .sn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--soft)}
.mission .step.done .sn{background:var(--ok);color:#fff}
.mission .step h3{margin:4px 0 6px;font-size:15px}
.mission .step p{margin:0 0 8px;color:var(--ink2);line-height:1.6}
.cmd{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:6px 0;background:var(--card)}
.cmd pre{flex:1;margin:0;padding:8px 12px;font:12.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all}
.cmd button{border:0;border-left:1px solid var(--line);background:var(--soft2);padding:0 12px;cursor:pointer;font-size:12px}
.paste{width:100%;height:84px;font:12px var(--mono);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;background:var(--sheet);color:var(--ink);resize:vertical;outline:none}
.paste:focus{border-color:var(--acc)}

@media (max-width:1180px){
  #workView.on{display:flex;flex-direction:column}
  .mtabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sheet);flex:none}
  #workView .col{display:none;flex:1;border-right:0}
  #workView .col.mon{display:flex}
  .brief.col.mon{display:block}
  .schoolwrap{grid-template-columns:1fr;overflow:auto;height:100%}
  .teach{border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .drills{overflow:visible}
  .hero{grid-template-columns:1fr}
  .top .modes-lbl{display:none}
}
@media (max-width:760px){
  .logo small{display:none}
  .top{gap:8px;padding:0 10px}
  .seg button{padding:6px 9px}
  .inner{padding:18px 14px 50px}
  .cols{grid-template-columns:1fr}
  .teach{padding:20px 18px 40px}
  .drills{padding:18px 14px 40px}
}
#testbay iframe{display:block;width:1280px;height:800px;border:0}
.probe{flex:none}
.oline{white-space:pre-wrap;word-break:break-word}
.map{max-height:340px}
.panel .bpcards{margin-top:6px}
.mission .step h3{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);margin:4px 0 6px}

</style>
</head>
<body>
<header class="top">
  <div class="logo" id="logo" title="Workshop home"><span>Rebble<i>.</i></span><small>vol. IX · rebuild</small></div>
  <div class="sep"></div>
  <div class="pills" id="pills"></div>
  <div class="grow"></div>
  <div class="seg" id="views"><button data-v="school">School</button><button data-v="work">Build</button></div>
  <button class="btn acc" id="checkBtn">Check <kbd>⌘↵</kbd></button>
  <button class="icon" id="recallBtn" title="Recall: mixed warm-ups from stages you passed">↻</button>
  <button class="icon" id="themeBtn" title="Switch theme">◐</button>
  <button class="icon" id="sndBtn" title="Sound">♪</button>
  <button class="icon" id="saveBtn" title="Export folder · progress codes">⇅</button>
</header>

<div class="view" id="homeView"><div class="wrap"><div class="inner" id="home"></div></div></div>
<div class="view" id="schoolView"><div class="schoolwrap" id="school"></div></div>
<div class="view" id="missionView"><div class="wrap"><div class="inner mission" id="mission"></div></div></div>
<div class="view" id="workView">
  <div class="mtabs" id="mtabs"><button class="chip on" data-c="0">Brief</button><button class="chip" data-c="1">Code</button><button class="chip" data-c="2">Preview</button></div>
  <aside class="col brief mon" id="brief"></aside>
  <section class="col" id="edcol">
    <div class="edhead" id="ftabs"></div>
    <div class="edbox">
      <div class="gutter" id="gutter"></div>
      <div class="code"><pre id="hl"></pre><textarea id="ta" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea><span class="ro" id="ro" hidden>written by PHP · read-only</span></div>
    </div>
    <div class="cons">
      <div class="ch"><span class="lbl">Console</span><button class="chip on" data-f="all">all</button><button class="chip" data-f="js">js</button><button class="chip" data-f="net">network</button><button class="chip" data-f="php">php</button><span class="grow"></span><button class="sbtn" id="clearCons" title="Clear">⌫</button></div>
      <div class="cb" id="cons"></div>
    </div>
  </section>
  <section class="col stages" id="stages"></section>
</div>

<div class="overlay" id="overlay"><div class="big" id="bigBox"></div></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div id="testbay" style="position:fixed;left:-20000px;top:0;width:1280px;height:800px;overflow:hidden;visibility:hidden" aria-hidden="true"></div>

lign: left;\n  cursor: pointer;\n}\n\n.nav-item:hover {\n  background: var(--surface-2);\n}\n\n.nav-item.active {\n  background: var(--accent-light);\n  color: var(--accent);\n  font-weight: 600;\n}\n\n.page {\n  display: none;\n}\n\n.page.active {\n  display: block;\n}\n\n.page-header {\n  margin-bottom: 20px;\n}\n\n.page-title {\n  font-size: 22px;\n  font-weight: 600;\n}\n\n.page-desc {\n  margin-top: 4px;\n  color: var(--text-muted);\n}\n\n.topbar-right {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.theme-switcher {\n  display: flex;\n  gap: 4px;\n  padding: 3px;\n  border-radius: var(--radius);\n  background: rgba(255, 255, 255, 0.08);\n}\n\n.theme-btn {\n  padding: 5px 12px;\n  border: 0;\n  border-radius: 6px;\n  background: transparent;\n  color: rgba(255, 255, 255, 0.7);\n  font: inherit;\n  font-size: 12px;\n  cursor: pointer;\n}\n\n.theme-btn.active {\n  background: rgba(255, 255, 255, 0.18);\n  color: #ffffff;\n}\n\n.card {\n  margin-bottom: 16px;\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.card-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 12px;\n}\n\n.card-title {\n  font-weight: 600;\n}\n\n.field {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  max-width: 320px;\n  padding: 6px 0;\n  color: var(--text-muted);\n}\n\ninput,\nselect,\ntextarea {\n  padding: 6px 8px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface-2);\n  color: var(--text);\n  font: inherit;\n}\n\n.field input {\n  width: 80px;\n}\n\n.metric-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n  margin-bottom: 16px;\n}\n\n.metric-card {\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.metric-label {\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.metric-value {\n  margin: 6px 0 2px;\n  font-size: 30px;\n  font-weight: 600;\n}\n\n.metric-sub {\n  margin-bottom: 12px;\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.progress {\n  height: 6px;\n  border-radius: 3px;\n  background: var(--surface-2);\n  overflow: hidden;\n}\n\n.progress-fill {\n  height: 100%;\n  border-radius: 3px;\n}\n\n.progress-fill.ok {\n  background: var(--green);\n}\n\n.progress-fill.warn {\n  background: var(--amber);\n}\n\n.progress-fill.crit {\n  background: var(--red);\n}\n","js/app.js":"const METRICS = [\n  { label: 'External IPs', used: 412, total: 640 },\n  { label: 'Switch ports', used: 1180, total: 1440 },\n  { label: 'Racks', used: 86, total: 120 },\n];\n\nfunction getSetting(key, def) {\n  try {\n    const v = localStorage.getItem('dash-setting-' + key);\n    return v !== null ? JSON.parse(v) : def;\n  } catch (err) {\n    return def;\n  }\n}\n\nfunction setSetting(key, val) {\n  localStorage.setItem('dash-setting-' + key, JSON.stringify(val));\n}\n\nfunction getThreshold(type) {\n  return getSetting('threshold-' + type, type === 'warn' ? 70 : 80);\n}\n\nfunction pct(used, total) {\n  return total ? Math.round((used / total) * 100) : 0;\n}\n\nfunction statusClass(p) {\n  if (p >= getThreshold('crit')) return 'crit';\n  if (p >= getThreshold('warn')) return 'warn';\n  return 'ok';\n}\n\nfunction fmt(v) {\n  return v.toLocaleString('en-US');\n}\n\nfunction setTheme(t) {\n  document.documentElement.setAttribute('data-theme', t);\n  localStorage.setItem('dash-theme', t);\n  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));\n}\n\nfunction initSettings() {\n  ['warn', 'crit'].forEach(type => {\n    const input = document.getElementById('threshold-' + type);\n    input.value = getThreshold(type);\n    input.addEventListener('change', () => {\n      setSetting('threshold-' + type, Number(input.value));\n      renderOverview();\n    });\n  });\n}\n\nfunction overviewMetrics() {\n  return METRICS;\n}\n\nfunction renderOverview() {\n  const grid = document.getElementById('metric-grid');\n  grid.innerHTML = overviewMetrics().map(m => {\n    const p = pct(m.used, m.total);\n    return `<div class=\"metric-card\">\n      <div class=\"metric-label\">${m.label}</div>\n      <div class=\"metric-value\">${fmt(m.used)}</div>\n      <div class=\"metric-sub\">of ${fmt(m.total)} · ${p}%</div>\n      <div class=\"progress\"><div class=\"progress-fill ${statusClass(p)}\" style=\"width: ${p}%\"></div></div>\n    </div>`;\n  }).join('');\n}\n\nfunction navigate(id) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));\n  const page = document.getElementById('page-' + id);\n  if (page) page.classList.add('active');\n  const nav = document.querySelector(`.nav-item[data-page=\"${id}\"]`);\n  if (nav) nav.classList.add('active');\n  localStorage.setItem('dash-page', id);\n}\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  setTheme(localStorage.getItem('dash-theme') || 'light');\n  document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));\n  initSettings();\n  document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigate(i.dataset.page)));\n  renderOverview();\n  navigate(localStorage.getItem('dash-page') || 'overview');\n});\n"},{"index.html":"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"light\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>IT Dashboard</title>\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <script src=\"js/app.js\" defer><\/script>\n</head>\n<body>\n\n<div class=\"toast-container\" id=\"toast-container\"></div>\n\n<header class=\"topbar\">\n  <div class=\"topbar-brand\">\n    <span class=\"topbar-logo\">IT</sp );\n}\n\ninput,\nselect,\ntextarea {\n  padding: 6px 8px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface-2);\n  color: var(--text);\n  font: inherit;\n}\n\n.field input {\n  width: 80px;\n}\n\n.metric-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n  margin-bottom: 16px;\n}\n\n.metric-card {\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.metric-label {\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.metric-value {\n  margin: 6px 0 2px;\n  font-size: 30px;\n  font-weight: 600;\n}\n\n.metric-sub {\n  margin-bottom: 12px;\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.progress {\n  height: 6px;\n  border-radius: 3px;\n  background: var(--surface-2);\n  overflow: hidden;\n}\n\n.progress-fill {\n  height: 100%;\n  border-radius: 3px;\n}\n\n.progress-fill.ok {\n  background: var(--green);\n}\n\n.progress-fill.warn {\n  background: var(--amber);\n}\n\n.progress-fill.crit {\n  background: var(--red);\n}\n\n.icon-btn {\n  width: 30px;\n  height: 30px;\n  border: 0;\n  border-radius: 6px;\n  background: rgba(255, 255, 255, 0.08);\n  color: #ffffff;\n  font-size: 16px;\n  cursor: pointer;\n}\n\n.toast-container {\n  position: fixed;\n  right: 20px;\n  bottom: 20px;\n  z-index: 100;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.toast {\n  padding: 10px 14px;\n  border: 1px solid var(--border);\n  border-left: 4px solid var(--accent);\n  border-radius: var(--radius);\n  background: var(--surface);\n  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);\n}\n\n.toast.success {\n  border-left-color: var(--green);\n}\n\n.toast.error {\n  border-left-color: var(--red);\n}\n\n.empty {\n  padding: 12px 0;\n  color: var(--text-muted);\n}\n","js/app.js":"const API_URL = 'api/data.php';\nlet DATA = null;\n\nfunction getSetting(key, def) {\n  try {\n    const v = localStorage.getItem('dash-setting-' + key);\n    return v !== null ? JSON.parse(v) : def;\n  } catch (err) {\n    return def;\n  }\n}\n\nfunction setSetting(key, val) {\n  localStorage.setItem('dash-setting-' + key, JSON.stringify(val));\n}\n\nfunction getThreshold(type) {\n  return getSetting('threshold-' + type, type === 'warn' ? 70 : 80);\n}\n\nfunction pct(used, total) {\n  return total ? Math.round((used / total) * 100) : 0;\n}\n\nfunction statusClass(p) {\n  if (p >= getThreshold('crit')) return 'crit';\n  if (p >= getThreshold('warn')) return 'warn';\n  return 'ok';\n}\n\nfunction fmt(v) {\n  return v.toLocaleString('en-US');\n}\n\nfunction toast(msg, type = 'info') {\n  const c = document.getElementById('toast-container');\n  const el = document.createElement('div');\n  el.className = 'toast ' + type;\n  el.textContent = msg;\n  c.appendChild(el);\n  setTimeout(() => el.remove(), 3000);\n}\n\nfunction setTheme(t) {\n  document.documentElement.setAttribute('data-theme', t);\n  localStorage.setItem('dash-theme', t);\n  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));\n}\n\nfunction initSettings() {\n  ['warn', 'crit'].forEach(type => {\n    const input = document.getElementById('threshold-' + type);\n    input.value = getThreshold(type);\n    input.addEventListener('change', () => {\n      setSetting('threshold-' + type, Number(input.value));\n      renderOverview();\n    });\n  });\n}\n\nfunction overviewMetrics() {\n  return [\n    { label: 'External IPs', used: DATA.ip_external.used, total: DATA.ip_external.total },\n    { label: 'Switch ports', used: DATA.ports.used, total: DATA.ports.total },\n    { label: 'Racks', used: DATA.racks.used, total: DATA.racks.total },\n  ];\n}\n\nfunction renderOverview() {\n  const grid = document.getElementById('metric-grid');\n  if (!DATA) {\n    grid.innerHTML = '<div class=\"empty\">No data. Check api/data.php</div>';\n    return;\n  }\n  grid.innerHTML = overviewMetrics().map(m => {\n    const p = pct(m.used, m.total);\n    return `<div class=\"metric-card\">\n      <div class=\"metric-label\">${m.label}</div>\n      <div class=\"metric-value\">${fmt(m.used)}</div>\n      <div class=\"metric-sub\">of ${fmt(m.total)} · ${p}%</div>\n      <div class=\"progress\"><div class=\"progress-fill ${statusClass(p)}\" style=\"width: ${p}%\"></div></div>\n    </div>`;\n  }).join('');\n}\n\nasync function fetchData(force = false) {\n  try {\n    const res = await fetch(API_URL + (force ? '?refresh=1' : ''));\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    DATA = await res.json();\n    toast('Data refreshed', 'success');\n  } catch (err) {\n    DATA = null;\n    toast('No connection to api/data.php', 'error');\n  } finally {\n    renderOverview();\n  }\n}\n\nfunction navigate(id) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));\n  const page = document.getElementById('page-' + id);\n  if (page) page.classList.add('active');\n  const nav = document.querySelector(`.nav-item[data-page=\"${id}\"]`);\n  if (nav) nav.classList.add('active');\n  localStorage.setItem('dash-page', id);\n}\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  setTheme(localStorage.getItem('dash-theme') || 'light');\n  document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));\n  initSettings();\n  document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigate(i.dataset.page)));\n  document.getElementById('refresh-btn').addEventListener('click', () => fetchData(true));\n  fetchData();\n  navigate(localStorage.getItem('dash-page') || 'overview');\n});\n","api/data.php":"<?php\nheader('Content-Type: application/json');\nheader('Cache-Control: no-store');\n\nfunction pct(int $used, int $total): int {\n    return $total > 0 ? (int) round(($used / $total) * 100) : 0;\n}\n\nfunction read_json(string $file): array {\n    if (!is_file($file)) return [];\n    $data = json_decode(file_get_contents($file), true);\n    return is_array($data) ? $data : [];\n}\n\n$sites = read_json(__DIR__ . '/../data/sites.json');\n$ranges = read_json(__DIR__ . '/../data/ip_external.json');\n\n$ports = ['used' => 0, 'total' => 0];\n$racks = ['used' => 0, 'total' => 0];\nforeach ($sites as $site) {\n    $ports['used'] += $site['ports_used'];\n    $ports['total'] += $site['ports_total'];\n    $racks['used'] += $site['racks_used'];\n    $racks['total'] += $site['racks_total'];\n}\n\n$ipUsed = 0;\n$ipTotal = 0;\nforeach ($ranges as $r) {\n    $ipUsed += $r['used'];\n    $ipTotal += $r['total'];\n}\n\n$payload = json_encode([\n    'generated_at' => date('c'),\n    'sites'        => $sites,\n    'ports'        => $ports,\n    'racks'        => $racks,\n    'ip_external'  => [\n        'used'   => $ipUsed,\n        'total'  => $ipTotal,\n        'pct'    => pct($ipUsed, $ipTotal),\n        'ranges' => $ranges,\n    ],\n], JSON_UNESCAPED_UNICODE);\n\necho $payload;\n","data/sites.json":"[\n  {\n    \"id\": \"GOT1\",\n    \"name\": \"Gotham DC\",\n    \"city\": \"Gotham\",\n    \"region\": \"center\",\n    \"lat\": 15,\n    \"lng\": 37,\n    \"online\": true,\n    \"ports_used\": 288,\n    \"ports_total\": 384,\n    \"racks_used\": 22,\n    \"racks_total\": 30\n  },\n  {\n    \"id\": \"MET1\",\n    \"name\": \"Metropolis DC\",\n    \"city\": \"Metropolis\",\n    \"region\": \"north\",\n    \"lat\": 18.2,\n    \"lng\": 38.5,\n    \"online\": true,\n    \"ports_used\": 160,\n    \"ports_total\": 192,\n    \"racks_used\": 14,\n    \"racks_total\": 16\n  },\n  {\n    \"id\": \"HIL1\",\n    \"name\": \"Hill Valley DC\",\n    \"city\": \"Hill Valley\",\n    \"region\": \"west\",\n    \"lat\": 16.5,\n    \"lng\": 33,\n    \"online\": true,\n    \"ports_used\": 120,\n    \"ports_total\": 192,\n    \"racks_used\": 9,\n    \"racks_total\": 16\n  },\n  {\n    \"id\": \"AM tal\": 12\n  }\n]\n","data/ip_external.json":"[\n  { \"range\": \"192.0.2.0/26\", \"label\": \"Gotham · customers\", \"total\": 64, \"used\": 61 },\n  { \"range\": \"192.0.2.64/26\", \"label\": \"Gotham · transit\", \"total\": 64, \"used\": 22 },\n  { \"range\": \"192.0.2.128/26\", \"label\": \"Metropolis · customers\", \"total\": 64, \"used\": 58 },\n  { \"range\": \"192.0.2.192/26\", \"label\": \"Hill Valley · customers\", \"total\": 64, \"used\": 40 },\n  { \"range\": \"198.51.100.0/25\", \"label\": \"Colocation pool\", \"total\": 128, \"used\": 117 },\n  { \"range\": \"198.51.100.128/26\", \"label\": \"Emerald City · customers\", \"total\": 64, \"used\": 50 },\n  { \"range\": \"198.51.100.192/27\", \"label\": \"Shermer · customers\", \"total\": 32, \"used\": 31 },\n  { \"range\": \"198.51.100.224/27\", \"label\": \"Castle Rock · customers\", \"total\": 32, \"used\": 12 },\n  { \"range\": \"203.0.113.0/26\", \"label\": \"Twin Peaks · customers\", \"total\": 64, \"used\": 55 },\n  { \"range\": \"203.0.113.64/27\", \"label\": \"Amity Island · customers\", \"total\": 32, \"used\": 20 },\n  { \"range\": \"203.0.113.96/27\", \"label\": \"Bedford Falls · customers\", \"total\": 32, \"used\": 9 },\n  { \"range\": \"203.0.113.128/26\", \"label\": \"VPN gateways\", \"total\": 64, \"used\": 48 },\n  { \"range\": \"203.0.113.192/27\", \"label\": \"Management\", \"total\": 32, \"used\": 27 },\n  { \"range\": \"203.0.113.224/28\", \"label\": \"Spare\", \"total\": 16, \"used\": 2 }\n]\n"},{"index.html":"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"light\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>IT Dashboard</title>\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <script src=\"js/app.js\" defer><\/script>\n</head>\n<body>\n\n<div class=\"toast-container\" id=\"toast-container\"></div>\n\n<header class=\"topbar\">\n  <div class=\"topbar-brand\">\n    <span class=\"topbar-logo\">IT</span>\n    <span class=\"topbar-name\">IT Dashboard</span>\n  </div>\n  <div class=\"topbar-right\">\n    <button class=\"icon-btn\" id=\"refresh-btn\" aria-label=\"Refresh\">↻</button>\n    <div class=\"theme-switcher\">\n      <button class=\"theme-btn\" data-theme=\"light\">Light</button>\n      <button class=\"theme-btn\" data-theme=\"dark\">Dark</button>\n    </div>\n  </div>\n</header>\n\n<div class=\"layout\">\n  <nav class=\"sidebar\">\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-label\">Overview</div>\n      <button class=\"nav-item\" data-page=\"overview\">Dashboard</button>\n      <button class=\"nav-item\" data-page=\"map\">Site Map</button>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-label\">IP Management</div>\n      <button class=\"nav-item\" data-page=\"ip-external\">External IPs</button>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-label\">System</div>\n      <button class=\"nav-item\" data-page=\"settings\">Settings</button>\n    </div>\n  </nav>\n\n  <main class=\"main\">\n    <div class=\"page\" id=\"page-overview\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Overview</div>\n        <div class=\"page-desc\">Live status across all connected systems</div>\n      </div>\n      <div class=\"metric-grid\" id=\"metric-grid\"></div>\n    </div>\n\n    <div class=\"page\" id=\"page-map\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Site Map</div>\n        <div class=\"page-desc\">Click a marker for details</div>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-ip-external\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">External IP Usage</div>\n        <div class=\"page-desc\">Public IP ranges</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"table-tools\">\n          <input type=\"text\" class=\"filter-input\" id=\"ip-external-filter\" placeholder=\"Filter range or label\">\n          <select id=\"ip-external-pagesize\">\n            <option value=\"10\">10 per page</option>\n            <option value=\"25\">25 per page</option>\n          </select>\n        </div>\n        <table class=\"data-table\">\n          <thead>\n            <tr><th>Range</th><th>Label</th><th>Total</th><th>Used</th><th>Free</th><th>Usage</th><th>Status</th></tr>\n          </thead>\n          <tbody id=\"ip-external-tbody\"></tbody>\n        </table>\n        <div class=\"pager\">\n          <button class=\"btn\" id=\"ip-external-prev\">← Prev</button>\n          <span id=\"ip-external-page-info\"></span>\n          <button class=\"btn\" id=\"ip-external-next\">Next →</button>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-settings\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Settings</div>\n        <div class=\"page-desc\">Saved in this browser</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Thresholds</span></div>\n        <label class=\"field\">Warning at (%) <input type=\"number\" id=\"threshold-warn\" min=\"1\" max=\"100\"></label>\n        <label class=\"field\">Critical at (%) <input type=\"number\" id=\"threshold-crit\" min=\"1\" max=\"100\"></label>\n      </div>\n    </div>\n  </main>\n</div>\n\n</body>\n</html>\n","css/style.css":"[data-theme=\"light\"] {\n  --bg: #f0f2f7;\n  --surface: #ffffff;\n  --surface-2: #f5f7fa;\n  --border: #dde2ec;\n  --text: #1e2d4a;\n  --text-muted: #6b7a96;\n  --accent: #2f5bd3;\n  --accent-light: #ebf0fa;\n  --green: #2a8c72;\n  --amber: #9a5e08;\n  --red: #d94f3d;\n  --topbar-bg: #1e2d4a;\n  --radius: 8px;\n}\n\n[data-theme=\"dark\"] {\n  --bg: #1c1c1e;\n  --surface: #2c2c2e;\n  --surface-2: #232325;\n  --border: #3a3a3c;\n  --text: #f2f2f7;\n  --text-muted: #8e8e93;\n  --accent: #0a84ff;\n  --accent-light: rgba(10, 132, 255, 0.14);\n  --green: #30d158;\n  --amber: #ff9f0a;\n  --red: #ff453a;\n  --topbar-bg: #000000;\n  --radius: 8px;\n}\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;\n  font-size: 14px;\n  background: var(--bg);\n  color: var(--text);\n}\n\n.topbar {\n  height: 52px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 20px;\n  background: var(--topbar-bg);\n  color: #ffffff;\n}\n\n.topbar-brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.topbar-logo {\n  width: 28px;\n  height: 28px;\n  display: grid;\n  place-items: center;\n  border-radius: 6px;\n  background: rgba(255, 255, 255, 0.14);\n  font-size: 11px;\n  font-weight: 700;\n}\n\n.topbar-name {\n  font-weight: 600;\n}\n\n.layout {\n  display: grid;\n  grid-template-columns: 220px 1fr;\n  height: calc(100vh - 52px);\n}\n\n.sidebar {\n  background: var(--surface);\n  border-right: 1px solid var(--border);\n  padding: 16px 10px;\n  overflow-y: auto;\n}\n\n.main {\n  padding: 24px 28px;\n  overflow-y: auto;\n}\n\n.sidebar-section {\n  margin-bottom: 18px;\n}\n\n.sidebar-label {\n  padding: 0 10px 6px;\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n.nav-item {\n  display: block;\n  width: 100%;\n  padding: 8px 10px;\n  border: 0;\n  border-radius: var(--radius);\n  background: transparent;\n  color: var(--text);\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n}\n\n.nav-item:hover {\n  background: var(--surface-2);\n}\n\n.nav-item.active {\n  background: var(--accent-light);\n  color: var(--accent);\n  font-weight: 600;\n}\n\n.page {\n  display: none;\n}\n\n.page.active {\n  display: block;\n}\n\n.page-header {\n  margin-bottom: 20px;\n}\n\n.page-title {\n  font-size: 22px;\n  font-weight: 600;\n}\n\n.page-desc {\n  margin-top: 4px;\n  color: var(--text-muted);\n}\n\n.topbar-right {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.theme-switcher {\n  display: flex;\n  gap: 4px;\n  padding: 3px;\n  border-radius: var(--radius);\n  background: rgba(255, 255, 255, 0.08);\n}\n\n.theme-btn {\n  padding: 5px 12px;\n  border: 0;\n  border-radius: 6px;\n  background: transparent;\n  color: rgba(255, 255, 255, 0.7);\n  font: inherit;\n  font-size: 12px;\n  cursor: pointer;\n}\n\n.theme-btn.active {\n  background: rgba(255, 255, 255, 0.18);\n  color: #ffffff;\n}\n\n.card {\n  margin-bottom: 16px;\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.card-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 12px;\n}\n\n.card-title {\n  font-weight: 600;\n}\n\n.field {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  max-width: 320px;\n  padding: 6px 0;\n  color: var(--text-muted);\n}\n\ninput,\nselect,\ntextarea {\n  padding: 6px 8px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface-2);\n  color: var(--text);\n  font: inherit;\n}\n\n.field input {\n  width: 80px;\n}\n\n.metric-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n  margin-bottom: 16px;\n}\n\n.metric-card {\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.metric-label {\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.metric-value {\n  margin: 6px 0 2px;\n  font-size: 30px;\n  font-weight: 600;\n}\n\n.metric-sub {\n  margin-bottom: 12px;\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.progress {\n  height: 6px;\n  border-radius: 3px;\n  background: var(--surface-2);\n  overflow: hidden;\n}\n\n.progress-fill {\n  height: 100%;\n  border-radius: 3px;\n}\n\n.progress-fill.ok {\n  background: var(--green);\n}\n\n.progress-fill.warn {\n  background: var(--amber);\n}\n\n.progress-fill.crit {\n  background: var(--red);\n}\n\n.icon-btn {\n  width: 30px;\n  height: 30px;\n  border: 0;\n  border-radius: 6px;\n  background: rgba(255, 255, 255, 0.08);\n  color: #ffffff;\n  font-size: 16px;\n  cursor: pointer;\n}\n\n.toast-container {\n  position: fixed;\n  right: 20px;\n  bottom: 20px;\n  z-index: 100;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.toast {\n  padding: 10px 14px;\n  border: 1px solid var(--border);\n  border-left: 4px solid var(--accent);\n  border-radius: var(--radius);\n  background: var(--surface);\n  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);\n}\n\n.toast.success {\n  border-left-color: var(--green);\n}\n\n.toast.error {\n  border-left-color: var(--red);\n}\n\n.empty {\n  padding: 12px 0;\n  color: var(--text-muted);\n}\n\n.table-tools {\n  display: flex;\n  gap: 8px;\n  margin-bottom: 12px;\n}\n\n.filter-input {\n  flex: 1;\n  max-width: 280px;\n}\n\n.data-table {\n  width: 100%;\n  border-collapse: collapse;\n}\n\n.data-table th {\n  padding: 8px 10px;\n  border-bottom: 1px solid var(--border);\n  color: var(--text-muted);\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  text-align: left;\n  text-transform: uppercase;\n}\n\n.data-table td {\n  padding: 9px 10px;\n  border-bottom: 1px solid var(--border);\n}\n\n.data-table .progress {\n  width: 90px;\n}\n\n.badge {\n  display: inline-block;\n  padding: 2px 8px;\n  border-radius: 999px;\n  font-size: 11px;\n  font-weight: 600;\n}\n\n.badge.ok {\n  background: rgba(42, 140, 114, 0.12);\n  color: var(--green);\n}\n\n.badge.warn {\n  background: rgba(154, 94, 8, 0.12);\n  color: var(--amber);\n}\n\n.badge.crit {\n  background: rgba(217, 79, 61, 0.12);\n  color: var(--red);\n}\n\n.pager {\n  display: flex;\n  justify-content: flex-end;\n  align-items: center;\n  gap: 10px;\n  margin-top: 12px;\n  color: var(--text-muted);\n  font-size: 12px;\n}\n\n.btn {\n  padding: 6px 12px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface);\n  color: var(--text);\n  font: inherit;\n  cursor: pointer;\n}\n\n.btn:disabled {\n  opacity: 0.4;\n  cursor: default;\n}\n","js/app.js":"const API_URL = 'api/data.php';\nlet DATA = null;\n\nconst pagerState = {};\n\nfunction getSetting(key, def) {\n  try {\n    const v = localStorage.getItem('dash-setting-' + key);\n    return v !== null ? JSON.parse(v) : def;\n  } catch (err) {\n    return def;\n  }\n}\n\nfunction setSetting(key, val) {\n  localStorage.setItem('dash-setting-' + key, JSON.stringify(val));\n}\n\nfunction getThreshold(type) {\n  return getSetting('threshold-' + type, type === 'warn' ? 70 : 80);\n}\n\nfunction pct(used, total) {\n  return total ? Math.round((used / total) * 100) : 0;\n}\n\nfunction statusClass(p) {\n  if (p >= getThreshold('crit')) return 'crit';\n  if (p >= getThreshold('warn')) return 'warn';\n  return 'ok';\n}\n\nfunction fmt(v) {\n  return v.toLocaleString('en-US');\n}\n\nfunction toast(msg, type = 'info') {\n  const c = document.getElementById('toast-container');\n  const el = document.createElement('div');\n  el.className = 'toast ' + type;\n  el.textContent = msg;\n  c.appendChild(el);\n  setTimeout(() => el.remove(), 3000);\n}\n\nfunction setTheme(t) {\n  document.documentElement.setAttribute('data-theme', t);\n  localStorage.setItem('dash-theme', t);\n  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));\n}\n\nfunction initSettings() {\n  ['warn', 'crit'].forEach(type => {\n    const input = document.getElementById('threshold-' + type);\n    input.value = getThreshold(type);\n    input.addEventListener('change', () => {\n      setSetting('threshold-' + type, Number(input.value));\n      renderOverview();\n      renderExternalIpTable();\n    });\n  });\n}\n\nfunction overviewMetrics() {\n  return [\n    { label: 'External IPs', used: DATA.ip_external.used, total: DATA.ip_external.total },\n    { label: 'Switch ports', used: DATA.ports.used, total: DATA.ports.total },\n    { label: 'Racks', used: DATA.racks.used, total: DATA.racks.total },\n  ];\n}\n\nfunction renderOverview() {\n  const grid = document.getElementById('metric-grid');\n  if (!DATA) {\n    grid.innerHTML = '<div class=\"empty\">No data. Check api/data.php</div>';\n    return;\n  }\n  grid.innerHTML = overviewMetrics().map(m => {\n    const p = pct(m.used, m.total);\n    return `<div class=\"metric-card\">\n      <div class=\"metric-label\">${m.label}</div>\n      <div class=\"metric-value\">${fmt(m.used)}</div>\n      <div class=\"metric-sub\">of ${fmt(m.total)} · ${p}%</div>\n      <div class=\"progress\"><div class=\"progress-fill ${statusClass(p)}\" style=\"width: ${p}%\"></div></div>\n    </div>`;\n  }).join('');\n}\n\nasync function fetchData(force = false) {\n  try {\n    const res = await fetch(API_URL + (force ? '?refresh=1' : ''));\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    DATA = await res.json();\n    toast('Data refreshed', 'success');\n  } catch (err) {\n    DATA = null;\n    toast('No connection to api/data.php', 'error');\n  } finally {\n    renderOverview();\n    renderExternalIpTable();\n  }\n}\n\nfunction computePagedRows(key, rows, searchFn) {\n  pagerState[key] = pagerState[key] || 0;\n  const q = document.getElementById(key + '-filter').value.toLowerCase().trim();\n  const pageSize = parseInt(document.getElementById(key + '-pagesize').value);\n  const filtered = q ? rows.filter(r => searchFn(r, q)) : rows;\n  const pages = Math.max(1, Math.ceil(filtered.length / pageSize));\n  pagerState[key] = Math.min(pagerState[key], pages - 1);\n  const start = pagerState[key] * pageSize;\n  return { filtered, slice: filtered.slice(start, start + pageSize), pages };\n}\n\nfunction updatePagerUI(key, pages, count) {\n  document.getElementById(key + '-page-info').textContent = `Page ${pagerState[key] + 1} of ${pages} · ${count} item(s)`;\n  document.getElementById(key + '-prev').disabled = pagerState[key] === 0;\n  document.getElementById(key + '-next').disabled = pagerState[key] >= pages - 1;\n}\n\nfunction renderExternalIpTable() {\n  const tbody = document.getElementById('ip-external-tbody');\n  if (!DATA) {\n    tbody.innerHTML = '<tr><td colspan=\"7\" class=\"empty\">No data</td></tr>';\n    return;\n  }\n  const { slice, pages, filtered } = computePagedRows('ip-external', DATA.ip_external.ranges,\n    (r, q) => r.range.toLowerCase().includes(q) || r.label.toLowerCase().includes(q));\n  tbody.innerHTML = slice.map(r => {\n    const p = pct(r.used, r.total);\n    const s = statusClass(p);\n    return `<tr>\n      <td><code>${r.range}</code></td>\n      <td>${r.label}</td>\n      <td>${r.total}</td>\n      <td>${r.used}</td>\n      <td>${r.total - r.used}</td>\n      <td><div class=\"progress\"><div class=\"progress-fill ${s}\" style=\"width: ${p}%\"></div></div></td>\n      <td><span class=\"badge ${s}\">${s.toUpperCase()}</span></td>\n    </tr>`;\n  }).join('') || '<tr><td colspan=\"7\" class=\"empty\">No ranges match your filter</td></tr>';\n  updatePagerUI('ip-external', pages, filtered.length);\n}\n\nfunction navigate(id) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));\n  const page = document.getElementById('page-' + id);\n  if (page) page.classList.add('active');\n  const nav = document.querySelector(`.nav-item[data-page=\"${id}\"]`);\n  if (nav) nav.classList.add('active');\n  localStorage.setItem('dash-page', id);\n}\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  setTheme(localStorage.getItem('dash-theme') || 'light');\n  document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));\n  initSettings();\n  document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigate(i.dataset.page)));\n  document.getElementById('refresh-btn').addEventListener('click', () => fetchData(true));\n  document.getElementById('ip-external-filter').addEventListener('input', () => {\n    pagerState['ip-external'] = 0;\n    renderExternalIpTable();\n  });\n  document.getElementById('ip-external-pagesize').addEventListener('change', renderExternalIpTable);\n  document.getElementById('ip-external-prev').addEventListener('click', () => {\n    pagerState['ip-external']--;\n    renderExternalIpTable();\n  });\n  document.getElementById('ip-external-next').addEventListener('click', () => {\n    pagerState['ip-external']++;\n    renderExternalIpTable();\n  });\n  fetchData();\n  navigate(localStorage.getItem('dash-page') || 'overview');\n});\n","api/data.php":"<?php\nheader('Content-Type: application/json');\nheader('Cache-Control: no-store');\n\nfunction pct(int $used, int $total): int {\n    return $total > 0 ? (int) round(($used / $total) * 100) : 0;\n}\n\nfunction read_json(string $file): array {\n    if (!is_file($file)) return [];\n    $data = json_decode(file_get_contents($file), true);\n    return is_array($data) ? $data : [];\n}\n\n$sites = read_json(__DIR__ . '/../data/sites.json');\n$ranges = read_json(__DIR__ . '/../data/ip_external.json');\n\n$ports = ['used' => 0, 'total' => 0];\n$racks = ['used' => 0, 'total' => 0];\nforeach ($sites as $site) {\n    $ports['used'] += $site['ports_used'];\n    $ports['total'] += $site['ports_total'];\n    $racks['used'] += $site['racks_used'];\n    $racks['total'] += $site['racks_total'];\n}\n\n$ipUsed = 0;\n$ipTotal = 0;\nforeach ($ranges as $r) {\n    $ipUsed += $r['used'];\n    $ipTotal += $r['total'];\n}\n\n$payload = json_encode([\n    'generated_at' => date('c'),\n    'sites'        => $sites,\n    'ports'        => $ports,\n    'racks'        => $racks,\n    'ip_external'  => [\n        'used'   => $ipUsed,\n        'total'  => $ipTotal,\n        'pct'    => pct($ipUsed, $ipTotal),\n        'ranges' => $ranges,\n    ],\n], JSON_UNESCAPED_UNICODE);\n\necho $payload;\n","data/sites.json":"[\n  {\n    \"id\": \"GOT1\",\n    \
