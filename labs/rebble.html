lay\">\n  <form class=\"login-box\" id=\"login-form\">\n    <div class=\"login-title\">IT Dashboard</div>\n    <label class=\"field\">User <input type=\"text\" id=\"login-user\" autocomplete=\"username\"></label>\n    <label class=\"field\">Password <input type=\"password\" id=\"login-pass\" autocomplete=\"current-password\"></label>\n    <button class=\"btn btn-primary\" type=\"submit\">Log in</button>\n    <div class=\"login-error\" id=\"login-error\"></div>\n  </form>\n</div>\n\n<div class=\"toast-container\" id=\"toast-container\"></div>\n\n<div class=\"site-popup-overlay\" id=\"site-popup-overlay\">\n  <div class=\"site-popup\">\n    <div class=\"site-popup-header\">\n      <span id=\"site-popup-title\">Site</span>\n      <button class=\"icon-btn\" id=\"site-popup-close\" aria-label=\"Close\">×</button>\n    </div>\n    <div class=\"site-popup-body\" id=\"site-popup-body\"></div>\n  </div>\n</div>\n\n<header class=\"topbar\">\n  <div class=\"topbar-brand\">\n    <span class=\"topbar-logo\">IT</span>\n    <span class=\"topbar-name\">IT Dashboard</span>\n  </div>\n  <div class=\"topbar-right\">\n    <button class=\"icon-btn\" id=\"refresh-btn\" aria-label=\"Refresh\">↻</button>\n    <div class=\"bell-wrap\">\n      <button class=\"icon-btn\" id=\"bell-btn\" aria-label=\"Alerts\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"/></svg></button>\n      <span class=\"bell-count\" id=\"bell-count\">0</span>\n      <div class=\"alert-panel\" id=\"alert-panel\"></div>\n    </div>\n    <button class=\"icon-btn\" id=\"logout-btn\" aria-label=\"Log out\" title=\"Log out\">⏻</button>\n    <div class=\"theme-switcher\">\n      <button class=\"theme-btn\" data-theme=\"light\">Light</button>\n      <button class=\"theme-btn\" data-theme=\"dark\">Dark</button>\n    </div>\n  </div>\n</header>\n\n<div class=\"layout\">\n  <nav class=\"sidebar\">\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-label\">Overview</div>\n      <button class=\"nav-item\" data-page=\"overview\">Dashboard</button>\n      <button class=\"nav-item\" data-page=\"map\">Site Map</button>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-label\">IP Management</div>\n      <button class=\"nav-item\" data-page=\"ip-external\">External IPs</button>\n      <button class=\"nav-item\" data-page=\"import\">Import CSV</button>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-label\">System</div>\n      <button class=\"nav-item\" data-page=\"settings\">Settings</button>\n    </div>\n  </nav>\n\n  <main class=\"main\">\n    <div class=\"page\" id=\"page-overview\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Overview</div>\n        <div class=\"page-desc\">Live status across all connected systems</div>\n      </div>\n      <div class=\"metric-grid\" id=\"metric-grid\"></div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Recent activity</span></div>\n        <div id=\"activity-list\"></div>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-map\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Site Map</div>\n        <div class=\"page-desc\">Click a marker for details</div>\n      </div>\n      <div class=\"card map-card\">\n        <svg class=\"site-map\" id=\"site-map\" viewBox=\"0 0 700 580\"></svg>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-ip-external\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">External IP Usage</div>\n        <div class=\"page-desc\">Public IP ranges</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"table-tools\">\n          <input type=\"text\" class=\"filter-input\" id=\"ip-external-filter\" placeholder=\"Filter range or label\">\n          <select id=\"ip-external-pagesize\">\n            <option value=\"10\">10 per page</option>\n            <option value=\"25\">25 per page</option>\n          </select>\n          <button class=\"btn\" id=\"export-btn\">Export CSV</button>\n        </div>\n        <table class=\"data-table\">\n          <thead>\n            <tr><th>Range</th><th>Label</th><th>Total</th><th>Used</th><th>Free</th><th>Usage</th><th>Status</th></tr>\n          </thead>\n          <tbody id=\"ip-external-tbody\"></tbody>\n        </table>\n        <div class=\"pager\">\n          <button class=\"btn\" id=\"ip-external-prev\">← Prev</button>\n          <span id=\"ip-external-page-info\"></span>\n          <button class=\"btn\" id=\"ip-external-next\">Next →</button>\n        </div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Notes</span></div>\n        <textarea class=\"notes-input\" id=\"notes-ip-external\" placeholder=\"Pinned note for this page\"></textarea>\n        <div class=\"notes-actions\">\n          <button class=\"btn\" onclick=\"saveNote('ip-external', 'save')\">Save</button>\n          <button class=\"btn btn-primary\" onclick=\"saveNote('ip-external', 'post')\">Post</button>\n          <button class=\"btn\" onclick=\"saveNote('ip-external', 'clear')\">Clear</button>\n        </div>\n        <div id=\"notes-log-ip-external\"></div>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-import\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Import CSV</div>\n        <div class=\"page-desc\">Replace the external IP ranges from a spreadsheet export</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Upload</span></div>\n        <p class=\"empty\">Columns: range, label, total, used. The first row is the header.</p>\n        <input type=\"file\" id=\"import-file\" accept=\".csv,text/csv\">\n        <div class=\"notes-actions\">\n          <button class=\"btn btn-primary\" id=\"import-btn\">Import</button>\n        </div>\n        <div id=\"import-result\"></div>\n      </div>\n    </div>\n\n    <div class=\"page\" id=\"page-settings\">\n      <div class=\"page-header\">\n        <div class=\"page-title\">Settings</div>\n        <div class=\"page-desc\">Saved in this browser</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-header\"><span class=\"card-title\">Thresholds</span></div>\n        <label class=\"field\">Warning at (%) <input type=\"number\" id=\"threshold-warn\" min=\"1\" max=\"100\"></label>\n        <label class=\"field\">Critical at (%) <input type=\"number\" id=\"threshold-crit\" min=\"1\" max=\"100\"></label>\n      </div>\n    </div>\n  </main>\n</div>\n\n</body>\n</html>\n","css/style.css":"[data-theme=\"light\"] {\n  --bg: #f0f2f7;\n  --surface: #ffffff;\n  --surface-2: #f5f7fa;\n  --border: #dde2ec;\n  --text: #1e2d4a;\n  --text-muted: #6b7a96;\n  --accent: #2f5bd3;\n  --accent-light: #ebf0fa;\n  --green: #2a8c72;\n  --amber: #9a5e08;\n  --red: #d94f3d;\n  --topbar-bg: #1e2d4a;\n  --radius: 8px;\n}\n\n[data-theme=\"dark\"] {\n  --bg: #1c1c1e;\n  --surface: #2c2c2e;\n  --surface-2: #232325;\n  --border: #3a3a3c;\n  --text: #f2f2f7;\n  --text-muted: #8e8e93;\n  --accent: #0a84ff;\n  --accent-light: rgba(10, 132, 255, 0.14);\n  --green: #30d158;\n  --amber: #ff9f0a;\n  --red: #ff453a;\n  --topbar-bg: #000000;\n  --radius: 8px;\n}\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;\n  font-size: 14px;\n  background: var(--bg);\n  color: var(--text);\n}\n\n.topbar {\n  height: 52px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 20px;\n  background: var(--topbar-bg);\n  color: #ffffff;\n}\n\n.topbar-brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.topbar-logo {\n  width: 28px;\n  height: 28px;\n  display: grid;\n  place-items: center;\n  border-radius: 6px;\n  background: rgba(255, 255, 255, 0.14);\n  font-size: 11px;\n  font-weight: 700;\n}\n\n.topbar-name {\n  font-weight: 600;\n}\n\n.layout {\n  display: grid;\n  grid-template-columns: 220px 1fr;\n  height: calc(100vh - 52px);\n}\n\n.sidebar {\n  background: var(--surface);\n  border-right: 1px solid var(--border);\n  padding: 16px 10px;\n  overflow-y: auto;\n}\n\n.main {\n  padding: 24px 28px;\n  overflow-y: auto;\n}\n\n.sidebar-section {\n  margin-bottom: 18px;\n}\n\n.sidebar-label {\n  padding: 0 10px 6px;\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n.nav-item {\n  display: block;\n  width: 100%;\n  padding: 8px 10px;\n  border: 0;\n  border-radius: var(--radius);\n  background: transparent;\n  color: var(--text);\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n}\n\n.nav-item:hover {\n  background: var(--surface-2);\n}\n\n.nav-item.active {\n  background: var(--accent-light);\n  color: var(--accent);\n  font-weight: 600;\n}\n\n.page {\n  display: none;\n}\n\n.page.active {\n  display: block;\n}\n\n.page-header {\n  margin-bottom: 20px;\n}\n\n.page-title {\n  font-size: 22px;\n  font-weight: 600;\n}\n\n.page-desc {\n  margin-top: 4px;\n  color: var(--text-muted);\n}\n\n.topbar-right {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.theme-switcher {\n  display: flex;\n  gap: 4px;\n  padding: 3px;\n  border-radius: var(--radius);\n  background: rgba(255, 255, 255, 0.08);\n}\n\n.theme-btn {\n  padding: 5px 12px;\n  border: 0;\n  border-radius: 6px;\n  background: transparent;\n  color: rgba(255, 255, 255, 0.7);\n  font: inherit;\n  font-size: 12px;\n  cursor: pointer;\n}\n\n.theme-btn.active {\n  background: rgba(255, 255, 255, 0.18);\n  color: #ffffff;\n}\n\n.card {\n  margin-bottom: 16px;\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.card-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 12px;\n}\n\n.card-title {\n  font-weight: 600;\n}\n\n.field {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  max-width: 320px;\n  padding: 6px 0;\n  color: var(--text-muted);\n}\n\ninput,\nselect,\ntextarea {\n  padding: 6px 8px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface-2);\n  color: var(--text);\n  font: inherit;\n}\n\n.field input {\n  width: 80px;\n}\n\n.metric-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n  margin-bottom: 16px;\n}\n\n.metric-card {\n  padding: 16px 18px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.metric-label {\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.metric-value {\n  margin: 6px 0 2px;\n  font-size: 30px;\n  font-weight: 600;\n}\n\n.metric-sub {\n  margin-bottom: 12px;\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.progress {\n  height: 6px;\n  border-radius: 3px;\n  background: var(--surface-2);\n  overflow: hidden;\n}\n\n.progress-fill {\n  height: 100%;\n  border-radius: 3px;\n}\n\n.progress-fill.ok {\n  background: var(--green);\n}\n\n.progress-fill.warn {\n  background: var(--amber);\n}\n\n.progress-fill.crit {\n  background: var(--red);\n}\n\n.icon-btn {\n  width: 30px;\n  height: 30px;\n  border: 0;\n  border-radius: 6px;\n  background: rgba(255, 255, 255, 0.08);\n  color: #ffffff;\n  font-size: 16px;\n  cursor: pointer;\n}\n\n.toast-container {\n  position: fixed;\n  right: 20px;\n  bottom: 20px;\n  z-index: 100;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.toast {\n  padding: 10px 14px;\n  border: 1px solid var(--border);\n  border-left: 4px solid var(--accent);\n  border-radius: var(--radius);\n  background: var(--surface);\n  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);\n}\n\n.toast.success {\n  border-left-color: var(--green);\n}\n\n.toast.error {\n  border-left-color: var(--red);\n}\n\n.empty {\n  padding: 12px 0;\n  color: var(--text-muted);\n}\n\n.table-tools {\n  display: flex;\n  gap: 8px;\n  margin-bottom: 12px;\n}\n\n.filter-input {\n  flex: 1;\n  max-width: 280px;\n}\n\n.data-table {\n  width: 100%;\n  border-collapse: collapse;\n}\n\n.data-table th {\n  padding: 8px 10px;\n  border-bottom: 1px solid var(--border);\n  color: var(--text-muted);\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  text-align: left;\n  text-transform: uppercase;\n}\n\n.data-table td {\n  padding: 9px 10px;\n  border-bottom: 1px solid var(--border);\n}\n\n.data-table .progress {\n  width: 90px;\n}\n\n.badge {\n  display: inline-block;\n  padding: 2px 8px;\n  border-radius: 999px;\n  font-size: 11px;\n  font-weight: 600;\n}\n\n.badge.ok {\n  background: rgba(42, 140, 114, 0.12);\n  color: var(--green);\n}\n\n.badge.warn {\n  background: rgba(154, 94, 8, 0.12);\n  color: var(--amber);\n}\n\n.badge.crit {\n  background: rgba(217, 79, 61, 0.12);\n  color: var(--red);\n}\n\n.pager {\n  display: flex;\n  justify-content: flex-end;\n  align-items: center;\n  gap: 10px;\n  margin-top: 12px;\n  color: var(--text-muted);\n  font-size: 12px;\n}\n\n.btn {\n  padding: 6px 12px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: var(--surface);\n  color: var(--text);\n  font: inherit;\n  cursor: pointer;\n}\n\n.btn:disabled {\n  opacity: 0.4;\n  cursor: default;\n}\n\n.notes-input {\n  width: 100%;\n  min-height: 70px;\n  resize: vertical;\n}\n\n.notes-actions {\n  display: flex;\n  gap: 8px;\n  margin: 10px 0;\n}\n\n.btn-primary {\n  border-color: var(--accent);\n  background: var(--accent);\n  color: #ffffff;\n}\n\n.log-row {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  padding: 8px 0;\n  border-top: 1px solid var(--border);\n}\n\n.log-time {\n  color: var(--text-muted);\n  font-size: 11px;\n  white-space: nowrap;\n}\n\n.log-text {\n  flex: 1;\n}\n\n.log-del {\n  border: 0;\n  background: none;\n  color: var(--text-muted);\n  font-size: 16px;\n  cursor: pointer;\n}\n\n.activity-row {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  padding: 8px 4px;\n  border-top: 1px solid var(--border);\n  cursor: pointer;\n}\n\n.activity-row:hover {\n  background: var(--surface-2);\n}\n\n.activity-tag {\n  padding: 2px 8px;\n  border-radius: 999px;\n  background: var(--accent-light);\n  color: var(--accent);\n  font-size: 11px;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\n.activity-text {\n  flex: 1;\n}\n\n.activity-time {\n  color: var(--text-muted);\n  font-size: 11px;\n}\n\n.map-card {\n  padding: 8px;\n}\n\n.site-map {\n  display: block;\n  width: 100%;\n  max-height: calc(100vh - 200px);\n}\n\n.map-land {\n  fill: var(--surface-2);\n  stroke: var(--border);\n  stroke-width: 2;\n}\n\n.marker {\n  cursor: pointer;\n}\n\n.marker circle {\n  stroke: var(--surface);\n  stroke-width: 3;\n}\n\n.marker text {\n  fill: var(--text);\n  font-size: 11px;\n  font-weight: 600;\n  text-anchor: middle;\n}\n\n.marker.ok circle {\n  fill: var(--green);\n}\n\n.marker.warn circle {\n  fill: var(--amber);\n}\n\n.marker.crit circle {\n  fill: var(--red);\n}\n\n.marker.offline circle {\n  fill: var(--text-muted);\n}\n\n.site-popup-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 50;\n  display: none;\n  justify-content: center;\n  align-items: center;\n  background: rgba(0, 0, 0, 0.35);\n}\n\n.site-popup-overlay.open {\n  display: flex;\n}\n\n.site-popup {\n  width: 340px;\n  border-radius: var(--radius);\n  background: var(--surface);\n  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);\n}\n\n.site-popup-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 14px 18px;\n  border-bottom: 1px solid var(--border);\n  font-weight: 600;\n}\n\n.site-popup .icon-btn {\n  background: var(--surface-2);\n  color: var(--text);\n}\n\n.site-popup-body {\n  padding: 12px 18px 16px;\n}\n\n.kv {\n  display: flex;\n  justify-content: space-between;\n  padding: 6px 0;\n  color: var(--text-muted);\n}\n\n.kv b {\n  color: var(--text);\n}\n\n.icon-btn svg {\n  width: 16px;\n  height: 16px;\n}\n\n.bell-wrap {\n  position: relative;\n}\n\n.bell-count {\n  position: absolute;\n  top: -4px;\n  right: -4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  display: grid;\n  place-items: center;\n  border-radius: 8px;\n  background: var(--red);\n  color: #ffffff;\n  font-size: 10px;\n  font-weight: 700;\n  pointer-events: none;\n}\n\n.bell-count.zero {\n  display: none;\n}\n\n.alert-panel {\n  position: absolute;\n  top: 38px;\n  right: 0;\n  z-index: 60;\n  width: 320px;\n  display: none;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n  color: var(--text);\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);\n}\n\n.alert-panel.open {\n  display: block;\n}\n\n.alert-row {\n  display: flex;\n  gap: 10px;\n  padding: 10px 12px;\n  border-top: 1px solid var(--border);\n  cursor: pointer;\n}\n\n.alert-row:first-child {\n  border-top: 0;\n}\n\n.alert-row:hover {\n  background: var(--surface-2);\n}\n\n.alert-dot {\n  width: 8px;\n  height: 8px;\n  margin-top: 6px;\n  flex: none;\n  border-radius: 50%;\n}\n\n.alert-dot.crit {\n  background: var(--red);\n}\n\n.alert-dot.warn {\n  background: var(--amber);\n}\n\n.login-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 200;\n  display: none;\n  place-items: center;\n  background: var(--bg);\n}\n\n.login-overlay.open {\n  display: grid;\n}\n\n.login-box {\n  width: 320px;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  padding: 24px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}\n\n.login-title {\n  margin-bottom: 6px;\n  font-size: 18px;\n  font-weight: 600;\n}\n\n.login-box .field {\n  max-width: none;\n}\n\n.login-box .field input {\n  width: 180px;\n}\n\n.login-error {\n  min-height: 16px;\n  color: var(--red);\n  font-size: 12px;\n}\n","js/app.js":"const API_URL = 'api/data.php';\nlet DATA = null;\nlet TOKEN = localStorage.getItem('dash-token');\n\nconst pagerState = {};\n\nconst PAGE_LABELS = { 'ip-external': 'External IPs', 'map': 'Site Map' };\n\nconst MAP_BOUNDS = { minLat: 10, maxLat: 20, minLng: 30, maxLng: 44 };\nconst MAP_W = 700;\nconst MAP_H = 580;\nconst BORDER = [\n  [19.2, 33], [19.6, 35.5], [19, 38], [19.4, 40.5], [18.2, 42.8], [16.5, 43.3],\n  [15, 42], [13.4, 43], [11.6, 41.5], [10.6, 39], [11.2, 36.5], [10.5, 34],\n  [11.8, 31.5], [13.8, 30.8], [15.5, 31.8], [17.2, 30.6], [18.6, 31.4],\n];\n\nfunction getSetting(key, def) {\n  try {\n    const v = localStorage.getItem('dash-setting-' + key);\n    return v !== null ? JSON.parse(v) : def;\n  } catch (err) {\n    return def;\n  }\n}\n\nfunction setSetting(key, val) {\n  localStorage.setItem('dash-setting-' + key, JSON.stringify(val));\n}\n\nfunction getThreshold(type) {\n  return getSetting('threshold-' + type, type === 'warn' ? 70 : 80);\n}\n\nfunction pct(used, total) {\n  return total ? Math.round((used / total) * 100) : 0;\n}\n\nfunction statusClass(p) {\n  if (p >= getThreshold('crit')) return 'crit';\n  if (p >= getThreshold('warn')) return 'warn';\n  return 'ok';\n}\n\nfunction fmt(v) {\n  return v.toLocaleString('en-US');\n}\n\nfunction escapeHtml(s) {\n  return String(s)\n    .replace(/&/g, '&amp;')\n    .replace(/</g, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;');\n}\n\nfunction toast(msg, type = 'info') {\n  const c = document.getElementById('toast-container');\n  const el = document.createElement('div');\n  el.className = 'toast ' + type;\n  el.textContent = msg;\n  c.appendChild(el);\n  setTimeout(() => el.remove(), 3000);\n}\n\nfunction setTheme(t) {\n  document.documentElement.setAttribute('data-theme', t);\n  localStorage.setItem('dash-theme', t);\n  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));\n}\n\nfunction initSettings() {\n  ['warn', 'crit'].forEach(type => {\n    const input = document.getElementById('threshold-' + type);\n    input.value = getThreshold(type);\n    input.addEventListener('change', () => {\n      setSetting('threshold-' + type, Number(input.value));\n      renderOverview();\n      renderExternalIpTable();\n      renderMap();\n    });\n  });\n}\n\nfunction overviewMetrics() {\n  return [\n    { label: 'External IPs', used: DATA.ip_external.used, total: DATA.ip_external.total },\n    { label: 'Switch ports', used: DATA.ports.used, total: DATA.ports.total },\n    { label: 'Racks', used: DATA.racks.used, total: DATA.racks.total },\n  ];\n}\n\nfunction renderOverview() {\n  const grid = document.getElementById('metric-grid');\n  if (!DATA) {\n    grid.innerHTML = '<div class=\"empty\">No data. Check api/data.php</div>';\n    return;\n  }\n  grid.innerHTML = overviewMetrics().map(m => {\n    const p = pct(m.used, m.total);\n    return `<div class=\"metric-card\">\n      <div class=\"metric-label\">${m.label}</div>\n      <div class=\"metric-value\">${fmt(m.used)}</div>\n      <div class=\"metric-sub\">of ${fmt(m.total)} · ${p}%</div>\n      <div class=\"progress\"><div class=\"progress-fill ${statusClass(p)}\" style=\"width: ${p}%\"></div></div>\n    </div>`;\n  }).join('');\n}\n\nasync function api(url, opts = {}) {\n  opts.headers = Object.assign({}, opts.headers, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {});\n  const res = await fetch(url, opts);\n  if (res.status === 401) {\n    showLogin();\n    throw new Error('Please log in');\n  }\n  return res;\n}\n\nfunction showLogin() {\n  document.getElementById('login-overlay').classList.add('open');\n  document.getElementById('login-user').focus();\n}\n\nasync function login(e) {\n  e.preventDefault();\n  const err = document.getElementById('login-error');\n  const res = await fetch('api/login.php', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      user: document.getElementById('login-user').value,\n      pass: document.getElementById('login-pass').value,\n    }),\n  });\n  const j = await res.json();\n  if (!j.ok) {\n    err.textContent = j.error;\n    return;\n  }\n  TOKEN = j.token;\n  localStorage.setItem('dash-token', TOKEN);\n  err.textContent = '';\n  document.getElementById('login-pass').value = '';\n  document.getElementById('login-overlay').classList.remove('open');\n  fetchData(true);\n  loadNote(localStorage.getItem('dash-page') || 'overview');\n}\n\nfunction logout() {\n  TOKEN = null;\n  localStorage.removeItem('dash-token');\n  DATA = null;\n  renderOverview();\n  showLogin();\n}\n\nasync function fetchData(force = false) {\n  if (!TOKEN) return showLogin();\n  try {\n    const res = await api(API_URL + (force ? '?refresh=1' : ''));\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    DATA = await res.json();\n    toast('Data refreshed', 'success');\n  } catch (err) {\n    DATA = null;\n    toast('No connection to api/data.php', 'error');\n  } finally {\n    renderOverview();\n    renderExternalIpTable();\n    renderRecentActivity();\n    renderAlerts();\n    if (document.getElementById('page-map').classList.contains('active')) renderMap();\n  }\n}\n\nfunction computePagedRows(key, rows, searchFn) {\n  pagerState[key] = pagerState[key] || 0;\n  const q = document.getElementById(key + '-filter').value.toLowerCase().trim();\n  const pageSize = parseInt(document.getElementById(key + '-pagesize').value);\n  const filtered = q ? rows.filter(r => searchFn(r, q)) : rows;\n  const pages = Math.max(1, Math.ceil(filtered.length / pageSize));\n  pagerState[key] = Math.min(pagerState[key], pages - 1);\n  const start = pagerState[key] * pageSize;\n  return { filtered, slice: filtered.slice(start, start + pageSize), pages };\n}\n\nfunction updatePagerUI(key, pages, count) {\n  document.getElementById(key + '-page-info').textContent = `Page ${pagerState[key] + 1} of ${pages} · ${count} item(s)`;\n  document.getElementById(key + '-prev').disabled = pagerState[key] === 0;\n  document.getElementById(key + '-next').disabled = pagerState[key] >= pages - 1;\n}\n\nfunction renderExternalIpTable() {\n  const tbody = document.getElementById('ip-external-tbody');\n  if (!DATA) {\n    tbody.innerHTML = '<tr><td colspan=\"7\" class=\"empty\">No data</td></tr>';\n    return;\n  }\n  const { slice, pages, filtered } = computePagedRows('ip-external', DATA.ip_external.ranges,\n    (r, q) => r.range.toLowerCase().includes(q) || r.label.toLowerCase().includes(q));\n  tbody.innerHTML = slice.map(r => {\n    const p = pct(r.used, r.total);\n    const s = statusClass(p);\n    return `<tr>\n      <td><code>${r.range}</code></td>\n      <td>${r.label}</td>\n      <td>${r.total}</td>\n      <td>${r.used}</td>\n      <td>${r.total - r.used}</td>\n      <td><div class=\"progress\"><div class=\"progress-fill ${s}\" style=\"width: ${p}%\"></div></div></td>\n      <td><span class=\"badge ${s}\">${s.toUpperCase()}</span></td>\n    </tr>`;\n  }).join('') || '<tr><td colspan=\"7\" class=\"empty\">No ranges match your filter</td></tr>';\n  updatePagerUI('ip-external', pages, filtered.length);\n}\n\nasync function loadNote(page) {\n  const box = document.getElementById('notes-' + page);\n  if (!box) return;\n  if (!TOKEN) return;\n  try {\n    const res = await api('api/notes.php');\n    const j = await res.json();\n    const entry = (j.notes || {})[page] || { note: '', log: [] };\n    box.value = entry.note || '';\n    renderNoteLog(page, entry.log || []);\n  } catch (err) {\n    toast('Could not load notes', 'error');\n  }\n}\n\nfunction renderNoteLog(page, log) {\n  let html = '';\n  for (let i = log.length - 1; i >= 0; i--) {\n    html += `<div class=\"log-row\">\n      <span class=\"log-time\">${new Date(log[i].at).toLocaleString('en-GB')}</span>\n      <span class=\"log-text\">${escapeHtml(log[i].text)}</span>\n      <button class=\"log-del\" onclick=\"saveNote('${page}', 'delete_log', ${i})\">×</button>\n    </div>`;\n  }\n  document.getElementById('notes-log-' + page).innerHTML = html || '<div class=\"empty\">No posts yet</div>';\n}\n\nasync function saveNote(page, action, index = -1) {\n  const box = document.getElementById('notes-' + page);\n  try {\n    const res = await api('api/notes.php', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ page, action, note: box.value, index }),\n    });\n    const j = await res.json();\n    if (!j.ok) throw new Error(j.error);\n    box.value = j.note;\n    renderNoteLog(page, j.log);\n    renderRecentActivity();\n    toast(action === 'post' ? 'Note posted' : 'Saved', 'success');\n  } catch (err) {\n    toast('Could not save: ' + err.message, 'error');\n  }\n}\n\nfunction relAge(iso) {\n  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);\n  if (min < 1) return 'just now';\n  if (min < 60) return min + 'm ago';\n  const hr = Math.round(min / 60);\n  if (hr < 24) return hr + 'h ago';\n  return Math.round(hr / 24) + 'd ago';\n}\n\nasync function renderRecentActivity() {\n  const el = document.getElementById('activity-list');\n  try {\n    const res = await api('api/notes.php');\n    const j = await res.json();\n    const notes = j.notes || {};\n    const entries = [];\n    Object.keys(notes).forEach(page => {\n      (notes[page].log || []).forEach(entry => {\n        entries.push({ page, text: entry.text, at: entry.at });\n      });\n    });\n    entries.sort((a, b) => new Date(b.at) - new Date(a.at));\n    el.innerHTML = entries.slice(0, 8).map(e => `\n      <div class=\"activity-row\" onclick=\"navigate('${e.page}')\">\n        <span class=\"activity-tag\">${PAGE_LABELS[e.page] || e.page}</span>\n        <span class=\"activity-text\">${escapeHtml(e.text)}</span>\n        <span class=\"activity-time\">${relAge(e.at)}</span>\n      </div>`).join('') || '<div class=\"empty\">No posted notes yet</div>';\n  } catch (err) {\n    el.innerHTML = '<div class=\"empty\">Could not load recent activity</div>';\n  }\n}\n\nfunction latLngToXY(lat, lng) {\n  const x = ((lng - MAP_BOUNDS.minLng) / (MAP_BOUNDS.maxLng - MAP_BOUNDS.minLng)) * MAP_W;\n  const y = MAP_H - ((lat - MAP_BOUNDS.minLat) / (MAP_BOUNDS.maxLat - MAP_BOUNDS.minLat)) * MAP_H;\n  return [Math.round(x), Math.round(y)];\n}\n\nfunction renderMap() {\n  const svg = document.getElementById('site-map');\n  if (!DATA) return;\n  const outline = BORDER.map(([lat, lng]) => latLngToXY(lat, lng).join(',')).join(' ');\n  let html = `<polygon class=\"map-land\" points=\"${outline}\"/>`;\n  DATA.sites.forEach(site => {\n    const [x, y] = latLngToXY(site.lat, site.lng);\n    const status = site.online ? statusClass(pct(site.ports_used, site.ports_total)) : 'offline';\n    html += `<g class=\"marker ${status}\" data-id=\"${site.id}\" transform=\"translate(${x}, ${y})\">\n      <circle r=\"9\"></circle>\n      <text y=\"-14\">${site.id}</text>\n    </g>`;\n  });\n  svg.innerHTML = html;\n  svg.querySelectorAll('.marker').forEach(m => m.addEventListener('click', () => openSitePopup(m.dataset.id)));\n}\n\nfunction openSitePopup(id) {\n  const site = DATA.sites.find(s => s.id === id);\n  const p = pct(site.ports_used, site.ports_total);\n  document.getElementById('site-popup-title').textContent = site.name;\n  document.getElementById('site-popup-body').innerHTML = `\n    <div class=\"kv\"><span>City</span><b>${site.city}</b></div>\n    <div class=\"kv\"><span>Region</span><b>${site.region}</b></div>\n    <div class=\"kv\"><span>Status</span><b>${site.online ? 'Online' : 'Offline'}</b></div>\n    <div class=\"kv\"><span>Switch ports</span><b>${site.ports_used} / ${site.ports_total} (${p}%)</b></div>`;\n  document.getElementById('site-popup-overlay').classList.add('open');\n}\n\nfunction closeSitePopup() {\n  document.getElementById('site-popup-overlay').classList.remove('open');\n}\n\nfunction renderAlerts() {\n  const alerts = DATA ? DATA.alerts : [];\n  const count = document.getElementById('bell-count');\n  count.textContent = alerts.length;\n  count.classList.toggle('zero', alerts.length === 0);\n  document.getElementById('alert-panel').innerHTML = alerts.map(a => `\n    <div class=\"alert-row\" data-page=\"${a.page}\">\n      <span class=\"alert-dot ${a.level}\"></span>\n      <span>${escapeHtml(a.title)}</span>\n    </div>`).join('') || '<div class=\"empty\" style=\"padding: 12px\">No alerts</div>';\n}\n\nfunction csvCell(v) {\n  const s = String(v);\n  return /[\",\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n}\n\nfunction toCSV(rows, cols) {\n  const lines = [cols.join(',')];\n  rows.forEach(r => lines.push(cols.map(c => csvCell(r[c])).join(',')));\n  return lines.join('\\n');\n}\n\nfunction exportCSV() {\n  if (!DATA) return;\n  const csv = toCSV(DATA.ip_external.ranges, ['range', 'label', 'total', 'used']);\n  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = 'external-ips.csv';\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(url), 1000);\n}\n\nasync function importCSV() {\n  const input = document.getElementById('import-file');\n  const out = document.getElementById('import-result');\n  if (!input.files.length) {\n    out.textContent = 'Choose a .csv file first.';\n    return;\n  }\n  try {\n    const csv = await input.files[0].text();\n    const res = await api('api/import.php', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ csv }),\n    });\n    const j = await res.json();\n    if (!j.ok) throw new Error(j.error);\n    out.textContent = 'Imported ' + j.count + ' ranges.';\n    toast('Import done', 'success');\n    fetchData(true);\n  } catch (err) {\n    out.textContent = 'Import failed: ' + err.message;\n    toast('Import failed', 'error');\n  }\n}\n\nfunction navigate(id) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));\n  const page = document.getElementById('page-' + id);\n  if (page) page.classList.add('active');\n  const nav = document.querySelector(`.nav-item[data-page=\"${id}\"]`);\n  if (nav) nav.classList.add('active');\n  localStorage.setItem('dash-page', id);\n  loadNote(id);\n  if (id === 'map') renderMap();\n}\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  setTheme(localStorage.getItem('dash-theme') || 'light');\n  document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));\n  initSettings();\n  document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigate(i.dataset.page)));\n  document.getElementById('refresh-btn').addEventListener('click', () => fetchData(true));\n  document.getElementById('ip-external-filter').addEventListener('input', () => {\n    pagerState['ip-external'] = 0;\n    renderExternalIpTable();\n  });\n  document.getElementById('ip-external-pagesize').addEventListener('change', renderExternalIpTable);\n  document.getElementById('ip-external-prev').addEventListener('click', () => {\n    pagerState['ip-external']--;\n    renderExternalIpTable();\n  });\n  document.getElementById('ip-external-next').addEventListener('click', () => {\n    pagerState['ip-external']++;\n    renderExternalIpTable();\n  });\n  document.getElementById('site-popup-close').addEventListener('click', closeSitePopup);\n  document.getElementById('site-popup-overlay').addEventListener('click', e => {\n    if (e.target === e.currentTarget) closeSitePopup();\n  });\n  document.addEventListener('keydown', e => {\n    if (e.key === 'Escape') closeSitePopup();\n  });\n  document.getElementById('bell-btn').addEventListener('click', () => {\n    document.getElementById('alert-panel').classList.toggle('open');\n  });\n  document.getElementById('alert-panel').addEventListener('click', e => {\n    const row = e.target.closest('.alert-row');\n    if (!row) return;\n    document.getElementById('alert-panel').classList.remove('open');\n    navigate(row.dataset.page);\n  });\n  document.addEventListener('click', e => {\n    if (!e.target.closest('.bell-wrap')) document.getElementById('alert-panel').classList.remove('open');\n  });\n  document.getElementById('export-btn').addEventListener('click', exportCSV);\n  document.getElementById('import-btn').addEventListener('click', importCSV);\n  document.getElementById('login-form').addEventListener('submit', login);\n  document.getElementById('logout-btn').addEventListener('click', logout);\n  fetchData();\n  navigate(localStorage.getItem('dash-page') || 'overview');\n});\n","api/data.php":"<?php\nrequire __DIR__ . '/config.php';\nrequire __DIR__ . '/auth.php';\n\nheader('Content-Type: application/json');\nheader('Cache-Control: no-store');\nrequire_login();\n\n$cacheFile = __DIR__ . '/../data/response_cache.json';\n$force = isset($_GET['refresh']);\n\nif (!$force && is_file($cacheFile) && time() - filemtime($cacheFile) < CACHE_TTL) {\n    header('X-Cache: HIT');\n    readfile($cacheFile);\n    exit;\n}\n\nfunction pct(int $used, int $total): int {\n    return $total > 0 ? (int) round(($used / $total) * 100) : 0;\n}\n\nfunction read_json(string $file): array {\n    if (!is_file($file)) return [];\n    $data = json_decode(file_get_contents($file), true);\n    return is_array($data) ? $data : [];\n}\n\nfunction build_alerts(array $sites, array $ranges): array {\n    $alerts = [];\n    foreach ($sites as $site) {\n        if (!$site['online']) {\n            $alerts[] = ['level' => 'crit', 'title' => $site['name'] . ' is offline', 'page' => 'map'];\n        } elseif (pct($site['ports_used'], $site['ports_total']) >= 80) {\n            $alerts[] = ['level' => 'warn', 'title' => $site['name'] . ' switch ports above 80%', 'page' => 'map'];\n        }\n    }\n    foreach ($ranges as $r) {\n        if (pct($r['used'], $r['total']) >= 90) {\n            $alerts[] = ['level' => 'crit', 'title' => $r['range'] . ' is almost full', 'page' => 'ip-external'];\n        }\n    }\n    return $alerts;\n}\n\n$sites = read_json(__DIR__ . '/../data/sites.json');\n$ranges = read_json(__DIR__ . '/../data/ip_external.json');\n\n$ports = ['used' => 0, 'total' => 0];\n$racks = ['used' => 0, 'total' => 0];\nforeach ($sites as $site) {\n    $ports['used'] += $site['ports_used'];\n    $ports['total'] += $site['ports_total'];\n    $racks['used'] += $site['racks_used'];\n    $racks['total'] += $site['racks_total'];\n}\n\n$ipUsed = 0;\n$ipTotal = 0;\nforeach ($ranges as $r) {\n    $ipUsed += $r['used'];\n    $ipTotal += $r['total'];\n}\n\n$payload = json_encode([\n    'generated_at' => date('c'),\n    'sites'        => $sites,\n    'ports'        => $ports,\n    'racks'        => $racks,\n    'alerts'       => build_alerts($sites, $ranges),\n    'ip_external'  => [\n        'used'   => $ipUsed,\n        'total'  => $ipTotal,\n        'pct'    => pct($ipUsed, $ipTotal),\n        'ranges' => $ranges,\n    ],\n], JSON_UNESCAPED_UNICODE);\n\nfile_put_contents($cacheFile, $payload);\nheader('X-Cache: MISS');\necho $payload;\n","api/notes.php":"<?php\nrequire __DIR__ . '/auth.php';\n\nheader('Content-Type: application/json');\nheader('Cache-Control: no-store');\nrequire_login();\n\n$file = __DIR__ . '/../data/notes.json';\n$dir = dirname($file);\n\nfunction read_notes(string $file): array {\n    if (!is_file($file)) return [];\n    $data = json_decode(file_get_contents($file), true);\n    return is_array($data) ? $data : [];\n}\n\n$allowed = ['ip-external', 'map'];\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    if (!is_dir($dir) || !is_writable($dir)) {\n        http_response_code(500);\n        echo json_encode(['ok' => false, 'error' => 'data/ directory is not writable by the web server']);\n        exit;\n    }\n    $body = json_decode(file_get_contents('php://input'), true);\n    $page = $body['page'] ?? '';\n    $note = (string) ($body['note'] ?? '');\n    $action = $body['action'] ?? 'save';\n    if (!in_array($action, ['save', 'post', 'clear', 'delete_log'], true)) $action = 'save';\n    if (!in_array($page, $allowed, true)) {\n        http_response_code(400);\n        echo json_encode(['ok' => false, 'error' => 'invalid page']);\n        exit;\n    }\n    if ($action === 'post' && trim($note) === '') {\n        http_response_code(400);\n        echo json_encode(['ok' => false, 'error' => 'cannot post an empty note']);\n        exit;\n    }\n\n    $fp = fopen($file, 'c+');\n    if (!$fp || !flock($fp, LOCK_EX)) {\n        http_response_code(500);\n        echo json_encode(['ok' => false, 'error' => 'could not lock notes file']);\n        exit;\n    }\n    $notes = json_decode(stream_get_contents($fp), true);\n    if (!is_array($notes)) $notes = [];\n    $existing = $notes[$page] ?? ['note' => '', 'log' => []];\n    $log = $existing['log'] ?? [];\n\n    if ($action === 'post') {\n        $log[] = ['text' => $note, 'at' => date('c')];\n        $notes[$page] = ['note' => $existing['note'], 'log' => $log];\n    } elseif ($action === 'clear') {\n        $notes[$page] = ['note' => '', 'log' => $log];\n    } elseif ($action === 'delete_log') {\n        $index = (int) ($body['index'] ?? -1);\n        if (isset($log[$index])) array_splice($log, $index, 1);\n        $notes[$page] = ['note' => $existing['note'], 'log' => $log];\n    } else {\n        $notes[$page] = ['note' => $note, 'log' => $log];\n    }\n\n    ftruncate($fp, 0);\n    rewind($fp);\n    fwrite($fp, json_encode($notes, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE));\n    flock($fp, LOCK_UN);\n    fclose($fp);\n    echo json_encode(['ok' => true, 'note' => $notes[$page]['note'], 'log' => $log]);\n    exit;\n}\n\necho json_encode(['ok' => true, 'notes' => read_notes($file)]);\n","api/config.php":"<?php\ndefine('CACHE_TTL', 120);\ndefine('MAP_API_KEY', 'lab-only-key-7f3a');\n","api/config.example.php":"<?php\ndefine('CACHE_TTL', 120);\ndefine('MAP_API_KEY', 'put-your-key-here');\n",".gitignore":"api/config.php\ndata/notes.json\ndata/response_cache.json\ndata/sessions.json\n","api/import.php":"<?php\nrequire __DIR__ . '/auth.php';\n\nheader('Content-Type: application/json');\nrequire_login();\n\nfunction fail(int $code, string $error): void {\n    http_response_code($code);\n    echo json_encode(['ok' => false, 'error' => $error]);\n    exit;\n}\n\nif ($_SERVER['REQUEST_METHOD'] !== 'POST') fail(405, 'POST only');\n\n$body = json_decode(file_get_contents('php://input'), true);\n$csv = trim((string) ($body['csv'] ?? ''));\nif ($csv === '') fail(400, 'the file is empty');\n\n$lines = preg_split('/\\r\\n|\\n|\\r/', $csv);\n$header = array_map('trim', str_getcsv(array_shift($lines), ',', '\"', ''));\nif ($header !== ['range', 'label', 'total', 'used']) fail(400, 'the header must be: range,label,total,used');\n\n$ranges = [];\nforeach ($lines as $i => $line) {\n    $row = $i + 2;\n    if (trim($line) === '') continue;\n    $cells = array_map('trim', str_getcsv($line, ',', '\"', ''));\n    if (count($cells) !== 4) fail(400, \"line $row: expected 4 columns\");\n    [$range, $label, $total, $used] = $cells;\n    if (!preg_match('#^\\d{1,3}(\\.\\d{1,3}){3}/\\d{1,2}$#', $range)) fail(400, \"line $row: $range is not a range like 192.0.2.0/26\");\n    if (!preg_match('/^\\d+$/', $total) || !preg_match('/^\\d+$/', $used)) fail(400, \"line $row: total and used must be whole numbers\");\n    if ((int) $used > (int) $total) fail(400, \"line $row: used is bigger than total\");\n    $ranges[] = ['range' => $range, 'label' => $label, 'total' => (int) $total, 'used' => (int) $used];\n}\n\nfile_put_contents(__DIR__ . '/../data/ip_external.json', json_encode($ranges, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE), LOCK_EX);\n\n$cache = __DIR__ . '/../data/response_cache.json';\nif (is_file($cache)) unlink($cache);\n\necho json_encode(['ok' => true, 'count' => c function peekModal() {

function drillHtml(d, id) {
  let body = '';
  if (d.k === 'pick') body = '<div class="opts">' + d.o.map((o, i) => '<button class="opt" data-i="' + i + '">' + o + '</button>').join('') + '</div>';
  else if (d.k === 'order') {
    const idx = d.lines.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    if (idx.every((v, i) => v === i) && idx.length > 1) [idx[0], idx[1]] = [idx[1], idx[0]];
    body = '<div class="oans" data-ans></div><div class="ord">' + idx.map((i, k) => '<div class="oline" data-i="' + i + '"><span class="nb">' + (k + 1) + '</span>' + esc(d.lines[i]) + '</div>').join('') + '</div><div class="row" style="margin-top:8px"><button class="btn ghost sm" data-undo>Undo</button></div>';
  } else body = '<input data-in autocomplete="off" spellcheck="false" placeholder="type, then Enter">';
  return '<div class="dcard" id="' + id + '"><div class="eyebrow">' + ({ pick: 'Pick one', order: 'Put in order', type: 'Type it' }[d.k || 'type']) + '</div><div class="q">' + d.q + '</div>' + (d.code ? '<pre>' + esc(d.code) + '</pre>' : '') + body + '<div class="dfb"></div></div>';
}
const norm = (s) => String(s).trim().replace(/\s+/g, ' ').replace(/;$/, '').toLowerCase();
function wireDrill(card, d, onOk) {
  const fb = card.querySelector('.dfb');
  const win = (msg) => { card.classList.add('ok'); fb.className = 'dfb ok'; fb.innerHTML = '✓ ' + (msg || d.why || 'Right.'); sfx.ok(); onOk && onOk(); };
  const lose = (msg) => { card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 400); fb.className = 'dfb no'; fb.innerHTML = msg; sfx.bad(); };
  if (d.k === 'pick') {
    card.querySelectorAll('.opt').forEach((b) => (b.onclick = () => {
      if (card.classList.contains('ok')) return;
      const i = +b.dataset.i;
      if (i === d.a) { b.classList.add('right'); win(); } else { b.classList.add('wrong'); lose(d.hint || 'Not that one. Read the code once more.'); }
    }));
  } else if (d.k === 'order') {
    const ans = card.querySelector('[data-ans]'), picked = [];
    const draw = () => { ans.innerHTML = picked.map((i) => '<div class="oline">' + esc(d.lines[i]) + '</div>').join(''); card.querySelectorAll('.ord .oline').forEach((el) => el.classList.toggle('picked', picked.includes(+el.dataset.i))); };
    card.querySelectorAll('.ord .oline').forEach((el) => (el.onclick = () => {
      if (card.classList.contains('ok')) return;
      const i = +el.dataset.i; if (picked.includes(i)) return;
      picked.push(i); draw();
      if (picked.length === d.lines.length) { if (picked.every((v, k) => d.lines[v] === d.lines[k])) win(); else { lose(d.hint || 'Close. Something comes too early. Undo and try again.'); } }
    }));
    card.querySelector('[data-undo]').onclick = () => { if (card.classList.contains('ok')) return; picked.pop(); draw(); fb.textContent = ''; };
  } else {
    const inp = card.querySelector('[data-in]');
    let tries = 0;
    inp.onkeydown = (e) => {
      if (e.key !== 'Enter' || card.classList.contains('ok')) return;
      const v = inp.value;
      const okAns = d.a.some((a) => (a instanceof RegExp ? a.test(v.trim()) : norm(a) === norm(v)));
      if (okAns) { inp.readOnly = true; win(d.why); }
      else { tries++; lose((d.hint && tries === 1 ? d.hint : '') + (tries >= 2 ? ' Answer: <code>' + esc(d.show || d.a[0]) + '</code>' : '')); }
    };
  }
}

  if (faded) { const order = [...new Set(pool.map((x) => x.n))]; pool.sort((a, b) => stageFade(a.n).t - stageFade(b.n).t || order.indexOf(a.n) - order.indexOf(b.n)); const by = {}; const spread = []; pool.forEach((x) => (by[x.n] = by[x.n] || []).push(x)); const keys = Object.keys(by); while (spread.length < pool.length) keys.forEach((k) => by[k].length && spread.push(by[k].shift())); pool.splice(0, pool.length, ...spread); }

function archMap() {
  const m = BP().map, mp = maxPassed();
  const lit = (s) => s <= mp, nxt = (s) => s === mp + 1;
  const W = m.w, H = m.h;
  let svg = '<svg class="map" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Project architecture"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>';
  m.zones.forEach((z) => { svg += '<rect class="zone" x="' + z.x + '" y="' + z.y + '" width="' + z.w + '" height="' + z.h + '" rx="12"/><text class="zl" x="' + (z.x + 12) + '" y="' + (z.y + 20) + '">' + esc(z.label) + '</text>'; });
  const B = {}; m.boxes.forEach((b) => (B[b.id] = b));
  m.arrows.forEach((a) => {
    const f = B[a.from], t = B[a.to];
    let d, lx, ly, anchor = 'middle';
    if (a.side === 'left') {
      const x = f.x, y1 = f.y + f.h / 2, y2 = t.y + t.h / 2;
      d = 'M' + x + ' ' + y1 + ' C' + (x - 34) + ' ' + y1 + ',' + (x - 34) + ' ' + y2 + ',' + (x - 3) + ' ' + y2;
      lx = x - 24; ly = (y1 + y2) / 2 + 3;
    } else if (Math.abs(f.x - t.x) < 5) {
      const down = t.y > f.y, x = f.x + 18, y1 = down ? f.y + f.h : f.y, y2 = down ? t.y - 3 : t.y + t.h + 3;
      d = 'M' + x + ' ' + y1 + ' L' + x + ' ' + y2;
      lx = x + 8; ly = (y1 + y2) / 2 + 3; anchor = 'start';
    } else {
      const x1 = f.x + f.w, y1 = f.y + f.h / 2, x2 = t.x, y2 = t.y + t.h / 2;
      d = 'M' + x1 + ' ' + y1 + ' C' + (x1 + 40) + ' ' + y1 + ',' + (x2 - 40) + ' ' + y2 + ',' + (x2 - 3) + ' ' + y2;
      lx = (x1 + x2) / 2; ly = (y1 + y2) / 2 - 6;

{
  title: 'Sidebar', sub: 'navigation buttons + data attributes', commit: 'Add sidebar navigation',
  brief: 'Fill the sidebar: three labelled sections and four buttons. Each button carries the name of the page it opens in a <b>data attribute</b>, so the JavaScript in the next stage can read it.',
  teach: '<div class="eyebrow">Stage 3 · School</div><h2>Sidebar</h2><p>Navigation is a list of <b>buttons</b>. Each one carries a little label that says where it goes. HTML lets you invent attributes for that, as long as they start with <code>data-</code>.</p>'
    + COLS(P('<div class="sidebar-section">\n  <div class="sidebar-label">Overview</div>\n  <button class="nav-item" data-page="overview">Dashboard</button>\n  <button class="nav-item" data-page="map">Site Map</button>\n</div>'), UL('<code>data-page="map"</code> = info for JavaScript, invisible on screen', 'later, JS reads it as <code>button.dataset.page</code> → <code>"map"</code>', 'one <code>.sidebar-section</code> per group'))
    + '<h3>the tree</h3>' + FLOW('nav.sidebar', '›', 'div.sidebar-section', '›', 'div.sidebar-label', '+', 'button.nav-item[data-page]')
    + '<h3>resetting a button</h3><p>Buttons come with browser styling (grey box, border, their own font). Strip it, then style it yourself:</p>' + COLS(P('.nav-item {\n  display: block;\n  width: 100%;\n  border: 0;\n  background: transparent;\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n}'), UL('<code>font: inherit</code> = use the page font (buttons do not by default)', '<code>width: 100%</code> + <code>text-align: left</code> = a full-width row', '<code>.nav-item:hover</code> = mouse over', '<code>.nav-item.active</code> = BOTH classes on one element (no space!)'))

    { k: 'type', q: 'A button that stores the page name <code>map</code>: <code>&lt;button class="nav-item" ____&gt;</code>', a: ['data-page="map"', "data-page='map'"] },
    { k: 'pick', q: 'Why <code>font: inherit</code> on buttons?', o: ['buttons don\'t use the page font by default', 'it makes them bold', 'clicks need it'], a: 0 },

  ],
  specs: [['sections', 'Overview: Dashboard → <code>overview</code>, Site Map → <code>map</code> · IP Management: External IPs → <code>ip-external</code> · System: Settings → <code>settings</code>'], ['section', '<code>div.sidebar-section</code> · 18px gap below'], ['label', '<code>div.sidebar-label</code> · 10px · 600 · uppercase · letter-spacing .12em · <code>var(--text-muted)</code> · padding 0 10px 6px'], ['button', '<code>button.nav-item[data-page]</code> · block · 100% wide · padding 8px 10px · no border · transparent · <code>var(--radius)</code>'], ['hover', '<code>var(--surface-2)</code>'], ['active', '<code>.nav-item.active</code> → <code>var(--accent-light)</code> background · <code>var(--accent)</code> text · 600']],
  blanks: { 'index.html': ['sidebar-section', 'sidebar-label', 'data-page="overview"', 'data-page="map"', 'ip-external', 'data-page="settings"'], 'css/style.css': ['margin-bottom: 18px', 'uppercase', 'width: 100%', 'transparent', 'text-align', '.nav-item:hover', '.nav-item.active'] },
  hints: ['Three <code>div.sidebar-section</code> blocks. Each starts with a <code>div.sidebar-label</code>, then its buttons.', 'The button text is what you see (Dashboard), the <code>data-page</code> is the id (overview).'],
  tests: [

  ]
},
{
  title: 'Pages + router', sub: 'first JavaScript: navigate()', commit: 'Add pages and sidebar router',
  brief: 'One HTML file, four "pages". Only one is visible at a time. Write your first JavaScript file: <code>navigate(id)</code> shows the right page, lights up the right button, and remembers it for next time.',
  teach: '<div class="eyebrow">Stage 4 · School</div><h2>Pages + router</h2><p>Your dashboard is a <b>single-page app</b>: every page is already in index.html, as a hidden <code>div.page</code>. "Going to a page" = hiding all of them and showing one.</p>'
    + COLS(P('.page {\n  display: none;\n}\n\n.page.active {\n  display: block;\n}'), UL('all pages hidden by default', 'the one with <code>.active</code> shows', 'so JS only has to move one class'))
    + '<h3>navigate(id)</h3>' + FLOW('click', '→', "navigate('map')", '→', 'remove .active everywhere', '→', 'add to #page-map + its button', '→', 'save in localStorage')
    + P("function navigate(id) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));\n  const page = document.getElementById('page-' + id);\n  if (page) page.classList.add('active');\n  const nav = document.querySelector(§.nav-item[data-page=\"$\\{id}\"]§);\n  if (nav) nav.classList.add('active');\n  localStorage.setItem('dash-page', id);\n}")
    + '<h3>wiring it up</h3>' + COLS(P("document.addEventListener('DOMContentLoaded', () => {\n  document.querySelectorAll('.nav-item').forEach(i =>\n    i.addEventListener('click', () => navigate(i.dataset.page))\n  );\n  navigate(localStorage.getItem('dash-page') || 'overview');\n});"), UL('<code>DOMContentLoaded</code> = run when the HTML is ready', '<code>i.dataset.page</code> reads <code>data-page</code>', '<code>localStorage</code> = a small notebook in the browser that survives reloads', '<code>|| \'overview\'</code> = the default when nothing is saved'))
    + '<p>Load the script in the head with <code>&lt;script src="js/app.js" defer&gt;&lt;/script&gt;</code>. <b>defer</b> = download now, run after the HTML is read.</p>'
    + REAL('<code>navigate()</code> is in app.js (line ~6020) and does exactly this, plus "if this page is the map, draw the map".'),
  drills: [
    { k: 'type', q: 'Read <code>data-page</code> from a button called <code>b</code>', a: ['b.dataset.page', 'b.getAttribute("data-page")', "b.getAttribute('data-page')"] },
    { k: 'order', q: 'Order the steps inside navigate().', lines: ["document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));", "document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));", "document.getElementById('page-' + id).classList.add('active');", "localStorage.setItem('dash-page', id);"], hint: 'Clear everything first, then switch one page on, then save.' },
    { k: 'pick', q: '<code>&lt;script src="js/app.js" defer&gt;</code>: what does <b>defer</b> do?', o: ['runs the script after the HTML is parsed', 'waits one second', 'runs it only once'], a: 0 },
    { k: 'type', q: 'Save <code>map</code> under the key <code>dash-page</code>', a: [/^localStorage\.setItem\(\s*['"]dash-page['"]\s*,\s*['"]map['"]\s*\)\s*;?$/], show: "localStorage.setItem('dash-page', 'map')" }
  ],
  specs: [['page', '<code>div.page#page-{id}</code> › <code>div.page-header</code> › <code>.page-title</code> + <code>.page-desc</code>'], ['pages', 'overview "Overview" · map "Site Map" · ip-external "External IP Usage" · settings "Settings"'], ['descriptions', 'Live status across all connected systems · Click a marker for details · Public IP ranges · Saved in this browser'], ['css', '<code>.page</code> hidden · <code>.page.active</code> shown · title 22px 600 · desc muted'], ['script', '<code>js/app.js</code> in the head with <code>defer</code>'], ['navigate(id)', 'one <code>.page.active</code> + its <code>.nav-item.active</code> · saves <code>dash-page</code>'], ['start', 'navigate to the saved page, else <code>overview</code>']],
  blanks: { 'index.html': ['defer', 'page-overview', 'page-header', 'page-title', 'page-map', 'page-ip-external', 'page-settings'], 'css/style.css': ['display: none', '.page.active', 'display: block'], 'js/app.js': ['classList.remove', "'page-'", "classList.add('active')", '.nav-item[data-page=', "'dash-page'", 'DOMContentLoaded', 'i.dataset.page', "|| 'overview'"] },
  hints: ['Four <code>div.page</code> blocks inside <code>main.main</code>, each with its id: <code>page-overview</code>, <code>page-map</code>, …', 'In app.js: first <code>function navigate(id) { … }</code>, then the <code>DOMContentLoaded</code> block that adds a click listener to every <code>.nav-item</code>.'],
  tests: [
    { t: 'Four pages with the right ids', f: async (c) => { await c.load(); const ids = ['overview', 'map', 'ip-external', 'settings'].filter((i) => !c.$('#page-' + i + '.page')); need(!ids.length, 'Missing <code>div.page</code>: ' + ids.map((i) => '#page-' + i).join(', ')); } },
    { t: '<code>js/app.js</code> is loaded with <code>defer</code>', f: async (c) => { await c.load(); need(/<script[^>]*src=["'](\.\/)?js\/app\.js["'][^>]*>/i.test(c.src('index.html')), 'Add <code>&lt;script src="js/app.js" defer&gt;&lt;/script&gt;</code> to the head'); need(/<script[^>]*\bdefer\b[^>]*>/i.test(c.src('index.html')), 'Add <code>defer</code> to the script tag'); need(typeof c.fn('navigate') === 'function', 'No <code>navigate</code> function found in app.js'); } },
    { t: 'At start only Overview shows', f: async (c) => { await c.load(); const vis = c.$$('.page').filter((p) => c.visible(p)).map((p) => p.id); need(vis.length === 1, vis.length + ' pages are visible: ' + (vis.join(', ') || 'none')); need(vis[0] === 'page-overview', 'Start on overview, not ' + vis[0]); need(c.$('.nav-item[data-page="overview"]').classList.contains('active'), 'The Dashboard button should be <code>.active</code>'); } },

    { t: 'The last page is remembered after a reload', f: async (c) => { await c.load(); await c.click('.nav-item[data-page="settings"]'); need(c.ls['dash-page'] === 'settings', '<code>localStorage</code> key <code>dash-page</code> should be <code>settings</code>'); await c.reload(); need(c.visible('#page-settings'), 'After a reload, Settings should still be open'); } },
    { t: 'Titles and descriptions', f: async (c) => { await c.load(); const want = { overview: 'Overview', map: 'Site Map', 'ip-external': 'External IP Usage', settings: 'Settings' }; const bad = Object.keys(want).filter((k) => c.text('#page-' + k + ' .page-title') !== want[k]); need(!bad.length, 'Check the title of: ' + bad.join(', ')); need(c.$$('.page .page-desc').length === 4, 'Each page needs a <code>.page-desc</code>'); } }
  ]
},
{
  title: 'Theme switch + settings', sub: 'localStorage, JSON, try/catch', commit: 'Add theme switcher and threshold settings',
  brief: 'Make the themes switchable from the top bar, remember the choice, and build the Settings page: two thresholds (warning, critical) that the cards will use next stage. Settings are saved through two small helpers you will use everywhere.',
  teach: '<div class="eyebrow">Stage 5 · School</div><h2>Theme switch + settings</h2><p><b>localStorage only stores text.</b> Save the number 70 and you get back the string "70". So every setting goes through JSON on the way in and out.</p>'
    + COLS(P("function getSetting(key, def) {\n  try {\n    const v = localStorage.getItem('dash-setting-' + key);\n    return v !== null ? JSON.parse(v) : def;\n  } catch (err) {\n    return def;\n  }\n}\n\nfunction setSetting(key, val) {\n  localStorage.setItem('dash-setting-' + key, JSON.stringify(val));\n}"), UL('<code>JSON.stringify(70)</code> → <code>"70"</code>, <code>JSON.parse("70")</code> → <code>70</code>', '<code>def</code> = the default when nothing is saved', '<b>try/catch</b>: a broken value (<code>{oops</code>) makes JSON.parse throw. Without catch, your whole script stops.', 'the prefix <code>dash-setting-</code> keeps your keys apart'))
    + '<h3>setTheme(t)</h3>' + FLOW('click Dark', '→', 'setAttribute("data-theme", "dark")', '→', 'save dash-theme', '→', '.active on the Dark button')
    + P("function setTheme(t) {\n  document.documentElement.setAttribute('data-theme', t);\n  localStorage.setItem('dash-theme', t);\n  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));\n}")
    + '<p><code>classList.toggle(\'active\', yes)</code> adds the class when <i>yes</i> is true and removes it when false: one line instead of an if/else.</p>'
    + '<h3>thresholds</h3>' + P("function getThreshold(type) {\n  return getSetting('threshold-' + type, type === 'warn' ? 70 : 80);\n}") + '<p>On Settings, each input shows its current value, and saves on <code>change</code>:</p>' + P("input.value = getThreshold(type);\ninput.addEventListener('change', () => setSetting('threshold-' + type, Number(input.value)));")
    + REAL('the same <code>getSetting</code> with try/catch exists because a half-written value once blanked the whole page. Its <code>getThreshold</code> also defaults to 70 / 80.'),
  drills: [
    { k: 'pick', q: "<code>localStorage.setItem('n', 5)</code>, then <code>getItem('n')</code> gives…", o: ['"5" (text)', '5 (a number)', 'null'], a: 0 },
    { k: 'type', q: "Turn the text <code>'[1,2]'</code> back into an array", a: [/^JSON\.parse\(\s*['"]\[1,\s*2\]['"]\s*\)\s*;?$/], show: "JSON.parse('[1,2]')" },
    { k: 'type', q: "Set <code>data-theme</code> to <code>dark</code> on &lt;html&gt; (one line)", a: [/^document\.documentElement\.setAttribute\(\s*['"]data-theme['"]\s*,\s*['"]dark['"]\s*\)\s*;?$/], show: "document.documentElement.setAttribute('data-theme', 'dark')" },
    { k: 'pick', q: 'Why try/catch around JSON.parse?', o: ['a broken saved value would throw and stop the whole script', 'JSON.parse is slow', 'localStorage requires it'], a: 0 },
    { k: 'type', q: "<code>classList.____('active', isOn)</code> adds when true, removes when false", a: ['toggle'] }

{
  title: 'Metric cards', sub: 'data → HTML with map()', commit: 'Render overview metric cards',
  brief: 'Draw the Overview cards from a JavaScript array: label, big number, "of total · %", and a progress bar coloured by status. The numbers are fake for now; next stage PHP delivers the real ones.',
  teach: '<div class="eyebrow">Stage 6 · School</div><h2>Metric cards</h2><p>Never write a card by hand. Write the <b>data</b>, then turn data into HTML with one function. Add a metric = add one line of data.</p>'
    + FLOW('METRICS array', '→ .map() →', 'array of HTML strings', '→ .join(\'\') →', 'one string', '→', 'grid.innerHTML')
    + COLS(P("const METRICS = [\n  { label: 'External IPs', used: 412, total: 640 },\n  { label: 'Switch ports', used: 1180, total: 1440 },\n  { label: 'Racks', used: 86, total: 120 },\n];"), UL('an <b>array</b> <code>[ ]</code> of <b>objects</b> <code>{ }</code>', 'each object = one card', '<code>m.label</code>, <code>m.used</code>, <code>m.total</code>'))
    + '<h3>template literals</h3>' + P("const p = pct(m.used, m.total);\nreturn §<div class=\"metric-card\">\n  <div class=\"metric-label\">$\\{m.label}</div>\n  <div class=\"metric-value\">$\\{fmt(m.used)}</div>\n  <div class=\"metric-sub\">of $\\{fmt(m.total)} · $\\{p}%</div>\n  <div class=\"progress\"><div class=\"progress-fill $\\{statusClass(p)}\" style=\"width: $\\{p}%\"></div></div>\n</div>§;")
    + '<p>Backticks <code>&#96; &#96;</code> allow line breaks and <code>${…}</code> holes for values.</p>'
    + '<h3>three helpers</h3>' + COLS(P("function pct(used, total) {\n  return total ? Math.round((used / total) * 100) : 0;\n}\n\nfunction statusClass(p) {\n  if (p >= getThreshold('crit')) return 'crit';\n  if (p >= getThreshold('warn')) return 'warn';\n  return 'ok';\n}\n\nfunction fmt(v) {\n  return v.toLocaleString('en-US');\n}"), UL('<code>total ? … : 0</code> = never divide by zero', 'check <b>crit first</b>: 85 is also ≥ 70', '<code>fmt(1180)</code> → <code>1,180</code>', 'thresholds come from Settings (stage 5)'))
    + '<h3>the grid</h3>' + P('.metric-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n}') + '<p><b>auto-fit + minmax</b> = "as many columns of at least 220px as fit, stretched to fill". Three cards on a laptop, one per row on a phone, no media query.</p>'
    + REAL('<code>pct()</code> and <code>statusClass()</code> are exactly these, and the Overview cards were reworked to "label + big number + fraction + percent + one thin bar".'),
  drills: [
    { k: 'type', q: '<code>pct(30, 40)</code> returns…', a: ['75'] },
    { k: 'type', q: 'Thresholds 70 / 80. <code>statusClass(85)</code> returns… (just the word)', a: ['crit', "'crit'", '"crit"'] },
    { k: 'pick', q: '<code>[1, 2, 3].map(n => n * 2)</code> gives…', o: ['<code>[2, 4, 6]</code>', '<code>12</code>', '<code>[1, 2, 3, 2]</code>'], a: 0 },
    { k: 'pick', q: 'Why <code>.join(\'\')</code> after <code>.map()</code>?', o: ['innerHTML wants one string, map gives an array', 'to sort the cards', 'to drop empty cards'], a: 0 },
    { k: 'pick', q: '<code>repeat(auto-fit, minmax(220px, 1fr))</code>', o: ['as many ≥220px columns as fit, stretched to fill', 'exactly 220 columns', 'one column of 220px'], a: 0 }
  ],
  specs: [['data', '<code>const METRICS</code>: External IPs 412 / 640 · Switch ports 1180 / 1440 · Racks 86 / 120'], ['card', '<code>div.metric-card</code> › <code>.metric-label</code> + <code>.metric-value</code> (fmt used) + <code>.metric-sub</code> "of 640 · 64%" + <code>.progress</code> › <code>.progress-fill.{ok|warn|crit}</code> with width p%'], ['grid', '<code>div.metric-grid#metric-grid</code> on Overview · auto-fit minmax(220px, 1fr) · gap 16px'], ['helpers', '<code>pct()</code> · <code>statusClass()</code> · <code>fmt()</code> · <code>overviewMetrics()</code> returns METRICS · <code>renderOverview()</code>'], ['colours', 'ok <code>var(--green)</code> · warn <code>var(--amber)</code> · crit <code>var(--red)</code>'], ['live', 'changing a threshold on Settings re-renders the cards']],
  blanks: { 'index.html': ['metric-grid'], 'css/style.css': ['auto-fit', 'minmax(220px, 1fr)', '.metric-value', '.progress-fill.ok', 'var(--amber)', 'var(--red)'], 'js/app.js': ['412', 'Math.round', 'total ?', "getThreshold('crit')", 'toLocaleString', '.map(', 'pct(m.used, m.total)', 'fmt(m.used)', 'statusClass(p)', ".join('')", 'renderOverview();'] },
  hints: ['<code>renderOverview()</code>: <code>const grid = document.getElementById(\'metric-grid\'); grid.innerHTML = overviewMetrics().map(m => { … }).join(\'\');</code>', 'In <code>initSettings()</code>, the change listener now does two things: <code>setSetting(…)</code> and <code>renderOverview()</code>. Call <code>renderOverview()</code> once on start too.'],
  tests: [
    { t: '<code>pct()</code> rounds and never divides by zero', f: async (c) => { await c.load(); const pct = c.fn('pct'); need(typeof pct === 'function', 'Define <code>function pct(used, total)</code>'); need(pct(30, 40) === 75, 'pct(30, 40) gave ' + pct(30, 40)); need(pct(1, 3) === 33, 'pct(1, 3) should round to 33'); need(pct(5, 0) === 0, 'pct(5, 0) should be 0, not ' + pct(5, 0)); } },
    { t: '<code>statusClass()</code> follows the thresholds', fresh: true, f: async (c) => { await c.load(); const s = c.fn('statusClass'); need(typeof s === 'function', 'Define <code>statusClass(p)</code>'); const got = [50, 70, 79, 80, 95].map(s).join(' '); need(got === 'ok warn warn crit crit', 'For 50 70 79 80 95 you return: ' + got); } },
    { t: 'Three cards render on the Overview', f: async (c) => { await c.load(); const cards = c.$$('#metric-grid .metric-card'); need(cards.length === 3, 'Found ' + cards.length + ' <code>.metric-card</code> in #metric-grid'); const l = cards.map((x) => (x.querySelector('.metric-label') || {}).textContent || '').map((t) => t.trim()); need(l.join('|') === 'External IPs|Switch ports|Racks', 'Labels: ' + esc(l.join(', '))); } },

    { t: 'Bars: width = percent, colour = status', f: async (c) => { await c.load(); const f = c.$$('.metric-card .progress-fill'); need(f.length === 3, 'Each card needs <code>.progress</code> › <code>.progress-fill</code>'); const w = f.map((x) => Math.round((x.getBoundingClientRect().width / x.parentElement.getBoundingClientRect().width) * 100)); need(Math.abs(w[0] - 64) <= 1 && Math.abs(w[1] - 82) <= 1 && Math.abs(w[2] - 72) <= 1, 'Bar widths are ' + w.join('% ') + '%, expected 64% 82% 72%'); const cls = f.map((x) => ['ok', 'warn', 'crit'].find((s) => x.classList.contains(s)) || '?'); need(cls.join() === 'ok,crit,warn', 'Status classes: ' + cls.join(', ') + ' (expected ok, crit, warn)'); const col = f.map((x) => c.css(x, 'background-color')); need(new Set(col).size === 3, 'ok, warn and crit need three different colours'); } },
    { t: 'Cards sit on one row with auto-fit', f: async (c) => { await c.load(); need(/repeat\(\s*auto-fit\s*,\s*minmax\(/.test(c.src('css/style.css')), 'Use <code>repeat(auto-fit, minmax(220px, 1fr))</code>'); const t = c.$$('.metric-card').map((x) => Math.round(x.getBoundingClientRect().top)); need(new Set(t).size === 1, 'At 1280px wide all three cards should share one row'); } },
    { t: 'Changing a threshold re-renders the cards', fresh: true, f: async (c) => { await c.load(); await c.type('#threshold-crit', '90'); const k = c.$$('.metric-card .progress-fill')[1]; need(k && k.classList.contains('warn'), 'With crit = 90, Switch ports (82%) should turn warn: call renderOverview() on change'); } }
  ]

{
  title: 'Your first API', sub: 'PHP → JSON → fetch()', commit: 'Serve dashboard data from api/data.php', given: ['data/sites.json', 'data/ip_external.json'],
  brief: 'Move the numbers out of JavaScript. The data now lives in <code>data/*.json</code> on the server; <code>api/data.php</code> reads it, adds it up, and answers with one JSON payload. The page asks for it with <code>fetch()</code>.',
  teach: '<div class="eyebrow">Stage 7 · School</div><h2>Your first API</h2><p>The browser can\'t open files on the server. It can only <b>ask</b>. PHP is the one who answers.</p>'
    + FLOW("fetch('api/data.php')", '→', 'PHP reads data/*.json', '→', 'adds up', '→', 'json_encode → echo', '→', 'DATA', '→', 'renderOverview()')
    + '<div class="tree">it-dashboard/\n├── index.html\n├── css/style.css\n├── js/app.js\n├── api/\n│   └── data.php        ← new: the answer\n└── data/\n    ├── sites.json      ← given\n    └── ip_external.json ← given</div>'
    + '<h3>the PHP side</h3>' + COLS(P("<?php\nheader('Content-Type: application/json');\n\nfunction read_json(string $file): array {\n    if (!is_file($file)) return [];\n    $data = json_decode(file_get_contents($file), true);\n    return is_array($data) ? $data : [];\n}\n\n$sites = read_json(__DIR__ . '/../data/sites.json');\n\n$ports = ['used' => 0, 'total' => 0];\nforeach ($sites as $site) {\n    $ports['used'] += $site['ports_used'];\n    $ports['total'] += $site['ports_total'];\n}\n\necho json_encode(['sites' => $sites, 'ports' => $ports]);"), UL('<code>header()</code> = tell the browser "this is JSON"', '<code>__DIR__</code> = the folder of this file (api/), so <code>/../data</code> goes up one', '<code>json_decode(…, true)</code> → arrays, not objects', '<code>$a[\'x\'] += 5</code> = add to it', '<code>json_encode()</code> + <code>echo</code> = the answer', 'missing file → <code>[]</code>, never a warning (a warning would break the JSON)'))
    + '<h3>the JS side</h3>' + COLS(P("async function fetchData(force = false) {\n  try {\n    const res = await fetch(API_URL + (force ? '?refresh=1' : ''));\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    DATA = await res.json();\n    toast('Data refreshed', 'success');\n  } catch (err) {\n    DATA = null;\n    toast('No connection to api/data.php', 'error');\n  } finally {\n    renderOverview();\n  }\n}"), UL('<code>async</code>/<code>await</code> = wait for the server without freezing the page', 'fetch does <b>not</b> throw on 404/500: check <code>res.ok</code> yourself', '<b>finally</b> runs either way: always redraw', 'renderOverview must cope with <code>DATA === null</code>'))
    + '<p>Watch the <b>network</b> filter in the console below the editor: every request shows up there, like the Network tab in Chrome DevTools.</p>'
    + REAL('data.php is 1,800 lines because it talks to several outside systems, but the skeleton is this one: gather → json_encode → echo. <code>fetchData()</code> is nearly identical, including the <code>finally</code>.'),
  drills: [
    { k: 'pick', q: '<code>json_decode($text, true)</code>: what does <code>true</code> do?', o: ['gives associative arrays instead of objects', 'pretty-prints', 'throws on errors'], a: 0 },
    { k: 'type', q: "PHP: add <code>$r['used']</code> to <code>$total</code> (short form)", a: [/^\$total\s*\+=\s*\$r\[\s*['"]used['"]\s*\]\s*;?$/], show: "$total += $r['used'];" },
    { k: 'type', q: 'PHP: tell the browser the answer is JSON (one line)', a: [/^header\(\s*['"]content-type:\s*application\/json['"]\s*\)\s*;?$/i], show: "header('Content-Type: application/json');" },
    { k: 'order', q: 'Order the happy path of fetchData().', lines: ['const res = await fetch(API_URL);', "if (!res.ok) throw new Error('HTTP ' + res.status);", 'DATA = await res.json();', "toast('Data refreshed', 'success');"] },
    { k: 'pick', q: 'The server answers 500. <code>await fetch(…)</code>…', o: ['does NOT throw: you check <code>res.ok</code>', 'throws right away', 'returns null'], a: 0 },
    { k: 'pick', q: '<code>finally { renderOverview(); }</code> runs…', o: ['always, after try or catch', 'only after an error', 'only when it worked'], a: 0 }
  ],
  specs: [['data', '<code>data/sites.json</code> (10 sites) · <code>data/ip_external.json</code> (14 ranges) · given'], ['endpoint', '<code>api/data.php</code> · <code>Content-Type: application/json</code>'], ['payload', '<code>generated_at</code> (date(\'c\')) · <code>sites</code> · <code>ports</code> {used, total} · <code>racks</code> {used, total} · <code>ip_external</code> {used, total, pct, ranges}'], ['php helpers', '<code>pct()</code> · <code>read_json($file)</code> → [] when missing'], ['js', '<code>API_URL</code> · <code>let DATA = null</code> · <code>fetchData(force)</code> with try/catch/finally'], ['cards', 'overviewMetrics() reads DATA · no DATA → <code>.empty</code> message'], ['toast', '<code>#toast-container</code> fixed bottom-right · <code>.toast.success</code> / <code>.toast.error</code> · removed after 3s'], ['refresh', '<code>button#refresh-btn.icon-btn</code> ↻ in .topbar-right → fetchData(true)']],
  blanks: { 'index.html': ['toast-container', 'refresh-btn'], 'css/style.css': ['position: fixed', '.toast.success', '.toast.error'], 'js/app.js': ["'api/data.php'", 'async', 'await fetch', 'res.ok', 'await res.json()', 'catch', 'finally', 'DATA.ip_external.used', 'DATA.ports.total', 'createElement', 'setTimeout', 'fetchData();'], 'api/data.php': ["'Content-Type: application/json'", 'file_get_contents', 'foreach ($sites as $site)', "+= $site['ports_used']", "$ipUsed += $r['used']", "date('c')", 'json_encode', 'echo'] },
  hints: ['Build data.php first and test it alone: the console\'s <b>network</b> filter shows <code>GET api/data.php → 200</code>. Then fetch it from JS.', 'overviewMetrics() now returns three objects built from DATA: <code>DATA.ip_external.used</code>, <code>DATA.ports.used</code>, <code>DATA.racks.used</code> and their totals.', 'On start: replace <code>renderOverview()</code> with <code>fetchData()</code> (it renders in <code>finally</code>).'],

{
  title: 'The table page', sub: 'filter + pagination', commit: 'Add external IP table with filter and pager',
  brief: 'Build the External IPs page: a table of all ranges with a usage bar and a status badge, a filter box, a page-size select and Prev / Next. One helper does the filtering and slicing, so every future table can reuse it.',
  teach: '<div class="eyebrow">Stage 8 · School</div><h2>The table page</h2><p>Filtering and paging is always the same three steps. Do them in this order:</p>'
    + FLOW('all rows', '→ filter →', 'matching rows', '→ count pages →', 'clamp page', '→ slice →', 'rows to draw')
    + P("function computePagedRows(key, rows, searchFn) {\n  pagerState[key] = pagerState[key] || 0;\n  const q = document.getElementById(key + '-filter').value.toLowerCase().trim();\n  const pageSize = parseInt(document.getElementById(key + '-pagesize').value);\n  const filtered = q ? rows.filter(r => searchFn(r, q)) : rows;\n  const pages = Math.max(1, Math.ceil(filtered.length / pageSize));\n  pagerState[key] = Math.min(pagerState[key], pages - 1);\n  const start = pagerState[key] * pageSize;\n  return { filtered, slice: filtered.slice(start, start + pageSize), pages };\n}")
    + COLS(P('14 rows, 10 per page\n\npage 0 → slice(0, 10)   rows 1–10\npage 1 → slice(10, 20)  rows 11–14\n\npages = Math.ceil(14 / 10) = 2'), UL('<code>key</code> = "ip-external", used to find <code>#ip-external-filter</code> etc.', '<code>searchFn</code> = YOU decide what matches (range or label)', '<code>pagerState</code> = which page each table is on', '<b>clamp</b>: a filter can shrink the list, so page 2 may no longer exist'))
    + '<h3>the pager</h3>' + P("function updatePagerUI(key, pages, count) {\n  document.getElementById(key + '-page-info').textContent = §Page $\\{pagerState[key] + 1} of $\\{pages} · $\\{count} item(s)§;\n  document.getElementById(key + '-prev').disabled = pagerState[key] === 0;\n  document.getElementById(key + '-next').disabled = pagerState[key] >= pages - 1;\n}")
    + '<p>Wire it in DOMContentLoaded: filter <code>input</code> → page 0 + redraw · page size <code>change</code> → redraw · Prev / Next <code>click</code> → page −1 / +1 + redraw. Draw the table in <code>fetchData()</code>\'s finally, next to renderOverview.</p>'
    + REAL('<code>computePagedRows</code> and <code>updatePagerUI</code> are shared by four different tables: one helper, four tables.'),
  drills: [
    { k: 'type', q: '14 rows, 10 per page. How many pages?', a: ['2'] },
    { k: 'type', q: 'Second page (index 1), 10 per page: <code>rows.slice(____, 20)</code>', a: ['10'] },
    { k: 'pick', q: "<code>'Gotham · customers'.toLowerCase().includes('brus')</code>", o: ['<code>true</code>', '<code>false</code>', '<code>"brus"</code>'], a: 0 },
    { k: 'pick', q: 'Why jump back to page 0 when the filter changes?', o: ['the old page may not exist in the smaller list', 'to clear the input', 'to fetch again'], a: 0 },

  specs: [['table', '<code>.card</code> › <code>table.data-table</code> › thead: Range · Label · Total · Used · Free · Usage · Status · <code>tbody#ip-external-tbody</code>'], ['row', 'range in <code>&lt;code&gt;</code> · free = total − used · Usage = <code>.progress</code> bar · Status = <code>span.badge.{ok|warn|crit}</code> OK / WARN / CRIT'], ['filter', '<code>input#ip-external-filter.filter-input</code> · range OR label · ignores case'], ['page size', '<code>select#ip-external-pagesize</code> · 10 / 25'], ['pager', '<code>#ip-external-prev</code> · <code>#ip-external-page-info</code> "Page 1 of 2 · 14 item(s)" · <code>#ip-external-next</code> · disabled at the ends'], ['empty', 'no match → one row "No ranges match your filter"'], ['helpers', '<code>pagerState</code> · <code>computePagedRows()</code> · <code>updatePagerUI()</code> · <code>renderExternalIpTable()</code>'], ['css', 'collapsed borders · uppercase muted headers · coloured badges · <code>.btn</code> + <code>.btn:disabled</code>']],
  blanks: { 'index.html': ['data-table', 'ip-external-tbody', 'ip-external-filter', 'ip-external-pagesize', 'ip-external-prev', 'ip-external-next'], 'css/style.css': ['border-collapse', '.badge.crit', '.btn:disabled'], 'js/app.js': ['.toLowerCase().trim()', 'parseInt', 'rows.filter', 'Math.ceil', 'Math.min', 'filtered.slice', 'pagerState[key] === 0', 'r.label.toLowerCase().includes(q)', 'r.total - r.used', "pagerState['ip-external'] = 0", "pagerState['ip-external']--", "pagerState['ip-external']++"] },
  hints: ['renderExternalIpTable(): call computePagedRows(\'ip-external\', DATA.ip_external.ranges, (r, q) => …), map <code>slice</code> to &lt;tr&gt; rows, then updatePagerUI(\'ip-external\', pages, filtered.length).', 'Call renderExternalIpTable() in fetchData\'s finally AND in the threshold change listener.'],
  tests: [
