<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{
 --bg:#eef1f3;--panel:#f8fafb;--ink:#15202b;--ink2:#465564;--mute:#7b8a98;--line:#d3dbe1;--line2:#b9c5ce;
 --acc:#0d8a86;--acc-soft:#d9efee;--warn:#b7791f;--warn-soft:#f6ead2;--bad:#b3403a;--bad-soft:#f6dedc;--code:#10202c;--code-ink:#cfe6e4;
 --disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0b1218;--panel:#111b23;--ink:#e3ecf2;--ink2:#a9b8c5;--mute:#6f8091;--line:#1f2d38;--line2:#2c3e4c;
 --acc:#3fc6bf;--acc-soft:#12343a;--warn:#e0a94a;--warn-soft:#33290f;--bad:#e2776f;--bad-soft:#3a1a18;--code:#070d12;--code-ink:#bfe3df;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0b1218;--panel:#111b23;--ink:#e3ecf2;--ink2:#a9b8c5;--mute:#6f8091;--line:#1f2d38;--line2:#2c3e4c;
 --acc:#3fc6bf;--acc-soft:#12343a;--warn:#e0a94a;--warn-soft:#33290f;--bad:#e2776f;--bad-soft:#3a1a18;--code:#070d12;--code-ink:#bfe3df;color-scheme:dark}
body{--t-bg:var(--code);--t-ink:var(--code-ink);--t-in:#fff;--t-err:#f08f86;--t-note:#8fb7c2;--t-noteline:#2f6f78;--t-ok:#7fe0b0;--t-sys:#8ea3b3;--t-rule:#1d3442;--t-b:#fff;--t-codebg:#1d3442;--t-code:#cfe6e4}
body[data-skin="orbital"]{
 --bg:#eef1f4;--panel:#ffffff;--ink:#232a31;--ink2:#4a5560;--mute:#8a94a0;--line:#d7dce2;--line2:#c4ccd4;
 --acc:#0f8fa8;--acc-soft:#e1f1ee;--warn:#e0701a;--warn-soft:#fdf3e4;--bad:#d64541;--bad-soft:#f8e3e1;--code:#232a31;--code-ink:#e8edf2;
 --t-bg:#f7f9fb;--t-ink:#232a31;--t-in:#232a31;--t-err:#d64541;--t-note:#4a5560;--t-noteline:#0f8fa8;--t-ok:#0f8fa8;--t-sys:#8a94a0;--t-rule:#d7dce2;--t-b:#232a31;--t-codebg:#e1f1ee;--t-code:#232a31;
 --disp:-apple-system,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;--body:-apple-system,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;--mono:"SF Mono",Consolas,Menlo,monospace;color-scheme:light}
body[data-skin="orbital"] .chip,body[data-skin="orbital"] .btn,body[data-skin="orbital"] .tog{border-radius:2px;background:#fff;color:#4a5560;letter-spacing:.12em;font-size:10px;box-shadow:inset 0 -2px 0 transparent;transition:box-shadow .2s,border-color .2s}
body[data-skin="orbital"] .chip:hover,body[data-skin="orbital"] .btn:hover,body[data-skin="orbital"] .tog:hover{border-color:#b8c1ca;color:var(--ink);box-shadow:inset 0 -2px 0 var(--warn);background:#fff}
body[data-skin="orbital"] .chip.on,body[data-skin="orbital"] .tog.on,body[data-skin="orbital"] .btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:inset 0 -2px 0 var(--warn)}
body[data-skin="orbital"] .chip.done .dot{background:var(--acc);border-color:var(--acc)}
body[data-skin="orbital"] .btn.ev{color:var(--bad);border-color:var(--bad)}
body[data-skin="orbital"] header{box-shadow:none}
body[data-skin="orbital"] .pick{box-shadow:0 1px 8px rgba(35,42,49,.06);background:#fff;padding-top:10px}
body[data-skin="orbital"] .col{border-radius:2px;box-shadow:0 1px 2px rgba(35,42,49,.06)}
body[data-skin="orbital"] .obj li{border-radius:2px;border:1px solid var(--line);border-left:3px solid #c4ccd4;background:#f1f4f7}
body[data-skin="orbital"] .obj li.done{border-left-color:var(--acc);background:var(--acc-soft)}
body[data-skin="orbital"] .obj li.now{border-left-color:var(--warn);background:#fff}

body[data-skin="orbital"] .thead,body[data-skin="orbital"] h3,body[data-skin="orbital"] .kick,body[data-skin="orbital"] summary{letter-spacing:.12em}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);display:grid;grid-template-rows:auto auto minmax(0,1fr)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:baseline;gap:18px;padding:14px 24px 8px;flex-wrap:wrap}
header h1{font:600 18px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;margin:0}

header .tog{align-self:center}
header .prog{margin-left:auto;font:500 12px var(--mono);color:var(--ink2)}
.pick{display:flex;gap:6px;padding:0 24px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--line2);color:var(--ink2);display:flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.chip .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line2)}
.chip.done .dot{background:var(--acc);border-color:var(--acc)}
.pick .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
.pick .lbl{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1.25fr);gap:14px;padding:14px 24px 18px;min-height:0}
.col{background:var(--panel);border:1px solid var(--line);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pad{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.kick{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0}
h2{font:600 21px/1.2 var(--disp);margin:0;text-wrap:balance}
h3{font:600 10.5px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:4px 0 0}
p{margin:0;color:var(--ink2)}
b{color:var(--ink);font-weight:600}
code{font:12.5px var(--mono);background:var(--acc-soft);padding:1px 5px;color:var(--ink)}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--ink2)}
li::marker{color:var(--acc)}
details{border:1px solid var(--line);background:var(--bg)}
summary{cursor:pointer;padding:8px 12px;font:600 10.5px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
details .in{padding:2px 12px 12px;display:flex;flex-direction:column;gap:8px}
.cmds{width:100%;border-collapse:collapse;font-size:12.5px}
.cmds td{padding:5px 8px 5px 0;border-top:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.cmds td:first-child{font-family:var(--mono);color:var(--ink)}
.obj{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0}
.obj li{border:1px solid var(--line);padding:9px 11px;display:grid;grid-template-columns:18px 1fr;gap:8px;background:var(--bg);transition:border-color .3s,background .3s}
.obj li i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line2);margin-top:4px}
.obj li.done{border-color:var(--acc);background:var(--acc-soft)}
.obj li.done i{background:var(--acc);border-color:var(--acc)}
.obj li.now{border-color:var(--warn)}
.obj li.now i{border-color:var(--warn);background:var(--warn);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 50%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.obj .t{color:var(--ink)}
.obj .why{grid-column:2;font-size:13px;color:var(--ink2)}
.obj .why small{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--line2);color:var(--ink2)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.ev{border-color:var(--bad);color:var(--bad)}
.btn.ev:hover{background:var(--bad-soft)}
.hint{border-left:2px solid var(--warn);padding:4px 0 4px 12px;font-size:13px;color:var(--ink2)}
.term{flex:1;min-height:0;overflow:auto;background:var(--t-bg);color:var(--t-ink);font:12.5px/1.6 var(--mono);padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.term .in{color:var(--t-in)}
.term .err{color:var(--t-err)}
.term .note{color:var(--t-note);border-left:2px solid var(--t-noteline);padding-left:10px;margin:4px 0 8px;font-family:var(--body);font-size:12.5px;white-space:normal}
.term .ok{color:var(--t-ok)}
.term b{color:var(--t-b)}
.term code{background:var(--t-codebg);color:var(--t-code)}
.term .sys{color:var(--t-sys)}
.prompt{display:flex;gap:8px;align-items:center;background:var(--t-bg);border-top:1px solid var(--t-rule);padding:10px 16px;font:12.5px var(--mono);color:var(--t-ok)}
.prompt input{flex:1;background:none;border:0;color:var(--t-in);font:12.5px var(--mono);outline:none;min-width:0}
.wiz{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.wiz.compact{flex:0 0 auto}
.sbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.sbar .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
.sbar .lbl,.things .lbl,p.lbl{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0}
.sbody{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.smsg{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:8px 12px;font-size:13px}
.things{align-items:center;border-top:1px solid var(--line);padding-top:12px}
.win{border:1px solid var(--line2);background:var(--panel);display:flex;flex-direction:column;min-height:240px;flex:1}
.wintitle{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:7px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.urlbar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.urlbar input{flex:1;height:32px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:13px var(--mono);padding:0 10px;min-width:0}
.page{padding:16px 18px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.simtag{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.linkbtn{color:var(--acc);text-decoration:underline;padding:0}
.dlrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 0}
.dlrow small{color:var(--mute);font-family:var(--mono);font-size:11.5px}
.row2{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px;font-size:13.5px;color:var(--ink2)}
.row2 select{height:34px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:13px var(--mono);padding:0 8px;min-width:0}
.lh{list-style:none;margin:8px 0 0 -18px;font:600 10.5px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.hit{cursor:pointer;outline:none}
.hit text{pointer-events:none}
.hit:hover rect:not(.padr),.hit:focus-visible rect:not(.padr),.hit:hover circle,.hit:focus-visible circle{stroke:var(--warn);stroke-width:2}
.rk{width:100%;display:block;touch-action:none;user-select:none;cursor:grab}
.rkwrap{border:1px solid var(--line);background:var(--bg)}
.addm{position:relative}
.addm summary{list-style:none;cursor:pointer}
.addm summary::-webkit-details-marker{display:none}
.addp{position:absolute;z-index:5;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--line2);display:flex;flex-direction:column;min-width:250px}
.addp .btn{border:0;border-bottom:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;padding:9px 12px}
.addp .btn small{text-transform:none;letter-spacing:0;color:var(--mute);font-size:11px}
.addp .btn:disabled{opacity:.4}
.drag{cursor:grab;outline:none}
.rk.dragging[data-dragging="rails"] [data-drag="rails"],.rk.dragging[data-dragging="trol"] [data-drag="trol"],.rk.dragging[data-dragging="trol"] [data-port="trol"],.rk.dragging[data-dragging="server"] [data-drag="server"],.rk.dragging[data-dragging="server"] [data-act="power"],.rk.dragging[data-dragging="server"] [data-act^="usb"],.rk.dragging[data-dragging="server"] [data-port="scr"],.rk.dragging[data-dragging="server"] [data-port="mgmt"],.rk.dragging.rk.dragging[data-dragging="server"] [data-port^="eno"],.rk.dragging[data-dragging="server"] [data-port^="psu"]{transform:translate(var(--dx),var(--dy));pointer-events:none;opacity:.85}
.drag:hover rect,.drag:focus-visible rect{stroke:var(--warn);stroke-width:2}
.drag text{pointer-events:none}
.k-power [data-port],.k-net [data-port],.k-console [data-port],.k-serial [data-port]{cursor:crosshair}
.rkbar .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rk text{font-family:var(--mono)}
.rkaway{opacity:.45;pointer-events:none}
.rkbar{align-items:center}
.rkbar .lbl{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-left:6px}
.dim{color:var(--mute)}
.btn.sm{height:26px;padding:0 8px;font-size:10.5px}
.reg td:last-child{text-align:right;white-space:nowrap}
.row2.wide{grid-template-columns:110px 1fr}
.row2 input{height:34px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:13px var(--mono);padding:0 8px;min-width:0}
.rev{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px 8px 28px;font-size:13px;color:var(--ink)}
.smsg.good{border-left-color:var(--acc);background:var(--acc-soft)}
.desk-empty{flex:1;min-height:200px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line2)}
.crt{background:#0b1014;color:#cfe6e4;border-left:0;min-height:170px;padding:16px 18px;font:12.5px/1.7 var(--mono);margin:0;white-space:pre-wrap}
.crt.off{color:#56646f}
.wizbox{border:1px solid var(--line2);display:flex;flex-direction:column;min-height:330px}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.cmds td:first-child{white-space:normal;overflow-wrap:anywhere}
.wbar{background:var(--code);color:#fff;font:600 13px var(--disp);letter-spacing:.08em;padding:10px 16px}
.wsteps{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wsteps span{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:3px 8px;border:1px solid var(--line)}
.wsteps .on{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}
.wsteps .past{color:var(--ink2)}
.wbody{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.wbody label{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:12px;font-size:13.5px;color:var(--ink2)}
.wbody input,.wbody select{height:34px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:13px var(--mono);padding:0 10px;min-width:0}
.wnote{font-size:13px}
.werr{color:var(--bad);font-size:13px;min-height:18px}
.wfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--panel)}
.wprog{height:4px;background:var(--line);overflow:hidden}
.wprog i{display:block;height:100%;background:var(--acc);width:0;animation:wp 2.5s linear forwards}
@keyframes wp{to{width:100%}}
[hidden]{display:none!important}
.thead{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.thead .sp{flex:1}
.tog{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:3px 8px;border:1px solid var(--line2)}
.tog.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
svg{width:100%;height:auto;display:block}
svg text{font-family:var(--mono)}
.flash{animation:flash 1s ease}
@keyframes flash{0%{opacity:.2}100%{opacity:1}}
.donebox{border:1px solid var(--acc);background:var(--acc-soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{font-size:11.5px;color:var(--mute)}
@media (max-width:1050px){main{grid-template-columns:1fr}.col{overflow:visible}.term{min-height:300px;max-height:50vh}body{display:block}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header>
 <h1>Proxle</h1>
 <span class="sub">Proxmox cluster lab · build it yourself, one scenario at a time</span>
 <span class="prog" id="prog"></span>
 <button class="tog" id="b-skin"></button>
</header>
<div class="pick" id="pick"></div>
<main>
 <section class="col"><div class="pad" id="left"></div></section>
 <section class="col">
  <div class="thead"><span id="where"></span><span class="sp"></span><button class="tog on" id="b-explain">Explain on</button><button class="tog" id="b-reset">Restart scenario</button></div>
  <div class="wiz" id="wiz" hidden></div>
  <div class="term" id="term"></div>
  <div class="prompt"><span id="ps1"></span><input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command"></div>
 </section>
 <section class="col"><div class="thead"><span id="rt">Live view of the site</span></div><div class="pad" id="right"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const IPS={pve1:'192.168.0.201',pve2:'192.168.0.202',pve3:'192.168.0.203',pve4:'192.168.0.204'};
const NAS={'192.168.0.50':{name:'Synology NAS, site west',site:'west',exports:['/volume1/pve','/volume1/backup']},'192.168.9.50':{name:'Synology NAS, site north',site:'north',exports:['/volume1/backup']}};
const VER='pve-manager/9.2-1/3a1f9c2e (running kernel: 6.14.8-2-pve)';
const CA_CLUSTER='7c1e4a52-9b0d-4f6e-a1c3-5d2b8e0f4a91';
const pad=n=>String(n).padStart(2,'0');

{id:'install',g:'Build',t:'Install a new server',story:'A new server was delivered to the server room at site west. It is still in its sealed box on the floor next to the rack: no cables, empty disks, no name, no address. You are at your desk with your laptop. A blank USB stick is in your drawer.<br><br>Nobody hands you the settings this time. You look them up, write the planning sheet, then build the server by hand.<br><br><b>Already decided:</b> the system goes on the two 480 GB SSDs, mirrored. The root password is your own choice. Remember it.',
 learn:['§Planning: where each value comes from','You do not invent network settings. The <b>network, gateway and DNS already exist</b>. You look them up.','The <b>gateway</b> is the router of that network. Any machine already on the network knows it: <code>ip route</code> shows it after "default via".','The <b>DNS server</b> turns names into addresses. A machine already on the network lists it in <code>/etc/resolv.conf</code>.','The <b>address</b> is your choice, inside rules: free in the IP register, outside the DHCP range, and fixed, because cluster nodes find each other by address.','A register can be out of date. <b>Ping</b> the address first: no answer means nothing is using it. Then reserve it, so nobody else takes it.','The <b>name</b> follows the convention already in use. Its number matches the address.','§Physical: before any software','A new server arrives in a box, with a <b>rail kit</b> and its power cords. The rails go into the rack first. The server slides onto them.','It then gets <b>two power cables on two different feeds</b>, A and B.','The network cable runs from the server\'s <b>first port</b> to a switch port that is set up for servers.','A server has no screen of its own. You connect a <b>console trolley</b> (screen and keyboard) for the install.','Or you use its <b>management port</b> (MGT). It is a tiny separate computer inside the server, the BMC, that runs as soon as the server has power. Cable it, and you can power the server on, see its screen and attach an ISO from your desk.','A switch has a <b>CON</b> port: a serial console that works even when the network does not. With a console cable you can ask the switch what each port is for.','§Installing','An empty server cannot install itself. You bring the installer to it on a <b>USB stick</b>.','The installer is a file called an <b>ISO</b>. You download it from the maker\'s website, then a small program writes it onto the stick so a server can start from it.','A server starts from its disks by default. To start from the stick you open its <b>boot menu</b> (F11) during startup.','Its <b>BIOS</b> (F2) holds hardware settings. Virtualization must be switched on there, or no VM will ever start.','The server only gets its <b>name</b> and <b>address</b> when you type them in the installer.'],

  {t:'Get the installer ready to start the server from',why:'Copying the ISO file onto a stick is not enough. A server can only start from a stick written with a flashing tool, or from an image attached through its management port.',done:W=>W.inst.usbImg==='ve'||W.inst.vmedia==='ve'||W.inst.booted,h:['Two real ways. By hand: plug the stick into your laptop and use USB Writer. Remotely: cable the server\'s MGT port, open its management page in the Browser and attach the image as virtual media.','USB Writer > select proxmox-ve_9.2-1.iso > Flash      or      Browser > 192.168.0.142 > Virtual media > Attach']},

let W,cur,hints,explain=true,doneSet={};
try{doneSet=JSON.parse(localStorage.getItem('pvelab.done')||'{}')||{}}catch(e){}
function saveDone(){try{localStorage.setItem('pvelab.done',JSON.stringify(doneSet))}catch(e){}}
const hist=[];let hi=null;
function line(cl,html){const d=document.createElement('div');d.className=cl;d.innerHTML=html;$('term').appendChild(d);$('term').scrollTop=1e9}
function ps1(){return W.prompt?'':W.host==='laptop'?'kaatje@laptop:~$':`root@${W.host}:~#`}
function objIndex(){return cur.obj.findIndex(o=>!o.done(W))}
function hooks(c,res,raw){
 if(/^hostname$/.test(raw.trim())&&W.host!=='laptop')W.seen.host=1;
 if(/^pvecm status$/.test(raw.trim())&&res.err&&/does not exist/.test(res.err))W.seen.nocluster=1;
 if(/^pvesm status$/.test(raw.trim())&&W.host==='pve4')W.seen.pvesm4=1;
 if(cur.id==='dies'&&W.seen.noq&&W.nodes.pve2.up&&/^pvecm status$/.test(raw.trim())&&!res.err)W.seen['status:2:q:after']=1;
 if(cur.id==='bkb'&&W.seen['bk:101:backup-b:snapshot']&&/^pvesm list backup-b$/.test(raw.trim()))W.seen['list:backup-b:after']=1;
}
function run(raw){
 const before=objIndex();
 const l=raw.replace(/\s+/g,' ').trim();
 let res;
 if(W.prompt){line('in',esc(/pw$/.test(W.prompt.k)?'':l));res=answerPrompt(W,l)}
 else{line('in',`<span class="ok">${ps1()}</span> ${esc(l)}`);if(!l){ $('ps1').textContent=ps1();return}if(hist[hist.length-1]!==l)hist.push(l);res=exec(W,l);hooks(l.split(' ')[0],res,l);W.t+=2}
 if(res.clear)$('term').innerHTML='';
 if(res.out)line('',esc(res.out));
 if(res.err)line('err',esc(res.err));
 if(res.note&&explain)line('note',res.note);
 after(before);
}
function after(before){
 const now=objIndex();
 if(before>=0&&now!==before)for(let i=before;i<(now<0?cur.obj.length:now);i++)line('ok','Objective done: '+esc(cur.obj[i].t));
 if(now<0&&!doneSet[cur.id]){doneSet[cur.id]=1;saveDone()}
 if(now!==before)hints=0;
 renderAll();
}
function renderPick(){
 const groups=[...new Set(SC.map(s=>s.g))];
 $('pick').innerHTML='<span class="lbl">Group</span>'+groups.map(g=>`<button class="chip ${g===cur.g?'on':''}" data-g="${g}">${g}</button>`).join('')+'<span class="sep"></span><span class="lbl">Scenario</span>'+SC.filter(s=>s.g===cur.g).map(s=>`<button class="chip ${s.id===cur.id?'on':''} ${doneSet[s.id]?'done':''}" data-s="${s.id}"><span class="dot"></span>${s.t}</button>`).join('');
 $('prog').textContent=`${SC.filter(s=>doneSet[s.id]).length} of ${SC.length} scenarios done`;
}
function renderLeft(){
 const k=objIndex(),n=SC.indexOf(cur)+1;
 const evs=(cur.ev||[]).filter(e=>e.when(W));
 const EVBLOCK=evs.length?`<h3>Make it happen</h3><div class="row">${evs.map(e=>`<button class="btn ev" data-ev="${(cur.ev||[]).indexOf(e)}">${e.l}</button>`).join('')}</div>`:'';
 let h=`<p class="kick">Scenario ${pad(n)} of ${SC.length} · ${cur.g}</p><h2>${cur.t}</h2><p>${cur.story}</p>${W.inst?`<h3>Your planning sheet</h3><table class="cmds">${[['Name','host'],['Address','ip'],['Gateway','gw'],['DNS server','dns']].map(r=>`<tr><td>${r[0]}</td><td>${W.inst.plan[r[1]]?esc(W.inst.plan[r[1]]):'<span class="dim">not found yet</span>'}</td></tr>`).join('')}</table>`:''}
 <details ${k===0&&!hist.length?'open':''} id="learn"><summary>Learn first</summary><div class="in"><ul>${cur.learn.map(x=>x[0]==='§'?`<li class="lh">${x.slice(1)}</li>`:`<li>${x}</li>`).join('')}</ul><table class="cmds">${cur.cmds.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td></tr>`).join('')}</table></div></details>
 ${EVBLOCK}<h3>Objectives</h3><ul class="obj">${cur.obj.map((o,i)=>`<li class="${i<k||k<0?'done':i===k?'now':''}"><i></i><span class="t">${o.t}</span>${i===k?`<span class="why"><small>Why, and what if you skip it</small>${o.why}</span>`:''}</li>`).join('')}</ul>`;
 if(k>=0){const hs=cur.obj[k].h;h+=`<div class="row"><button class="btn" id="b-hint">${hints>=hs.length?'No more hints':hints?'Show the exact command':'Give me a hint'}</button></div>${hs.slice(0,hints).map((x,i)=>`<p class="hint">${i?'<code>'+esc(x)+'</code>':esc(x)}</p>`).join('')}`}
 else{const nx=SC[SC.indexOf(cur)+1];h+=`<div class="donebox"><p class="kick">Scenario complete</p><ul>${cur.take.map(x=>`<li>${x}</li>`).join('')}</ul>${nx?`<div class="row"><button class="btn" data-s="${nx.id}">Next: ${nx.t}</button></div>`:'<p>That was the last one. You have built, run and protected a cluster.</p>'}</div>`}
 h+=`<p class="foot">Output is shortened and error wording can differ a little from a real server. The commands and their order are real.</p>`;
 const open=$('learn')?$('learn').open:null;
 $('left').innerHTML=h;if(open!==null&&hist.length)$('learn').open=open;
}
function renderRight(){

 if(I.app==='ipam'){

  win=`<div class="win"><div class="wintitle">IP register</div><div class="page"><p class="simtag">Company intranet · site west</p><h2>Network 192.168.0.0/24</h2><table class="cmds reg"><tr><td>192.168.0.1</td><td>router</td><td></td></tr><tr><td>192.168.0.9</td><td>kaatje-laptop, fixed</td><td></td></tr><tr><td>192.168.0.10</td><td>dc01, domain controller</td><td></td></tr><tr><td>192.168.0.50</td><td>Synology NAS</td><td></td></tr><tr><td>.100 to .199</td><td>DHCP range, handed out automatically</td><td></td></tr>${[201,202,203].map(fr).join('')}</table><p class="wnote">Naming rule: Proxmox nodes are called pveN.lab.local. Node N gets the address ending in 20N.</p><h2>DHCP leases</h2><table class="cmds reg">${bmcOK(I)?`<tr><td>${I.bmc.ip}</td><td>unknown device · bc:24:11:3a:20:0f</td></tr>`:'<tr><td>none</td><td>no new devices on the network</td></tr>'}</table><h2>Switch sw-west-01 · Juniper EX2300-C-12T</h2><table class="cmds reg"><tr><td>ge-0/0/0</td><td>uplink to the router</td></tr><tr><td>ge-0/0/1</td><td>Synology NAS</td></tr><tr><td>ge-0/0/2 to 4</td><td>server network, free</td></tr><tr><td>ge-0/0/5 and 7</td><td>guest wifi network</td></tr><tr><td>ge-0/0/6</td><td>switched off</td></tr><tr><td>ge-0/0/8 to 11</td><td>not configured</td></tr></table><p class="wnote">Power: every device takes one outlet on feed A and one on feed B.</p></div></div>`;
 }
 if(I.app==='plan'){
  const p=I.plan,f=(l,k,ph)=>`<label class="row2 wide">${l}<input id="p-${k}" data-pk="${k}" value="${esc(p[k]).replace(/"/g,'&quot;')}" placeholder="${ph}" autocomplete="off" spellcheck="false"></label>`;
  win=`<div class="win"><div class="wintitle">Planning sheet</div><div class="page"><p class="wnote">What you look up is noted here for you. You can still change any line by hand.</p>${f('Name','host','name.domain')}${f('Address','ip','address/prefix')}${f('Gateway','gw','')}${f('DNS server','dns','')}<label class="row2 wide">System disks<input value="2 x 480 GB SSD, mirror" disabled></label><div class="row"><button class="btn" data-act="review">Ask a colleague to review it</button></div>${I.rev?(I.rev.length?`<ul class="rev">${I.rev.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="smsg good">Reviewed: no remarks.</p>'):''}</div></div>`;
 }
 return `<div class="sbar"><button class="chip on" data-act="go:desk">Your desk</button><button class="chip" data-act="go:room">Server room</button><span class="sep"></span>${dock}</div>${I.app==='term'?'':`<div class="sbody">${I.msg?`<p class="smsg">${esc(I.msg)}</p>`:''}${win}<div class="row things"><span class="lbl">USB stick: ${usbWhere(I)}</span>${usbBtn}</div></div>`}`;
}
const SWOUT={vlans:'kaatje@sw-west-01> show vlans\n\nVLAN name   Tag   Interfaces\nservers     20    ge-0/0/0*  ge-0/0/1*  ge-0/0/2\n                  ge-0/0/3   ge-0/0/4\nguest       30    ge-0/0/5   ge-0/0/7\n\n* = link up. Ports 8 to 11 are in no VLAN.',ifs:'kaatje@sw-west-01> show interfaces terse\n\nInterface   Admin  Link\nge-0/0/0    up     up\nge-0/0/1    up     up\nge-0/0/2    up     down\nge-0/0/3    up     down\nge-0/0/4    up     down\nge-0/0/5    up     down\nge-0/0/6    down   down\nge-0/0/7    up     down\nge-0/0/8    up     down\nme0         up     up'};
function screenHtml(I){
 let scr='';const k=(a,l)=>`<button class="btn" data-act="${a}">${l}</button>`;
 if(I.screen==='off')scr=`<pre class="crt off">The screen is dark. The server is switched off.</pre>`;
 if(I.screen==='post')scr=`<pre class="crt">LAB SYSTEMS BIOS 2.4\n\nCPU     2 x 16 cores\nMemory  256 GB   OK\nDisks   2 x 480 GB SSD, 2 x 3.84 TB SSD\n\nPress F2 for Setup, F11 for Boot Menu\nStarting from the default boot order in a few seconds...</pre><div class="row">${k('key:F2','Press F2')}${k('key:F11','Press F11')}${k('key:wait','Wait')}</div>`;
 if(I.screen==='bios')scr=`<pre class="crt">LAB SYSTEMS BIOS SETUP\n\nProcessor settings\n  Intel Virtualization Technology     [${I.vt?'Enabled':'Disabled'}]\n\nBoot settings\n  Boot mode                           [UEFI]\n  Boot order                          USB, disk, network</pre><div class="row">${k('vt',I.vt?'Disable Virtualization Technology':'Enable Virtualization Technology')}${k('biosexit','Save and exit')}</div>`;
 if(I.screen==='bootmenu')scr=`<pre class="crt">BOOT MENU\n\nSelect a boot device:</pre><div class="row">${k('boot:usb','UEFI: USB storage device')}${k('boot:vcd','UEFI: Virtual CD (BMC)')}${k('boot:disk','UEFI: Hard disk')}${k('boot:pxe','UEFI: Network (PXE)')}</div>`;
 if(I.screen==='nodev')scr=`<pre class="crt">No bootable device found.\n\nInsert boot media, then switch the server off and on again.</pre>`;
 if(I.screen==='pxe')scr=`<pre class="crt">>>Start PXE over IPv4.\n  PXE-E16: No valid offer received.\n\nNo bootable device found.</pre>`;
 if(I.screen==='instmenu')scr=`<pre class="crt">Welcome to Proxmox Virtual Environment\n\nSelect an entry:</pre><div class="row">${k('inst:gui','Install Proxmox VE (Graphical)')}${k('inst:tui','Install Proxmox VE (Terminal UI)')}${k('inst:rescue','Rescue Boot')}</div>`;
 if(I.screen==='wrongprod')scr=`<pre class="crt">Welcome to ${PROD[I.bootImg].title}\n\nInstall ${PROD[I.bootImg].title} (Graphical)</pre><p class="smsg">This is the installer of ${PROD[I.bootImg].title}: ${PROD[I.bootImg].what}. It is not the one you need. Switch the server off, download the right image, and write or attach that one instead.</p>`;
 if(I.screen==='eula')scr=`<pre class="crt">END USER LICENSE AGREEMENT (EULA)\n\nProxmox VE is free software under the GNU Affero\nGeneral Public License, version 3.\n(shortened for this lab)</pre><div class="row">${k('eula','I agree')}</div>`;
 if(I.screen==='wizard')scr=`<div class="wizbox">${wizBody()}</div>`;
 if(I.screen==='success')scr=`<pre class="crt">Installation successful!\n\nThe system needs to restart. Remove the installation\nmedium before you reboot.</pre><div class="row">${k('reboot','Reboot')}</div>`;
 if(I.screen==='running'){const n=W.nodes[I.node];scr=`<pre class="crt">${'-'.repeat(54)}\n\nWelcome to the Proxmox Virtual Environment. Please use\nyour web browser to configure this server - connect to:\n\n  https://${n.ip}:8006/\n\n${'-'.repeat(54)}\n\n${I.node} login: _</pre>`}
 return scr;
}
function roomHtml(I){
 let scr=screenHtml(I);
 if(!conOK(I))scr=`<pre class="crt off">No screen is connected to the server.\n\nYou cannot see what it is doing, and you cannot press its keys.\nRun a screen lead from the server to the console trolley.</pre>`;
 return `<div class="sbar"><button class="chip" data-act="go:desk">Your desk</button><button class="chip on" data-act="go:room">Server room</button><span class="sep"></span><span class="lbl">Console trolley: screen and keyboard</span></div><div class="sbody">${I.msg?`<p class="smsg">${esc(I.msg)}</p>`:''}<p class="wnote">Your hands work in the rack on the right: unpacking, mounting, cables, power button and USB port.</p><p class="lbl">Screen</p>${scr}${I.rack.link.con==='lap'?`<p class="lbl">Your laptop · serial console on sw-west-01</p><pre class="crt">${SWOUT[I.swview]}</pre><div class="row"><button class="btn" data-act="swview:vlans">show vlans</button><button class="btn" data-act="swview:ifs">show interfaces terse</button></div>`:''}</div>`;
}
function renderScene(){
 const I=W.inst,on=!!I;
 const term=!on||(I.where==='desk'&&I.app==='term');
 $('wiz').hidden=!on;$('wiz').classList.toggle('compact',on&&term);$('term').hidden=!term;document.querySelector('.prompt').hidden=!term;
 if(!on)return;
 const keep=document.activeElement&&document.activeElement.id;
 $('wiz').innerHTML=I.where==='desk'?deskHtml(I):roomHtml(I);
 if(keep&&$(keep)&&keep!=='cmd'){$(keep).focus();try{const v=$(keep).value;$(keep).setSelectionRange(v.length,v.length)}catch(e){}}
}
function renderWiz(){renderScene()}
document.addEventListener('input',e=>{const d=e.target.dataset||{};if(!W.inst)return;if(d.ik){W.inst[d.ik]=e.target.value;renderScene();return}if(d.pk){W.inst.plan[d.pk]=e.target.value.trim();W.inst.rev=null;renderLeft();renderRight();return}if(!d.k)return;W.inst.cfg[d.k]=e.target.value.trim();if(e.target.tagName==='SELECT')renderScene();renderLeft()});
document.addEventListener('keydown',e=>{if(e.target.id==='url'&&e.key==='Enter'){doAct('nav',e.target.value)}else if(e.target.id==='bmcpw'&&e.key==='Enter'){doAct('bmclogin',e.target.value)}else if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('hit')){e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}else if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.drag){doAct('rk',e.target.dataset.drag==='rails'?'rails':'mount')}});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||!W.inst)return;
 if(window.__noClick&&Date.now()-window.__noClick<120&&e.target.closest('svg.rk'))return;
 const [n,...r]=b.dataset.act.split(':'),arg=r.join(':');
 if(n==='navgo'){doAct('nav',$('url').value);return}
 if(n==='bmcgo'){doAct('bmclogin',$('bmcpw').value);return}
 if((n==='dl'&&!W.inst.files.includes(PROD[arg].file))||n==='flash'||(n==='wnext'&&W.inst.step===4&&!wizCheck())){b.disabled=true;b.textContent=n==='dl'?'Downloading...':n==='flash'?'Flashing...':'Installing...';const bar=document.createElement('div');bar.className='wprog';bar.innerHTML='<i></i>';b.parentNode.parentNode.appendChild(bar);setTimeout(()=>doAct(n,arg),2500);return}
 doAct(n,arg);if(n==='app'&&arg==='term')$('cmd').focus();
});
const WORDS=['hostname','pveversion','pvecm','pvesm','qm','vzdump','qmrestore','ha-manager','ssh','ping','exit','clear','help','openssl','ls','date','ip'];
const SUB={pvecm:['status','nodes','create','add','expected'],pvesm:['status','add','list','remove'],qm:['list','config','start','stop','destroy','migrate','disk'],'ha-manager':['status','add']};
function complete(v){
 const parts=v.split(' '),last=parts[parts.length-1];let pool=[];
 if(parts.length===1)pool=WORDS;else if(parts.length===2&&SUB[parts[0]])pool=SUB[parts[0]];
 else pool=Object.keys(W.nodes).concat(Object.keys(W.storages),Object.keys(W.vms).map(String),['--server','--export','--content','--storage','--mode','--online','snapshot','images','backup','nfs','move','root@','/etc/pve/nodes/','-in','-noout','-subject','-issuer'],Object.values(IPS),Object.keys(NAS),[].concat(...Object.entries(W.backups).map(([s,l])=>l.map(b=>s+':backup/'+b.file))));
 const hit=pool.filter(x=>x.startsWith(last)&&x!==last);if(!last||!hit.length)return v;
 let pre=hit[0];hit.forEach(h=>{while(!h.startsWith(pre))pre=pre.slice(0,-1)});
 if(hit.length>1&&pre===last){line('sys',hit.join('   '));return v}
 parts[parts.length-1]=pre+(hit.length===1&&!/[:\/@]$/.test(pre)?' ':'');return parts.join(' ');
}
$('cmd').addEventListener('keydown',e=>{
 const el=e.target;
 if(e.key==='Enter'){const v=el.value;el.value='';hi=null;run(v)}
 else if(e.key==='ArrowUp'){e.preventDefault();if(!hist.length)return;hi=hi==null?hist.length-1:Math.max(0,hi-1);el.value=hist[hi]}
 else if(e.key==='ArrowDown'){e.preventDefault();if(hi==null)return;hi++;if(hi>=hist.length){hi=null;el.value=''}else el.value=hist[hi]}
 else if(e.key==='Tab'){e.preventDefault();el.value=complete(el.value)}
 else if(e.key==='l'&&e.ctrlKey){e.preventDefault();$('term').innerHTML=''}
 else if(e.key==='c'&&e.ctrlKey&&!el.selectionEnd){e.preventDefault();if(W.prompt){W.prompt=null;line('err','^C');renderAll()}else{line('in',`<span class="ok">${ps1()}</span> ${esc(el.value)}^C`);el.value=''}}
});
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-g]');if(g){load(SC.find(s=>s.g===g.dataset.g).id);return}
 const s=e.target.closest('[data-s]');if(s){load(s.dataset.s);return}
 const ev=e.target.closest('[data-ev]');if(ev){const before=objIndex(),E=cur.ev[+ev.dataset.ev];const msgs=E.go(W)||[];line('sys','--- '+esc(E.l)+' ---');msgs.forEach(m=>line('sys',esc(m)));after(before);$('cmd').focus();return}
 if(e.target.id==='b-hint'){const k=objIndex();if(k>=0&&hints<cur.obj[k].h.length){hints++;renderLeft()}return}
 if(e.target.id==='b-explain'){explain=!explain;e.target.classList.toggle('on',explain);e.target.textContent=explain?'Explain on':'Explain off';return}
 if(e.target.id==='b-reset'){load(cur.id);return}
 if(e.target.id==='b-skin'){setSkin(skin==='orbital'?'console':'orbital');return}
 if(e.target.closest('.term'))$('cmd').focus();
});
let skin='orbital';try{skin=localStorage.getItem('pvelab.skin')||'orbital'}catch(e){}
function setSkin(v){skin=v;if(v==='orbital')document.body.dataset.skin='orbital';else delete document.body.dataset.skin;$('b-skin').textContent='Theme: '+(v==='orbital'?'Orbital':'Console');try{localStorage.setItem('pvelab.skin',v)}catch(e){}}
setSkin(skin);
load(location.hash.slice(1)||'install',true);
window.LAB={plan:c=>{Object.assign(W.inst.plan,c);renderAll()},act:(n,a)=>doAct(n,a),cfg:c=>{Object.assign(W.inst.cfg,c);renderScene();renderLeft()},run,load,W:()=>W,cur:()=>cur,objIndex,ev:i=>{const b=objIndex();cur.ev[i].go(W);after(b)}};
