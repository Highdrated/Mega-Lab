{id:'install',g:'Build',t:'Install a new server',story:'A new server was delivered to the server room at site west. It is still in its sealed box on the floor next to the rack: no cables, empty disks, no name, no address. You are at your desk with your laptop. A blank USB stick is in your drawer.<br><br>Nobody hands you the settings this time. You look them up, write the planning sheet, then build the server by hand.<br><br><b>Already decided:</b> the system goes on the two 480 GB SSDs, mirrored. The root password is your own choice. Remember it.',
 learn:['§Planning: where each value comes from','You do not invent network settings. The <b>network, gateway and DNS already exist</b>. You look them up.','The <b>gateway</b> is the router of that network. Any machine already on the network knows it: <code>ip route</code> shows it after "default via".','The <b>DNS server</b> turns names into addresses. A machine already on the network lists it in <code>/etc/resolv.conf</code>.','The <b>address</b> is your choice, inside rules: free in the IP register, outside the DHCP range, and fixed, because cluster nodes find each other by address.','A register can be out of date. <b>Ping</b> the address first: no answer means nothing is using it. Then reserve it, so nobody else takes it.','The <b>name</b> follows the convention already in use. Its number matches the address.','§Physical: before any software','A new server arrives in a box, with a <b>rail kit</b> and its power cords. The rails go into the rack first. The server slides onto them.','It then gets <b>two power cables on two different feeds</b>, A and B.','The network cable runs from the server\'s <b>first port</b> to a switch port that is set up for servers.','A server has no screen of its own. You connect a <b>console trolley</b> (screen and keyboard) for the install.','Or you use its <b>management port</b> (MGT). It is a tiny separate computer inside the server, the BMC, that runs as soon as the server has power. Cable it, and you can power the server on, see its screen and attach an ISO from your desk.','A switch has a <b>CON</b> port: a serial console that works even when the network does not. With a console cable you can ask the switch what each port is for.','§Installing','An empty server cannot install itself. You bring the installer to it on a <b>USB stick</b>.','The installer is a file called an <b>ISO</b>. You download it from the maker\'s website, then a small program writes it onto the stick so a server can start from it.','A server starts from its disks by default. To start from the stick you open its <b>boot menu</b> (F11) during startup.','Its <b>BIOS</b> (F2) holds hardware settings. Virtualization must be switched on there, or no VM will ever start.','The server only gets its <b>name</b> and <b>address</b> when you type them in the installer.','§After the install','Proxmox is managed from a browser: <code>https://</code>, the address, then port <b>:8006</b>. Without the port nothing answers.','The server signed its own certificate during the install. Your browser does not know the signer, so it warns once. On your own network, on the address you just set, you continue.','You log in as <b>root</b> with the realm <b>Linux PAM</b>: root is a user of the Linux system on that server.','The installer built a <b>bridge</b>, <b>vmbr0</b>: a switch made of software. Port eno1 hangs under it, and your address sits on the bridge. VMs plug into it later.'],
 cmds:[['ip route','your gateway: the address after "default via"'],['cat /etc/resolv.conf','your DNS server: the "nameserver" line'],['ping &lt;ip&gt;','does anything answer on that address?'],['proxmox.com/en/downloads','where the installer is downloaded'],['ssh root@&lt;ip&gt;','log in to the server from your laptop, after the install'],['hostname','the name of the server you are on'],['https://&lt;ip&gt;:8006','the Proxmox web interface, typed in the Browser']],
 setup:()=>world({inst:true}),
 obj:[{t:'Find the gateway and the DNS server of this network',why:'Guess them and the install still finishes. The server then cannot reach anything outside its own network, or cannot find anything by name.',done:W=>W.seen.route&&W.seen.dns,h:['Your laptop is already on this network. Open the Terminal and ask it for its default route and its nameserver.','ip route      then      cat /etc/resolv.conf']},
  {t:'Choose a free address for the server and reserve it',why:'Two machines on one address knock each other off the network at random moments. That fault is very hard to trace afterwards.',done:W=>W.seen['pingfree:192.168.0.201']&&W.inst.reserved==='201',h:['Open the IP register on your laptop and find the block kept for Proxmox nodes. Ping your candidate from the Terminal, then reserve it in the register.','Terminal: ping 192.168.0.201 > IP register: Reserve next to 192.168.0.201']},
  {t:'Check the planning sheet and have it reviewed',why:'In the server room you have no register and no time to think. Everything you will type there is decided at your desk first.',done:W=>planOK(W.inst)&&!!W.inst.rev&&!W.inst.rev.length,h:['What you found is already noted on the sheet. Open Planning sheet, check the four lines, and ask a colleague to review it.','pve1.lab.local · 192.168.0.201/24 · 192.168.0.1 · 192.168.0.10']},
  {t:'Download the Proxmox VE installer to your laptop',why:'The server has nothing on it. There are several Proxmox products. The wrong image installs a different product.',done:W=>W.inst.files.includes(PROD.ve.file),h:['Open the Browser on your laptop and go to the Proxmox downloads page.','Browser > type proxmox.com/en/downloads > Download next to Proxmox VE']},
  {t:'Get the installer ready to start the server from',why:'Copying the ISO file onto a stick is not enough. A server can only start from a stick written with a flashing tool, or from an image attached through its management port.',done:W=>W.inst.usbImg==='ve'||W.inst.vmedia==='ve'||W.inst.booted,h:['Two real ways. By hand: plug the stick into your laptop and use USB Writer. Remotely: cable the server\'s MGT port, open its management page in the Browser and attach the image as virtual media.','USB Writer > select proxmox-ve_9.2-1.iso > Flash      or      Browser > 192.168.0.142 > Virtual media > Attach']},
  {t:'Mount the server in the rack and give it power from both feeds',why:'Two power supplies on the same feed protect against nothing: when that feed fails, both go dark. One on A and one on B keeps the server running.',done:W=>W.inst.rack.mounted&&dualOK(W.inst),h:['Go to the server room. Open the box, drag the rail kit into the free space, then drag the server onto the rails. Take a power cord and drag from each power supply to a free outlet.','Open box > drag rail kit to a free space > drag server onto it > Power cord > drag PSU1 to A3 > drag PSU2 to B3']},
  {t:'Cable the first network port to a server port on the switch',why:'The installer puts the address on the first port, eno1. With the cable in eno2, in a guest port or in a switched-off port, the install looks fine and the server is unreachable.',done:W=>linkOK(W.inst),h:['The IP register also lists what each switch port is for. Take a network cable and drag from eno1 to a free server port.','Network cable > drag eno1 to port 2 on the switch (ge-0/0/2)']},
  {t:'Connect a screen, then switch on virtualization in the BIOS',why:'Skip this and Proxmox installs fine, but every VM later fails to start. It is far easier to set now than to come back to the rack.',done:W=>W.inst.vt,h:['Bring in the console trolley, take a screen lead and drag from the server\'s SCR port to it. Press the power button, and press F2 when it offers Setup. From your desk the same works through the management page: find its address under DHCP leases in the IP register.','Add > Console trolley > Screen lead > drag SCR to trolley > Power button > Press F2 > Enable Virtualization Technology > Save and exit']},
  {t:'Start the server from the USB stick, into the graphical installer',why:'Left alone, the server tries its empty disks and stops with "No bootable device".',done:W=>W.inst.booted,h:['Click the USB port on the server to plug the stick in, start it, and press F11 for the boot menu. With virtual media, pick the Virtual CD instead.','USB port > Power on > Press F11 > UEFI: USB storage device > Install Proxmox VE (Graphical) > I agree']},
  {t:'Put the system on the two 480 GB SSDs as a mirror',why:'On a single disk, one dead disk means a dead server. And if the system takes the big disks, there is nothing left for VM storage.',done:mirrorOK,h:['On the first installer screen, change the filesystem, then pick the two small disks.','Filesystem: zfs (RAID1) · Harddisk 0: /dev/sda · Harddisk 1: /dev/sdb']},
  {t:'Enter the name and network settings from your planning sheet',why:'These are very hard to change once the server is in a cluster. A wrong address means you cannot reach the server at all after the install.',done:netOK,h:['The network screen is the fourth one. Your planning sheet is shown on the left. Copy the four values exactly.','Hostname pve1.lab.local · IP 192.168.0.201/24 · Gateway 192.168.0.1 · DNS 192.168.0.10']},
  {t:'Finish the install and start the server from its own disks',why:'If the stick stays in, the server starts the installer again, because USB comes first in its boot order.',done:W=>W.inst.done,h:['Press Install, then take the stick out, or detach the virtual media, before you reboot.','Install > click the USB port to unplug > Reboot > Wait']},
  {t:'Log in from your laptop',why:'From now on nobody stands at the server. Everything is done remotely, so remote login must work before you leave it.',done:W=>W.seen.loggedin,h:['Back at your desk, open the Terminal. Use the address and password you typed in the installer. No answer? Think physical first: which port is the cable in, at both ends?','Your desk > Terminal > ssh root@192.168.0.201']},
  {t:'Confirm the server carries the name you gave it',why:'The name on the prompt is what every later command and every colleague will rely on.',done:W=>W.seen.host,h:['Ask the server for its name.','hostname']},
  {t:'Open the web interface of the server and log in',why:'Most daily work on Proxmox happens in this page: VMs, storage, backups. If it does not open from your desk now, it will not open when you need it.',done:W=>!!W.seen.gui,h:['After it started, the screen of the server itself showed the address to use. Type all of it in the Browser on your laptop, port included. The user is the one whose password you chose in the installer.','Browser > https://192.168.0.201:8006 > Advanced > Proceed > User name root, your password, Realm Linux PAM > Login']},
  {t:'Find the bridge the installer made, in the web interface',why:'Your address is not on eno1. The installer put it on vmbr0, a switch made of software inside the server. Every VM you make later plugs into that bridge. Skip this and you will look for the address on the wrong line when the network breaks.',done:W=>!!W.seen.guinet,h:['The network of a server belongs to the server, not to the Datacenter. Click the name of your server in the tree on the left and look under System.','Browser > log in > OK > click your server in the tree (under Datacenter) > System: Network. Read the vmbr0 line.']}],
 take:['Gateway and DNS are looked up, never guessed. The address is chosen, pinged and reserved.','Rack, two power feeds, first network port, then software.','Download the right ISO, flash it to a stick, boot the server from the stick.','A server has no name until the installer gives it one.','The web interface lives on https, port 8006. Root logs in with the realm Linux PAM.','Your address lives on the bridge vmbr0, not on eno1. VMs plug into that bridge.']},
{id:'switch',g:'Build',t:'Set up a new switch',story:'The rack at site west has one switch, sw-west-01. A second one was ordered so the servers get a second path. It lies on the storeroom shelf: a Juniper EX2300-C-12T, factory fresh, with its own power cord.<br><br>A new switch has no name, no address and no password. It cannot be reached over the network yet. The only way in is the CON port.<br><br>The boxed server on the floor is a job for another day. Leave it.',
 learn:['§Day zero: why the console cable','A factory-fresh switch has <b>no address</b>. You cannot ssh to it. You plug a <b>console cable</b> into its CON port and type on it directly.','Its prompt says <b>Amnesiac</b>: it remembers nothing. The user is <code>root</code>, with no password yet.','§Junos works in two modes','<b>Operational mode</b>, prompt <code>&gt;</code>: you look. <code>show</code> commands live here.','<b>Configuration mode</b>, prompt <code>#</code>: you change. You get there with <code>configure</code>.','Changes go into a <b>candidate</b>. Nothing happens until you <code>commit</code>. Then all of it becomes active at once.','<code>show | compare</code> shows what your commit would change. Look before you commit.','§Lost? Ask the switch','Type <code>?</code> anywhere on a line. Junos lists what can come next, without running anything.','<b>Tab</b> or <b>space</b> finishes a word you started. <code>conf</code> becomes <code>configure</code>.','§What every new switch gets','A <b>root password</b>. Junos refuses the first commit without one.','A <b>name</b>, so you always see which switch you are typing on.','A <b>management address</b> on the me0 port, with the prefix of the network behind it.','The <b>VLANs</b> its neighbours use. A VLAN is a separate network inside the switch. Same number on both switches, or the traffic does not pass.','The <b>ssh service</b>, switched on. Until then nothing listens and your desk gets <b>Connection refused</b>.','A <b>user of your own</b>. Junos refuses a root password over ssh. And a shared root tells nobody who changed what.','§Ports belong to a VLAN','Every port of a new switch sits in VLAN 1, <b>default</b>. Plug a server in and it talks to nobody in the servers network, with the link light on.','You move a port by hand: <code>set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members servers</code>.','A server port is an <b>access port</b>: exactly one VLAN. <code>show vlans</code> lists the ports under each VLAN. A star means a cable with a live device is in it.','§The uplink: one cable, many VLANs','Two switches share their VLANs over a <b>trunk</b>. A trunk port puts a <b>tag</b> with the VLAN number on every frame. One cable carries many networks.','<b>Both ends</b> must be trunks, and both must list the VLAN. One end wrong: the lights are on and nothing passes.','The proof is the <b>MAC table</b>. <code>show ethernet-switching table</code> lists the devices the switch hears, per VLAN and per port. Nothing listed means nothing comes through.','§The safety net: commit confirmed','<code>commit confirmed</code> makes your change active <b>on trial</b>. A plain <code>commit</code> within 10 minutes keeps it.','No plain commit in time? The switch puts the old configuration back <b>by itself</b>. Locked out from far away: wait, and the door opens again.','<code>commit confirmed 2</code> sets the trial to 2 minutes. In this lab one Junos minute takes 15 seconds.'],
 cmds:[['?','what can I type here?'],['root','the login on a factory-fresh switch'],['cli','from the shell (%) into Junos (&gt;)'],['configure','into configuration mode (#)'],['set ...','add a line to the candidate'],['delete ...','take a line out of the candidate'],['show | compare','what would this commit change?'],['commit','make the candidate active'],['commit confirmed 2','active on trial. No plain commit within 2 minutes: undone'],['show vlans','VLANs on this switch, with their numbers and ports'],['set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members &lt;vlan&gt;','put a port in a VLAN'],['set interfaces ge-0/0/11 unit 0 family ethernet-switching interface-mode trunk','make a port a trunk'],['show ethernet-switching table','which devices does the switch hear, and on which port?'],['ssh &lt;user&gt;@&lt;ip&gt;','from your desk, once the switch allows it']],
 setup:()=>world({inst:true}),
 obj:[{t:'Find the name and the management address kept for the new switch',why:'Pick an address yourself and one day two devices share it. On a switch that takes the management of a whole rack offline.',done:W=>W.seen.ipam&&W.seen['pingfree:192.168.0.3'],h:['The IP register on your laptop lists switches too. Ping the address from the Terminal to be sure nothing uses it.','IP register > read the sw-west-02 line > Terminal: ping 192.168.0.3']},
  {t:'Carry the new switch in and screw it into a free rack space',why:'A switch left on the floor gets kicked, and its cables pull on the ports. A switch has ears, not rails: it is screwed straight into the rack.',done:W=>W.inst.rack.devs.some(d=>d.type==='sw'&&d.slot!=null),h:['Go to the server room. The Add menu above the rack is the storeroom shelf. Drag the switch into a free space.','Server room > Add > EX2300-C-12T > drag it into a free space in the rack']},
  {t:'Give the switch power',why:'A switch has no power button. It starts by itself as soon as it gets power, and it stops the moment the cord comes out.',done:W=>W.inst.rack.devs.some(d=>d.type==='sw'&&jpow(W.inst,d)),h:['Take the power cord and drag from the small power inlet at the right of the switch to a free outlet on a feed.','Power cord > drag the inlet of the new switch to outlet A3']},
  {t:'Open a console on the new switch, log in and start the Junos CLI',why:'Without an address there is no ssh. The console cable is the only door, and it stays your way back in whenever the network is broken.',done:W=>W.inst.rack.devs.some(d=>d.j&&d.j.cli),h:['Bring your laptop in through the Add menu. Take a console cable and drag from the CON port of the new switch to your laptop. The console appears on the left. The login is root.','Add > Your laptop > Console cable > drag CON of the new switch to the laptop > type root > type cli']},
  {t:'Set a root password and commit',why:'Junos refuses to commit anything at all until root has a password. A switch without one would be open to anyone with a cable.',done:W=>W.inst.rack.devs.some(d=>d.j&&d.j.act['system root-authentication']),h:['Go into configuration mode. Type set system ? and read what the switch offers. The password is typed twice and stays invisible. Then commit.','configure > set system root-authentication plain-text-password > type a password twice > commit']},
  {t:'Name the switch sw-west-02',why:'With two switches in one rack, the name on the prompt is the only thing that tells you which one you are about to change.',done:W=>W.inst.rack.devs.some(d=>d.j&&jhost(d.j.act)==='sw-west-02'),h:['The name lives under system. Set it, then commit. Watch the prompt change.','set system host-name sw-west-02 > commit']},
  {t:'Put the management address on me0',why:'Leave the prefix off and Junos accepts it, as a /32: an address with no network around it. The commit works and the switch still answers nobody.',done:W=>W.inst.rack.devs.some(d=>d.j&&jaddrs(d.j.act,'me0').join()==='192.168.0.3/24'),h:['The address goes on unit 0 of me0, family inet, with /24 behind it. A second set does not replace a wrong address, it adds one. Use show to check and delete to remove.','set interfaces me0 unit 0 family inet address 192.168.0.3/24 > show | compare > commit']},
  {t:'Create the servers VLAN with the same number as on sw-west-01',why:'A VLAN name is only a label. The number travels on the wire. A different number on the new switch and the servers behind it reach nothing.',done:W=>W.inst.rack.devs.some(d=>d.j&&jvlans(d.j.act).some(v=>v[0]==='servers'&&v[1]==='20')),h:['Ask the switch that already works. Move the console cable to the CON port of sw-west-01 and look at its VLANs. Then move it back.','Hands: click the cable end to pull it > Console cable > CON of sw-west-01 to laptop > show vlans > move the cable back > set vlans servers vlan-id 20 > commit']},
  {t:'Switch on ssh and give yourself a user on the switch',why:'Out of the box nothing listens for ssh, and Junos refuses a root password over the network. Skip this and every change stays a walk to the rack with a cable.',done:W=>W.inst.rack.devs.some(d=>d.j&&jsshon(d.j.act)&&jusers(d.j.act).some(u=>jucls(d.j.act,u)==='super-user'&&jupw(d.j.act,u))),h:['Both live under system. Ask the switch: set system services ? and set system login user ? and keep asking. A user needs a class and a password. Pick the class that may change things.','set system services ssh > set system login user kaatje class super-user authentication plain-text-password > type a password twice > commit']},
  {t:'Cable me0 to the server network and reach the switch from your desk',why:'From now on nobody walks to the rack with a cable for every change. If it does not answer from your desk, it is not finished.',done:W=>W.seen['ping:192.168.0.3'],h:['Take a network cable and drag from the MGT port of the new switch to a free server port on sw-west-01. The register lists which ports those are. Then walk back to your desk.','Network cable > drag MGT of the new switch to port 2 of sw-west-01 > Your desk > Terminal > ping 192.168.0.3']},
  {t:'Log in to the switch from your desk, as yourself',why:'A login you never tried is a login you do not have. Try it now, while the console cable is still within reach.',done:W=>W.seen.swssh,h:['In the Terminal at your desk: ssh, with your own user name in front of the address. Root will not get in this way.','Your desk > Terminal > ssh kaatje@192.168.0.3 > yes > your password']},
  {t:'Lock yourself out on purpose, and let commit confirmed bring the switch back',why:'One wrong line on a switch far away and you are cut off. After a plain commit somebody drives to the site with a console cable. After commit confirmed the switch undoes the change by itself.',done:W=>W.seen.jsaved,h:['In your ssh session at the desk: take the address off me0 and use commit confirmed 1 instead of commit. Your session dies. Keep pinging the switch. One Junos minute takes 15 seconds here.','ssh kaatje@192.168.0.3 > configure > delete interfaces me0 > commit confirmed 1 > ping 192.168.0.3 > wait > ping 192.168.0.3 until it answers again']},
  {t:'Set the time zone from your desk with commit confirmed, and confirm in time',why:'A switch on the wrong clock writes its logs with the wrong time. And a change you forget to confirm is gone a few minutes later, without a word at your desk.',done:W=>W.seen.jconf&&W.inst.rack.devs.some(d=>d.j&&!d.j.cc&&d.j.act['system time-zone']),h:['Log in again from your desk. The time zone lives under system. Use commit confirmed, check that the switch still answers you, then a plain commit before the time is up.','ssh kaatje@192.168.0.3 > configure > set system time-zone Europe/Brussels > commit confirmed > run show version > commit']},
  {t:'Put ports ge-0/0/0 and ge-0/0/1 in the servers VLAN, from your desk',why:'These two ports are for the second network cable of the servers. Leave them in VLAN 1 and the cable clicks in, the light goes on, and the server reaches nothing over it.',done:W=>W.inst.rack.devs.some(d=>d.j&&jacc(d.j,['ge-0/0/0','ge-0/0/1'],'20')),h:['In your ssh session: look at run show vlans first. Then build the line word by word with ? after set interfaces ge-0/0/0 unit 0 family. One line per port. Look again before you confirm.','ssh kaatje@192.168.0.3 > configure > set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members servers > the same line for ge-0/0/1 > commit confirmed > run show vlans > commit']},
  {t:'Build the uplink to sw-west-01 and prove the servers VLAN comes through',why:'Until now the new switch is an island. Its ports sit in the servers VLAN, and that VLAN goes nowhere. A server plugged in here would find no gateway and no storage, with every light green.',done:W=>W.seen.jmac&&W.inst.rack.devs.some(d=>d.j&&!d.j.cc&&jpow(W.inst,d)&&jupl(W.inst,d)),h:['The IP register says which port of sw-west-01 waits for the new switch, and what kind of port it is. Cable it in the server room. Make your end the same kind from your desk, with servers as member. Then ask the switch which devices it hears.','Server room > Network cable > drag port 11 of the new switch to port 11 of sw-west-01 > Your desk > ssh kaatje@192.168.0.3 > configure > set interfaces ge-0/0/11 unit 0 family ethernet-switching interface-mode trunk vlan members servers > commit confirmed > run show ethernet-switching table > commit']}],
 take:['A new switch has no address. The first visit is always over the console cable.','Junos: configure, set, show | compare, commit. Nothing is active before the commit.','No root password, no commit.','An address without its prefix becomes a /32 and reaches nobody.','A VLAN is its number, not its name.','A port sits in VLAN 1 until you move it. A server port carries one VLAN.','Switch to switch is a trunk, with the VLAN listed on both ends. The MAC table is the proof.','ssh is off until you set it. Root stays on the console. Over the network you log in as yourself.','Changing a switch from far away: commit confirmed, check that you still get in, then commit.']},
{id:'ready',g:'Build',t:'Is this server ready?',story:'Three Proxmox servers were installed yesterday at site west. In the installer they were named pve1, pve2 and pve3, with the addresses 192.168.0.201, .202 and .203. Before anything is clustered, log in to the first one and check it. You only look in this scenario. Nothing can break.',
 learn:['A server must be healthy <b>before</b> it joins a cluster: right name, right version, reachable.','Commands that only read are always safe to run.'],
 cmds:[['ssh root@&lt;ip&gt;','log in to a server from your laptop'],['hostname','the name of the server you are on'],['pveversion','which Proxmox version runs here'],['pvecm status','the state of the cluster, if there is one'],['ping &lt;ip&gt;','can I reach that machine?']],
 setup:()=>world({}),
 obj:[{t:'Log in to the server at 192.168.0.201',why:'You are at your laptop. Proxmox commands only exist on the servers, so nothing works until you are logged in to one.',done:W=>W.seen.loggedin,h:['Use ssh, as root, with the address.','ssh root@192.168.0.201']},{t:'Confirm which server you are on',why:'Every cluster command acts on the server you type it on. Typing the right command on the wrong server is the classic mistake.',done:W=>W.seen.host,h:['Ask the server for its name.','hostname']},
  {t:'Check the Proxmox version',why:'Nodes with different versions can behave oddly together. You want the same version everywhere before clustering.',done:W=>sn(W)['ver@pve1'],h:['There is one command that prints the version.','pveversion']},
  {t:'Prove this server is not in a cluster yet',why:'If it already belonged to a cluster, creating a new one would be refused. The error you get here is the proof.',done:W=>W.seen.nocluster,h:['Ask for the cluster status. You will get a red error, and that error is the correct result: it says there is no cluster here.','pvecm status']},
  {t:'Check that pve2 (192.168.0.202) answers',why:'Nodes that cannot reach each other can never form a cluster. Test the network before you blame Proxmox.',done:W=>sn(W)['ping:192.168.0.202'],h:['Send a few test packets to its address.','ping 192.168.0.202']}],
 take:['Look before you change: name, version, cluster state, network.','An error can be the answer you were looking for.']},
{id:'create',g:'Build',t:'Create the cluster',story:'All three servers checked out. Create a cluster called <b>west</b> on pve1. The other two join in the next scenario.',
 learn:['Start by logging in to pve1: <code>ssh root@192.168.0.201</code>.','A cluster starts on <b>one</b> node. That node creates it, the others join later.','Creating the cluster also creates its <b>certificate authority</b>, the stamp that will sign a certificate for every node.','A cluster of one node is already quorate: one vote of one.'],
 cmds:[['pvecm create &lt;name&gt;','create a new cluster on this node'],['pvecm status','state of the cluster and its votes'],['pvecm nodes','short list of members']],
 setup:()=>world({}),

const hist=[];let hi=null;

function hooks(c,res,raw){
 if(/^hostname$/.test(raw.trim())&&W.host!=='laptop')W.seen.host=1;
 if(/^pvecm status$/.test(raw.trim())&&res.err&&/does not exist/.test(res.err))W.seen.nocluster=1;
 if(/^pvesm status$/.test(raw.trim())&&W.host==='pve4')W.seen.pvesm4=1;
 if(cur.id==='dies'&&W.seen.noq&&W.nodes.pve2.up&&/^pvecm status$/.test(raw.trim())&&!res.err)W.seen['status:2:q:after']=1;
 if(cur.id==='bkb'&&W.seen['bk:101:backup-b:snapshot']&&/^pvesm list backup-b$/.test(raw.trim()))W.seen['list:backup-b:after']=1;
}
function run(raw){
 const before=objIndex();
 const l=raw.replace(/\s+/g,' ').trim();
 let res;
 if(W.jssh&&!W.prompt){
  const s=W.jssh,hid=/^pw/.test(s.m);
  if(!swAt(W,s.ip)){line('in',`<span class="ok">${esc(ps1())}</span> ${hid?'':esc(raw)}`);line('err','client_loop: send disconnect: Broken pipe');W.jssh=null}
  else{
   if(!hid&&l&&hist[hist.length-1]!==l)hist.push(l);
   const o=jsw(s,()=>jx(W.inst,s.d,raw)).o,end=s.m==='login'||s.m==='off',cut=!swAt(W,s.ip);
   if(cut){const ls=o.split('\n'),k=ls.findIndex(x=>raw&&x.slice(-raw.length)===raw);line('',esc(ls.slice(0,k+1).join('\n')));line('err','client_loop: send disconnect: Broken pipe');W.jssh=null}
   else line('',esc((end?o.split('\n')[0]:o).replace(/\n$/,'')));
   if(end&&!cut){W.jssh=null;line('','Connection to '+s.ip+' closed.')}
  }
  W.t+=2;after(before);return;
 }
 if(W.prompt){line('in',esc(/pw$/.test(W.prompt.k)?'':l));res=answerPrompt(W,l,raw)}
 else{line('in',`<span class="ok">${ps1()}</span> ${esc(l)}`);if(!l){ $('ps1').textContent=ps1();return}if(hist[hist.length-1]!==l)hist.push(l);res=exec(W,l);hooks(l.split(' ')[0],res,l);W.t+=2}
 if(res.clear)$('term').innerHTML='';
 if(res.out)line('',esc(res.out));

 after(before);
}

 renderAll();
}

const WORDS=['hostname','pveversion','pvecm','pvesm','qm','vzdump','qmrestore','ha-manager','ssh','ping','exit','clear','help','openssl','ls','date','ip'];
const SUB={pvecm:['status','nodes','create','add','expected'],pvesm:['status','add','list','remove'],qm:['list','config','start','stop','destroy','migrate','disk'],'ha-manager':['status','add']};
function complete(v){
 const parts=v.split(' '),last=parts[parts.length-1];let pool=[];
 if(parts.length===1)pool=WORDS;else if(parts.length===2&&SUB[parts[0]])pool=SUB[parts[0]];
 else pool=Object.keys(W.nodes).concat(Object.keys(W.storages),Object.keys(W.vms).map(String),['--server','--export','--content','--storage','--mode','--online','snapshot','images','backup','nfs','move','root@','/etc/pve/nodes/','-in','-noout','-subject','-issuer'],Object.values(IPS),Object.keys(NAS),[].concat(...Object.entries(W.backups).map(([s,l])=>l.map(b=>s+':backup/'+b.file))));
 const hit=pool.filter(x=>x.startsWith(last)&&x!==last);if(!last||!hit.length)return v;
 let pre=hit[0];hit.forEach(h=>{while(!h.startsWith(pre))pre=pre.slice(0,-1)});
 if(hit.length>1&&pre===last){line('sys',hit.join('   '));return v}
 parts[parts.length-1]=pre+(hit.length===1&&!/[:\/@]$/.test(pre)?' ':'');return parts.join(' ');
}
