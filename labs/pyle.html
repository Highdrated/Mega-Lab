<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PYLE // VERDANT OPS</title>
<style>
  :root {
    --bg: #06090f;
    --text: #cdd6e4;
    --dim: #5c6b84;
    --ghost: #38445c;
    --line: #16223a;
    --edge: #1e3050;
    --amber: #e8a33d;
    --green: #6fd0f0;
    --cyan: #6fd0f0;
    --blue: #4f8fd0;
    --red: #e0685e;
    --panel: rgba(9, 14, 24, 0.86);
    --consoleBg: rgba(6, 10, 18, 0.9);
    --edge2: #24506a;
    --track: #0e1626;
    --strc: #a9cbe8;
    --tdim: #3c4a64;
    --taskc: #ecd8ac;
    --gnlc: #1c2840;
    --scan: rgba(0, 0, 0, 0.14);
    --ft1: #131d2a; --ft2: #111927; --fstroke: #1c2836; --fdock: #14283a; --fdry: #3a2c14; --ffield: #070d16;
  }
  body[data-theme="paper"] {
    --bg: #efe8da;
    --text: #3c4148;
    --dim: #8a8474;
    --ghost: #c6bca6;
    --line: #ddd2bc;
    --edge: #c9bda2;
    --amber: #a86a1a;
    --green: #2a6a9a;
    --cyan: #2a6a9a;
    --blue: #4a7ab0;
    --red: #b0402f;
    --panel: rgba(246, 240, 228, 0.92);
    --consoleBg: rgba(251, 247, 238, 0.95);
    --edge2: #a8c2d4;
    --track: #e0d6c0;
    --strc: #2a6a4a;
    --tdim: #b0a890;
    --taskc: #7a5a20;
    --gnlc: #d8cdb4;
    --scan: rgba(90, 70, 40, 0.05);
    --ft1: #ddd2b8; --ft2: #d5c9ac; --fstroke: #c2b494; --fdock: #b4c6d6; --fdry: #cc9c4c; --ffield: #ece4d2;
  }
  body[data-theme="paper"] { background: linear-gradient(180deg, #e6ddc9 0%, #efe8da 40%, #ece2ce 100%); }
  body[data-theme="paper"] #stars { display: none; }
  body[data-theme="paper"] .planetglow { background: radial-gradient(ellipse at 50% 100%, rgba(200,150,80,0.14) 0%, transparent 70%); }
  body[data-theme="ember"] {
    --bg: #131010;
    --text: #cfc4b4;
    --dim: #776c5c;
    --ghost: #4a4136;
    --line: #2a231c;
    --edge: #3a3024;
    --amber: #e0a050;
    --green: #d0a468;
    --cyan: #d0a468;
    --blue: #9a8ea0;
    --red: #d0685a;
    --panel: rgba(22, 18, 15, 0.88);
    --consoleBg: rgba(16, 13, 11, 0.92);
    --edge2: #5a4830;
    --track: #241d16;
    --strc: #c8b088;
    --tdim: #5a5044;
    --taskc: #e0ca9c;
    --gnlc: #322a20;
    --scan: rgba(0, 0, 0, 0.16);
    --ft1: #1e1813; --ft2: #1a1510; --fstroke: #2e261c; --fdock: #2a2e36; --fdry: #4a3418; --ffield: #14100c;
  }
  body[data-theme="ember"] { background: radial-gradient(ellipse at 50% 115%, #2e1c10 0%, #1c1410 40%, #100d0b 75%, #0a0808 100%); }
  body[data-theme="ember"] .planetglow { background: radial-gradient(ellipse at 50% 100%, rgba(224,160,80,0.10) 0%, transparent 70%); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #241610 0%, #12101a 34%, #080b14 62%, #04060b 100%);
    color: var(--text);
    font-family: "Consolas", "JetBrains Mono", "Menlo", monospace;
    min-height: 100vh;
    overflow: hidden;
  }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .planetglow {
    position: fixed; left: 50%; bottom: -42vh;
    width: 160vw; height: 60vh;
    transform: translateX(-50%);
    border-radius: 50% 50% 0 0;
    background: radial-gradient(ellipse at 50% 100%, rgba(232,163,61,0.16) 0%, rgba(200,110,50,0.07) 45%, transparent 75%);
    pointer-events: none; z-index: 0;
  }
  /* ---------- frame ---------- */
  .deck {
    position: relative; z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-rows: 40px minmax(0, 1fr);
    grid-template-columns: 252px minmax(0, 1fr) 252px;
    grid-template-areas: "top top top" "nav console tele";
    gap: 12px;
    padding: 12px 14px 14px;
    width: 100%;
  }
  @media (min-width: 1700px) {
    .deck { grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 16px; padding: 16px 20px 18px; }
    .main, #cmd { font-size: 15px; }
    .gcode { font-size: 15.5px; }
  }
  @media (min-width: 2200px) {
    .deck { grid-template-columns: 360px minmax(0, 1fr) 360px; gap: 20px; padding: 20px 26px 22px; }
    .main, #cmd { font-size: 16.5px; }
    .gcode { font-size: 17px; }
    .navbody, .form-entry { font-size: 12.5px; }
    .syslog { font-size: 12px; }
    .flow-stats { font-size: 12.5px; }
    .topbar { font-size: 12px; }
    .fieldwrap svg { max-width: 720px; }
  }
  .topbar {
    grid-area: top;
    display: flex; align-items: center; gap: 18px;
    background: var(--panel);
    border: 1px solid var(--edge);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    padding: 0 18px;
    font-size: 10.5px; letter-spacing: 2px; color: var(--dim);
    white-space: nowrap; overflow: hidden;
  }
  .topbar .sig { color: var(--cyan); letter-spacing: 4px; }
  .topbar .sub { color: var(--tdim); }
  .topbar .mode { color: var(--amber); }
  .topbar .right { margin-left: auto; display: flex; gap: 16px; }
  .qbtn {
    font: inherit; font-size: 9.5px; letter-spacing: 2px;
    background: transparent; color: var(--cyan);
    border: 1px solid var(--edge2); padding: 2px 10px; cursor: pointer;
  }
  .qbtn:hover { background: var(--track); color: var(--text); }
  .topbar .clock { color: var(--text); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--edge);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    display: flex; flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .panel.nav { grid-area: nav; }
  .panel.tele { grid-area: tele; }
  .ptitle {
    font-size: 9px; letter-spacing: 3px; color: var(--dim);
    padding: 9px 12px 8px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .ptitle .tick { width: 8px; height: 1px; background: var(--cyan); box-shadow: 4px -3px 0 -0px var(--cyan); }
  .ptitle .stat { margin-left: auto; color: var(--cyan); letter-spacing: 1px; }
  /* ---------- nav (left) ---------- */
  .navbody { flex: 1; overflow-y: auto; padding: 8px 10px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; min-height: 0; }
  .navbody::-webkit-scrollbar { width: 4px; }
  .navbody::-webkit-scrollbar-thumb { background: var(--line); }
  .navrow {
    width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent;
    color: var(--text); font: inherit; cursor: pointer;
    padding: 6px 8px; margin-bottom: 3px;
    display: block;
  }
  .navrow:hover { border-color: var(--edge); background: rgba(111,208,240,0.04); }
  .navrow .nr-top { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1px; }
  .navrow .nr-name { color: var(--text); }
  .navrow .nr-count { color: var(--dim); font-size: 10px; }
  .navrow.done .nr-name { color: var(--cyan); }
  .navbar { height: 3px; background: var(--track); margin-top: 5px; overflow: hidden; }
  .navbar i { display: block; height: 100%; background: var(--cyan); width: 0%; transition: width 0.4s ease; }
  .navrow.mode-row .navbar i { background: var(--amber); }
  .nav-sep { font-size: 9px; letter-spacing: 3px; color: var(--tdim); margin: 10px 2px 5px; border-top: 1px solid var(--line); padding-top: 8px; }
  /* codex */
  .form-entry { padding: 3px 0 3px 9px; border-left: 1px solid var(--edge); margin-bottom: 2px; cursor: pointer; font-size: 11px; }
  .form-entry:hover { border-left-color: var(--cyan); }
  .form-entry .syn { color: var(--strc); white-space: pre-wrap; word-break: break-all; }
  .form-entry .lbl { color: var(--dim); font-size: 9.5px; letter-spacing: 1px; }
  .form-group { color: var(--amber); font-size: 9px; letter-spacing: 2px; margin: 8px 0 3px; }
  .scroll-empty { color: var(--ghost); font-size: 11px; padding: 4px 2px; line-height: 1.5; }
  /* ---------- telemetry (right) ---------- */
  .telebody { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .teletop { padding: 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .chi-label { font-size: 9px; letter-spacing: 2px; color: var(--dim); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .chi-label b { color: var(--cyan); font-weight: normal; }
  .chi-bar { height: 5px; background: var(--track); border: 1px solid var(--line); overflow: hidden; }
  .chi-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--edge2), var(--cyan)); transition: width 0.4s ease; }
  .flow-stats { font-size: 11px; color: var(--dim); line-height: 1.85; margin-top: 10px; }
  .flow-stats b { color: var(--text); font-weight: normal; float: right; }
  .theme-row { display: flex; align-items: center; gap: 5px; margin-top: 12px; }
  .theme-row .tr-lbl { font-size: 9px; letter-spacing: 2px; color: var(--tdim); margin-right: 2px; }
  .theme-row button {
    font: inherit; font-size: 10px; letter-spacing: 1px;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); padding: 2px 7px; cursor: pointer;
  }
  .theme-row button:hover { border-color: var(--edge2); color: var(--text); }
  .theme-row button.on { color: var(--cyan); border-color: var(--edge2); background: var(--track); }
  .logwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .syslog {
    flex: 1; overflow-y: auto;
    padding: 8px 12px;
    font-size: 10.5px; line-height: 1.6;
    color: var(--dim);
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .syslog::-webkit-scrollbar { width: 4px; }
  .syslog::-webkit-scrollbar-thumb { background: var(--line); }
  .syslog .t { color: var(--tdim); }
  .syslog .ok { color: var(--cyan); }
  .syslog .warn { color: var(--amber); }
  .syslog .err { color: var(--red); }
  /* ---------- console (center) ---------- */
  .console {
    grid-area: console;
    position: relative;
    background: var(--consoleBg);
    border: 1px solid var(--edge);
    display: flex; flex-direction: column;
    padding: 12px 16px 10px;
    min-height: 0;
  }
  .console::before, .console::after,
  .corner-b::before, .corner-b::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border-color: var(--cyan); border-style: solid; opacity: 0.7;
  }
  .console::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .console::after { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
  .corner-b::before { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
  .corner-b::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
  .scan {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px);
  }
  .statusbar {
    display: flex; gap: 14px; align-items: baseline;
    font-size: 10.5px; letter-spacing: 1px;
    color: var(--dim);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px; margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .statusbar .name { color: var(--cyan); letter-spacing: 3px; }
  .statusbar .mode { color: var(--amber); }
  .statusbar .right { margin-left: auto; }
  .main {
    flex: 1; overflow-y: auto;
    font-size: 14px; line-height: 1.62;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    padding-right: 4px;
    min-height: 0;
  }
  .main::-webkit-scrollbar { width: 5px; }
  .main::-webkit-scrollbar-thumb { background: var(--line); }
  .row { white-space: pre-wrap; word-break: break-word; }
  .row.echo { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
  .c-dim { color: var(--dim); }
  .c-amber { color: var(--amber); }
  .c-green { color: var(--cyan); }
  .c-blue { color: var(--blue); }
  .c-red { color: var(--red); }
  .task { border-left: 2px solid var(--amber); padding: 5px 10px; margin: 12px 0 6px; color: var(--taskc); }
  .chipline { margin: 2px 0 6px; }
  .chip {
    display: inline-block; font-size: 10px; letter-spacing: 2px;
    color: var(--cyan); border: 1px solid var(--edge2); border-radius: 0;
    padding: 1px 8px; background: transparent;
  }
  .inputline { display: flex; align-items: baseline; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 6px; }
  .prompt { color: var(--cyan); flex-shrink: 0; }
  #cmd { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font: inherit; font-size: 13.5px; caret-color: var(--cyan); }
  /* ghost + field panes */
  .ghostpane { display: none; flex: 1; overflow-y: auto; padding-right: 4px; min-height: 0; }
  .ghostpane.on { display: block; }
  .ghosthead { font-size: 11px; color: var(--dim); letter-spacing: 1px; margin-bottom: 8px; }
  .ghosthead b { color: var(--amber); font-weight: normal; }
  .gcode { font-size: 14.5px; line-height: 1.75; white-space: pre; }
  .gc { color: var(--ghost); }
  .gc.done { color: var(--cyan); }
  .gc.done.str { color: var(--strc); }
  .gc.done.com { color: var(--dim); font-style: italic; }
  .gc.cur { background: rgba(232,163,61,0.35); color: #f4e2b8; }
  .gc.wrong { background: rgba(224,104,94,0.45); color: #ffd0c8; }
  .gnl { color: var(--gnlc); }
  .gnl.cur { background: rgba(232,163,61,0.35); }
  .gstats { margin-top: 10px; font-size: 12px; color: var(--dim); display: flex; gap: 18px; flex-wrap: wrap; }
  .gstats b { color: var(--text); font-weight: normal; }
  .fieldpane { display: none; }
  .fieldpane.on { display: block; }
  .fieldwrap { display: flex; justify-content: center; margin: 4px 0 8px; }
  .fieldwrap svg { width: 100%; max-width: 560px; height: auto; display: block; border: 1px solid var(--edge); background: var(--ffield); }
  .fhud { font-size: 11px; color: var(--dim); display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-bottom: 4px; }
  .fhud b { color: var(--amber); font-weight: normal; }
  .drone-g { transition: transform 0.35s ease; }
  @media (prefers-reduced-motion: reduce) { .drone-g { transition: none; } }
  /* ---------- academy (fullscreen reading) ---------- */
  .academy {
    position: fixed; inset: 0; z-index: 60;
    background: var(--bg);
    display: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .academy.on { display: block; }
  .ac-top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
    padding: 12px 18px;
    font-size: 11px; letter-spacing: 2px; color: var(--dim);
  }
  .ac-top .ac-name { color: var(--cyan); letter-spacing: 3px; }
  .ac-top .ac-ch { color: var(--amber); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-btn {
    font: inherit; font-size: 13px;
    background: transparent; color: var(--text);
    border: 1px solid var(--edge); padding: 8px 16px; cursor: pointer;
    min-height: 40px; min-width: 44px;
  }
  .ac-btn:hover { border-color: var(--edge2); }
  .ac-page {
    max-width: 720px; margin: 0 auto;
    padding: 30px 22px 90px;
    font-size: var(--acfs, 17px);
    line-height: 1.85;
    color: var(--text);
  }
  .ac-page h1 { font-size: 1.5em; letter-spacing: 1px; color: var(--cyan); margin: 10px 0 6px; font-weight: normal; }
  .ac-page h2 { font-size: 1.12em; color: var(--amber); margin: 34px 0 8px; font-weight: normal; letter-spacing: 0.5px; }
  .ac-page p { margin: 0 0 14px; }
  .ac-page .ac-sub { color: var(--dim); font-size: 0.85em; margin-bottom: 26px; }
  .ac-page code, .ac-code {
    font-family: inherit;
    background: var(--track);
    border: 1px solid var(--line);
    padding: 1px 7px;
    color: var(--strc);
  }
  .ac-code {
    display: block; white-space: pre-wrap;
    padding: 12px 16px; margin: 12px 0;
    line-height: 1.7;
  }
  .ac-out { display: block; white-space: pre-wrap; padding: 10px 16px; margin: -8px 0 14px; border: 1px dashed var(--edge); color: var(--text); font-size: 0.95em; }
  .ac-reveal {
    display: block; width: 100%;
    font: inherit; text-align: center;
    background: transparent; color: var(--amber);
    border: 1px dashed var(--edge2);
    padding: 12px; margin: -6px 0 14px;
    cursor: pointer; min-height: 46px;
  }
  .ac-reveal:hover { background: var(--track); }
  .ac-check { border: 1px solid var(--edge); padding: 16px 18px; margin: 16px 0; }
  .ac-check .ac-q { color: var(--amber); margin-bottom: 12px; }
  .ac-opt {
    display: block; width: 100%; text-align: left;
    font: inherit; background: transparent; color: var(--text);
    border: 1px solid var(--line); padding: 12px 14px; margin: 6px 0;
    cursor: pointer; min-height: 46px;
  }
  .ac-opt:hover { border-color: var(--edge2); }
  .ac-opt.right { border-color: var(--green); color: var(--green); }
  .ac-opt.wrong { border-color: var(--red); color: var(--red); }
  .ac-why { color: var(--dim); font-size: 0.9em; margin-top: 10px; display: none; }
  .ac-why.on { display: block; }
  .ac-end { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 24px; }
  .ac-card {
    display: block; width: 100%; text-align: left;
    font: inherit; background: transparent; color: var(--text);
    border: 1px solid var(--edge); padding: 18px; margin: 10px 0;
    cursor: pointer; min-height: 56px;
  }
  .ac-card:hover { border-color: var(--edge2); background: var(--track); }
  .ac-card .t1 { color: var(--cyan); }
  .ac-card .t2 { color: var(--dim); font-size: 0.85em; margin-top: 4px; }
  .ac-card.read .t1 { color: var(--green); }
  @media (max-width: 700px) { .ac-page { padding: 22px 16px 80px; } }
  /* ---------- responsive ---------- */
  @media (max-width: 1100px) {
    .deck {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: 36px auto minmax(0, 1fr) auto;
      grid-template-areas: "top" "nav" "console" "tele";
      padding: 8px; gap: 8px;
    }
    .panel.nav { max-height: 78px; }
    .panel.nav .ptitle, .panel.nav .nav-sep, .panel.nav #scrollList { display: none; }
    .navbody { display: flex; flex-direction: row; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 8px; }
    .navbody::-webkit-scrollbar { height: 4px; }
    #navList { display: flex; flex-direction: row; gap: 6px; }
    .navrow { min-width: 128px; flex-shrink: 0; margin-bottom: 0; border-color: var(--line); }
    .topbar .sub, .topbar .hide-sm { display: none; }
    .panel.tele { flex-direction: row; align-items: center; max-height: 64px; }
    .panel.tele .ptitle, .panel.tele .logwrap { display: none; }
    .teletop { border-bottom: none; padding: 8px 12px; width: 100%; }
    .flow-stats { display: flex; gap: 12px; line-height: 1.3; margin-top: 6px; flex-wrap: wrap; }
    .flow-stats b { float: none; margin-left: 4px; }
    .flow-stats span.hide-sm { display: none; }
    .main, #cmd { font-size: 12.5px; }
    .gcode { font-size: 12.5px; }
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="planetglow" aria-hidden="true"></div>

<div class="deck">
  <div class="topbar">
    <span class="sig">PYLE</span>
    <span class="sub">// AGRI-PLATFORM «VERDANT» · CRUSADER LOW CLOUD DECK</span>
    <span class="mode" id="modeLbl">BOOT</span>
    <span id="taskLbl"></span>
    <button class="qbtn" id="qbtn">QUESTS</button>
    <span class="right">
      <span class="hide-sm" id="userLbl">no operator</span>
      <span class="hide-sm" id="scoreLbl"></span>
      <span class="clock" id="clock">--:--:--</span>
    </span>
  </div>

  <aside class="panel nav">
    <div class="ptitle"><span class="tick"></span>TRAINING NAV<span class="stat" id="navStat"></span></div>
    <div class="navbody">
      <div id="navList"></div>
      <div class="nav-sep">CODEX · LEARNED FORMS</div>
      <div id="scrollList">
        <div class="scroll-empty">Codex empty. Forms you master in the drills are archived here — tap one to recall its lesson.</div>
      </div>
    </div>
  </aside>

  <main class="console corner-b">
    <div class="scan"></div>
    <div class="statusbar">
      <span class="name">CONSOLE</span>

function dayStr(off) {

      snd: sndOn,
      kata: kata

    localStorage.setItem(SAVE_KEY, JSON.stringify(d));

}
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.done) MODULES.forEach((m, mi) => m.drills.forEach((x, di) => { if (d.done[mi] && d.done[mi][di]) x.doneFlag = true; }));
    if (d.learned) d.learned.forEach(e => learned.push({ group: e[0], chip: e[1], syn: e[2], note: e[3] }));
    if (d.missed) d.missed.forEach(p => {
      if (!(MODULES[p[0]] && MODULES[p[0]].drills[p[1]])) return;
      if (missed.some(e => e.mi === p[0] && e.di === p[1])) return;

let sndOn = false, actx = null;
function beep(f, dur, delay, type) {
  if (!sndOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + (delay || 0) / 1000;
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; o.type = type || "sine";
    g.gain.setValueAtTime(0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
function sndTick() { beep(880, 0.05); }
function sndErr() { beep(150, 0.11, 0, "square"); }

function drillPos(d) {

/* ---------------- answer normalizer ----------------
   Case-sensitive (that's real Python) but forgiving on
   spacing and quote style. */
function norm(s) {
  s = s.trim().replace(/'/g, '"').replace(/\s+/g, " ");
  s = s.replace(/\s*([=+\-*/%<>!,:()\[\]{}.])\s*/g, "$1");
  return s;
}
function indentOf(s) { const m = s.match(/^[ \t]*/); return m[0].replace(/\t/g, "    ").length; }

function startModule(id) {

      line("Next batch due " + next + ". Come back then — the gap is the point.", "c-dim");

    }

    drillQueue = due.map(e => MODULES[e.mi].drills[e.di]); shuffle(drillQueue);

    shuffle(allQueue);
    curModule = { name: "ALL DRILLS", intro: "Everything, shuffled. " + allQueue.length + " drills." };

  } else {

    if (!m) { line("No module '" + id + "'. Try: modules", "c-red"); return; }

  blank();

}
function nextDrill() {

    sndChime();
    logEvent(curModule.name + " complete", "ok");
    if (curModule.outro) line(curModule.outro, "c-amber");
    line("Type menu for the console, or start another module.", "c-dim");
    mode = "home"; setStatus(); return;
  }

function checkDrill(input) {
  const d = drillQueue[drillIdx];
  if (input.trim().toLowerCase() === "hint") {
    line("shape: " + skeleton(d.answers[0]), "c-amber");
    line("  (letters hidden, structure shown - punctuation is half the syntax)", "c-dim");
    return;
  }
  if (input.trim() === "skip") {
    line("Answer: " + (Array.isArray(d.answers) ? d.answers[0] : d.answers), "c-amber");
    if (d.note) line("  ↳ " + d.note, "c-dim");
    missDrill(d);
    drillIdx++; nextDrill(); return;
  }
  let ok = false;
  if (d.indent) {
    const ind = indentOf(input);
    if (ind !== d.indent) {
      line(ind === 0
        ? "IndentationError: expected an indented block (this line lives INSIDE the block — 4 spaces)"
        : "IndentationError: unexpected indent (use exactly 4 spaces)", "c-red");
      return;
    }
  }
  const ni = norm(input);
  ok = d.answers.some(a => norm(a) === ni);
  if (ok) {
    score.drills++; d.doneFlag = true; chiUp(); learn(d);
    logEvent("form acquired: " + d.chip, "ok");
    if (d.out) d.out.forEach(o => line(o));
    if (curModule.id === "review") {
      const p = drillPos(d);
      const e = p && missed.find(x => x.mi === p[0] && x.di === p[1]);
      if (e) {
        e.stage++;
        const gaps = [1, 3, 7];
        if (e.stage > 3) { missed.splice(missed.indexOf(e), 1); line("  \u25c9 mastered — off the schedule for good.", "c-green"); }
        else { e.due = dayStr(gaps[e.stage - 1]); line("  \u25cb resurfaces in " + gaps[e.stage - 1] + " day" + (gaps[e.stage - 1] === 1 ? "" : "s") + ".", "c-dim"); }
      }
    }
    setStatus();
    chip(d.chip);
    if (d.note) line("  ↳ " + d.note, "c-dim");
    drillIdx++; nextDrill();

}
/* friendly python-flavoured nudges */
function diagnose(input, d) {
  const a = d.answers[0], t = input.trim();
  if (/^(if|elif|else|for|while|def)\b/.test(t) && /:$/.test(a.trim()) && !/:$/.test(t))
    line("SyntaxError: expected ':'  — blocks open with a colon.", "c-red");
  else if (/==/.test(a) && /(^|[^=!<>])=([^=]|$)/.test(t) && !/==/.test(t))
    line("Almost — a single = assigns. To compare, use ==.", "c-red");
  else if (/^print\(/i.test(a) && /^print /i.test(t))
    line("SyntaxError: Missing parentheses in call to 'print'. Did you mean print(...)?", "c-red");
  else if (/^Print/.test(t))
    line("NameError: name 'Print' is not defined. Did you mean: 'print'? (case matters)", "c-red");
  else if ((a.match(/"/g) || []).length > ((t.match(/["']/g) || []).length))
    line("Check your quotes — text needs an opener AND a closer.", "c-red");
  else {
    showDiff(input, a);
    line("Not quite. hint shows the shape, skip reveals.", "c-red");
    const ch = curModule && CHAPTER_OF[curModule.id];
    if (ch && ACADEMY.some(x => x.id === ch)) line("Lost? The reading is one command away: academy " + ch, "c-dim");
  }
}
function showDiff(input, answer) {
  const ni = norm(input), na = norm(answer);
  let i = 0;
  const n = Math.min(ni.length, na.length);
  while (i < n && ni[i] === na[i]) i++;
  if (i === ni.length && i === na.length) return false;
  line("your line: " + ni, "c-dim");
  line("           " + " ".repeat(i) + "^ first difference is here", "c-red");
  return true;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }

function classifyLine(s) {
  const cls = []; let inStr = null, com = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (com) { cls.push("com"); continue; }
    if (inStr) { cls.push("str"); if (c === inStr) inStr = null; continue; }
    if (c === "#") { com = true; cls.push("com"); continue; }
    if (c === '"' || c === "'") { inStr = c; cls.push("str"); continue; }
    cls.push("code");
  }
  return cls;
}
function startGhost(n) {
  const g = GHOSTS.find(x => x.id === n);
  if (!g) { ghostMenu(); return; }
  mode = "ghost"; setStatus(); showPane("ghost");
  const lines = g.code.split("\n");
  ghost = { g, lines, cls: lines.map(classifyLine), li: 0, ci: 0, errors: 0, typed: 0, t0: null, done: false };
  $("ghead").innerHTML = "GHOST · <b>" + esc(g.name) + "</b> — start typing. Esc quits.";
  renderGhost();
  $("gpane").focus();
}
function renderGhost() {
  const G = ghost, el = $("gcode");
  let h = "";
  for (let l = 0; l < G.lines.length; l++) {
    const s = G.lines[l], cl = G.cls[l];
    for (let c = 0; c < s.length; c++) {
      let k = "gc";
      const typedPast = l < G.li || (l === G.li && c < G.ci);
      if (typedPast) k += " done " + (cl[c] === "com" ? "com" : cl[c] === "str" ? "str" : "");
      if (l === G.li && c === G.ci && !G.done) k += " cur";
      h += '<span class="' + k + '" data-p="' + l + "_" + c + '">' + esc(s[c]) + "</span>";
    }
    // newline marker
    let nk = "gnl";
    if (l === G.li && G.ci === s.length && !G.done) nk += " cur";
    h += '<span class="' + nk + '">⏎</span>\n';
  }

  renderGhostStats();
}
function renderGhostStats() {
  const G = ghost;
  const total = G.lines.reduce((a, s) => a + s.length + 1, 0);
  const done = G.lines.slice(0, G.li).reduce((a, s) => a + s.length + 1, 0) + G.ci;
  const acc = G.typed ? Math.round(100 * (G.typed - G.errors) / G.typed) : 100;
  let time = "0s";
  if (G.t0) { const t = Math.round((Date.now() - G.t0) / 1000); time = t + "s"; }
  $("gstats").innerHTML =
    "progress <b>" + done + "/" + total + "</b>" +
    "  errors <b>" + G.errors + "</b>" +
    "  accuracy <b>" + acc + "%</b>" +
    "  time <b>" + time + "</b>";
}
function ghostKey(e) {
  if (!ghost || mode !== "ghost") return;
  const G = ghost;
  if (e.key === "Escape") { endGhost(false); return; }
  if (G.done) return;
  let key = e.key;
  if (key === "Tab") { e.preventDefault(); ghostChars("    "); return; }
  if (key === "Backspace") {
    e.preventDefault();
    if (G.ci > 0) G.ci--;
    else if (G.li > 0) { G.li--; G.ci = G.lines[G.li].length; }
    renderGhost(); return;
  }
  if (key === "Enter") {
    e.preventDefault();
    handleGhostChar("\n"); return;
  }
  if (key.length !== 1) return;
  e.preventDefault();
  ghostChars(key);
}
function ghostChars(str) { for (const c of str) handleGhostChar(c); }
function handleGhostChar(c) {
  const G = ghost;
  if (!G.t0) G.t0 = Date.now();
  const lineS = G.lines[G.li];
  const atEol = G.ci === lineS.length;
  let expected = atEol ? "\n" : lineS[G.ci];
  const cls = atEol ? "code" : G.cls[G.li][G.ci];
  let okc;
  if (expected === "—" || expected === "–") okc = (c === "-" || c === expected);
  else if (cls === "com" || cls === "str") okc = c.toLowerCase() === expected.toLowerCase();
  else okc = c === expected;
  G.typed++;
  if (okc) {
    if (atEol) { G.li++; G.ci = 0; if (G.li >= G.lines.length) { finishGhost(); return; } }
    else G.ci++;
    renderGhost();
  } else {
    G.errors++;
    flashWrong();
    renderGhostStats();
  }
}

    : document.querySelectorAll(".gnl")[G.li];

  sel.classList.add("wrong");

}

}

  if (acc > score.ghostBest) score.ghostBest = acc;
  score.ghostAcc = score.ghostAcc || {};

}

  const fixes = Array.isArray(b.fix) ? b.fix : [b.fix];
  let ok;
  if (/^\s{4}/.test(fixes[0]) ) {
    ok = indentOf(input) === indentOf(fixes[0]) && fixes.some(f => norm(f) === norm(input));
  } else {

  }
}

const FW = 12, FH = 8;
function newField() {
  const tiles = [];
  for (let r = 0; r < FH; r++) { tiles.push(new Array(FW).fill(".")); }
  tiles[0][0] = "H";
  const spots = [];
  while (spots.length < 7) {
    const r = Math.floor(Math.random() * FH), c = Math.floor(Math.random() * FW);
    if ((r === 0 && c === 0) || spots.some(s => s[0] === r && s[1] === c)) continue;
    spots.push([r, c]);
  }
  spots.slice(0, 3).forEach(s => tiles[s[0]][s[1]] = "P");
  spots.slice(3, 6).forEach(s => tiles[s[0]][s[1]] = "D");
  tiles[spots[6][0]][spots[6][1]] = "S";
  return {
    tiles, r: 0, c: 0, battery: 100, mission: 0,
    scanned: false, log: []
  };
}

function tabComplete() {

  if (cliMode === "shell" && parts.length === 1)
    cands = ["python3", "ls", "whoami", "date", "clear", "help", "exit"];
  else if (cliMode === "python") {
    if (parts.length === 1) {
      cands = ["help", "academy", "modules", "start", "ghost", "bugs", "field", "forge", "sandbox", "exam", "kata", "quests", "scroll", "cheatsheet", "score", "save", "sound", "clear", "menu", "theme", "hint", "skip", "what is", "exit()"];

    else if (first === "theme") cands = ["verdant", "paper", "ember"];
    else if (first === "ghost" || first === "forge") cands = ["1", "2", "3", "4", "5"];

  const m = cands.filter(c => c.toLowerCase().startsWith(token.toLowerCase()));

  let p = m[0];
  for (const c of m) { while (p && !c.toLowerCase().startsWith(p.toLowerCase())) p = p.slice(0, -1); }

  if (e.key === "ArrowDown") {

    if (histPos >= hist.length) { histPos = -1; cmd.value = histDraft; }

      x.fillRect(Math.random() * c.width, Math.random() * c.height, s > 0.93 ? 2 : 1, s > 0.93 ? 2 : 1);
    }
  }
  paint(); addEventListener("resize", paint);
})();
setInterval(() => {
  const el = $("clock");
  if (el) el.textContent = new Date().toUTCString().slice(17, 25) + " UTC";
}, 1000);
const AMBIENT = [
  "wind shear 2.1 m/s — nominal",
  "hydro rack 3: nutrient cycle ok",
  "junie: standby · battery 100%",
  "cloud deck visibility 12 km",
  "relay ping 43 ms",
  "condensers at 87% efficiency",
  "perimeter scan clear",
  "rack 7 humidity 61%",
  "atmo dampers: micro-adjust",
  "solar wing 2 tracking sun",
  "crusader relay handshake ok",
  "junie ran a self-test: pass"
];
setInterval(() => {
  if (Math.random() < 0.7) logEvent(AMBIENT[Math.floor(Math.random() * AMBIENT.length)]);
}, 24000);
logEvent("console online", "ok");
MODULES.forEach(m => m.drills.forEach(d => d.group = m.name));
$("acClose").addEventListener("click", closeAcademy);
$("academy").addEventListener("scroll", () => {
  if (!acChapter) return;
  if (acScrollT) return;
  acScrollT = setTimeout(() => { acScrollT = null; stashPos(); }, 600);
});
$("acHome").addEventListener("click", renderChapterList);
$("acBigger").addEventListener("click", () => acFs(1));
$("acSmaller").addEventListener("click", () => acFs(-1));
document.addEventListener("keydown", e => { if (e.key === "Escape" && acOpen) closeAcademy(); });
const qb = $("qbtn");
if (qb) qb.addEventListener("click", () => { questLog(); cmd.focus(); });
const themeRowEl = $("themeRow");
if (themeRowEl) themeRowEl.querySelectorAll("button").forEach(b =>
  b.addEventListener("click", () => { setTheme(b.dataset.t); cmd.focus(); }));

const restored = loadState();
setStatus();
bootSeq();
if (restored) logEvent("progress restored from local save", "ok");
cmd.focus();
</script>
