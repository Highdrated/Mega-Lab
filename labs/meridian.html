<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec">
<title>Meridian</title>
<style>
:root{--sans:"Inter","Segoe UI",Roboto,system-ui,sans-serif;--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;--g:12px;--r:3px;--top:52px}
body[data-theme=promenade]{--bg:#f3f1ec;--bg2:#ebe8e1;--panel:#fbfaf7;--field:#ffffff;--line:#dcd8cf;--line2:#c4bfb4;--ink:#1c2226;--ink2:#4b555c;--mute:#868d91;--acc:#2c6a70;--acc2:rgba(44,106,112,.1);--gold:#a8783a;--gold2:rgba(168,120,58,.12);--ok:#3b7a4a;--ok2:rgba(59,122,74,.1);--bad:#b4473a;--bad2:rgba(180,71,58,.09);--term:#f6f4ef;--term-ink:#22292d;--scrim:rgba(243,241,236,.9);--on:#fff}
body[data-theme=nightwatch]{--bg:#0d0f11;--bg2:#121518;--panel:#14171a;--field:#101316;--line:#23282d;--line2:#323940;--ink:#e4e7ea;--ink2:#a7afb6;--mute:#6c757d;--acc:#8fbccb;--acc2:rgba(143,188,203,.12);--gold:#d2a865;--gold2:rgba(210,168,101,.12);--ok:#7fbf8e;--ok2:rgba(127,191,142,.12);--bad:#e0786b;--bad2:rgba(224,120,107,.12);--term:#0a0c0e;--term-ink:#d6dde2;--scrim:rgba(13,15,17,.88);--on:#0d0f11}
body[data-theme=bridge]{--bg:#0c1220;--bg2:#111a2b;--panel:#121b2c;--field:#0e1626;--line:#1f2b40;--line2:#2c3b55;--ink:#ece7da;--ink2:#b3b1a8;--mute:#7c8496;--acc:#c9a85c;--acc2:rgba(201,168,92,.13);--gold:#c9a85c;--gold2:rgba(201,168,92,.13);--ok:#86c19a;--ok2:rgba(134,193,154,.12);--bad:#e48a7c;--bad2:rgba(228,138,124,.12);--term:#0a101c;--term-ink:#e1dccf;--scrim:rgba(12,18,32,.88);--on:#0c1220}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body.art::before{content:"";position:fixed;inset:0;background:var(--art) center/cover no-repeat;opacity:.18;pointer-events:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line2);border-radius:var(--r);padding:0 12px;height:34px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
button.pri:hover{color:var(--on);filter:brightness(1.08)}
button.ghost{border-color:transparent}
button:disabled{opacity:.45;cursor:default}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.top{height:var(--top);display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--scrim);position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.brand svg{width:22px;height:22px;stroke:var(--acc)}
.nav{display:flex;gap:2px}
.nav button{border:0;border-bottom:2px solid transparent;border-radius:0;height:var(--top);color:var(--ink2);padding:0 12px}
.nav button.on{color:var(--ink);border-bottom-color:var(--acc)}
.meta{margin-left:auto;display:flex;align-items:center;gap:16px;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.meta b{color:var(--ink);font-weight:500}
.meta .cr{color:var(--gold)}
.meta button{height:30px;padding:0 9px}
main{position:relative;z-index:1;height:calc(100% - var(--top))}
.view{display:none;height:100%}
.view.on{display:grid}
#v-school{grid-template-columns:280px minmax(0,1fr)}
.mods{border-right:1px solid var(--line);overflow:auto;padding:20px 0}
.mods .lbl{padding:0 20px}
.mod{display:flex;align-items:center;gap:12px;width:100%;height:auto;min-height:44px;border:0;border-radius:0;padding:8px 20px;text-align:left;color:var(--ink2)}
.mod .n{font-family:var(--mono);font-size:11px;color:var(--mute);width:18px}
.mod .t{flex:1}
.mod.on{background:var(--acc2);color:var(--ink)}
.mod.lock{color:var(--mute);cursor:default}
.mod.lock:hover{color:var(--mute)}
.mod .st{color:var(--ok)}
.reader{overflow:auto;padding:36px 48px 48px}
.reader .wrap{max-width:860px;margin:0 auto}
.reader h1{font-weight:400;font-size:28px;letter-spacing:.01em;margin:0 0 6px}
.reader h2{font-weight:500;font-size:16px;margin:28px 0 8px}
.reader p,.reader li{color:var(--ink2);font-size:15px;line-height:1.7}
.reader .kick{color:var(--acc);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px}
.fig{margin:22px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{font-size:12px;color:var(--mute);margin:10px 0 0}
.pager{display:flex;align-items:center;gap:10px;margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
.pager .dots{display:flex;gap:6px;margin-right:auto}
.pager .dots i{width:18px;height:2px;background:var(--line2)}
.pager .dots i.on{background:var(--acc)}
.hero{position:relative;height:150px;margin:0 0 26px;border-bottom:1px solid var(--line);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
#v-tickets{grid-template-rows:minmax(0,1fr) auto}
.desk{display:grid;grid-template-columns:270px minmax(0,1fr) 230px;min-height:0}
.col{min-height:0;overflow:auto;padding:18px 18px}
.col+.col{border-left:1px solid var(--line)}
.npc{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.face{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);overflow:hidden;display:grid;place-items:center;color:var(--acc);font-size:13px;letter-spacing:.06em;flex:none;background:var(--bg2)}
.face img{width:100%;height:100%;object-fit:cover}
.npc .nm{font-weight:500}
.npc .rl{font-size:12px;color:var(--mute)}
.tk-title{font-size:16px;font-weight:500;margin:0 0 8px;line-height:1.35}
.tk-type{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.brief{color:var(--ink2);font-size:13.5px;margin:0 0 18px}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.steps li{display:flex;align-items:center;gap:10px;height:36px;border-bottom:1px solid var(--line);color:var(--mute);font-size:13px}
.steps li.done{color:var(--ok)}
.steps li.now{color:var(--ink)}
.steps li.now svg{color:var(--acc)}
.hintbox{margin-top:18px}
.hint{font-size:13px;color:var(--ink2);border-left:2px solid var(--acc);padding:4px 0 4px 10px;margin:8px 0}
.work{display:flex;flex-direction:column;padding:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px}
.tabs button{border:0;border-radius:0;border-bottom:2px solid transparent;height:42px;color:var(--ink2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.pane{display:none;flex:1;min-height:0}
.pane.on{display:flex;flex-direction:column}
.term{flex:1;min-height:0;overflow:auto;background:var(--term);color:var(--term-ink);font:13px/1.6 var(--mono);padding:14px 16px;white-space:pre-wrap;word-break:break-word}
.term .in{color:var(--acc)}
.term .err{color:var(--bad)}
.term .sys{color:var(--mute)}
.term .ok{color:var(--ok)}
.prompt{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);background:var(--term);padding:0 16px;height:46px;font-family:var(--mono);font-size:13px}
.prompt>span{color:var(--acc);white-space:nowrap}
.prompt .line{position:relative;flex:1;height:100%;min-width:0}
.prompt input,.prompt .ghost{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;outline:0;padding:0;font:13px var(--mono);line-height:46px;color:var(--term-ink)}
.prompt .ghost{color:var(--mute);white-space:pre;overflow:hidden;pointer-events:none}
.cmenu{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-top:1px solid var(--line);background:var(--term)}
.cmenu[hidden]{display:none}
.cmenu button{height:30px;font:12.5px var(--mono);color:var(--term-ink)}
.cmenu button.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.cmenu .tip{flex-basis:100%;margin:2px 0 0;font:12px var(--mono);color:var(--mute)}
.kbhint{display:flex;flex-wrap:wrap;gap:4px 14px;padding:7px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute);background:var(--term)}
kbd{font:11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 5px;margin-right:4px;color:var(--ink2);background:var(--panel)}
.keys{display:none;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--term);overflow-x:auto}
.keys button{height:40px;min-width:52px;font:12.5px var(--mono);flex:none}
@media (pointer:coarse){.keys{display:flex}.kbhint{display:none}}
.cmdb{padding:14px 16px;overflow:auto}
.cmdb input{width:100%;height:36px;border:1px solid var(--line2);background:var(--field);border-radius:var(--r);padding:0 10px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:8px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
tr.ci{cursor:pointer}
tr.ci:hover td{background:var(--acc2)}
tr.ci.seen td:first-child{color:var(--ok)}
td code,.mono{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.docs{padding:16px;overflow:auto;color:var(--ink2)}
.docs a{color:var(--acc)}
.stack{display:flex;flex-direction:column;align-items:stretch}
.node{display:flex;align-items:center;gap:10px;height:auto;min-height:44px;padding:6px 10px;border:1px solid var(--line2);border-radius:var(--r);text-align:left;color:var(--ink);background:var(--panel)}
.node .k{font-size:10.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;display:block}
.node .v{font-family:var(--mono);font-size:12.5px}
.node.seen{border-color:var(--acc)}
.node.fault{border-color:var(--bad);background:var(--bad2);color:var(--bad)}
.node.fault .v{color:var(--bad)}
.link{width:1px;height:16px;background:var(--line2);margin:0 auto}
.stack-note{font-size:12px;color:var(--mute);margin-top:12px}
.record{border-top:1px solid var(--line);padding:12px 18px 14px;background:var(--scrim)}
.rec-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:var(--g);align-items:end}
.rec-grid label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rec-grid textarea{resize:none;height:62px;border:1px solid var(--line2);background:var(--field);border-radius:var(--r);padding:6px 8px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)}
.rec-grid textarea:focus,.cmdb input:focus{outline:0;border-color:var(--acc)}
.grade{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px}
.grade span{display:flex;align-items:center;gap:6px;color:var(--ok)}
.grade span.no{color:var(--bad)}
.queue{display:none;overflow:auto;padding:28px 40px}
#v-tickets.list .desk,#v-tickets.list .record{display:none}
#v-tickets.list .queue{display:block}
.qwrap{max-width:900px;margin:0 auto}
.row{display:flex;align-items:center;gap:14px;width:100%;height:auto;min-height:58px;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 4px;text-align:left}
.row:first-of-type{border-top:1px solid var(--line)}
.row .t{flex:1}
.row .t b{display:block;font-weight:500;color:var(--ink)}
.row .t small{color:var(--mute);font-size:12px}
.row .s{font-size:12px;color:var(--mute)}
.row .s.ok{color:var(--ok)}
.row.lock{cursor:default;color:var(--mute)}
.row.lock:hover{color:var(--mute)}
.simple{grid-template-columns:minmax(0,1fr)}
.simple>.inner{overflow:auto;padding:28px 40px}
.check{display:flex;align-items:center;gap:12px;min-height:42px;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.note{width:100%;min-height:90px;border:1px solid var(--line2);background:var(--field);border-radius:var(--r);padding:8px 10px;margin-top:12px;resize:vertical}
.card{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin:10px 0 26px}
.card .q{font-size:16px;margin:0 0 12px}
.card .a{color:var(--ink2);border-left:2px solid var(--acc);padding-left:12px;margin:12px 0}
.jr{display:grid;grid-template-columns:110px 160px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.jr .d{color:var(--mute);font-family:var(--mono);font-size:12px}
.jr .c{color:var(--bad)}
.empty{color:var(--mute);font-size:13px;padding:14px 0}
.done-panel{text-align:center;padding:30px 0}
#toast{position:fixed;left:50%;top:calc(var(--top) + 54px);transform:translateX(-50%) translateY(-12px);opacity:0;background:var(--panel);border:1px solid var(--line2);padding:10px 16px;border-radius:var(--r);font-size:13px;transition:.2s;z-index:9;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.bad{border-color:var(--bad);color:var(--bad)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:var(--r);padding:20px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog textarea{width:100%;height:120px;font-family:var(--mono);font-size:12px;background:var(--field);border:1px solid var(--line2);border-radius:var(--r);padding:8px;resize:none}
dialog .bar{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.rail{display:none}
.ex{font-family:var(--sans);font-size:13px;line-height:1.6;color:var(--ink2);border-left:2px solid var(--acc);padding:2px 0 4px 12px;margin:6px 0 12px;white-space:normal;max-width:760px}
.ex b{display:block;font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.ex.why{border-left-color:var(--ok)}
.ex.why b{color:var(--ok)}
.ex.bad{border-left-color:var(--bad)}
.ex.bad b{color:var(--bad)}
.ex code{font-family:var(--mono);font-size:12px;color:var(--ink)}
.les{display:flex;align-items:center;gap:10px;width:100%;height:auto;min-height:36px;border:0;border-radius:0;padding:4px 20px 4px 50px;text-align:left;color:var(--ink2);font-size:13px}
.les.on{color:var(--acc)}
.les .st{margin-left:auto;color:var(--ok)}
.hypo{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.hypo select,.hypo textarea{width:100%;border:1px solid var(--line2);background:var(--field);border-radius:var(--r);padding:6px 8px;margin:4px 0 10px;color:var(--ink)}
.hypo select{height:36px}
.hypo textarea{height:78px;resize:none;font-size:13px}
.hypo .mine{font-size:13px;color:var(--ink2);border-left:2px solid var(--gold);padding-left:10px}
.debrief{overflow:auto;padding:22px 26px}
.debrief h3{font-weight:500;font-size:15px;margin:24px 0 8px}
.debrief p,.debrief li{color:var(--ink2);font-size:13.5px;line-height:1.65}
.path{display:grid;grid-template-columns:28px 120px 230px minmax(0,1fr);gap:0 12px;font-size:13px;align-items:baseline}
.path span{padding:7px 0;border-bottom:1px solid var(--line)}
.path .n{font-family:var(--mono);color:var(--mute);font-size:12px}
.path .s{color:var(--ink);font-weight:500}
.path code{font-family:var(--mono);font-size:12px;color:var(--acc)}
.mist{border-left:2px solid var(--bad);padding:2px 0 2px 12px;margin:10px 0}
.mist b{display:block;color:var(--bad);font-weight:500}
.tabs .tog.on{color:var(--acc)}
@media (max-width:1180px){
 .desk{grid-template-columns:240px minmax(0,1fr) 52px}
 .col.side{padding:12px 6px;overflow:hidden}
 .col.side .stack,.col.side .lbl,.col.side .stack-note{display:none}
 .col.side .rail{display:flex;flex-direction:column;align-items:center;gap:6px}
 .col.side.open{position:absolute;right:0;top:0;bottom:0;width:250px;background:var(--panel);z-index:5;padding:18px;overflow:auto;box-shadow:-1px 0 0 var(--line)}
 .col.side.open .stack,.col.side.open .lbl,.col.side.open .stack-note{display:flex}
 .col.side.open .lbl,.col.side.open .stack-note{display:block}
 .col.side.open .rail{display:none}
 .desk{position:relative}
 .rec-grid textarea{height:52px}
 .rec-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .path{grid-template-columns:24px 100px minmax(0,1fr)}
 .path span:nth-child(4n){grid-column:2 / -1}
 #v-school{grid-template-columns:230px minmax(0,1fr)}
 .reader{padding:28px 30px}
}
@media (max-width:820px){
 body{overflow:auto}
 main{height:auto}
 .view.on{display:block}
 .desk{display:block}
 .col+.col{border-left:0;border-top:1px solid var(--line)}
 .term{min-height:240px}
 .col.side{padding:18px}
 .col.side .stack{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px}
 .col.side .stack .link{display:none}
 .col.side .stack .node{flex:1 1 160px}
 .col.side .lbl,.col.side .stack-note{display:block}
 .col.side .rail{display:none}
 .mods{border-right:0;border-bottom:1px solid var(--line)}
 .meta .hide-s{display:none}
 .top{gap:10px;padding:0 12px}
 .jr{grid-template-columns:1fr}
 .rec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .rec-grid>button{grid-column:span 2}
}
</style>
</head>
<body data-theme="promenade">
<header class="top">
 <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M3 12c4-3 14-3 18 0"/><path d="M12 3v18"/></svg>Meridian</div>
 <nav class="nav">
  <button data-v="school">School</button>
  <button data-v="tickets">Tickets</button>
  <button data-v="missions">Missions</button>
  <button data-v="journal">Journal</button>
 </nav>
 <div class="meta">
  <span class="hide-s" id="m-mod"></span>
  <span class="hide-s"><b id="m-rank"></b></span>
  <span class="cr"><b id="m-cr" style="color:var(--gold)"></b> cr</span>
  <button id="b-sfx" title="Sound"></button>
  <button id="b-theme" title="Switch theme"></button>
  <button id="b-save" title="Save code">Save code</button>
 </div>
</header>
<main>
 <section class="view" id="v-school">
  <aside class="mods"><p class="lbl">Curriculum</p><div id="modlist"></div></aside>
  <article class="reader"><div class="wrap" id="lesson"></div></article>
 </section>
 <section class="view list" id="v-tickets">
  <div class="queue"><div class="qwrap" id="queue"></div></div>
  <div class="desk">
   <div class="col" id="tk-left"></div>
   <div class="col work">
    <div class="tabs" id="wtabs">
     <button data-p="console" class="on">Console</button>
     <button data-p="cmdb">CMDB</button>
     <button data-p="docs">Docs</button>
     <button data-p="debrief" id="t-debrief" hidden>Debrief</button>
     <span style="margin-left:auto;display:flex;align-items:center;gap:8px"><button class="ghost tog" id="b-explain">Explain</button><button class="ghost" id="b-hint">Ask Junie</button><button class="ghost" id="b-leave">Back to queue</button></span>
    </div>

const CONCEPTS={
 'cmdb-first':{q:'Before you touch anything, what do you look up first, and why?',a:'The affected configuration items in the CMDB. You need to know what depends on the thing you are about to change, who owns it, and which services go down with it.'},

const FIG_STACK=`<svg viewBox="0 0 760 120" role="img" aria-label="The stack">${[['service','Galley display'],['vm','galley-disp-01'],['host','esx-02'],['datastore','DS-HULL-01'],['lun','LUN 12'],['backup','vault-01']].map((r,i)=>{const x=6+i*126,f=i===2;return svgB(x,26,112,48,f?'var(--bad)':'var(--line2)')+svgT(x+56,46,r[0],{s:10.5,c:'var(--mute)'})+svgT(x+56,64,r[1],{s:12,f:'var(--mono)',c:f?'var(--bad)':'var(--ink)'})+(i<5?svgA(x+114,50,x+124,50,'var(--line2)'):'')}).join('')}${svgT(320,100,'a fault in the host takes down everything to its left',{c:'var(--bad)',s:11.5})}</svg>`;

const FIG_MAINT=`<svg viewBox="0 0 760 170" role="img" aria-label="Maintenance mode timeline"><path d="M20 70H740" stroke="var(--line2)"/>${[[100,'02:10','enter maintenance','VMs moved off or shut down'],[290,'02:20','patch + reboot','host is empty'],[480,'02:50','patch done','host still in maintenance'],[660,'?','exit maintenance','VMs may run again']].map((r,i)=>`<circle cx="${r[0]}" cy="70" r="5" fill="${i===3?'var(--bad)':'var(--acc)'}"/>`+svgT(r[0],48,r[1],{s:11,f:'var(--mono)',c:'var(--mute)'})+svgT(r[0],98,r[2],{s:12.5})+svgT(r[0],118,r[3],{s:11.5,c:'var(--ink2)'})).join('')}${svgT(660,150,'the step that gets forgotten',{c:'var(--bad)',s:11.5})}</svg>`;

const FIG_PS=`<pre style="font:13px/1.8 var(--mono);margin:0 0 14px;color:var(--ink);white-space:pre;overflow:auto"><span style="color:var(--acc)">PS&gt; <span style="border-bottom:2px solid var(--gold)">Get</span>-VM galley-disp-01</span>

Name             PowerState  VMHost
----             ----------  ------
galley-disp-01   <span style="border-bottom:2px solid var(--bad);color:var(--bad)">PoweredOff</span>  <span style="border-bottom:2px solid var(--acc);color:var(--acc)">esx-02</span></pre><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:12.5px"><span style="border-top:2px solid var(--gold);padding-top:6px;color:var(--ink2)"><b style="font-weight:500;color:var(--gold)">Verb</b><br>Get means read only. Safe.</span><span style="border-top:2px solid var(--bad);padding-top:6px;color:var(--ink2)"><b style="font-weight:500;color:var(--bad)">State</b><br>What you are looking for.</span><span style="border-top:2px solid var(--acc);padding-top:6px;color:var(--ink2)"><b style="font-weight:500;color:var(--acc)">Where it lives</b><br>The next layer down to check.</span></div>`;

const LESSONS={
 'l0-orient':{title:'How this ship works',pages:[
  `<p class="kick">Orientation</p><h1>Welcome aboard the Meridian</h1><p>The Meridian is a long-haul carrier. Every light, door, cabin screen and comms link runs on the infrastructure below deck: hosts, virtual machines, storage, backups, directory, edge. You are the systems officer who keeps it running.</p><p>The crew bring you tickets. Some are incidents (something broke), some are changes (something needs doing on purpose, safely). You work them the way a real infra team does, with real commands.</p><h2>What you train here</h2><ul><li>Diagnose: find which layer is actually broken</li><li>Decide: choose the safe action, knowing what it affects</li><li>Execute: in the right order, with real commands</li><li>Document: a record a senior engineer would sign off</li></ul><p>This is not a quiz. Nothing is multiple choice. You type, you look, you decide.</p>`,
  `<p class="kick">Orientation</p><h1>The ticket loop</h1><p>Every incident follows the same seven steps. They unlock in order, because that order is what keeps real engineers out of trouble.</p>${fig(FIG_LOOP,'You cannot skip ahead. A fix before you know what is affected is a change made blind.')}<h2>Why a hypothesis step?</h2><p>Juniors type commands until something looks wrong. Seniors say "I think it is the host, because the VM is off and nothing else changed overnight", then run the one command that proves or kills that idea. Saying it out loud is the skill. Being wrong is fine, as long as you test it.</p>`,
  `<p class="kick">Orientation</p><h1>Rules of the deck</h1><h2>No leniency</h2><p>If a command or an order of steps would fail in a real datacenter, it fails here. A failure costs credits, lands in your journal, and comes back later as a review card.</p><h2>Rollback before change</h2><p>Write the rollback plan in the record before the first command that changes something. Without it, change commands are refused.</p><h2>Explain mode</h2><p>After every command a short note tells you what the output means and what a senior would look at next. You can switch it off with the Explain button once you want to fly solo.</p><h2>Stuck?</h2><p>Junie rides along. Ask her for a hint: three levels, each costs a few credits.</p><h2>The debrief</h2><p>After every ticket you get the senior engineer's path next to yours, and what each of your mistakes would have meant on a real night shift.</p>`
 ]},
 'l0-team':{title:'The infra team and its tickets',pages:[
  `<p class="kick">Basics</p><h1>What an infra team actually owns</h1><p>Everything people use sits on a pile of layers. The infra team owns the middle of that pile: the machines, the storage under them and the network between them. Apps belong to developers, the building to facilities.</p>${fig(FIG_LAYERS,'When a service breaks, the cause can live in any layer. Your job is to find which one.')}<p>The important habit: a problem shows up at the top (screens are black) but usually lives lower down. You start where the symptom is and walk down until the layers stop looking healthy.</p>`,
  `<p class="kick">Basics</p><h1>First, second and third line</h1><p>Support is split into lines so that easy things get fixed fast and hard things reach the people who can solve them.</p>${fig(FIG_LINES)}<h2>The same incident at each line</h2><ul><li><b>First line</b> hears "galley screens are black", logs it, tries the known fix (restart the screen), escalates.</li><li><b>Second line</b> finds the VM behind the screens is powered off and gets it running again.</li><li><b>Third line</b> asks why it was off at all, finds the patch process skips a step, and changes the process so it never happens again.</li></ul><p>Third line is not about knowing more commands. It is about not stopping at "it works again".</p>`,
  `<p class="kick">Basics</p><h1>Incident, problem, change</h1><p>ITIL, the common rulebook for IT operations, splits work into three kinds of records. One bad morning can create all three.</p>${fig(FIG_IPC)}<ul><li><b>Incident</b>: restore the service. Speed matters, elegance does not.</li><li><b>Problem</b>: the investigation into the root cause, so the incident does not repeat.</li><li><b>Change</b>: any planned modification. It needs a plan, an approval and a rollback.</li></ul><p>That is why your record has a follow-up field: it is where the incident hands over to a problem or a change.</p>`,
  `<p class="kick">Basics</p><h1>Priority: impact times urgency</h1><p>Every ticket gets a priority. It is not a feeling, it is two questions.</p>${fig(FIG_PRIO)}<p>This is also why scope matters so much. "The galley screen is black" might be one VM. If the host underneath is down, it might be fourteen services. Same symptom, very different priority. You only know after you scope.</p>`
 ]},
 'l0-stack':{title:'The stack and the console',pages:[
  `<p class="kick">Basics</p><h1>The stack</h1><p>Every service on the ship hangs on a chain of things below it. The lab draws that chain next to every ticket.</p>${fig(FIG_STACK)}<ul><li><b>Service</b>: what people see. The galley order screens.</li><li><b>VM</b>: a virtual machine. A full computer made of software. Many share one physical host.</li><li><b>Host</b>: the physical server. It runs a hypervisor (VMware ESXi) that runs the VMs.</li><li><b>Datastore</b>: where the VM disks live, shared by several hosts.</li><li><b>LUN</b>: a slice of the storage array handed to the hosts. Module 3 goes deeper.</li><li><b>Backup</b>: a copy somewhere else. Module 4.</li></ul><p>A fault low in the chain breaks everything above it. That is why you check one layer at a time, top to bottom.</p>`,
  `<p class="kick">Basics</p><h1>Maintenance mode</h1><p>Hosts need patches. You cannot patch a host while VMs run on it, so you put it in maintenance mode first. vSphere then refuses to run or start any VM on that host.</p>${fig(FIG_MAINT,'The classic mistake: the patch finishes, the engineer goes home, the host stays in maintenance.')}<p>Before maintenance, VMs are either moved live to another host (vMotion, Module 1) or shut down. The ones that were shut down stay down until someone exits maintenance mode and starts them again.</p>`,
  `<p class="kick">Basics</p><h1>Reading the console</h1><p>The console speaks PowerCLI, the PowerShell module for VMware. Same Verb-Noun pattern as the PowerShell you already use.</p>${fig(FIG_PS)}<ul><li><code>Get-</code> reads. Always safe. Run as many as you like.</li><li><code>Set-</code>, <code>Start-</code>, <code>Restart-</code> change things. Those are changes, so they need a rollback plan first.</li><li>The pipe <code>|</code> hands results to the next command: <code>Get-VM -Location esx-02 | Start-VM</code> starts every VM on that host.</li></ul><p>Read every column. The answer is usually already on screen: a state, and a pointer to the next layer down.</p>`,
  `<p class="kick">Basics</p><h1>Typing like a pro</h1><p>The console behaves like PowerShell 7 with PSReadLine, the same as on your work laptop. Learn these now and they carry straight over.</p><div class="fig"><table><thead><tr><th>Keys</th><th>What it does</th><th>Why it matters</th></tr></thead><tbody>
<tr><td><kbd>Tab</kbd></td><td>Completes commands, parameters after a dash, and values: VM names, hosts, states</td><td>No typos in server names. A typo in a name can hit the wrong server.</td></tr>
<tr><td><kbd>Shift</kbd><kbd>Tab</kbd></td><td>Cycles back through the same completions</td><td>When you went one past the one you wanted</td></tr>
<tr><td><kbd>Ctrl</kbd><kbd>Space</kbd></td><td>Shows every option as a menu, with the command syntax</td><td>When you do not remember the name at all</td></tr>
<tr><td><kbd>&#8594;</kbd></td><td>Accepts the grey suggestion from your history</td><td>Repeat checks in one keystroke</td></tr>
<tr><td><kbd>Ctrl</kbd><kbd>&#8594;</kbd></td><td>Accepts the suggestion one word at a time</td><td>Reuse a command but change the end</td></tr>
<tr><td><kbd>&#8593;</kbd><kbd>&#8595;</kbd></td><td>Walks through your history</td><td>Rerun the check after a fix</td></tr>
<tr><td><kbd>F8</kbd></td><td>History that starts with what you typed</td><td>Type <code>Get-VM</code>, then F8 for the last Get-VM</td></tr>
<tr><td><kbd>Ctrl</kbd><kbd>R</kbd></td><td>Searches history for any part of a command</td><td>Find that one command from an hour ago</td></tr>
<tr><td><kbd>Esc</kbd></td><td>Clears the line</td><td>Start over without backspacing</td></tr>

function shakeStart(names,w,c){
 const out=[],notes=[];
 for(const n of names){
  const v=w.vms[n];
  if(!v)return{err:`Start-VM: VM with name '${n}' was not found.`};

 }

const PROMPT='PS C:\\ops>';
const BUILTIN={
 'Clear-Host':{params:{},pos:null,syn:'Clear-Host'},
 'Get-History':{params:{'-Count':null},pos:null,syn:'Get-History [[-Count] <Int32>]'},
 'Get-Help':{params:{'-Name':'cmdlet'},pos:'-Name',syn:'Get-Help [[-Name] <String>]'},
 'cmdb':{params:{},pos:'ci',syn:'cmdb <ConfigurationItem>'},
 'help':{params:{},pos:null,syn:'help'}
};
const ALIAS={cls:'Clear-Host',clear:'Clear-Host',h:'Get-History',history:'Get-History',ghy:'Get-History'};
const TYPE={int:'Int32',vm:'String',host:'VMHost',ds:'Datastore',state:'VMHostState',port:'Int32',cmdlet:'String',ci:'String'};
function schema(){const T=cur();return Object.assign({},T?T.complete.cmdlets:{},BUILTIN)}
function values(kind){const T=cur();if(!T)return[];if(kind==='cmdlet')return Object.keys(schema()).filter(k=>/-/.test(k));if(kind==='ci')return T.cmdbRows.map(r=>r[0]);return T.complete.values[kind]||[]}
function canon(name){const sc=schema(),k=Object.keys(sc).find(x=>x.toLowerCase()===String(name).toLowerCase());if(k)return k;const a=ALIAS[String(name).toLowerCase()];return a||null}
function syntaxOf(name){const d=schema()[name];if(!d)return'';if(d.syn)return d.syn;const ps=Object.entries(d.params).map(([p,t])=>{if(t==='switch')return `[${p}]`;const ty=TYPE[t]||'Int32';return p===d.pos?`[${p}] <${ty}>`:`[${p} <${ty}>]`});return `${name} ${ps.join(' ')}`.trim()}

function normalize(line){
 const segs=line.split('|').map(s=>s.trim());
 const out=[];
 for(const seg of segs){
  if(!seg)return{err:'ParserError: An empty pipe element is not allowed.'};
  const toks=seg.split(' ');
  const name=canon(toks[0]);
  if(!name)return{err:`${toks[0]}: The term '${toks[0]}' is not recognized as a name of a cmdlet, function, script file, or executable program.\nCheck the spelling of the name, or if a path was included, verify that the path is correct and try again.`};
  const d=schema()[name],posv=[],named=[];
  for(let i=1;i<toks.length;i++){
   const t=toks[i];
   if(/^-/.test(t)&&!/^-\d/.test(t)){
    const bare=t.split(':')[0];
    const hits=Object.keys(d.params).filter(p=>p.toLowerCase().startsWith(bare.toLowerCase()));
    const exact=hits.find(p=>p.toLowerCase()===bare.toLowerCase());
    if(!hits.length)return{err:`${name}: A parameter cannot be found that matches parameter name '${bare.slice(1)}'.`};
    if(hits.length>1&&!exact)return{err:`${name}: Parameter cannot be processed because the parameter name '${bare.slice(1)}' is ambiguous. Possible matches include: ${hits.join(' ')}.`};
    const full=exact||hits[0];
    if(full==='-Confirm')continue;
    let val=t.includes(':')?t.slice(t.indexOf(':')+1):null;
    if(val==null){if(i+1>=toks.length)return{err:`${name}: Missing an argument for parameter '${full.slice(1)}'. Specify a parameter of type '${TYPE[d.params[full]]||'Int32'}' and try again.`};val=toks[++i]}
    if(full===d.pos)posv.unshift(val);else named.push(full+' '+val);
   }else posv.push(t);
  }
  out.push([name].concat(posv,named).join(' '));
 }
 return{line:out.join(' | ')};
}

function tokenAt(v,pos){
 let s=pos;while(s>0&&!/[\s|,]/.test(v[s-1]))s--;
 return{start:s,end:pos,word:v.slice(s,pos)};
}
function completions(v,pos){
 const{start,end,word}=tokenAt(v,pos);
 const segStart=v.lastIndexOf('|',start-1)+1;
 const before=v.slice(segStart,start).trim();
 const toks=before?before.split(/\s+/):[];
 const lw=word.toLowerCase();
 let items=[];
 if(!toks.length)items=Object.keys(schema()).concat(Object.keys(ALIAS)).filter(k=>k.toLowerCase().startsWith(lw)&&(lw||/-/.test(k)));
 else{
  const name=canon(toks[0]),d=name&&schema()[name];
  if(d){
   if(word.startsWith('-'))items=Object.keys(d.params).filter(p=>p.toLowerCase().startsWith(lw)&&!toks.some(t=>t.toLowerCase()===p.toLowerCase()));
   else{
    const prev=toks[toks.length-1];let kind;
    if(prev.startsWith('-')){const p=Object.keys(d.params).find(x=>x.toLowerCase()===prev.toLowerCase());kind=p?d.params[p]:null}
    else if(toks.length===1||v.slice(start-1,start)===',')kind=d.pos&&d.pos.startsWith('-')?d.params[d.pos]:d.pos;
    if(kind)items=values(kind).filter(x=>x.toLowerCase().startsWith(lw));
   }
  }
 }
 items=items.filter((x,i,a)=>a.indexOf(x)===i).sort((a,b)=>a.localeCompare(b));
 return{start,end,items};
}

const K={comp:null,menu:null,hidx:null,search:null,draft:''};

function tabCycle(dir){
 const el=$('cmd'),v=el.value,pos=el.selectionStart;
 if(!K.comp||K.comp.after!==v){

 }

 const nv=c.base.slice(0,c.start)+c.items[c.i]+c.base.slice(c.end);

function startSearch(){K.search={q:'',idx:hist().length,match:''};drawSearch()}

function keyDown(e){
 const el=$('cmd'),v=el.value,pos=el.selectionStart,atEnd=pos===v.length&&el.selectionEnd===v.length;
 if(K.search){
  const s=K.search;
  if(e.key==='Enter'){e.preventDefault();const m=s.match;endSearch(false);if(m)run(m);return}
  if(e.key==='Escape'||(e.ctrlKey&&e.key.toLowerCase()==='g')){e.preventDefault();endSearch(false);return}

 }

 if(e.key!=='Shift')K.comp=null;
 if(e.key==='Enter'){e.preventDefault();K.hidx=null;$('cmenu').hidden=true;setVal('');run(v);return}
 if(e.key==='Escape'){e.preventDefault();K.hidx=null;setVal('');return}
 if(e.ctrlKey&&e.key.toLowerCase()==='c'&&el.selectionStart===el.selectionEnd){e.preventDefault();termLine('in',`${PROMPT} ${v}^C`);setVal('');return}
 if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();$('term').innerHTML='';if(S.cur)S.cur.log=[];save();return}
 if(e.ctrlKey&&e.key.toLowerCase()==='r'){e.preventDefault();startSearch();return}
 if(e.key==='ArrowRight'&&atEnd&&K.sug){e.preventDefault();if(e.ctrlKey){setVal(K.sug.slice(0,wordEnd(K.sug,v.length)))}else setVal(K.sug);S.stats.pred=(S.stats.pred||0)+1;return}
 if(e.key==='End'&&atEnd&&K.sug){e.preventDefault();setVal(K.sug);S.stats.pred=(S.stats.pred||0)+1;return}
 if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='F8'){
  e.preventDefault();const h=hist();if(!h.length)return;
  if(K.hidx==null){K.hidx=h.length;K.draft=v}
  if(e.key==='F8'){const q=K.draft.toLowerCase();for(let i=K.hidx-1;i>=0;i--)if(h[i].toLowerCase().startsWith(q)){K.hidx=i;setVal(h[i]);return}tone(220,.05);return}

}

function run(raw){
 const T=cur(),c=S.cur,line=raw.trim().replace(/\s+/g,' ');if(!line){termLine('in',PROMPT);return}
 const h0=hist();if(h0[h0.length-1]!==line){h0.push(line);if(h0.length>300)h0.shift()}
 termLine('in',PROMPT+' '+line);
 const before=stepIdx();
 let res,norm=null;
 if(/^help$/i.test(line))res={out:T.help.join('\n'),note:'Get- commands only read and are always safe. Everything else changes something and needs a rollback plan first. Try <code>Get-Help Get-VM</code> for the full syntax of one command.'};
 else{norm=normalize(line);if(norm.err)res={err:norm.err}}
 if(norm&&!norm.err){
  const nl=norm.line,parts=nl.split(' '),first=parts[0];
  if(first==='Clear-Host'){$('term').innerHTML='';c.log=[];res=null}
  else if(first==='Get-History'){const h=hist().slice(0,-1),start=Math.max(0,h.length-20);res={out:'  Id CommandLine\n  -- -----------\n'+h.slice(start).map((x,i)=>String(start+i+1).padStart(4)+' '+x).join('\n'),note:'Your history is kept between tickets, like PSReadLine keeps it between sessions. Ctrl+R searches it, and the grey suggestion while you type comes from it.'}}
  else if(first==='Get-Help'){const n=canon(parts[1]||'');res=n?{out:'NAME\n    '+n+'\n\nSYNTAX\n    '+syntaxOf(n)}:{err:'Get-Help: Get-Help could not find '+(parts[1]||'a topic')+' in a help file in this session.'}}
  else if(first==='cmdb'){res=parts[1]?cmdbLook(parts[1]):{err:'cmdb: Missing an argument. Usage: cmdb <ConfigurationItem>'}}
  else res=runCmd(nl);
 }
 if(res){
  if(res.out)termLine('',res.out);
  if(res.err)termLine('err',res.err);
  if(res.fail){const key=res.fail[0];if(!c.failed[key]){c.failed[key]=1;fail(res.fail[0],res.fail[1],res.why)}else{c.fails++;sfx.bad()}termEx('bad','What this would mean for real',res.why||CONCEPTS[key].a)}
  else if(!res.err)sfx.key();
  if(res.note)termEx('info','What this tells you',res.note);
 }
 const after=stepIdx();
 if(after!==before&&before>=0){sfx.step();for(let i=before;i<(after<0?T.steps.length:after);i++){termLine('ok',`Step complete: ${T.steps[i][1]}`);if(T.steps[i][3])termEx('why','Why this step',T.steps[i][3])}}
 save();renderDesk(false);
}
function runCmd(line){
 const T=cur(),c=S.cur;let res;
  const h=T.cmds.find(x=>x.re.test(line));
  if(!h)res={err:`${line.split(' ')[0]}: That parameter combination is not used on this ticket. Try Get-Help ${line.split(' ')[0]} or the Docs tab.`};
  else if(T.type==='change'&&!c.ciAll)res={err:'Blocked: find the affected configuration items in the CMDB first.'};
  else if(h.write&&!c.ciAll)res={err:'Blocked: no change before the CMDB lookup.',fail:['cmdb-first','Tried to change something before checking the CMDB.'],why:'You were about to change a system without knowing what else depends on it. On a shared host that can take down services you did not even know were there.'};
  else if(h.write&&!c.isolated)res={err:'Blocked: the cause is not proven yet.',note:'Fixing something you have not proven is guessing, and guesses on production systems cause the next incident. Scope it, commit a hypothesis, prove it with evidence and mark the faulty layer in the stack. Then the fix unlocks.'};
  else if(h.write&&words(c.rec.rollback)<5)res={err:'Change refused: there is no rollback plan on the record yet.',fail:['rollback-first','Tried to make a change with no rollback plan written.'],why:'Every command that changes something is a change. If it goes wrong at 3am you want a written way back, not an improvised one. Write the Rollback field first: how would you undo exactly what you are about to do?'};
  else res=h.run(line.match(h.re),c.w,c,T);
 return res;
}
function flagNode(id){
 const T=cur(),c=S.cur;if(c.isolated)return;
 const k=stepIdx(),iso=T.steps.findIndex(s=>s[0]==='isolate');
 if(k<iso){toast(k<T.steps.findIndex(s=>s[0]==='hypo')?'Not yet: scope the problem before you name a fault.':'Commit a hypothesis first, then prove it.');return}
 if(id!==T.fault.node){if(!c.failed['evidence:'+id]){c.failed['evidence:'+id]=1;fail('evidence',`Marked ${id} as the fault, but it was healthy.`,'Naming the wrong layer sends the fix to the wrong team. On a real shift that is an hour lost and a confused colleague. Mark a fault only when output you saw proves it.');termEx('bad','What this would mean for real',`You marked ${esc(id)} as the fault, but nothing you ran shows it broken. Query it, read the output, then decide.`)}else{c.fails++;sfx.bad()}save();renderDesk(false);return}
 if(!c.w.f[T.fault.evidence]){toast('You may be right, but you have no proof yet. Query that layer first.');return}
 c.isolated=true;sfx.step();termLine('ok',`Fault isolated: ${id}`);
 termEx('why','Why this step',T.steps[iso][3]+(c.hypo&&c.hypo.id!==id?' Your hypothesis pointed elsewhere and the evidence corrected you. That is exactly how it should go.':' Your hypothesis held up under evidence.'));
 save();renderDesk(false);
}
function grade(){
 const T=cur(),c=S.cur;
 FIELDS.forEach(f=>c.rec[f]=$('r-'+f).value);
 const k=stepIdx(),rec=T.steps.findIndex(s=>s[0]==='record');
 if(k<rec){toast('Finish the work first. The record comes last.');return}
 const res=[['Every field filled in',FIELDS.every(f=>words(c.rec[f])>=4)]].concat(T.checks.map(([l,fs,re])=>[l,fs.split('|').some(f=>re.test(c.rec[f]))]));
 $('grade').innerHTML=res.map(([l,ok])=>`<span class="${ok?'':'no'}">${ic(ok?'check':'x')}${esc(l)}</span>`).join('');
 c.subs++;
 if(res.every(r=>r[1])){
  c.recordOk=true;
  const pay=Math.max(20,T.reward-c.fails*10-c.hints*5-(c.subs-1)*5);
  S.cr+=pay;S.xp+=S.done[c.id]?Math.round(T.reward/4):T.reward;S.done[c.id]={cr:pay,at:Date.now(),fails:c.fails};
  sfx.done();save();renderTop();renderDesk(false);setPane('debrief');
 }else{sfx.bad();toast('The record is not complete yet. Check the red items.',true)}
 save();
}
function renderDebrief(){
 const T=cur(),c=S.cur,D=T.debrief;
 $('debrief').innerHTML=`<p class="lbl">Debrief</p><h3 style="margin-top:0">The senior engineer's path</h3><div class="path">${D.path.map((r,i)=>`<span class="n">${i+1}</span><span class="s">${esc(r[0])}</span><span><code>${esc(r[1])}</code></span><span>${esc(r[2])}</span>`).join('')}</div>
 <h3>Your run</h3>${c.mistakes.length?c.mistakes.map(m=>`<div class="mist"><b>${esc(m.text)}</b>${esc(m.why)}</div>`).join(''):'<p>No mistakes. Clean run.</p>'}<p>${c.hints} hint${c.hints===1?'':'s'} used. Your hypothesis: ${c.hypo?esc(c.hypo.layer)+(c.hypo.id===T.fault.node?' (correct)':' (corrected by evidence)'):'none'}.</p>
 <h3>What a senior would also do</h3><ul>${D.senior.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <h3>Take with you</h3><ul>${D.take.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
}
function showClosed(){
 const c=S.cur,d=S.done[c.id];if(!d||$('b-next'))return;
 $('tk-left').insertAdjacentHTML('beforeend',`<div class="done-panel"><p class="lbl">Ticket closed</p><p style="font-size:22px;margin:0;color:var(--gold)">+${d.cr} cr</p><p style="color:var(--mute);font-size:12px">${d.fails} mistake${d.fails===1?'':'s'} · ${c.hints} hint${c.hints===1?'':'s'}</p><button class="pri" id="b-next">Back to queue</button></div>`);
 $('b-next').onclick=leave;
}
function leave(){if(S.cur&&S.cur.recordOk)S.cur=null;$('v-tickets').classList.add('list');renderQueue();save()}
function setPane(p){document.querySelectorAll('#wtabs button[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===p));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='p-'+p))}

function renderMissions(){
 const list=Object.entries(MISSIONS);
 $('missions').innerHTML=`<p class="lbl">Do it for real · on your own hardware</p>`+list.map(([id,M])=>{const st=S.missions[id]||{c:[],note:''},m=modOf(M.module);return `<div class="card"><p class="lbl">Module ${m.n} · ${esc(m.name)} · ${esc(M.hw)}</p><p class="q">${esc(M.title)}</p>${M.steps.map((s,i)=>`<label class="check"><input type="checkbox" data-x="${id}" data-i="${i}" ${st.c[i]?'checked':''}>${esc(s)}</label>`).join('')}<p class="lbl" style="margin-top:16px">${esc(M.prompt)}</p><textarea class="note" data-xn="${id}">${esc(st.note)}</textarea></div>`}).join('');
}
function renderJournal(){
 const now=Date.now(),due=Object.entries(S.srs).filter(([,v])=>v.due<=now);
 const card=due.length?(()=>{const[id]=due[0],C=CONCEPTS[id];return `<div class="card" id="rv" data-c="${id}"><p class="lbl">Review · ${due.length} due</p><p class="q">${esc(C.q)}</p><p style="color:var(--mute);font-size:13px">Say your answer out loud or write it down first.</p><div id="rv-a"></div><button class="pri" id="rv-show">Show answer</button></div>`})():`<p class="lbl">Review</p><p class="empty">Nothing due. Mistakes come back here on a schedule.</p>`;
 $('journal').innerHTML=card+`<p class="lbl" style="margin-top:28px">Mistake journal</p>`+(S.journal.length?S.journal.map(j=>`<div class="jr"><span class="d">${new Date(j.at).toLocaleDateString()}</span><span class="c">${esc(j.concept)}</span><span>${esc(j.text)}</span></div>`).join(''):'<p class="empty">No mistakes logged yet.</p>');
 const sh=$('rv-show');
 if(sh)sh.onclick=()=>{const id=$('rv').dataset.c;$('rv-a').innerHTML=`<p class="a">${esc(CONCEPTS[id].a)}</p><div style="display:flex;gap:8px"><button id="rv-miss">Missed it</button><button class="pri" id="rv-got">Got it</button></div>`;sh.remove();
  const step=[1,3,7,14,30];
  $('rv-got').onclick=()=>{const v=S.srs[id];v.lvl=Math.min(v.lvl+1,step.length);if(v.lvl>=step.length)delete S.srs[id];else v.due=Date.now()+step[v.lvl-1]*864e5;sfx.ok();save();renderJournal()};
  $('rv-miss').onclick=()=>{S.srs[id]={due:Date.now()+6e5,lvl:0};save();renderJournal()}};
}

function render(){renderTop();if(S.view==='school')renderSchool();if(S.view==='tickets')renderDesk(true);if(S.view==='missions')renderMissions();if(S.view==='journal')renderJournal()}

function packCode(){return 'MER1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function unpackCode(s){s=s.trim();if(!s.startsWith('MER1.'))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(s.slice(5)))));if(!d||d.v!==1)throw 0;return d}

document.querySelector('.nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;save();render()};
$('modlist').onclick=e=>{const l=e.target.closest('.les');if(l){if(l.classList.contains('lock'))return;S.lesson=l.dataset.l;save();renderSchool();$('lesson').parentNode.scrollTop=0;return}const b=e.target.closest('.mod');if(!b||b.classList.contains('lock'))return;S.mod=b.dataset.m;const m=modOf(S.mod);if(m.lessons)S.lesson=m.lessons[0];if(S.cur&&TICKETS[S.cur.id].module!==S.mod&&S.cur.recordOk)S.cur=null;save();render()};
$('queue').onclick=e=>{const b=e.target.closest('.row');if(!b||b.classList.contains('lock'))return;startTicket(b.dataset.t)};
$('wtabs').onclick=e=>{const b=e.target.closest('button[data-p]');if(!b)return;setPane(b.dataset.p);if(b.dataset.p==='console')$('cmd').focus()};
$('cmd').onkeydown=keyDown;
$('cmd').addEventListener('input',()=>{K.hidx=null;K.comp=null;if(K.menu){K.menu=null;drawMenu()}ghost()});
$('cmd').addEventListener('scroll',()=>{$('ghost').scrollLeft=$('cmd').scrollLeft});
$('cmd').addEventListener('click',ghost);
$('cmenu').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();acceptMenu(+b.dataset.i)}});
$('keys').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();const k=b.dataset.k,el=$('cmd');el.focus();
 if(k==='|'||k==='-'){const v=el.value,p=el.selectionStart,ins=k==='|'?' | ':'-';setVal(v.slice(0,p)+ins+v.slice(el.selectionEnd),p+ins.length);return}
 if(k==='ArrowRight')el.setSelectionRange(el.value.length,el.value.length);
 const ev={key:k,shiftKey:false,ctrlKey:false,code:'',preventDefault(){}};
 if(k==='STab'){ev.key='Tab';ev.shiftKey=true}
 if(k==='Menu'){ev.key=' ';ev.ctrlKey=true}
 if(k==='CtrlR'){ev.key='r';ev.ctrlKey=true}
 keyDown(ev)});
$('cmdbq').oninput=renderCmdb;
$('cmdbt').onclick=e=>{const r=e.target.closest('tr.ci');if(r)run('cmdb '+r.dataset.ci)};
$('stack').onclick=e=>{const b=e.target.closest('.node');if(b)flagNode(b.dataset.n)};
$('b-rail').onclick=()=>$('tk-side').classList.add('open');
document.addEventListener('pointerdown',e=>{const s=$('tk-side');if(s.classList.contains('open')&&!s.contains(e.target))s.classList.remove('open')});
FIELDS.forEach(f=>$('r-'+f).oninput=()=>{if(S.cur){S.cur.rec[f]=$('r-'+f).value;save()}});
$('b-submit').onclick=grade;
$('b-leave').onclick=leave;
$('b-explain').onclick=()=>{S.explain=!S.explain;save();renderTop();document.querySelectorAll('#term .ex.info').forEach(d=>d.hidden=!S.explain)};
$('b-hint').onclick=()=>{const T=cur(),c=S.cur;if(!T)return;if(c.hints>=T.hints.length){toast('That was Junie\'s last hint for this ticket.');return}c.hints++;tone(520,.12);save();renderDesk(false)};
$('missions').addEventListener('change',e=>{const x=e.target.dataset.x;if(x==null)return;const st=S.missions[x]||(S.missions[x]={c:[],note:''});st.c[+e.target.dataset.i]=e.target.checked;sfx.key();save()});
$('missions').addEventListener('input',e=>{const x=e.target.dataset.xn;if(x==null)return;(S.missions[x]||(S.missions[x]={c:[],note:''})).note=e.target.value;save()});
$('b-theme').onclick=()=>{const i=THEMES.findIndex(t=>t[0]===S.theme);S.theme=THEMES[(i+1)%THEMES.length][0];save();renderTop()};
$('b-sfx').onclick=()=>{S.sfx=!S.sfx;save();renderTop()};
$('b-save').onclick=()=>{$('dlg-code').value=packCode();$('dlg').showModal()};
$('dlg-close').onclick=()=>$('dlg').close();
$('dlg-copy').onclick=()=>{try{navigator.clipboard.writeText($('dlg-code').value);toast('Code copied')}catch(e){$('dlg-code').select()}};
$('dlg-load').onclick=()=>{try{S=Object.assign(JSON.parse(JSON.stringify(DEF)),unpackCode($('dlg-code').value));save();$('dlg').close();render();toast('Progress loaded')}catch(e){toast('That code could not be read.',true)}};
window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});

load();render();
window.MERIDIAN={S:()=>S,TICKETS,run,flagNode,grade,startTicket,stepIdx,cmdbLook,save};

</script>
