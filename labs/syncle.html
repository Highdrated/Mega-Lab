<!DOCTYPE html>
<html lang="en" data-theme="void">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f8">
<title>Syncle — PowerShell memory corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap">
<style>
:root{--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--hdr:52px;--gut:24px}
html[data-theme="void"]{--bg:#f3f5f8;--bg2:#e9edf2;--ink:#1c2430;--strong:#0d131b;--muted:#5a6575;--faint:#8b95a3;--line:#d6dce4;--hair:#e3e7ed;--accent:#2e6fc4;--accent-ink:#1d4f91;--accent-soft:#e6eef8;--gold:#9a6614;--gold-soft:#fbf3e4;--warn:#b0473f;--warn-soft:#f8e8e6;--good:#1f7a55;--glass:rgba(255,255,255,.88);--top:#ffffff;--left:#e2e8f0;--right:#c7d2df;--stroke:#1c2430;--grid:#dfe4eb;--shard:#cfd7e1;--stream:rgba(46,111,196,.28);--term:#ffffff;color-scheme:light}
html[data-theme="night"]{--bg:#090c12;--bg2:#0e131b;--ink:#dce3ec;--strong:#f4f7fb;--muted:#8d98aa;--faint:#5f6b7e;--line:#232c3b;--hair:#18202c;--accent:#7dbbff;--accent-ink:#b3d7ff;--accent-soft:#0f1d30;--gold:#e4b062;--gold-soft:#1d1912;--warn:#e07a70;--warn-soft:#2a1514;--good:#5cc99a;--glass:rgba(14,19,28,.9);--top:#2a3446;--left:#1b2331;--right:#121822;--stroke:#b9c6d8;--grid:#141a25;--shard:#1d2534;--stream:rgba(125,187,255,.22);--term:#0b0f16;color-scheme:dark}
html[data-theme="gold"]{--bg:#0a0c08;--bg2:#10130d;--ink:#ede6d6;--strong:#fbf6ea;--muted:#a89f88;--faint:#6f6857;--line:#2a2a1f;--hair:#1c1d15;--accent:#e9bd6a;--accent-ink:#f5d69a;--accent-soft:#221d11;--gold:#f5d69a;--gold-soft:#201b10;--warn:#e07a5f;--warn-soft:#2a1610;--good:#9fcf8a;--glass:rgba(12,14,10,.9);--top:#3a3018;--left:#241e0f;--right:#15120a;--stroke:#e9bd6a;--grid:#17180f;--shard:#1f1d13;--stream:rgba(233,189,106,.2);--term:#0c0e0a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.lbl{font:500 10px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.idx{font:400 10px var(--mono);color:var(--accent);margin-right:10px;letter-spacing:0}
.void{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,var(--bg) 0%,var(--bg2) 100%)}
.void .tri{position:absolute;inset:0;opacity:.9}
.void .shard{position:absolute;fill:none;stroke:var(--shard);stroke-width:1;animation:drift 14s ease-in-out infinite}
.void .stream{position:absolute;top:-30%;width:1px;height:30%;background:linear-gradient(180deg,transparent,var(--stream),transparent);animation:fall linear infinite}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8px,-14px) rotate(6deg)}}
@keyframes fall{to{transform:translateY(460%)}}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:var(--hdr) minmax(230px,44vh) minmax(0,1fr)}
.hdr{display:flex;align-items:center;gap:18px;padding:0 var(--gut);min-width:0}
.brand{display:flex;align-items:center;gap:12px;font-weight:500;font-size:13px;letter-spacing:.42em;white-space:nowrap}
.vsep{width:1px;height:16px;background:var(--line);flex:none}
.crumb{font:500 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mem{display:flex;gap:6px;align-items:center;flex:none}
.mem i{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--line);display:block}
.mem i.on{background:var(--accent);border-color:var(--accent)}
.mem i.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.grow{flex:1;min-width:0}
.sync{display:flex;align-items:center;gap:10px;flex:none}
.bar{width:120px;height:1px;background:var(--line);position:relative}
.bar b{position:absolute;left:0;top:-1px;height:3px;background:var(--accent);transition:width .6s}
.big{font:200 20px var(--sans);color:var(--accent)}
.big small{font-size:12px}
.stat{font:300 15px var(--mono)}
.nav{display:flex;gap:4px;flex:none}
.nb{height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;gap:8px;font:500 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border:1px solid transparent}
.nb:hover{color:var(--ink);border-color:var(--line)}
.nb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4}
.nb .dot[hidden]{display:none}
.nb .dot{min-width:16px;height:16px;padding:0 4px;background:var(--gold);color:var(--bg);font:600 9px var(--mono);letter-spacing:0;display:inline-flex;align-items:center;justify-content:center}
.scene{position:relative;min-height:0;overflow:hidden}
.scene>svg.cor{position:absolute;inset:0;width:100%;height:100%}
.insp{position:absolute;right:var(--gut);top:14px;width:360px;max-height:calc(100% - 28px);overflow:auto;padding:14px 18px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:2px solid var(--accent);display:none}
.insp.show{display:block}
.insp h3{font:300 22px var(--sans);margin:6px 0 10px;word-break:break-word}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:6px 0;border-top:1px solid var(--hair);font:400 11.5px var(--mono)}
.prow .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .t{color:var(--muted);font-size:10.5px;text-align:right;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .v{grid-column:1/-1;color:var(--accent-ink);font-size:11px;word-break:break-all;margin-top:-2px}
.prow.nest{cursor:pointer}
.prow.nest .k::after{content:" \203A";color:var(--accent)}
.prow.null .k{color:var(--faint)}
.xbtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.xbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none}
.bot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:20px;padding:8px var(--gut) 20px;min-height:0}
.pan{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 16px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pan::before,.pan::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--stroke);border-style:solid;opacity:.55}
.pan::before{left:0;top:0;border-width:1px 0 0 1px}
.pan::after{right:0;bottom:0;border-width:0 1px 1px 0}
.pan.gold::before,.pan.gold::after{border-color:var(--gold);opacity:.9}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:20px;min-width:0}
.ph>.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph>.lbl:last-child{flex:none;max-width:50%}
.term{flex:1;min-height:0;overflow:auto;font:400 12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink);padding-right:4px}
.term .pr{color:var(--accent)}
.term .err{color:var(--warn)}
.term .warn{color:var(--gold)}
.term .sys{color:var(--muted)}
.term .ok{color:var(--good)}
.term .o{white-space:pre;overflow-x:auto;overflow-y:hidden}
.inrow{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--hair);padding-top:8px;margin-top:6px}
.inrow .pr{font:400 12.5px/1.6 var(--mono);color:var(--accent);white-space:nowrap;padding-top:1px}
#cmd{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;font:400 12.5px/1.6 var(--mono);color:var(--strong);max-height:120px;caret-color:var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font:500 11px var(--sans);letter-spacing:.06em;border:1px solid var(--line);color:var(--ink);background:transparent;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--strong);color:var(--bg);border-color:var(--strong);letter-spacing:.2em;text-transform:uppercase}
.btn.pri:hover{opacity:.9}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--bg);letter-spacing:.2em;text-transform:uppercase}
.btn[disabled]{opacity:.4;cursor:default}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5}
.keys{display:none;gap:6px;margin-top:8px;flex-wrap:wrap}
.key{min-width:48px;height:44px;padding:0 10px;border:1px solid var(--line);font:400 15px var(--mono);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.key:active{background:var(--accent-soft)}
.tbl{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.trow{display:grid;font:400 11.5px var(--mono);border-top:1px solid var(--hair);cursor:pointer}
.trow>span{padding:6px 8px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.head{font:500 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-top:0;cursor:default}
.trow.sel{background:var(--accent-soft);color:var(--accent-ink)}
.trow:not(.head):hover{background:var(--accent-soft)}
.more{font-size:11px;color:var(--muted);padding:8px 0 0}
.empty{color:var(--muted);font-size:12.5px;line-height:1.6}
.brief{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.task{font:400 14px/1.55 var(--sans);color:var(--strong)}
.concept{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.hints{display:flex;flex-direction:column;gap:6px}
.hint{font:400 12px/1.5 var(--mono);color:var(--ink);background:var(--accent-soft);padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.verdict{font-size:12.5px;padding:8px 10px;border-left:2px solid var(--warn);background:var(--warn-soft);color:var(--ink)}
.verdict.good{border-color:var(--good);background:transparent}
.seg{min-height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);font:400 11.5px var(--mono);color:var(--muted)}
.seg .tick{width:7px;height:7px;border:1px solid currentColor;transform:rotate(45deg)}
.seg.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.seg.on .tick{background:var(--accent);border-color:var(--accent)}
.seg.right{border-color:var(--good);color:var(--good)}
.seg.wrong{border-color:var(--warn);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .btn{padding:0 10px}
.stepper .n{font:200 30px var(--sans);min-width:54px;text-align:center}
.field{width:100%;height:38px;border:1px solid var(--line);background:transparent;padding:0 10px;font:400 13px var(--mono);outline:0}
.field:focus{border-color:var(--accent)}
textarea.field{height:auto;min-height:90px;padding:8px 10px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code{font:400 12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--accent-soft);padding:10px 12px;color:var(--ink)}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
.ov.show{display:flex}
.ov .ovh{height:var(--hdr);display:flex;align-items:center;gap:18px;padding:0 var(--gut);flex:none}
.ov .ovb{flex:1;min-height:0;overflow:auto;padding:12px var(--gut) 32px}
.ov h2{font:300 28px var(--sans);letter-spacing:-.01em}
.strand{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px;margin-top:18px}
.strand .grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.pnode{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:56px;padding:10px 12px;text-align:left;border:1px solid var(--line);background:var(--glass)}
.pnode:hover{border-color:var(--accent)}
.pnode .t{font:500 13px var(--sans);color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnode .g{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnode .p{font:400 11px var(--mono);color:var(--muted)}
.pnode.done{border-color:var(--accent)}
.pnode.locked{opacity:.45;cursor:default}
.pnode.locked:hover{border-color:var(--line)}
.brandcard{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;margin-top:18px}
.brandcard .about{padding:16px 18px;border-top:2px solid var(--accent);background:var(--glass)}
.mlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sec{margin-top:34px}
.sec>.lbl{display:block;margin-bottom:4px}
.tb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;margin-top:18px}
.titem{padding:12px 14px;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.titem.sel{border-color:var(--accent)}
.titem .t{font:500 13px var(--sans)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:400 10.5px var(--mono);padding:2px 6px;border:1px solid var(--line);color:var(--muted)}
.jr{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,2fr);gap:14px;padding:10px 0;border-top:1px solid var(--hair);align-items:baseline}
.card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px var(--gut);z-index:3}
.card.show{display:flex}
.card .in{display:grid;grid-template-columns:260px minmax(0,560px);gap:30px;align-items:center;padding:22px 26px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:2px solid var(--accent);max-height:100%;overflow:auto}
.card h2{font:300 30px var(--sans);margin:6px 0 12px}
.card p{font-size:13.5px;line-height:1.6;margin-bottom:8px;color:var(--ink)}
.card svg.dg{width:260px;height:180px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:40;padding:10px 16px;background:var(--strong);color:var(--bg);font:500 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.tabs{display:none;gap:4px;margin-bottom:8px}
.tabs button{height:36px;padding:0 12px;font:500 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
body.desync .scene{animation:rgb .5s steps(2) 1}
body.desync .scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(176,71,63,.12) 3px 4px);animation:flick .5s steps(3) 1}
@keyframes rgb{0%{filter:none;transform:translate(0)}25%{filter:drop-shadow(3px 0 0 rgba(255,0,60,.5)) drop-shadow(-3px 0 0 rgba(0,200,255,.5));transform:translate(-3px,1px)}50%{transform:translate(4px,-1px)}75%{filter:drop-shadow(-2px 0 0 rgba(255,0,60,.4)) drop-shadow(2px 0 0 rgba(0,200,255,.4));transform:translate(-1px,0)}100%{filter:none;transform:translate(0)}}
@keyframes flick{0%,100%{opacity:0}30%,70%{opacity:1}}
body.synced .scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 55% 55%,var(--accent-soft) 0%,transparent 60%);animation:flick .9s ease-out 1}
.n-asm polygon{animation:asm .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes asm{from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--dr))}to{opacity:1;transform:none}}
.fl{animation:flo 7s ease-in-out infinite}
.fl2{animation:flo 9s ease-in-out infinite reverse}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 40s linear infinite}
.spin2{transform-box:fill-box;transform-origin:center;animation:sp 22s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{animation:dr 4.6s cubic-bezier(.5,0,.9,.6) infinite}
@keyframes dr{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(12px,64px);opacity:0}}
.pulse{animation:pu 3.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:.9}}
.node{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:1180px),(pointer:coarse){
  :root{--gut:16px}
  .app{grid-template-rows:var(--hdr) minmax(200px,34vh) minmax(0,1fr)}
  .bot{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .bot .pan.stage,.bot .pan.side{grid-column:2;grid-row:1}
  .bot .pan.stage:not(.tabon),.bot .pan.side:not(.tabon){display:none}
  .tabs{display:flex}
  .crumb{display:none}
  .bar{width:80px}
  .insp{width:320px}
  .strand{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mlist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brandcard,.tb{grid-template-columns:minmax(0,1fr)}
  .card .in{grid-template-columns:minmax(0,1fr)}
  .card svg.dg{display:none}
}
@media (pointer:coarse){.keys{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.keys .key{flex:none}.tools{display:none}.btn{height:44px}.nb{height:44px;min-width:44px}.trow>span{padding:10px 8px 10px 0}}
@media (max-width:760px){
  .app{grid-template-rows:var(--hdr) 210px auto;overflow:auto;height:auto;min-height:100%}
  body{overflow:auto}
  .bot{grid-template-columns:minmax(0,1fr)}
  .bot .pan.stage,.bot .pan.side{grid-column:1;grid-row:auto}
  .pan{min-height:300px}
  .sync .lbl,.stat-lbl{display:none}
  .strand,.mlist{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="void" aria-hidden="true" id="void"></div>
<div class="app" id="app">
  <header class="hdr">
    <div class="brand"><svg width="18" height="18" viewBox="-10 -10 20 20" aria-hidden="true"><polygon points="-8.7,-5 0,-10 8.7,-5 0,0" fill="var(--top)" stroke="var(--stroke)" stroke-width=".8"/><polygon points="0,0 8.7,-5 8.7,5 0,10" fill="var(--right)" stroke="var(--stroke)" stroke-width=".8"/><polygon points="-8.7,-5 0,0 0,10 -8.7,5" fill="var(--left)" stroke="var(--stroke)" stroke-width=".8"/></svg>SYNCLE</div>
    <span class="vsep"></span>
    <span class="crumb" id="crumb">Memory map</span>
    <div class="mem" id="mem" aria-label="Progress in this sequence"></div>
    <div class="grow"></div>
    <div class="sync" title="Prediction accuracy"><span class="lbl">Sync</span><div class="bar"><b id="syncbar" style="width:0%"></b></div><span class="big" id="syncpct">0<small>%</small></span></div>
    <span class="vsep"></span>
    <span class="lbl stat-lbl">Credits</span><span class="stat" id="credits">0</span>
    <span class="vsep"></span>
    <nav class="nav">
      <button class="nb" id="nb-map" title="Memory map"><svg viewBox="0 0 16 16"><path d="M8 1.5l5.6 3.2v6.6L8 14.5l-5.6-3.2V4.7z"/><path d="M8 5l2.8 1.6v3.2L8 11.4 5.2 9.8V6.6z"/></svg><span>Map</span></button>

const CHECK = (() => {
  const P = typeof PS !== "undefined" ? PS : require("./engine.js");
  const C = typeof PATTERNS !== "undefined" ? { PATTERNS, BRANDS, LAB_SCOPES } : require("./content.js");

  function labCtx(build) {
    const ctx = new P.Ctx();
    ctx.mg = { scopes: ["openid", "profile", "User.Read", "email"].concat(C.LAB_SCOPES), account: "kaatje@" + ctx.t.domain };
    ctx.exo = true;
    if (build && build.setup) P.run(build.setup, ctx);
    return ctx;
  }
  function missionCtx() { return new P.Ctx(); }

  const cache = {};
  function refOut(key, src, build) {
    if (cache[key]) return cache[key];
    const ctx = labCtx(build);
    const r = P.run(src, ctx);
    if (r.error) throw new Error("reference failed for " + key + ": " + r.error.text());
    cache[key] = { out: r.out, ctx, host: r.host };
    return cache[key];
  }
  function norm(values, cols) {
    return values.filter((v) => v !== null && v !== undefined).map((v) => {
      if (P.isObj(v) && !(cols.length === 1 && cols[0] === "_")) return cols.map((c) => P.toStr(P.getMember(v, c), true)).join("\u0001");
      if (P.isObj(v)) return P.toStr(v, true);
      return P.toStr(v, true);
    });
  }
  function sameMulti(a, b) { if (a.length !== b.length) return false; const x = a.slice().sort(), y = b.slice().sort(); return x.every((v, i) => v === y[i]); }
  function colsOf(v) { return P.isObj(v) ? Object.keys(v) : null; }

  function rowsVerdict(out, exp, chk) {
    const outObjs = out.filter((v) => v !== null && v !== undefined);
    if (!outObjs.length && exp.length) return { ok: false, why: "No output yet. The target has " + exp.length + " fragment" + (exp.length === 1 ? "" : "s") + "." };
    if (chk.exactCols) {
      const c = colsOf(outObjs[0]);
      const want = chk.cols.map((x) => x.toLowerCase()).sort();
      if (!c || c.map((x) => x.toLowerCase()).sort().join() !== want.join()) return { ok: false, why: "Columns should be exactly: " + chk.cols.join(", ") + (c ? ". You have: " + c.join(", ") : "") + "." };
    }

function stageCols(rows) {

}

function buildPredict(res, src) {
  const st = res.stages;

  const last = st[st.length - 1];
  if (!last.out || last.pending) return null;
  if (/^(Get-Help|Get-Command|Get-Member|Connect-MgGraph|Connect-ExchangeOnline|Disconnect-MgGraph|Get-MgContext|Clear-Host|Format-Table|Format-List|Export-Csv|Out-Null|Write-Host|Get-Content|Get-ChildItem|Update-MgUser)$/.test(last.name || "")) return null;
  if (st.length < 2 && !(last.name && /^Get-/.test(last.name))) return null;
  if (R.predicted && R.predicted.has(src)) return null;
  const out = last.out.filter((v) => v !== null && v !== undefined);
  const prevOut = st.length > 1 && st[st.length - 2].out ? st[st.length - 2].out : [];
  const inCount = st.length > 1 ? prevOut.length : 0;
  const realCols = out.length && PS.isObj(out[0]) ? stageCols(out) : out.length ? ["(plain values)"] : [];
  const prevCols = prevOut.length && PS.isObj(prevOut[0]) ? stageCols(prevOut) : [];
  let opts = Array.from(new Set(realCols.concat(prevCols))).slice(0, 10);
  if (opts.length < 3 && out.length && !PS.isObj(out[0])) opts = Array.from(new Set(["(plain values)"].concat(prevCols.slice(0, 4))));
  if (out.length && !opts.includes("(plain values)") && !PS.isObj(out[0])) opts.unshift("(plain values)");
  const firstCol = out.length && PS.isObj(out[0]) ? realCols[0] : null;
  const fv = (r) => PS.toStr(firstCol ? shortVal(PS.getMember(r, firstCol)) : shortVal(r));
  let firstOpts = [];
  if (out.length) {
    const truth = fv(out[0]);
    const pool = Array.from(new Set(out.slice(1).map(fv).concat(prevOut.map((r) => PS.isObj(r) && firstCol ? PS.toStr(shortVal(PS.getMember(r, firstCol))) : PS.isObj(r) ? "" : PS.toStr(shortVal(r)))))).filter((x) => x && x !== truth);
    const pick = [];

}

    const cOk = p.guess.count === p.truth.count;

function evaluate(fromAnswer) {

    h += "<div class='sec'><span class='lbl'>Review queue</span></div><div style='margin-top:8px'>" + (Object.keys(S.review).length ? Object.keys(S.review).map((k) => { const p = PATTERNS.find((x) => x.id === k); if (!p) return ""; const r = S.review[k]; const due = r.due <= Date.now(); return "<div class='jr'><span>" + esc(p.title) + "</span><span class='mono' style='font-size:12px'>box " + r.box + "</span><span style='font-size:12.5px;color:" + (due ? "var(--gold)" : "var(--muted)") + "'>" + (due ? "due now" : "next in " + Math.ceil((r.due - Date.now()) / DAY) + " day(s)") + "</span></div>"; }).join("") : "<p class='empty'>Patterns you struggle with are scheduled here automatically.</p>") + "</div>";
    h += "<div class='row' style='margin-top:16px'>" + (dueReviews().length ? "<button class='btn gold' id='jrev'>Start review</button>" : "") + "<button class='btn' id='jclr'>Clear journal</button></div>";
  }
  h += "</div>";
  el.innerHTML = h; el.classList.add("show"); wireClose(el);
  if ($("jrev")) $("jrev").onclick = startReview;
  if ($("jclr")) $("jclr").onclick = () => { if (!confirm("Clear the mistake journal?")) return; S.journal = { counts: {}, recent: [] }; save(); openJournal(); };
}

function openSet() {

const KEYS = ["|", "{", "}", "$_", ".", "-", "'", "(", ")", "@{", "=", ",", "Tab"];
function initKeys() {
  $("keys").innerHTML = KEYS.map((k) => "<button class='key' data-k='" + esc(k) + "'>" + esc(k) + "</button>").join("") + "<button class='key' data-k='Run' style='margin-left:auto;min-width:72px'>Run</button>";
  $("keys").querySelectorAll(".key").forEach((b) => { b.onmousedown = (e) => e.preventDefault(); b.onclick = () => { const k = b.dataset.k; if (k === "Tab") complete_(); else if (k === "Run") submit(); else insert(k); }; });
}
function insert(t, back) { const c = $("cmd"); const s = c.selectionStart, e = c.selectionEnd; c.value = c.value.slice(0, s) + t + c.value.slice(e); const p = s + t.length - (back || 0); c.setSelectionRange(p, p); c.focus(); autoGrow(); }
function autoGrow() { const c = $("cmd"); c.style.height = "auto"; c.style.height = Math.min(120, c.scrollHeight) + "px"; }
function submit() { const c = $("cmd"); const v = c.value; if (needsCont(v) && !submit.force) { insert("\n"); return; } c.value = ""; autoGrow(); exec(v); }
let tabState = null;
function complete_() {
  const c = $("cmd");
  const pos = c.selectionStart;
  const before = c.value.slice(0, pos);
  if (tabState && tabState.at === pos && tabState.text === c.value) {
    tabState.i = (tabState.i + 1) % tabState.list.length;
  } else {
    const m = /([\w$@\-.*]+)$/.exec(before);
    if (!m) return;
    const word = m[1];
    let list = [];
    if (word.startsWith("-")) {
      const seg = before.split("|").pop();
      const cm = /^\s*([\w?%-]+)/.exec(seg);
      const cn = cm ? (PS.ALIASES[cm[1].toLowerCase()] || cm[1]).toLowerCase() : "";
      const spec = PS.CMDS[cn];
      const params = spec ? Object.keys(spec.params || {}).concat(["ErrorAction", "OutVariable"]).concat(spec.whatif ? ["WhatIf", "Confirm"] : []) : [];
      list = params.filter((p) => p.toLowerCase().startsWith(word.slice(1).toLowerCase())).map((p) => "-" + p);
    } else if (word.startsWith("$")) {
      const vars = [];
      R.ctx && R.ctx.scopes.forEach((s) => s.forEach((v, k) => vars.push(k)));
      list = Array.from(new Set(vars.concat(["true", "false", "null", "_"]))).filter((v) => v.startsWith(word.slice(1).toLowerCase())).map((v) => "$" + v);
    } else {
      const names = Object.values(PS.CMDS).map((x) => x.name).concat(R.ctx ? Object.values(R.ctx.funcs).map((f) => f.name) : []);
      list = names.filter((n) => n.toLowerCase().startsWith(word.toLowerCase())).sort();
    }
    if (!list.length) return;
    tabState = { start: pos - word.length, list, i: 0 };
  }
  const rep = tabState.list[tabState.i];
  const v = c.value;
  const end = c.selectionStart;
  const s = tabState.start;
  c.value = v.slice(0, s) + rep + v.slice(end);
  const np = s + rep.length;
  c.setSelectionRange(np, np);
  tabState.at = np; tabState.text = c.value;
}
function setTab(t) {
  R.tab = t;
  $("pan-stage").classList.toggle("tabon", t === "stage");
  $("pan-side").classList.toggle("tabon", t === "side");
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
}

function wire() {
  const c = $("cmd");
  c.addEventListener("input", () => { tabState = null; autoGrow(); });
  c.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); return; }
    if (e.key === "Tab") { e.preventDefault(); complete_(); return; }
    if (e.key === "ArrowUp" && !c.value.slice(0, c.selectionStart).includes("\n")) { if (R.hpos > 0) { R.hpos--; c.value = R.hist[R.hpos]; autoGrow(); e.preventDefault(); } return; }
    if (e.key === "ArrowDown" && !c.value.slice(c.selectionEnd).includes("\n")) { if (R.hpos < R.hist.length - 1) { R.hpos++; c.value = R.hist[R.hpos]; } else { R.hpos = R.hist.length; c.value = ""; } autoGrow(); e.preventDefault(); return; }
    if (e.key === "l" && e.ctrlKey) { e.preventDefault(); tclear(); return; }
    if (e.key === "c" && e.ctrlKey && c.selectionStart === c.selectionEnd) { e.preventDefault(); tprint("<div><span class='pr'>PS /Users/kaatje&gt;</span> " + esc(c.value) + "<span class='sys'>^C</span></div>"); c.value = ""; autoGrow(); return; }
    if (e.key === "Escape") { c.value = ""; autoGrow(); }
  });
  document.querySelectorAll("[data-ins]").forEach((b) => { b.onclick = () => insert(b.dataset.ins, +(b.dataset.back || 0)); });
  document.querySelectorAll(".tabs button").forEach((b) => { b.onclick = () => setTab(b.dataset.tab); });
  $("term").addEventListener("click", () => { if (!getSelection().toString()) c.focus(); });
  $("nb-map").onclick = openMap;
  $("nb-review").onclick = startReview;
  $("nb-tool").onclick = () => openTool();
  $("nb-journal").onclick = openJournal;
  $("nb-set").onclick = openSet;
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => renderScene(), 120); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.querySelector(".ov.show") && R.cur) closeOv(); });
}

initVoid(); initKeys(); wire(); hdr(); renderScene(); renderStage(); openMap();
window.__syncle = { S, R, exec, enter, PATTERNS, BRANDS, resolvePredict, openMap };
