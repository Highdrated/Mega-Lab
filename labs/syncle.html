<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syncle — PowerShell memory corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#11161d;--ink2:#2b3440;--mute:#5a6574;--line:#d5dbe3;--soft:#eef1f4;--paper:#f4f6f8;--blue:#1f5fc4;--blue2:#6fa2ff;--red:#c2412f;--red2:#ff8a7a;--amber:#fff8ec;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--soft);overflow:hidden}
button{font:inherit;color:inherit}
code,kbd{font-family:var(--mono)}
.hide{display:none!important}
#app{height:100vh;display:flex;flex-direction:column}
header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:22px;padding:8px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;min-height:44px;padding:0}
.logo span{font-weight:500;letter-spacing:.42em;font-size:14px}
.crumb{font-size:11px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase}
.grow{flex:1}
.meter{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.24em;color:var(--mute)}
.bar{width:140px;height:3px;background:var(--line)}.bar i{display:block;height:3px;background:var(--blue);transition:width .8s}
.num{font-family:var(--mono);font-size:13px;color:var(--ink);letter-spacing:0}
.hbtn{min-height:40px;padding:0 14px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:11px;letter-spacing:.22em;display:inline-flex;align-items:center;gap:8px}
.hbtn:hover{border-color:var(--ink)}
.hbtn kbd{font-size:10px;color:var(--mute);letter-spacing:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:auto}

#corridor .stage{position:relative;flex:1;min-height:470px;overflow:hidden;background:var(--paper)}
.bg{position:absolute;inset:-2%;background:url(img/syncle/corridor.jpg) center 40%/cover no-repeat;animation:breathe 60s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.05)}}
.floor{position:absolute;left:-40%;right:-40%;bottom:-30%;height:90%;transform:perspective(700px) rotateX(72deg);transform-origin:50% 100%;background-image:linear-gradient(rgba(31,95,196,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,95,196,.07) 1px,transparent 1px);background-size:64px 64px;animation:drift 26s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:0 64px}}
.mote{position:absolute;width:3px;height:3px;background:var(--blue);opacity:0;animation:rise 16s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}30%{opacity:.4}100%{transform:translateY(-140px);opacity:0}}
.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail{stroke-dasharray:4 7;animation:flow 5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.gatebg{position:absolute;width:300px;height:168px;transform:translate(-50%,-62%);background:url(img/syncle/gate-halvard.jpg) center/cover no-repeat;-webkit-mask-image:radial-gradient(ellipse at center,#000 45%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 45%,transparent 72%);pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.mem{position:relative;display:flex;justify-content:center;align-items:flex-start}
.bob{position:relative;z-index:2;animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.turn{display:block;animation:turn 16s ease-in-out infinite;overflow:visible}
@keyframes turn{0%{transform:scaleX(1)}25%{transform:scaleX(.18)}50%{transform:scaleX(-1)}75%{transform:scaleX(.18)}100%{transform:scaleX(1)}}
.beam{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:linear-gradient(to top,rgba(31,95,196,.32),rgba(31,95,196,0));animation:beamp 6s ease-in-out infinite;z-index:1}
@keyframes beamp{0%,100%{opacity:.55}50%{opacity:1}}
.ring{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:0}
.ring ellipse{animation:orbit 18s linear infinite}
@keyframes orbit{to{stroke-dashoffset:-120}}
.halo{position:absolute;left:50%;top:40%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(31,95,196,.45);animation:halo 5s ease-out infinite}
@keyframes halo{from{width:30%;height:30%;opacity:.9}to{width:180%;height:180%;opacity:0}}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(31,95,196,.55);animation:spark 5s ease-in-out infinite;z-index:3}
@keyframes spark{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.nlabel{text-align:center;padding:4px 8px;background:rgba(255,255,255,.66);border:1px solid transparent;white-space:nowrap}
.nlabel b{display:block;font-family:var(--mono);font-weight:400}
.nlabel small{display:block;font-size:9px;letter-spacing:.26em;color:var(--mute);margin-top:3px}
.node.sel .nlabel{background:#fff;border-color:#c9d1db}
.due{position:absolute;top:-6px;right:-10px;font-size:9px;letter-spacing:.18em;background:var(--amber);border:1px solid #f0d9ae;padding:2px 5px;z-index:4}
.seqs{position:absolute;left:24px;top:18px;display:flex;flex-direction:column;gap:2px;z-index:4;background:rgba(255,255,255,.74);border:1px solid var(--line);padding:10px 0;width:250px}
.seqs h4{margin:0 14px 6px;font-size:10px;letter-spacing:.3em;color:var(--mute);font-weight:500}
.seqs .tier{font-size:9px;letter-spacing:.3em;color:var(--blue);margin:8px 14px 2px}
.seqb{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 14px;border:0;background:none;text-align:left;cursor:pointer;font-size:13px;color:var(--ink2)}
.seqb[disabled]{cursor:default;color:#9aa4b2}
.seqb.on{background:#fff;color:var(--ink);box-shadow:inset 2px 0 0 var(--blue)}
.seqb .k{font-family:var(--mono);font-size:11px;width:16px;color:var(--mute)}
.seqb .s{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute)}
.stitle{position:absolute;right:28px;top:20px;text-align:right;z-index:4;max-width:360px}
.stitle span{display:block;font-size:11px;letter-spacing:.3em;color:var(--mute)}
.stitle h2{margin:4px 0 6px;font-weight:300;font-size:30px}
.stitle p{margin:0;font-size:13px;line-height:1.55;color:var(--ink2);background:rgba(255,255,255,.6);padding:6px 10px}
.detail{flex:none;display:flex;flex-wrap:wrap;gap:28px;padding:24px 28px 28px;border-top:1px solid var(--line);background:#fff}
.detail .l{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:10px}
.detail .r{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--blue);text-transform:uppercase}
.detail h3{margin:0;font-family:var(--mono);font-weight:500;font-size:26px}
.detail p{margin:0;font-size:15px;line-height:1.6;color:var(--ink2)}
.codebox{font-family:var(--mono);font-size:13px;background:#f1f4f7;border:1px solid #dde2e9;padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.passes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pass{border-top:2px solid #c3ccd8;padding-top:10px;font-size:12px;color:var(--mute);line-height:1.45}
.pass b{display:block;font-size:11px;letter-spacing:.2em;color:var(--ink);font-weight:600;margin-bottom:4px}
.pass.done{border-color:var(--blue)}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 26px;background:var(--ink);color:#fff;border:0;cursor:pointer;font-size:12px;letter-spacing:.3em}
.go:hover{background:#26303d}
.go.blue{background:var(--blue)}
.go.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.go[disabled]{background:#c3ccd8;cursor:default}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.mutetxt{font-size:13px;color:var(--mute)}

.flowband{flex:none;position:relative;height:172px;background:var(--paper);overflow:hidden;border-bottom:1px solid var(--line)}
.flowband .fbg{position:absolute;inset:0;background:url(img/syncle/corridor.jpg) center 45%/cover no-repeat;opacity:.5}
.fline{position:absolute;left:10%;right:10%;top:83px;height:1px;background:#c3ccd8}
.fnode{position:absolute;top:66px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:2}
.fnode .d{width:34px;height:34px;border:1.5px solid var(--blue);background:#fff;transform:rotate(45deg)}
.fnode.lit .d{background:rgba(31,95,196,.14);box-shadow:0 0 0 7px rgba(31,95,196,.07)}
.fnode b{font-family:var(--mono);font-size:13px;font-weight:500;margin-top:4px;white-space:nowrap;background:rgba(244,246,248,.85);padding:0 6px}
.fnode small{font-size:11px;letter-spacing:.06em;color:var(--mute);white-space:nowrap}
.frag{position:absolute;left:10%;opacity:0;top:83px;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid var(--blue);background:rgba(31,95,196,.2);transform:rotate(45deg);animation:pass 14s linear infinite;z-index:1}
@keyframes pass{0%{left:10%;opacity:0}6%{opacity:1}94%{opacity:1}100%{left:90%;opacity:0}}
.flowlabel{position:absolute;left:28px;top:12px;font-size:10px;letter-spacing:.3em;color:var(--mute)}
.lastrun{position:absolute;right:28px;top:12px;font-family:var(--mono);font-size:12px;color:var(--blue)}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.15fr) 300px;gap:18px;padding:18px 24px 22px}
.panel{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.phead{display:flex;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e3e8ee}
.tab{min-height:44px;padding:0 14px;border:0;background:none;cursor:pointer;font-size:11px;letter-spacing:.2em;color:var(--mute)}
.tab.on{color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
.tab.done::after{content:"";display:inline-block;width:6px;height:6px;background:var(--blue);transform:rotate(45deg);margin-left:8px;vertical-align:1px}
.pbody{flex:1;overflow:auto;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.6;color:var(--ink2)}
.pbody h5{margin:6px 0 0;font-size:11px;letter-spacing:.26em;color:var(--mute);font-weight:500;text-transform:uppercase}
.pbody p{margin:0}
.pbody ul{margin:0;padding-left:18px}
.pbody li{margin:2px 0}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:baseline;border-bottom:1px solid #eef1f4;padding:6px 0}
.chip code{font-size:13px;color:var(--ink);background:#f1f4f7;padding:2px 6px;justify-self:start;word-break:break-all}
.chip span{font-size:13px}
.traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.trapc{background:var(--amber);border:1px solid #f0d9ae;padding:10px 12px;font-size:13px;line-height:1.5}
.trapc b{display:block;font-size:12px;margin-bottom:3px;color:var(--ink)}
.ask{font-size:16px;color:var(--ink);line-height:1.5}
.tpl{font-family:var(--mono);font-size:13px;background:var(--ink);color:#d8dee7;padding:16px;line-height:2.1;word-break:break-word}
.gap{font-family:var(--mono);font-size:13px;width:var(--w,140px);padding:3px 6px;border:0;border-bottom:1.5px solid var(--blue2);background:#1c2532;color:#fff}
.gap:focus{outline:none;background:#243042}
.say{border-left:2px solid var(--blue);padding:4px 0 4px 14px;color:var(--ink)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:3px;background:#dde2e9}
.steps i.on{background:var(--blue)}
.realsteps{margin:0;padding-left:20px;font-family:var(--mono);font-size:12.5px;line-height:1.9}
.badge{display:inline-block;font-size:10px;letter-spacing:.2em;padding:3px 8px;border:1px solid var(--line);color:var(--mute)}
.badge.ok{border-color:var(--blue);color:var(--blue)}

.term{background:var(--ink);color:#d8dee7;display:flex;flex-direction:column;min-height:0}
.thead{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid #263040;font-size:10px;letter-spacing:.22em;color:#8a96a6}
.tout{flex:1;overflow:auto;padding:14px 16px 6px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre;tab-size:4}
.tout .e{color:var(--red2);white-space:pre-wrap}
.tout .h{color:#9fb1c8;white-space:pre-wrap}
.tout .c{color:#fff}
.tout .echo{white-space:pre-wrap;word-break:break-all}
.tout .p{color:var(--blue2)}
.tout .n{color:#6f7d90;white-space:pre-wrap;font-family:Inter,sans-serif;font-size:12.5px}
.tin{display:flex;align-items:center;gap:8px;padding:10px 16px 14px;font-family:var(--mono);font-size:12.5px;border-top:1px solid #1d2633}
.tin .p{color:var(--blue2);white-space:nowrap}
.tin input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;caret-color:var(--blue2)}
.tin input:focus{outline:none}
.tin.busy input{color:#8a96a6}
.thint{padding:0 16px 10px;font-size:11px;color:#6f7d90;font-family:Inter,sans-serif}
.term.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px var(--red2)}100%{box-shadow:inset 0 0 0 2px transparent}}

.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.junie{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch}
.jimg{height:190px;background-size:contain;background-repeat:no-repeat;background-position:center;animation:jfloat 8s ease-in-out infinite}
@keyframes jfloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.j-idle{background-image:url(img/syncle/junie-idle.png)}.j-hint{background-image:url(img/syncle/junie-hint.png)}.j-desync{background-image:url(img/syncle/junie-desync.png)}.j-success{background-image:url(img/syncle/junie-success.png)}
.jtext{padding:2px 18px 18px;display:flex;flex-direction:column;gap:10px}
.jtext small{font-size:10px;letter-spacing:.26em;color:var(--mute)}
.jtext p{margin:0;font-size:14px;line-height:1.55}
.askj{min-height:44px;padding:0 16px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;font-size:11px;letter-spacing:.22em}
.askj[disabled]{border-color:#c3ccd8;color:#8a96a6;cursor:default}
.minicard{background:#fff;border:1px solid var(--line);padding:14px 16px;font-size:13px;line-height:1.55;color:var(--ink2)}
.minicard h6{margin:0 0 6px;font-size:10px;letter-spacing:.26em;color:var(--mute);font-weight:500}

.tickets{display:flex;flex-direction:column;gap:10px}
.ticket{border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.ticket.on{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.ticket.done{opacity:.6}
.ticket small{font-size:10px;letter-spacing:.24em;color:var(--mute)}
.ticket b{font-size:15px;color:var(--ink)}
.ticket p{margin:0;font-size:13px}
.gatehero{height:150px;background:url(img/syncle/gate-halvard.jpg) center/cover no-repeat;border:1px solid var(--line)}

.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(238,241,244,.9)}
.ds{width:min(920px,94vw);max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--line)}
.dshero{position:relative;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;background:#f4f5f7}
.dshero .dbg{position:absolute;inset:0;background:url(img/syncle/desync.jpg) center/cover no-repeat;animation:breathe 30s ease-in-out infinite alternate}
.dshero .scan{position:absolute;left:0;right:0;height:2px;background:rgba(194,65,47,.35);animation:scan 9s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
.dshero small{position:relative;font-size:11px;letter-spacing:.4em;color:var(--red)}
.dshero h2{position:relative;margin:0;font-size:44px;font-weight:300;letter-spacing:.28em;animation:glitch 9s steps(1) infinite}
@keyframes glitch{0%,86%,100%{transform:none;clip-path:none}88%{transform:translateX(-6px);clip-path:inset(20% 0 52% 0)}91%{transform:translateX(5px);clip-path:inset(60% 0 12% 0)}94%{transform:translateX(-2px);clip-path:none}}
.dshero p{position:relative;margin:0;font-size:14px;background:rgba(255,255,255,.75);padding:4px 12px}
.dsbody{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;padding:22px 26px 26px}
.dsbody h5{margin:0 0 8px;font-size:10px;letter-spacing:.26em;color:var(--mute);font-weight:500}
.dsbody pre{margin:0 0 14px;font-family:var(--mono);font-size:12.5px;background:var(--ink);color:#d8dee7;padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.dsbody pre.e{color:var(--red2)}
.dsj{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:6px 14px 6px 4px}
.dsj .jimg{width:130px;height:130px;flex:none}
.sy{width:min(560px,92vw);background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 26px 26px;text-align:center}
.sy .jimg{width:220px;height:220px}
.sy small{font-size:11px;letter-spacing:.4em;color:var(--blue)}
.sy h2{margin:0;font-weight:300;letter-spacing:.24em;font-size:30px}
.sy p{margin:6px 0 10px;color:var(--ink2);font-size:14px;line-height:1.55}

#drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:#fff;border-left:1px solid var(--line);z-index:20;transform:translateX(105%);transition:transform .35s ease;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(17,22,29,.06)}
#drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.dsearch{margin:14px 18px 4px;padding:10px 12px;border:1px solid var(--line);font:inherit;font-size:13px}
.dbody{flex:1;overflow:auto;padding:6px 18px 24px}
.dgroup{margin-top:16px}
.dgroup h6{margin:0 0 6px;font-size:10px;letter-spacing:.3em;color:var(--mute);font-weight:500}
.centry{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eef1f4;background:none;padding:9px 4px;cursor:pointer}
.centry:hover{background:#f6f8fa}
.centry code{display:block;font-size:12.5px;color:var(--ink);word-break:break-word}
.centry span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.centry.locked code{color:#9aa4b2}
.rules{background:var(--amber);border:1px solid #f0d9ae;padding:10px 14px;font-size:12.5px;line-height:1.6;margin-top:12px}
.rules ol{margin:4px 0 0;padding-left:18px}
.jentry{border-bottom:1px solid #eef1f4;padding:9px 2px;font-size:13px}
.jentry b{font-family:var(--mono);font-weight:400}
.jentry small{display:block;color:var(--mute);font-size:11px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;font-size:13px;z-index:40;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){.work{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.junie{flex:1 1 320px;flex-direction:row}.jimg{width:160px;height:160px;flex:none}}
@media (max-width:820px){body{overflow:auto}.view{position:static}.work{grid-template-columns:1fr}.seqs{position:static;width:auto;margin:0}.stitle{display:none}.passes{grid-template-columns:repeat(2,minmax(0,1fr))}.dsbody{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>

const GRADER = (() => {
  const E = typeof PS !== "undefined" ? PS : require("./engine.js");
  const C = typeof MEMORIES !== "undefined" ? { MEMORIES, GATE } : require("./content.node.js");
  function makeCtx(setup) {
    const ctx = new E.Ctx();
    if (setup === "read" || setup === "exo") E.run("Connect-MgGraph -Scopes User.Read.All -NoWelcome", ctx);
    if (setup === "write") E.run("Connect-MgGraph -Scopes User.ReadWrite.All -NoWelcome", ctx);
    if (setup === "exo") E.run("Connect-ExchangeOnline -ShowBanner:$false", ctx);
    ctx.host = [];
    return ctx;
  }
  function text(res) { return E.formatOut(res.out, 120).replace(/[ \t]+$/gm, "").trim(); }
  function refText(chk, setup) {
    const ctx = makeCtx(chk.needExo ? "exo" : setup);
    return text(E.run(chk.out, ctx));
  }
  function verdict(chk, setup, ctx, res) {
    if (!res) return false;
    if (res.error) return false;
    if (chk.fn) { try { return !!chk.fn(ctx, res); } catch (e) { return false; } }
    if (chk.out) { if (chk.needExo && !ctx.exo) return false; return text(res) === refText(chk, setup); }
    return false;
  }
  function fillTpl(tpl, vals) { let i = 0; return tpl.replace(/\[\[([^\]]*)\]\]/g, () => (vals[i++] || "")); }
  function gapsOf(tpl) { const out = []; tpl.replace(/\[\[([^\]]*)\]\]/g, (m, a) => { out.push(a); return m; }); return out; }
  return { makeCtx, verdict, text, fillTpl, gapsOf, refText };
})();
if (typeof module !== "undefined") module.exports = GRADER;

const KEY = "syncle.v1";

function doneOf(id) { return S.done[id] || (S.done[id] = {}); }
function synced(id) { return !!(S.done[id] && S.done[id].recall); }
function memsOf(seq) { return MEMORIES.filter((m) => m.seq === seq); }
function seqProgress(seq) { const ms = memsOf(seq); return [ms.filter((m) => synced(m.id)).length, ms.length]; }
function gateOpen() { return MEMORIES.every((m) => synced(m.id)); }
function syncPct() { const total = MEMORIES.length + GATE.tickets.length; const n = MEMORIES.filter((m) => synced(m.id)).length + GATE.tickets.filter((t) => S.gate[t.id]).length; return Math.round(n / total * 100); }

}

  $("goMem").onclick = () => enterSelected();
}

function enterSelected() {
  const ms = memsOf(S.seqSel);
  if (S.selMem < ms.length) openMemory(ms[S.selMem]);
  else if (S.seqSel === 0) { S.seqSel = 1; S.selMem = null; save(); renderCorridor(); }
  else if (gateOpen()) openGate();

function resetConsole(setup) {
  R.setup = setup;
  R.ctx = GRADER.makeCtx(setup);
  $("tout").innerHTML = "";
  tline(setup === "none" ? "Fresh pwsh window. Nothing is connected yet." : setup === "write" ? "Lab session: connected to Graph with User.ReadWrite.All." : setup === "exo" ? "Lab session: connected to Graph and Exchange." : "Lab session: connected to Graph with User.Read.All.", "n");
  tstate();
}
function tstate() { const c = R.ctx; $("tstate").textContent = (c.mg ? "GRAPH · " + c.mg.scopes.filter((s) => /\./.test(s) && s !== "User.Read").join(", ") : "NOT CONNECTED") + (c.exo ? " · EXCHANGE" : ""); }
function tline(t, cls) { const o = $("tout"); const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = t; o.appendChild(d); o.scrollTop = o.scrollHeight; }
function tcols() { const w = $("tout").clientWidth - 32; return Math.max(60, Math.floor(w / 7.55)); }

function exec(src, opts) {
  opts = opts || {};
  const o = $("tout");
  const echo = document.createElement("div");
  echo.className = "echo";
  echo.innerHTML = '<span class="p">PS /Users/kaatje&gt; </span><span class="c">' + esc(src) + "</span>";
  o.appendChild(echo);
  const res = PS.run(src, R.ctx);
  for (const h of res.host) { if (h.clear) { o.innerHTML = ""; continue; } if (h.err) tline(h.err, "e"); else if (h.text !== undefined) tline(h.text, "h"); }
  const txt = PS.formatOut(res.out, tcols());
  if (txt && txt.trim()) tline(txt.replace(/^\n+/, "").replace(/\s+$/, "") + "\n", "");
  if (res.error) tline(res.error.text ? res.error.text() : String(res.error.message), "e");
  o.scrollTop = o.scrollHeight;
  R.lastRes = res;
  tstate();
  lastRun(res, src);
  return res;
}
function lastRun(res, src) {
  const el = $("lastrun"); if (!el) return;
  el.textContent = res.error ? "last run: error" : "last run: " + res.out.length + (res.out.length === 1 ? " object" : " objects");
}

function errHelp(text) { for (const [re, msg] of ERR_HELP) if (re.test(text)) return msg; return null; }

function openMemory(m) {
  closeOverlay();
  R.view = "memory"; R.gate = false; R.mem = m; R.hint = 0; R.watchStep = 0;
  $("corridor").classList.add("hide"); $("memory").classList.remove("hide");
  $("crumb").textContent = SEQUENCES[m.seq].name + " · " + m.name;
  const dn = doneOf(m.id);
  R.phase = !dn.brief ? "brief" : !dn.watch ? "watch" : !dn.trace ? "trace" : !dn.recall ? "recall" : dueReview(m.id) ? "recall" : "brief";

function flowband(flow, label) {
  const n = flow.length;
  let h = '<div class="fbg" aria-hidden="true"></div><div class="fline" aria-hidden="true"></div><span class="flowlabel">' + esc(label) + '</span><span class="lastrun" id="lastrun"></span>';
  flow.forEach((f, i) => {
    const x = 10 + (80 / (n - 1)) * i;
    h += '<div class="fnode' + (i === n - 1 ? " lit" : "") + '" style="left:' + x + '%"><div class="d"></div><b>' + esc(f[0]) + "</b><small>" + esc(f[1]) + "</small></div>";
  });
  for (let i = 0; i < 6; i++) h += '<div class="frag" aria-hidden="true" style="animation-delay:' + (i * 2.3).toFixed(1) + 's"></div>';
  $("flowband").innerHTML = h;
}

function setPhase(p) {

function playStep(m) {
  if (R.busy) return;
  const st = m.watch[R.watchStep]; R.busy = true;
  const inp = $("cmd"); $("tin").classList.add("busy");
  let k = 0;
  const tick = () => {
    inp.value = st.code.slice(0, ++k);
    if (k < st.code.length) setTimeout(tick, 18);
    else setTimeout(() => {
      inp.value = ""; $("tin").classList.remove("busy"); R.busy = false;
      exec(st.code);
      R.watchStep++;
      if (R.watchStep >= m.watch.length && !doneOf(m.id).watch) { doneOf(m.id).watch = true; save(); earn(EARN.watch, "watched " + m.name); }
      renderWatch(m); junie();
    }, 260);
  };
  tick();
}

function renderTrace(m) {
  const t = m.trace;
  let gi = 0;
  const tpl = esc(t.tpl).replace(/\[\[([^\]]*)\]\]/g, (_, a) => '<input class="gap" data-g="' + (gi++) + '" style="--w:' + Math.max(90, a.length * 9 + 26) + 'px" aria-label="Gap ' + gi + '" autocomplete="off" spellcheck="false">');
  $("pbody").innerHTML = '<p class="ask">' + esc(t.ask) + '</p><div class="tpl">' + tpl + "</div>" +
    (t.after ? '<p class="mutetxt">Runs afterwards automatically: <code>' + esc(t.after.join("; ")) + "</code></p>" : "") +
    '<div class="row"><button class="go blue" type="button" id="runTrace">RUN</button><span class="mutetxt">Enter in a gap also runs it</span></div>';
  const gaps = $("pbody").querySelectorAll(".gap");
  gaps.forEach((g) => g.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); runTrace(m); } }));
  $("runTrace").onclick = () => runTrace(m);
  if (gaps[0]) gaps[0].focus();
  $("cmd").placeholder = "Fill the gaps on the left, or experiment here first.";
}
function runTrace(m) {
  const t = m.trace;
  const vals = Array.from($("pbody").querySelectorAll(".gap")).map((g) => g.value.trim());
  if (vals.some((v) => !v)) { R.jlineOverride = "Fill every gap first. An empty gap is still a mistake PowerShell would refuse."; junie(); return; }
  const cmd = GRADER.fillTpl(t.tpl, vals);
  resetConsole(t.setup || m.setup);
  let res = exec(cmd);
  if (!res.error) for (const a of t.after || []) { const r2 = exec(a); if (r2.error) res = r2; }
  const ok = GRADER.verdict(t.check, t.setup || m.setup, R.ctx, res);
  if (ok) {
    const first = !doneOf(m.id).trace;
    doneOf(m.id).trace = true; save();
    if (first) earn(Math.max(5, EARN.trace - R.hint * 3), "traced " + m.name);
    synced_overlay("Trace complete", "The command ran exactly as it would in your real tenant. Now the gaps disappear.", () => setPhase("recall"), "GO TO RECALL");
  } else desync(m, cmd, res, t.wrong);
}

function checkRecall(res) {
  const m = R.mem;

    if (!R.flagged[key]) { R.flagged[key] = true; journal(m.id, "error", res.error.text ? res.error.text() : ""); }

  }
}
function nextMemory(m) { const i = MEMORIES.indexOf(m); return MEMORIES[i + 1] && MEMORIES[i + 1].seq === m.seq ? MEMORIES[i + 1] : null; }

function renderReal(m) {
  const dn = doneOf(m.id);
  $("pbody").innerHTML = '<span class="badge' + (dn.real ? " ok" : "") + '">' + (dn.real ? "DONE ON A REAL TENANT" : "OPTIONAL · READ-ONLY UNLESS IT SAYS TEST ACCOUNT") + "</span>" +

}

function sidecard(m) {
  if (R.gate) { $("sidecard").innerHTML = "<h6>TAKEOVER RULES</h6>Look before you change. Read-only first, write scopes only for the tickets that need them. Changes to people who are not in a ticket count as collateral damage."; return; }
  $("sidecard").innerHTML = "<h6>IN THE CHEAT SHEET</h6>" + m.cheat.map(([c, d]) => '<div style="margin:6px 0"><code style="font-size:12px;word-break:break-word">' + esc(c) + '</code><div class="mutetxt" style="font-size:12px">' + esc(d) + "</div></div>").join("") + '<button class="hbtn" type="button" id="openCheat" style="margin-top:8px">OPEN FULL SHEET</button>';
  $("openCheat").onclick = () => drawer(true);
}

function hintsFor() {
  if (R.gate) { const t = GATE.tickets[R.gatePick]; return t ? [t.hint] : []; }
  const m = R.mem;
  if (R.phase === "trace") return m.traceHints;
  if (R.phase === "recall") return m.recallHints;
  return [];
}
function junie() {
  const hs = hintsFor(), max = hs.length;
  let cls = "j-idle", step = "STANDING BY", line;
  const m = R.mem;
  if (R.gate) line = "Five tickets, one tenant. Read each one twice: the ticket is what the user says, not always what the fix is.";
  else line = { brief: "Read this first. Everything after it builds on these few ideas, and the traps box is where real tenants bite.", watch: R.watchStep >= (m ? m.watch.length : 0) ? "Seen it all. Ready to try with gaps?" : "Watch what changes between the steps, not just the result.", trace: "Fill the gaps and run. I am here if you get stuck.", recall: "Your turn, no gaps. Ask me if you need a nudge.", real: "Lab and reality should match exactly. This is where you check." }[R.phase];
  if (R.hint > 0) { cls = "j-hint"; step = "HINT " + R.hint + " OF " + max; line = hs[R.hint - 1]; }
  if (R.jlineOverride) { line = R.jlineOverride; cls = R.jstate === "desync" ? "j-desync" : cls; step = R.jstate === "desync" ? "SOMETHING WENT WRONG" : step; R.jlineOverride = null; R.jstate = null; }
  $("jimg").className = "jimg " + cls;
  $("jstep").textContent = "JUNIE · " + step;
  $("jline").textContent = line;
  const b = $("askj");
  b.disabled = max === 0 || R.hint >= max;
  b.textContent = max === 0 ? "NO HINTS NEEDED" : R.hint >= max ? "ALL HINTS USED" : R.hint === 0 ? "ASK JUNIE" : "NEXT HINT";
  $("jleft").textContent = max && R.hint < max ? (max - R.hint) + " left" : "";
}
$("askj").onclick = () => {
  const hs = hintsFor(); if (R.hint >= hs.length) return;
  R.hint++;
  if (!R.gate && R.hint === hs.length) journal(R.mem.id, "answer shown", hs[hs.length - 1]);
  junie();
};

function overlay(html) { const o = $("ov"); o.innerHTML = html; o.classList.remove("hide"); const b = o.querySelector("button"); if (b) b.focus(); }
function closeOverlay() { $("ov").classList.add("hide"); $("ov").innerHTML = ""; }
function desync(m, cmd, res, wrong) {
  const err = res.error ? (res.error.text ? res.error.text() : String(res.error.message)) : null;
  const help = err ? errHelp(err) : null;
  const shown = err || (PS.formatOut(res.out, 90) || "").trim() || "(no output)";
  const why = help || (wrong + (err ? "" : " The command ran without an error, but it did not produce what the ticket asked for."));
  journal(m.id, err ? "error" : "wrong result", err || cmd);
  const counts = res.error ? "PowerShell refused to run it." : "It ran, but the result is not what the memory expected.";
  overlay('<div class="ds" role="dialog" aria-label="Desynchronized"><div class="dshero"><div class="dbg" aria-hidden="true"></div><div class="scan" aria-hidden="true"></div><small>MEMORY REJECTED</small><h2>DESYNCHRONIZED</h2><p>' + esc(counts) + "</p></div>" +
    '<div class="dsbody"><div><h5>WHAT YOU RAN</h5><pre>' + esc(cmd) + "</pre><h5>" + (err ? "WHAT POWERSHELL SAID" : "WHAT CAME BACK") + '</h5><pre class="' + (err ? "e" : "") + '">' + esc(shown.slice(0, 900)) + "</pre></div>" +
    '<div style="display:flex;flex-direction:column;gap:14px"><div class="dsj"><div class="jimg j-desync" role="img" aria-label="Junie, a little shaken"></div><div><h5 style="color:var(--red)">JUNIE</h5><p style="margin:0;font-size:14px;line-height:1.55">' + esc(why) + '</p></div></div><p class="mutetxt" style="margin:0">Saved to your journal. This memory comes back for review tomorrow.</p><div class="row"><button class="go" type="button" id="resync">RESYNC</button></div></div></div></div>');
  $("resync").onclick = () => { closeOverlay(); const g = $("pbody").querySelector(".gap"); if (g) g.focus(); };
}
function synced_overlay(title, text, next, nextLabel, alt) {
  overlay('<div class="sy" role="dialog" aria-label="' + esc(title) + '"><div class="jimg j-success" role="img" aria-label="Junie, happy"></div><small>MEMORY ACCEPTED</small><h2>' + esc(title.toUpperCase()) + "</h2><p>" + esc(text) + '</p><div class="row" style="justify-content:center"><button class="go blue" type="button" id="syNext">' + esc(nextLabel) + "</button>" + (alt ? '<button class="go ghost" type="button" id="syAlt">NEXT MEMORY</button>' : "") + '<button class="go ghost" type="button" id="syStay">STAY HERE</button></div></div>');
  $("syNext").onclick = () => { closeOverlay(); next(); };
  if (alt) $("syAlt").onclick = () => { closeOverlay(); alt(); };
  $("syStay").onclick = () => closeOverlay();
}

function openGate() {
  closeOverlay();

  $("tabs").innerHTML = '<button class="tab on" type="button">TICKETS</button>';
  resetConsole("none");
  R.gateBaseline = R.ctx.t.users.map((u) => [u.UserPrincipalName, u.AccountEnabled, u.Department, u.JobTitle].join("|"));
  R.gateHist = [];
  R.gatePick = GATE.tickets.findIndex((t) => !S.gate[t.id]); if (R.gatePick < 0) R.gatePick = 0;

function renderGate() {
  $("pbody").innerHTML = '<div class="gatehero" role="img" aria-label="Halvard and Co warehouse"></div><p>' + esc(GATE.story) + '</p><div class="tickets">' +
    GATE.tickets.map((t, i) => '<div class="ticket' + (i === R.gatePick ? " on" : "") + (S.gate[t.id] ? " done" : "") + '"><small>TICKET ' + (i + 1) + " · FROM " + esc(t.from.toUpperCase()) + (S.gate[t.id] ? " · CLOSED" : "") + "</small><b>" + esc(t.title) + "</b><p>" + esc(t.body) + "</p></div>").join("") + "</div>" +
    '<p class="mutetxt">The console starts fresh: nothing connected. Each ticket closes the moment your command does what it asks.</p>';
}
function checkGate(res) {
  const t = GATE.tickets[R.gatePick];
  if (res.error) {
    const help = errHelp(res.error.text ? res.error.text() : "");
    R.jlineOverride = help || "Read the red text: the first line usually names the problem."; R.jstate = "desync"; junie();
    $("term").classList.remove("flash"); void $("term").offsetWidth; $("term").classList.add("flash");
  }
  const collateral = R.ctx.t.users.filter((u, i) => {
    const now = [u.UserPrincipalName, u.AccountEnabled, u.Department, u.JobTitle].join("|");
    return now !== R.gateBaseline[i] && !/corvin\.ashby|liora\.penn/i.test(u.UserPrincipalName);
  });
  if (collateral.length) { R.jlineOverride = "Careful: you changed " + collateral.map((u) => u.DisplayName).join(", ") + ", who is not in any ticket. In a real tenant that is a phone call from someone very confused."; R.jstate = "desync"; junie(); }
  if (!t) return;
  let ok = false; try { ok = t.check(R.ctx, R.gateHist, res); } catch (e) { ok = false; }
  if (ok && !S.gate[t.id]) {
    S.gate[t.id] = true; save(); earn(25, "closed " + t.title);
    const nx = GATE.tickets.findIndex((x) => !S.gate[x.id]);
    if (nx < 0) { synced_overlay("Takeover complete", "Halvard & Co is mapped, tidied and safe. Sequence 2, Mailboxes, is next when it is built.", () => renderCorridor(), "BACK TO THE CORRIDOR"); }
    else { R.gatePick = nx; R.hint = 0; toast("Ticket closed. Next: " + GATE.tickets[nx].title); }
    renderGate(); junie();
  }
}

$("cmd").addEventListener("keydown", (e) => {
  const inp = e.target;
  if (R.busy) { e.preventDefault(); return; }
  if (e.key === "Enter") {
    e.preventDefault();
    const src = inp.value; inp.value = "";
    if (!src.trim()) { const d = document.createElement("div"); d.innerHTML = '<span class="p">PS /Users/kaatje&gt; </span>'; $("tout").appendChild(d); return; }
    R.hist.push(src); R.hpos = R.hist.length;
    if (/^\s*(cls|clear|clear-host)\s*$/i.test(src)) { $("tout").innerHTML = ""; return; }
    const res = exec(src);
    if (R.gate) { R.gateHist.push(src); checkGate(res); }
    else if (R.phase === "recall") checkRecall(res);
    else if (res.error) { const help = errHelp(res.error.text ? res.error.text() : ""); if (help) { R.jlineOverride = help; R.jstate = "desync"; junie(); } }
    return;
  }
  if (e.key === "ArrowUp") { e.preventDefault(); if (R.hpos > 0) { R.hpos--; inp.value = R.hist[R.hpos]; } return; }
  if (e.key === "ArrowDown") { e.preventDefault(); if (R.hpos < R.hist.length - 1) { R.hpos++; inp.value = R.hist[R.hpos]; } else { R.hpos = R.hist.length; inp.value = ""; } return; }
  if (e.key === "Escape") { inp.value = ""; return; }
  if (e.key === "l" && e.ctrlKey) { e.preventDefault(); $("tout").innerHTML = ""; return; }
  if (e.key === "Tab") { e.preventDefault(); complete(inp, e.shiftKey); return; }
  R.tab = null;
});
function complete(inp, back) {
  const v = inp.value, pos = inp.selectionStart;
  if (R.tab && R.tab.full === v) { R.tab.i = (R.tab.i + (back ? -1 : 1) + R.tab.list.length) % R.tab.list.length; apply(); return; }
  const before = v.slice(0, pos), after = v.slice(pos);
  const m = /([\w-]*)$/.exec(before); const word = m[1]; const start = before.length - word.length;
  let list = [];
  if (word.startsWith("-")) {
    const seg = before.slice(0, start).split(/[|;]/).pop().trim();
    const cname = (seg.split(/\s+/)[0] || "").toLowerCase();
    const al = PS.ALIASES[cname]; const spec = PS.CMDS[(al || cname).toLowerCase()];
    if (spec) {
      const names = Object.keys(spec.params || {}).concat(spec.whatif ? ["WhatIf", "Confirm"] : []).concat(["ErrorAction", "OutVariable", "Verbose"]);
      list = names.filter((n) => ("-" + n).toLowerCase().startsWith(word.toLowerCase())).map((n) => "-" + n);
    }
  } else if (word) {
    list = Object.values(PS.CMDS).map((c) => c.name).filter((n) => n.toLowerCase().startsWith(word.toLowerCase())).sort();
  }
  if (!list.length) return;
  R.tab = { list, i: back ? list.length - 1 : 0, start, after, base: before.slice(0, start) };
  apply();
  function apply() { const t = R.tab; const nv = t.base + t.list[t.i] + t.after; inp.value = nv; t.full = nv; const p = (t.base + t.list[t.i]).length; inp.setSelectionRange(p, p); }
}

function drawer(open, tab) {
  const d = $("drawer");
  if (open === undefined) open = !d.classList.contains("open");
  d.classList.toggle("open", open);
  if (tab) R.dtab = tab;
  if (open) { renderDrawer(); $("dsearch").focus(); }
}
function renderDrawer() {
  const tab = R.dtab || "cheat";
  $("dtCheat").classList.toggle("on", tab === "cheat"); $("dtJournal").classList.toggle("on", tab === "journal");
  $("dsearch").classList.toggle("hide", tab !== "cheat");
  if (tab === "journal") {
    const due = Object.keys(S.review).filter((id) => dueReview(id));
    $("dbody").innerHTML = '<div class="dgroup"><h6>REVIEW DUE</h6>' + (due.length ? due.map((id) => { const m = MEMORIES.find((x) => x.id === id); return '<button class="centry" type="button" data-open="' + id + '"><code>' + esc(m ? m.name : id) + "</code><span>Open its recall pass</span></button>"; }).join("") : '<p class="mutetxt">Nothing due. Mistakes come back here a day later.</p>') + "</div>" +
      '<div class="dgroup"><h6>MISTAKES AND ANSWERS SHOWN</h6>' + (S.journal.length ? S.journal.slice(0, 60).map((j) => { const m = MEMORIES.find((x) => x.id === j.id); return '<div class="jentry"><b>' + esc(m ? m.name : j.id) + "</b> · " + esc(j.kind) + "<small>" + esc(j.detail) + " · " + new Date(j.at).toLocaleString() + "</small></div>"; }).join("") : '<p class="mutetxt">Empty so far.</p>') + "</div>";
    $("dbody").querySelectorAll("[data-open]").forEach((b) => b.onclick = () => { const m = MEMORIES.find((x) => x.id === b.dataset.open); drawer(false); openMemory(m); setPhase("recall"); });
    return;
  }
  const q = $("dsearch").value.trim().toLowerCase();
  let h = '<div class="rules"><b>Golden rules</b><ol><li>Read-only scopes to look, ReadWrite only to change.</li><li>Graph first, then Exchange, in a fresh window on Mac.</li><li>Ask Graph for properties with -Property, or they come back empty.</li><li>-All for anything you count or report.</li><li>Switch values glue on: -AccountEnabled:$false.</li><li>-WhatIf before a change, Get- after it to verify.</li><li>Leaver: block first, then revoke sessions.</li></ol></div>';
  SEQUENCES.filter((s) => s.open).forEach((s) => {
    const rows = [];
    memsOf(s.id).forEach((m) => m.cheat.forEach(([c, d]) => { if (!q || (c + " " + d + " " + m.name).toLowerCase().includes(q)) rows.push([c, d, m]); }));
    if (!rows.length) return;
    h += '<div class="dgroup"><h6>SEQUENCE ' + s.id + " · " + esc(s.name.toUpperCase()) + "</h6>" + rows.map(([c, d, m]) => '<button class="centry' + (synced(m.id) ? "" : " locked") + '" type="button" data-c="' + esc(c) + '"><code>' + esc(c) + "</code><span>" + esc(d) + (synced(m.id) ? "" : " · not synced yet") + "</span></button>").join("") + "</div>";
  });
  h += '<p class="mutetxt" style="margin-top:16px">Click a line to put it in the console, or copy it when you are in the corridor.</p>';
  $("dbody").innerHTML = h;
  $("dbody").querySelectorAll("[data-c]").forEach((b) => b.onclick = () => {
    const c = b.dataset.c;
    if (R.view === "memory") { $("cmd").value = c; drawer(false); $("cmd").focus(); }
    else { try { navigator.clipboard.writeText(c); toast("Copied"); } catch (e) { toast(c); } }
  });
}
$("cheatbtn").onclick = () => drawer(undefined, "cheat");
$("dclose").onclick = () => drawer(false);
$("dtCheat").onclick = () => { R.dtab = "cheat"; renderDrawer(); };
$("dtJournal").onclick = () => { R.dtab = "journal"; renderDrawer(); };
$("dsearch").oninput = () => renderDrawer();
$("home").onclick = () => { closeOverlay(); renderCorridor(); };
if (/Mac|iPhone|iPad/.test(navigator.platform)) $("kbdhint").textContent = "Cmd K";
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); drawer(undefined, "cheat"); return; }
  if (e.key === "Escape") {
    if (!$("ov").classList.contains("hide")) { closeOverlay(); return; }
    if ($("drawer").classList.contains("open")) { drawer(false); return; }
  }
  if (R.view === "corridor" && document.activeElement && document.activeElement.tagName !== "INPUT") {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const n = memsOf(S.seqSel).length + 1;
      S.selMem = (S.selMem + (e.key === "ArrowRight" ? 1 : -1) + n) % n; save(); renderCorridor(); e.preventDefault();
    }
    if (e.key === "Enter" && document.activeElement === document.body) enterSelected();
  }
});
(function motes() { let h = ""; for (let i = 0; i < 12; i++) h += '<div class="mote" style="left:' + (8 + (i * 37) % 84) + "%;top:" + (40 + (i * 23) % 50) + "%;animation-delay:" + (i * 1.3).toFixed(1) + 's"></div>'; $("motes").innerHTML = h; })();
window.SYNCLE = { S, R, openMemory, openGate, renderCorridor, setPhase };
renderCorridor();

</script>
