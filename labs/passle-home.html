<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASSLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Spectral:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4efe4; --panel:#fbf8f1; --panel2:#efe7d6; --text:#2b2119; --dim:#7c6f5c;
    --line:#e2d8c4; --brass:#9c6b1f; --brass-soft:#c9a45e; --herb:#4f7a33; --chili:#b23b2e; --ember:#b5561d;
    --ginger:#d98a3d;
    --mono:"JetBrains Mono","Consolas",ui-monospace,monospace; --serif:"Spectral",Georgia,serif; --disp:"Fraunces",Georgia,serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:linear-gradient(#f7f2e8,#efe7d6) fixed; color:var(--text); font-family:var(--serif); font-size:18px; line-height:1.6; min-height:100vh; padding:30px 20px 90px; }
  .wrap { max-width:720px; margin:0 auto; }

  .hero { position:relative; background:linear-gradient(160deg,#fbf3e3,#f2e4cb); border:1px solid var(--line); border-radius:18px; padding:22px 24px; overflow:hidden; box-shadow:0 2px 10px rgba(122,74,30,0.08); }
  .hero::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:repeating-linear-gradient(90deg,var(--brass-soft) 0 18px,transparent 18px 30px); opacity:.5; }
  .mark { font-family:var(--disp); font-weight:900; font-size:38px; letter-spacing:3px; color:var(--brass); line-height:1; }
  .mark small { display:block; font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--dim); font-weight:400; margin-top:6px; }
  .heroflex { display:flex; gap:18px; align-items:flex-start; margin-top:16px; }

  .roux-wrap { position:relative; flex:none; width:140px; display:flex; justify-content:center; }
  .roux { width:134px; height:auto; display:block; transform-origin:bottom center; animation:bob 3.4s ease-in-out infinite; }
  .roux.pop { animation:pop .55s ease; }
  .steam { position:absolute; top:2px; width:7px; height:7px; border-radius:50%; background:var(--brass-soft); opacity:0; animation:rise 3.4s ease-out infinite; }
  .steam.s1 { left:46px; } .steam.s2 { left:64px; animation-delay:1.1s; } .steam.s3 { left:82px; animation-delay:2.2s; }

  .bubble { position:relative; flex:1; min-width:0; background:#fffdf8; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:10px; font-size:16px; }
  .bubble::before { content:""; position:absolute; left:-9px; top:22px; width:16px; height:16px; background:#fffdf8; border-left:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg); }
  .bubble .who { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:#b5671f; display:block; margin-bottom:5px; }
  .bubble .say { color:var(--text); min-height:46px; }

  .prog { display:flex; align-items:center; gap:11px; margin:22px 2px 6px; }
  .track { flex:1; height:8px; border-radius:5px; background:var(--panel2); border:1px solid var(--line); overflow:hidden; }
  .track i { display:block; height:100%; background:linear-gradient(90deg,var(--ginger),var(--brass)); width:0; transition:width .5s ease; }
  .ptxt { font-family:var(--mono); font-size:12px; color:var(--dim); white-space:nowrap; }
  .ptxt b { color:var(--brass); }

  .lead { text-align:center; font-size:15px; color:var(--dim); margin:18px auto 24px; max-width:50ch; }

  .step { display:flex; gap:15px; }
  .rail { position:relative; width:32px; flex:none; display:flex; justify-content:center; }
  .rail::before { content:""; position:absolute; top:0; bottom:0; width:2px; background:var(--line); }
  .step:first-child .rail::before { top:16px; }
  .step:last-child .rail::before { bottom:calc(100% - 16px); }
  .num { position:relative; z-index:1; width:32px; height:32px; border-radius:50%; background:var(--panel); border:2px solid var(--brass-soft); color:var(--brass); font-family:var(--mono); font-weight:600; font-size:13px; display:grid; place-items:center; }
  .step.done .num { background:var(--herb); border-color:var(--herb); color:#fffdf8; }

  .card { flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:15px; transition:border-color .18s, transform .12s, box-shadow .18s; }
  .card:hover { border-color:var(--brass-soft); transform:translateY(-1px); box-shadow:0 3px 12px rgba(122,74,30,0.07); }
  .card-h { display:flex; align-items:baseline; gap:10px; margin-bottom:5px; flex-wrap:wrap; }
  .st-title { font-family:var(--disp); font-weight:600; font-size:18px; color:var(--text); }
  .badge { font-family:var(--mono); font-size:9px; letter-spacing:1.5px; padding:2px 7px; border-radius:999px; text-transform:uppercase; margin-left:auto; border:1px solid; }
  .badge.tutorial { color:var(--herb); border-color:var(--herb); }
  .badge.lab { color:var(--brass); border-color:var(--brass-soft); }
  .badge.workshop { color:var(--ember); border-color:var(--ember); }
  .badge.tool { color:var(--chili); border-color:var(--chili); }
  .badge.reference { color:var(--dim); border-color:var(--brass-soft); }
  .what { font-size:14.5px; margin-bottom:6px; }
  .when { font-size:13px; color:var(--dim); margin-bottom:12px; }
  .when b { color:var(--brass); font-weight:500; }
  .actions { display:flex; align-items:center; gap:15px; }
  .open { font-family:var(--mono); font-weight:600; font-size:12px; letter-spacing:1px; color:#fffdf8; background:var(--brass); border:1px solid var(--brass); padding:9px 15px; border-radius:8px; text-decoration:none; }
  .open:hover { filter:brightness(1.07); }
  .done-lbl { font-family:var(--mono); font-size:12px; color:var(--dim); display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .done-lbl input { width:16px; height:16px; accent-color:var(--herb); cursor:pointer; }

  .foot { margin-top:24px; padding:15px 18px; border-left:3px solid var(--brass-soft); background:rgba(156,107,31,0.06); border-radius:0 10px 10px 0; font-size:14px; }
  .foot b { color:var(--brass); }

  @keyframes bob { 0%,100%{transform:translateY(0) scaleY(1);} 50%{transform:translateY(-5px) scaleY(1.012);} }
  @keyframes pop { 0%{transform:translateY(0) scale(1,1);} 25%{transform:translateY(-10px) scale(1.06,0.95);} 55%{transform:translateY(2px) scale(0.97,1.04);} 100%{transform:translateY(0) scale(1,1);} }
  @keyframes rise { 0%{opacity:0; transform:translateY(0) scale(.6);} 25%{opacity:.5;} 100%{opacity:0; transform:translateY(-20px) scale(1.2);} }
  @media (prefers-reduced-motion:reduce){ .roux,.roux.pop,.steam,.track i,.card{animation:none!important;transition:none!important;} }
  @media (max-width:520px){ body{font-size:17px;} .mark{font-size:30px;} .heroflex{flex-direction:column; align-items:center;} .bubble::before{display:none;} .badge{margin-left:0;} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="mark">PASSLE<small>LEARN PHP ON THE LINE</small></div>
      <div class="heroflex">
        <div class="roux-wrap">
          <span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span>
          <img class="roux" id="roux" src="img/roux/idle.png" alt="Roux, the kitchen cat who runs the pass">
        </div>
        <div class="bubble">
          <span class="who">ROUX — RUNS THE PASS</span>
          <div class="say" id="say"></div>
        </div>
      </div>
      <div class="prog">
        <div class="track"><i id="fill"></i></div>
        <span class="ptxt" id="ptxt"></span>
      </div>
    </div>

    <p class="lead">A guided path. New to PHP? Start at step 1 and work down. Coming back? Jump to whatever you need — Roux will keep score.</p>

    <div class="path" id="path"></div>
    <div class="foot" id="foot"></div>
  </div>

<script>
(function () {
  "use strict";

  var IMG = "img/roux/";
  var POSES = ["idle","happy","stern","idle2","call","rest","cheer","serve"];
  POSES.forEach(function (p) { var i = new Image(); i.src = IMG + p + ".png"; });

  var STEPS = [
    { title:"Your first dynamic page", kind:"tutorial", href:"passle-tutorial-dynamicpage.html",
      what:"The gentlest start: build a tiny page that greets you by name, explained line by line.",
      when:"Day one. If you've never written PHP, begin here." },
    { title:"The Lab — four stations", kind:"lab", href:"passle.html",
      what:"The fundamentals, kitchen by station: output & variables, logic & loops, the web & forms, objects & safety.",
      when:"The main course. Work through the stations in order." },
    { title:"Stepping stones", kind:"tutorial", href:"passle-steps.html",
      what:"Learn one idea in small steps: watch → arrange → fill → tweak → write. No blank-page cliff.",
      when:"Whenever a concept feels like too big a jump." },
    { title:"Workshop — The Order Form", kind:"workshop", href:"passle-workshop-orderform.html",
      what:"Build a real page end to end: a form takes an order and serves back a safe confirmation.",
      when:"After the stations — your first proper build." },
    { title:"Workshop — The Guestbook", kind:"workshop", href:"passle-workshop-guestbook.html",
      what:"Build a page that remembers everyone who signs it — forms, files and JSON together.",
      when:"Next build — add memory that lasts between visits." },
    { title:"The Runner — write & run real PHP", kind:"tool", href:"php-runner.html",
      what:"Type PHP, hit send, see real output and real errors — a whole PHP server in the browser.",
      when:"Anytime you want to test an idea for real." },
    { title:"The Larder — reference", kind:"reference", href:"passle-larder.html",
      what:"Every command, function and symbol, searchable, with a tiny example for each.",
      when:"Mid-drill, when you can't remember a name." }
  ];

  var CHEERS = ["Service!", "Heard, chef.", "That's the way.", "Clean plate.", "Nice hands.", "Keep it moving."];

  function greeting(n, total) {
    if (n === 0) return "New hands, hm? Grab an apron — I'm Roux, I run this pass. Start at the top and we'll make a cook of you.";
    if (n >= total) return "…Chef. Every ticket cleared, the whole line clean. The pass is yours.";
    if (n <= 2) return "Back on the line. Pick up where you left off — I kept your spot.";
    if (n <= 4) return "You're finding your rhythm. Keep the plates moving.";
    return "Sharp work. A couple more and you're service-ready.";
  }
  function restPose(n, total){ return n >= total ? "serve" : (n === 0 ? "call" : "idle"); }

  var STORE = "passle_home_done";
  var done = load();
  function load(){ try { var r=localStorage.getItem(STORE); if(r) return JSON.parse(r)||{}; } catch(e){} return {}; }
  function save(){ try { localStorage.setItem(STORE, JSON.stringify(done)); } catch(e){} }
  function count(){ var n=0; for (var k in done) if (done.hasOwnProperty(k) && done[k]) n++; return n; }

  var path = document.getElementById("path");
  var say = document.getElementById("say");
  var fill = document.getElementById("fill");
  var ptxt = document.getElementById("ptxt");
  var roux = document.getElementById("roux");

  function setSay(t){ say.textContent = t; }
  function setPose(p){ roux.src = IMG + p + ".png"; }
  function paint(){
    var n = count(), total = STEPS.length;
    fill.style.width = Math.round(n/total*100) + "%";
    ptxt.innerHTML = "<b>" + n + "</b> / " + total + " cleared";
  }

  roux.addEventListener("animationend", function (e) { if (e.animationName === "pop") roux.classList.remove("pop"); });

  var audio;
  function ding(){
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [988, 1319].forEach(function (f, i) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
        var t = audio.currentTime + i * 0.07;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.start(t); o.stop(t + 0.5);
      });
    } catch (e) {}
  }

  var revertTimer;
  function react(line){
    clearTimeout(revertTimer);
    var n = count(), total = STEPS.length;
    setPose(n >= total ? "serve" : "cheer");
    roux.classList.remove("pop"); void roux.offsetWidth; roux.classList.add("pop");
    setSay(line); ding();
    revertTimer = setTimeout(function(){ setPose(restPose(count(), STEPS.length)); setSay(greeting(count(), STEPS.length)); }, 2600);
  }

  STEPS.forEach(function (s, i) {
    var step = document.createElement("div");
    step.className = "step" + (done[i] ? " done" : "");
    var rail = document.createElement("div"); rail.className = "rail";
    var num = document.createElement("span"); num.className = "num"; num.textContent = done[i] ? "✓" : (i + 1);
    rail.appendChild(num);

    var card = document.createElement("div"); card.className = "card";
    var h = document.createElement("div"); h.className = "card-h";
    var t = document.createElement("span"); t.className = "st-title"; t.textContent = s.title;
    var bd = document.createElement("span"); bd.className = "badge " + s.kind; bd.textContent = s.kind;
    h.appendChild(t); h.appendChild(bd);
    var what = document.createElement("p"); what.className = "what"; what.textContent = s.what;
    var when = document.createElement("p"); when.className = "when"; when.innerHTML = "<b>When:</b> " + s.when;

    var act = document.createElement("div"); act.className = "actions";
    var a = document.createElement("a"); a.className = "open"; a.href = s.href; a.textContent = "Open →";
    var lbl = document.createElement("label"); lbl.className = "done-lbl";
    var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!done[i];
    cb.addEventListener("change", function () {
      done[i] = cb.checked; save();
      step.classList.toggle("done", cb.checked);
      num.textContent = cb.checked ? "✓" : (i + 1);
      paint();
      if (cb.checked) react(CHEERS[Math.floor(Math.random()*CHEERS.length)]);
      else { setPose(restPose(count(), STEPS.length)); setSay(greeting(count(), STEPS.length)); }
    });
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode("done"));
    act.appendChild(a); act.appendChild(lbl);

    card.appendChild(h); card.appendChild(what); card.appendChild(when); card.appendChild(act);
    step.appendChild(rail); step.appendChild(card);
    path.appendChild(step);
  });

  document.getElementById("foot").innerHTML = "<b>Not sure where to start?</b> Steps 1–5 are the course, roughly in order. The Runner and the Larder are always-open tools you reach for throughout. Roux is watching — tick a step when you finish it.";

  setPose(restPose(count(), STEPS.length));
  setSay(greeting(count(), STEPS.length));
  paint();
})();
</script>
</body>
</html>
