<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASSLE · stepping stones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Spectral:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4efe4; --panel:#fbf8f1; --panel2:#efe7d6; --text:#2b2119; --dim:#7c6f5c;
    --line:#e2d8c4; --brass:#9c6b1f; --brass-dim:#c9a45e; --herb:#4f7a33; --chili:#b23b2e; --ember:#b5561d;
    --mono:"JetBrains Mono","Consolas",ui-monospace,monospace; --serif:"Spectral",Georgia,serif; --disp:"Fraunces",Georgia,serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(ellipse at 50% -10%,#241a12 0%,#16110c 45%,#0e0a07 100%); background-attachment:fixed; color:var(--text); font-family:var(--serif); font-size:18px; line-height:1.6; min-height:100vh; padding:26px 18px 80px; }
  .wrap { max-width:760px; margin:0 auto; }
  .head { display:flex; align-items:baseline; gap:14px; }
  .mark { font-family:var(--disp); font-weight:900; font-size:26px; letter-spacing:2px; color:var(--brass); }
  .sub { font-family:var(--disp); font-style:italic; font-size:15px; color:var(--dim); }

  .rungs { display:flex; gap:6px; margin:22px 0 8px; flex-wrap:wrap; }
  .rbtn { flex:1; min-width:92px; font-family:var(--mono); font-size:11px; letter-spacing:1px; color:var(--dim); background:var(--panel); border:1px solid var(--line); border-bottom:2px solid var(--line); padding:9px 6px; border-radius:8px; cursor:pointer; text-align:center; }
  .rbtn .n { display:block; font-size:9px; color:var(--brass-dim); margin-bottom:3px; }
  .rbtn.on { color:var(--brass); border-color:var(--brass-dim); border-bottom-color:var(--brass); background:rgba(203,154,81,0.08); }
  .rbtn.done .n { color:var(--herb); }

  .stage { margin-top:22px; }
  .kick { font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--ember); margin-bottom:8px; }
  .title { font-family:var(--disp); font-weight:600; font-size:27px; color:var(--text); margin-bottom:14px; }
  .task { margin-bottom:18px; max-width:64ch; }
  .task b { color:var(--brass); font-weight:500; }

  pre { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:15px; overflow-x:auto; margin:14px 0; }
  code { font-family:var(--mono); font-size:14.5px; line-height:1.7; color:#3a2f22; white-space:pre; }
  .out { background:rgba(156,107,31,0.06); border:1px solid var(--line); border-radius:10px; padding:12px 15px; margin:14px 0; }
  .out .l { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); display:block; margin-bottom:5px; }
  .out samp { font-family:var(--mono); font-size:14px; color:var(--herb); white-space:pre-wrap; }

  .why { border-left:3px solid var(--ember); background:rgba(217,119,47,0.06); border-radius:0 8px 8px 0; padding:11px 15px; margin:16px 0; font-size:15px; }
  .why b { color:var(--ember); font-family:var(--mono); font-size:10px; letter-spacing:2px; display:block; margin-bottom:4px; }

  .pool, .target { display:flex; flex-direction:column; gap:8px; margin:12px 0; }
  .target { min-height:56px; border:1px dashed var(--line); border-radius:10px; padding:10px; }
  .lbl2 { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); margin-top:8px; }
  .chip { text-align:left; font-family:var(--mono); font-size:14px; color:#3a2f22; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:11px 13px; cursor:pointer; white-space:pre; overflow-x:auto; }
  .chip:hover { border-color:var(--brass-dim); }
  .chip.intarget { background:rgba(203,154,81,0.06); }

  .opts { display:flex; flex-direction:column; gap:9px; margin:12px 0; }
  .opt { text-align:left; font-family:var(--mono); font-size:14px; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--brass-dim); }
  .opt.right { border-color:var(--herb); background:rgba(134,180,92,0.1); }
  .opt.wrong { border-color:var(--chili); background:rgba(207,91,78,0.1); }

  .blank { color:var(--ember); background:rgba(217,119,47,0.12); border-radius:4px; padding:0 8px; }

  textarea { width:100%; min-height:120px; resize:vertical; font-family:var(--mono); font-size:14px; line-height:1.7; color:#3a2f22; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px; outline:none; tab-size:4; }
  textarea:focus { border-color:var(--brass-dim); }

  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px; }
  .btn { font-family:var(--mono); font-weight:600; font-size:12px; letter-spacing:1px; color:var(--bg); background:var(--brass); border:1px solid var(--brass); padding:11px 18px; border-radius:8px; cursor:pointer; }
  .btn:hover { filter:brightness(1.08); }
  .btn.ghost { background:none; color:var(--dim); border-color:var(--line); font-weight:400; }
  .btn.ghost:hover { color:var(--brass); border-color:var(--brass-dim); filter:none; }

  .verdict { margin-top:14px; padding:12px 14px; border-radius:8px; font-size:15px; display:none; }
  .verdict.show { display:block; }
  .verdict.ok { background:rgba(134,180,92,0.1); border:1px solid rgba(134,180,92,0.35); }
  .verdict.no { background:rgba(207,91,78,0.1); border:1px solid rgba(207,91,78,0.35); }
  .verdict b { font-family:var(--mono); font-size:11px; letter-spacing:1px; display:block; margin-bottom:4px; }
  .verdict.ok b { color:var(--herb); } .verdict.no b { color:var(--chili); }

  .nav { display:flex; justify-content:space-between; margin-top:34px; padding-top:18px; border-top:1px solid var(--line); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="mark">PASSLE</span>
      <span class="sub">stepping stones — one concept, five small steps</span>
    </div>

    <div class="rungs" id="rungs"></div>
    <div class="stage" id="stage"></div>

    <div class="nav">
      <button class="btn ghost" id="prev" type="button">← back</button>
      <button class="btn" id="next" type="button">next step →</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var TARGET_LINES = [
    "<?php",
    "$menu = [\"soup\" => 6, \"bread\" => 3];",
    "foreach ($menu as $item => $price) {",
    "    echo \"$item: $price\\n\";",
    "}"
  ];
  var OUTPUT = "soup: 6\nbread: 3";

  var RUNGS = [
    {
      tag: "WATCH",
      title: "Watch it work",
      render: function (host) {
        host.appendChild(P("A <b>foreach</b> loop walks through every item in an array. With a menu (an associative array), you can grab the name and the price of each dish together. Read it once — you'll build this exact loop yourself by the last step."));
        host.appendChild(codeBlock(TARGET_LINES.join("\n")));
        host.appendChild(outBlock(OUTPUT));
        host.appendChild(why("The whole point", "You're not memorising this. You're about to rebuild it in pieces \u2014 first the order, then a missing word, then a small change, then from scratch. Each step is small on purpose."));
        markDone(0);
      }
    },
    {
      tag: "ARRANGE",
      title: "Arrange the lines",
      render: function (host) {
        host.appendChild(P("Same loop \u2014 the lines are just shuffled. <b>Tap them into the right order.</b> No typing: this is about getting the <em>shape</em> right before the details."));
        var pool = document.createElement("div"); pool.className = "pool";
        var tgtLbl = document.createElement("div"); tgtLbl.className = "lbl2"; tgtLbl.textContent = "YOUR SCRIPT";
        var target = document.createElement("div"); target.className = "target";
        var poolLbl = document.createElement("div"); poolLbl.className = "lbl2"; poolLbl.textContent = "LINES";

        var order = shuffle(TARGET_LINES.slice());
        while (order.join("\u0001") === TARGET_LINES.join("\u0001")) order = shuffle(TARGET_LINES.slice());

        function chip(text, inTarget) {
          var c = document.createElement("button");
          c.type = "button"; c.className = "chip" + (inTarget ? " intarget" : "");
          c.textContent = text;
          c.addEventListener("click", function () {
            if (inTarget) { c.remove(); addPool(text); }
            else { c.remove(); addTarget(text); }
          });
          return c;
        }
        function addPool(text) { pool.appendChild(chip(text, false)); }
        function addTarget(text) { target.appendChild(chip(text, true)); }

        order.forEach(function (t) { addPool(t); });

        host.appendChild(tgtLbl); host.appendChild(target);
        host.appendChild(poolLbl); host.appendChild(pool);

        var v = verdictEl();
        var row = document.createElement("div"); row.className = "row";
        var check = mkBtn("Check the order", function () {
          var got = [].map.call(target.querySelectorAll(".chip"), function (c) { return c.textContent; });
          if (got.join("\u0001") === TARGET_LINES.join("\u0001")) {
            showV(v, true, "That's the shape. Structure first, always \u2014 open the file, set up the data, loop, close the loop.");
            host.appendChild(outBlock(OUTPUT));
            markDone(1);
          } else {
            showV(v, false, "Not yet. Hint: a script opens with <?php, you need the $menu before you can loop over it, and the } closes the loop last.");
          }
        });
        var reset = mkBtn("reset", function () { render(idx); }, true);
        row.appendChild(check); row.appendChild(reset);
        host.appendChild(row); host.appendChild(v);
      }
    },
    {
      tag: "FILL",
      title: "Fill the gap",
      render: function (host) {
        host.appendChild(P("The loop's built \u2014 one word is missing. In <code>as $item => ?</code>, what do you name the value so the <code>echo</code> line can use it?"));
        var codeHtml =
          "<?php\n" +
          "$menu = [\"soup\" => 6, \"bread\" => 3];\n" +
          "foreach ($menu as $item => <span class=\"blank\">?</span>) {\n" +
          "    echo \"$item: $price\\n\";\n" +
          "}";
        var pre = document.createElement("pre");
        var code = document.createElement("code");
        code.innerHTML = codeHtml;
        pre.appendChild(code); host.appendChild(pre);

        var options = ["$price", "$cost", "$value", "6"];
        var answer = 0;
        var opts = document.createElement("div"); opts.className = "opts";
        var v = verdictEl();
        options.forEach(function (t, i) {
          var b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = t;
          b.addEventListener("click", function () {
            [].forEach.call(opts.querySelectorAll(".opt"), function (x) { x.disabled = true; });
            if (i === answer) {
              b.classList.add("right");
              showV(v, true, "Yes. The name you give the value (here $price) is the same name you must use inside the loop. Match them or PHP won't know what $price is.");
              host.appendChild(outBlock(OUTPUT));
              markDone(2);
            } else {
              b.classList.add("wrong");
              opts.querySelectorAll(".opt")[answer].classList.add("right");
              showV(v, false, "Look at the echo line \u2014 it uses $price. So the value must be named $price too.");
            }
          });
          opts.appendChild(b);
        });
        host.appendChild(opts); host.appendChild(v);
      }
    },
    {
      tag: "TWEAK",
      title: "Tweak it",
      render: function (host) {
        host.appendChild(task("The loop works. <b>Change it so each price shows a \u20ac sign</b> \u2014 so the output reads <code>soup: \u20ac6</code>. Edit the echo line, then check."));
        var start =
          "<?php\n" +
          "$menu = [\"soup\" => 6, \"bread\" => 3];\n" +
          "foreach ($menu as $item => $price) {\n" +
          "    echo \"$item: $price\\n\";\n" +
          "}";
        var ta = document.createElement("textarea"); ta.spellcheck = false; ta.value = start;
        host.appendChild(ta);
        host.appendChild(outBlock("soup: \u20ac6\nbread: \u20ac3", "WHAT YOU'RE AIMING FOR"));
        var v = verdictEl();
        var row = document.createElement("div"); row.className = "row";
        row.appendChild(mkBtn("Check it", function () {
          var t = ta.value;
          if (t.indexOf("\u20ac") !== -1 && /echo/.test(t)) {
            showV(v, true, "That's it \u2014 you dropped a \u20ac straight into the double-quoted string, right before $price. Small change, real result.");
            markDone(3);
          } else {
            showV(v, false, "You want a \u20ac inside the echo string, just before $price: echo \"$item: \u20ac$price\\n\";");
          }
        }));
        host.appendChild(row); host.appendChild(v);
      }
    },
    {
      tag: "WRITE",
      title: "Write the line",
      render: function (host) {
        host.appendChild(task("Last step \u2014 and you're not starting from nothing. The skeleton's here; <b>write the one echo line</b> that prints each dish as <code>item — price</code> (for example <code>soup — 6</code>)."));
        var skel =
          "<?php\n" +
          "$menu = [\"soup\" => 6, \"bread\" => 3];\n" +
          "foreach ($menu as $item => $price) {\n" +
          "    \n" +
          "}";
        var ta = document.createElement("textarea"); ta.spellcheck = false; ta.value = skel;
        host.appendChild(ta);
        host.appendChild(outBlock("soup \u2014 6\nbread \u2014 3", "WHAT YOU'RE AIMING FOR"));
        var v = verdictEl();
        host.appendChild(elRow(mkBtn("Check it", function () {
          var t = ta.value;
          if (/echo/.test(t) && t.indexOf("$item") !== -1 && t.indexOf("$price") !== -1) {
            showV(v, true, "You wrote it. From arranging shuffled lines to writing the loop yourself \u2014 that's the whole climb, five small steps instead of one cliff.");
            markDone(4);
          } else {
            showV(v, false, "You need an echo that uses both $item and $price, e.g. echo \"$item \u2014 $price\\n\"; \u2014 put it on the blank line inside the loop.");
          }
        })));
        host.appendChild(v);
      }
    }
  ];

  var idx = 0;
  var done = {};
  var stage = document.getElementById("stage");
  var rungsEl = document.getElementById("rungs");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function P(html) { var p = document.createElement("p"); p.className = "task"; p.innerHTML = html; return p; }
  function task(html) { var p = document.createElement("div"); p.className = "task"; p.innerHTML = html; return p; }
  function codeBlock(text) { var pre = document.createElement("pre"); var c = document.createElement("code"); c.textContent = text; pre.appendChild(c); return pre; }
  function outBlock(text, label) { var d = document.createElement("div"); d.className = "out"; var l = document.createElement("span"); l.className = "l"; l.textContent = label || "ON THE PLATE"; var s = document.createElement("samp"); s.textContent = text; d.appendChild(l); d.appendChild(s); return d; }
  function why(head, body) { var d = document.createElement("div"); d.className = "why"; var b = document.createElement("b"); b.textContent = head; var s = document.createElement("span"); s.textContent = body; d.appendChild(b); d.appendChild(s); return d; }
  function verdictEl() { return document.createElement("div"); }
  function showV(v, ok, html) { v.className = "verdict show " + (ok ? "ok" : "no"); v.innerHTML = "<b>" + (ok ? "SERVICE" : "NOT YET") + "</b>" + html; }
  function mkBtn(label, fn, ghost) { var b = document.createElement("button"); b.type = "button"; b.className = "btn" + (ghost ? " ghost" : ""); b.textContent = label; b.addEventListener("click", fn); return b; }
  function elRow(btn) { var r = document.createElement("div"); r.className = "row"; r.appendChild(btn); return r; }

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function markDone(i) { done[i] = true; paintRungs(); }

  function paintRungs() {
    rungsEl.innerHTML = "";
    RUNGS.forEach(function (r, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "rbtn" + (i === idx ? " on" : "") + (done[i] ? " done" : "");
      b.innerHTML = '<span class="n">' + (i + 1) + (done[i] ? " ✓" : "") + '</span>' + r.tag;
      b.addEventListener("click", function () { render(i); });
      rungsEl.appendChild(b);
    });
  }

  function render(i) {
    idx = i;
    stage.innerHTML = "";
    var r = RUNGS[i];
    var k = document.createElement("div"); k.className = "kick"; k.textContent = "STEP " + (i + 1) + " · " + r.tag;
    var t = document.createElement("div"); t.className = "title"; t.textContent = r.title;
    stage.appendChild(k); stage.appendChild(t);
    r.render(stage);
    prevBtn.style.visibility = i === 0 ? "hidden" : "visible";
    nextBtn.style.visibility = i === RUNGS.length - 1 ? "hidden" : "visible";
    paintRungs();
    window.scrollTo(0, 0);
  }

  prevBtn.addEventListener("click", function () { if (idx > 0) render(idx - 1); });
  nextBtn.addEventListener("click", function () { if (idx < RUNGS.length - 1) render(idx + 1); });

  render(0);
})();
</script>
</body>
</html>
