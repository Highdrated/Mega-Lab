<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle · SC-500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#14101b;--bg2:#1b1624;--panel:#1d1827;--panel2:#241e30;--line:rgba(242,198,109,.26);--line2:rgba(242,198,109,.12);--gold:#f2c66d;--ember:#e07a3a;--ink:#efe6da;--mute:#a99cb0;--dim:#6f6378;--red:#ff5a47;--violet:#3b2552}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;letter-spacing:.02em;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
code,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:620px}
header{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--line);background:linear-gradient(#1a1422,#15111c)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand h1{font-size:22px;color:var(--gold)}
.exam{flex:1;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap}
.exam b{flex:none;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:1px 8px;font-size:13px}
.exam span{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.phase{flex:none;font-size:14px;color:var(--gold);padding:4px 12px;border:1px solid var(--line);border-radius:20px}
.hbtn{flex:none;background:none;border:1px solid var(--line2);border-radius:20px;padding:4px 12px;font-size:14px;color:var(--mute);cursor:pointer;min-height:32px}
.hbtn:hover,.hbtn:focus-visible{color:var(--ink);border-color:var(--line);outline:none}
.hbtn .n{color:var(--ember);font-weight:700}
main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(400px,560px);min-height:0}
.stage{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;border-right:1px solid var(--line)}
.scene{position:relative;aspect-ratio:920/464;overflow:hidden;background:#17121d}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:rgba(20,16,27,.94);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13px;max-width:260px;opacity:0;transition:opacity .12s;z-index:3}
.tip small{display:block;color:var(--mute);font-size:12px}
.wards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg2)}
.ward{padding:10px 16px 12px;border-right:1px solid var(--line2)}
.ward:last-child{border-right:0}
.ward h3{font-family:"Source Sans 3",sans-serif;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0;display:flex;justify-content:space-between;gap:8px}
.ward h3 em{font-style:normal;color:var(--dim);white-space:nowrap}
.wl button{background:none;border:0;border-bottom:1px solid transparent;padding:2px 0;cursor:pointer;color:var(--ink);font-size:14px;white-space:nowrap}
.wl button:hover,.wl button:focus-visible{border-bottom-color:var(--line);outline:none}
.wl button.sel{border-bottom-color:var(--gold);color:var(--gold)}
.roll{overflow:auto;padding:14px 20px 18px;border-top:1px solid var(--line2);background:var(--bg)}
.roll h3{font-size:15px;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.roll h3 small{font-family:"Source Sans 3",sans-serif;font-size:13px;color:var(--mute);font-weight:400;letter-spacing:0}
.rl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 22px}
.rl li{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:baseline;font-size:14px;padding:3px 0}
.rl i{width:8px;height:8px;border-radius:50%;background:#2b2333;border:1px solid #6f6378;display:block;transform:translateY(-1px)}
.rl .ember i{background:#c8632f;border-color:#e07a3a}
.rl .lit i{background:#ffe2a0;border-color:#f2c66d;box-shadow:0 0 8px rgba(242,198,109,.8)}
.rl .lit{color:var(--gold)}
.rl .dark{color:var(--mute)}
.wl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:14px}
.wl span{white-space:nowrap}
.wl i{font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums}
.side{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;background:var(--panel)}
.pane{overflow:auto;padding:20px 28px 18px}
.kicker{font-size:13px;color:var(--ember);font-weight:600;margin-bottom:6px}
.pane h2{font-size:27px;color:var(--ink);margin-bottom:6px;text-wrap:balance}
.builds{font-size:13px;color:var(--mute);margin-bottom:14px}
.dots{display:flex;gap:6px;margin:0 0 16px}
.dots i{width:22px;height:3px;border-radius:2px;background:var(--line2)}
.dots i.done{background:var(--gold)}
.dots i.now{background:var(--ember)}
.facts{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
.facts li{padding-left:18px;position:relative}
.facts li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(242,198,109,.7)}
.facts b{color:var(--gold);font-weight:600}
.card{border:1px solid var(--line2);border-radius:6px;padding:14px 16px;margin-bottom:12px;background:var(--panel2)}
.card.ok{border-color:rgba(242,198,109,.5)}
.card h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ember)}
.card p{margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{flex:1;min-width:180px;background:#130f19;border:1px solid var(--line2);border-radius:4px;color:var(--ink);padding:9px 12px;font:16px "JetBrains Mono",ui-monospace,monospace;min-height:42px}
input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,198,109,.15)}
.btn{background:var(--gold);color:#1a1320;border:0;border-radius:4px;padding:9px 16px;font-weight:700;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.ghost:focus-visible,.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.ghost{background:none;border:1px solid var(--line);border-radius:4px;padding:9px 14px;cursor:pointer;color:var(--ink);min-height:42px}
.ghost:hover{border-color:var(--gold)}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:#130f19;border:1px solid var(--line2);border-radius:4px;padding:8px 12px;cursor:pointer;min-height:42px}
.opt:hover{border-color:var(--line)}
.opt.right{border-color:var(--gold);color:var(--gold)}
.opt.wrong{border-color:var(--red);color:#ffb3a8}
.fb{font-size:14px;margin-top:8px;min-height:1.2em}
.fb.bad{color:#ffb3a8}.fb.good{color:var(--gold)}
.next{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.wick{display:flex;gap:12px;align-items:flex-start;padding:12px 28px;border-top:1px solid var(--line);background:var(--bg2);min-height:64px}
.wick svg{flex:none;margin-top:2px}
.wick p{margin:0;font-size:15px;color:var(--mute)}
.wick p b{color:var(--ink);font-weight:600}
.tenant{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0 0 14px}
.tenant dt{color:var(--mute)}
.tenant dd{margin:0}
.bands{display:grid;gap:8px;margin-bottom:14px}
.band{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 12px;border-left:2px solid var(--ember);background:var(--panel2);border-radius:0 4px 4px 0;font-size:15px}
.band b{color:var(--ink);font-weight:600}
.crumb{font-size:13px;color:var(--mute);margin-bottom:10px}
.pol{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;margin-bottom:8px;background:var(--panel2)}
.pol .nm{font-weight:600}
.state{font-size:13px;padding:2px 9px;border-radius:12px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.state.on{color:var(--gold);border-color:var(--gold)}
.state.report{color:var(--ember);border-color:rgba(224,122,58,.6)}
.form{display:grid;gap:12px}
fieldset{border:1px solid var(--line2);border-radius:5px;padding:10px 14px 12px;margin:0}
legend{padding:0 6px;font-size:14px;font-weight:600;color:var(--gold)}
.sub{font-size:13px;color:var(--mute);margin:6px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer;font-size:15px}
label.ck input{accent-color:var(--gold);width:17px;height:17px;flex:none}
.warn{font-size:14px;border:1px solid rgba(224,122,58,.5);background:rgba(224,122,58,.08);border-radius:4px;padding:8px 10px;margin-top:8px}
.err{color:#ffb3a8;font-size:14px;min-height:1.2em}
.res{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-radius:5px;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line2)}
.res .tag{font-weight:700;font-size:13px;padding:2px 9px;border-radius:12px;align-self:start;white-space:nowrap}
.res.held .tag{background:rgba(242,198,109,.15);color:var(--gold)}
.res.broke .tag{background:rgba(255,90,71,.15);color:var(--red)}
.res.warnr .tag{background:rgba(224,122,58,.15);color:var(--ember)}
.res b{font-weight:600}
.res p{margin:2px 0 0;font-size:15px;color:var(--mute)}
.list{margin:0 0 14px;padding-left:20px}
.list li{margin-bottom:6px}
.drawer{position:fixed;top:0;right:0;width:min(440px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;z-index:10;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .bd{overflow:auto;padding:16px 20px}
.oops{border-bottom:1px solid var(--line2);padding:10px 0;font-size:15px}
.oops small{color:var(--mute);display:block}
.oops .was{color:#ffb3a8}.oops .is{color:var(--gold)}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.78}}
.lan.lit{animation:flick 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.lan.lit{animation:none}.drawer{transition:none}}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr) minmax(360px,460px)}.exam span{display:none}}
@media (max-width:860px){.app{height:auto}main{grid-template-columns:1fr}.stage{display:contents}.scene{order:1}.side{order:2}.wards{order:3}.roll{order:4;max-height:none}.wards{grid-template-columns:repeat(2,minmax(0,1fr))}.ward:nth-child(2){border-right:0}.side{min-height:60vh}.pane{padding:20px}.wick{padding:12px 20px}}
@media (max-width:600px){.lbl{display:none}.rl{grid-template-columns:1fr}header{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}.exam{order:3;flex-basis:100%}.band{grid-template-columns:1fr}.pane h2{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M7 3h8l2 4H5z" fill="#f2c66d"/><rect x="5" y="7" width="12" height="14" rx="2" fill="none" stroke="#f2c66d" stroke-width="1.6"/><circle cx="11" cy="14" r="3.2" fill="#e07a3a"/><path d="M8 21h6v3H8z" fill="#f2c66d"/></svg>

{

function drawLanterns(){

    if(st==='lit'){el.style.animationDelay=(-(i%7)*.45)+'s';el.innerHTML=`<circle cx="${x}" cy="${y}" r="7" fill="#f2c66d" opacity=".55" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="3.2" fill="#ffe2a0"/>`}
    else if(st==='ember'){el.innerHTML=`<circle cx="${x}" cy="${y}" r="5" fill="#e07a3a" opacity=".35" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="2.6" fill="#c8632f"/>`}
    else{el.innerHTML=`<circle cx="${x}" cy="${y}" r="2.4" fill="#2b2333" stroke="#6f6378" stroke-opacity=".6" stroke-width=".8"/>`}
    el.innerHTML+=`<circle cx="${x}" cy="${y}" r="8" fill="transparent"/>`;

}

const tip=$('tip'),scene=$('scene');

function summary(x){
  const who=x.inc==='all'?'All users':x.inc==='groups'&&x.incG.length?x.incG.map(g=>GROUPS[g]).join(', '):'No users';
  const ex=x.excG.length?' except '+x.excG.map(g=>GROUPS[g]).join(', '):'';
  const what=x.res==='all'?'All resources':x.res==='o365'?'Office 365':'No resources';
  const apps=x.ca?' · Client apps: '+(x.apps.length?x.apps.map(a=>APPN[a]).join(', '):'none'):'';
  const g=x.grant==='block'?'Block access':x.ctrl.length?x.ctrl.map(c=>CTRLN[c]).join(x.mode==='all'?' and ':' or '):'Grant access, no controls';
  return esc(`${who}${ex} · ${what}${apps} · ${g}`);
}
const APPN={browser:'Browser',mobile:'Mobile apps and desktop clients',eas:'Exchange ActiveSync clients',other:'Other clients'};
const CTRLN={mfa:'Require multifactor authentication',compliant:'Require device to be marked as compliant'};

function renderEditor(p){
  const e=S.edit;
  const ck=(name,val,on,label)=>`<label class="ck"><input type="checkbox" name="${name}" value="${val}" ${on?'checked':''}> ${label}</label>`;
  const rd=(name,val,on,label)=>`<label class="ck"><input type="radio" name="${name}" value="${val}" ${on?'checked':''}> ${label}</label>`;
  p.innerHTML=`<div class="crumb">Conditional Access › Policies › ${e.id?'Edit':'New'}</div><h2>${e.id?esc(e.name):'New policy'}</h2>
  <form class="form" id="pf" style="margin-top:14px">
   <fieldset><legend>Name</legend><input type="text" name="name" value="${esc(e.name)}" autocomplete="off" spellcheck="false" placeholder="Type a name" aria-label="Policy name" style="width:100%"></fieldset>
   <fieldset><legend>Users</legend><div class="sub">Include</div>
     ${rd('inc','none',e.inc==='none','None')}${rd('inc','all',e.inc==='all','All users')}${rd('inc','groups',e.inc==='groups','Select users and groups')}
     <div id="incG" style="padding-left:24px;${e.inc==='groups'?'':'display:none'}">${Object.keys(GROUPS).map(g=>ck('incG',g,e.incG.includes(g),GROUPS[g])).join('')}</div>
     ${e.inc==='all'?'<div class="warn"><b>Don\'t lock yourself out!</b> This policy affects every user, you included. Test it on a small group or in Report-only first.</div>':''}
     <div class="sub" style="margin-top:10px">Exclude</div>${Object.keys(GROUPS).map(g=>ck('excG',g,e.excG.includes(g),GROUPS[g])).join('')}</fieldset>
   <fieldset><legend>Target resources</legend>${rd('res','none',e.res==='none','None')}${rd('res','all',e.res==='all','All resources (formerly "All cloud apps")')}${rd('res','o365',e.res==='o365','Select resources: Office 365')}</fieldset>
   <fieldset><legend>Conditions › Client apps</legend><div class="sub">Configure</div>${rd('ca','no',!e.ca,'No (applies to all client apps)')}${rd('ca','yes',e.ca,'Yes')}
     <div style="padding-left:24px;${e.ca?'':'display:none'}"><div class="sub">Modern authentication clients</div>${ck('apps','browser',e.apps.includes('browser'),APPN.browser)}${ck('apps','mobile',e.apps.includes('mobile'),APPN.mobile)}<div class="sub">Legacy authentication clients</div>${ck('apps','eas',e.apps.includes('eas'),APPN.eas)}${ck('apps','other',e.apps.includes('other'),APPN.other)}</div></fieldset>
   <fieldset><legend>Access controls › Grant</legend>${rd('grant','block',e.grant==='block','Block access')}${rd('grant','grant',e.grant==='grant','Grant access')}
     <div style="padding-left:24px;${e.grant==='grant'?'':'display:none'}">${Object.keys(CTRLN).map(c=>ck('ctrl',c,e.ctrl.includes(c),CTRLN[c])).join('')}
     ${e.ctrl.length>1?`<div class="sub">For multiple controls</div>${rd('mode','all',e.mode==='all','Require all the selected controls')}${rd('mode','one',e.mode==='one','Require one of the selected controls')}`:''}</div></fieldset>
   <fieldset><legend>Enable policy</legend><div class="row">${rd('state','report',e.state==='report','Report-only')}${rd('state','on',e.state==='on','On')}${rd('state','off',e.state==='off','Off')}</div></fieldset>
   <div class="err" id="perr"></div>
   <div class="next" style="margin-top:0">${e.id?'<button class="ghost" type="button" id="del">Delete</button>':''}<button class="ghost" type="button" id="cancel">Cancel</button><button class="btn" type="submit">${e.id?'Save':'Create'}</button></div>
  </form>`;
  const f=$('pf');
  const read=()=>{const fd=new FormData(f);e.name=fd.get('name')||'';e.inc=fd.get('inc');e.incG=fd.getAll('incG');e.excG=fd.getAll('excG');e.res=fd.get('res');e.ca=fd.get('ca')==='yes';e.apps=fd.getAll('apps');e.grant=fd.get('grant');e.ctrl=fd.getAll('ctrl');e.mode=fd.get('mode')||e.mode;e.state=fd.get('state')};
  f.addEventListener('change',ev=>{if(ev.target.name==='name')return;read();const y=$('pane').scrollTop;renderEditor(p);$('pane').scrollTop=y});
  f.onsubmit=ev=>{ev.preventDefault();read();
    const err=!e.name.trim()?'Name is required.':e.inc==='groups'&&!e.incG.length?'Select at least one group to include, or choose another option.':e.ca&&!e.apps.length?'Select at least one client app, or set Configure to No.':e.grant==='grant'&&!e.ctrl.length?'Select at least one control, or choose Block access.':'';
    if(err){$('perr').textContent=err;return}
    if(!e.id){e.id='p'+Date.now();S.pol.push(e)}else S.pol=S.pol.map(x=>x.id===e.id?e:x);
    S.edit=null;save();render();wick('<b>Wick:</b> Saved. Read the summary line back. Does it say what you meant?');};
  $('cancel').onclick=()=>{S.edit=null;render()};
  if($('del'))$('del').onclick=()=>{S.pol=S.pol.filter(x=>x.id!==e.id);S.edit=null;save();render()};
  wick(e.id?'<b>Wick:</b> Go through it top to bottom: who, what, which client apps, then what happens, then the state.':'<b>Wick:</b> A new policy starts empty. Every field is a choice you have to make.');
}

function applies(x,u,app){
  const g=USERS[u];
  const inc=x.inc==='all'||(x.inc==='groups'&&x.incG.includes(g));
  if(!inc||x.excG.includes(g)||x.res==='none')return false;
  if(x.ca){const m=app==='legacy'?['other']:['browser'];if(!x.apps.some(a=>m.includes(a)))return false}
  return true;
}
function signIn(u,app,actor){
  const can={mfa:actor==='legit'&&app!=='legacy',compliant:false};
  const out={ok:true,by:[],ro:[]};
  for(const x of S.pol){
    if(x.state==='off'||!applies(x,u,app))continue;
    const blocks=x.grant==='block'||!(x.mode==='one'?x.ctrl.some(c=>can[c]):x.ctrl.every(c=>can[c]));
    if(!blocks)continue;
    if(x.state==='report')out.ro.push(x);else{out.ok=false;out.by.push(x)}
  }
  return out;
}
function evaluate(){
  const waves=WAVES.map(w=>{
    const rs=w.targets.map(u=>signIn(u,w.app,'raider'));
    const held=rs.every(r=>!r.ok);
    let msg;
    if(held){const p=rs[0].by[0];
      msg=p.grant==='block'?`"${p.name}" blocks this outright.`:w.app==='legacy'?`Legacy clients can't do MFA, so "${p.name}" blocked them outright.`:`They had the password for ${w.targets.length} account${w.targets.length>1?'s':''} but couldn't complete MFA. Stopped by "${p.name}".`;}
    else{const ro=rs.flatMap(r=>r.ro)[0];
      if(ro)msg=`"${ro.name}" would have stopped this, but it's in Report-only, which only logs.`;
      else if(w.app==='legacy'&&S.pol.some(x=>x.state==='on'&&x.ca&&x.apps.includes('browser')&&!x.apps.includes('other')))msg='Your MFA policy only covers some client apps, so legacy sign-ins walked past it.';
      else msg=`No policy that is On covers ${w.who} ${w.how}. ${w.targets.length} guessed password${w.targets.length>1?'s':''} got in.`;}
    return {w,held,msg};
  });
  const checks=[];
  const gar=signIn('g9','browser','legit'),env=signIn('e2','browser','legit');
  const lock=[];if(!gar.ok)lock.push('the Garrison');if(!env.ok)lock.push('the Envoys');
  if(lock.length){const why=[...gar.by,...env.by].find(x=>x.grant==='block')?'a Block access policy covers them on normal browser sign-ins':[...gar.by,...env.by].some(x=>x.ctrl.includes('compliant')&&x.mode==='all')?'"Require device to be marked as compliant" can\'t be met: no device in Duskhold is enrolled in Intune':'a control they can\'t meet';checks.push({k:'broke',t:'Locked out',m:`The raiders were stopped, but so were your own people. ${lock.join(' and ')} couldn't sign in, because ${why}.`})}
  const eaIn=S.pol.some(x=>x.state==='on'&&applies(x,'ea1','browser'));
  if(eaIn)checks.push({k:'warnr',t:'Risk',m:'Your emergency access accounts are inside a policy that is On. If that policy ever breaks, nobody can get in. Exclude them.'});
  const legacyBlock=S.pol.some(x=>x.state==='on'&&x.grant==='block'&&x.ca&&x.apps.includes('other')&&x.apps.includes('eas')&&!x.apps.includes('browser')&&!x.apps.includes('mobile')&&(x.inc==='all'));
  const win=waves.every(v=>v.held)&&!lock.length;
  return {waves,checks,legacyBlock,eaIn,win,lock:lock.length>0};
}

function siege(){
  const R=evaluate();S.report=R;S.stage='siege';save();
  $('phase').textContent=phaseOf('siege');
  $('pane').innerHTML=`<div class="kicker">Night ${S.night}</div><h2>The raiders are at the walls</h2><p style="color:var(--mute)">Watch the three roads.</p><div class="bands">${WAVES.map(w=>`<div class="band" id="b${w.id}"><b>${w.name}</b><span>Coming…</span></div>`).join('')}</div>`;
  wick('<b>Wick:</b> Steady. Your policies are doing the work now, not you.');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fx=$('fx');fx.innerHTML='';
  const finish=()=>{S.stage='report';
    if(R.win){['ca','mfa'].forEach(x=>{if(!S.lit.includes(x))S.lit.push(x)})}
    if(!R.win||R.eaIn){R.waves.filter(v=>!v.held).forEach(v=>addOops(`Night ${S.night}: ${v.w.name}`,v.msg,'Every user covered by an MFA policy that is On'));if(R.eaIn)addOops(`Night ${S.night}: emergency access`,'Emergency access accounts inside a policy','Exclude them from every policy');if(R.lock)addOops(`Night ${S.night}: lockout`,'Own users locked out','Only controls your users can meet')}
    save();render();};
  if(reduce){R.waves.forEach(v=>mark(v));setTimeout(finish,400);return}
  let done=0;
  R.waves.forEach((v,wi)=>{
    const path=$(v.w.path),len=path.getTotalLength();
    const dots=[];for(let i=0;i<6;i++){const c=document.createElementNS(NS,'g');c.innerHTML=`<circle r="6" fill="#ff8a3a" opacity=".35" filter="url(#glow)"/><circle r="2.2" fill="#ffc06a"/>`;fx.appendChild(c);dots.push(c)}
    const t0=performance.now()+wi*1100,dur=3000;
    const step=now=>{
      const t=Math.max(0,(now-t0)/dur);
      dots.forEach((c,i)=>{let k=Math.min(1,t*1.05-i*.035);if(k<0){c.style.opacity=0;return}
        let pos=len*k;if(v.held&&k>=1){pos=len-Math.min(40,(t-1)*90)}
        const pt=path.getPointAtLength(Math.max(0,Math.min(len,pos)));
        const jitter=Math.sin(now/180+i)*2;
        c.setAttribute('transform',`translate(${pt.x+jitter},${pt.y-4+i%2*3})`);
        c.style.opacity=v.held&&t>1.15?Math.max(0,1-(t-1.15)*2.5):1;});
      if(t>=1&&!v.m){v.m=1;mark(v)}
      if(t<1.6)requestAnimationFrame(step);else{dots.forEach(c=>c.remove());if(++done===3)setTimeout(finish,500)}
    };
    requestAnimationFrame(step);
  });
}
function mark(v){
  const d=$(v.w.door),b=d.getBBox(),cx=b.x+b.width/2,cy=b.y+b.height/2;
  const band=$('b'+v.w.id);if(band)band.querySelector('span').textContent=v.held?'Held.':'Breached.';
  if(v.held){const r=document.createElementNS(NS,'circle');r.setAttribute('cx',cx);r.setAttribute('cy',cy);r.setAttribute('r',6);r.setAttribute('fill','none');r.setAttribute('stroke','#f2c66d');r.setAttribute('stroke-width','2');$('fx').appendChild(r);
    if(r.animate)r.animate([{r:6,opacity:1},{r:34,opacity:0}],{duration:900,easing:'ease-out',fill:'forwards'});else r.remove()}
  else{d.setAttribute('fill','#ff5a47');d.style.filter='drop-shadow(0 0 6px #ff5a47)'}
}

function renderReport(p){
  setNight(false);
  const R=S.report;if(!R){S.stage='console';render();return}
  R.waves.forEach(v=>{const d=$(v.w.door);if(!v.held){d.setAttribute('fill','#ff5a47');d.style.filter='drop-shadow(0 0 6px #ff5a47)'}});
  const fol=[];
  fol.push('Reset the guessed passwords for 3 Garrison accounts and 1 Envoy. MFA stopped the raiders at the gate, but they still know those passwords.');
  if(!R.legacyBlock)fol.push('Add a separate "Block legacy authentication" policy for all users (Exchange ActiveSync clients and Other clients, Block access). Then the postern stays shut even if someone narrows the MFA policy later.');
  if(S.pol.some(x=>x.state==='report'))fol.push('A policy is still in Report-only. Check its results in the sign-in logs, then switch it On or delete it.');
  p.innerHTML=`<div class="kicker">Morning after night ${S.night}</div><h2>${R.win?'The citadel held':R.waves.every(v=>v.held)?'Held, but your own people are locked out':'The walls were breached'}</h2>
  <p style="color:var(--mute)">${R.win?'Two lanterns at the Gatehouse are lit: Conditional Access and MFA. They are gold in the Gatehouse list on the left.':'Read why below, fix the console and try the night again. Every wrong turn went to your oopsies.'}</p>
  ${R.waves.map(v=>`<div class="res ${v.held?'held':'broke'}"><span class="tag">${v.held?'Held':'Breached'}</span><div><b>${v.w.name}</b><p>${esc(v.msg)}</p></div></div>`).join('')}
  ${R.checks.map(c=>`<div class="res ${c.k}"><span class="tag">${c.t}</span><div><p style="color:var(--ink)">${esc(c.m)}</p></div></div>`).join('')}
  ${R.legacyBlock?'<div class="res held"><span class="tag">Commended</span><div><b>Postern sealed</b><p>You added a separate legacy block policy. That\'s the baseline real admins use.</p></div></div>':''}
  <h3 style="font-size:16px;margin:18px 0 8px;color:var(--gold)">${R.win?'Before you sleep':'What to fix'}</h3>
  <ul class="list">${(R.win?fol:R.waves.filter(v=>!v.held).map(v=>v.msg).concat(R.lock?['Only use controls your own people can meet.']:[])).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <div class="next"><button class="ghost" id="again" type="button">${R.win?'Replay the night':'Back to the console'}</button>${R.win?'<button class="btn" id="end">What comes next</button>':''}</div>`;
  $('again').onclick=()=>{S.stage='console';S.edit=null;S.night++;save();render()};
  if($('end'))$('end').onclick=()=>{p.innerHTML=`<div class="kicker">End of the demo</div><h2>The rest of the citadel</h2>
    <ul class="facts"><li><b>Gatehouse</b>: PIM, app registrations, consent and managed identities. Raiders: a stolen admin session, a malicious consent request.</li><li><b>Vault</b>: Key Vault. Raiders: a secret leaked in a repo.</li><li><b>Walls</b>: storage, SQL and networking. Raiders: a public blob, open RDP.</li><li><b>Towers</b>: VMs, containers and AI agents. Raiders: a prompt injection on an agent.</li><li><b>Watchtower</b>: Defender for Cloud, Sentinel and Security Copilot. You see the raids coming.</li></ul>
    <div class="next"><button class="ghost" id="bk" type="button">Back to the report</button></div>`;$('bk').onclick=()=>render();wick(`<b>Wick:</b> ${SK.length-S.lit.length} lanterns still dark. One night at a time.`)};
  wick(R.win?'<b>Wick:</b> Two lanterns lit. That\'s two exam skills you can actually do, not just name.':'<b>Wick:</b> Breaches happen. What matters is you know exactly why this one did.');
}

function renderOops(){$('oopsList').innerHTML=S.oops.length?S.oops.map(o=>`<div class="oops"><small>${esc(o.where)} · ${esc(o.t)}</small><div class="was">You: ${esc(o.was)}</div><div class="is">Right: ${esc(o.is)}</div></div>`).join(''):'<p style="color:var(--mute)">No oopsies yet. Wrong answers and breaches land here, ready for practice in Pockle.</p>'}
$('oopsBtn').onclick=()=>{renderOops();$('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false')};
$('closeOops').onclick=()=>{$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true')};
$('resetBtn').onclick=()=>{S=fresh();save();render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('closeOops').click()});
render();
}
</script>
</body>
</html>
