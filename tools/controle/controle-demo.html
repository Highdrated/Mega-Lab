<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle · SC-500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{color-scheme:light;--bg:#f7f3ea;--bg2:#f1ece0;--panel:#fffdf8;--panel2:#fffdf8;--line:rgba(44,42,38,.2);--line2:rgba(44,42,38,.1);--gold:#a8761a;--ember:#c25a24;--ink:#2c2a26;--mute:#6b665b;--dim:#948d7e;--red:#b3261e}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;letter-spacing:.02em;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
code,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:620px}
header{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand h1{font-size:22px;color:var(--ink)}
.exam{flex:1;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap}
.exam b{flex:none;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:1px 8px;font-size:13px}
.exam span{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.phase{flex:none;font-size:14px;color:var(--gold);padding:4px 12px;border:1px solid var(--line);border-radius:20px}
.hbtn{flex:none;background:none;border:1px solid var(--line2);border-radius:20px;padding:4px 12px;font-size:14px;color:var(--mute);cursor:pointer;min-height:32px}
.hbtn:hover,.hbtn:focus-visible{color:var(--ink);border-color:var(--line);outline:none}
.hbtn .n{color:var(--ember);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:#ece6d8;border:1px solid #b8b0a0}
.dot.ember{background:#e7a27a;border-color:#c25a24}
.dot.lit{background:#f0b53a;border-color:#b9851f;box-shadow:0 0 0 2px rgba(185,133,31,.22)}
.road{display:grid;grid-template-columns:28px 120px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
.road svg{width:24px;height:24px;color:var(--ember)}
.road b{font-weight:600;font-size:14px}
.track{position:relative;height:2px;background:var(--line2);border-radius:2px}
.track .mk{position:absolute;top:-4px;left:0;width:10px;height:10px;border-radius:50%;background:#c25a24;opacity:0}
.track .gt{position:absolute;right:-2px;top:-6px;width:3px;height:14px;background:var(--gold);border-radius:1px}
.road .rs{font-size:13px;font-weight:700;text-align:right;color:var(--mute)}
.road .rs.held{color:var(--gold)}.road .rs.broke{color:var(--red)}.road .rs.contained{color:var(--ember)}
.res.contained .tag{background:rgba(194,90,36,.12);color:var(--ember)}
.pim{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 4px}
.pim th{text-align:left;font-weight:600;color:var(--mute);font-size:13px;padding:6px 8px 6px 0;border-bottom:1px solid var(--line2)}
.pim td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.pim td small{display:block;color:var(--mute);font-size:12px}
.pim select,.gs select,.gsel{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-height:36px;max-width:100%}
.mlab{display:none;color:var(--mute);font-size:12px;margin-bottom:4px}
.nw{white-space:nowrap}
.lhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
.art{display:block;height:auto;border-radius:6px;border:1px solid var(--line2);box-shadow:0 8px 22px rgba(44,42,38,.10);background:var(--bg2)}
.art.ward{width:170px}.art.scene{width:220px}
.hero{display:block;width:calc(100% + 40px);max-width:none;height:auto;margin:-14px -20px 8px;-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 70%,transparent 100%)}
.fart{width:96px;height:auto;border-radius:6px;border:1px solid var(--line2);flex:none}
.saved{font-size:13px;color:var(--gold);min-height:1.2em}
.rl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 22px}
.rl li{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:baseline;font-size:14px;padding:3px 0}
.rl i{width:8px;height:8px;border-radius:50%;background:#ece6d8;border:1px solid #b8b0a0;display:block;transform:translateY(-1px)}
.rl .ember i{background:#e7a27a;border-color:#c25a24}
.rl .lit i{background:#f0b53a;border-color:#b9851f}
.rl .lit{color:var(--ink);font-weight:600}
.rl .dark{color:var(--mute)}
.kicker{font-size:13px;color:var(--ember);font-weight:600;margin-bottom:6px}
.pane h2{font-size:26px;color:var(--ink);margin-bottom:6px;text-wrap:balance}
.builds{font-size:13px;color:var(--mute);margin-bottom:14px}
.dots{display:flex;gap:6px;margin:0 0 16px}
.dots i{width:22px;height:3px;border-radius:2px;background:var(--line2)}
.dots i.done{background:var(--gold)}
.dots i.now{background:var(--ember)}
.facts{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
.facts li{padding-left:18px;position:relative}
.facts li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold);}
.facts b{color:var(--gold);font-weight:600}
.card{border:1px solid var(--line2);border-radius:6px;padding:14px 16px;margin-bottom:12px;background:var(--panel2)}
.card.ok{border-color:rgba(185,133,31,.5)}
.card h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ember)}
.card p{margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{flex:1;min-width:180px;background:#ffffff;border:1px solid var(--line2);border-radius:4px;color:var(--ink);padding:9px 12px;font:16px "JetBrains Mono",ui-monospace,monospace;min-height:42px}
input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,133,31,.15)}
.btn{background:var(--ink);color:#fffdf8;border:0;border-radius:4px;padding:9px 16px;font-weight:700;cursor:pointer;min-height:42px}
.btn:hover{background:#45423b}
.btn:focus-visible,.ghost:focus-visible,.opt:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.ghost{background:none;border:1px solid var(--line);border-radius:4px;padding:9px 14px;cursor:pointer;color:var(--ink);min-height:42px}
.ghost:hover{border-color:var(--gold)}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:#ffffff;border:1px solid var(--line2);border-radius:4px;padding:8px 12px;cursor:pointer;min-height:42px}
.opt:hover{border-color:var(--line)}
.opt:disabled{cursor:default;color:inherit}
.opt.right{border-color:var(--gold);color:var(--gold)}
.opt.wrong{border-color:var(--red);color:#b3261e}
.fb{font-size:14px;margin-top:8px;min-height:1.2em}
.fb.bad{color:#b3261e}.fb.good{color:var(--gold)}
.next{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.wick svg{flex:none;margin-top:2px}
.wick p{margin:0;font-size:15px;color:var(--mute)}
.wick p b{color:var(--ink);font-weight:600}
.wick p{flex:1}
.askw{flex:none;min-height:36px;padding:5px 12px;font-size:14px;align-self:center}
.askw[hidden]{display:none}
.tenant{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0 0 14px}
.tenant dt{color:var(--mute)}
.tenant dd{margin:0}
.bands{display:grid;gap:8px;margin-bottom:14px}
.band{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 12px;border-left:2px solid var(--ember);background:var(--panel2);border-radius:0 4px 4px 0;font-size:15px}
.band b{color:var(--ink);font-weight:600}
.crumb{font-size:13px;color:var(--mute);margin-bottom:10px}
.pol{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;margin-bottom:8px;background:var(--panel2)}
.pol .nm{font-weight:600}
.state{font-size:13px;padding:2px 9px;border-radius:12px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.state.on{color:var(--gold);border-color:var(--gold)}
.state.report{color:var(--ember);border-color:rgba(194,90,36,.6)}
.form{display:grid;gap:12px}
fieldset{border:1px solid var(--line2);border-radius:5px;padding:10px 14px 12px;margin:0}
legend{padding:0 6px;font-size:14px;font-weight:600;color:var(--gold)}
.sub{font-size:13px;color:var(--mute);margin:6px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer;font-size:15px}
label.ck input{accent-color:var(--gold);width:17px;height:17px;flex:none}
.warn{font-size:14px;border:1px solid rgba(194,90,36,.5);background:rgba(194,90,36,.08);border-radius:4px;padding:8px 10px;margin-top:8px}
.err{color:#b3261e;font-size:14px;min-height:1.2em}
.res{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-radius:5px;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line2)}
.res .tag{font-weight:700;font-size:13px;padding:2px 9px;border-radius:12px;align-self:start;white-space:nowrap}
.res.held .tag{background:rgba(185,133,31,.15);color:var(--gold)}
.res.broke .tag{background:rgba(179,38,30,.1);color:var(--red)}
.res.warnr .tag{background:rgba(194,90,36,.15);color:var(--ember)}
.res b{font-weight:600}
.res p{margin:2px 0 0;font-size:15px;color:var(--mute)}
.list{margin:0 0 14px;padding-left:20px}
.list li{margin-bottom:6px}
.drawer{position:fixed;top:0;right:0;width:min(440px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;z-index:10;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .bd{overflow:auto;padding:16px 20px}
.oops{border-bottom:1px solid var(--line2);padding:10px 0;font-size:15px}
.oops small{color:var(--mute);display:block}
.oops .was{color:#b3261e}.oops .is{color:var(--gold)}
main{display:grid;grid-template-columns:92px minmax(0,1fr);min-height:0}
.rail{display:flex;flex-direction:column;gap:4px;padding:14px 10px;border-right:1px solid var(--line);background:var(--bg);overflow:auto}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:1px solid transparent;border-radius:10px;padding:9px 4px 8px;cursor:pointer;color:var(--ink);transition:background .25s,border-color .25s}
.rb:hover{background:var(--panel);border-color:var(--line2)}
.rb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rb.here{background:var(--panel);border-color:var(--line)}
.rb svg{width:26px;height:26px;color:var(--gold)}
.rb .rn{font-size:12px;font-weight:600}
.rb .rc{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.rbar{width:44px;height:3px;border-radius:2px;background:var(--line2);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--gold);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.rsep{height:1px;background:var(--line2);margin:6px 10px;flex:none}
.rb.litup svg{animation:litup 1.6s ease-out}
.rb.litup .rc{animation:pop .9s ease-out}
@keyframes litup{0%{filter:drop-shadow(0 0 0 rgba(240,181,58,0));transform:scale(1)}30%{filter:drop-shadow(0 0 10px rgba(240,181,58,.95));transform:scale(1.2)}100%{filter:drop-shadow(0 0 0 rgba(240,181,58,0));transform:scale(1)}}
@keyframes pop{0%{color:var(--gold);transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.mainc{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;background:linear-gradient(180deg,rgba(194,90,36,.05),rgba(194,90,36,0) 200px),var(--panel);transition:background .8s}
.mainc.night{background:linear-gradient(180deg,rgba(60,70,110,.07),rgba(60,70,110,0) 200px),var(--panel)}
.roads{padding:16px max(28px,calc((100% - 780px)/2)) 14px;display:grid;gap:8px;border-bottom:1px solid var(--line2)}
.roads:empty{display:none}
.pane{overflow:auto;padding:24px max(28px,calc((100% - 780px)/2)) 20px}
.wick{display:flex;gap:12px;align-items:flex-start;padding:12px max(28px,calc((100% - 780px)/2));border-top:1px solid var(--line);background:var(--bg2);min-height:64px}
.roll h3{font-size:16px;color:var(--ink);margin:16px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.roll h3 small{font-family:"Source Sans 3",sans-serif;font-size:13px;color:var(--mute);font-weight:400;letter-spacing:0}
.fly{position:fixed;top:0;left:0;width:min(460px,100%);height:100%;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .34s cubic-bezier(.2,.7,.2,1);z-index:10;display:flex;flex-direction:column;box-shadow:16px 0 40px rgba(44,42,38,.08)}
.fly.open{transform:none}
.fly .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.fly .bd{overflow:auto;padding:16px 20px}
.fhead{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:14px}
.fhead svg{width:30px;height:30px;color:var(--gold);flex:none}
.fdots{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 4px}
.fly .rl{grid-template-columns:1fr}
.day{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.day b{font-weight:600}
.day small{display:block;color:var(--mute);font-size:13px}
.day .acts{display:flex;gap:6px;grid-column:1/-1}
.day .acts .ghost{min-height:36px;padding:5px 12px;font-size:14px}
.day .acts .ghost:disabled{opacity:.4;cursor:default}
.tagd{font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;white-space:nowrap}
.tagd.won{background:rgba(185,133,31,.15);color:var(--gold)}.tagd.prog{background:rgba(194,90,36,.12);color:var(--ember)}.tagd.lock{background:var(--line2);color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pane.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
.card.just{animation:forged .9s ease-out}
@keyframes forged{0%{box-shadow:0 0 0 0 rgba(185,133,31,.45)}100%{box-shadow:0 0 0 14px rgba(185,133,31,0)}}
.opt{transition:border-color .25s,color .25s,background .25s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1100px){.exam span{display:none}}
@media (max-width:860px){.app{height:auto}main{grid-template-columns:1fr}.rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding:8px 10px}.rb{min-width:74px;flex:none}.rsep{width:1px;height:auto;margin:8px 4px}.mainc{min-height:75vh}.pane{padding:20px}.roads{padding:14px 20px 0}.wick{padding:12px 20px}}
@media (max-width:600px){.lhead{grid-template-columns:1fr;gap:14px}.lhead .art{order:-1}.art.ward{width:140px}.art.scene{width:min(240px,70%)}.mlab{display:block}.pim thead{display:none}.pim tr{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line2)}.pim td{border:0;padding:0}.pim td:first-child{grid-column:1/-1}.pim select{width:100%}.road{grid-template-columns:24px minmax(0,1fr) 72px}.road .track{grid-column:1/-1;grid-row:2}.rl{grid-template-columns:1fr}header{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}.exam{order:3;flex-basis:100%}.band{grid-template-columns:1fr}.pane h2{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M7 3h8l2 4H5z" fill="#b9851f"/><rect x="5" y="7" width="12" height="14" rx="2" fill="none" stroke="#b9851f" stroke-width="1.6"/><circle cx="11" cy="14" r="3.2" fill="#c25a24"/><path d="M8 21h6v3H8z" fill="#b9851f"/></svg>
    <h1>Controle</h1>
  </div>
  <div class="exam"><b>Exam SC-500</b><span>Implementing End-to-End Security Controls for Cloud and AI Workloads</span></div>
  <div class="phase" id="phase">Day 1 · The forge</div>
  <button class="hbtn" id="oopsBtn" type="button">Oopsies <span class="n" id="oopsN">0</span></button>
  <button class="hbtn" id="resetBtn" type="button">Reset</button>
</header>
<main>
  <nav class="rail" id="rail" aria-label="Citadel"></nav>
  <section class="mainc" id="mainc">
    <div class="roads" id="roads"></div>
    <div class="pane" id="pane" aria-live="polite"></div>
    <div class="wick">
      <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M10 4h10l3 5H7z" fill="#b9851f"/><rect x="7" y="9" width="16" height="18" rx="3" fill="#fffdf8" stroke="#b9851f" stroke-width="1.5"/><circle cx="15" cy="18" r="4.5" fill="#c25a24"/><path d="M11 27h8v4h-8z" fill="#b9851f"/></svg>
      <p id="wick"></p><button class="ghost askw" id="askw" type="button">Ask Wick</button>
    </div>
  </section>
</main>
<div class="fly" id="fly" aria-hidden="true"><div class="hd"><h2 id="flyT" style="font-size:20px"></h2><button class="ghost" id="flyX" type="button">Close</button></div><div class="bd" id="flyB"></div></div>
</div>
<div class="drawer" id="drawer" aria-hidden="true">
  <div class="hd"><h2 style="font-size:20px">Oopsies</h2><button class="ghost" id="closeOops" type="button">Close</button></div>
  <div class="bd" id="oopsList"></div>
</div>
<script>
{
const SK=[
 {w:'gate',d:1,n:'Configure Privileged Identity Management (PIM)',id:'pim'},
 {w:'gate',d:1,n:'Implement conditional access policies',id:'ca'},
 {w:'gate',d:1,n:'Configure authentication methods, including MFA and passwordless',id:'mfa'},
 {w:'gate',d:1,n:'Configure identity for applications: enterprise apps and app registrations',id:'apps'},
 {w:'gate',d:1,n:'Manage OAuth permission grants and consent settings',id:'consent'},
 {w:'gate',d:1,n:'Configure managed identities for Azure resources',id:'mi'},
 {w:'vault',d:1,n:'Deploy Key Vault'},{w:'vault',d:1,n:'Configure Key Vault settings',id:'kvset'},{w:'vault',d:1,n:'Configure access to Key Vault',id:'kvaccess'},{w:'vault',d:1,n:'Configure Key Vault firewall settings',id:'kvfw'},{w:'vault',d:1,n:'Manage keys, secrets and certificates'},{w:'vault',d:1,n:'Scan for secrets with Defender CSPM'},{w:'vault',d:1,n:'Implement Defender for Key Vault'},
 {w:'keep',d:1,n:'Security controls with Azure Policy (built-in and custom)'},{w:'keep',d:1,n:'Evaluate regulatory compliance in Defender for Cloud'},{w:'keep',d:1,n:'Security standards and recommendations in Defender for Cloud'},{w:'keep',d:1,n:'Implement resource locks',id:'locks'},{w:'keep',d:1,n:'Manage Azure built-in role assignments',id:'rbac'},{w:'keep',d:1,n:'Manage custom Azure and Entra roles'},{w:'keep',d:1,n:'Remediate overprivileged access with Azure RBAC'},{w:'keep',d:1,n:'Azure Backup security features'},{w:'keep',d:1,n:'Security controls with infrastructure as code'},

      if(!v.trim()){$('sfb').textContent='Type your answer first.';$('sfb').className='fb bad';return}
      if(l.s.a.includes(norm(v))){S.strike=true;S.tries=0;S.note=norm(v)!==norm(l.s.show);save();justForged=true;render();justForged=false;return}
      S.tries++;addOops(`Day ${S.ch}, lesson ${S.li+1}: ${l.t}`,v,l.s.show);save();
      const fb=$('sfb');fb.className='fb bad';

    p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.temper||!S.strike)return;const i=+b.dataset.i;
      if(i===l.c.r){S.temper=true;S.maxLi=Math.max(S.maxLi||0,S.li);save();render();wick('<b>Wick:</b> '+(S.li===LL.length-1?'That\'s the day done. The scouts are back.':'Good. That one holds.'))}
      else{b.classList.add('wrong');addOops(`Day ${S.ch}, lesson ${S.li+1}: ${l.t}`,l.c.o[i],l.c.o[l.c.r]);save();$('tfb').className='fb bad';$('tfb').textContent='Not that one. Read the facts above again and try another.'}});
    $('nx').onclick=()=>{if(S.li<LL.length-1){S.li++;const seen=S.li<=(S.maxLi??-1);S.strike=S.temper=seen;S.note=false;S.tries=0}else{S.stage='brief';S.daysDone=[...new Set([...(S.daysDone||[]),S.ch])];C.studied.forEach(x=>{if(!S.studied.includes(x))S.studied.push(x)})}save();render();$('pane').scrollTop=0};
    if($('back'))$('back').onclick=()=>{S.li--;S.strike=S.temper=true;S.note=false;save();render()};

  }
  if(S.stage==='brief'){setNight(false);C.brief(p);withScene(p,S.ch);return}

}

function summary(x){
  const who=x.inc==='all'?'All users':x.inc==='groups'&&x.incG.length?x.incG.map(g=>GROUPS[g]).join(', '):'No users';
  const ex=x.excG.length?' except '+x.excG.map(g=>GROUPS[g]).join(', '):'';
  const what=x.res==='all'?'All resources':x.res==='o365'?'Office 365':'No resources';
  const apps=x.ca?' · Client apps: '+(x.apps.length?x.apps.map(a=>APPN[a]).join(', '):'none'):'';
  const g=x.grant==='block'?'Block access':x.ctrl.length?x.ctrl.map(c=>CTRLN[c]).join(x.mode==='all'?' and ':' or '):'Grant access, no controls';
  return esc(`${who}${ex} · ${what}${apps} · ${g}`);
}
const APPN={browser:'Browser',mobile:'Mobile apps and desktop clients',eas:'Exchange ActiveSync clients',other:'Other clients'};
const CTRLN={mfa:'Require multifactor authentication',compliant:'Require device to be marked as compliant'};

function applies(x,u,app){
  const g=USERS[u];
  const inc=x.inc==='all'||(x.inc==='groups'&&x.incG.includes(g));
  if(!inc||x.excG.includes(g)||x.res==='none')return false;
  if(x.ca){const m=app==='legacy'?['other']:['browser'];if(!x.apps.some(a=>m.includes(a)))return false}
  return true;
}
function signIn(u,app,actor){
  const can={mfa:actor==='legit'&&app!=='legacy',compliant:false};
  const out={ok:true,by:[],ro:[]};
  for(const x of S.pol){
    if(x.state==='off'||!applies(x,u,app))continue;
    const blocks=x.grant==='block'||!(x.mode==='one'?x.ctrl.some(c=>can[c]):x.ctrl.every(c=>can[c]));
    if(!blocks)continue;
    if(x.state==='report')out.ro.push(x);else{out.ok=false;out.by.push(x)}
  }
  return out;
}
function evaluate(){
  const waves=WAVES.map(w=>{
    const rs=w.targets.map(u=>signIn(u,w.app,'raider'));
    const held=rs.every(r=>!r.ok);
    let msg;
    if(held){const p=rs[0].by[0];
      msg=p.grant==='block'?`"${p.name}" blocks this outright.`:w.app==='legacy'?`Legacy clients can't do MFA, so "${p.name}" blocked them outright.`:`They had the password for ${w.targets.length} account${w.targets.length>1?'s':''} but couldn't complete MFA. Stopped by "${p.name}".`;}
    else{const ro=rs.flatMap(r=>r.ro)[0];
      if(ro)msg=`"${ro.name}" would have stopped this, but it's in Report-only, which only logs.`;
      else if(w.app==='legacy'&&S.pol.some(x=>x.state==='on'&&x.ca&&x.apps.includes('browser')&&!x.apps.includes('other')))msg='Your MFA policy only covers some client apps, so legacy sign-ins walked past it.';
      else msg=`No policy that is On covers ${w.who} ${w.how}. ${w.targets.length} guessed password${w.targets.length>1?'s':''} got in.`;}
    return {w,held,msg};
  });
  const checks=[];
  const gar=signIn('g9','browser','legit'),env=signIn('e2','browser','legit');
  const lock=[];if(!gar.ok)lock.push('the Garrison');if(!env.ok)lock.push('the Envoys');
  if(lock.length){const why=[...gar.by,...env.by].find(x=>x.grant==='block')?'a Block access policy covers them on normal browser sign-ins':[...gar.by,...env.by].some(x=>x.ctrl.includes('compliant')&&x.mode==='all')?'"Require device to be marked as compliant" can\'t be met: no device in Duskhold is enrolled in Intune':'a control they can\'t meet';checks.push({k:'broke',t:'Locked out',m:`The raiders were stopped, but so were your own people. ${lock.join(' and ')} couldn't sign in, because ${why}.`})}
  const eaIn=S.pol.some(x=>x.state==='on'&&applies(x,'ea1','browser'));
  if(eaIn)checks.push({k:'warnr',t:'Risk',m:'Your emergency access accounts are inside a policy that is On. If that policy ever breaks, nobody can get in. Exclude them.'});
  const legacyBlock=S.pol.some(x=>x.state==='on'&&x.grant==='block'&&x.ca&&x.apps.includes('other')&&x.apps.includes('eas')&&!x.apps.includes('browser')&&!x.apps.includes('mobile')&&(x.inc==='all'));
  const win=waves.every(v=>v.held)&&!lock.length;
  return {waves,checks,legacyBlock,eaIn,win,lock:lock.length>0};
}

function siege(){
  const C=CH[S.ch],run=S,R=C.evaluate();R.waves.forEach(v=>v.res=resOf(v));S.report=R;S.stage='siege';save();
  $('phase').textContent=phaseOf('siege');
  $('pane').innerHTML=`<div class="kicker">Night ${S.ch}</div><h2>The raiders are at the walls</h2><p style="color:var(--mute)">Watch the roads on the left. Your ${C.what} decide what happens now.</p>`;
  wick(`<b>Wick:</b> Steady. Your ${C.what} are doing the work now, not you.`);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish=()=>{if(S!==run)return;S.stage='report';
    if(R.win){C.lit.forEach(x=>{if(!S.lit.includes(x))S.lit.push(x)});S.won=[...new Set([...(S.won||[]),S.ch])];S.reached=Math.max(S.reached||1,Math.min(S.ch+1,Object.keys(CH).length))}
    R.waves.filter(v=>v.res!=='held').forEach(v=>addOops(`Night ${S.ch}: ${v.w.name}`,v.msg,C.fix));
    R.checks.filter(c=>c.k!=='held').forEach(c=>addOops(`Night ${S.ch}: ${c.t}`,c.m,'See the morning report'));
    save();render();};
  drawRoads(null);
  if(reduce){setTimeout(finish,300);return}
  let done=0;
  R.waves.forEach((v,wi)=>{
    const row=$('r'+v.w.id),mk=row.querySelector('.mk'),rs=row.querySelector('.rs');
    const t0=performance.now()+wi*900,dur=2200;
    const step=now=>{if(S!==run)return;const t=(now-t0)/dur;
      if(t<0){requestAnimationFrame(step);return}
      const k=Math.min(1,t);mk.style.opacity=1;
      mk.style.left=`calc(${(v.res==='held'?Math.min(k,.94):k)*100}% - ${k*10}px)`;
      if(t<1){requestAnimationFrame(step);return}
      rs.textContent={held:'Held',contained:'Contained',broke:'Breached'}[v.res];rs.className='rs '+v.res;
      if(v.res==='held'){mk.style.background='var(--gold)';setTimeout(()=>mk.style.opacity=0,500)}
      else mk.style.background=v.res==='contained'?'var(--ember)':'var(--red)';
      if(++done===R.waves.length)setTimeout(finish,900)};
    requestAnimationFrame(step);
  });
}

:</b> Last one today. Hand out keys to one room, not the whole castle.']};

$('oopsBtn').onclick=()=>{renderOops();$('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false');setTimeout(()=>$('closeOops').focus(),50)};
