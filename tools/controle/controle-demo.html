<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Controle · SC-500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{color-scheme:light;--bg:#f7f3ea;--bg2:#f1ece0;--panel:#fffdf8;--panel2:#fffdf8;--line:rgba(44,42,38,.2);--line2:rgba(44,42,38,.1);--gold:#a8761a;--ember:#c25a24;--ink:#2c2a26;--mute:#6b665b;--dim:#948d7e;--red:#b3261e}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;letter-spacing:.02em;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
code,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:620px}
header{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand h1{font-size:22px;color:var(--ink)}
.exam{flex:1;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap}
.exam b{flex:none;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:1px 8px;font-size:13px}
.exam span{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.phase{flex:none;font-size:14px;color:var(--gold);padding:4px 12px;border:1px solid var(--line);border-radius:20px}
.hbtn{flex:none;background:none;border:1px solid var(--line2);border-radius:20px;padding:4px 12px;font-size:14px;color:var(--mute);cursor:pointer;min-height:32px}
.hbtn:hover,.hbtn:focus-visible{color:var(--ink);border-color:var(--line);outline:none}
.hbtn .n{color:var(--ember);font-weight:700}
main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(400px,560px);min-height:0}
.stage{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;border-right:1px solid var(--line);row-gap:0}
.stage{background:linear-gradient(180deg,rgba(194,90,36,.07),rgba(194,90,36,0) 220px),var(--bg);transition:background .8s}
.stage.night{background:linear-gradient(180deg,rgba(60,70,110,.07),rgba(60,70,110,0) 220px),var(--bg)}
.citadel{padding:18px 20px 14px}
.chead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.chead h2{font-size:20px;color:var(--ink)}
.chead span{font-size:13px;color:var(--mute)}
.wardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wcard{display:grid;grid-template-columns:36px 1fr;gap:4px 12px;text-align:left;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.wcard:hover{border-color:var(--line)}
.wcard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wcard.sel{border-color:var(--gold);background:rgba(185,133,31,.05)}
.wcard svg{grid-row:span 2;width:30px;height:30px;color:var(--gold);margin-top:2px}
.wcard b{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.wcard b i{font-style:normal;font-weight:400;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.wcard small{color:var(--dim);font-size:12px}
.dots2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#ece6d8;border:1px solid #b8b0a0}
.dot.ember{background:#e7a27a;border-color:#c25a24}
.dot.lit{background:#f0b53a;border-color:#b9851f;box-shadow:0 0 0 2px rgba(185,133,31,.22)}
.roads{padding:0 20px;display:grid;gap:8px}
.roads:empty{display:none}
.road{display:grid;grid-template-columns:28px 120px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
.road svg{width:24px;height:24px;color:var(--ember)}
.road b{font-weight:600;font-size:14px}
.track{position:relative;height:2px;background:var(--line2);border-radius:2px}
.track .mk{position:absolute;top:-4px;left:0;width:10px;height:10px;border-radius:50%;background:#c25a24;opacity:0}
.track .gt{position:absolute;right:-2px;top:-6px;width:3px;height:14px;background:var(--gold);border-radius:1px}
.road .rs{font-size:13px;font-weight:700;text-align:right;color:var(--mute)}
.road .rs.held{color:var(--gold)}.road .rs.broke{color:var(--red)}
.roll{overflow:auto;padding:14px 20px 18px;margin-top:14px;border-top:1px solid var(--line2)}
.roll h3{font-size:16px;color:var(--ink);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.roll h3 small{font-family:"Source Sans 3",sans-serif;font-size:13px;color:var(--mute);font-weight:400;letter-spacing:0}
.rl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 22px}
.rl li{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:baseline;font-size:14px;padding:3px 0}
.rl i{width:8px;height:8px;border-radius:50%;background:#ece6d8;border:1px solid #b8b0a0;display:block;transform:translateY(-1px)}
.rl .ember i{background:#e7a27a;border-color:#c25a24}
.rl .lit i{background:#f0b53a;border-color:#b9851f}
.rl .lit{color:var(--ink);font-weight:600}
.rl .dark{color:var(--mute)}
.side{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;background:var(--panel)}
.pane{overflow:auto;padding:20px 28px 18px}
.kicker{font-size:13px;color:var(--ember);font-weight:600;margin-bottom:6px}
.pane h2{font-size:26px;color:var(--ink);margin-bottom:6px;text-wrap:balance}
.builds{font-size:13px;color:var(--mute);margin-bottom:14px}
.dots{display:flex;gap:6px;margin:0 0 16px}
.dots i{width:22px;height:3px;border-radius:2px;background:var(--line2)}
.dots i.done{background:var(--gold)}
.dots i.now{background:var(--ember)}
.facts{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
.facts li{padding-left:18px;position:relative}
.facts li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold);}
.facts b{color:var(--gold);font-weight:600}
.card{border:1px solid var(--line2);border-radius:6px;padding:14px 16px;margin-bottom:12px;background:var(--panel2)}
.card.ok{border-color:rgba(185,133,31,.5)}
.card h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ember)}
.card p{margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{flex:1;min-width:180px;background:#ffffff;border:1px solid var(--line2);border-radius:4px;color:var(--ink);padding:9px 12px;font:16px "JetBrains Mono",ui-monospace,monospace;min-height:42px}
input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,133,31,.15)}
.btn{background:var(--ink);color:#fffdf8;border:0;border-radius:4px;padding:9px 16px;font-weight:700;cursor:pointer;min-height:42px}
.btn:hover{background:#45423b}
.btn:focus-visible,.ghost:focus-visible,.opt:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.ghost{background:none;border:1px solid var(--line);border-radius:4px;padding:9px 14px;cursor:pointer;color:var(--ink);min-height:42px}
.ghost:hover{border-color:var(--gold)}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:#ffffff;border:1px solid var(--line2);border-radius:4px;padding:8px 12px;cursor:pointer;min-height:42px}
.opt:hover{border-color:var(--line)}
.opt.right{border-color:var(--gold);color:var(--gold)}
.opt.wrong{border-color:var(--red);color:#b3261e}
.fb{font-size:14px;margin-top:8px;min-height:1.2em}
.fb.bad{color:#b3261e}.fb.good{color:var(--gold)}
.next{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.wick{display:flex;gap:12px;align-items:flex-start;padding:12px 28px;border-top:1px solid var(--line);background:var(--bg2);min-height:64px}
.wick svg{flex:none;margin-top:2px}
.wick p{margin:0;font-size:15px;color:var(--mute)}
.wick p b{color:var(--ink);font-weight:600}
.tenant{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0 0 14px}
.tenant dt{color:var(--mute)}
.tenant dd{margin:0}
.bands{display:grid;gap:8px;margin-bottom:14px}
.band{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 12px;border-left:2px solid var(--ember);background:var(--panel2);border-radius:0 4px 4px 0;font-size:15px}
.band b{color:var(--ink);font-weight:600}
.crumb{font-size:13px;color:var(--mute);margin-bottom:10px}
.pol{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;margin-bottom:8px;background:var(--panel2)}
.pol .nm{font-weight:600}
.state{font-size:13px;padding:2px 9px;border-radius:12px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.state.on{color:var(--gold);border-color:var(--gold)}
.state.report{color:var(--ember);border-color:rgba(194,90,36,.6)}
.form{display:grid;gap:12px}
fieldset{border:1px solid var(--line2);border-radius:5px;padding:10px 14px 12px;margin:0}
legend{padding:0 6px;font-size:14px;font-weight:600;color:var(--gold)}
.sub{font-size:13px;color:var(--mute);margin:6px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer;font-size:15px}
label.ck input{accent-color:var(--gold);width:17px;height:17px;flex:none}
.warn{font-size:14px;border:1px solid rgba(194,90,36,.5);background:rgba(194,90,36,.08);border-radius:4px;padding:8px 10px;margin-top:8px}
.err{color:#b3261e;font-size:14px;min-height:1.2em}
.res{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-radius:5px;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line2)}
.res .tag{font-weight:700;font-size:13px;padding:2px 9px;border-radius:12px;align-self:start;white-space:nowrap}
.res.held .tag{background:rgba(185,133,31,.15);color:var(--gold)}
.res.broke .tag{background:rgba(179,38,30,.1);color:var(--red)}
.res.warnr .tag{background:rgba(194,90,36,.15);color:var(--ember)}
.res b{font-weight:600}
.res p{margin:2px 0 0;font-size:15px;color:var(--mute)}
.list{margin:0 0 14px;padding-left:20px}
.list li{margin-bottom:6px}
.drawer{position:fixed;top:0;right:0;width:min(440px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;z-index:10;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .bd{overflow:auto;padding:16px 20px}
.oops{border-bottom:1px solid var(--line2);padding:10px 0;font-size:15px}
.oops small{color:var(--mute);display:block}
.oops .was{color:#b3261e}.oops .is{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.drawer,.stage{transition:none}}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr) minmax(360px,460px)}.wardgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.exam span{display:none}}
@media (max-width:860px){.app{height:auto}main{grid-template-columns:1fr}.stage{display:contents}.citadel{order:1}.side{order:3}.roads{order:2;padding-bottom:14px}.roll{order:4;max-height:none}.side{min-height:60vh}.pane{padding:20px}.wick{padding:12px 20px}}
@media (max-width:600px){.wardgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.road{grid-template-columns:24px minmax(0,1fr) 72px}.road .track{grid-column:1/-1;grid-row:2}.rl{grid-template-columns:1fr}header{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}.exam{order:3;flex-basis:100%}.band{grid-template-columns:1fr}.pane h2{font-size:24px}}
</style>
</head>

<script>
{
const SK=[

 {t:'The spray',b:'First step. Nothing before it.',f:['A <b>password spray</b> tries a few common passwords, such as <code>Autumn2026!</code>, against many accounts at once.','It stays under the lockout limit on each account. Entra <b>smart lockout</b> locks an account after 10 failed tries by default, so a spray slips under it.','A guessed password is only half a key when the account also needs a second factor.'],
  s:{q:'What is this attack called?',a:['password spray','password spraying'],show:'password spray'},
  c:{q:'Why doesn\'t smart lockout stop a spray?',o:['It tries only a few passwords on each account','Smart lockout is off by default','Sprays only target admin accounts'],r:0,why:'Each account sees only one or two tries, far below the lockout limit.'}},
 {t:'The gate rule',b:'Builds on: The spray.',f:['<b>Conditional Access</b> is the gatekeeper in Microsoft Entra ID. It decides on every sign-in.','Each policy reads: <b>who</b> (Users) and <b>what</b> (Target resources), under which <b>conditions</b>, then <b>grant</b> or <b>block</b>.','It needs a Microsoft Entra ID <b>P1</b> licence. Duskhold has P1.'],
  s:{q:'Which Entra feature makes the if-then decision on every sign-in?',a:['conditional access'],show:'Conditional Access'},
  c:{q:'In a policy, where do you pick who it applies to?',o:['Users','Target resources','Grant'],r:0,why:'Users is the "who". Target resources is the "what". Grant is the "then".'}},
 {t:'The second key',b:'Builds on: The gate rule.',f:['Against sprays, the grant control is <b>Require multifactor authentication</b>.','Scope it wide: Users <b>All users</b>, Target resources <b>All resources</b> (formerly "All cloud apps").','A raider with a guessed password can\'t complete MFA, so the sign-in fails.'],
  s:{q:'Type the grant control exactly as the portal names it.',a:['require multifactor authentication','require multi-factor authentication'],show:'Require multifactor authentication'},
  c:{q:'A policy includes only the Garrison group. Who is not protected by it?',o:['Everyone outside Garrison, such as the Envoys','Nobody, MFA covers the whole tenant','Only global admins'],r:0,why:'A policy only touches the users it includes. Anyone else signs in with just a password.'}},
 {t:'Test before you lock',b:'Builds on: The second key.',f:['<b>Report-only</b> evaluates a policy and writes the result to the sign-in logs. It enforces nothing.','When the logs look right, set <b>Enable policy</b> to <b>On</b>.','Exclude your <b>emergency access</b> (break-glass) accounts from every policy, so a broken policy can\'t lock everyone out. Guard them with a strong sign-in method such as a passkey and alert on every sign-in.'],
  s:{q:'Which policy state logs the result but doesn\'t enforce it?',a:['report-only','report only'],show:'Report-only'},
  c:{q:'Which accounts do you exclude from all Conditional Access policies?',o:['Emergency access accounts','All global admins','All guest accounts'],r:0,why:'Excluding every admin would leave your most powerful accounts unprotected. Only the emergency accounts stay out.'}},
 {t:'The old postern',b:'Builds on: The second key, Test before you lock.',f:['<b>Legacy authentication</b> sends only a username and password, so it can\'t do MFA. Microsoft has switched it off for most Exchange Online protocols, but blocking it is still a baseline policy.','A Require MFA policy that covers all client apps blocks legacy sign-ins outright, because they can\'t complete the challenge.','The baseline is still a separate block policy: Conditions, Client apps, Configure <b>Yes</b>, tick only <b>Exchange ActiveSync clients</b> and <b>Other clients</b>, then Grant <b>Block access</b>.'],
  s:{q:'Which client apps option covers legacy protocols other than ActiveSync?',a:['other clients'],show:'Other clients'},
  c:{q:'Your MFA policy has Client apps set to Browser only. A raider signs in with a legacy client. What happens?',o:['The policy doesn\'t apply, so a guessed password gets in','He gets an MFA prompt and fails it','Legacy clients are always blocked'],r:0,why:'Once you configure Client apps, the policy only covers the boxes you ticked.'}}
];

const WAVES=[
 {id:'A',name:'Western road',path:'pathA',door:'gateDoor',app:'browser',targets:['g1','g2'],who:'the Garrison',how:'through the sign-in page'},
 {id:'B',name:'River gate',path:'pathB',door:'riverDoor',app:'browser',targets:['e1'],who:'the Envoys',how:'through the sign-in page'},
 {id:'C',name:'Old postern',path:'pathC',door:'posternDoor',app:'legacy',targets:['g3'],who:'everyone',how:'with a legacy client'}

const startPol=()=>[{id:'p1',name:'Gate - MFA for garrison',inc:'groups',incG:['garrison'],excG:[],res:'all',ca:false,apps:[],grant:'grant',ctrl:['mfa'],mode:'all',state:'report'}];

let S;
const KEY='controle.demo.v1';
const fresh=()=>({wing:'gate',stage:'intro',li:0,strike:false,temper:false,tries:0,studied:[],lit:[],oops:[],pol:startPol(),edit:null,night:1,report:null});
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const WARDS=['gate','vault','keep','walls','towers','watch'];
const WD={gate:'Identity · 20–25%',vault:'Identity · 20–25%',keep:'Governance · 20–25%',walls:'Storage and network · 25–30%',towers:'Compute and AI · 20–25%',watch:'Posture · 20–25%'};
const stOf=x=>S.lit.includes(x.id)?'lit':S.studied.includes(x.id)?'ember':'dark';
const stTxt={lit:'Lit: held in a siege',ember:'Ember: studied',dark:'Unlit: not studied yet'};
function drawWards(){
  $('wards').innerHTML=WARDS.map(w=>{const all=SK.filter(s=>s.w===w);const lit=all.filter(s=>S.lit.includes(s.id)).length;
    return `<button type="button" class="wcard ${S.wing===w?'sel':''}" data-w="${w}">${icon(w)}<b>${WN[w]}<i>${lit}/${all.length}</i></b><small>${WD[w]}</small><span class="dots2">${all.map(x=>`<span class="dot ${stOf(x)}" title="${esc(x.n)} (${stTxt[stOf(x)]})"></span>`).join('')}</span></button>`}).join('');
  $('wards').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.wing=b.dataset.w;save();drawWards()});
  const all=SK.filter(s=>s.w===S.wing);
  $('roll').innerHTML=`<h3><span>${WN[S.wing]} · ${all.length} exam skills</span><small>Unlit: not studied · Ember: studied · Lit: held in a siege</small></h3><ul class="rl">${all.map(x=>`<li class="${stOf(x)}"><i></i><span>${esc(x.n)}</span></li>`).join('')}</ul>`;
}
const RI={A:'road',B:'river',C:'door'};
function drawRoads(res){
  const show=['console','siege','report'].includes(S.stage);
  if(!show){$('roads').innerHTML='';return}
  $('roads').innerHTML=WAVES.map(w=>{const r=res&&res[w.id];return `<div class="road" id="r${w.id}">${icon(RI[w.id])}<div><b>${w.name}</b></div><div class="track"><span class="mk"></span><span class="gt"></span></div><span class="rs ${r||''}">${r==='held'?'Held':r==='broke'?'Breached':S.stage==='siege'?'Coming':'Quiet'}</span></div>`}).join('');
}
function setNight(on){$('stage').classList.toggle('night',!!on)}
function resetDoors(){}
function addOops(where,was,is){S.oops.unshift({where,was,is,t:new Date().toISOString().slice(0,10)});$('oopsN').textContent=S.oops.length}

const phaseText={intro:'Arrival',lesson:'Day 1 · The forge',brief:'Dusk · Scouts report',console:'Night · Gatehouse console',siege:'Night · Siege',report:'Morning · Damage report'};
const phaseOf=k=>phaseText[k].replace('Night ·','Night '+S.night+' ·');
function wick(t){$('wick').innerHTML=t}

function render(){
  $('phase').textContent=phaseOf(S.stage);$('oopsN').textContent=S.oops.length;
  drawWards();drawRoads(S.stage==='report'&&S.report?Object.fromEntries(S.report.waves.map(v=>[v.w.id,v.held?'held':'broke'])):null);
  const p=$('pane');
  if(S.stage==='intro'){
    setNight(false);resetDoors();
    p.innerHTML=`<div class="kicker">Duskhold</div><h2>Hold the citadel through the night</h2>
    <p>You are the warden of Duskhold. Every lantern on its walls is one skill from Exam SC-500. Pick a part of the citadel on the left to read its skills.</p>
    <ul class="facts"><li><b>Day</b>: short lessons at the forge, one control at a time.</li><li><b>Night</b>: raiders come. You set real Microsoft controls in the gatehouse console before they reach the walls.</li><li><b>Morning</b>: the damage report shows what held, what broke and why. Wrong turns go to your oopsies.</li></ul>
    <p style="color:var(--mute);font-size:15px">This demo covers one day and one night at the Gatehouse: Conditional Access and MFA. Duskhold is a fictional tenant.</p>
    <div class="next"><button class="btn" id="go">Start day 1</button></div>`;
    $('go').onclick=()=>{S.stage='lesson';S.li=0;S.strike=S.temper=false;S.tries=0;save();render()};
    wick('<b>Wick:</b> I light the lanterns. You keep the raiders out. Unlit lanterns are skills you haven\'t met yet.');
    return;
  }
  if(S.stage==='lesson'){
    setNight(false);
    const l=L[S.li];
    p.innerHTML=`<div class="kicker">Lesson ${S.li+1} of ${L.length} · Gatehouse</div>
    <div class="dots">${L.map((_,i)=>`<i class="${i<S.li?'done':i===S.li?'now':''}"></i>`).join('')}</div>
    <h2>${l.t}</h2><div class="builds">${l.b}</div>
    <ul class="facts">${l.f.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="card ${S.strike?'ok':''}" id="strikeCard"><h4>Strike it from memory</h4><p>${l.s.q}</p>
      <form class="row" id="sf"><input type="text" id="si" autocomplete="off" spellcheck="false" ${S.strike?'disabled value="'+esc(l.s.show)+'"':''} aria-label="Your answer"><button class="btn" ${S.strike?'disabled':''}>Strike</button></form>
      <div class="fb ${S.strike?'good':''}" id="sfb">${S.strike?'Forged.':''}</div></div>
    <div class="card ${S.temper?'ok':''}" id="temperCard" ${S.strike?'':'style="opacity:.45;pointer-events:none"'}><h4>Temper it</h4><p>${l.c.q}</p>
      <div class="opts">${l.c.o.map((o,i)=>`<button class="opt ${S.temper&&i===l.c.r?'right':''}" data-i="${i}" type="button">${o}</button>`).join('')}</div>
      <div class="fb ${S.temper?'good':''}" id="tfb">${S.temper?esc(l.c.why):''}</div></div>
    <div class="next">${S.li>0?'<button class="ghost" id="back" type="button">Back</button>':''}<button class="btn" id="nx" ${S.strike&&S.temper?'':'disabled'}>${S.li===L.length-1?'Finish the day':'Next lesson'}</button></div>`;
    const si=$('si');if(!S.strike)setTimeout(()=>si.focus({preventScroll:true}),30);
    $('sf').onsubmit=e=>{e.preventDefault();if(S.strike)return;const v=si.value;
      if(!v.trim()){$('sfb').textContent='Type your answer first.';$('sfb').className='fb bad';return}
      if(l.s.a.includes(norm(v))){S.strike=true;S.tries=0;
        if(norm(v)!==norm(l.s.show)){$('sfb').textContent=`Forged. The portal writes it as "${l.s.show}".`}
        save();render();return}
      S.tries++;addOops(`Lesson ${S.li+1}: ${l.t}`,v,l.s.show);save();
      const fb=$('sfb');fb.className='fb bad';
      fb.textContent=S.tries===1?`Not quite. It starts with "${l.s.show.slice(0,3)}".`:`It's "${l.s.show}". Type it once to forge it.`;
      si.select();$('oopsN').textContent=S.oops.length;};
    p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.temper)return;const i=+b.dataset.i;
      if(i===l.c.r){S.temper=true;save();render();wick('<b>Wick:</b> '+(S.li===L.length-1?'That\'s the day done. The scouts are back.':'Good. That one holds.'))}
      else{b.classList.add('wrong');addOops(`Lesson ${S.li+1}: ${l.t}`,l.c.o[i],l.c.o[l.c.r]);save();$('oopsN').textContent=S.oops.length;$('tfb').className='fb bad';$('tfb').textContent='Not that one. Read the facts above again and try another.'}});
    $('nx').onclick=()=>{if(S.li<L.length-1){S.li++;S.strike=S.temper=false;S.tries=0}else{S.stage='brief';['ca','mfa'].forEach(x=>{if(!S.studied.includes(x))S.studied.push(x)})}save();render();$('pane').scrollTop=0};
    if($('back'))$('back').onclick=()=>{S.li--;S.strike=S.temper=true;save();render()};
    if(!S.strike&&!S.temper)wick(['<b>Wick:</b> Read the three facts, then type the answer from memory. Typing it is what makes it stick.','<b>Wick:</b> This builds on the spray. A spray brings a password, the gate rule decides what happens next.','<b>Wick:</b> One control, scoped wide. Remember who\'s outside the scope.','<b>Wick:</b> Report-only is how real admins test. It just doesn\'t stop anyone.','<b>Wick:</b> Last one today. Old doors are easy to forget.'][S.li]);
    return;
  }
  if(S.stage==='brief'){
    setNight(false);resetDoors();
    p.innerHTML=`<div class="kicker">Dusk · Night ${S.night}</div><h2>The scouts are back</h2>
    <p>Three groups of raiders are moving on Duskhold. They carry lists of common passwords and will spray them at nightfall.</p>
    <div class="bands">${WAVES.map(w=>`<div class="band"><b>${w.name}</b><span>Spraying ${w.who} ${w.how}${w.app==='legacy'?' (Other clients in the sign-in logs)':''}.</span></div>`).join('')}</div>
    <h3 style="font-size:16px;margin:16px 0 8px;color:var(--ink)">Duskhold tenant</h3>
    <dl class="tenant"><dt>Licence</dt><dd>Microsoft Entra ID P1</dd><dt>Garrison</dt><dd>40 staff, you included</dd><dt>Envoys</dt><dd>6 contractors with member accounts</dd><dt>Emergency access</dt><dd>2 cloud-only break-glass accounts</dd><dt>MFA</dt><dd>Everyone registered during the autumn campaign</dd><dt>Devices</dt><dd>None enrolled in Intune</dd></dl>
    <p style="font-size:15px;color:var(--mute)">One policy already exists, made by the last warden. Check it before nightfall.</p>
    <div class="next"><button class="btn" id="go">Open the gatehouse console</button></div>`;
    $('go').onclick=()=>{S.stage='console';S.edit=null;save();render()};
    wick('<b>Wick:</b> The last warden left in a hurry. I wouldn\'t trust his policy without reading every line.');
    return;
  }
  if(S.stage==='console'){
    setNight(true);resetDoors();
    if(S.edit){renderEditor(p);return}
    p.innerHTML=`<div class="kicker">Night ${S.night} · Gatehouse console</div><div class="crumb">Microsoft Entra admin center › Conditional Access › Policies</div><h2>Policies</h2>
    <div style="margin:14px 0">${S.pol.map(x=>`<div class="pol"><div><div class="nm">${esc(x.name)}</div><div style="font-size:13px;color:var(--mute)">${summary(x)}</div></div><div class="row" style="flex-wrap:nowrap"><span class="state ${x.state}">${{report:'Report-only',on:'On',off:'Off'}[x.state]}</span><button class="ghost" data-e="${x.id}" type="button" style="min-height:36px;padding:5px 12px">Edit</button></div></div>`).join('')||'<p style="color:var(--mute)">No policies yet.</p>'}</div>
    <div class="row"><button class="ghost" id="np" type="button">New policy</button></div>
    <div class="next" style="border-top:1px solid var(--line2);padding-top:16px;margin-top:20px"><button class="btn" id="hold">Hold the night</button></div>`;
    p.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.edit=JSON.parse(JSON.stringify(S.pol.find(x=>x.id===b.dataset.e)));render()});
    $('np').onclick=()=>{S.edit={id:'',name:'',inc:'none',incG:[],excG:[],res:'none',ca:false,apps:[],grant:'grant',ctrl:[],mode:'all',state:'report'};render()};
    $('hold').onclick=siege;
    wick('<b>Wick:</b> Night\'s here. Nothing is enforced until a policy says <b>On</b>.');
    return;
  }
  if(S.stage==='report'){renderReport(p);return}
}

function summary(x){
  const who=x.inc==='all'?'All users':x.inc==='groups'&&x.incG.length?x.incG.map(g=>GROUPS[g]).join(', '):'No users';
  const ex=x.excG.length?' except '+x.excG.map(g=>GROUPS[g]).join(', '):'';
  const what=x.res==='all'?'All resources':x.res==='o365'?'Office 365':'No resources';
  const apps=x.ca?' · Client apps: '+(x.apps.length?x.apps.map(a=>APPN[a]).join(', '):'none'):'';
  const g=x.grant==='block'?'Block access':x.ctrl.length?x.ctrl.map(c=>CTRLN[c]).join(x.mode==='all'?' and ':' or '):'Grant access, no controls';
  return esc(`${who}${ex} · ${what}${apps} · ${g}`);
}
const APPN={browser:'Browser',mobile:'Mobile apps and desktop clients',eas:'Exchange ActiveSync clients',other:'Other clients'};
const CTRLN={mfa:'Require multifactor authentication',compliant:'Require device to be marked as compliant'};

function renderEditor(p){
  const e=S.edit;
  const ck=(name,val,on,label)=>`<label class="ck"><input type="checkbox" name="${name}" value="${val}" ${on?'checked':''}> ${label}</label>`;
  const rd=(name,val,on,label)=>`<label class="ck"><input type="radio" name="${name}" value="${val}" ${on?'checked':''}> ${label}</label>`;
  p.innerHTML=`<div class="crumb">Conditional Access › Policies › ${e.id?'Edit':'New'}</div><h2>${e.id?esc(e.name):'New policy'}</h2>
  <form class="form" id="pf" style="margin-top:14px">
   <fieldset><legend>Name</legend><input type="text" name="name" value="${esc(e.name)}" autocomplete="off" spellcheck="false" placeholder="Type a name" aria-label="Policy name" style="width:100%"></fieldset>
   <fieldset><legend>Users</legend><div class="sub">Include</div>
     ${rd('inc','none',e.inc==='none','None')}${rd('inc','all',e.inc==='all','All users')}${rd('inc','groups',e.inc==='groups','Select users and groups')}
     <div id="incG" style="padding-left:24px;${e.inc==='groups'?'':'display:none'}">${Object.keys(GROUPS).map(g=>ck('incG',g,e.incG.includes(g),GROUPS[g])).join('')}</div>
     ${e.inc==='all'?'<div class="warn"><b>Don\'t lock yourself out!</b> This policy affects every user, you included. Test it on a small group or in Report-only first.</div>':''}
     <div class="sub" style="margin-top:10px">Exclude</div>${Object.keys(GROUPS).map(g=>ck('excG',g,e.excG.includes(g),GROUPS[g])).join('')}</fieldset>
   <fieldset><legend>Target resources</legend>${rd('res','none',e.res==='none','None')}${rd('res','all',e.res==='all','All resources (formerly "All cloud apps")')}${rd('res','o365',e.res==='o365','Select resources: Office 365')}</fieldset>
   <fieldset><legend>Conditions › Client apps</legend><div class="sub">Configure</div>${rd('ca','no',!e.ca,'No (applies to all client apps)')}${rd('ca','yes',e.ca,'Yes')}
     <div style="padding-left:24px;${e.ca?'':'display:none'}"><div class="sub">Modern authentication clients</div>${ck('apps','browser',e.apps.includes('browser'),APPN.browser)}${ck('apps','mobile',e.apps.includes('mobile'),APPN.mobile)}<div class="sub">Legacy authentication clients</div>${ck('apps','eas',e.apps.includes('eas'),APPN.eas)}${ck('apps','other',e.apps.includes('other'),APPN.other)}</div></fieldset>
   <fieldset><legend>Access controls › Grant</legend>${rd('grant','block',e.grant==='block','Block access')}${rd('grant','grant',e.grant==='grant','Grant access')}
     <div style="padding-left:24px;${e.grant==='grant'?'':'display:none'}">${Object.keys(CTRLN).map(c=>ck('ctrl',c,e.ctrl.includes(c),CTRLN[c])).join('')}
     ${e.ctrl.length>1?`<div class="sub">For multiple controls</div>${rd('mode','all',e.mode==='all','Require all the selected controls')}${rd('mode','one',e.mode==='one','Require one of the selected controls')}`:''}</div></fieldset>
   <fieldset><legend>Enable policy</legend><div class="row">${rd('state','report',e.state==='report','Report-only')}${rd('state','on',e.state==='on','On')}${rd('state','off',e.state==='off','Off')}</div></fieldset>
   <div class="err" id="perr"></div>
   <div class="next" style="margin-top:0">${e.id?'<button class="ghost" type="button" id="del">Delete</button>':''}<button class="ghost" type="button" id="cancel">Cancel</button><button class="btn" type="submit">${e.id?'Save':'Create'}</button></div>
  </form>`;
  const f=$('pf');
  const read=()=>{const fd=new FormData(f);e.name=fd.get('name')||'';e.inc=fd.get('inc');e.incG=fd.getAll('incG');e.excG=fd.getAll('excG');e.res=fd.get('res');e.ca=fd.get('ca')==='yes';e.apps=fd.getAll('apps');e.grant=fd.get('grant');e.ctrl=fd.getAll('ctrl');e.mode=fd.get('mode')||e.mode;e.state=fd.get('state')};
  f.addEventListener('change',ev=>{if(ev.target.name==='name')return;read();const y=$('pane').scrollTop;renderEditor(p);$('pane').scrollTop=y});
  f.onsubmit=ev=>{ev.preventDefault();read();
    const err=!e.name.trim()?'Name is required.':e.inc==='groups'&&!e.incG.length?'Select at least one group to include, or choose another option.':e.ca&&!e.apps.length?'Select at least one client app, or set Configure to No.':e.grant==='grant'&&!e.ctrl.length?'Select at least one control, or choose Block access.':'';
    if(err){$('perr').textContent=err;return}
    if(!e.id){e.id='p'+Date.now();S.pol.push(e)}else S.pol=S.pol.map(x=>x.id===e.id?e:x);
    S.edit=null;save();render();wick('<b>Wick:</b> Saved. Read the summary line back. Does it say what you meant?');};
  $('cancel').onclick=()=>{S.edit=null;render()};
  if($('del'))$('del').onclick=()=>{S.pol=S.pol.filter(x=>x.id!==e.id);S.edit=null;save();render()};
  wick(e.id?'<b>Wick:</b> Go through it top to bottom: who, what, which client apps, then what happens, then the state.':'<b>Wick:</b> A new policy starts empty. Every field is a choice you have to make.');
}

function applies(x,u,app){
  const g=USERS[u];
  const inc=x.inc==='all'||(x.inc==='groups'&&x.incG.includes(g));
  if(!inc||x.excG.includes(g)||x.res==='none')return false;
  if(x.ca){const m=app==='legacy'?['other']:['browser'];if(!x.apps.some(a=>m.includes(a)))return false}
  return true;
}
function signIn(u,app,actor){
  const can={mfa:actor==='legit'&&app!=='legacy',compliant:false};
  const out={ok:true,by:[],ro:[]};
  for(const x of S.pol){
    if(x.state==='off'||!applies(x,u,app))continue;
    const blocks=x.grant==='block'||!(x.mode==='one'?x.ctrl.some(c=>can[c]):x.ctrl.every(c=>can[c]));
    if(!blocks)continue;
    if(x.state==='report')out.ro.push(x);else{out.ok=false;out.by.push(x)}
  }
  return out;
}
function evaluate(){
  const waves=WAVES.map(w=>{
    const rs=w.targets.map(u=>signIn(u,w.app,'raider'));
    const held=rs.every(r=>!r.ok);
    let msg;
    if(held){const p=rs[0].by[0];
      msg=p.grant==='block'?`"${p.name}" blocks this outright.`:w.app==='legacy'?`Legacy clients can't do MFA, so "${p.name}" blocked them outright.`:`They had the password for ${w.targets.length} account${w.targets.length>1?'s':''} but couldn't complete MFA. Stopped by "${p.name}".`;}
    else{const ro=rs.flatMap(r=>r.ro)[0];
      if(ro)msg=`"${ro.name}" would have stopped this, but it's in Report-only, which only logs.`;
      else if(w.app==='legacy'&&S.pol.some(x=>x.state==='on'&&x.ca&&x.apps.includes('browser')&&!x.apps.includes('other')))msg='Your MFA policy only covers some client apps, so legacy sign-ins walked past it.';
      else msg=`No policy that is On covers ${w.who} ${w.how}. ${w.targets.length} guessed password${w.targets.length>1?'s':''} got in.`;}
    return {w,held,msg};
  });
  const checks=[];
  const gar=signIn('g9','browser','legit'),env=signIn('e2','browser','legit');
  const lock=[];if(!gar.ok)lock.push('the Garrison');if(!env.ok)lock.push('the Envoys');
  if(lock.length){const why=[...gar.by,...env.by].find(x=>x.grant==='block')?'a Block access policy covers them on normal browser sign-ins':[...gar.by,...env.by].some(x=>x.ctrl.includes('compliant')&&x.mode==='all')?'"Require device to be marked as compliant" can\'t be met: no device in Duskhold is enrolled in Intune':'a control they can\'t meet';checks.push({k:'broke',t:'Locked out',m:`The raiders were stopped, but so were your own people. ${lock.join(' and ')} couldn't sign in, because ${why}.`})}
  const eaIn=S.pol.some(x=>x.state==='on'&&applies(x,'ea1','browser'));
  if(eaIn)checks.push({k:'warnr',t:'Risk',m:'Your emergency access accounts are inside a policy that is On. If that policy ever breaks, nobody can get in. Exclude them.'});
  const legacyBlock=S.pol.some(x=>x.state==='on'&&x.grant==='block'&&x.ca&&x.apps.includes('other')&&x.apps.includes('eas')&&!x.apps.includes('browser')&&!x.apps.includes('mobile')&&(x.inc==='all'));
  const win=waves.every(v=>v.held)&&!lock.length;
  return {waves,checks,legacyBlock,eaIn,win,lock:lock.length>0};
}

function siege(){
  const R=evaluate();S.report=R;S.stage='siege';save();
  $('phase').textContent=phaseOf('siege');
  $('pane').innerHTML=`<div class="kicker">Night ${S.night}</div><h2>The raiders are at the walls</h2><p style="color:var(--mute)">Watch the three roads on the left. Your policies decide what happens now.</p>`;
  wick('<b>Wick:</b> Steady. Your policies are doing the work now, not you.');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  const finish=()=>{S.stage='report';
    if(R.win){['ca','mfa'].forEach(x=>{if(!S.lit.includes(x))S.lit.push(x)})}
    if(!R.win||R.eaIn){R.waves.filter(v=>!v.held).forEach(v=>addOops(`Night ${S.night}: ${v.w.name}`,v.msg,'Every user covered by an MFA policy that is On'));if(R.eaIn)addOops(`Night ${S.night}: emergency access`,'Emergency access accounts inside a policy','Exclude them from every policy');if(R.lock)addOops(`Night ${S.night}: lockout`,'Own users locked out','Only controls your users can meet')}
    save();render();};
  drawRoads(null);
  if(reduce){setTimeout(finish,300);return}
  let done=0;
  R.waves.forEach((v,wi)=>{
    const row=$('r'+v.w.id),mk=row.querySelector('.mk'),rs=row.querySelector('.rs');
    const t0=performance.now()+wi*900,dur=2200;
    const step=now=>{const t=(now-t0)/dur;
      if(t<0){requestAnimationFrame(step);return}
      const k=Math.min(1,t);mk.style.opacity=1;
      mk.style.left=`calc(${(v.held?Math.min(k,.94):k)*100}% - ${k*10}px)`;
      if(t<1){requestAnimationFrame(step);return}
      rs.textContent=v.held?'Held':'Breached';rs.className='rs '+(v.held?'held':'broke');
      if(v.held){mk.style.background='var(--gold)';setTimeout(()=>mk.style.opacity=0,500)}
      else{mk.style.background='var(--red)'}
      if(++done===3)setTimeout(finish,900)};
    requestAnimationFrame(step);
  });
}
function renderReport(p){
  setNight(false);
  const R=S.report;if(!R){S.stage='console';render();return}
  const fol=[];
  fol.push('Reset the guessed passwords for 3 Garrison accounts and 1 Envoy. MFA stopped the raiders at the gate, but they still know those passwords.');
  if(!R.legacyBlock)fol.push('Add a separate "Block legacy authentication" policy for all users (Exchange ActiveSync clients and Other clients, Block access). Then the postern stays shut even if someone narrows the MFA policy later.');
  if(S.pol.some(x=>x.state==='report'))fol.push('A policy is still in Report-only. Check its results in the sign-in logs, then switch it On or delete it.');
  p.innerHTML=`<div class="kicker">Morning after night ${S.night}</div><h2>${R.win?'The citadel held':R.waves.every(v=>v.held)?'Held, but your own people are locked out':'The walls were breached'}</h2>
  <p style="color:var(--mute)">${R.win?'Two lanterns at the Gatehouse are lit: Conditional Access and MFA. Look for the gold dots on the Gatehouse.':'Read why below, fix the console and try the night again. Every wrong turn went to your oopsies.'}</p>
  ${R.waves.map(v=>`<div class="res ${v.held?'held':'broke'}"><span class="tag">${v.held?'Held':'Breached'}</span><div><b>${v.w.name}</b><p>${esc(v.msg)}</p></div></div>`).join('')}
  ${R.checks.map(c=>`<div class="res ${c.k}"><span class="tag">${c.t}</span><div><p style="color:var(--ink)">${esc(c.m)}</p></div></div>`).join('')}
  ${R.legacyBlock?'<div class="res held"><span class="tag">Commended</span><div><b>Postern sealed</b><p>You added a separate legacy block policy. That\'s the baseline real admins use.</p></div></div>':''}
  <h3 style="font-size:16px;margin:18px 0 8px;color:var(--ink)">${R.win?'Before you sleep':'What to fix'}</h3>
  <ul class="list">${(R.win?fol:R.waves.filter(v=>!v.held).map(v=>v.msg).concat(R.lock?['Only use controls your own people can meet.']:[])).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <div class="next"><button class="ghost" id="again" type="button">${R.win?'Replay the night':'Back to the console'}</button>${R.win?'<button class="btn" id="end">What comes next</button>':''}</div>`;
  $('again').onclick=()=>{S.stage='console';S.edit=null;S.night++;save();render()};
  if($('end'))$('end').onclick=()=>{p.innerHTML=`<div class="kicker">End of the demo</div><h2>The rest of the citadel</h2>
    <ul class="facts"><li><b>Gatehouse</b>: PIM, app registrations, consent and managed identities. Raiders: a stolen admin session, a malicious consent request.</li><li><b>Vault</b>: Key Vault. Raiders: a secret leaked in a repo.</li><li><b>Walls</b>: storage, SQL and networking. Raiders: a public blob, open RDP.</li><li><b>Towers</b>: VMs, containers and AI agents. Raiders: a prompt injection on an agent.</li><li><b>Watchtower</b>: Defender for Cloud, Sentinel and Security Copilot. You see the raids coming.</li></ul>
    <div class="next"><button class="ghost" id="bk" type="button">Back to the report</button></div>`;$('bk').onclick=()=>render();wick(`<b>Wick:</b> ${SK.length-S.lit.length} lanterns still dark. One night at a time.`)};
  wick(R.win?'<b>Wick:</b> Two lanterns lit. That\'s two exam skills you can actually do, not just name.':'<b>Wick:</b> Breaches happen. What matters is you know exactly why this one did.');
}

function renderOops(){$('oopsList').innerHTML=S.oops.length?S.oops.map(o=>`<div class="oops"><small>${esc(o.where)} · ${esc(o.t)}</small><div class="was">You: ${esc(o.was)}</div><div class="is">Right: ${esc(o.is)}</div></div>`).join(''):'<p style="color:var(--mute)">No oopsies yet. Wrong answers and breaches land here, ready for practice in Pockle.</p>'}
$('oopsBtn').onclick=()=>{renderOops();$('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false')};
$('closeOops').onclick=()=>{$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true')};
$('resetBtn').onclick=()=>{S=fresh();save();render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('closeOops').click()});
render();
}
</script>
</body>
