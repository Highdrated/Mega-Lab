<!DOCTYPE html>
<html lang="en" data-theme="orbital">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8eaee">
<title>Opsle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a26'/%3E%3Ccircle cx='9' cy='16' r='3' fill='none' stroke='%23e2b85c' stroke-width='2'/%3E%3Ccircle cx='23' cy='9' r='3' fill='none' stroke='%23e2b85c' stroke-width='2'/%3E%3Ccircle cx='23' cy='23' r='3' fill='none' stroke='%23e2b85c' stroke-width='2'/%3E%3Cpath d='M12 15l8-5M12 17l8 5' stroke='%23e2b85c' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root, :root[data-theme="orbital"] {
  --bg: #e8eaee; --panel: #f7f7f4; --panel2: #eef0f2; --line: #d4d7dd; --text: #19202c; --muted: #5f6775;
  --accent: #c99a3b; --accent-ink: #19202c; --good: #3d7a52; --bad: #b4473b; --warn: #a87414;
  --term-bg: #141a26; --term-text: #ece6d2; --term-muted: #8b93a3; --term-accent: #e2b85c;
}
:root[data-theme="verdant"] {
  --bg: #0e1712; --panel: #142019; --panel2: #1a281f; --line: #273b2e; --text: #e3e8df; --muted: #8ea091;
  --accent: #e0a23a; --accent-ink: #1a1206; --good: #86c27f; --bad: #e57a5f; --warn: #e0a23a;
  --term-bg: #09100c; --term-text: #f0e6cc; --term-muted: #7f907f; --term-accent: #e0a23a;
}
:root[data-theme="graphite"] {
  --bg: #111214; --panel: #18191c; --panel2: #1e2024; --line: #2a2c31; --text: #e7e8ea; --muted: #8b8f97;
  --accent: #d8dce3; --accent-ink: #111214; --good: #7fc29b; --bad: #e0796b; --warn: #d6b46a;
  --term-bg: #0b0c0e; --term-text: #e7e8ea; --term-muted: #7a7e86; --term-accent: #c9ced6;
}
:root {
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
.app { max-width: 640px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; gap: 8px; height: 38px; }
.logo { font-family: var(--serif); font-size: 21px; white-space: nowrap; }
.logo i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .14em; text-transform: uppercase; margin-left: 6px; vertical-align: 3px; }
.top .spacer { flex: 1; }
.chipbtn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.rail { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin: 6px 0 14px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.rail b { color: var(--text); font-weight: 600; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.screen { display: none; flex: 1; flex-direction: column; min-width: 0; }
.screen.on { display: flex; }
.sect { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.welcome { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--muted); }
.welcome b { color: var(--text); }
.welcome img { width: 64px; height: 64px; object-fit: contain; }
.list { display: grid; gap: 8px; }
.mis { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 13px 14px; display: grid; gap: 7px; }
.mis .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.mis strong { font-family: var(--serif); font-weight: 500; font-size: 18px; }
.mis .st { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.mis .st.go { color: var(--accent); }
.mis .st.done { color: var(--good); }
.mis p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11px; }
.chain .lb { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); background: var(--panel2); }
.chain .lb.done { border-color: var(--good); color: var(--good); }
.chain .lb.ready { border-color: var(--accent); color: var(--text); }
.chain .ar { color: var(--muted); }
.mis.locked { opacity: .55; }
.back { border: 0; background: none; color: var(--muted); padding: 4px 0; font-family: var(--mono); font-size: 12px; text-align: left; }
.hero h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 6px 0 4px; }
.hero p { margin: 0 0 8px; font-size: 14px; line-height: 1.55; color: var(--muted); }
.hero .res { font-size: 13px; color: var(--text); }
.hero .res b { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 2px; }
.stages { position: relative; display: grid; gap: 0; margin-top: 14px; }
.stage { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.rail2 { display: flex; flex-direction: column; align-items: center; }
.dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); flex: none; }
.stage.ready .dot { border-color: var(--accent); color: var(--text); }
.stage.done .dot { border-color: var(--good); background: var(--good); color: var(--panel); }
.line { flex: 1; width: 2px; background: var(--line); min-height: 14px; }
.stage.done .line { background: var(--good); }
.sbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 10px; min-width: 0; }
.stage.ready .sbox { border-color: var(--accent); }
.stage.locked .sbox { opacity: .6; }
.shead { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; text-align: left; width: 100%; background: none; border: 0; padding: 0; }
.shead strong { font-family: var(--serif); font-weight: 500; font-size: 17px; }
.shead span { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 3px; }
.needs { display: grid; gap: 4px; margin-top: 8px; }
.need { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-family: var(--mono); padding: 6px 9px; border-radius: 8px; background: var(--panel2); text-decoration: none; color: var(--text); }
.need span:last-child { color: var(--bad); white-space: nowrap; }
.need.ok span:last-child { color: var(--good); }
.body { display: none; margin-top: 10px; }
.stage.open .body { display: block; }
.msteps { display: grid; gap: 6px; margin: 6px 0 10px; }
.mstep { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.mstep i { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mstep.on { border-color: var(--good); }
.mstep.on i { background: var(--good); border-color: var(--good); color: var(--panel); }
code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
.mstep code { background: var(--panel); }
.mhint { margin: 6px 0; font-size: 13px; line-height: 1.5; }
.mhint button { border: 1px dashed var(--line); background: none; border-radius: 9px; padding: 8px 12px; font-size: 12px; font-family: var(--mono); color: var(--muted); width: 100%; text-align: left; }
.lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 10px 0 4px; }
pre.ex { margin: 0; background: var(--term-bg); color: var(--term-text); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
.btn { width: 100%; height: 48px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel2); font-weight: 600; margin-top: 10px; }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; }
.links { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 18px; }
.links a, .links button { text-align: center; text-decoration: none; padding: 10px 6px; font-size: 13px; color: var(--text); border-radius: 10px; border: 1px solid var(--line); background: none; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--term-bg); color: var(--term-text); font-size: 13px; padding: 9px 14px; border-radius: 10px; opacity: 0; transition: .25s; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="logo">Opsle<i>ops missions</i></span>
    <span class="spacer"></span>
    <button class="chipbtn" id="themeBtn">orbital</button>
  </div>
  <div class="rail"><span id="rank">Trainee</span><div class="bar"><i id="xpbar"></i></div><span><b id="xp">0</b> xp · <b id="done">0</b>/<b id="total">0</b></span></div>

  <section class="screen on" id="home">
    <div class="welcome"><img src="img/junie/junie-wrench.webp" alt=""><div>Small real jobs that chain your labs together. Each stage opens when you have finished the lessons it needs. You do the work on your <b>Mac</b>; Opsle keeps the plan and the checklist.</div></div>
    <div class="sect"><span>Missions</span><span id="count"></span></div>
    <div class="list" id="list"></div>
    <div class="links">
      <a href="../index.html">Workshop</a>
      <a href="pockle.html">Pockle</a>
      <button id="resetBtn">Reset</button>
    </div>
  </section>

  <section class="screen" id="mission">
    <button class="back" id="backBtn">‹ missions</button>
    <div class="hero" id="hero"></div>
    <div class="stages" id="stages"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const BANKS = [];
const POCKET = { register: b => BANKS.push(b) };
</script>
<!--BANKS-->
<script>
const MISSIONS = __MISSIONS__;
const $ = id => document.getElementById(id);
const KEY = "opsle.v1";
const THEMES = ["orbital", "verdant", "graphite"];
const RANKS = [[0, "Trainee"], [200, "Operator"], [600, "Engineer"], [1200, "Lead"], [2000, "Architect"]];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function getter(k) { const v = lsGet(k); if (v == null) return null; try { return JSON.parse(v); } catch (e) { return v; } }
let S = { xp: 0, theme: "orbital", ticks: {}, stages: {}, done: {} };
try { const r = lsGet(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2000); }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0, 0); }

const BANK = {}, DONE = {};
function scan() {
  for (const b of BANKS) {
    BANK[b.id] = b;
    let d = []; try { d = b.done(getter) || []; } catch (e) {}
    DONE[b.id] = new Set(d);
  }
}
const labName = id => (BANK[id] && BANK[id].name) || id;
const unitName = (lab, u) => { const b = BANK[lab]; const x = b && b.units.find(y => y.id === u); return x ? x.title : u; };
const needMet = n => !!(DONE[n.lab] && DONE[n.lab].has(n.unit));
const skey = (m, i) => m.id + ":" + i;
function stageState(m, i) {
  if (S.stages[skey(m, i)]) return "done";
  if (i > 0 && !S.stages[skey(m, i - 1)]) return "locked";
  return m.stages[i].needs.every(needMet) ? "ready" : "locked";
}
function missionState(m) {
  const n = m.stages.filter((_, i) => S.stages[skey(m, i)]).length;
  if (n === m.stages.length) return "done";
  return stageState(m, n) === "ready" ? "ready" : "locked";
}

function setTheme(t) { S.theme = t; document.documentElement.dataset.theme = t; $("themeBtn").textContent = t; document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(); save(); }
$("themeBtn").onclick = () => setTheme(THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length]);
function rail() {
  let r = RANKS[0], nx = null; RANKS.forEach((x, i) => { if (S.xp >= x[0]) { r = x; nx = RANKS[i + 1] || null; } });
  $("rank").textContent = r[1]; $("xp").textContent = S.xp;
  $("xpbar").style.width = nx ? Math.round((S.xp - r[0]) / (nx[0] - r[0]) * 100) + "%" : "100%";
  $("done").textContent = MISSIONS.filter(m => missionState(m) === "done").length; $("total").textContent = MISSIONS.length;
}

function chainHtml(m) {
  return '<div class="chain">' + m.stages.map((s, i) => '<span class="lb ' + stageState(m, i) + '">' + esc(labName(s.lab)) + "</span>").join('<span class="ar">›</span>') + "</div>";
}
function paintHome() {
  scan(); rail();
  const ready = MISSIONS.filter(m => missionState(m) === "ready").length;
  $("count").textContent = ready ? ready + " ready" : "";
  $("list").innerHTML = MISSIONS.map((m, i) => {
    const st = missionState(m), n = m.stages.filter((_, j) => S.stages[skey(m, j)]).length;
    const lbl = st === "done" ? "done" : st === "ready" ? (n ? "continue" : "start") : "locked";
    return '<button class="mis ' + (st === "locked" ? "locked" : "") + '" data-i="' + i + '"><div class="h"><strong>' + esc(m.title) + '</strong><span class="st ' + (st === "done" ? "done" : st === "ready" ? "go" : "") + '">' + lbl + " · " + n + "/" + m.stages.length + "</span></div><p>" + inl(m.story) + "</p>" + chainHtml(m) + "</button>";
  }).join("");
  $("list").querySelectorAll(".mis").forEach(b => b.onclick = () => openMission(+b.dataset.i));
}

let CUR = null, OPEN = -1;
function openMission(i) {
  CUR = i; const m = MISSIONS[i];
  const first = m.stages.findIndex((_, j) => stageState(m, j) !== "done");
  OPEN = first;
  show("mission"); paintMission();
}
function paintMission() {
  scan(); rail();
  const m = MISSIONS[CUR];
  $("hero").innerHTML = '<h2>' + esc(m.title) + '</h2><p>' + inl(m.story) + '</p><div class="res"><b>you end up with</b>' + inl(m.result) + "</div>";
  $("stages").innerHTML = m.stages.map((s, i) => {
    const st = stageState(m, i), k = skey(m, i);
    const ticks = S.ticks[k] || [];
    const needs = s.needs.map(n => {
      const b = BANK[n.lab];
      return '<a class="need ' + (needMet(n) ? "ok" : "") + '" href="' + esc(b ? b.href : "#") + '"><span>' + esc(labName(n.lab)) + " · " + esc(unitName(n.lab, n.unit)) + "</span><span>" + (needMet(n) ? "learned" : "not yet") + "</span></a>";
    }).join("");
    const all = s.steps.every((_, j) => ticks[j]);
    return '<div class="stage ' + st + (i === OPEN ? " open" : "") + '" data-i="' + i + '"><div class="rail2"><div class="dot">' + (st === "done" ? "ok" : i + 1) + '</div>' + (i < m.stages.length - 1 ? '<div class="line"></div>' : "") + '</div>'
      + '<div class="sbox"><button class="shead"><strong>' + esc(s.title) + '</strong><span>' + esc(labName(s.lab)) + '</span></button><div class="sub">' + esc(s.where) + "</div>"
      + (st === "locked" ? '<div class="needs">' + needs + "</div>" + (i > 0 && !S.stages[skey(m, i - 1)] ? '<div class="sub" style="margin-top:6px">finish the stage above first</div>' : "") : "")
      + '<div class="body">' + (st !== "locked" ? '<div class="needs">' + needs + "</div>" : "")
      + '<div class="msteps">' + s.steps.map((t, j) => '<button class="mstep' + (ticks[j] || st === "done" ? " on" : "") + '" data-j="' + j + '"' + (st === "locked" ? " disabled" : "") + '><i>' + (ticks[j] || st === "done" ? "ok" : j + 1) + "</i><span>" + inl(t) + "</span></button>").join("") + "</div>"
      + (s.hints || []).map((h, j) => '<div class="mhint" data-h="' + j + '"><button>Hint ' + (j + 1) + "</button></div>").join("")
      + '<div class="lbl">you should see</div><pre class="ex">' + esc(s.expect) + "</pre>"
      + (st === "done" ? "" : '<button class="btn main sdone"' + (st === "ready" && all ? "" : " disabled") + ">" + (st === "locked" ? "Locked" : all ? "Stage done · +60 xp" : "Tick every step") + "</button>")
      + "</div></div></div>";
  }).join("");
  $("stages").querySelectorAll(".stage").forEach(el => {
    const i = +el.dataset.i, k = skey(m, i), s = m.stages[i];
    el.querySelector(".shead").onclick = () => { OPEN = OPEN === i ? -1 : i; paintMission(); };
    el.querySelectorAll(".mstep").forEach(b => b.onclick = () => { if (stageState(m, i) !== "ready") return; const t = S.ticks[k] = S.ticks[k] || []; t[+b.dataset.j] = !t[+b.dataset.j]; save(); paintMission(); });
    el.querySelectorAll(".mhint").forEach(h => h.querySelector("button").onclick = () => { h.innerHTML = inl(s.hints[+h.dataset.h]); });
    const d = el.querySelector(".sdone");
    if (d) d.onclick = () => {
      S.stages[k] = true; S.xp += 60;
      let msg = "Stage done. +60 xp";
      if (missionState(m) === "done" && !S.done[m.id]) { S.done[m.id] = true; S.xp += 100; msg = "Mission complete. +160 xp"; }
      save(); toast(msg); OPEN = i + 1 < m.stages.length ? i + 1 : -1; paintMission();
    };
  });
}
$("backBtn").onclick = () => { paintHome(); show("home"); };
$("resetBtn").onclick = () => { if (confirm("Reset Opsle missions and xp? Lab progress stays.")) { S = { xp: 0, theme: S.theme, ticks: {}, stages: {}, done: {} }; save(); paintHome(); } };
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if ($("home").classList.contains("on")) paintHome(); else paintMission(); } });
setTheme(THEMES.includes(S.theme) ? S.theme : "orbital");
paintHome();
</script>
</body>
</html>
