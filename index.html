<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workshop">
<title>Workshop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/launcher.css">
</head>
<body>

<div class="scene" id="scene">

  <svg class="contours" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M0 120 C 150 80, 250 160, 400 120 S 650 60, 900 110"/>
    <path d="M0 170 C 140 130, 260 210, 410 170 S 660 110, 900 160"/>
    <path d="M0 220 C 130 180, 270 260, 420 220 S 670 160, 900 210"/>
    <path d="M0 300 C 120 250, 280 340, 430 300 S 680 240, 900 290"/>
    <path d="M0 380 C 110 330, 290 420, 440 380 S 690 320, 900 370"/>
    <path d="M0 450 C 100 400, 300 490, 450 450 S 700 390, 900 440"/>
    <path d="M0 520 C 90 470, 310 560, 460 520 S 710 460, 900 510"/>
    <path d="M0 590 C 80 540, 320 630, 470 590 S 720 530, 900 580"/>
    <path d="M0 40 C 160 10, 240 90, 390 50 S 640 0, 900 40"/>
  </svg>

  <div class="hud-corner hud-tl">workshop // launcher</div>
  <div class="hud-corner hud-tr">signal <span class="bright" id="signal">stable</span><span class="signal-bars"><span></span><span></span><span></span></span></div>
  <div class="theme-toggle" id="themeToggle">
    <button data-theme="void">Void</button>
    <button data-theme="orbital">Orbital</button>
  </div>
  <div class="hud-corner hud-bl">local instance — offline capable</div>
  <div class="hud-corner hud-br"><span class="bright" id="nodeCount">0</span> rooms online</div>

  <div class="left">
    <div class="title-block">
      <p class="eyebrow">select a room</p>
      <h1>The Workshop</h1>
      <div class="rule"></div>
      <p>A private instance. Each room is a separate lab, isolated on load.</p>
    </div>
    <div class="rooms" id="rooms"></div>
    <div class="data-tools">
      <button id="exportBtn" title="Save all lab progress to a file">Export progress</button>
      <label for="importFile" title="Restore progress from a file">Import<input type="file" id="importFile" accept="application/json"></label>
    </div>
  </div>

  <div class="right">
    <svg class="orbit" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet">
      <g class="ticks" id="ticks"></g>
      <circle class="ring ring-inner" cx="450" cy="310" r="90"/>
      <circle class="ring ring-mid" cx="450" cy="310" r="160"/>
      <circle class="ring ring-outer" cx="450" cy="310" r="230"/>
      <g class="core">
        <circle class="pulse" cx="450" cy="310" r="6"/>
        <circle class="dot" cx="450" cy="310" r="3.5"/>
      </g>
      <g id="markers"></g>
    </svg>
  </div>

  <div class="opened" id="opened">
    <div class="init">
      <p class="eyebrow">room locked</p>
      <p class="opened-title" id="openedTitle"></p>
      <div class="row"><span>category</span><span class="val" id="openedTag"></span></div>
      <div class="row"><span>isolation</span><span class="val ok">sandboxed</span></div>
      <div class="row"><span>state</span><span class="val" id="openedState">initialising</span></div>
      <div class="bar"></div>
      <button class="back" id="backBtn">← Release lock</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <button class="release" id="releaseBtn">← Workshop</button>
    <iframe id="labFrame" title="Active lab"></iframe>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/labs.config.js"></script>
<script src="js/launcher.js"></script>
</body>
</html>
